<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tile Runner">
<meta name="theme-color" content="#0d0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Tile Runner</title>
<style>
  :root {
    --bg:        #0d0b1a;
    --panel:     #17142b;
    --grid-line: #221d40;
    --ink:       #e8e6ff;
    --dim:       #6f68a8;
    --accent:    #ff4d6d;
    --track:     #ffcf4d;   /* beam body */
    --track-lo:  #b8892a;   /* beam underside / shade */
    --rail:      #fff2c4;   /* running surface highlight */
    --free:      #b9b3ff;   /* freed / draggable tile */
    --runner:    #4dd6ff;
    --goal:      #7dff6b;
    --wall:      #3a2a55;
    --shadow:    #05040d;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:"Courier New", ui-monospace, monospace;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  #app {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { text-align:center; padding:10px 0 6px; width:100%; }
  header h1 {
    font-size:22px; font-weight:900; letter-spacing:4px; text-transform:uppercase; color:var(--track);
    text-shadow: 2px 0 var(--shadow), -2px 0 var(--shadow), 0 2px var(--shadow), 0 -2px var(--shadow), 2px 2px var(--accent);
  }
  #hud {
    display:flex; gap:12px; align-items:center; justify-content:center;
    margin-top:8px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--dim);
  }
  #hud b { color:var(--ink); }
  #ov-stars { font-size:30px; letter-spacing:8px; margin-bottom:10px; color:var(--track); min-height:34px; }
  /* LEVEL CLEAR: big stars up top, then a white score breakdown that stacks up line-by-line */
  #overlay.win #ov-stars { font-size:64px; letter-spacing:12px; line-height:1; margin:0 0 18px; min-height:64px; color:#ffd24a;
    text-shadow:0 3px 0 rgba(120,86,0,0.55), 0 6px 14px rgba(5,4,13,0.6); }
  #ov-score { display:flex; flex-direction:column; gap:5px; margin:2px auto 20px; max-width:230px; }
  #ov-score .ov-ln { display:flex; justify-content:space-between; gap:24px; color:#fff; font-size:15px;
    letter-spacing:1px; text-transform:uppercase; opacity:0; transform:translateY(7px);
    transition:opacity .26s ease, transform .26s ease; }
  #ov-score .ov-ln span:last-child { font-weight:900; }
  #ov-score .ov-ln.show { opacity:1; transform:none; }
  #ov-score .ov-total { font-size:23px; font-weight:900; color:#fff; margin-top:7px; padding-top:9px;
    border-top:2px solid rgba(255,255,255,0.25); }
  #ov-score .ov-best { justify-content:center; color:var(--goal); font-size:12px; margin-top:6px; }
  #overlay.lose #ov-score { display:none; }
  #pauseFloat {
    position:fixed; z-index:15; padding:0; cursor:pointer;
    top:calc(env(safe-area-inset-top) + 12px); right:calc(env(safe-area-inset-right) + 12px);
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; gap:5px;
    background:rgba(23,20,43,0.72); border:2px solid var(--grid-line); box-shadow:2px 2px 0 var(--shadow);
  }
  #pauseFloat span { width:4px; height:16px; background:var(--ink); border-radius:1px; }
  #pauseFloat:active { transform:translate(2px,2px); box-shadow:none; }
  #mechpop {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(5,4,13,0.86); z-index:35; padding:24px;
  }
  #mechpop.show { display:flex; }
  .mech-card {
    max-width:300px; text-align:center; background:var(--panel);
    border:3px solid var(--grid-line); box-shadow:5px 5px 0 var(--shadow); padding:20px 22px 18px;
  }
  .mech-tag { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--accent); font-weight:900; }
  #mech-icon { width:112px; height:112px; margin:8px auto 4px; display:block; }
  .mech-card h3 { font-size:18px; letter-spacing:2px; text-transform:uppercase; color:var(--track); margin:2px 0 8px; }
  .mech-card p { font-size:13px; line-height:1.6; color:var(--ink); margin-bottom:16px; }
  .mech-card button { width:100%; }
  /* the "speed up" popup styled like the death screen: 3D extruded header, no icon/tag */
  #mechpop.speed .mech-card { max-width:340px; }
  #mechpop.speed .mech-tag, #mechpop.speed #mech-icon { display:none; }
  #mechpop.speed #mech-name {
    font-size:40px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
    transform:rotate(-4deg); line-height:1.05; margin:8px 0 18px; color:#ffd24a;
    text-shadow:1px 1px 0 #c79320, 2px 2px 0 #a87b17, 3px 3px 0 #8a6310, 4px 4px 0 #6b4c0b, 5px 6px 10px rgba(5,4,13,0.65); }
  #mechpop.speed .mech-card p { font-size:18px; line-height:1.5; color:#fff1ea; margin-bottom:22px; }
  #ready { color:var(--free); }
  #board-wrap { flex:1; width:100%; display:flex; align-items:stretch; justify-content:center; min-height:0; overflow:hidden; }
  canvas { image-rendering:pixelated; touch-action:none; display:block; }
  footer { padding:10px 0 16px; display:flex; gap:12px; }
  button {
    font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:2px; font-size:12px;
    color:var(--ink); background:var(--panel); border:3px solid var(--grid-line);
    box-shadow:3px 3px 0 var(--shadow); padding:11px 16px; cursor:pointer; touch-action:manipulation;
  }
  button:active { transform:translate(3px,3px); box-shadow:none; }
  #overlay {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:radial-gradient(ellipse 76% 56% at 50% 46%, rgba(5,4,13,0.52) 0%, rgba(5,4,13,0.42) 45%, rgba(5,4,13,0.10) 100%);
    z-index:20; text-align:center; padding:24px;
  }
  #overlay.show { display:flex; }
  #overlay .card { max-width:340px; }
  /* big, bold, 3D-extruded like the title header (just smaller) */
  #overlay h2 { font-size:46px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
    margin-bottom:16px; transform:rotate(-4deg); line-height:1.05; }
  #overlay p { font-size:13px; line-height:1.7; color:var(--dim); margin-bottom:20px; letter-spacing:1px; }
  #overlay.win h2 { color:#8dff78;
    text-shadow:1px 1px 0 #3a8a45, 2px 2px 0 #2f7439, 3px 3px 0 #256030, 4px 4px 0 #1c4c26, 5px 6px 10px rgba(5,4,13,0.65); }
  #overlay.lose h2 { color:#ff8f74; margin-bottom:15px;
    text-shadow:1px 1px 0 #c24a34, 2px 2px 0 #a83b2a, 3px 3px 0 #8a2f21, 4px 4px 0 #6b2318, 5px 6px 10px rgba(5,4,13,0.65); }
  /* death screen: tighten heading↔byline, bigger/brighter byline, larger retry button */
  #overlay.lose #ov-stars { min-height:0; margin-bottom:0; }
  #overlay.lose p { font-size:19px; line-height:1.5; color:#fff1ea; margin-bottom:26px; }
  /* NEXT LEVEL button matches the death-screen RETRY button */
  #overlay.lose #ov-btn, #overlay.win #ov-btn { font-size:17px; padding:16px 40px; }

  /* "Add to Home Screen" prompt (mobile browsers only) */
  #a2hs {
    position:fixed; left:12px; right:12px; bottom:14px; z-index:28;
    display:none; align-items:center; gap:11px;
    background:var(--panel); border:3px solid var(--grid-line);
    box-shadow:4px 4px 0 var(--shadow); padding:11px 12px 11px 13px;
  }
  #a2hs.show { display:flex; animation:a2hsIn .34s ease-out; }
  @keyframes a2hsIn { from { transform:translateY(26px); opacity:0; } to { transform:none; opacity:1; } }
  #a2hs-ic { flex:none; color:var(--track); display:flex; align-items:center; }
  #a2hs-ic svg { display:block; }
  #a2hs-txt { flex:1; font-size:11.5px; line-height:1.55; letter-spacing:.4px; color:var(--ink); text-transform:none; }
  #a2hs-txt b { color:var(--track); font-weight:900; }
  #a2hs .a2hs-acts { flex:none; display:flex; flex-direction:column; gap:6px; }
  #a2hs .a2hs-acts button { padding:8px 10px; font-size:10px; letter-spacing:1px; box-shadow:2px 2px 0 var(--shadow); }
  #a2hs .a2hs-x { background:transparent; border-color:transparent; box-shadow:none; color:var(--dim); padding:6px 8px; }
  #a2hs .a2hs-x:active { transform:none; }

  /* colorblind-friendly palette (Okabe–Ito) */
  .cb { --accent:#d55e00; --goal:#009e73; --runner:#56b4e9; }

  #menu {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:radial-gradient(ellipse 84% 70% at 50% 50%, rgba(5,4,13,0.58) 0%, rgba(5,4,13,0.48) 48%, rgba(5,4,13,0.14) 100%);
    z-index:30; padding:22px; overflow:auto;
  }
  #menu.show { display:flex; }
  .menu-card { width:100%; max-width:330px; text-align:center; }
  .menu-ver { font-size:10px; letter-spacing:2px; color:var(--dim); margin-top:14px; opacity:0.7; }
  .menu-card h2 { font-size:24px; letter-spacing:3px; text-transform:uppercase; color:var(--track);
    text-shadow:2px 2px var(--shadow); margin-bottom:16px; }
  #menu-body { display:flex; flex-direction:column; gap:9px; }
  #menu-body button { width:100%; }
  .menu-sub { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dim);
    margin:10px 0 2px; }
  .toggle { display:flex; justify-content:space-between; align-items:center;
    border:3px solid var(--grid-line); background:var(--panel); box-shadow:3px 3px 0 var(--shadow);
    padding:10px 14px; font-family:inherit; font-weight:900; text-transform:uppercase;
    letter-spacing:2px; font-size:12px; color:var(--ink); cursor:pointer; }
  .toggle .val { color:var(--track); }
  .toggle.off .val { color:var(--dim); }
  .lvl-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .lvl-grid button { display:flex; flex-direction:column; gap:3px; padding:12px 0; line-height:1.1; }
  .lvl-grid .st { font-size:11px; color:var(--track); letter-spacing:1px; }
  .lvl-grid .st.none { color:var(--dim); }

  #editbar { position:fixed; left:0; right:0; bottom:0; z-index:25; display:none;
    flex-direction:column; gap:6px; padding:8px; background:rgba(13,11,26,0.94);
    border-top:3px solid var(--grid-line); }
  #editbar.show { display:flex; }
  #edtools, #edactions { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; }
  #editbar button { padding:8px 9px; font-size:10px; letter-spacing:1px; box-shadow:2px 2px 0 var(--shadow); }
  #editbar button.sel { background:var(--track); color:var(--shadow); border-color:var(--track); }
  #edcode { width:100%; height:44px; resize:none; font-family:inherit; font-size:10px;
    background:var(--panel); color:var(--ink); border:2px solid var(--grid-line); padding:6px; }
</style>
</head>
<body>
<div id="app">
  <div id="board-wrap"><canvas id="game"></canvas></div>
  <button id="pauseFloat" aria-label="Menu"><span></span><span></span></button>
</div>

<div id="menu">
  <div class="menu-card">
    <h2 id="menu-title">Tile&nbsp;Runner</h2>
    <div id="menu-body"></div>
  </div>
</div>

<div id="a2hs" role="dialog" aria-label="Add Tile Runner to your home screen">
  <div id="a2hs-ic"></div>
  <div id="a2hs-txt"></div>
  <div class="a2hs-acts">
    <button id="a2hs-install" style="display:none">Install</button>
    <button id="a2hs-close" class="a2hs-x">Not now</button>
  </div>
</div>

<div id="editbar">
  <div id="edtools"></div>
  <div id="edactions"></div>
  <textarea id="edcode" placeholder="Share code — Export writes it here; paste one and Import to load."></textarea>
</div>

<div id="mechpop">
  <div class="mech-card">
    <div class="mech-tag">New!</div>
    <canvas id="mech-icon" width="112" height="112"></canvas>
    <h3 id="mech-name"></h3>
    <p id="mech-desc"></p>
    <button id="mech-ok">Got it</button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div id="ov-stars"></div>
    <h2 id="ov-title">Level Clear</h2>
    <div id="ov-score"></div>
    <p id="ov-msg"></p>
    <button id="ov-btn">Continue</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- Levels ------------------------------------------------------
  let COLS = 7, ROWS = 13;                   // per-level board size (set in beginLevel)
  const FULL_COLS = 7, FULL_ROWS = 13;       // the maximum board (editor / procedural modes)
  // --- TEST LEVEL: breaking stone is REQUIRED to reach the goal -----------
  // Three full-width barriers span the grid; the ONLY opening in each is a
  // stone tile, so the runner physically cannot advance without smashing it.
  // Verified by BFS: solvable when the stones can be broken, and impossible
  // if they were treated as unbreakable walls. The forced route passes over
  // all three stones ([3,8] and [1,5] before the key, [4,2] after) on the
  // way to the key and the exit.
  // 50-level campaign: each new mechanic is introduced on its own level (see `intro`).
  const LEVELS = [
{"start":[1,6],"goal":[1,0],"init":[[1,5],[1,4]],"walls":[],"cols":3,"rows":7,"intro":["recycle"]},
    {"start":[0,5],"goal":[4,2],"init":[[0,4],[0,3]],"walls":[],"cols":5,"rows":6,"intro":["turn"]},
    {"start":[0,0],"goal":[5,7],"init":[[0,1],[0,2]],"walls":[],"cols":6,"rows":8,"intro":["offscreen"]},
    {"start":[0,6],"goal":[2,0],"init":[[0,5],[0,4]],"walls":[[0,3],[1,3],[2,3],[4,3]],"cols":5,"rows":7,"intro":["wall"]},
    {"start":[0,10],"goal":[2,0],"init":[[0,9],[0,8]],"walls":[[0,7],[1,7],[2,7],[4,7],[0,4],[2,4],[3,4],[4,4],[0,1],[1,1],[2,1],[4,1]],"cols":5,"rows":11,"intro":[]},
    {"start":[0,0],"goal":[0,6],"init":[[1,0],[2,0]],"walls":[[0,3],[1,3],[2,3],[3,3],[2,1],[2,2],[2,4],[2,5]],"cols":5,"rows":7,"intro":[]}
              ];

  // ---------- DOM ---------------------------------------------------------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const elLevel = document.getElementById("level");
  const elReady = document.getElementById("ready");
  const elKey = document.getElementById("keystate");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ov-title");
  const ovMsg = document.getElementById("ov-msg");
  const ovBtn = document.getElementById("ov-btn");
  const elScore = document.getElementById("score");
  const ovStars = document.getElementById("ov-stars");
  const ovScore = document.getElementById("ov-score");

  // ---------- Tunables ----------------------------------------------------
  const TILES_TOTAL = 3;
  const GRACE_MS = 2600;
  const MIN_CELL = 78, MAX_CELL = 170;
  const VIEW_COLS = 4.2, VIEW_ROWS = 6;
  const CAM_LERP = 0.009;
  const TRACK_T = 0.44;        // platform thickness as fraction of cell (hangs below centre)
  const SAMPLE_D = 0.42;       // tangent smoothing window (path-param units)
  const FALL_G = 0.0022, FALL_MS = 850;   // gravity fall on lose

  // ---------- Sound engine ------------------------------------------------
  // A tiny Web Audio synth + backing band. Every cleared tile is one BEAT: the
  // runner moves at a constant ms-per-cell, so clears land at a perfectly even
  // cadence. Each beat plays the next note of a looping MELODY and, locked to
  // that same instant, a bass note, a soft kick, and an off-beat hi-hat; each
  // bar (4 beats) also (re)starts a sustained chord PAD. Because every beat is
  // anchored to a real tile event and the between-beat hat is scheduled on the
  // audio clock, the whole arrangement stays in sync with the tiles with no
  // drift, and its tempo tracks each level's speed. Resets each level.
  const Sound = (() => {
    const BASE = 220;                          // A3, in Hz
    const WAVES  = ["triangle", "square"];     // lead timbre alternates per step
    // Lead melody + chord loop — regenerated per level by setSong(seed).
    let MELODY = [0, 4, 7, 4,  9, 7, 4, 2,  0, 4, 7, 12,  9, 7, 4, 2];
    let CHORDS = [ {root:0,tones:[0,4,7]}, {root:5,tones:[5,9,12]}, {root:9,tones:[9,12,16]}, {root:7,tones:[7,11,14]} ];
    let ac = null, master = null, sendBus = null, noiseBuf = null;
    let muted = false, step = 0, beatSec = 1.15;

    // pick a fresh pentatonic melody + chord progression from a seed (each level differs)
    function setSong(seed) {
      const rnd = mulberry32((seed>>>0) || 1);
      const SC = [0,2,4,7,9,12,14];            // major pentatonic over ~2 octaves
      const tr = [-5,-3,0,0,2,4,5,7][Math.floor(rnd()*8)];   // transpose (key)
      MELODY = []; let d = 2 + Math.floor(rnd()*3);
      for (let i=0;i<16;i++){ d += Math.floor(rnd()*3)-1; if (rnd()<0.15) d += Math.floor(rnd()*3)-1;
        d = Math.max(0, Math.min(SC.length-1, d)); MELODY.push(SC[d] + tr); }
      const progs = [[0,5,7,5],[0,7,9,7],[0,5,9,7],[0,9,5,7],[0,4,5,7]];
      CHORDS = progs[Math.floor(rnd()*progs.length)].map(r => ({ root:r+tr, tones:[r+tr, r+tr+4, r+tr+7] }));
    }

    function ensure() {
      if (ac) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.16;
      master.connect(ac.destination);
      // Damped feedback delay = a ringing echo tail so tones resonate.
      const delay = ac.createDelay(1.0); delay.delayTime.value = 0.24;
      const fb    = ac.createGain();     fb.gain.value = 0.34;      // echo regeneration
      const damp  = ac.createBiquadFilter(); damp.type = "lowpass"; damp.frequency.value = 2400;
      const wet   = ac.createGain();     wet.gain.value = 0.30;     // echo level into mix
      delay.connect(damp); damp.connect(fb); fb.connect(delay);     // feedback loop, softened
      delay.connect(wet);  wet.connect(master);
      sendBus = delay;                                              // tonal voices feed the echo
      // A short noise buffer reused for the hi-hat.
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.2), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    }
    // Must be triggered from a user gesture so iOS/Safari unlocks audio.
    function unlock() {
      if (!ensure()) return;
      if (ac.state !== "running") ac.resume();
      // iOS needs an actual sound started inside the gesture to fully wake the context
      try {
        const b = ac.createBufferSource();
        b.buffer = ac.createBuffer(1, 1, ac.sampleRate);
        b.connect(ac.destination); b.start(0);
      } catch (_) {}
    }
    // iOS suspends the audio context when the app is backgrounded / the phone locks — wake it on return
    if (typeof document !== "undefined") {
      const wake = () => { if (ac && ac.state !== "running") ac.resume(); };
      document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
      window.addEventListener("focus", wake);
      window.addEventListener("pageshow", wake);
    }
    // A tonal voice: two detuned oscillators through a long-release envelope,
    // started at absolute time `t`. Optionally fed into the resonant echo tail.
    function voice(t, semi, wave, dur, vel, attack, wet) {
      const freq = BASE * Math.pow(2, semi / 12);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vel, t + attack);       // attack
      g.gain.exponentialRampToValueAtTime(0.0006, t + dur);       // release / ring-out
      for (const cents of [-6, 6]) {                              // detuned pair = fuller tone
        const o = ac.createOscillator();
        o.type = wave;
        o.frequency.setValueAtTime(freq, t);
        o.detune.setValueAtTime(cents, t);
        o.connect(g);
        o.start(t); o.stop(t + dur + 0.05);
      }
      g.connect(master); if (wet) g.connect(sendBus);
    }
    // Percussion: a short pitched-down sine thump on the beat.
    function kick(t, vel) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(130, t);
      o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vel, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0006, t + 0.16);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.2);
    }
    // Deep bass voice: a sub sine + a triangle body an octave up, through a lowpass so it
    // stays warm and thick. A short downward pitch glide gives each note punch.
    function bass(t, semi, dur, vel) {
      const freq = BASE * Math.pow(2, semi / 12);
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 340; lp.Q.value = 0.9;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vel, t + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      const sub = ac.createOscillator(); sub.type = "sine";
      sub.frequency.setValueAtTime(freq * 1.5, t);
      sub.frequency.exponentialRampToValueAtTime(freq, t + 0.06);     // punchy drop into the note

  function drawEditor(){

  // ---------- Level-start intro (pixels assemble into the character) ------
  const INTRO_CONVERGE = 950, INTRO_FLASH = 2000;
  function startIntro() {
    const s = state; s.status = "intro"; s.introT = 0; s.introSnd = { gather:false, flash:false };
    const rp = visualAt(0);                        // where the character forms (start tile)
    s.introTarget = { x: rp.x, y: rp.y };
    s.introParticles = [];
    const N = 90, reach = Math.max(viewW, viewH);
    for (let i = 0; i < N; i++) {
      const ang = Math.random()*Math.PI*2, dist = reach*(0.55 + Math.random()*0.6);
      s.introParticles.push({
        x0: rp.x + Math.cos(ang)*dist, y0: rp.y + Math.sin(ang)*dist,
        sz: cell*(0.05 + Math.random()*0.07),
        col: Math.random() < 0.7 ? getVar("--runner") : "#ffffff",
      });
    }
  }
  function tickIntro(dt) {
    const s = state;
    if (!s.introSnd.gather) { s.introSnd.gather = true; Sound.introGather(); }  // plays once the intro runs (audio unlocked)
    const before = s.introT; s.introT += dt;
    if (before < INTRO_CONVERGE && s.introT >= INTRO_CONVERGE && !s.introSnd.flash) { s.introSnd.flash = true; Sound.introFlash(); }
    if (s.introT >= INTRO_CONVERGE + INTRO_FLASH) { s.status = "play"; s.introParticles = null; }
  }
  function drawIntro(ts) {
    const s = state, t = s.introT, tgt = s.introTarget;
    if (t < INTRO_CONVERGE) {                       // pixels stream in from all around
      const u = t / INTRO_CONVERGE, e = 1 - Math.pow(1-u, 3);   // ease-out
      for (const p of s.introParticles) {
        const px = p.x0 + (tgt.x - p.x0)*e, py = p.y0 + (tgt.y - p.y0)*e, sz = p.sz*(1 - u*0.4);
        ctx.globalAlpha = 0.35 + 0.65*u; ctx.fillStyle = p.col;

  // ---------- Layout + camera --------------------------------------------
  function computeLayout() {
    const wrap = document.getElementById("board-wrap");
    viewW = Math.floor(wrap.clientWidth);
    viewH = Math.floor(wrap.clientHeight);
    cell = Math.round(clamp(Math.min(viewW / VIEW_COLS, viewH / VIEW_ROWS), MIN_CELL, MAX_CELL) * 0.9);
    worldW = cell * COLS; worldH = cell * ROWS;
    TOP_PAD = Math.round(Math.min(viewW, viewH) * 0.13);   // clears the pause / speed UI at the top
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = viewW * dpr; canvas.height = viewH * dpr;
    canvas.style.width = viewW + "px"; canvas.style.height = viewH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wallLayerDirty = true;                      // cell/world size changed — rebuild wall + grain caches
    grainScreen = null;
  }

  const nodeCenter = n => ({ x:(n.c + 0.5) * cell, y:(n.r + 0.5) * cell });
  function pathPos(param) {
    const p = state.path, len = p.length;
    const f = clamp(param, 0, len - 1), i = Math.floor(f);
    if (i >= len - 1) return nodeCenter(p[len - 1]);
    const fr = f - i, a = nodeCenter(p[i]), b = nodeCenter(p[i + 1]);
    return { x:a.x + (b.x - a.x) * fr, y:a.y + (b.y - a.y) * fr };
  }
  // runner frame: centre point, tangent (travel dir), normal (surface "up"),
  // and the surface point the runner's feet rest on
  function runnerInfo() {
    const param = state.runIdx + state.runT;
    const pos = visualAt(param);                     // follows the curved surface
    const a = visualAt(param - 0.08), b = visualAt(param + 0.08);
    let tx = b.x - a.x, ty = b.y - a.y;
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const nx = ty, ny = -tx;                 // left-normal = surface side
    return { x:pos.x, y:pos.y, tx, ty, nx, ny,
             sx:pos.x, sy:pos.y,
             angle:Math.atan2(ty, tx) };
  }

  // ---- visual path: node-to-node motion with corner tiles rounded ---------
  const axisDir = (from, to) => ({ x: Math.sign(to.c - from.c), y: Math.sign(to.r - from.r) });

  // the top-surface points of one tile: straight (3 pts) or a quarter-circle arc
  function tileSurface(n, prev, next) {
    const C = nodeCenter(n), h = cell/2;
    let entry = prev ? axisDir(n, prev) : null;   // toward prev
    let exit  = next ? axisDir(n, next) : null;    // toward next
    if (!entry && !exit) { entry = { x:-1, y:0 }; exit = { x:1, y:0 }; }
    else if (!entry)     { entry = { x:-exit.x, y:-exit.y }; }
    else if (!exit)      { exit  = { x:-entry.x, y:-entry.y }; }
    const Me = { x:C.x + entry.x*h, y:C.y + entry.y*h };
    const Mx = { x:C.x + exit.x*h,  y:C.y + exit.y*h };
    if (entry.x === -exit.x && entry.y === -exit.y) return [Me, { x:C.x, y:C.y }, Mx];  // straight
    // corner: quarter circle centred on the shared cell corner, radius h
    const O = { x:C.x + (entry.x+exit.x)*h, y:C.y + (entry.y+exit.y)*h };
    let a0 = Math.atan2(Me.y-O.y, Me.x-O.x), a1 = Math.atan2(Mx.y-O.y, Mx.x-O.x);
    let d = a1 - a0; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI;
    const N = 12, pts = [];
    for (let k = 0; k <= N; k++) { const a = a0 + d*(k/N); pts.push({ x:O.x + h*Math.cos(a), y:O.y + h*Math.sin(a) }); }
    return pts;
  }
  function samplePolyline(pts, u) {
    if (pts.length === 1) return pts[0];
    let total = 0; const seg = [];
    for (let k = 0; k < pts.length-1; k++) { const d = Math.hypot(pts[k+1].x-pts[k].x, pts[k+1].y-pts[k].y); seg.push(d); total += d; }
    let target = clamp(u,0,1) * total;
    for (let k = 0; k < seg.length; k++) {
      if (target <= seg[k] || k === seg.length-1) { const t = seg[k] ? target/seg[k] : 0;
        return { x:pts[k].x + (pts[k+1].x-pts[k].x)*t, y:pts[k].y + (pts[k+1].y-pts[k].y)*t }; }
      target -= seg[k];
    }
    return pts[pts.length-1];
  }
  const surfaceAtTile = (i, u) => samplePolyline(tileSurface(state.path[i], state.path[i-1], state.path[i+1]), u);
  // position along the whole route at fractional node index `param`
  function visualAt(param) {
    const len = state.path.length;
    const f = clamp(param, 0, len-0.5);              // allow the leading tile to run out to its far edge
    let i = clamp(Math.round(f), 0, len-1);
    return surfaceAtTile(i, (f - i) + 0.5);          // each tile spans param [i-0.5, i+0.5]
  }

  // vertical camera: keep the followed point in the region BELOW the top UI (padded), so
  // the runner and the track ahead never sit under the pause / speed readout.
  function camClampY(py) {
    const safeH = viewH - TOP_PAD;
    if (worldH <= safeH) return -TOP_PAD - (safeH - worldH) / 2;   // whole level fits — pin it below the UI
    return clamp(py - (viewH + TOP_PAD) / 2, -TOP_PAD, worldH - viewH);
  }
  function camTarget() {
    const p = visualAt(state.runIdx + state.runT);
    const tx = worldW <= viewW ? (worldW - viewW) / 2 : clamp(p.x - viewW/2, 0, worldW - viewW);
    return { tx, ty: camClampY(p.y) };
  }
  function snapCamera() { const t = camTarget(); camX = t.tx; camY = t.ty; }
  // camera top-left that centres a given world point (respecting the top padding)
  function camForPoint(px, py) {
    const tx = worldW <= viewW ? (worldW - viewW) / 2 : clamp(px - viewW/2, 0, worldW - viewW);
    return { x: tx, y: camClampY(py) };
  }
  function updateCamera(dt) {
    if (state.status !== "play") return;      // freeze during fall / overlays / cam-pan / intro
    const t = camTarget(), k = Math.min(1, dt * CAM_LERP);
    camX += (t.tx - camX) * k; camY += (t.ty - camY) * k;
  }
  // opening fly-in: hold on the off-screen flag, glide to the runner's start, then form the runner
  function tickCamPan(dt) {
    const p = state.pan; if (!p) { startIntro(); return; }
    p.t += dt;
    if (p.t < p.hold) { camX = p.from.x; camY = p.from.y; return; }   // beat on the flag
    const u = Math.min(1, (p.t - p.hold) / p.dur);
    const e = u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2)/2;            // ease in-out
    camX = p.from.x + (p.to.x - p.from.x)*e;
    camY = p.from.y + (p.to.y - p.from.y)*e;
    if (u >= 1) { camX = p.to.x; camY = p.to.y; state.pan = null; startIntro(); }
  }

  const cx = c => c * cell, cy = r => r * cell;
  const cellAtWorld = (wx, wy) => ({ c: Math.floor(wx / cell), r: Math.floor(wy / cell) });

  // ---------- Occupancy / targets ----------------------------------------
  function head() { return state.path[state.path.length - 1]; }
  // ---- occupancy, cached ----
  // occupiedFor() used to rebuild a full Set (walls + every tile + stones + …) on
  // EVERY call — and it's called each frame by the junction glyph and, while dragging,
  // by the drop-ghost. That scan (with a key() string per tile/wall) was the drag hitch.
  // The "static" part (walls, stones, crumbled cells, parked/free tiles) only changes
  // when a tile moves or a stone breaks, so we build it once and reuse it until marked
  // dirty. The genuinely per-frame parts (doors easing open, moving hazards, sliders)
  // are layered on top of a cheap copy.
  let occDirty = true, _occStatic = null, _occStaticKey = -2;
  function markOccDirty() { occDirty = true; }
  function buildStaticOcc(dragId) {
    const occ = new Set(state.walls);
    for (const sk of state.stones.keys()) occ.add(sk);        // intact stone blocks placement
    for (const ck of state.crumbled) occ.add(ck);             // cells that have crumbled away
    for (const t of state.tiles) { if (t.id === dragId) continue; if (t.status === "spent") continue; occ.add(key(t.c, t.r)); }
    return occ;
  }
  function occupiedFor(dragTile) {
    const dragId = dragTile ? dragTile.id : -1;
    if (occDirty || _occStaticKey !== dragId || !_occStatic) {
      _occStatic = buildStaticOcc(dragId); _occStaticKey = dragId; occDirty = false;
    }
    const occ = new Set(_occStatic);                          // cheap copy of the cached static layer
    for (const d of state.doors) if (!d.open) occ.add(key(d.c, d.r));                 // closed colored doors
    for (const grp of state.gateGroups) if (grp.openT < 0.85) occ.add(grp.doorKey);  // sliding door still closed
    for (const h of state.hazards) occ.add(key(h.cc, h.cr));  // a hazard's current cell
    for (const sl of (state.sliders||[])) {                    // slider band = wall, except the platform's cell
      const cur = Math.round(sl.pos);
      if (sl.axis === "h") { for (let c=sl.lo;c<=sl.hi;c++) if (c!==cur) occ.add(key(c, sl.r)); }
      else                 { for (let r=sl.lo;r<=sl.hi;r++) if (r!==cur) occ.add(key(sl.c, r)); }
    }
    for (const b of (state.blocks||[])) {                      // the movable block occupies just its current cell
      const cur = Math.round(b.pos);
      occ.add(b.axis === "h" ? key(cur, b.r) : key(b.c, cur));
    }
    for (const md of (state.manualDoors||[]))                  // manual door blocks until BOTH panels are drawn apart
      if (!(md.left >= 0.999 && md.right >= 0.999)) occ.add(key(md.c, md.r));
    // exit is always open now — no primary key required (coloured keys only gate their doors)
    return occ;
  }

  // tap a stone tile to smash it (opens the cell for a path tile)
  function breakStone(c, r) {
    const st = state.stones.get(key(c, r));
    if (!st) return;
    st.hp -= 1; st.hit = 1;                          // register a tap; deeper crack (see drawStone)
    haptic(st.hp > 0 ? 10 : 18);
    const wx = (c + 0.5) * cell, wy = (r + 0.5) * cell;
    if (st.hp > 0) {                                 // chip it — a few shards, a small knock
      Sound.clearTile ? Sound.clearTile() : Sound.smash();
      state.shake = Math.max(state.shake, cell * 0.07);
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + (bgHash(c + i, r) % 100) / 60, sp = cell * 0.0011;
        state.shards.push({ x:wx, y:wy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - cell*0.0006,
          life:0, max:240, sz: cell*0.05*(0.6 + (i % 3)*0.2) });
      }
      return;
    }
    // final tap — shatter
    state.stones.delete(key(c, r));
    markOccDirty();                            // a stone opened up — occupancy changed
    Sound.smash();
    state.shake = Math.max(state.shake, cell * 0.16);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + (bgHash(c + i, r) % 100) / 60;
      const sp = cell * (0.0016 + (bgHash(c, r + i) % 100) / 100000);
      state.shards.push({ x:wx + (Math.cos(a))*cell*0.15, y:wy + (Math.sin(a))*cell*0.15,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - cell*0.0008,
        life:0, max:360 + (i % 6)*40, sz: cell*0.07*(0.6 + (i % 4)*0.2) });
    }
  }
  // tap an arcade button; when every button in its group is pressed, its door slides open
  function tapSwitch(c, r) {
    for (const grp of state.gateGroups) {
      const sw = grp.switches.find(s => !s.used && s.c === c && s.r === r);
      if (!sw) continue;
      sw.used = true;
      spawnPop(c, r, grp.color); Sound.smash(); haptic(14);
      if (grp.switches.every(s => s.used)) {          // all buttons pressed -> open the door
        state.shake = Math.max(state.shake, cell*0.12);
        spawnPop(grp.door.c, grp.door.r, grp.color);
      } else { state.shake = Math.max(state.shake, cell*0.05); }
      return true;
    }
    return false;
  }
  function updateShards(dt) {
    if (!state || !state.shards.length) return;
    for (const p of state.shards) { p.life += dt; p.vy += 0.0018*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
    state.shards = state.shards.filter(p => p.life < p.max);
  }
  function drawShards() {
    for (const p of state.shards) {
      ctx.globalAlpha = Math.max(0, 1 - p.life/p.max);
      ctx.fillStyle = "#8a8478";
      ctx.fillRect(Math.round(p.x - p.sz/2), Math.round(p.y - p.sz/2), Math.ceil(p.sz), Math.ceil(p.sz));
    }
    ctx.globalAlpha = 1;
  }
  // a bright ring of light pulsing outward from a cleared tile (additive glow)
  function drawLights() {
    if (!state.lights || !state.lights.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of state.lights) {
      const k = p.life / p.max;                 // 0..1
      const rad = cell * (0.25 + k * 1.3);
      const fade = (1 - k) * (1 - k);           // ease-out fade
      // soft radial bloom
      const g = ctx.createRadialGradient(p.x, p.y, rad*0.2, p.x, p.y, rad);
      g.addColorStop(0, "rgba(255,248,220," + (0.42*fade) + ")");
      g.addColorStop(0.6, "rgba(255,224,160," + (0.24*fade) + ")");
      g.addColorStop(1, "rgba(255,224,160,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI*2); ctx.fill();
      // crisp expanding ring
      ctx.globalAlpha = 0.9 * fade;
      ctx.strokeStyle = "#fff7d6"; ctx.lineWidth = Math.max(1.5, cell*0.05*(1-k));
      ctx.beginPath(); ctx.arc(p.x, p.y, rad*0.9, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
  // expanding-ring "pop" pulses (tile placed, coin grabbed, …)
  function drawPops() {
    if (!state.pops) return;
    for (const p of state.pops) {
      const k = p.life / p.max;
      ctx.globalAlpha = (1 - k) * 0.85;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = Math.max(2, cell*0.05*(1-k));
      ctx.beginPath(); ctx.arc(p.x, p.y, cell*(0.18 + k*0.55), 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // floating "×N" combo tag above the runner
  function drawCombo() {
    const s = state;
    if (s.combo < 2 || s.status !== "play") return;
    const ri = runnerInfo();
    const size = Math.round(cell * 0.52 * (1 + s.comboFlash * 0.5));   // bigger
    const x = ri.sx, y = ri.sy - cell*1.1, txt = "×" + s.combo;
    if (!grainPattern) buildPaper();
    ctx.save();
    ctx.font = "900 " + size + "px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // soft drop shadow lifts it off the background (no hard outline)
    ctx.shadowColor = "rgba(5,4,13,0.6)"; ctx.shadowBlur = Math.max(4, size*0.18);
    ctx.shadowOffsetX = size*0.05; ctx.shadowOffsetY = size*0.10;
    ctx.fillStyle = curTrack(); ctx.fillText(txt, x, y);              // colour fill (casts the shadow)
    ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    if (grainPattern) { ctx.globalAlpha = 0.55; ctx.fillStyle = grainPattern; ctx.fillText(txt, x, y); ctx.globalAlpha = 1; }  // paper texture on the glyphs
    ctx.restore();
  }
  // Every in-bounds unoccupied cell is a legal drop now (free placement).
  function validTargets(dragTile) {
    const occ = occupiedFor(dragTile), out = [];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (!occ.has(key(c, r))) out.push({ c, r });
    return out;
  }
  // The unoccupied in-bounds cell nearest to (c, r) — where a dropped tile lands.
  function nearestFreeCell(dragTile, c, r) {
    const occ = occupiedFor(dragTile);
    let best = null, bestD = Infinity;
    for (let rr = 0; rr < ROWS; rr++)
      for (let cc = 0; cc < COLS; cc++) {
        if (occ.has(key(cc, rr))) continue;
        const d = (cc - c) * (cc - c) + (rr - r) * (rr - r);
        if (d < bestD) { bestD = d; best = { c: cc, r: rr }; }
      }
    return best;
  }
  // Drop a tile: it snaps to the nearest empty cell and PARKS there (not yet on
  // the path). If that lands it next to the track's front it links immediately.
  function dropTileOn(tile, c, r) {
    if (state.status !== "play" || tile.status === "active") return false;
    const pos = nearestFreeCell(tile, c, r);
    if (!pos) return false;                 // grid completely full (shouldn't happen)
    tile.c = pos.c; tile.r = pos.r; tile.status = "parked";
    markOccDirty();                          // a tile moved — occupancy changed
    state.stall = 0; state.lastPlacedId = tile.id;
    spawnPop(pos.c, pos.r);                  // placement pop
    linkParkedTiles();                      // connect now if it's beside the front
    updateReadyHud();
    return true;
  }

  // Pull any parked tile that touches the track's front into the path, chaining
  // along connected parked tiles. Freed (walked-over) tiles are left alone, so
  // the runner never links backward onto ground it already covered.
  // A link would make the runner "double back" if the new cell sits orthogonally
  // beside a live path segment the runner is still on or heading toward (other than
  // the head it attaches to). Blocking these keeps the runner from ever instantly
  // turning around and running backwards alongside its own track.
  function foldsBack(c, r) {
    const p = state.path;
    const recent = state.runIdx - 1;           // cells still on, or just behind, the runner
    for (let i = 0; i < p.length - 1; i++) {   // every node except the head
      const n = p[i];
      // (1) don't re-enter a cell the runner is on or recently left — that's an instant U-turn.
      //     Cells cleared long ago are fair game again (and their junction arrows show).
      if (i >= recent && n.c === c && n.r === r) return true;
      // (2) don't run parallel to still-live track ahead of the runner (prevents forks).
      if (!n.exited && i >= state.runIdx &&
          Math.abs(n.c - c) + Math.abs(n.r - r) === 1) return true;
    }
    return false;
  }
  function linkParkedTiles() {
    const s = state;
    let linked = false, guard = 0;
    while (guard++ < s.tiles.length + 2) {
      const h = head();
      const t = s.tiles.find(t => t.status === "parked" && adjacent([t.c, t.r], [h.c, h.r]) && !foldsBack(t.c, t.r));
      if (!t) break;
      t.status = "active";
      s.path.push({ c: t.c, r: t.r, kind: "tile", tileId: t.id });
      linked = true;
    }
    if (linked) updateReadyHud();
  }

  // ---------- Runner logic ------------------------------------------------
  function update(dt) {
    if (state.status !== "play") return;
    const s = state;
    s.runPhase += dt / 110;                 // legs animate while running
    s.elapsed += dt;                        // level clock (for time bonus / stars)
    // the flag snaps down and plants itself once a tile is laid on the exit cell
    const planted = s.path.some(n => n.kind === "tile" && n.c === s.goal.c && n.r === s.goal.r);
    s.flagPlantT += ((planted ? 1 : 0) - s.flagPlantT) * Math.min(1, dt/70);
    // sliding doors ease open once all their linked switches are pressed
    for (const grp of s.gateGroups) {
      const open = grp.switches.every(w => w.used);
      grp.openT += ((open ? 1 : 0) - grp.openT) * Math.min(1, dt/120);
    }
    // stone hit-flash decays
    for (const st of s.stones.values()) if (st.hit > 0) st.hit = Math.max(0, st.hit - dt/180);
    // timed speed effect from a collected boost / slow pickup (see collectKey)
    let factor = 1;
    if (s.speedFx.t > 0) {
      s.speedFx.t -= dt;
      if (s.speedFx.kind === "boost") factor *= BOOST_MULT;
      else if (s.speedFx.kind === "slow") factor *= SLOW_MULT;
      if (s.speedFx.t <= 0) { s.speedFx.kind = null; s.speedFx.t = 0; }
    }
    // fixed pace for now — no within-level combo speed-up (was: 1 + min(combo*0.01, 0.5))
    const comboSpeed = 1;
    factor *= comboSpeed;
    s.speedMult = comboSpeed;                 // for the live speed readout
    s.liveFactor = factor;                     // includes boost/slow zone + combo, for the readout
    s.runT += (dt / s.msPerCell) * factor;
    while (s.runT >= 1 && s.runIdx + 1 < s.path.length) {
      s.runT -= 1;
      s.runIdx++;
      const now = s.path[s.runIdx];
      if (now.c === s.goal.c && now.r === s.goal.r) { s.runT = 0; endWin(); return; }
    }
    freeClearedTiles();
    collectKey();
    linkParkedTiles();      // connect any staged tile that now touches the front
    // no tile ahead: the runner keeps going to the edge of the last tile, then falls off.
    // (visual position across the tile u = runT + 0.5, so the 80% mark is runT = 0.3)
    if (s.runIdx + 1 >= s.path.length) {
      if (zen) { if (s.runT > 0.3) s.runT = 0.3; return; }   // zen: glide to the 80% mark and wait for track
      if (s.runT >= 0.5) { startFall(); return; }
    }
  }

  // undo the most recent placement (if the runner hasn't reached it yet)
  function undoLast() {
    const s = state;
    if (s.status !== "play" || s.lastPlacedId == null) return;
    const t = s.tiles[s.lastPlacedId];
    if (!t) return;
    const h = s.path[s.path.length - 1];
    if (h.kind === "tile" && h.tileId === t.id && s.runIdx < s.path.length - 1) {
      s.path.pop(); t.status = "free";       // pop it off the front, back into the pool
    } else if (t.status === "parked") {
      t.status = "free";                     // un-stage a parked tile
    } else { return; }
    s.lastPlacedId = null;
    markOccDirty();                            // occupancy changed
    spawnPop(t.c, t.r, "#ff6d6d");
    updateReadyHud();
  }

  // the runner grabs the key by passing over its cell
  function collectKey() {
    const s = state;
    const rp = visualAt(s.runIdx + s.runT);
    const near = (c, r) => Math.hypot(rp.x-(c+0.5)*cell, rp.y-(r+0.5)*cell) < cell*0.7;
    const nearTight = (c, r) => Math.hypot(rp.x-(c+0.5)*cell, rp.y-(r+0.5)*cell) < cell*0.3;  // boost/slow: must nearly overlap
    // coins: grabbed by passing over them
    for (const ck of Array.from(s.coinCells)) {
      const [c, r] = ck.split(",").map(Number);
      if (near(c, r)) { s.coinCells.delete(ck); s.coinsGot++; s.score = computeScore(); updateScoreHud();
                        spawnPop(c, r, "#ffd24a"); Sound.coin(); haptic(6); }
    }
    // boost / slow pickups: grabbed by passing over them → a time-limited speed effect
    for (const bk of Array.from(s.boost)) {
      const [c, r] = bk.split(",").map(Number);
      if (nearTight(c, r)) { s.boost.delete(bk); s.speedFx = { kind:"boost", t:BOOST_MS };
                        spawnPop(c, r, pal("boost")); spawnLight(c, r); (Sound.boost||Sound.coin)(); haptic(12); }
    }
    for (const bk of Array.from(s.slow)) {
      const [c, r] = bk.split(",").map(Number);
      if (nearTight(c, r)) { s.slow.delete(bk); s.speedFx = { kind:"slow", t:SLOW_MS };
                        spawnPop(c, r, pal("slow")); (Sound.slow||Sound.coin)(); haptic(12); }
    }
    // colored keys: each opens all doors of its colour; exit unlocks when ALL are held
    if (!s.keyCollected) {
      for (const k of s.keys) if (!k.got && near(k.c, k.r)) {
        k.got = true; spawnPop(k.c, k.r, k.color); haptic(10); Sound.key();
        for (const d of s.doors) if (d.color === k.color) d.open = true;
      }
      if (s.keys.every(k => k.got)) { s.keyCollected = true; updateKeyHud(); }
    }
    // doors keep their lock marker until the runner physically passes through them
    for (const d of s.doors) if (!d.reached && near(d.c, d.r)) d.reached = true;
  }

  // A tile becomes draggable the moment the runner crosses out of its cell
  // (i.e. past its centre-to-next midpoint), not when it reaches the next tile.
  function freeClearedTiles() {
    const s = state, param = s.runIdx + s.runT;
    let changed = false;
    for (let i = 0; i < s.path.length; i++) {
      const node = s.path[i];
      if (node.kind !== "tile" || node.exited) continue;   // per-node, so re-placed tiles are unaffected
      if (param > i + 0.5) {
        node.exited = true;                                 // this placement is done
        Sound.clearTile();                                  // play a tone as the tile clears
        spawnLight(node.c, node.r);                         // burst of light from the cleared tile
        scoreClear(i);                                      // score, combo, juice on the beat
        if (node.tileId != null) {
          const t = s.tiles[node.tileId];
          if (t) {
            if (s.crumble.has(key(node.c, node.r))) {       // fragile floor: tile is consumed
              t.status = "spent"; t.c = -1; t.r = -1;
              s.crumbled.add(key(node.c, node.r));
              s.shake = Math.max(s.shake, cell * 0.12);
            } else {
              t.status = "free";
            }
            changed = true;
          }
        }
      }
    }
    if (changed) { markOccDirty(); updateReadyHud(); }   // a tile freed/consumed — occupancy changed
  }

  // Award points for a cleared tile and drive the beat-combo + feedback.
  function scoreClear(clearedIdx) {
    const s = state;
    s.combo++;                       // the combo IS the running score's core (final combo length)
    if (s.combo > s.maxCombo) s.maxCombo = s.combo;
    // track "flow" clears (a healthy buffer of track ahead) for the star rating
    let ahead = 0;
    for (let j = clearedIdx + 1; j < s.path.length; j++)
      if (s.path[j].kind === "tile" && !s.path[j].exited) ahead++;
    if (ahead >= 2) s.flowClears++;
    s.score = computeScore();
    updateScoreHud();
    s.beatPulse = 1;                 // pulse the visuals on the beat
    s.comboFlash = 1;
    haptic(6);
  }

  function startFall() {
    const ri = runnerInfo();
    state.status = "falling";
    state.combo = 0;                 // the run ends — combo breaks
    state.shake = Math.max(state.shake, cell * 0.10);
    Sound.fall();                    // descending whistle as the runner tumbles
    haptic(60);
    state.drag = null;
    const spd = cell / state.msPerCell;            // the runner's forward speed (px/ms)
    state.fall = { x:ri.sx, y:ri.sy, angle:ri.angle,
                   vx:ri.tx * spd, vy:ri.ty * spd,  // run off the edge, then gravity takes over
                   va:(ri.tx >= 0 ? 1 : -1) * 0.004, t:0 };
  }
  function tickFall(dt) {
    const f = state.fall;
    f.t += dt; f.vy += FALL_G * dt;
    f.x += f.vx * dt; f.y += f.vy * dt; f.angle += f.va * dt;
    if (f.t >= FALL_MS) showLose();
  }
  // Reveal the LEVEL CLEAR score one white line at a time, then the final total.
  let winAnimToken = 0;
  function animateWinScore(rows, total, bestText) {
    const myToken = ++winAnimToken;
    ovScore.innerHTML = "";
    const mkLine = (label, val, cls) => {
      const d = document.createElement("div"); d.className = "ov-ln" + (cls ? " " + cls : "");
      d.innerHTML = "<span>" + label + "</span><span>" + val + "</span>";
      ovScore.appendChild(d); return d;
    };
    const els = rows.map(([label, val]) => mkLine(label, val));
    let i = 0;
    const step = () => {
      if (myToken !== winAnimToken) return;                 // a newer level started — abort
      if (i < els.length) { els[i].classList.add("show"); i++; setTimeout(step, 430); return; }
      const totalEl = mkLine("Score", total, "ov-total");    // …then the final score
      requestAnimationFrame(() => totalEl.classList.add("show"));
      if (bestText) { const b = mkLine("", bestText, "ov-best");
        setTimeout(() => { if (myToken === winAnimToken) b.classList.add("show"); }, 220); }
    };
    setTimeout(step, 320);
  }
  function endWin() {
    state.status = "win";
    // final score = final combo length + coin bonus − number of attempts
    const finalCombo = state.combo, coinBonus = state.coinsGot * COIN_BONUS, att = state.attempts || 1;
    state.score = computeScore();
    updateScoreHud();
    let stars = 1;                                     // finishing earns one
    if (state.elapsed < state.par) stars++;            // under par time
    const flowRatio = state.flowClears / (state.maxCombo || 1);
    if (flowRatio >= 0.6) stars++;                     // kept tiles staged ahead (skillful flow)
    let bestLine = "";
    if (mode === "normal") {                           // only built-in levels persist a best
      const best = loadBest(), keyId = "L" + levelIdx;
      const prev = best[keyId] || { score:0, stars:0 };
      const isBest = state.score > prev.score;
      best[keyId] = { score: Math.max(prev.score, state.score), stars: Math.max(prev.stars, stars) };
      saveBest(best);
      bestLine = (isBest ? "New best!  " : "Best  ") + best[keyId].score;
    }
    Sound.win();
    haptic([12, 40, 12]);
    ovStars.textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
    overlay.className = "win show";
    const last = mode === "normal" && levelIdx >= LEVELS.length - 1;
    ovTitle.textContent = mode === "endless" ? "Level " + endlessN + " Clear"
                        : mode === "daily"   ? "Daily Done!"
                        : last ? "You Win!" : "Level Clear";
    ovMsg.innerHTML = "";
    const rows = [["Combo", "+" + finalCombo]];
    if (coinBonus) rows.push(["Coins", "+" + coinBonus]);
    rows.push(["Tries", "−" + att]);
    animateWinScore(rows, state.score, bestLine);
    ovBtn.textContent = mode === "endless" ? "Next (Endless)"
                      : mode === "daily"   ? "Menu"
                      : last ? "Play Again" : "Next Level";
  }
  const LOSE_QUIPS = [
    "Gravity: still undefeated.",
    "That's not a shortcut, that's a cliff.",
    "You'd like a word with HR about job safety.",
    "Bold strategy — laying track behind yourself.",
    "You had ONE job. It was the floor.",
    "You ran out of ground and options.",
    "Tiles are reusable. So are second chances.",
    "The floor is lava. Also, missing.",
    "Somewhere, a tile is feeling unused.",
    "Speedrunning… into the void.",
    "You trusted gravity. Rookie mistake.",
    "Great pace! Shame about the ending.",

    "You filed a complaint. It fell through.",
    "Physics 1, You 0.",
    "So close. So very, very not close.",
    "You're fine. You always land on your… nope.",
    "A for effort, F for flooring.",
    "The abyss says thanks for the snack.",
  ];
  const LOSE_TITLES = ["You Fell", "Wipeout!", "Splat.", "Down You Go", "Ouch.", "Gap Year"];
  // shown on the "speed up" popup — a jab at the player's odds of keeping up
  const SPEED_QUIPS = [
    "Good luck keeping up. You'll need it.",
    "The runner just got faster. You? We'll see.",
    "Hope those thumbs are warmed up.",
    "Statistically, you're about to lose track. Literally.",
    "Faster now. Your reflexes remain… optimistic.",
    "Blink and it's over. So maybe don't.",
    "Try to keep up. No promises expected.",
    "The runner believes in you. The runner is naive.",
    "Speed up! Your odds just went down.",
    "This is the part where you start sweating.",
  ];
  let _lastQuip = -1;
  function showLose() {
    state.status = "lose";
    winAnimToken++; ovScore.innerHTML = "";   // cancel any pending win-score reveal
    ovStars.textContent = "";
    overlay.className = "lose show";
    let i = (Math.random() * LOSE_QUIPS.length) | 0;
    if (i === _lastQuip) i = (i + 1) % LOSE_QUIPS.length;   // avoid repeating the last quip
    _lastQuip = i;
    ovTitle.textContent = LOSE_TITLES[(Math.random() * LOSE_TITLES.length) | 0];
    ovMsg.textContent = LOSE_QUIPS[i];
    ovBtn.textContent = "Retry";
    Sound.death();                  // a short sad jingle on the death screen
  }

  // ---------- Rendering ---------------------------------------------------
  function draw(ts) {
    drawBackground(ts);                       // parallax procedural backdrop (screen space)
    // pause / win / death: show ONLY the level background (a clean replica) behind the card
    const menuOpen = menuEl && menuEl.classList.contains("show");
    if (state.status === "win" || state.status === "lose" || menuOpen) return;
    const sh = state.shake || 0;
    const shx = sh ? (Math.random()*2-1)*sh : 0, shy = sh ? (Math.random()*2-1)*sh : 0;
    ctx.save();
    ctx.translate(-Math.round(camX - shx), -Math.round(camY - shy));

    if (wallLayerDirty) buildWallLayer();
    if (wallLayer) ctx.drawImage(wallLayer, 0, 0, worldW, worldH);   // whole static wall layer, one blit
    for (const [sk, st] of state.stones) {
      const [c, r] = sk.split(",").map(Number);
      drawStone(c, r, ts, st);
    }

    drawBarriers(ts);
    drawSliders(ts);
    drawBlocks(ts);
    drawManualDoors(ts);
    drawTrack(ts);
    if (state.drag) drawTargets(ts);
    for (const t of state.tiles)
      if ((t.status === "free" || t.status === "parked") && (!state.drag || state.drag.tile.id !== t.id))
        drawFreeTile(cx(t.c), cy(t.r), ts, false);

    drawPickups(ts);
    drawShards();
    drawPops();
    drawLights();
    if (state.status === "intro") drawIntro(ts);
    else if (state.status === "campan") { /* runner not formed yet — flag fly-in */ }
    else drawRunner(ts);
    drawCombo();
    drawHazards(ts);

    if (state.drag) {
      const d = state.drag;
      drawFreeTile(d.sx + camX - d.grabDX, d.sy + camY - d.grabDY, ts, true);
    }
    ctx.restore();

    // off-screen indicators (screen space): key (until collected) + exit
    if (state.status === "play" || state.status === "falling") {
      if (!state.keyCollected)
        for (const k of state.keys) if (!k.got)
          drawOffscreenArrow((k.c+0.5)*cell, (k.r+0.5)*cell, k.color, "key");
      drawOffscreenArrow((state.goal.c+0.5)*cell, (state.goal.r+0.5)*cell, "#ffffff", "flag");   // white flag
    }
    drawSpeedHud();
  }

  // live runner speed, top-left (screen space). Shown as cells/second on a dark pill.
  function drawSpeedHud() {
    const s = state;
    if (!s || (s.status !== "play" && s.status !== "falling")) return;
    const factor = s.liveFactor != null ? s.liveFactor : 1;
    const cps = 1000 * factor / (s.msPerCell || 1000);      // cells per second
    const m = Math.round(Math.min(viewW, viewH) * 0.028);
    const fs = Math.max(15, Math.round(Math.min(viewW, viewH) * 0.045));
    ctx.save();
    ctx.textBaseline = "middle";
    const label = "SPEED", val = cps.toFixed(2), unit = " tiles/s";   // two decimals + unit
    const smallF = "700 " + Math.round(fs*0.52) + "px 'Courier New', monospace";
    const bigF   = "900 " + fs + "px 'Courier New', monospace";
    ctx.font = smallF; const lw = ctx.measureText(label).width;
    ctx.font = bigF;   const vw = ctx.measureText(val).width;
    ctx.font = smallF; const uw = ctx.measureText(unit).width;
    const padX = Math.round(fs*0.55), gap = Math.round(fs*0.4);
    const boxW = padX*2 + lw + gap + vw + uw, boxH = Math.round(fs*1.5);
    // pill
    rrect(m, m, boxW, boxH, boxH*0.32);
    ctx.fillStyle = "rgba(10,8,22,0.62)"; ctx.fill();
    ctx.lineWidth = Math.max(1, fs*0.05); ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.stroke();
    const midY = m + boxH/2;
    ctx.textAlign = "left";
    ctx.font = smallF;
    ctx.fillStyle = "rgba(214,218,240,0.78)";
    ctx.fillText(label, m + padX, midY + 1);
    ctx.font = bigF;
    ctx.fillStyle = (typeof curTrack === "function") ? curTrack() : "#ffd24a";
    ctx.fillText(val, m + padX + lw + gap, midY);
    ctx.font = smallF;                                                // unit in a smaller dim suffix
    ctx.fillStyle = "rgba(214,218,240,0.66)";
    ctx.fillText(unit, m + padX + lw + gap + vw, midY + 1);
    ctx.restore();
  }

  // The laid path is drawn as a set of per-tile platform segments. Each tile
  // renders its OWN piece (a straight or corner beam) contained within its
  // cell: a glass background, then the platform whose running surface passes
  // through the tile centre and whose body hangs into the lower half.
  function drawTrack(ts) {
    const p = state.path, idx = state.runIdx;
    if (idx >= p.length) return;

    // a node carries a platform until the runner exits it (per-node flag, so a
    // re-placed tile's stale old node never affects its fresh placement).
    const live = (n) => n.kind === "tile" && !n.exited;
    const onGoal = (n) => n.c === state.goal.c && n.r === state.goal.r;

    for (let i = idx; i < p.length; i++)
      if (live(p[i])) drawGlass(cx(p[i].c), cy(p[i].r), cell);

    for (let i = idx; i < p.length; i++)
      if (live(p[i])) {
        // leading tile = 3-way junction, unless it's the final tile on the goal cell
        if (i === p.length - 1 && !onGoal(p[i])) drawJunction(p[i], p[i-1], ts);
        else drawPlatformTile(p[i], p[i-1], p[i+1]);
      }

    // the exit is a floating flag on its cell; you must lay a tile there to finish
    drawFlag(state.goal.c, state.goal.r, ts, false);   // never locked (no primary key)
  }

  // floating finish flag; you place a tile on its cell to reach the exit
  function drawFlag(c, r, ts, locked) {
    const x = (c+0.5)*cell, cy0 = (r+0.5)*cell, s = cell;
    const pt = state.flagPlantT || 0;                     // 0 floating -> 1 planted on the tile
    const bob = (1-pt) * Math.sin(ts/300)*s*0.05;
    const baseY = cy0 + bob + pt*s*0.06;                  // planted: base settles onto the platform
    ctx.save();
    // place-here target ring (fades out once the flag is planted)
    if (pt < 0.98) {
      ctx.globalAlpha = (1-pt) * (0.4 + 0.3*Math.sin(ts/240));
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(2, s*0.04);
      ctx.setLineDash([s*0.12, s*0.09]);
      ctx.beginPath(); ctx.arc(x, cy0, s*0.28, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    if (locked) drawLock(x, cy0 + s*0.02, ts);   // small padlock (unused: exit never locked now)
    // as it plants, the flag tilts to align with the final tile's platform direction
    // (the track's tangent as the runner enters the goal cell)
    let rot = 0;
    const gi = state.path.findIndex(n => n.kind === "tile" && n.c === c && n.r === r);
    if (gi > 0) { const pv = state.path[gi-1]; rot = Math.atan2((r - pv.r), (c - pv.c)); }
    ctx.translate(x, baseY);
    ctx.rotate(rot * pt);                                 // upright while floating, aligned once planted
    // shorter, all-white pole (local frame: base near origin)
    const poleTop = -s*0.30, poleBot = s*0.08;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(2, s*0.035); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, poleTop); ctx.lineTo(0, poleBot); ctx.stroke();
    // smaller white pennant (wave settles as it plants), flying along the travel direction
    const wave = (0.4 + 0.6*(1-pt)) * Math.sin(ts/180)*s*0.03, fw = s*0.24, fh = s*0.15;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.moveTo(0, poleTop);
    ctx.quadraticCurveTo(fw*0.6, poleTop + fh*0.1 + wave, fw, poleTop + fh*0.5);
    ctx.quadraticCurveTo(fw*0.6, poleTop + fh*0.9 - wave, 0, poleTop + fh);
    ctx.closePath(); ctx.fill();
    // little planted base once it snaps down
    if (pt > 0.05) {
      ctx.globalAlpha = pt; ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.beginPath(); ctx.ellipse(0, poleBot, s*0.07*pt, s*0.03*pt, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawKey(x, y, ts, color) {
    color = color || "#ffd24a";
    const s = cell*0.85, bob = Math.sin(ts/300)*s*0.05;   // a little smaller
    y += bob;
    ctx.save();
    ctx.globalAlpha = 0.28; ctx.fillStyle = color;                                   // soft glow
    ctx.beginPath(); ctx.arc(x, y, s*0.4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    const R = s*0.12, bx = x - s*0.10;
    ctx.fillStyle = color;                                                           // bow drawn as a true ring:
    ctx.beginPath();
    ctx.arc(bx, y, R, 0, Math.PI*2);                                                 // outer edge
    ctx.arc(bx, y, R*0.46, 0, Math.PI*2, true);                                       // inner edge -> hole
    ctx.fill("evenodd");                                                             // centre left transparent (shows the scene behind)
    const sx0 = bx + R*0.6, sl = s*0.30, tipX = sx0 + sl, tw = s*0.035, th = s*0.07;
    ctx.fillStyle = color;
    ctx.fillRect(sx0, y - s*0.028, sl, s*0.056);                                     // shaft
    ctx.fillRect(tipX - tw, y + s*0.012, tw, th);                                     // teeth — near the tip
    ctx.fillRect(tipX - tw - s*0.07, y + s*0.012, tw, th);
    ctx.restore();
  }

  // --- Batch 2 cell-type rendering ---------------------------------------
  function drawBarriers(ts) {
    const s = state;
    for (const ck of s.crumble) if (!s.crumbled.has(ck)) { const [c,r]=ck.split(",").map(Number); drawCrumble(c,r,false,ts); }
    for (const ck of s.crumbled) { const [c,r]=ck.split(",").map(Number); drawCrumble(c,r,true,ts); }
    for (const bk of s.boost) { const [c,r]=bk.split(",").map(Number); drawFxPickup(c,r,ts,"boost"); }
    for (const bk of s.slow)  { const [c,r]=bk.split(",").map(Number); drawFxPickup(c,r,ts,"slow"); }
    for (const d of s.doors) {
      // coloured key-doors read as a LOCK (padlock marker); no full door tile
      if (!d.reached) drawDoorLock(d.c,d.r,ts,d.color,d.open);   // lock marker stays until the runner arrives
    }
    // linked switch/door groups: wires first (behind), then the sliding door, then the buttons
    for (const grp of s.gateGroups) {
      grp.switches.forEach((sw, i) => drawSwitchWire(sw, grp.door, grp.color, sw.used, ts, i, grp.switches.length));
    }
    for (const grp of s.gateGroups) drawSlidingDoor(grp, ts);
    for (const grp of s.gateGroups) {
      for (const sw of grp.switches) drawArcadeButton(sw.c, sw.r, sw.used, ts, grp.color);
    }
  }
  // a thin wire from a switch to its door. Multiple wires to the same door run in parallel
  // lanes (offset by index) so they never draw on top of one another.
  function drawSwitchWire(sw, door, color, used, ts, idx, count) {
    const x1 = (sw.c+0.5)*cell, y1 = (sw.r+0.5)*cell, x2 = (door.c+0.5)*cell, y2 = (door.r+0.5)*cell;
    const lane = (idx - (count-1)/2) * cell*0.16;   // per-switch parallel lane
    const ex = x2 + lane;                           // vertical run sits in its own lane
    const pts = [[x1, y1], [ex, y1], [ex, y2], [x2, y2]];
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = used ? color : "rgba(150,156,172,0.5)";
    ctx.globalAlpha = used ? 0.85 : 0.5;
    ctx.lineWidth = Math.max(1.5, cell*0.03);
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    if (used) {   // a travelling pulse along the polyline
      const segs = []; let tot = 0;
      for (let i = 0; i < pts.length-1; i++) { const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); segs.push(d); tot += d; }
      let ph = ((ts/500) % 1) * (tot || 1), px = pts[0][0], py = pts[0][1];
      for (let i = 0; i < segs.length; i++) {
        if (ph <= segs[i] || i === segs.length-1) { const f = segs[i] ? ph/segs[i] : 0;
          px = pts[i][0] + (pts[i+1][0]-pts[i][0])*f; py = pts[i][1] + (pts[i+1][1]-pts[i][1])*f; break; }
        ph -= segs[i];
      }
      ctx.globalAlpha = 0.9; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(px, py, cell*0.05, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  // a dual sliding door: two slim riveted colour panels (styled like the wall tiles) that part as it opens
  function drawSlidingDoor(grp, ts) {
    const { c, r } = grp.door, x = cx(c), y = cy(r), s = cell, t = grp.openT, color = grp.color;
    if (t >= 0.995) return;                       // fully open — nothing to draw
    ctx.save();
    rrect(x, y, s, s, s*0.13); ctx.clip();
    const off = t * (s*0.5 + 2);                  // each panel slides outward by up to half a cell
    const pw = s*0.5 - 1;
    const panel = (px) => {
      const g = ctx.createLinearGradient(px, y, px, y+s);
      g.addColorStop(0, shade(color, 34)); g.addColorStop(0.5, color); g.addColorStop(1, shade(color, -48));
      rrect(px, y+2, pw, s-4, s*0.13); ctx.fillStyle = g; ctx.fill();
      ctx.save(); rrect(px, y+2, pw, s-4, s*0.13); ctx.clip(); grainFill(px, y, pw, s, 0.7); ctx.restore();  // paper grain, like other tiles
      // corner rivets, matching the wall tiles' rivet size (s*0.05)
      const ox = Math.max(3, pw*0.24), oy = s*0.16, br = s*0.05;
      ctx.fillStyle = "rgba(0,0,0,0.30)";
      for (const [bx,by] of [[ox,oy],[pw-ox,oy],[ox,s-oy],[pw-ox,s-oy]]) { ctx.beginPath(); ctx.arc(px+bx, y+by, br, 0, Math.PI*2); ctx.fill(); }
    };
    panel(x - off);                               // left panel slides left
    panel(x + s*0.5 + off + 1);                   // right panel slides right
    ctx.restore();
  }
  // a simple 2.5D arcade push-button mounted on a metal wall: a flat top face on a coloured base
  function drawArcadeButton(c, r, used, ts, color) {
    const x = cx(c)+cell*0.5, y = cy(r)+cell*0.5, s = cell;
    const pulse = used ? 0 : 0.5 + 0.5*Math.sin(ts/300);
    const R = s*0.19, depth = used ? s*0.03 : s*0.09;   // extrusion; pressed sits lower
    const topY = y - depth*0.5, baseCol = shade(color, -80), topCol = used ? shade(color, -22) : color;
    ctx.save();
    // dark round housing (mounted on the wall)
    ctx.fillStyle = "#191b22"; ctx.beginPath(); ctx.arc(x, y + depth*0.5, R*1.3, 0, Math.PI*2); ctx.fill();
    // side wall (the 2.5D thickness): base disc + a connecting band = a short cylinder
    ctx.fillStyle = baseCol;
    ctx.beginPath(); ctx.arc(x, topY + depth, R, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(x - R, topY, R*2, depth);
    // flat top face
    ctx.fillStyle = topCol; ctx.beginPath(); ctx.arc(x, topY, R, 0, Math.PI*2); ctx.fill();
    if (!used) {
      // simple crescent sheen along the top edge
      ctx.fillStyle = shade(color, 55); ctx.beginPath(); ctx.arc(x, topY - R*0.12, R*0.66, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = topCol; ctx.beginPath(); ctx.arc(x, topY + R*0.04, R*0.78, 0, Math.PI*2); ctx.fill();
      // pulsing "tap me" ring
      ctx.globalAlpha = 0.3 + 0.45*pulse; ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, s*0.028);
      ctx.beginPath(); ctx.arc(x, topY, R*1.12, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = Math.max(1.5, s*0.03); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x - R*0.4, topY); ctx.lineTo(x - R*0.1, topY + R*0.35); ctx.lineTo(x + R*0.45, topY - R*0.35); ctx.stroke();
    }
    ctx.restore();
  }
  // lighten/darken a #rrggbb by amount (-255..255)
  function shade(hex, amt) {
    const n = parseInt(hex.replace("#",""), 16);
    const cl = v => Math.max(0, Math.min(255, v + amt));
    return "rgb(" + cl((n>>16)&255) + "," + cl((n>>8)&255) + "," + cl(n&255) + ")";
  }
  function drawPickups(ts) {
    for (const ck of state.coinCells) { const [c,r]=ck.split(",").map(Number); drawCoin((c+0.5)*cell,(r+0.5)*cell,ts); }
    if (!state.keyCollected) for (const k of state.keys) if (!k.got) drawKey((k.c+0.5)*cell,(k.r+0.5)*cell,ts,k.color);
  }
  function drawHazards(ts) {
    for (const h of state.hazards) {
      if (h.kind === "monster") {
        // faint dashed patrol path so its route is readable
        if (h.path && h.path.length > 1) {
          ctx.save();
          ctx.strokeStyle = "rgba(178,77,255,0.28)"; ctx.lineWidth = Math.max(1.5, cell*0.028);
          ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.setLineDash([cell*0.12, cell*0.1]);
          ctx.beginPath(); ctx.moveTo((h.path[0][0]+0.5)*cell, (h.path[0][1]+0.5)*cell);
          for (let i=1;i<h.path.length;i++) ctx.lineTo((h.path[i][0]+0.5)*cell, (h.path[i][1]+0.5)*cell);
          if (h.loop) ctx.closePath();
          ctx.stroke(); ctx.setLineDash([]); ctx.restore();
        }
        drawMonster(h.wx, h.wy, ts, h.faceX);
        continue;
      }
      {
        const pos = h.pos != null ? h.pos : (h.axis==="h" ? h.cc : h.cr);
        const sx = h.axis==="h" ? (pos+0.5)*cell : (h.c+0.5)*cell;
        const sy = h.axis==="h" ? (h.r+0.5)*cell : (pos+0.5)*cell;
        // the rail the saw slides along (lo -> hi)
        const x1 = h.axis==="h" ? (h.lo+0.5)*cell : (h.c+0.5)*cell;
        const y1 = h.axis==="h" ? (h.r+0.5)*cell  : (h.lo+0.5)*cell;
        const x2 = h.axis==="h" ? (h.hi+0.5)*cell : (h.c+0.5)*cell;
        const y2 = h.axis==="h" ? (h.r+0.5)*cell  : (h.hi+0.5)*cell;
        ctx.save();
        ctx.strokeStyle = "rgba(150,156,172,0.55)"; ctx.lineWidth = Math.max(2, cell*0.05); ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        ctx.fillStyle = "rgba(120,126,142,0.65)";
        for (const [ex,ey] of [[x1,y1],[x2,y2]]) { ctx.beginPath(); ctx.arc(ex,ey,cell*0.09,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
        drawSaw(sx, sy, ts);
      }
    }
  }
  // movable sliding platforms: a wall band with a draggable platform that is the crossing
  // A straight platform piece filling one cell, matching the laid track tiles (so the
  // slider reads as — and connects to — ordinary platforms). `vertical` = running surface
  // runs top↔bottom (the runner crosses a horizontal rail vertically).
  function drawStraightPlatform(x, y, vertical, opts) {
    opts = opts || {};
    const s = cell;
    ctx.save();
    rrect(x, y, s, s, s*0.16); ctx.clip();
    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
    ctx.fillStyle = opts.fill || curTrack(); ctx.fillRect(x, y, s, s);   // body fills the cell edge-to-edge
    if (opts.grain !== false) grainFill(x, y, s, s, 0.7);                 // paper grain, like every other tile
    ctx.strokeStyle = opts.rail || curRail(); ctx.lineWidth = Math.max(3, s*0.06); ctx.lineCap = "round";
    ctx.beginPath();
    if (vertical) { ctx.moveTo(x+s*0.5, y); ctx.lineTo(x+s*0.5, y+s); }   // rail down the centre
    else          { ctx.moveTo(x, y+s*0.5); ctx.lineTo(x+s, y+s*0.5); }
    ctx.stroke();
    ctx.restore();
  }
  function drawSliders(ts) {
    for (const sl of (state.sliders||[])) {
      const vertical = sl.axis === "h";          // horizontal rail → the platform is a vertical through-piece
      // 1) semi-transparent track filling every cell of the slide range
      for (let i = sl.lo; i <= sl.hi; i++) {
        const c = sl.axis === "h" ? i : sl.c, r = sl.axis === "h" ? sl.r : i;
        drawStraightPlatform(cx(c), cy(r), vertical, { alpha: 0.24 });
      }
      // 2) the solid, draggable platform at its live (fractional while dragging) position
      const px = sl.axis === "h" ? sl.pos*cell : cx(sl.c);
      const py = sl.axis === "h" ? cy(sl.r) : sl.pos*cell;
      drawSliderPlatform(px, py, ts, vertical, sl);
    }
  }
  function drawSliderPlatform(x, y, ts, vertical, sl) {
    const s = cell, dragging = state.sliderDrag && state.sliderDrag.sl === sl;
    drawStraightPlatform(x, y, vertical, {});               // full-opacity platform tile (matches laid track)
    ctx.save();
    rrect(x, y, s, s, s*0.16); ctx.clip();
    if (dragging) { ctx.fillStyle = "rgba(255,255,255,0.14)"; ctx.fillRect(x, y, s, s); }   // lift highlight
    // grip dots so it reads as draggable
    const pulse = 0.5 + 0.5*Math.sin(ts/280);
    ctx.globalAlpha = 0.5 + 0.35*pulse;
    drawDragDots(x + s/2, y + s/2, s);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  // ---- movable wall block: a metal block that slides along a rail off the tunnel mouth ----
  function drawBlocks(ts) {
    const s = cell;
    for (const b of (state.blocks||[])) {
      const horiz = b.axis === "h";
      // ---- the rail the block slides along (a thin bar, matching the saw's rail) ----
      const x1 = horiz ? (b.lo+0.5)*cell : (b.c+0.5)*cell;
      const y1 = horiz ? (b.r+0.5)*cell  : (b.lo+0.5)*cell;
      const x2 = horiz ? (b.hi+0.5)*cell : (b.c+0.5)*cell;
      const y2 = horiz ? (b.r+0.5)*cell  : (b.hi+0.5)*cell;

  // ---- manual sliding door: drag BOTH panels apart to open ----

  // a little flying monster that patrols back and forth — touching it is fatal

  function drawMonster(x, y, ts, faceX) {

    ctx.beginPath(); ctx.arc(0, 0, s*0.42, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    ctx.scale(face, 1);

    const gt = ts % 5200; let gx = 0, gy = 0;
    if (gt < 650) gx = -s*0.03; else if (gt < 1300) gx = s*0.03; else if (gt > 3400 && gt < 4050) gy = -s*0.024;
    const bt = ts % 3000, blink = bt < 120 || (bt > 175 && bt < 255);

    if (blink) {
      ctx.strokeStyle = "#2a0f47"; ctx.lineWidth = Math.max(1.5, s*0.02); ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(e1x - eyeR, eyeY + gy); ctx.lineTo(e1x + eyeR, eyeY + gy);
      ctx.moveTo(e2x - eyeR, eyeY + gy); ctx.lineTo(e2x + eyeR, eyeY + gy);

  function drawCoin(x, y, ts) {
    const bob = Math.sin(ts/360) * cell*0.05;       // gentle up/down bob (no spin)
    y += bob;
    const r = cell*0.15, rh = r*0.82, depth = cell*0.058, tilt = -0.25;   // smaller disc + slight rotation
    const lean = 0.42;                                                     // extrusion leans off at a slight angle
    ctx.save();
    // orange extrusion (a short stack of discs, offset diagonally below the face)
    ctx.fillStyle = "#e08a1e";
    for (let d = depth; d > 0.4; d -= 1.0) { ctx.beginPath(); ctx.ellipse(x + d*lean, y + d, r, rh, tilt, 0, Math.PI*2); ctx.fill(); }
    // flat yellow face — no shine, no outline, gently tilted
    ctx.fillStyle = "#ffd24a";
    ctx.beginPath(); ctx.ellipse(x, y, r, rh, tilt, 0, Math.PI*2); ctx.fill();

  // a collectible boost / slow token that bobs on its cell (grab it for a timed speed effect)
  function drawFxPickup(c, r, ts, kind) {
    const col = kind === "boost" ? pal("boost") : pal("slow");
    const x = (c+0.5)*cell, y = (r+0.5)*cell + Math.sin(ts/340 + c + r)*cell*0.05;
    const dir = kind === "boost" ? -1 : 1;              // chevrons point up (boost) / down (slow)
    ctx.save();
    ctx.globalAlpha = 0.22; ctx.fillStyle = col;        // glow
    ctx.beginPath(); ctx.arc(x, y, cell*0.28, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = col;                                // token disc
    ctx.beginPath(); ctx.arc(x, y, cell*0.18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(10,8,20,0.32)";
    ctx.beginPath(); ctx.arc(x, y, cell*0.145, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, cell*0.04); ctx.lineCap = "round"; ctx.lineJoin = "round";
    const ah = cell*0.11, aw = cell*0.072, hl = cell*0.075;   // arrow half-height, head half-width, head length
    const tipY = y + dir*ah, tailY = y - dir*ah;              // boost (dir -1) points up; slow (dir +1) points down
    ctx.beginPath(); ctx.moveTo(x, tailY); ctx.lineTo(x, tipY); ctx.stroke();   // stem

    ctx.moveTo(x - aw, tipY - dir*hl);
    ctx.lineTo(x,       tipY);
    ctx.lineTo(x + aw, tipY - dir*hl);

    ctx.restore();

  function drawChevrons(c, r, ts, dir, color) {   // dir -1 = boost (up), +1 = slow (down)

    ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, s*0.05);
    for (let k=0;k<3;k++){ const yy = y + s*(0.22 + ((k*0.26 + (dir<0?1-ph:ph)) % 0.78));

  function drawCrumble(c, r, gone, ts) {

  // a coloured key-door: two slim riveted panels (styled like the wall tiles) side by side

  // edge arrow pointing to an off-screen target (drawn in screen space)

  // one tile's platform piece, clipped to its own cell. The top surface is the

  // draw a platform body + rail from a surface polyline S, clipped to the cell.

  // build the body polygon (surface S, extended past the far tile edge) as the current path
