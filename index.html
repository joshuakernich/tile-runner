<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tile Runner">
<meta name="theme-color" content="#0d0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&display=swap" rel="stylesheet">
<title>Tile Runner</title>
<style>
  /* Headings and the title logo. Local file, so it works offline and needs no network
     round-trip — sw.js precaches it. It is the face for the whole UI. */
  @font-face {
    font-family:"SquareFont";
    src:url("./Square.ttf") format("truetype");
    font-weight:normal; font-style:normal; font-display:swap;
  }
  :root {
    --bg:        #0d0b1a;
    --shop-w:    520px;      /* the widest the shop's rack ever gets — portrait, whatever the screen */
    --panel:     #17142b;
    --panel-lo:  #0b0918;      /* its own colour darkened, for the plate it stands on */
    --grid-line: #221d40;
    --ink:       #e8e6ff;
    --dim:       #6f68a8;
    --accent:    #ff4d6d;
    --track:     #ffcf4d;   /* beam body */
    --track-lo:  #b8892a;   /* beam underside / shade */
    --rail:      #fff2c4;   /* running surface highlight */
    --free:      #b9b3ff;   /* freed / draggable tile */
    --runner:    #4dd6ff;
    --goal:      #7dff6b;
    --wall:      #3a2a55;
    --shadow:    #05040d;
    /* the whole UI. Fraunces stays in the stack only as a glyph fallback:
       SquareFont has no checkmark or arrow, and the level grid uses both. */
    --font: "SquareFont", "Fraunces", ui-serif, Georgia, serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:var(--font);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  /* No bottom inset. The board is the backdrop of the whole screen and should run to the
     physical edge — padding it away from the home indicator left a band of dead page across
     the foot of every iPhone and iPad, which read as the game being letterboxed.
     Nothing is lost by it: every control that has to clear the indicator is position:fixed
     and carries its own env() offset, so they sit exactly where they did. The top inset stays
     — that one is a notch cut OUT of the screen, not a strip drawn over it. */
  #app {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  header { text-align:center; padding:10px 0 6px; width:100%; }
  header h1 {
    font-size:22px; font-weight:900; letter-spacing:4px; text-transform:uppercase; color:var(--track);
    text-shadow: 2px 0 var(--shadow), -2px 0 var(--shadow), 0 2px var(--shadow), 0 -2px var(--shadow), 2px 2px var(--accent);
  }
  :root { --body: 19px; --btn: 15px; }   /* body text = death-screen byline; buttons a touch smaller */
  /* The finish-line chequer, at one scale everywhere it appears. A plain menu button is 45px
     tall and should read as THREE squares high, so a square is 15 and the repeating cell —
     which is a 2x2 of them — is 30. The taller buttons (NEXT LEVEL is double height) get more
     squares rather than bigger ones, which is the point of having a single scale.

     Drawn with ONE conic-gradient rather than the old pair of 45-degree linear ones. The
     linear recipe builds each square out of two triangles from two layers, the second nudged
     half a cell, which only lands square if both layers agree on where the origin is — and
     they were both starting at the PADDING box while being painted across the border box, so
     the whole pattern sat 3px in from the top-left corner. A conic gradient makes the 2x2
     itself, so there is one layer, no offset, and the corner square starts exactly at the
     corner. background-origin is spelled out for the same reason. */
  :root { --chq: 30px; }
  /* Every button in the game is this tall, and so is every square of the Tileverse. It is a
     min-height rather than a padding sum so that WHAT IS IN a button — text, an arrow chip, a
     coin icon — cannot change how tall it comes out: the pause menu's RESUME used to measure
     46 against its neighbours' 45 purely because it carries an 18px canvas. */
  :root { --btn-h: 45px; }
  #hud {
    display:flex; gap:12px; align-items:center; justify-content:center;
    margin-top:8px; font-size:var(--body); letter-spacing:2px; text-transform:uppercase; color:var(--dim);
  }
  #hud b { color:var(--ink); }
  #ov-stars { font-size:30px; letter-spacing:8px; margin-bottom:10px; color:var(--track); min-height:34px; }
  /* LEVEL CLEAR: no stars, no score — just the heading and a (barbed) compliment,
     laid out exactly like the death screen so the two read as a matched pair */
  #overlay.win #ov-stars { min-height:0; margin:0; }
  #overlay.win p { font-size:var(--body); line-height:1.5; color:#fff1ea; margin-bottom:26px; }
  #ov-score:empty { margin:0; }
  #ov-score { display:flex; flex-direction:column; gap:5px; margin:2px auto 20px; max-width:230px; }
  #ov-score .ov-ln { display:flex; justify-content:space-between; gap:24px; color:#fff; font-size:var(--body);
    letter-spacing:1px; text-transform:uppercase; opacity:0; transform:translateY(7px);
    transition:opacity .26s ease, transform .26s ease; }
  #ov-score .ov-ln span:last-child { font-weight:900; }
  #ov-score .ov-ln.show { opacity:1; transform:none; }
  #ov-score .ov-total { font-size:var(--body); font-weight:900; color:#fff; margin-top:7px; padding-top:9px;
    border-top:2px solid rgba(255,255,255,0.25); }
  #ov-score .ov-best { justify-content:center; color:var(--goal); font-size:var(--body); margin-top:6px; }
  #overlay.lose #ov-score { display:none; }
  #pauseFloat {
    position:fixed; z-index:15; padding:0; cursor:pointer;
    top:calc(env(safe-area-inset-top) + var(--hud-m, 12px));
    right:calc(env(safe-area-inset-right) + var(--hud-m, 12px));
    /* Square, like every other button in the UI — the circle was the odd one out — and exactly
       as tall as the speedo across from it. One var drives BOTH sides of the box, so it cannot
       stop being square; box-sizing keeps the 2px border inside that measurement. */
    width:var(--hud-h, 44px); height:var(--hud-h, 44px); aspect-ratio:1;
    border-radius:0; display:flex; align-items:center; justify-content:center; gap:5px;
    /* No outline, and the same shadow every other button wears — straight below rather than
       down-and-right. The border stays, transparent, because the height is matched against the
       speedo by measurement and box-sizing counts it: dropping it would shorten the button by
       4px and the pair would stop lining up. */
    background:rgba(23,20,43,0.72); border:2px solid transparent; box-shadow:0 4px 0 #0b0918;
  }
  /* the two bars scale with the button rather than sitting at a fixed 16px inside a box that moves */
  #pauseFloat span { width:9%; height:36%; min-width:3px; background:var(--ink); border-radius:1px; }
  /* The whirlpool eats the canvas, but the two floating buttons are DOM — so they get
     pulled in too rather than simply blinking out a moment before everything else. */
  body.vortex #pauseFloat, body.vortex #power {
    transition: transform 2.4s cubic-bezier(.6,0,.85,.2), opacity 2.4s ease-in;
    transform: scale(0.02) rotate(520deg); opacity: 0; pointer-events: none;
  }
  /* The talisman's one shot at this level. Bottom RIGHT — diagonally opposite the pause
     button, clear of the board's top edge (which is where the runner is heading), and on the
     side a thumb is already on. Just the icon: the name never changed between presses and the
     sub-line's job is done by the class — dim for spent or running, armed for waiting, plus
     the bar draining along the bottom. */
  /* Every talisman you have found, along the bottom of the level. No plate, no border, no
     shadow — each is just the object itself, the way it looks lying on the board. A row of
     bordered buttons down there read as UI chrome competing with the track. */
  #power {
    position:fixed; z-index:15; display:none; align-items:flex-end; justify-content:center;
    gap:2px; left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom) + 10px);
    pointer-events:none;                 /* the strip is a layout box; only the charms take taps */
  }
  #power.on { display:flex; }
  /* The charms sit over the board, which is whatever colour that level happens to be — and a
     gold talisman on a gold track is a talisman you cannot find. This grounds the strip: a tall
     soft shadow rising out of the bottom edge, dark enough to separate them from the ground
     behind and diffuse enough never to read as a bar. It is behind the buttons and takes no
     taps, so nothing about reaching them changes. */
  #power::before {
    content:""; position:fixed; left:0; right:0; bottom:0; height:210px;
    background:linear-gradient(to top,
      rgba(5,4,13,0.72) 0%, rgba(5,4,13,0.52) 26%, rgba(5,4,13,0.24) 58%, rgba(5,4,13,0) 100%);
    pointer-events:none; z-index:-1;
  }
  #power .pw {
    /* box-shadow has to be cleared explicitly: the global `button` rule paints a 3px offset
       plate shadow, and killing only the background and border left that behind — which is
       exactly the button shape that was still showing through. */
    position:relative; background:none; border:0; box-shadow:none; padding:0; margin:0;
    cursor:pointer; pointer-events:auto; line-height:0;
    /* Each hangs at its own slight angle, set per charm in JS — five identical uprights read
       as a toolbar, a few degrees apart reads as things you collected. The tilt lives in a
       custom property so :active can add its nudge without throwing the rotation away. */
    transform:rotate(var(--tilt, 0deg));
    transition:opacity 0.18s, transform 0.12s;
  }
  #power .pw canvas { width:58px; height:58px; display:block; }
  #power .pw:active { transform:rotate(var(--tilt, 0deg)) translateY(2px); }
  /* running: a bar draining under the one that is up */
  #power .pw-bar { position:absolute; left:12%; bottom:2px; height:3px; width:0; background:var(--goal); }
  /* one power per level: once any has fired, the rest have nothing left to give */
  #power .pw.dim { opacity:0.30; cursor:default; }
  #power .pw.live { opacity:1; }
  /* armed and waiting to be aimed (the Hammer) */
  #power .pw.armed canvas { filter:drop-shadow(0 0 6px var(--goal)); }
  #pauseFloat:active { transform:translateY(4px); box-shadow:none; }
  /* A talisman maze's win card. Bigger title, the charm itself where the stars normally go,
     and no score furniture — this screen is about the object, not the run. */
  /* The ceremony fills the screen and its card is only the way out of it, so the card goes to
     the FOOT rather than the middle — centred, it landed square on the charm's name. */
  #overlay.relic { display:block; }
  #overlay.relic .card { position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 26px); width:330px; max-width:calc(100vw - 44px); }
  #overlay.relic #ov-title { font-size:26px; letter-spacing:3px; color:var(--goal); }
  .ov-relic { width:170px; height:170px; display:block; margin:2px auto -6px; }
  .ov-relic-does { display:block; font-size:15px; letter-spacing:2px; line-height:1.35;
    color:var(--ink); text-transform:uppercase; font-weight:900; margin:4px auto 2px; }
  /* the standing rule, last and quietest */
  #overlay.relic #ov-msg { font-size:11px; letter-spacing:0.6px; line-height:1.5;
    color:var(--dim); text-transform:none; font-weight:700; max-width:34ch; margin:2px auto 0; }
  #mechpop {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(5,4,13,0.32); z-index:35;
    padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 24px)
            calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);
  }
  #mechpop.show { display:flex; }
  /* No outline, and the shadow straight below rather than down-and-right — the same rule the
     buttons follow. The border stays, transparent, so nothing shifts by 3px if a state ever
     colours it. The scrim behind is light on purpose now: the card is the thing being read,
     but the level it is telling you about should still be legible underneath it. */
  .mech-card {
    max-width:300px; text-align:center; background:var(--panel);
    border:3px solid transparent; box-shadow:0 6px 0 #0b0918; padding:20px 22px 18px;
  }
  .mech-tag { font-size:var(--body); letter-spacing:3px; text-transform:uppercase; color:var(--accent); font-weight:900; }
  #mech-icon { width:112px; height:112px; margin:8px auto 4px; display:block; }
  .mech-card h3 { font-size:18px; letter-spacing:2px; text-transform:uppercase; color:var(--track); margin:2px 0 8px; }
  .mech-card p { font-size:var(--body); line-height:1.6; color:var(--ink); margin-bottom:16px; }
  /* A shade up from the card it sits on. Both were --panel, so the one thing on the card you
     are meant to press was the same colour as the card — it read as a label rather than as a
     button, and the shadow under it was doing all the work of saying otherwise. */
  .mech-card button { width:100%; background:#241f45; }
  .mech-card button:active { background:#2c2652; }
  #ready { color:var(--free); }
  #board-wrap { flex:1; width:100%; display:flex; align-items:stretch; justify-content:center; min-height:0; overflow:hidden; }
  canvas { image-rendering:pixelated; touch-action:none; display:block; }
  footer { padding:10px 0 16px; display:flex; gap:12px; }
  /* No outline. The shadow sits DIRECTLY below rather than down-and-right: an offset to the
     corner implies a light source the rest of the game does not have, where a shadow straight
     underneath just says the button is standing off the page. The border is kept and made
     transparent so the states that colour it (.danger, .on) do not shift anything by 3px. */
  button {
    font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:2px; font-size:var(--btn);
    color:var(--ink); background:var(--panel); border:3px solid transparent;
    /* the shadow is the button's OWN colour darkened, the rule the gold and amber ones follow */
    box-shadow:0 4px 0 var(--panel-lo); padding:11px 16px; cursor:pointer; touch-action:manipulation;
    min-height:var(--btn-h);
  }
  /* Anything that is a full-width action centres its contents in that height. The grid cells
     that happen to be buttons — shop stock, shop tabs, Tileverse squares — set their own
     layout and are left alone. */
  #menu-body > button, #ov-btn, #ov-shop, #menu-body .shop-go, #menu-body .shop-buy, #mech-ok {
    display:flex; align-items:center; justify-content:center; gap:10px;
    /* height, not min-height: these are all one line, and an 18px arrow chip is taller than
       the line box the padding was sized for, so RESUME and the two DONEs came out a pixel
       over their neighbours. box-sizing is border-box globally, so this IS the outer 45. */
    height:var(--btn-h); padding-top:0; padding-bottom:0;
  }
  button:active { transform:translateY(4px); box-shadow:none; }
  #overlay {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:radial-gradient(ellipse 76% 56% at 50% 46%, rgba(5,4,13,0.52) 0%, rgba(5,4,13,0.42) 45%, rgba(5,4,13,0.10) 100%);
    z-index:20; text-align:center;
    padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 24px)
            calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);
  }
  #overlay.show { display:flex; }
  #overlay .card { max-width:340px; }
  /* big, bold, 3D-extruded like the title header (just smaller) */
  #overlay h2 { font-size:46px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
    margin-bottom:16px; transform:rotate(-4deg); line-height:1.05; }
  #overlay p { font-size:var(--body); line-height:1.5; color:var(--dim); margin:0 auto 20px; letter-spacing:1px;
    max-width:19rem; text-wrap:balance; }   /* setByline() places the break; 19rem is the narrowest
                                              width at which all 47 quips still fit on two lines */
  #overlay.win h2 { color:#8dff78;
    text-shadow:1px 1px 0 #3a8a45, 2px 2px 0 #2f7439, 3px 3px 0 #256030, 4px 4px 0 #1c4c26, 5px 6px 10px rgba(5,4,13,0.65); }
  #overlay.lose h2 { color:#ff8f74; margin-bottom:15px;
    text-shadow:1px 1px 0 #c24a34, 2px 2px 0 #a83b2a, 3px 3px 0 #8a2f21, 4px 4px 0 #6b2318, 5px 6px 10px rgba(5,4,13,0.65); }
  /* death screen: tighten heading↔byline, bigger/brighter byline, larger retry button */
  #overlay.lose #ov-stars { min-height:0; margin-bottom:0; }
  #overlay.lose p { font-size:var(--body); line-height:1.5; color:#fff1ea; margin-bottom:26px; }
  /* Both end screens carry the same two buttons, and they are sized like the menu's — same
     330px column, same full width — so the end of a level lands on the same shape as every
     other decision in the game rather than on a pair of one-off pills. */
  /* The one button you press after every single level, so it gets twice the height and a
     chequer of its own — the finish-line flag, at an angle and faint enough to be a texture
     rather than a pattern. Two gradients at 45 degrees make the squares; nothing is loaded. */
  /* A shade lighter than --panel. At the near-black it used to be it sat at luminance 29
     against a backdrop that is often darker still, so its left and right edges simply were not
     visible — which is why it read as narrower than the gold button beside it, despite both
     measuring 330px to the pixel. Nothing about the box changed; it just has edges you can
     find — and now that --panel is a colour rather than a near-black, more easily still. */
  /* Its own colour, darkened — the shared near-black slab under it read as a gap between
     this button and the gold one below, which is what made the two look like different widths
     even though they measure identically. A shadow the colour of the thing casting it reads as
     depth; a black bar between two blocks reads as a divider. */
  #overlay.lose #ov-btn, #overlay.win #ov-btn {
    font-size:var(--btn); padding:11px 16px;
    /* The same plate every menu button is, rather than a lighter blue of its own — these two
       are the same kind of thing as RESUME or TILEVERSE and were reading as a different family
       for no reason but a hardcoded colour. The chequer is what marks them out. */
    box-shadow:0 4px 0 var(--panel-lo);
    background-color:var(--panel);
    background-image:
      conic-gradient(transparent 0 25%, rgba(255,255,255,0.03) 0 50%,
                     transparent 0 75%, rgba(255,255,255,0.03) 0);
    background-size:var(--chq) var(--chq);
    background-position:0 0;
    background-origin:border-box;
  }
  /* The same finish-line chequer on the gold, cut in a darker gold so it reads at all — white
     over #e0aa1e is nearly invisible, where a shade of the button's own colour is not. */
  #ov-shop, #menu-body button.gold, #menu-body button.amber, #menu-body button.void,
  .tal-grid .tal.locked.preview, .tal-grid .tal.on, #menu-body .shop-buy {
    /* WHITE squares, not brown ones: the chequer should lift the colour it sits on rather than
       dirty it. On the gold it reads as a sheen; on the green it reads as the same sheen. */
    background-image:
      conic-gradient(transparent 0 25%, rgba(255,255,255,0.13) 0 50%,
                     transparent 0 75%, rgba(255,255,255,0.13) 0);
    background-size:var(--chq) var(--chq);
    background-position:0 0;
    background-origin:border-box;
  }
  /* A DEFINITE width, not 100% of a shrink-to-fit parent: the overlay card sizes itself to
     its content, so "100%" came out as whatever the byline happened to measure — 300px on the
     clear screen and 214 on the death screen. 330 is the menu card's width. */
  /* Both are the same box: same width, and box-sizing so the different paddings cannot make
     one wider than the other. NEXT LEVEL used to be deliberately double height; it is now the
     one standard height every other button in the game is, and the chequer is what marks it
     out instead. */
  #overlay.lose #ov-btn, #overlay.win #ov-btn,
  #overlay.lose #ov-shop, #overlay.win #ov-shop {
    box-sizing:border-box; width:330px; max-width:calc(100vw - 44px);
    margin-left:auto; margin-right:auto; }
  #overlay.lose #ov-btn, #overlay.win #ov-btn {
    display:flex; align-items:center; justify-content:center; gap:10px; }
  #ov-btn canvas.arrow { width:22px; height:22px; display:block; }
  /* any button carrying an arrow lays out as a row, the same as the wallet ones do */
  #menu-body button:has(canvas.arrow) {
    display:flex; align-items:center; justify-content:center; gap:10px; }
  #menu-body button canvas.arrow { width:18px; height:18px; display:block; }
  /* flex, not block: this one carries a label, the tile and the count as three children */
  #overlay.lose #ov-shop, #overlay.win #ov-shop { display:flex; }
  /* The way into the shop, on BOTH end screens — a fall is exactly when you have just banked
     a handful of tiles and might want to spend them. Same gold, same size, same weight as the
     one in the menu: it is the same button and has no business looking like a different one. */
  #ov-shop { display:none; margin:10px auto 0; font-size:var(--btn); letter-spacing:2px;
    padding:14px 22px; }

  /* "Add to Home Screen" prompt (mobile browsers only) */
  #a2hs {
    position:fixed; left:12px; right:12px; bottom:14px; z-index:28;
    display:none; align-items:center; gap:11px;
    background:var(--panel); border:3px solid var(--grid-line);
    box-shadow:4px 4px 0 var(--shadow); padding:11px 12px 11px 13px;
  }
  #a2hs.show { display:flex; animation:a2hsIn .34s ease-out; }
  @keyframes a2hsIn { from { transform:translateY(26px); opacity:0; } to { transform:none; opacity:1; } }
  #a2hs-ic { flex:none; color:var(--track); display:flex; align-items:center; }
  #a2hs-ic svg { display:block; }
  #a2hs-txt { flex:1; font-size:11.5px; line-height:1.55; letter-spacing:.4px; color:var(--ink); text-transform:none; }
  #a2hs-txt b { color:var(--track); font-weight:900; }
  #a2hs .a2hs-acts { flex:none; display:flex; flex-direction:column; gap:6px; }
  #a2hs .a2hs-acts button { padding:8px 10px; font-size:10px; letter-spacing:1px; box-shadow:2px 2px 0 var(--shadow); }
  #a2hs .a2hs-x { background:transparent; border-color:transparent; box-shadow:none; color:var(--dim); padding:6px 8px; }
  #a2hs .a2hs-x:active { transform:none; }

  /* colorblind-friendly palette (Okabe–Ito) */
  .cb { --accent:#d55e00; --goal:#009e73; --runner:#56b4e9; }

  #menu {
    /* A centred flex child that outgrows its scroll container gets clipped at the TOP and
       can't be scrolled back to — which the shop, being the tallest screen here, does.
       safe-centring keeps it centred while it fits and pins it to the top once it doesn't. */
    position:fixed; inset:0; display:none; align-items:safe center; justify-content:center;
    /* the shop is the tall one — it is pinned to the top so the runner and the tabs stay put
       as you switch between racks of different lengths, instead of the whole card sliding */
    background:radial-gradient(ellipse 84% 70% at 50% 50%, rgba(5,4,13,0.58) 0%, rgba(5,4,13,0.48) 48%, rgba(5,4,13,0.14) 100%);
    z-index:30; overflow:auto;
    /* #app pads for the notch, but a fixed inset:0 layer sits OUTSIDE it and covers the whole
       screen — so the shop's title landed under the notch. Add the insets here as well. */
    padding:calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + 22px)
            calc(env(safe-area-inset-bottom) + 22px) calc(env(safe-area-inset-left) + 22px);
  }
  #menu.show { display:flex; }
  /* Nothing else is on screen while a menu is. The backdrop behind it is the level's own,
     painted by draw(), which is exactly the "current background" a menu should sit on. */
  body.menu-open #overlay,
  body.menu-open #power,
  body.menu-open #pauseFloat,
  body.menu-open #mechpop { display:none !important; }
  #menu.top { align-items:flex-start; }
  .menu-card { width:100%; max-width:330px; text-align:center; }
  /* The shop is a RACK, not a list of options. 330px is the width a column of buttons wants;
     the shop's content is its squares, and they should have the screen. Capped at a portrait
     width all the same — this is a phone game, and a shop stretched across a desktop turns six
     tabs into six dinner plates. The squares keep their aspect-ratio, so the cap is the only
     number here: nothing sets a size, and nothing has to be kept in step with anything else. */
  #menu.wide .menu-card { max-width:var(--shop-w); }
  #menu.wide #menu-body .shop-go { max-width:var(--shop-w); width:calc(100% - 44px); }
  .menu-ver { font-size:var(--body); letter-spacing:2px; color:var(--dim); margin-top:14px; opacity:0.7; }
  .menu-card h2 { font-size:18px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--track);
    text-shadow:2px 2px var(--shadow); margin-bottom:16px; }
  /* the main menu's header is the title logo in miniature — same flat gold extrusion and
     -4° tilt as the canvas one in draw3DText (TITLE_SIDE), just built out of text-shadow */
  .menu-card h2.logo {
    font-size:40px; line-height:0.9; letter-spacing:1px; margin-bottom:24px;
    transform:rotate(-4deg);
    text-shadow:
      1px 1px 0 #a87b18, 2px 2px 0 #a87b18, 3px 4px 0 #a87b18, 4px 5px 0 #a87b18,
      5px 6px 0 #a87b18, 6px 7px 0 #a87b18;
  }
  #menu-body { display:flex; flex-direction:column; gap:9px; }
  #menu-body button { width:100%; }
  /* The one button in the menu that is about money, in the colour of the money. A deeper
     gold than the loot tile itself, so the tile sitting on it still reads as an object rather
     than dissolving into its own background. */
  /* background-COLOR, not the shorthand: `background:` resets background-image, which would
     wipe the chequer set above it. */
  #menu-body button.gold, #ov-shop { background-color:#e0aa1e; border-color:transparent;
    color:#38270a; box-shadow:0 4px 0 #8a6410; }
  /* The way into the campaign is the colour of the space it hangs in: black, same chequer,
     which on this one reads as the faint grid of a thing seen from very far away. */
  #menu-body button.void { background-color:#0a0912; border-color:transparent;
    color:#e8e6ff; box-shadow:0 4px 0 #05040b; }
  /* The talismans are the other thing you collect, so they get the shop's treatment in their
     own metal: orange rather than gold, same chequer, same shadow rule — the button's own
     colour darkened — so the pair read as a set without reading as the same button. */
  #menu-body button.amber { background-color:#e07a1e; border-color:transparent;
    color:#3a1d05; box-shadow:0 4px 0 #8a4610; }
  #menu-body button.gold:active, #ov-shop:active,
  #menu-body button.amber:active,
  #menu-body button.void:active { transform:translateY(4px); box-shadow:none; }
  /* label · coin · count, on one line and centred as a group.
     `> button` matters: a shop item also contains a canvas.wallet — the tile in its price row —
     and without the child combinator this rule matched all 66 of them, forcing them centred
     with a 9px gap at ID specificity that the cell's own rule could not beat. Which is why
     every attempt to move the icon and name did nothing whatsoever. */
  #menu-body > button:has(canvas.wallet), #ov-shop {
    display:flex; align-items:center; justify-content:center; gap:9px; }
  /* One size wherever it appears. `.ov-relic` sets 170px on any canvas inside the relic card,
     and the shop button's tile is a canvas inside the relic card — so on that one screen the
     little loot tile came out ten times too big. !important because the relic rule is more
     specific and this is the more specific INTENT: the wallet glyph has one size. */
  canvas.wallet { width:17px !important; height:17px !important; display:block; }
  /* armed, and about to throw everything away */
  #menu-body button.danger { border-color:#ff6d6d; color:#ff9d9d; box-shadow:0 0 0 2px #ff6d6d inset; }
  .menu-sub { font-size:var(--btn); font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--dim);
    margin:10px 0 2px; }
  .toggle { display:flex; justify-content:space-between; align-items:center;
    border:3px solid transparent; background:var(--panel); box-shadow:0 4px 0 #0b0918;
    padding:10px 14px; font-family:inherit; font-weight:900; text-transform:uppercase;
    letter-spacing:2px; font-size:var(--btn); color:var(--ink); cursor:pointer; }
  .toggle .val { color:var(--track); }
  .toggle.off .val { color:var(--dim); }
  .lvl-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .lvl-grid button { display:flex; flex-direction:column; gap:3px; padding:12px 0; line-height:1.1; }
  .tal-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  /* Stock is a square of glass, not a button: no outline, no offset plate, just a 5% white
     wash. A shop item is a thing on a shelf — fifteen bevelled plates read as a wall of
     controls. The border is kept and made transparent so .on and .nope can still colour it
     without shifting anything by 3px. The swatch is the item, so it gets the room. */
  /* Stacked from the top rather than centred, so the three parts sit at fixed heights instead
     of drifting with whatever the tallest one happens to be. The name is pulled up tight under
     the icon — they are one object, and a gap between them read as two. */
  /* Centred, with the price and the name given the SAME height and the same gap to the icon.
     Equal boxes above and below are what actually centres the icon — matching the gaps alone
     would still sit it off-centre by however much the two labels differed in height. */
  .tal-grid .tal { display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0; padding:3px 3px; overflow:hidden;
    background:rgba(255,255,255,0.05); border-color:transparent; color:#fff;
    box-shadow:0 4px 0 rgba(5,4,13,0.45); }
  /* ...and presses the same way the buttons do, since it is one */
  .tal-grid .tal:active { transform:translateY(4px); box-shadow:none;
    background:rgba(255,255,255,0.14); }
  /* display:block is doing the real work here. An inline canvas sits on a text baseline, and
     the descender space under it was leaving an 8px gap that no negative margin could explain
     — the name was tucked under the LINE BOX, not under the icon. */
  /* Each part is given an explicit height rather than being left to its own line box. Chasing
     this with negative margins did not work: the leading above and below a 10px line is most of
     what you are fighting, and a margin pulls the BOX, which is the thing that is too tall. */
  .tal-grid .tal canvas { display:block; width:46%; height:auto; aspect-ratio:1; }
  .tal-grid .tal > span:last-child { height:11px; line-height:11px; margin-top:4px; }
  /* the price is its own line under the name: the tile, then the number */
  .tal-grid .tal .price { display:flex; align-items:center; justify-content:center; gap:4px;
    height:11px; margin-bottom:4px; font-size:10px; line-height:11px;
    letter-spacing:0.2px; color:#ffd24a; }
  .tal-grid .tal .price canvas { width:11px; height:11px; }
  .tal-grid .tal .price.equipped { color:#8dff78; letter-spacing:0.5px; font-weight:900; }
  /* names are long ("Nightshard", "Green Sprig") and the cells are a third of a narrow
     menu — well below body size, tight leading, and allowed to wrap to two lines. */
  .tal-grid .tal span { font-size:10px; letter-spacing:0.2px; line-height:1.1;
                        text-align:center; hyphens:none; color:#fff; }
  /* Something you can still buy is tinted with the currency that buys it — a faint gold wash,
     enough to sort the shelf into "yours" and "for sale" at a glance without shouting. Its own
     price is already gold, so the tile reads as one object rather than a label on a plate. */
  /* Stock you do not own is GREY. It used to wear a wash of the gold that buys it, which read
     as "this one is special" rather than "this one is not yours yet" — and put a third gold on
     a screen that already has the purse and the buy banner arguing over the colour. */
  .tal-grid .tal.locked { background:rgba(150,156,172,0.15);
                          box-shadow:0 4px 0 rgba(20,22,32,0.55); }
  .tal-grid .tal.locked:active { background:rgba(150,156,172,0.26); }
  /* The one you have tried on goes fully gold — the colour of the money it wants — and its
     price row grows the word PURCHASE in front of the number. No banner, nothing added to the
     cell: the row was already there, so nothing moves and the grid cannot twitch as you browse. */
  /* background-COLOR, not the shorthand: the chequer above is a background-IMAGE, and
     `background:` would wipe it. Same trap the gold buttons carry a note about. */
  .tal-grid .tal.locked.preview { background-color:#e0aa1e; box-shadow:0 4px 0 #8a6410;
                                  color:#000; }
  /* EVERY span, not just the price row and the name: `.tal-grid .tal span` sets white, and the
     word and the number inside the price row are spans of their own — so colouring their parent
     black left the two bits of text that actually say the price still white on gold. */
  .tal-grid .tal.locked.preview .price,
  .tal-grid .tal.locked.preview span,
  .tal-grid .tal.locked.preview > span:last-child { color:#000; }
  .tal-grid .tal.locked.preview:active { background-color:#f0be3a; }
  /* Tried on but out of reach. Gold is the colour of the money, and wearing it on something
     you cannot buy is the offer made in a currency you do not have — grey says the same thing
     the price already said, in the same place, without promising anything. */
  .tal-grid .tal.locked.preview.poor, #menu-body .shop-buy.poor {
    background-color:#9aa1b2; box-shadow:0 4px 0 #4c5163; }
  .tal-grid .tal.locked.preview.poor:active { background-color:#aab1c2; }
  .tal-grid .tal.locked > span:last-child { color:#d8dceb; }   /* its name, cooled to match */
  /* what the talisman actually does — the reason to pick one over another */
  .tal-grid .tal .tal-blurb { font-size:9px; letter-spacing:0.2px; line-height:1.1; font-style:normal;
    text-transform:none; font-weight:700; color:var(--track); text-align:center; }
  /* What is worn reads as a lit plate rather than a ringed one — an outline on a square that
     already has a border competes with it, where a brighter ground just says "this one". */
  /* What you are WEARING is a solid green plate with the same chequer the gold ones carry, so
     the two states of a shelf — worn, and for sale — read as the same kind of thing in two
     colours rather than as two different treatments. background-COLOR again: the shorthand
     would wipe the chequer. */
  .tal-grid .tal.on { background-color:#5fd44e; border-color:transparent;
                      box-shadow:0 4px 0 #2b7a22; color:#000; }
  .tal-grid .tal.on span, .tal-grid .tal.on .price.equipped { color:#000; }
  .tal-grid .tal.on:active { background-color:#78e468; }
  /* The talisman shelf. Deliberately NOT buttons: no border, no plate, no shadow — a talisman
     is a thing you found, and dressing it in the same chrome as RESUME made it stock. What
     marks the worn one is a soft halo of its own colour, not a pressed-in frame. */
  .relic-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px 0; margin:2px 0 10px; }
  .relic { display:flex; flex-direction:column; align-items:center; gap:1px;
    background:none; border:0; padding:0; cursor:pointer; }
  .relic canvas { width:96px; height:96px; display:block; }
  .relic span { font-size:10px; letter-spacing:0.4px; line-height:1.15; text-align:center;
    text-transform:uppercase; font-weight:900; color:var(--ink); }
  .relic i { font-size:9px; letter-spacing:0.2px; line-height:1.1; font-style:normal;
    font-weight:700; color:var(--track); text-align:center; }
  .relic.locked { cursor:default; }
  .relic.locked span { color:var(--dim); }
  .relic.on canvas { filter:drop-shadow(0 0 7px var(--goal)); }
  .relic.on span { color:var(--goal); }
  /* SHOP wears the big title treatment — it is a destination, not a sub-menu */
  #menu-title.shop { font-size:40px; letter-spacing:7px; margin-bottom:4px; }
  /* The two shelves you actually own things on get the card headings' treatment: the same
     size, the same -4 degree tilt, and the same layered extrusion rather than a flat drop —
     built from the heading's OWN colour, which is what makes it read as carved out of the
     word instead of a shadow behind it. Each in its own metal, matching the button that
     opened it, so arriving on the screen confirms the button you pressed. */
  #menu-title.big { font-size:46px; letter-spacing:2px; line-height:1.05;
    transform:rotate(-4deg); margin-bottom:14px; }
  #menu-title.big.gilt { color:#ffd24a;
    text-shadow:1px 1px 0 #c79418, 2px 2px 0 #a87b18, 3px 3px 0 #8a6410, 4px 4px 0 #6b4d0c,
                5px 6px 10px rgba(5,4,13,0.65); }
  #menu-title.big.amber { color:#ffa24a;
    text-shadow:1px 1px 0 #c76a18, 2px 2px 0 #a85618, 3px 3px 0 #8a4610, 4px 4px 0 #6b360c,
                5px 6px 10px rgba(5,4,13,0.65); }
  /* the shop: him at the top, tucked right under the title, then a tab per category */
  .shop-fig { width:100%; max-width:230px; margin:-6px auto 0; }
  .shop-fig canvas { display:block; width:100%; height:auto; }
  /* the wallet, sitting on the picture rather than costing a line of its own */
  /* The count IS the wallet — the word "TILES" said nothing the coin beside it didn't, and
     it was the only reason the number had to stay small enough to leave room for it. */
  .shop-purse { display:flex; align-items:center; justify-content:center; gap:9px;
    margin:-4px auto 10px; font-size:26px; letter-spacing:1px; color:var(--track); font-weight:900; }
  .shop-purse canvas { width:26px; height:26px; }
  /* #menu-body button sets width:100%, and an id beats a class — so these have to match it */
  /* Six tabs, six equal columns, square. `repeat(7,1fr)` was left over from when there were
     seven and left a column's worth of dead space at the end; the squares came from letting the
     content set the height, which made them shorter than they were wide. */
  .shop-tabs { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:8px; }
  #menu-body .shop-tabs button { width:100%; aspect-ratio:1; padding:4px 0; font-size:8px;
    letter-spacing:0.2px; border-width:2px; box-shadow:0 3px 0 #0b0918;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    line-height:1; }
  #menu-body .shop-tabs button canvas { width:60%; height:auto; aspect-ratio:1; display:block; }
  /* The chosen tab is lit from within. A ring on a square that already has a border was two
     outlines arguing, and at this size the inner one ate the icon. */
  #menu-body .shop-tabs button.on { background:rgba(125,255,107,0.20); border-color:transparent;
    color:#dcffd4; box-shadow:none; }
  #menu-body .shop-tabs button:active { transform:translateY(3px); box-shadow:none; }
  /* the rack scrolls on its own, so the runner and the tabs stay put while you browse */
  /* max-height is set in JS by fitScrollRack(), because the only honest answer is "however
     far it is from here down to the button", and CSS cannot see where either of them landed.
     44vh was a guess that left a gap on tall screens and clipped a row on short ones. */
  /* No padding on the SIDES. It was 2px all round, which inset the stock by two pixels from
     the tabs above it and the button below — small enough to look like a mistake rather than a
     margin, which is exactly what it was. Vertical padding stays: that end scrolls. */
  .shop-rack { overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; padding:2px 0; margin-bottom:10px; }
  /* The pane you drag reaches the edges of the screen even though the stock in it does not:
     a thumb landing in the margin beside the shelf should still scroll the shelf. The card is
     capped and centred, so the rack breaks out of it to the viewport and the grid is centred
     back inside — which is why the grid carries its own width rather than filling its parent. */
  #menu.wide .shop-rack { margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); }
  /* ...and NOTHING else scrolls. The shop is a fixed frame with one moving part in it; the page
     itself sliding under the pinned button was the whole reason the button had to be pinned. */
  #menu.wide { overflow:hidden; }
  /* ...so the 80px kept clear under the rack for the pinned button is dead space now. The rack
     already stops short of the button by its own measurement; the reserve only pushed the card
     past the bottom of the screen and gave the page something to scroll.
     `.wide.top` and not just `.wide`: the shop is BOTH, and the 80px rule below is written
     against `.top`. At equal specificity the later rule wins, and it is the later rule. */
  #menu.wide.top #menu-body { padding-bottom:0; }
  /* ---- the Tileverse: a trail you walk UP, rather than a grid you scan ----
     The campaign is an order, and a grid says nothing about order — every cell looks equally
     like the next one. A single winding line does the whole job: where you have been is below
     you, where you are going is above, and the distance between two levels is a thing you can
     see. Level 1 sits at the bottom, so the map opens where the journey started and you climb.
     Absolute positions on a tall relative box, because the path is a curve and no flow layout
     draws a curve. */
  .lvl-map { position:relative; width:100%; }
  /* The cloud. A real grid — one track per column, one per row, identical gaps — so every tile
     lines up with its neighbours in both directions and the only irregular thing on screen is
     the outline the set of them makes. */
  /* No gap at all: the tiles touch, so the cloud is one object with a ragged edge rather than
     fifty-one objects near each other. */
  /* Room around it. The cloud is an object, and an object needs space to be one — pressed to
     the edges of the pane it reads as a table that has been cropped. The padding is part of the
     scrolling area rather than a frame around it, so the space above and below scrolls past
     with the cloud instead of pinning it. */
  /* Squares of a FIXED size — the same height as a button — rather than a share of whatever
     the panel happens to be. A cloud that resized itself with the window meant the campaign
     looked bigger on a wide phone than a narrow one, and it means a fifty-level cloud and a
     twelve-level one draw their tiles at different sizes. Now a tile is a tile. */
  .lvl-map.blob { display:grid; gap:0; box-sizing:border-box;
    padding:64px 40px; justify-content:center;
    grid-template-columns:repeat(var(--cols, 9), var(--btn-h));
    grid-auto-rows:var(--btn-h); }
  #menu-body .lvl-map.blob .stop { position:relative; transform:none; width:auto; height:auto;
    aspect-ratio:1; padding:0; overflow:hidden;
    background:transparent; border:0; box-shadow:none; }
  /* the level's own backdrop, nine squares of it, filling the tile */
  .lvl-map.blob .stop .swatch { position:absolute; inset:0; width:100%; height:100%;
    display:block; image-rendering:pixelated; }
  /* the number rides on top, dark-rimmed so it reads over any palette underneath */
  .lvl-map.blob .stop > span { position:relative; font-size:15px; font-weight:900; color:#fff;
    text-shadow:0 1px 0 rgba(5,4,13,0.9), 0 -1px 0 rgba(5,4,13,0.9),
                1px 0 0 rgba(5,4,13,0.9), -1px 0 0 rgba(5,4,13,0.9); }
  /* Open levels are shown as they ARE — full strength, no wash over them, cleared or not.
     Clearing a level does not change how it looks; it is the same place either way, and a green
     film over half the cloud was hiding the very palettes the tiles exist to show. */
  /* ...and everything past where you have got is drained: the colour is what tells you a level
     is somewhere you have been let into. */
  .lvl-map.blob .stop.shut .swatch { filter:grayscale(1) brightness(0.55); }
  .lvl-map.blob .stop.shut > span { color:#8b90a3;
    text-shadow:0 1px 0 rgba(5,4,13,0.9), 0 -1px 0 rgba(5,4,13,0.9),
                1px 0 0 rgba(5,4,13,0.9), -1px 0 0 rgba(5,4,13,0.9); }
  #menu-body .lvl-map.blob .stop.done { background:transparent; }
  .lvl-map.blob .stop:active .swatch { filter:brightness(1.35); }
  .lvl-map.blob .stop.shut:active .swatch { filter:grayscale(1) brightness(0.85); }
  /* The origin story, one square left of level one. Half-transparent because it is not a
     level — you cannot be "up to" it, and it should not read as a place you have not reached
     yet either, which is what the greyscale wash means everywhere else on this map. */
  #menu-body .lvl-map.blob .stop.intro { opacity:0.42; }
  #menu-body .lvl-map.blob .stop.intro:active { opacity:0.72; }
  .lvl-map.blob .stop.intro .play { position:absolute; inset:0; margin:auto;
    width:36%; height:36%; background:#fff;
    clip-path:polygon(12% 2%, 94% 50%, 12% 98%);
    filter:drop-shadow(0 1px 0 rgba(5,4,13,0.9)); }
  #menu-body .lvl-map.blob .stop.here { box-shadow:inset 0 0 0 3px var(--track); z-index:2; }
  #menu-body .lvl-map.blob .stop:active { transform:none; }
  #menu-body .lvl-map .stop {
    position:absolute; transform:translate(-50%,-50%);
    width:var(--stop, 62px); height:var(--stop, 62px); padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:16px; line-height:1;
  }
  #menu-body .lvl-map .stop:active { transform:translate(-50%,-50%) translateY(4px); box-shadow:none; }
  .lvl-map .stop .st { font-size:10px; letter-spacing:0; }
  .lvl-map .stop .st.none { color:var(--dim); }
  /* cleared: the same green the shop marks what you are wearing with, so "done" means one
     thing across the whole game */
  #menu-body .lvl-map .stop.done { background-color:#2f7a26; color:#eaffe6; }
  #menu-body .lvl-map .stop.done .st { color:#dcffd4; }
  /* where you are standing */
  #menu-body .lvl-map .stop.here { box-shadow:0 0 0 3px var(--track), 0 4px 0 #0b0918; }
  /* the stepping stones between one level and the next — square, because everything in this
     game is, and small enough that the levels stay the thing you are looking at */
  .lvl-map .step { position:absolute; width:9px; height:9px; transform:translate(-50%,-50%);
                   background:rgba(255,255,255,0.20); }
  /* the way out, and the only thing you can do wrong is not press it */
  /* The way out is pinned to the viewport, not to the end of the rack: the racks are
     different lengths and the shop is top-aligned, so otherwise it wanders down the page and
     on the long ones you have to scroll to leave. #menu-body sets width:100% and an id beats
     a class, so the width has to be restated here. */
  #menu-body .shop-go {
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 16px);
    width:calc(100% - 44px); max-width:330px; z-index:2;
    font-size:13px; letter-spacing:2px; padding:11px 10px; line-height:1.2;
  }
  #menu-body .shop-go:active { transform:translateX(-50%) translateY(4px); box-shadow:none; }
  /* The same offer as the cell, said again where your thumb already is. Pinned directly above
     the way out, in the same box, so the two read as one stack rather than as a button that
     has appeared in the middle of the shelf. */
  #menu-body .shop-buy {
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 16px + var(--go-h, var(--btn-h)) + 10px);
    width:calc(100% - 44px); max-width:var(--shop-w); z-index:2;
    font-size:13px; letter-spacing:2px; padding:11px 10px; line-height:1.2;
    display:flex; align-items:center; justify-content:center; gap:9px;
    background-color:#e0aa1e; border-color:transparent; color:#000; box-shadow:0 4px 0 #8a6410;
  }
  #menu-body .shop-buy:active { transform:translateX(-50%) translateY(4px); box-shadow:none; }
  #menu-body .shop-buy canvas { width:17px; height:17px; display:block; }
  /* ...and the rack keeps clear of it, so the last row is never stuck underneath */
  #menu.top #menu-body { padding-bottom:80px; }
  /* what the tab is showing, and what of it is on */
  .shop-worn { text-align:center; font-size:11px; letter-spacing:0.5px; color:var(--dim);
    text-transform:none; font-weight:700; margin:1px 0 2px; }
  /* can't afford it yet — a short shake rather than a dialog */
  .tal-grid .tal.nope { animation:nope 0.4s; border-color:#ff8f74; }
  @keyframes nope { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);}
                    50%{transform:translateX(4px);} 75%{transform:translateX(-2px);} }
  /* The level rack scrolls inside itself, exactly as the shop's does, so cells never slide
     under the pinned BACK. It has no runner or tab strip above it, so it takes everything
     between the INTRO button and the button's landing strip. */

  .lvl-grid .st { font-size:var(--body); color:var(--goal); letter-spacing:1px; font-weight:900; }
  .lvl-grid .st.none { color:var(--dim); font-weight:400; }

</style>
</head>

<script src="levels.js"></script>
<script>
(() => {
  "use strict";

  // ---------- Levels ------------------------------------------------------
  let COLS = 7, ROWS = 13;                   // per-level board size (set in beginLevel)
  const FULL_COLS = 7, FULL_ROWS = 13;       // fallback board size if a level omits cols/rows
  // --- TEST LEVEL: breaking stone is REQUIRED to reach the goal -----------
  // Three full-width barriers span the grid; the ONLY opening in each is a
  // stone tile, so the runner physically cannot advance without smashing it.
  // Verified by BFS: solvable when the stones can be broken, and impossible
  // if they were treated as unbreakable walls. The forced route passes over
  // all three stones ([3,8] and [1,5] before the key, [4,2] after) on the
  // way to the key and the exit.
  // 50-level campaign: each new mechanic is introduced on its own level (see `intro`).
  // The campaign lives in levels.js and nowhere else. It is loaded by the <script> tag
  // above as a global, so there is no second copy here to drift out of step with it.
  // `n` is the editor's label for a level; the game indexes by position and ignores it.
  const LEVELS = (typeof LEVELS_DATA !== "undefined" ? LEVELS_DATA : [])
                   .map(L => { const { n, ...rest } = L; return rest; });

  // ---------- DOM ---------------------------------------------------------
  const canvas = document.getElementById("game");
  let ctx = canvas.getContext("2d");     // `let`, so hint icons can borrow the game's own
                                        // drawing routines against another canvas (withCanvas)
  const elLevel = document.getElementById("level");
  const elReady = document.getElementById("ready");
  const elKey = document.getElementById("keystate");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ov-title");
  const ovMsg = document.getElementById("ov-msg");
  // The card's byline always reads as two balanced lines. CSS text-wrap:balance can even up
  // a line that already wraps but cannot force a short quip onto two, and a one-line card
  // sits at a different height from a two-line one — which is what makes the win screen
  // jump about between levels. Split on the word boundary nearest the middle.
  const escHtml = t => t.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  function setByline(el, text) {
    const w = String(text).split(/\s+/).filter(Boolean);
    if (w.length < 2) { el.textContent = text; return; }
    let cut = 1, best = Infinity;
    for (let i = 1; i < w.length; i++) {
      const d = Math.abs(w.slice(0, i).join(" ").length - w.slice(i).join(" ").length);
      if (d < best) { best = d; cut = i; }
    }
    el.innerHTML = escHtml(w.slice(0, cut).join(" ")) + "<br>" + escHtml(w.slice(cut).join(" "));
  }
  const ovBtn = document.getElementById("ov-btn");
  const ovShop = document.getElementById("ov-shop");
  const elScore = document.getElementById("score");
  const ovStars = document.getElementById("ov-stars");
  const ovScore = document.getElementById("ov-score");

  // ---------- Tunables ----------------------------------------------------
  // How many track tiles a level plays with. Three is the game's shape and what all 24
  // shipped levels use, but nothing in the engine assumes it: the count is the start cell
  // plus however many are pre-laid in `init`, and the runner's head is the last of them.
  // A level carrying more simply lists more cells. TILES_MAX is a sanity bound.
  const TILES_MAX = 8;
  const GRACE_MS = 2600;
  const MIN_CELL = 78, MAX_CELL = 170;
  const VIEW_COLS = 4.2, VIEW_ROWS = 6;
  const CAM_LERP = 0.009;
  // Slack, in CELLS, that the camera may travel past the outer edge of the board. Without
  // it the camera stops dead on the last row/column and the edge tiles sit welded to the
  // frame; a sliver of overshoot lets the backdrop breathe around the board. Every edge gets
  // the same slack — the top used to get double, which just read as a lopsided board.
  // How far past each edge the camera may travel. Half a cell, the same on all four sides.
  //
  // These used to differ — 0.22 at the sides, 0.38 at the top, 0.60 at the bottom — and every
  // one of those numbers was chosen to stop something LOOKING WRONG at the edge: too little and
  // the boundary courses were drawn and never seen; too much at the top and the board read as
  // having slipped down the screen; the bottom needed enough to keep the last row out from
  // under the talisman rack. Three numbers all tuned against the same worry, which was that
  // past the edge there was nothing to show.
  //
  // Now there is: the level's backdrop stops at the level and the cosmos shows around it. So
  // the reach is simply half a tile of it, evenly, and the edge is allowed to be seen.
  const CAM_EDGE_PAD   = 0.5;                 // left and right
  const CAM_TOP_PAD    = 0.5;
  const CAM_BOTTOM_PAD = 0.5;
  const TRACK_T = 0.44;        // platform thickness as fraction of cell (hangs below centre)
  const SAMPLE_D = 0.42;       // tangent smoothing window (path-param units)
  const FALL_G = 0.0022, FALL_MS = 850;   // gravity fall on lose
  // Running into a wall reads differently to running off a ledge, so it gets its own
  // beat: the runner concertinas against the face, then peels off and falls.
  const SQUASH_MS = 260;                  // how long the squash holds before gravity
  const SQUASH_X  = 0.52;                 // compression along travel at full squash
  const SQUASH_Y  = 1.26;                 // matching bulge across it (keeps the mass honest)

  // ---------- Sound engine ------------------------------------------------
  // A tiny Web Audio synth + backing band. Every cleared tile is one BEAT: the
  // runner moves at a constant ms-per-cell, so clears land at a perfectly even
  // cadence. Each beat plays the next note of a looping MELODY and, locked to
  // that same instant, a bass note, a soft kick, and an off-beat hi-hat; each
  // bar (4 beats) also (re)starts a sustained chord PAD. Because every beat is
  // anchored to a real tile event and the between-beat hat is scheduled on the
  // audio clock, the whole arrangement stays in sync with the tiles with no
  // drift, and its tempo tracks each level's speed. Resets each level.
  // ---------- Music -------------------------------------------------------
  // Tuned in music-lab.html and pasted here whole. A level may carry `music: {...}` in
  // levels.js to override any of these for itself; everything else falls through.
  const MUSIC_DEFAULTS = {
    seed: 0,
    scale: "pentaMajor",
    keyLock: 0,
    key: 0,
    prog: -1,
    chordType: "auto",
    melodyLeap: 0.15,
    melodyStart: -1,
    swing: 0,
    beatsPerTile: 4,
    midVel: 0.42,
    barLen: 4,
    bgEvery: 4,
    bgFollow: "chord",
    leadOn: 1,
    padOn: 0,
    kickOn: 1,
    hatOn: 1,
    subOn: 1,
    offBassOn: 1,
    leadVel: 0.8,
    padVel: 0.14,
    kickVel: 0.7,
    hatVel: 0.12,
    subVel: 0.85,
    offBassVel: 0.42,
    leadOct: 0,
    padOct: -12,
    master: 0.16,
    baseHz: 220,
    waveA: "sine",
    waveB: "sine",
    delayTime: 0.24,
    feedback: 0.34,
    damp: 2400,
    wet: 0.3,
    bassLpf: 340,
    kickHz: 130,
    kickDrop: 46,
    hatHz: 7000,
    voxOn: 0,
    voxStyle: "choir",
    voxVel: 0.2,
    voxOct: -12,
    voxVowel: 0.25,
    voxVib: 5.2,
    voxVibDepth: 8,
    voxSpread: 12,
    voxShimmer: 0.25,
    leadA: 0.008,
    leadD: 0.9,
    leadS: 0,
    leadR: 0.01,
    bgA: 0.3,
    bgD: 4.6,
    bgS: 0,
    bgR: 0.02,
    basA: 0.012,
    basD: 1.1,
    basS: 0,
    basR: 0.02,
    kickA: 0.005,
    kickD: 0.15,
    kickS: 0,
    kickR: 0.01,
    hatA: 0.003,
    hatD: 0.045,
    hatS: 0,
    hatR: 0.005,
    voxWet: 0.55,
    bassStyle: "classic",
    bassDrive: 0.3,
    bassSubVel: 1,
    bassFM: 1.5,
    bassGlide: 0.05
  };

  const Sound = (() => {
    const BASE = 220;                          // A3, in Hz
    const WAVES  = ["sine", "sine"];           // lead timbre alternates per step
    // Melody notes per cleared tile. The tile clear itself gets the full detuned
    // two-oscillator voice; the three notes between clears are single-oscillator
    // and quieter, so the ear still hears the clear as the downbeat.
    const SUBDIV  = 4;
    const MID_VEL = 0.42;                      // in-between note level, vs 0.8 on the clear
    // Lead melody + chord loop — regenerated per level by setSong(seed).
    let MELODY = [0, 4, 7, 4,  9, 7, 4, 2,  0, 4, 7, 12,  9, 7, 4, 2];
    let CHORDS = [ {root:0,tones:[0,4,7]}, {root:5,tones:[5,9,12]}, {root:9,tones:[9,12,16]}, {root:7,tones:[7,11,14]} ];
    let KEY = 0, PROGUSED = 0;
    // The live music settings: the defaults with this level's `music` block laid over them.
    // Named MU rather than M because ambTick() already has a local M, and shadowing it there
    // would be a trap rather than a convenience.
    let MU = { ...MUSIC_DEFAULTS };
    const mhz = semi => MU.baseHz * Math.pow(2, semi/12);
    let delayN = null, fbN = null, dampN = null, wetN = null;
    // Everything the music makes leaves through here. The sound effects do not, which is what
    // lets a level end silence the backing — including notes still ringing, and at bgEvery 8
    // a background note can be ten seconds long — without muting the win jingle on top of it.
    let musicBus = null;
    const SCALES = {
      pentaMajor:[0,2,4,7,9,12,14],       // the shipped sound: open, bright, no wrong notes
      pentaMinor:[0,3,5,7,10,12,15],      // instantly tense — the saw-level sound
      dorian:    [0,2,3,5,7,9,10,12],     // minor with a raised 6th: melancholy but not grim
      aeolian:   [0,2,3,5,7,8,10,12],     // natural minor, the darkest of these
      lydian:    [0,2,4,6,7,9,11,12],     // major with a #4: floaty, dreamlike
      hirajoshi: [0,2,3,7,8,12,14,15],    // Japanese pentatonic, very distinctive
      blues:     [0,3,5,6,7,10,12,15],
      wholeTone: [0,2,4,6,8,10,12,14],    // no home note at all — unsettling, use sparingly
    };
    const PROGS = [
      [0,5,7,5], [0,7,9,7], [0,5,9,7], [0,9,5,7], [0,4,5,7],   // the five the game ships
      [0,3,8,7], [0,10,5,7], [0,8,3,5], [0,0,5,5],             // minor-leaning + a static one
    ];
    const CHORDS_T = {
      triad:[0,4,7], minor:[0,3,7], sus4:[0,5,7], sus2:[0,2,7],
      min7:[0,3,7,10], maj7:[0,4,7,11], add9:[0,4,7,14], fifth:[0,7],
    };
    const MINORISH = { pentaMinor:1, dorian:1, aeolian:1, blues:1, hirajoshi:1 };
    
    function chordIvls(){
      if (MU.chordType !== "auto") return CHORDS_T[MU.chordType] || CHORDS_T.triad;
      return MINORISH[MU.scale] ? CHORDS_T.minor : CHORDS_T.triad;
    }
    const ENV = pre => ({ a:+MU[pre+"A"], d:+MU[pre+"D"], s:+MU[pre+"S"], r:+MU[pre+"R"] });
    function adsr(g, t, dur, vel, E){
      const v = Math.max(0.0002, vel);
      let a = Math.max(0.002, E.a), d = Math.max(0.002, E.d), r = Math.max(0.004, E.r);
      // A sustain of zero is a struck voice: attack, then ONE decay that dies inside the note.
      // The decay is capped by the note rather than fixed, which is what makes a short note snap
      // and a long one ring — the same shape every voice in this game had before it had an
      // envelope at all. Release has nothing left to do, so it sits this case out.
      if (E.s <= 0.0005) {
        const aa = Math.min(a, dur*0.5), dd = Math.min(d, Math.max(0.004, dur - aa));
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(v, t + aa);
        g.gain.exponentialRampToValueAtTime(0.0006, t + aa + dd);
        return aa + dd;
      }
      // An envelope has to fit inside its own note. Unclamped, a long decay made a SHORT note
      // ring on well past the next one — the notes filling the gaps between tile clears are a
      // fifth of a beat each, and a 0.9s tail on those is a smear, not a melody.
      const need = a + d + r;
      if (need > dur) { const k = dur / need; a *= k; d *= k; r *= k; }
      const sv = Math.max(0.0002, v * Math.min(1, Math.max(0, E.s)));
      const rel = Math.max(a + d, dur - r);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + a);
      g.gain.exponentialRampToValueAtTime(sv, t + Math.min(a + d, rel));
      g.gain.setValueAtTime(sv, t + rel);
      g.gain.exponentialRampToValueAtTime(0.0006, t + rel + r);
      return rel + r;                                     // how long the note actually runs for
    }
    const VOWELS = {
      ah: [[800,1150,2900],[1.00,0.50,0.25]],
      oo: [[325, 700,2530],[1.00,0.35,0.12]],
      oh: [[500,1000,2400],[1.00,0.45,0.18]],
      ee: [[270,2300,3000],[1.00,0.60,0.30]],
      eh: [[530,1850,2500],[1.00,0.55,0.22]],
    };
    const VOX_STYLES = {
      choir:    { vowels:["ah","oh"], wave:"sawtooth", voices:[-14,-5,5,14], oct:  0, q:7, sh:1.0 },
      nebula:   { vowels:["oo","ah"], wave:"sawtooth", voices:[-20,-7,7,20], oct:  0, q:5, sh:1.6 },
      monolith: { vowels:["oh","oo"], wave:"sawtooth", voices:[-9,-3,3,9],   oct:-12, q:9, sh:0.4 },
      aurora:   { vowels:["eh","ee"], wave:"triangle", voices:[-16,-6,6,16], oct: 12, q:6, sh:2.0 },
    };
    const _curves = {};
    function driveCurve(amt){
      const k = Math.round(Math.max(0.001, amt)*80);
      if (_curves[k]) return _curves[k];
      const n = 1024, c = new Float32Array(n);
      for (let i=0;i<n;i++){ const x = i*2/n - 1; c[i] = (1+k)*x/(1+k*Math.abs(x)); }
      return (_curves[k] = c);
    }
    function voxVoice(t, semi, dur, vel){
      const S = VOX_STYLES[MU.voxStyle] || VOX_STYLES.choir;
      const A = VOWELS[S.vowels[0]], B = VOWELS[S.vowels[1]], u = MU.voxVowel;
      const f = mhz(semi + S.oct);
      const out = ac.createGain();
      dur = adsr(out, t, dur, vel, ENV("bg"));
      out.connect(musicBus);
      if (MU.voxWet > 0){ const w = ac.createGain(); w.gain.value = MU.voxWet; out.connect(w); w.connect(sendBus); }
    
      // the singers, all sharing one vibrato so they breathe together rather than fight
      const raw = ac.createGain(); raw.gain.value = 1/(S.voices.length+1);
      const lfo = ac.createOscillator(); lfo.type="sine"; lfo.frequency.value = MU.voxVib;
      const lfoG = ac.createGain(); lfoG.gain.value = MU.voxVibDepth;
      lfo.connect(lfoG); lfo.start(t); lfo.stop(t+dur+0.1);
      const spread = MU.voxSpread/14;
      for (const c of S.voices){
        const o = ac.createOscillator(); o.type = S.wave;
        o.frequency.setValueAtTime(f, t); o.detune.setValueAtTime(c*spread, t);
        lfoG.connect(o.detune);
        o.connect(raw); o.start(t); o.stop(t+dur+0.1);
      }
      if (MU.voxShimmer > 0){                      // the octave-up ghost
        const o = ac.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(f*2, t);
        const g = ac.createGain(); g.gain.value = MU.voxShimmer*S.sh*0.18;
        lfoG.connect(o.detune);
        o.connect(g); g.connect(raw); o.start(t); o.stop(t+dur+0.1);
      }
      for (let i=0;i<3;i++){                      // the formant bank — the voice itself
        const bp = ac.createBiquadFilter(); bp.type="bandpass";
        bp.frequency.value = A[0][i]*(1-u) + B[0][i]*u;
        bp.Q.value = S.q;
        const g = ac.createGain(); g.gain.value = A[1][i]*(1-u) + B[1][i]*u;
        raw.connect(bp); bp.connect(g); g.connect(out);
      }
      const body = ac.createGain(); body.gain.value = 0.18;   // a little raw tone underneath, or
      raw.connect(body); body.connect(out);                    // the formants sound hollow
    }
    function bassHeavy(t, semi, dur, vel){
      const style = MU.bassStyle, f = mhz(semi);
      const out = ac.createGain();
      dur = adsr(out, t, dur, vel, ENV("bas"));
      const lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.Q.value = 1.1;
      lp.frequency.setValueAtTime(MU.bassLpf*2.2, t);                       // a filter sweep down
      lp.frequency.exponentialRampToValueAtTime(Math.max(60, MU.bassLpf), t+Math.max(0.05,dur*0.5));
      out.connect(lp); lp.connect(musicBus);
      const sub = ac.createOscillator(); sub.type="sine";
      sub.frequency.setValueAtTime(f*(1 + MU.bassGlide*2), t);              // dips into pitch
      sub.frequency.exponentialRampToValueAtTime(f, t+Math.max(0.01, MU.bassGlide));
      const sg = ac.createGain(); sg.gain.value = MU.bassSubVel;
      sub.connect(sg); sg.connect(out); sub.start(t); sub.stop(t+dur+0.06);
      if (style !== "rumble"){
        const b = ac.createOscillator(); b.type = style==="growl" ? "square" : "sawtooth";
        b.frequency.setValueAtTime(f*2, t);
        if (style === "growl"){                                            // FM snarl
          const mod = ac.createOscillator(); mod.type="sine"; mod.frequency.value = f*MU.bassFM;
          const mg = ac.createGain(); mg.gain.value = f*1.8;
          mod.connect(mg); mg.connect(b.frequency); mod.start(t); mod.stop(t+dur+0.06);
        }
        const sh = ac.createWaveShaper(); sh.curve = driveCurve(MU.bassDrive); sh.oversample="2x";
        const bg = ac.createGain(); bg.gain.value = style==="deep" ? 0.55 : 0.42;
        b.connect(sh); sh.connect(bg); bg.connect(out); b.start(t); b.stop(t+dur+0.06);
      }
    }
    function bgNotes(s, chord){
      if (MU.bgFollow === "chord") return chord.tones;
      // "melody" walks the tune at the background's own pace — one melody note per background
      // note. "lead" reads the note the melody is actually on at that instant, which is the
      // literal match but can land on the same note every time: the tune loops every
      // MELODY.length/beatsPerTile beats (8, as shipped), so any bgEvery that is a multiple of
      // that samples the same point of the loop forever. That is a drone, which may well be what
      // you want under a melody — but it is worth knowing which one you have chosen.
      const idx = MU.bgFollow === "melody"
        ? Math.floor(s / Math.max(1, MU.bgEvery|0))
        : s * MU.beatsPerTile;
      const lead = MELODY[((idx % MELODY.length) + MELODY.length) % MELODY.length];
      if (MU.bgFollow === "lead" || MU.bgFollow === "melody") return [lead];
      const out = [lead];                                    // leadChord: melody on top, chord under
      for (const tn of chord.tones) if ((((tn - lead) % 12) + 12) % 12 !== 0) out.push(tn);
      return out;
    }
    let ac = null, master = null, sendBus = null, noiseBuf = null;
    let warpDry = null, warpWet = null, warpLfo = null;
    let muted = false, step = 0, beatSec = 1.15;

    // Pick a fresh melody + chord progression from a seed (each level differs). This is
    // the music lab's buildSong, verbatim — tools/check.mjs holds the two to each other.
    function setSong(seed){
      const rnd = mulberry32((seed>>>0)||1);
      const SC = SCALES[MU.scale] || SCALES.pentaMajor;
      const tr0 = [-5,-3,0,0,2,4,5,7][Math.floor(rnd()*8)];
      KEY = MU.keyLock ? MU.key : tr0;
      let d = MU.melodyStart >= 0 ? MU.melodyStart : 2 + Math.floor(rnd()*3);
      if (MU.melodyStart >= 0) rnd();                       // keep the call order stable
      MELODY = [];
      for (let i=0;i<32;i++){
        d += Math.floor(rnd()*3)-1;
        if (rnd() < MU.melodyLeap) d += Math.floor(rnd()*3)-1;
        d = Math.max(0, Math.min(SC.length-1, d));
        MELODY.push(SC[d] + KEY);
      }
      const pi = Math.floor(rnd()*5);

  // One painter for all five. Each keeps its own metal; the shape, the shading and the

  const rr2 = (g,x,y,w,h,r)=>{ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);
    g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };

  function swatchBust(g, S, body, ink, fin, ts){
    const w = S*0.42, h = S*0.42, x = S/2 - w/2, y = S*0.30;
    g.fillStyle = (fin && fin.paint) ? fin.paint(g, x, y, w, h, ts||0) : body;

    g.beginPath(); g.arc(S/2 - w*0.16, y + h*0.40, S*0.035, 0, 7); g.fill();

  // ---- finishes -------------------------------------------------------------------
  // A finish is a colour that isn't one colour. `paint` hands back a fillStyle for a given
  // rect — a gradient, usually — and the optional `sheen` draws over the top of it, clipped
  // to the same shape. Both are handed the rect in whatever frame the runner is drawn in, so
  // a rolling metal ball's highlight rolls with it for free.
  //
  // Metal is the whole trick behind most of these: not light-to-dark shading, but a bright
  // band where the sky reflects and a dark one where the floor does, with the flip between
  // them tight enough to read as polish rather than as a gradient.
  const metal = (dark, mid, lite, hi) => (g, x, y, w, h) => {
    const gd = g.createLinearGradient(x, y, x + w*0.35, y + h);
    gd.addColorStop(0.00, mid);  gd.addColorStop(0.28, lite);
    gd.addColorStop(0.44, hi);   gd.addColorStop(0.60, lite);
    gd.addColorStop(0.80, mid);  gd.addColorStop(1.00, dark);

  // A highlight travelling across the body on a loop — the thing that separates polished from
  // merely shiny. A metal gradient alone is a photograph of a reflection; what tells you a
  // surface is glossy is the reflection MOVING while the object does not.
  //
  // It sweeps along the body's own +x, which is the runner's direction of travel, so the glint
  // runs front to back the way a light he is passing under would. It starts before the leading
  // edge and finishes past the trailing one, so the band is never seen to appear or vanish
  // mid-body. The phase is offset a third of a turn so a STILL of it — the shop swatch, drawn
  // at ts 0 — catches the band on the body rather than parked off the end of it.
  const glint = (col, ms, wide, alpha) => (g, x, y, w, h, ts) => {
    const u = (((ts || 0) % ms) / ms + 0.33) % 1;
    const cx0 = x - w*0.35 + w*1.7*u;
    const k = Math.max(1, w*wide);
    // slanted: the two ends of the gradient sit at opposite corners, so the band leans the way
    // a highlight on a rounded body does rather than standing up like a bar
    const gd = g.createLinearGradient(cx0 - k, y + h, cx0 + k, y);

  const spectrum = (speed, sat, lum, spread) => (g, x, y, w, h, ts) => {

    for (let k = 0; k <= 6; k++) gd.addColorStop(k/6, `hsl(${(base + k*spread) % 360} ${sat}% ${lum}%)`);
    return gd;

  HATS.forEach(h => { if (h.id === "none") return;

  // Nyan-style ribbons: a band of parallel stripes laid along the runner's recent path,
  // exactly as deep as his body. Stored outermost-first; the drawing offsets each stripe
  // along the path's normal, so they stay parallel round corners instead of nesting.
  const TRAILS = [
    { id:"none", name:"None", cost:0, cols:null, swatch:(g,S)=>swatchBust(g,S,"#bfe6ff","#17263f") },
    { id:"rainbow", name:"Rainbow", cost:5, cols:["#ff595e","#ff924c","#ffca3a","#8ac926","#1982c4"] },
    { id:"spark",   name:"Sparks",  cost:5, cols:["#ffe9a8","#ffd24a","#ff9e4d"] },
    // A plain ribbon and nothing else — no wobble, no taper, no particles — in the one colour
    // that reads as an absence rather than a colour. It takes Coolant's slot because Ripple
    // already owns the ice ground and does more with it.
    //
    // The ID stays `cyan`. It is the key the wallet remembers a purchase by, so changing it
    // would quietly delete Coolant from anyone who had bought it and keep their tiles. A
    // reskin should cost the player nothing; the id is bookkeeping, the name is the product.
    // ONE stripe, so the band is the full depth of him rather than three thinner ones with
    // seams between. A shadow is a single solid thing; splitting it into stripes gave it an
    // internal structure that a shadow does not have.
    { id:"cyan",    name:"Shadow",  cost:10, cols:["#000000"] },
    { id:"scarlet", name:"Scarlet", cost:10, cols:["#b3081a"] },
    { id:"rose",    name:"Rose",    cost:10, cols:["#ffd6e8","#ff9ec7","#e0559a"] },
    // ---- the same ribbon, made to move ----
    { id:"ripple",  name:"Ripple",  cost:15, cols:["#dffaff","#7fe4ff"],
      wobble:0.55, freq:0.42, speed:170 },
    { id:"serpent", name:"Serpent", cost:15, cols:["#173d1d","#5ad46b","#c8ffb0"],
      wobble:0.85, freq:0.30, speed:260 },
    { id:"comet",   name:"Comet",   cost:20, cols:["#ffffff","#ffe9a8","#ff9e4d"], taper:true },
    { id:"morse",   name:"Morse",   cost:20, cols:["#9ad9ff","#2f8fd6"], dash:true },
    // ---- no ribbon at all: what he sheds, left to thin out ----
    { id:"embers",  name:"Embers",  cost:25, style:"dots", cols:["#fff0b8","#ffb03a","#e5482a"],
      dot:0.20, fade:1.6 },
    { id:"bubbles", name:"Bubbles", cost:25, style:"dots", cols:["#dffaff","#a6e9ff","#ffffff"],
      dot:0.26, fade:1.0, wobble:0.30, freq:0.6, speed:300 },
    { id:"static",  name:"Static",  cost:30, style:"dots", cols:["#ffffff","#c9a4ff","#7a5cff"],
      dot:0.11, fade:2.2, grow:false, wobble:0.9, freq:1.7, speed:90 },
  ];
  // The swatch is the TRAIL and nothing else. It used to draw the runner as well, which left
  // barely a third of the tile for the thing being sold and made every option look alike; and
  // a trail is a shape that only reads over distance, so it needs the whole width. Each style
  // is drawn the way it actually draws in play — wobble, taper, dash, particles — and fades
  // out along its length, so the head end is the solid one.
  TRAILS.forEach(t => { if (!t.cols) return;
    t.swatch = (g, S) => {
      const n = t.cols.length, x0 = S*0.05, x1 = S*0.95, mid = S*0.5, band = S*0.42;
      if (t.style === "dots") {
        for (let k = 0; k <= 30; k++) {
          const u = k/30, x = x0 + (x1-x0)*u;
          const wob = t.wobble ? Math.sin(k*(t.freq||0.5)*1.6) * band*0.55*t.wobble : 0;
          const r = band*0.30 * (t.grow === false ? 1 : 0.32 + u*0.68);
          if (r < 0.4) continue;
          g.globalAlpha = Math.pow(u, t.fade || 1.3);
          g.fillStyle = t.cols[k % n];
          g.beginPath(); g.arc(x, mid + wob, r, 0, 7); g.fill();
        }
        g.globalAlpha = 1; return;
      }
      const sw = band/n, SEG = 44;
      const wobAt = u => t.wobble ? Math.sin(u*14*(t.freq||0.5)) * band*0.42*t.wobble : 0;
      const tpAt  = u => t.taper  ? (0.16 + 0.84*u) : 1;
      for (let i = 0; i < n; i++) {
        g.fillStyle = t.cols[i];
        for (let c = 0; c < SEG; c++) {
          if (t.dash && (c % 2)) continue;
          const u0 = c/SEG, u1 = (c+1)/SEG;
          g.globalAlpha = Math.pow(u1, 1.5);
          const xa = x0+(x1-x0)*u0, xb = x0+(x1-x0)*u1;
          const a0 = tpAt(u0), a1 = tpAt(u1), w0 = wobAt(u0), w1 = wobAt(u1);
          g.beginPath();
          g.moveTo(xa, mid + (i-n/2)*sw*a0 + w0);
          g.lineTo(xb, mid + (i-n/2)*sw*a1 + w1);
          g.lineTo(xb, mid + (i-n/2+1)*sw*a1 + w1);
          g.lineTo(xa, mid + (i-n/2+1)*sw*a0 + w0);
          g.closePath(); g.fill();
        }
      }
      g.globalAlpha = 1;
    }; });
  // "None" has no trail to show, so it shows the absence of one rather than a runner.
  TRAILS[0].swatch = (g,S) => {
    g.globalAlpha = 0.22; g.strokeStyle = "#bfc6e0";

    g.beginPath(); g.moveTo(S*0.10, S*0.5); g.lineTo(S*0.90, S*0.5); g.stroke();
    g.setLineDash([]); g.globalAlpha = 1;
  };

  // SWAGGER — the way he runs. Every field is a multiplier or an addition on top of the
  // RUNNER tuning rather than a replacement for it, so retuning the runner in the lab still

  //   lean  extra body tilt, radians (negative = leaning back)
  //   bob / swing / lift  scale the stock rise, stride reach and foot lift
  //   hop   one big bounce per stride, fraction of a cell

    // a NEGATIVE hover: the ball sinks until it is all but touching the track, because a
    // roll that happens in mid-air is just a spin
    { id:"roll",    name:"Rolling",   cost:10, pose:"fetal",   spin:0.0055, hover:-0.068, bob:0 },
    // Seven more built from the same handful of knobs — a pose, how far he leans, how hard he
