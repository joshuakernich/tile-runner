    { id:"pogo",    name:"Pogo",      cost:30, pose:"onefoot", hop:0.26, bob:0.05, swing:0.20, lift:0 },
  ];
  // Each swatch is the same bust in the pose that style would hold it in — a still frame
  // reads the difference far better than a name does.
  SWAGGERS.forEach(w => { w.swatch = (g,S) => {
    g.save(); g.translate(S/2, 0);
    if (w.lean)  g.rotate(w.lean*0.8);
    if (w.spin)  g.rotate(0.7);
    if (w.hover || w.hop) g.translate(0, -S*(w.hover||w.hop)*0.8);
    g.translate(-S/2, 0);
    const b = swatchBust(g, S, "#bfe6ff", "#17263f");
    // a suggestion of legs under the body, in whatever the style holds them in
    g.strokeStyle = "#bfe6ff"; g.lineWidth = S*0.05; g.lineCap = "round"; g.lineJoin = "round";
    const bx = S/2, by = b.y + b.h, u = S*0.11;
    g.beginPath();
    if (w.pose === "lotus") {                     // cross-legged: a shallow fold under him
      g.moveTo(bx - b.w*0.20, by); g.lineTo(bx - b.w*0.60, by + u*0.52); g.lineTo(bx - b.w*0.06, by + u*0.80);
      g.moveTo(bx + b.w*0.20, by); g.lineTo(bx + b.w*0.60, by + u*0.52); g.lineTo(bx + b.w*0.06, by + u*0.80);
    } else if (w.pose === "fetal") {              // curled: knees out front, feet tucked under
      g.moveTo(bx - b.w*0.16, by); g.lineTo(bx + b.w*0.44, by - u*0.42); g.lineTo(bx + b.w*0.08, by + u*0.30);
      g.moveTo(bx + b.w*0.16, by); g.lineTo(bx + b.w*0.82, by - u*0.56); g.lineTo(bx + b.w*0.44, by + u*0.30);
    } else if (w.pose === "onefoot") {            // one leg down, the other bent up under him
      g.moveTo(bx + b.w*0.20, by); g.lineTo(bx + b.w*0.26, by + u*1.05);
      g.moveTo(bx - b.w*0.20, by); g.lineTo(bx + b.w*0.20, by + u*0.44); g.lineTo(bx - b.w*0.42, by + u*0.74);
    } else {
      const rch = S*0.09*(w.swing == null ? 1 : w.swing);
      g.moveTo(bx - b.w*0.20, by); g.lineTo(bx - b.w*0.20 - rch, by + u);
      g.moveTo(bx + b.w*0.20, by); g.lineTo(bx + b.w*0.20 + rch, by + u);
    }
    g.stroke();
    g.restore();
  }; });

    { key:"drip",   label:"Drip",    items:SKIN_COLOURS },
    { key:"hat",    label:"Hat",     items:HATS },
    { key:"trail",   label:"Trail",   items:TRAILS },
    { key:"swagger", label:"Swagger", items:SWAGGERS },
    { key:"kicks",   label:"Kicks",   items:KICKS },
    { key:"track",   label:"Track",   items:TRACKS },

  // else — and turns its cell into its own buy button. Nothing is spent until you tap it again.
  // It rides in FRONT of `settings.look` rather than replacing it, so the moment it is cleared
  // the real look is back: there is nothing to restore and so nothing to get wrong.
  let shopPreview = null;                 // { key, id }, or null
  const shopScroll = {};                  // how far down each tab's rack was left
  const lookOwned = k => (settings.look && settings.look[k]) || LOOK.find(l=>l.key===k).items[0].id;
  const lookWorn = k => (shopPreview && shopPreview.key === k ? shopPreview.id : null) || lookOwned(k);
  const lookItem = k => { const cat = LOOK.find(l=>l.key===k);

  // owned or the runner would have nothing to wear on level 1 — and everything else is locked
  // until it is bought. The whole shop totals 222 tiles against 111 coins in the campaign, so
  // it is two full clears, every coin collected, to own the lot.
  const UNLOCK_ALL = false;
  const owns = it => UNLOCK_ALL || it.cost === 0 || wallet.owned.has(it.id);
  function wearLook(k, id){ settings.look = settings.look || {}; settings.look[k] = id; saveSettings(); }

  // ---------- Per-level look (background theme + track colour) -----------
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  // a distinct background theme per level (colours / patch size / angle / style)
  function genTheme(seed){
    const rnd=mulberry32((seed^0x9e3779b9)>>>0 || 7);
    const baseH=rnd()*360, N=4+Math.floor(rnd()*4);
    const sat=(28+rnd()*34)|0, lig=(24+rnd()*18)|0;            // muted (lifted from the old 15–30% range)
    // How far round the hue wheel the whole set walks. It used to run 50..330 degrees, which
    // at the top end put reds next to greens next to blues in one quilt — a patchwork, not a
    // gradient. Level 25 was the one everybody liked: about 110 degrees across six patches,
    // so each square is a clear step from its neighbour without the set ever leaving its own
    // family of colour. This range is built around that. Every backdrop in the game comes
    // through here — levels, the title, the cinematic — so they all soften together.
    const spread=45+rnd()*85, colors=[];
    for(let i=0;i<N;i++){ const h=((baseH+spread*i/N)%360)|0; colors.push("hsl("+h+","+sat+"%,"+lig+"%)"); }
    // A quilt wants to sit square-on or on-point, not at an arbitrary tilt — an angle
    // between the two reads as a mistake rather than a choice. Pick one, then add a
    // small hand-sewn wobble so it never looks machine-aligned.
    // patchW is a fraction of the CELL, and stays under PATCH_MAX so a background patch
    // is never within 30% of a foreground tile — see the clamp in drawPatchwork().
    // stripeW is a WHOLE number of patches: a fractional stripe width makes the staircase
    // steps uneven, which reads as a mistake rather than as a diagonal.
    return { colors, patchW:0.38+rnd()*0.32,
             dir:rnd()<0.5?1:-1,                               // which way the stripes lean
             stripeW:2+Math.floor(rnd()*3),                    // patches per stripe
             drift:(rnd()<0.5?1:-1)*(0.2+rnd()*0.5) };

  // HSL -> "#rrggbb" (so hexA() can add alpha to the platform colours)
  function hslHex(h, s, l){
    s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
    const f=n=>l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    const to=x=>Math.round(x*255).toString(16).padStart(2,"0");
    return "#"+to(f(0))+to(f(8))+to(f(4));
  }
  // per-level platform colour: a vivid beam + a light running-surface highlight
  function genTrackPal(seed){
    const rnd=mulberry32((seed^0x2545f491)>>>0 || 5);
    const h=Math.floor(rnd()*360), s=80+Math.floor(rnd()*15);

  }
  // A worn track skin overrides the level's generated palette; "Level" keeps it.
  const curTrack = () => lookItem("track").track || (state && state.trackPal && state.trackPal.track) || getVar("--track");
  const curRail  = () => lookItem("track").rail  || (state && state.trackPal && state.trackPal.rail)  || getVar("--rail");

  function loadLevel(i) { endCeremony();                            // no ceremony survives a load
                         Sound.warp(false); Sound.ambient(null);   // the tiles drive the music now
    levelIdx = clamp(i, 0, LEVELS.length - 1);
    levelAttempts[levelIdx] = (levelAttempts[levelIdx] || 0) + 1;      // count each start (incl. retries)

  function beginLevel(L, label) {

      ? _sHash(L.stone[0][0] + 1, L.stone[0][1] + 1) % _STONE_VARS.length : 0;

    // says so. linkParkedTiles runs once the board is up (see the end of this function) and
    // pulls in whatever legally continues the track, so `init` is a set of PLACEMENTS rather
    // than an authored route: line them up and they chain themselves in the order the track
    // reaches them; scatter them and they just lie there waiting to be dragged.
    //
    // Levels written under the old rules are unaffected: their init cells already form a

    // exactly the path they used to be given outright.
    const cells = [L.start, ...L.init].slice(0, TILES_MAX);

    const cps = L.cps || DEFAULT_CPS;

      speedTier, startSpeedMult, baseSpeed: L.speed,
      // Crack variation is dealt round-robin (rotated per level) rather than picked from a

      // instead of leaving it to chance — the old hash gave level 18 four Var-1 stones of five.
      stones: new Map((L.stone || []).map((w, i) => [key(w[0], w[1]),

      shards: [],
      // A level may have NO exit at all, in which case there is nothing to reach and the
      // run only ends when he falls. Everything downstream checks for null rather than
      // assuming a cell, so an endless level needs no other special case.
      goal: L.goal ? { c:L.goal[0], r:L.goal[1] } : null,
      keyCollected:false,
      runIdx:0, runT:0, msPerCell:effSpeed, speedMult:1, cpsNow: 1000/effSpeed,
      status:"play", drag:null, fall:null, runPhase:0,
      score:0, combo:0, maxCombo:0, coins:0, elapsed:0, flowClears:0,
      purse:0,                     // tiles found this run, unbanked until the flag is reached
      par: L.par || 24000,
      shake:0, beatPulse:0, pops:[], lights:[], laidFlash:[], trail:[], trailT:0,
      // --- Batch 2: optional extra cell types & hazards ---
      coinCells: new Set((L.coins||[]).map(c=>key(c[0],c[1]))),
      // [c, r, id] — a talisman sits on the floor and is grabbed by passing over it
      talismans: (L.talismans||[]).filter(t => talLive(t[2]))

      coinsGot: 0,
      keys: (L.keys || (L.key ? [[L.key[0], L.key[1], "#ffd24a"]] : [])).map(k=>({ c:k[0], r:k[1], color:k[2]||"#ffd24a", got:false })),
      doors: (L.doors||[]).map(d=>({ c:d[0], r:d[1], color:d[2]||"#ff6d6d", open:false, reached:false })),
      // linked switch/door groups: every switch (arcade button on a wall) in a group must be
      // tapped to slide its door open. Each group gets its own colour + wires to the door.
      gateGroups: (L.gates||[]).map((g,i)=>({
        door:{ c:g.door[0], r:g.door[1] }, doorKey: key(g.door[0], g.door[1]),
        switches: (g.switches||[]).map(s=>({ c:s[0], r:s[1], used:false })),
        openT: 0, color: GATE_COLORS[i % GATE_COLORS.length],
      })),
      boost: new Set((L.boost||[]).map(c=>key(c[0],c[1]))),
      slow:  new Set((L.slow ||[]).map(c=>key(c[0],c[1]))),
      speedFx: { kind: null, t: 0 },        // active timed speed effect from a collected pickup
      reviveHold: 0,                        // ms left of the Ankh's pause, if he has just used one
      // Her track is given outright — a list of cells, run end to end. `lover` on a level is
      // the whole feature: no tiles to lay, nothing to solve, just somebody running beside you.
      lover: (L.lover && L.lover.length > 1)
        ? { path: L.lover.map(p => ({ c:p[0], r:p[1] })), idx:0, t:0, phase:0 } : null,
      // The worn talisman's one shot at this level: armed on load, spent on the button.
      // kind is the id while the effect runs; armed survives past it for the Finger, which
      // waits for a tile to be pressed rather than running on a clock.
      power: { spent: false, kind: null, t: 0, ms: 0, armed: false },
      coinFly: [],                          // coins on their way to him, pulled by the Magnet
      loop: null,                           // a circuit he is going round, once we are sure
      vortex: null,                         // ...and what happens to the world when he is
      singularity: new Set((L.singularity||[]).map(c=>key(c[0],c[1]))),
      collapsed: new Set(),
      eaten: [],                            // tiles the rift is currently swallowing
      // fixed platforms: permanent free track cast into a wall plinth (see trackConnects)
      platforms: (L.platforms||[]).map((p,i)=>({ id:i, c:p[0], r:p[1], dirs:parsePfDirs(p[2]), lit:0 })),
      platformMap: new Map(),
      hazards: (L.hazards||[]).map(h=>{ const ax = h.axis||"h", kind = h.kind||"saw";
        if (kind === "monster") {

          // A variant may be named outright; otherwise it is inferred, so the older data that
          // only carried a path still means what it always did.
          const variant = h.variant || (h.path ? "patrol" : ax === "v" ? "vrail" : "hrail");
          const K = MONSTER_KINDS[variant] || MONSTER_KINDS.patrol;

          if (K.move === "rail") {

            const t = u <= 1 ? u : 2 - u, dir = u <= 1 ? 1 : -1;

      // movable "sliding platform": a wall band whose crossing point the player drags into place

      sliderDrag: null,

      mdoorDrag: null,

    markOccDirty();

    if (elLevel) elLevel.textContent = label;

    updateScoreHud();
    updateKeyHud();

  function updateReadyHud() {

  }
  function updateScoreHud() { if (elScore) elScore.textContent = String(state.score); }
  // ---------- the Cloak of Light's golden dust -----------------------------
  // Shed from him while the Cloak is up and left behind to fade, so the trail is something the
  // board keeps for a moment rather than a shape stuck to his back. Kept ticking after the
  // power ends so the last of it settles instead of vanishing mid-air.
  const STAR_DUST_MS = 620;
  function tickStarDust(dt) {
    const s = state;
    if (!s.starDust) s.starDust = [];

      const ri = runnerInfo();
      // His local +x is the way he is travelling, so everything is shed along -x: dropped
      // behind him and drifting further back, which is what makes it read as a trail rather
      // than sparks coming off a firework. The old version threw them upward, so they hung
      // over him instead of falling away.
      // Both offsets are taken in HIS frame — back along the reverse of travel, up along the
      // surface normal. Using world "up" for the body offset put the dust in front of him
      // whenever he ran vertically: up-screen and behind-him are the same axis there, and the
      // taller of the two offsets won.
      const tx = ri.tx, ty = ri.ty, nx = ri.nx, ny = ri.ny;
      for (let k = 0; k < 3; k++) {
        const back  = cell * (0.10 + Math.random()*0.26);        // how far behind it starts
        const up    = cell * (0.06 + Math.random()*0.34);        // up his body, not off it
        const drift = cell * (0.00030 + Math.random()*0.00032);  // it keeps falling further back
        s.starDust.push({
          x: ri.sx - tx*back + nx*up + (Math.random()*2 - 1) * cell*0.05,
          y: ri.sy - ty*back + ny*up + (Math.random()*2 - 1) * cell*0.05,
          vx: -tx*drift + (Math.random()*2 - 1) * cell*0.00010,
          vy: -ty*drift + (Math.random()*2 - 1) * cell*0.00010,
          sz: cell*(0.03 + Math.random()*0.045),
          life: 0, max: STAR_DUST_MS * (0.6 + Math.random()*0.8),
        });
      }
    }
    if (!s.starDust.length) return;
    for (const d of s.starDust) { d.life += dt; d.x += d.vx*dt; d.y += d.vy*dt; }
    s.starDust = s.starDust.filter(d => d.life < d.max);
  }
  function drawStarDust() {
    const s = state;
    if (!s.starDust || !s.starDust.length) return;
    ctx.save();
    for (const d of s.starDust) {
      const u = d.life / d.max;
      ctx.globalAlpha = (1 - u) * 0.9;
      ctx.fillStyle = u < 0.45 ? "#fff6d0" : "#ffd24a";   // white-hot, cooling to gold
      const r = d.sz * (1 - u*0.55);
      ctx.fillRect(d.x - r/2, d.y - r/2, r, r);
    }
    ctx.restore();
  }

  // spawn an expanding ring "pop" at a cell centre (tile placed, coin, etc.)
  function spawnPop(c, r, color) {
    state.pops.push({ x:(c+0.5)*cell, y:(r+0.5)*cell, life:0, max:340, color: color || getVar("--free") });
  }
  // a burst of light that pulses out from a cell (tile cleared). `scale` shrinks the whole
  // thing, for the smaller bursts that mark a change of state rather than an event.
  function spawnLight(c, r, scale, ms) {
    state.lights.push({ x:(c+0.5)*cell, y:(r+0.5)*cell, life:0, max: ms || 520, k: scale || 1 });
  }
  // The tile that has just BECOME track. A ring pulsing outward was the wrong shape for this:

  // — its own footprint, its own corner radius — laid over the graphic and fading off it.
  const LAID_FLASH_MS = 260;
  function spawnLaidFlash(c, r) {
    state.laidFlash.push({ c, r, life:0, max: LAID_FLASH_MS });
  }
  function drawLaidFlash() {
    const F = state.laidFlash;
    if (!F || !F.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";     // brighten the tile, do not paint over it
    for (const f of F) {
      const k = f.life / f.max, fade = (1 - k) * (1 - k);
      ctx.globalAlpha = 0.85 * fade;
      ctx.fillStyle = "#fff7d6";
      rrect(cx(f.c), cy(f.r), cell, cell, tileR(cell));
      ctx.fill();
    }

  // ---------- Level-start intro (pixels assemble into the character) ------
  const INTRO_CONVERGE = 950, INTRO_FLASH = 2000;
  function startIntro() {
    const s = state; s.status = "intro"; s.introT = 0; s.introSnd = { gather:false, flash:false };
    const rp = visualAt(0);                        // where the character forms (start tile)
    s.introTarget = { x: rp.x, y: rp.y };
    s.introParticles = [];
    // Held as polar starts plus a landing offset inside his silhouette, both unitless, so the
    // cloud converges on the middle of his BODY and settles across his whole shape rather
    // than collapsing to a point at his feet. Bounds come from RUNNER, so a retune carries.
    const N = 90;
    for (let i = 0; i < N; i++) {
      const inBody = Math.random() < 0.72;         // most of him is body; the rest is legs
      s.introParticles.push({
        ang: Math.random()*Math.PI*2, dist: 0.55 + Math.random()*0.6,
        ex: (Math.random()*2 - 1) * RUNNER.bodyW * (inBody ? 0.5 : 0.35),
        ey: inBody ? -(RUNNER.legLen + RUNNER.bodyH*Math.random())
                   : -RUNNER.legLen * Math.random(),
        sz: cell*(0.05 + Math.random()*0.07),
        col: Math.random() < 0.7 ? getVar("--runner") : "#ffffff",
      });
    }
  }
  function tickIntro(dt) {
    const s = state;
    if (!s.introSnd.gather) { s.introSnd.gather = true; Sound.introGather(); }  // plays once the intro runs (audio unlocked)
    const before = s.introT; s.introT += dt;
    if (before < INTRO_CONVERGE && s.introT >= INTRO_CONVERGE && !s.introSnd.flash) { s.introSnd.flash = true; Sound.introFlash(); }
    if (s.introT >= INTRO_CONVERGE + INTRO_FLASH && s.status === "intro") {
      s.introParticles = null;
      // He is assembled but not moving yet: wait out the rest of the current beat so his first
      // stride lands with the backing rather than a fraction of a beat off it.
      s.status = "cue"; s.cueT = Sound.cueDelay ? Sound.cueDelay() : 0;
    }
  }
  function tickCue(dt) {
    const s = state;
    s.cueT -= dt;
    if (s.cueT > 0) return;
    Sound.levelMusicHandover();   // from here his tile clears ARE the beat
    s.status = "play";
  }
  function drawIntro(ts) {
    const s = state, t = s.introT, tgt = s.introTarget;
    if (t < INTRO_CONVERGE) {                       // pixels stream in from all around
      const u = t / INTRO_CONVERGE, e = 1 - Math.pow(1-u, 3);   // ease-out
      const reach = Math.max(viewW, viewH);
      // His local frame is tilted on slopes and corners, so the cloud is rotated with him —
      // otherwise the pixels would assemble a runner standing at a different angle to himself.
      const ri = runnerInfo(), ca = Math.cos(ri.angle), sa = Math.sin(ri.angle);
      const at = (ox, oy) => ({ x: tgt.x + ox*ca - oy*sa, y: tgt.y + ox*sa + oy*ca });
      const focus = at(0, -cell*(RUNNER.legLen + RUNNER.bodyH*0.5));   // centre of his body
      for (const p of s.introParticles) {
        const x0 = focus.x + Math.cos(p.ang)*p.dist*reach, y0 = focus.y + Math.sin(p.ang)*p.dist*reach;
        const T = at(p.ex*cell, p.ey*cell);         // and each lands on its own piece of him
        const px = x0 + (T.x - x0)*e, py = y0 + (T.y - y0)*e, sz = p.sz*(1 - u*0.4);
        ctx.globalAlpha = 0.35 + 0.65*u; ctx.fillStyle = p.col;
        ctx.fillRect(px - sz/2, py - sz/2, sz, sz);
      }
      ctx.globalAlpha = u*0.6; drawRunner(ts); ctx.globalAlpha = 1;   // character fading in
    } else {
      // Assembled: he is SOLID, and the flash is a flat-white copy of him laid over the top,
      // pulsing and decaying away. Fading a just-formed character back out reads as him
      // failing to arrive; RUNNER is the one source of his colours, so borrowing it for the
      // overlay is what keeps the flash to his exact silhouette.
      drawRunner(ts);
      const ft = t - INTRO_CONVERGE;
      if (ft < INTRO_FLASH) {
        const fl = 0.9 * (0.5 + 0.5*Math.sin(t/60)) * (1 - ft/INTRO_FLASH);
        if (fl > 0.01) {
          const body = RUNNER.body, ink = RUNNER.ink;
          RUNNER.body = "#ffffff"; RUNNER.ink = "#ffffff";
          ctx.globalAlpha = fl; drawRunner(ts); ctx.globalAlpha = 1;
          RUNNER.body = body; RUNNER.ink = ink;
        }
      }
    }
  }

  }

  function levelMechs(L) {
    // A level whose monsters are ALL hunters gets the hunter card even if its data still asks
    // for the generic one. The editor was writing "monster" long before this animal had a name
    // of its own, and an old save should not cost it its introduction.
    const mons = (L.hazards || []).filter(h => h.kind === "monster");
    const allHunt = mons.length > 0 && mons.every(h => h.variant === "hunter" || h.variant === "wander");
    const swap = k => (k === "monster" && allHunt) ? "hunter" : k;
    if (L.intro) return L.intro.map(swap);              // manual levels declare exactly which prompts to show
    const m = ["tile","flag"];                          // the basics, taught on the first level
    if (L.keys || L.key) m.push("key");                 // coloured keys only appear on door levels now
    if (L.walls && L.walls.length) m.push("wall");
    if (L.stone && L.stone.length) m.push("stone");
    if (L.coins && L.coins.length) m.push("coin");
    if (L.boost && L.boost.length) m.push("boost");
    if (L.singularity && L.singularity.length) m.push("singularity");
    if (L.slow && L.slow.length) m.push("slow");
    if (L.doors && L.doors.length) m.push("door");
    if (L.gates && L.gates.length) m.push("switch");
    if (L.blocks && L.blocks.length) m.push("block");
    if (L.platforms && L.platforms.length) m.push("platform");
    if (L.mdoors && L.mdoors.length) m.push("mdoor");
    if (L.hazards && L.hazards.some(h=>(h.kind||"saw")==="saw")) m.push("saw");
    if (L.hazards && L.hazards.some(h=>h.kind==="monster")) m.push("monster");
    return m;
  }
  const SEEN_KEY = "tilerunner:seen";
  function loadSeen(){ try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)) || []); } catch(_){ return new Set(); } }

  let mechQueue = [];
  function maybeShowMechIntro(L) {
    if (titleActive) return;             // never pop the tutorial over the title screen
    const seen = loadSeen();
    const news = levelMechs(L).filter(m => !seen.has(m));
    news.forEach(m => seen.add(m)); saveSeen(seen);
    const q = [];
    q.push(...news);
    if (!q.length) return;
    mechQueue = q; paused = true; showNextMech();
  }
  function showNextMech() {

  // draw a small representative icon for a mechanic on a 2d context of size S

  // cards use it so their icons are the real art rather than a hand-drawn likeness that
  // quietly goes stale. ctx and cell are module-wide, so the swap is guarded — a throw
  // mid-icon must never leave the board rendering into a 90px canvas.
  function withCanvas(g, cellPx, ox, oy, fn) {
    const oldCtx = ctx, oldCell = cell;
    ctx = g; cell = cellPx;
    try { ctx.save(); ctx.translate(ox, oy); fn(); ctx.restore(); }
    finally { ctx = oldCtx; cell = oldCell; }
  }

    // appears in the shipped campaign and so its card can never fire.
    const CP = Math.round(S*0.78), OX = (S-CP)/2, OY = (S-CP)/2;
    const real = fn => { try { withCanvas(g, CP, OX, OY, fn); return true; } catch(_) { return false; } };
    const N0 = { c:0, r:0 };

      rr(bx-S*0.2,cy-S*0.14,S*0.4,S*0.3,S*0.06); g.fillStyle=V("--track"); g.fill();
      g.strokeStyle=V("--rail"); g.lineWidth=S*0.05; g.beginPath(); g.moveTo(bx-S*0.2,cy-S*0.14); g.lineTo(bx+S*0.2,cy-S*0.14); g.stroke();
      g.fillStyle=V("--rail"); for(const dx of [-1,0,1]){ g.beginPath(); g.arc(bx+dx*S*0.1,cy+S*0.02,S*0.02,0,7); g.fill(); }
      g.strokeStyle=V("--track"); g.lineWidth=S*0.035; g.lineCap="round";
      g.beginPath(); g.moveTo(bx+S*0.26,cy); g.lineTo(bx+S*0.36,cy); g.moveTo(bx+S*0.33,cy-S*0.03); g.lineTo(bx+S*0.37,cy); g.lineTo(bx+S*0.33,cy+S*0.03); g.stroke(); }
    else if (type==="platform") {
      // a steel plate with an elbow of fixed track cast into it, open at two ends
      tile("#5c6474");
      g.fillStyle="rgba(15,17,24,0.85)"; const po=S*0.27;
      for(const [a,b] of [[po,po],[S-po,po],[po,S-po],[S-po,S-po]]){ g.beginPath(); g.arc(a,b,S*0.032,0,7); g.fill(); }
      g.save(); rr(S*0.14,S*0.14,S*0.72,S*0.72,S*0.13); g.clip();
      // just the rail line — no body fill, matching how platforms render in play
      g.lineCap="round"; g.lineJoin="round";
      g.strokeStyle="rgba(26,28,38,0.45)"; g.lineWidth=S*0.10;
      g.beginPath(); g.moveTo(cx,S*0.10); g.quadraticCurveTo(cx,cy,S*0.90,cy); g.stroke();
      g.strokeStyle=V("--rail"); g.lineWidth=S*0.06;
      g.beginPath(); g.moveTo(cx,S*0.10); g.quadraticCurveTo(cx,cy,S*0.90,cy); g.stroke();
      g.restore();
      // studs marking the two open ends
      g.fillStyle="rgba(20,18,32,0.6)";
      g.beginPath(); g.arc(cx,S*0.19,S*0.035,0,7); g.fill();
      g.beginPath(); g.arc(S*0.81,cy,S*0.035,0,7); g.fill(); }
    else if (type==="block") {
      // a metal block on a rail, with a nook to its right and a sideways arrow
      g.strokeStyle="rgba(150,156,172,0.55)"; g.lineWidth=S*0.05; g.lineCap="round";
      g.beginPath(); g.moveTo(S*0.18,cy); g.lineTo(S*0.82,cy); g.stroke();
      const bw=S*0.34;
      rr(cx-bw*0.75,cy-bw/2,bw,bw,S*0.07); g.fillStyle="#5c6474"; g.fill();
      g.fillStyle="rgba(15,17,24,0.85)"; const o=S*0.08;
      for(const [a,b] of [[cx-bw*0.75+o,cy-bw/2+o],[cx-bw*0.75+bw-o,cy-bw/2+o],[cx-bw*0.75+o,cy+bw/2-o],[cx-bw*0.75+bw-o,cy+bw/2-o]]){ g.beginPath(); g.arc(a,b,S*0.028,0,7); g.fill(); }
      g.strokeStyle="#eaf0fb"; g.lineWidth=S*0.045; g.lineCap="round"; g.lineJoin="round";
      g.beginPath(); g.moveTo(cx+S*0.16,cy); g.lineTo(cx+S*0.34,cy); g.moveTo(cx+S*0.28,cy-S*0.06); g.lineTo(cx+S*0.34,cy); g.lineTo(cx+S*0.28,cy+S*0.06); g.stroke(); }
    else if (type==="mdoor") {
      const col="#5bd6c0", gap=S*0.03;
      const panel=(px)=>{ rr(px,cy-S*0.22,S*0.22,S*0.44,S*0.05); g.fillStyle=col; g.fill(); };
      panel(cx-S*0.22-gap); panel(cx+gap);
      // outward arrows prompting the two-sided drag
      g.strokeStyle="#eaf7f3"; g.lineWidth=S*0.04; g.lineCap="round"; g.lineJoin="round";
      g.beginPath(); g.moveTo(cx-S*0.02,cy); g.lineTo(cx-S*0.16,cy); g.moveTo(cx-S*0.1,cy-S*0.06); g.lineTo(cx-S*0.16,cy); g.lineTo(cx-S*0.1,cy+S*0.06);
      g.moveTo(cx+S*0.02,cy); g.lineTo(cx+S*0.16,cy); g.moveTo(cx+S*0.1,cy-S*0.06); g.lineTo(cx+S*0.16,cy); g.lineTo(cx+S*0.1,cy+S*0.06); g.stroke(); }
    else if (type==="recycle") {
      // a cleared tile looping around to the front (a track piece + a curved recycle arrow)
      rr(cx-S*0.16,cy-S*0.16,S*0.32,S*0.32,S*0.06); g.fillStyle="rgba(180,174,235,0.9)"; g.fill();
      g.fillStyle=V("--shadow"); const gp=S*0.09;
      for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){g.beginPath();g.arc(cx+i*gp,cy+j*gp,S*0.018,0,7);g.fill();}
      g.strokeStyle=V("--track"); g.lineWidth=S*0.05; g.lineCap="round";
      g.beginPath(); g.arc(cx,cy,S*0.33,Math.PI*0.65,Math.PI*2.15); g.stroke();
      const ax=cx+Math.cos(Math.PI*0.65)*S*0.33, ay=cy+Math.sin(Math.PI*0.65)*S*0.33;
      g.beginPath(); g.moveTo(ax,ay); g.lineTo(ax-S*0.08,ay-S*0.02); g.moveTo(ax,ay); g.lineTo(ax-S*0.01,ay-S*0.09); g.stroke(); }
    else if (type==="turn") {
      // an L-shaped track: straight up then a turn to the right
      g.strokeStyle=V("--track"); g.lineWidth=S*0.09; g.lineCap="round"; g.lineJoin="round";
      g.beginPath(); g.moveTo(cx-S*0.16,cy+S*0.22); g.lineTo(cx-S*0.16,cy-S*0.06); g.lineTo(cx+S*0.22,cy-S*0.06); g.stroke();
      g.beginPath(); g.moveTo(cx+S*0.08,cy-S*0.18); g.lineTo(cx+S*0.24,cy-S*0.06); g.lineTo(cx+S*0.08,cy+S*0.06); g.stroke(); }
    else if (type==="offscreen") {
      // an arrow pointing off toward a small flag at the corner
      g.strokeStyle="#ffd24a"; g.lineWidth=S*0.075; g.lineCap="round"; g.lineJoin="round";
      g.beginPath(); g.moveTo(cx-S*0.16,cy+S*0.16); g.lineTo(cx+S*0.14,cy-S*0.14); g.stroke();
      g.beginPath(); g.moveTo(cx+S*0.14,cy-S*0.14); g.lineTo(cx-S*0.02,cy-S*0.14); g.moveTo(cx+S*0.14,cy-S*0.14); g.lineTo(cx+S*0.14,cy+S*0.02); g.stroke();
      g.strokeStyle="#d9d3ff"; g.lineWidth=S*0.03; g.beginPath(); g.moveTo(cx+S*0.24,cy-S*0.24); g.lineTo(cx+S*0.24,cy+S*0.02); g.stroke();
      g.fillStyle=V("--goal"); g.beginPath(); g.moveTo(cx+S*0.24,cy-S*0.24); g.lineTo(cx+S*0.4,cy-S*0.17); g.lineTo(cx+S*0.24,cy-S*0.1); g.closePath(); g.fill(); }
  }

  // ---------- Layout + camera --------------------------------------------
  function computeLayout() {
    const wrap = document.getElementById("board-wrap");
    viewW = Math.floor(wrap.clientWidth);
    viewH = Math.floor(wrap.clientHeight);
    cell = Math.round(clamp(Math.min(viewW / VIEW_COLS, viewH / VIEW_ROWS), MIN_CELL, MAX_CELL) * 0.9);
    worldW = cell * COLS; worldH = cell * ROWS;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = viewW * dpr; canvas.height = viewH * dpr;
    canvas.style.width = viewW + "px"; canvas.style.height = viewH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wallLayerDirty = true;                      // cell/world size changed — rebuild wall + grain caches
    grainScreen = null;
    syncHudChrome();                            // the pause button follows the speedo's plate
  }

  const nodeCenter = n => ({ x:(n.c + 0.5) * cell, y:(n.r + 0.5) * cell });
  function pathPos(param) {
    const p = state.path, len = p.length;
    const f = clamp(param, 0, len - 1), i = Math.floor(f);
    if (i >= len - 1) return nodeCenter(p[len - 1]);
    const fr = f - i, a = nodeCenter(p[i]), b = nodeCenter(p[i + 1]);
    return { x:a.x + (b.x - a.x) * fr, y:a.y + (b.y - a.y) * fr };
  }
  // runner frame: centre point, tangent (travel dir), normal (surface "up"),
  // and the surface point the runner's feet rest on
  function runnerInfo() {
    const param = state.runIdx + state.runT;
    const pos = visualAt(param);                     // follows the curved surface
    const a = visualAt(param - 0.08), b = visualAt(param + 0.08);
    let tx = b.x - a.x, ty = b.y - a.y;
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const nx = ty, ny = -tx;                 // left-normal = surface side
    return { x:pos.x, y:pos.y, tx, ty, nx, ny,
             sx:pos.x, sy:pos.y,
             angle:Math.atan2(ty, tx) };
  }

  // ---- visual path: node-to-node motion with corner tiles rounded ---------
  const axisDir = (from, to) => ({ x: Math.sign(to.c - from.c), y: Math.sign(to.r - from.r) });

  // ---- fixed platforms ---------------------------------------------------
  // A platform is a WALL cell with a piece of track cast into it. You can't drop a
  // tile on it and you can't move it, but the runner rides across it for free and it
  // never wears out — so it extends your reach without spending from the 3-tile pool.
  // Its two connectors are fixed: `"ns"` is a straight, `"ne"` an elbow. The runner
  // may only enter/leave through a drawn end, which is what makes them a puzzle.
  const PF_OPP = { n:"s", s:"n", e:"w", w:"e" };
  const PF_VEC = { n:{x:0,y:-1}, s:{x:0,y:1}, e:{x:1,y:0}, w:{x:-1,y:0} };
  function parsePfDirs(spec) {
    const out = [];
    for (const ch of String(spec || "ns").toLowerCase())
      if (PF_OPP[ch] && out.indexOf(ch) < 0) out.push(ch);
    return out.length >= 2 ? out.slice(0, 2) : ["n", "s"];   // exactly two connectors
  }
  // the compass letter you'd travel to get from cell a to adjacent cell b (null if not adjacent)
  function stepDir(a, b) {
    const dc = b.c - a.c, dr = b.r - a.r;
    if (Math.abs(dc) + Math.abs(dr) !== 1) return null;
    return dc === 1 ? "e" : dc === -1 ? "w" : dr === 1 ? "s" : "n";
  }
  function pfAt(c, r) { return state.platformMap ? state.platformMap.get(key(c, r)) : null; }
  // Can track run from cell a into adjacent cell b? Plain cells connect freely; a
  // platform only connects through the ends its shape actually draws.
  function trackConnects(a, b) {
    const d = stepDir(a, b);
    if (!d) return false;
    const pa = pfAt(a.c, a.r), pb = pfAt(b.c, b.r);
    if (pa && pa.dirs.indexOf(d) < 0) return false;              // leaving a: must be a drawn end
    if (pb && pb.dirs.indexOf(PF_OPP[d]) < 0) return false;      // entering b: same
    return true;
  }
  // A platform is available again once every earlier visit has been run past — so a
  // level can legitimately route the runner back over it on a later loop.
  function platformFree(pf) {
    for (const n of state.path) if (n.kind === "platform" && n.c === pf.c && n.r === pf.r && !n.exited) return false;
    return true;
  }

  // the top-surface points of one tile: straight (3 pts) or a quarter-circle arc
  function tileSurface(n, prev, next) {
    const C = nodeCenter(n), h = cell/2;
    let entry = prev ? axisDir(n, prev) : null;   // toward prev
    let exit  = next ? axisDir(n, next) : null;    // toward next
    if (!entry && !exit) { entry = { x:-1, y:0 }; exit = { x:1, y:0 }; }
    else if (!entry)     { entry = { x:-exit.x, y:-exit.y }; }
    else if (!exit)      { exit  = { x:-entry.x, y:-entry.y }; }
    const Me = { x:C.x + entry.x*h, y:C.y + entry.y*h };
    const Mx = { x:C.x + exit.x*h,  y:C.y + exit.y*h };
    if (entry.x === -exit.x && entry.y === -exit.y) return [Me, { x:C.x, y:C.y }, Mx];  // straight
    // corner: quarter circle centred on the shared cell corner, radius h
    const O = { x:C.x + (entry.x+exit.x)*h, y:C.y + (entry.y+exit.y)*h };
    let a0 = Math.atan2(Me.y-O.y, Me.x-O.x), a1 = Math.atan2(Mx.y-O.y, Mx.x-O.x);
    let d = a1 - a0; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI;
    const N = 12, pts = [];
    for (let k = 0; k <= N; k++) { const a = a0 + d*(k/N); pts.push({ x:O.x + h*Math.cos(a), y:O.y + h*Math.sin(a) }); }
    return pts;
  }
  function samplePolyline(pts, u) {
    if (pts.length === 1) return pts[0];
    let total = 0; const seg = [];
    for (let k = 0; k < pts.length-1; k++) { const d = Math.hypot(pts[k+1].x-pts[k].x, pts[k+1].y-pts[k].y); seg.push(d); total += d; }
    let target = clamp(u,0,1) * total;
    for (let k = 0; k < seg.length; k++) {
      if (target <= seg[k] || k === seg.length-1) { const t = seg[k] ? target/seg[k] : 0;
        return { x:pts[k].x + (pts[k+1].x-pts[k].x)*t, y:pts[k].y + (pts[k+1].y-pts[k].y)*t }; }
      target -= seg[k];
    }
    return pts[pts.length-1];
  }
  const surfaceAtTile = (i, u) => samplePolyline(tileSurface(state.path[i], state.path[i-1], state.path[i+1]), u);
  // position along the whole route at fractional node index `param`
  function visualAt(param) {
    const len = state.path.length;
    const f = clamp(param, 0, len-0.5);              // allow the leading tile to run out to its far edge
    let i = clamp(Math.round(f), 0, len-1);
    return surfaceAtTile(i, (f - i) + 0.5);          // each tile spans param [i-0.5, i+0.5]
  }

  // Vertical camera: centre the followed point, then let it run a little past each edge so
  // the board isn't welded to the frame. The top edge gets CAM_TOP_PAD instead, which is what
  // keeps the first row clear of the speed plate and the pause button.
  const camPad = () => cell * CAM_EDGE_PAD;
  const camTopPad = () => cell * CAM_TOP_PAD;
  const camBotPad = () => cell * CAM_BOTTOM_PAD;
  function camClampY(py) {
    if (worldH <= viewH) {
      // Whole level fits: centre it, then drop it clear of the top UI — but never so far that
      // the last row slides under the talismans. The two pads compete for one pool of slack,
      // and the bottom one wins, because the rack is something you have to be able to press.
      const slack = (viewH - worldH) / 2;
      const drop = Math.min(camTopPad(), Math.max(0, slack - camBotPad()));
      return -(slack + drop);
    }
    return clamp(py - viewH/2, -camTopPad(), worldH - viewH + camBotPad());
  }
  function camClampX(px) {
    const pad = camPad();
    return worldW <= viewW ? (worldW - viewW) / 2
                           : clamp(px - viewW/2, -pad, worldW - viewW + pad);
  }
  // How far past the runner, toward the front of the laid track, the camera sits — in cells.
  // The decision being made is where the NEXT tile goes, and that happens at the head of the
  // path, so the space worth showing is ahead of him rather than behind.
  const CAM_LEAD = 0.75;
  function camTarget() {
    const p = visualAt(state.runIdx + state.runT);
    const head = visualAt(state.path.length - 0.5);      // the far edge of the leading tile
    let tx = p.x, ty = p.y;
    const dx = head.x - p.x, dy = head.y - p.y, d = Math.hypot(dx, dy);
    if (d > 1) {                                          // never lead further than the head is
      const lead = Math.min(d, CAM_LEAD * cell);
      tx += dx/d * lead; ty += dy/d * lead;
    }
    return { tx: camClampX(tx), ty: camClampY(ty) };
  }
  function snapCamera() { const t = camTarget(); camX = t.tx; camY = t.ty; }
  // camera top-left that centres a given world point (respecting the top padding)
  function camForPoint(px, py) {
    return { x: camClampX(px), y: camClampY(py) };
  }
  // The camera is never allowed to outrun him by more than this. Laying a tile moves the
  // target a whole cell in one frame — the lead looks up the track, and the track just got
  // longer — and an unclamped lerp eats that in three or four frames. The board lurching
  // forward is at its worst exactly when you are lining up the next tile, so the catch-up is
  // held to a walk instead: a shade faster than he is, and no more.
  const CAM_MAX_SPEED = 1.5;                  // multiples of the runner's own pace
  function updateCamera(dt) {
    if (state.status !== "play") return;      // freeze during fall / overlays / cam-pan / intro
    const t = camTarget(), k = Math.min(1, dt * CAM_LERP);
    let dx = (t.tx - camX) * k, dy = (t.ty - camY) * k;
    // His actual pace, boosts and slows included — so the cap loosens when he speeds up
    // rather than leaving the camera trailing behind a boost.
    // A floor of a quarter pace, because liveFactor goes to ZERO under the Hands of Time —
    // and a camera that cannot move at all while time is stopped would strand you looking at
    // the wrong part of the board for the one second you most want to be aiming.
    const pace = cell / Math.max(1, state.msPerCell) * Math.max(0.25, state.liveFactor || 1);
    const maxStep = CAM_MAX_SPEED * pace * dt;
    const d = Math.hypot(dx, dy);
    if (d > maxStep) { const f = maxStep / d; dx *= f; dy *= f; }
    camX += dx; camY += dy;
  }
  // opening fly-in: hold on the off-screen flag, glide to the runner's start, then form the runner
  function tickCamPan(dt) {
    const p = state.pan; if (!p) { afterLevelPan(); return; }
    p.t += dt;
    if (p.t < p.hold) { camX = p.from.x; camY = p.from.y; return; }   // beat on the flag
    const u = Math.min(1, (p.t - p.hold) / p.dur);
    const e = u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2)/2;            // ease in-out
    camX = p.from.x + (p.to.x - p.from.x)*e;
    camY = p.from.y + (p.to.y - p.from.y)*e;
    if (u >= 1) { camX = p.to.x; camY = p.to.y; state.pan = null; afterLevelPan(); }
  }

  const cx = c => c * cell, cy = r => r * cell;
  const cellAtWorld = (wx, wy) => ({ c: Math.floor(wx / cell), r: Math.floor(wy / cell) });

  // ---------- Occupancy / targets ----------------------------------------
  function head() { return state.path[state.path.length - 1]; }
  // ---- occupancy, cached ----
  // occupiedFor() used to rebuild a full Set (walls + every tile + stones + …) on
  // EVERY call — and it's called each frame by the junction glyph and, while dragging,
  // by the drop-ghost. That scan (with a key() string per tile/wall) was the drag hitch.
  // The "static" part (walls, stones, collapsed cells, parked/free tiles) only changes
  // when a tile moves or a stone breaks, so we build it once and reuse it until marked
  // dirty. The genuinely per-frame parts (doors easing open, moving hazards, sliders)
  // are layered on top of a cheap copy.
  let occDirty = true, _occStatic = null, _occStaticKey = -2, occGen = 0;
  function markOccDirty() { occDirty = true; occGen++; }
  function buildStaticOcc(dragId) {
    const occ = new Set(state.walls);
    for (const sk of state.stones.keys()) occ.add(sk);        // intact stone blocks placement
    for (const pf of (state.platforms||[])) occ.add(key(pf.c, pf.r));   // platforms are wall — you ride them, you don't build on them
    for (const ck of state.collapsed) occ.add(ck);             // cells that have collapsed away
    for (const t of state.tiles) { if (t.id === dragId) continue; if (t.status === "spent") continue; occ.add(key(t.c, t.r)); }
    return occ;
  }
  function occupiedFor(dragTile) {
    const dragId = dragTile ? dragTile.id : -1;
    if (occDirty || _occStaticKey !== dragId || !_occStatic) {
      _occStatic = buildStaticOcc(dragId); _occStaticKey = dragId; occDirty = false;
    }
    const occ = new Set(_occStatic);                          // cheap copy of the cached static layer
    for (const d of state.doors) if (!d.open) occ.add(key(d.c, d.r));                 // closed colored doors
    for (const grp of state.gateGroups) if (grp.openT < 0.85) occ.add(grp.doorKey);  // sliding door still closed
    // Only the monsters that hold ground block placement. The ones that slide along a rail,
    // and the trap you are meant to run through, you build across and time instead.
    for (const h of state.hazards)
      if (h.kind === "monster" ? monKind(h).blocks : false) occ.add(key(h.cc, h.cr));
    for (const sl of (state.sliders||[])) {                    // slider band = wall, except the platform's cell
      const cur = Math.round(sl.pos);
      if (sl.axis === "h") { for (let c=sl.lo;c<=sl.hi;c++) if (c!==cur) occ.add(key(c, sl.r)); }
      else                 { for (let r=sl.lo;r<=sl.hi;r++) if (r!==cur) occ.add(key(sl.c, r)); }
    }
    for (const b of (state.blocks||[])) {                      // the movable block occupies just its current cell
      const cur = Math.round(b.pos);
      occ.add(b.axis === "h" ? key(cur, b.r) : key(b.c, cur));
    }
    for (const md of (state.manualDoors||[]))                  // manual door blocks until BOTH panels are drawn apart
      if (!(md.left >= 0.999 && md.right >= 0.999)) occ.add(key(md.c, md.r));
    // exit is always open now — no primary key required (coloured keys only gate their doors)
    return occ;
  }

  // tap a stone tile to smash it (opens the cell for a path tile)
  function breakStone(c, r) {
    const st = state.stones.get(key(c, r));
    if (!st) return;
    st.hp -= 1; st.hit = 1;                          // register a tap; deeper crack (see drawStone)
    haptic(st.hp > 0 ? 10 : 18);
    const wx = (c + 0.5) * cell, wy = (r + 0.5) * cell;
    if (st.hp > 0) {                                 // chip it — a few shards, a small knock
      Sound.crunch(1);                               // every tap on stone is the same crunch
      state.shake = Math.max(state.shake, cell * 0.07);
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + (bgHash(c + i, r) % 100) / 60, sp = cell * 0.0011;
        state.shards.push({ x:wx, y:wy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - cell*0.0006,
          life:0, max:240, sz: cell*0.05*(0.6 + (i % 3)*0.2) });
      }
      return;
    }
    // final tap — shatter
    state.stones.delete(key(c, r));
    markOccDirty();                            // a stone opened up — occupancy changed
    // ...including the one that breaks it. It used to chip with the tile-clear note and
    // shatter with the smash, which made a stone sound like two different materials depending
    // on how much of it was left.
    Sound.crunch(1);
    state.shake = Math.max(state.shake, cell * 0.16);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + (bgHash(c + i, r) % 100) / 60;

      if (!sw) continue;
      sw.used = true;

  function updateShards(dt) {

  // a bright ring of light pulsing outward from a cleared tile (additive glow)
  // What a tile throws off when it lets go. SQUARE, not round: everything on this board is a

  // the tile itself letting go. Same reasoning as the laid-tile flash above.
  //
  // Canvas has no square gradient, so the bloom is a stack of nested squares under `lighter` —
  // the middle collects every layer and the outermost only its own, which is a falloff built

  // corner as every other square in the game, so it follows TILE.radius rather than drifting

  //

  const LIGHT_BLOOM_STEPS = 5;

      ctx.fillStyle = "rgba(255,236,190," + (0.085 * fade).toFixed(4) + ")";
      rrect(x - half, y - half, half*2, half*2, tileR(half*2)); ctx.fill();

  function drawLights() {

  // Every in-bounds unoccupied cell is a legal drop now (free placement).

        if (!occ.has(key(c, r))) out.push({ c, r });

  }

    const door = state.doors.find(d => d.c === pos.c && d.r === pos.r && d.open && !d.reached);
    if (door) { door.reached = true; Sound.doorOpen(); haptic(10); }
    spawnPop(pos.c, pos.r);                  // placement pop
    linkParkedTiles();                      // connect now if it's beside the front
    // What it sounds like is decided AFTER the link, because that is the moment the answer
    // exists: a tile that joined the track went "active", one left lying about did not. A door
    // latching already ends in its own rising confirmation, so it keeps the board to itself.
    if (!door) (tile.status === "active" ? Sound.tileLaid : Sound.tileDrop)();
    updateReadyHud();

  }

  // Pull any parked tile that touches the track's front into the path, chaining
  // along connected parked tiles. Freed (walked-over) tiles are left alone, so
  // the runner never links backward onto ground it already covered.
  // A link would make the runner "double back" if the new cell sits orthogonally
  // beside a live path segment the runner is still on or heading toward (other than
  // the head it attaches to). Blocking these keeps the runner from ever instantly
  // turning around and running backwards alongside its own track.
  // Two separate rules live here, and only one of them is inviolable.
  //
  //   (1) NO U-TURN. You may not lay a tile on the cell the runner is on, or the one he has
  //       just left. Cells cleared long ago are fair game again. This one is the engine.
  //   (2) NO FORKING. You may not lay a tile alongside live track at or ahead of the runner,
  //       because the drawn track would appear to branch. This one is only tidiness.
  //
  // Rule (2) must never be the thing that ENDS a run. Backed into a corner, it can forbid
  // every remaining neighbour of the head — the runner is standing on one of them, so any
  // cell beside him is "a fork" — and then the freed tile has nowhere to go and he dies with
  // tiles in hand. That is reachable with four tiles and up, because the extra tile keeps the
  // runner's own cell live in the check for longer; with three he has always moved past it.
  // So when nothing at all is legal, rule (2) stands down and only the U-turn rule applies.
  function foldsBackAt(c, r, strict) {
    const p = state.path;
    const on = state.runIdx;                   // the node he is standing on right now
    // Neither rule can fire below `on`, and on an endless level the path never stops
    // growing — so start there rather than walking the whole history every time.
    // A tile clears at the MIDPOINT of its cell, but both rules below used to hold that cell

    // is already leaving, so re-linking it adds nothing to the picture and no gap to the eye.

  // ---------- The lover ---------------------------------------------------

  // ---------- Runner logic ------------------------------------------------
  function update(dt) {

    s.elapsed += dt;                        // level clock (for time bonus / stars)

    }

    // rowing, so a second of standing still is a second of everything else catching up.

    // no tile ahead: the runner keeps going to the edge of the last tile, then falls off.
    // (visual position across the tile u = runT + 0.5, so the 80% mark is runT = 0.3)

  // undo the most recent placement (if the runner hasn't reached it yet)
  function undoLast() {
    const s = state;
    if (s.status !== "play" || s.lastPlacedId == null) return;
    const t = s.tiles[s.lastPlacedId];
    if (!t) return;
    // the tile may have auto-chained onto one or more fixed platforms; those trailing
    // platform nodes come off with it, as long as the runner hasn't reached them yet
    let tip = s.path.length - 1;
    while (tip > 0 && s.path[tip].kind === "platform") tip--;
    const h = s.path[tip];
    if (h.kind === "tile" && h.tileId === t.id && s.runIdx < tip) {
      while (s.path.length > tip) s.path.pop();
      t.status = "free";                     // pop it off the front, back into the pool
    } else if (t.status === "parked") {
      t.status = "free";                     // un-stage a parked tile

  // ---------- The vortex ---------------------------------------------------
  // Close the track into a circuit and he can run for ever. Rather than leave that as a
  // soft-lock, the game notices, winds him up to a flat sprint, and then folds the whole
  // picture — board, HUD and all — into the middle of the loop he built.
  const LOOP_MIN = 4, LOOP_MAX = 14;   // circuit lengths we look for, in cells
  const LOOP_LAPS = 2;                 // clean laps before we are sure it is a circuit

    cps:   4.0,     // the sprint he is wound up to
    ramp:  2400,    // ms winding up to it

    turns: 2.6,     // how many full twists the innermost ring takes

  // The cell he just entered is one he entered L steps ago, and so is every cell between.
  // Checked over two laps so a path that merely crosses itself once does not count.
  function circuitLength() {
    const p = state.path, i = state.runIdx;
    for (let L = LOOP_MIN; L <= LOOP_MAX; L++) {

      if (i - (LOOP_LAPS + 1)*L + 1 < 0) break;
      let same = true;
      for (let lap = 1; lap <= LOOP_LAPS && same; lap++)
        for (let k = 0; k < L && same; k++)

    if (!s.loop || s.loop.len !== L) { s.loop = { len: L, at: s.runIdx }; return; }
    // The middle of the circuit, in world units — where everything is about to go — and
    // which way round he is going. Walked FORWARD (the loop above collects backwards), so the
    // shoelace comes out with the sign of his actual travel.
    const ring = [];

      area += (a.c + 0.5)*(b.r + 0.5) - (b.c + 0.5)*(a.r + 0.5);
    }

    // positive rotate() is clockwise too. Taking the sign straight across means the
    // whirlpool turns the way he runs rather than against him.
    s.vortex = { phase: "ramp", t: 0, wx: cx/L, wy: cy/L, len: L, spin: area >= 0 ? 1 : -1 };
    Sound.vortex(true);

  }
  function tickVortex(dt) {
    const s = state, v = s.vortex; if (!v) return;

    } else if (v.phase === "black") {

  }
  // The whirlpool itself. The finished frame is copied off and redrawn as a stack of rings,

  let vortexCv = null;

    const v = state.vortex; if (!v || (v.phase !== "pull" && v.phase !== "black")) return;

    if (v.phase === "black") {
      const u = Math.min(1, v.t / 260);
      ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle = "#000"; ctx.globalAlpha = 1; ctx.fillRect(0,0,viewW,viewH); ctx.restore();
      return;
    }
    const u = Math.min(1, v.t / VORTEX.pull);
    const ease = u*u;                                       // slow to start, then it lets go
    if (!vortexCv) vortexCv = document.createElement("canvas");
    if (vortexCv.width !== W || vortexCv.height !== H) { vortexCv.width = W; vortexCv.height = H; }
    const g = vortexCv.getContext("2d");
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H); g.drawImage(canvas, 0, 0);
    const px = v.wx*cell - camX, py = v.wy*cell - camY;     // the eye, in screen units
    const far = Math.hypot(Math.max(px, viewW-px), Math.max(py, viewH-py)) + cell;
    ctx.save();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = "#000"; ctx.fillRect(0,0,viewW,viewH);
    for (let i = VORTEX.rings; i >= 1; i--) {
      const r0 = far * (i-1)/VORTEX.rings, r1 = far * i/VORTEX.rings;
      const k = 1 - (i-1)/VORTEX.rings;                     // 0 at the rim, 1 at the eye
      const twist = v.spin * ease * VORTEX.turns * Math.PI*2 * k*k;
      const draw  = 1 - ease * (0.35 + 0.65*k);             // inner rings fall in fastest
      ctx.save();
      ctx.beginPath();                                      // the annulus this ring lives in
      ctx.arc(px, py, r1, 0, Math.PI*2);
      ctx.arc(px, py, r0, 0, Math.PI*2, true);
      ctx.clip("evenodd");
      ctx.translate(px, py); ctx.rotate(twist); ctx.scale(draw, draw); ctx.translate(-px, -py);
      ctx.globalAlpha = Math.max(0, 1 - ease*ease*(0.2 + 0.8*k));
      ctx.drawImage(vortexCv, 0, 0, W, H, 0, 0, viewW, viewH);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- Talisman powers ---------------------------------------------
  const REWIND_TILES = 2;      // how far back the Tape of Regret puts you
  const MAGNET_CELLS = 2.5;    // the Magnet's reach, in tiles
  // The reach is drawn as rings falling inward rather than as one ring sitting still: a
  // static circle says "this is the area", where a collapsing one says "and it is pulling".
  const MAGNET_RINGS = 2;      // how many are on their way in at any moment
  const MAGNET_RING_MS = 820;  // one disc's trip from the rim to him
  const COIN_FLY_MS = 240;     // how long a pulled coin takes to reach him
  // Press the button: the worn talisman gives up its one power for this level.
  // A level still allows ONE power — that has always been the balance — but which one is now
  // decided at the moment you use it rather than committed to in a menu beforehand.
  function firePower(id) {
    const s = state;
    const def = id ? (talLive(id) && talUnlocked.has(id) ? talById(id) : null) : wornTalisman();
    if (!s || s.status !== "play" || !def || s.power.spent) return false;
    s.power.spent = true;
    s.power.kind = def.id;
    s.power.ms = def.ms;
    s.power.t = def.ms;                 // 0 for the Finger — it waits to be spent instead
    s.power.armed = true;
    spawnPop(runnerCell().c, runnerCell().r, def.col);
    Sound.power(def.id);
    haptic([10, 30, 14]);

    if (def.id === "star") Sound.starTheme(def.ms);
    // Instant powers do their work here and then let go, rather than sitting armed.
    if (def.id === "rewind") {
      rewindRunner(REWIND_TILES);
      s.power.kind = null; s.power.t = 0; s.power.armed = false;
    }
    // A FOURTH tile, out of nowhere, in the middle of the board. The Mushroom used to warp the
    // screen for six seconds, which was a joke at the player's expense rather than a power —
    // this is the only charm that changes what you have to work with instead of what is
    // happening to you, and three tiles is the whole shape of the game.
    if (def.id === "mush") {
      spawnSpareTile(def.col);
      s.power.kind = null; s.power.t = 0; s.power.armed = false;
    }
    // The Hammer stopped being a thing you aim and became a thing you set off: it used to wait,
    // armed, for you to tap a laid tile and lift it. A charm that does its work the moment you
    // press it is one fewer rule to hold, and breaking rock is what a sledge was always for.
    if (def.id === "finger") {
      smashStones(HAMMER_TILES);
      s.power.kind = null; s.power.t = 0; s.power.armed = false;
    }
    if (def.id === "pulse") {
      unmakeMonsters(PULSE_TILES, def.col);
      s.power.kind = null; s.power.t = 0; s.power.armed = false;
    }
    // The Ankh does nothing at all when pressed. It arms, and `startFall` spends it.
    // Both speed charms just start the effect the floor pads start. The charm's own clock is
    // set to the same half second, so the draining bar on the button and the thing it is
    // draining for are one duration rather than two that only look alike.
    if (def.id === "spur")  s.speedFx = { kind:"boost", t:SPEED_CHARM_MS };
    if (def.id === "brake") s.speedFx = { kind:"slow",  t:SPEED_CHARM_MS };
    return true;
  }
  const powerActive = id => state && state.power.kind === id && state.power.t > 0;
  const PULSE_TILES = 2;                   // how far the Bell reaches, in cells
  const HAMMER_TILES = 2;                  // ...and the Hammer, which breaks rock instead
  // One more tile in the hand, dropped as close to the middle of the board as there is room
  // for. It goes down LOOSE, exactly as if you had dragged it there yourself: it is a fourth
  // tile to cycle, not a piece of track laid for you.
  function spawnSpareTile(col) {
    const s = state;
    const t = { id: s.tiles.length, c: 0, r: 0, status: "free" };
    s.tiles.push(t);
    // Free STAYS free. A loose tile that happens to sit where the track could continue links
    // itself on the next frame — that is what closes a circuit — so dropping this one in the
    // exact middle handed the player a length of laid track instead of a tile to carry. Look
    // outward from the middle for the first free cell that does NOT continue the front.
    const occ = occupiedFor(t), h = head();
    const mc = Math.floor(COLS/2), mr = Math.floor(ROWS/2);
    let spot = null;
    for (let rad = 0; rad < Math.max(COLS, ROWS) && !spot; rad++)
      for (let dr = -rad; dr <= rad && !spot; dr++)
        for (let dc = -rad; dc <= rad && !spot; dc++) {
          if (Math.max(Math.abs(dc), Math.abs(dr)) !== rad) continue;   // the ring, not the disc
          const c = mc + dc, r = mr + dr;
          if (!inBounds(c, r) || occ.has(key(c, r))) continue;
          if (trackConnects(h, { c, r }) && !foldsBack(c, r)) continue; // it would lay itself
          spot = { c, r };
        }
    // Every free cell on the board continues the track: take the nearest one anyway rather
    // than give nothing, and let it lay itself. A tile is a tile.
    if (!spot) spot = nearestFreeCell(t, mc, mr);
    if (!spot) { s.tiles.pop(); return false; }   // nowhere free at all — nothing to give
    t.c = spot.c; t.r = spot.r;
    markOccDirty(); updateReadyHud();
    spawnPop(t.c, t.r, col || "#ff8fc8");
    spawnLight(t.c, t.r, 0.9, 460);
    s.shake = Math.max(s.shake, cell * 0.10);
    return true;
  }
  // Every stone inside the ring comes apart at once, however much hit-point it had left.
  // Measured the way the Bell measures monsters — his real position against the stone's real
  // centre — so the two charms cannot disagree about what "within two tiles" means.
  function smashStones(tiles) {
    const s = state, rp = visualAt(s.runIdx + s.runT), reach = tiles * cell;
    spawnLight(runnerCell().c, runnerCell().r, tiles / 1.55, 520);
    const doomed = [];
    for (const sk of s.stones.keys()) {
      const i = sk.indexOf(","), c = +sk.slice(0, i), r = +sk.slice(i+1);
      if (Math.hypot((c+0.5)*cell - rp.x, (r+0.5)*cell - rp.y) <= reach) doomed.push([sk, c, r]);
    }
    for (const [sk, c, r] of doomed) {
      s.stones.delete(sk);
      const wx = (c+0.5)*cell, wy = (r+0.5)*cell;
      spawnPop(c, r, "#cfc7b4");
      for (let i = 0; i < 12; i++) {
        const a = (i/12)*Math.PI*2 + (i%5)*0.29, sp = cell*0.0015;
        s.shards.push({ x:wx, y:wy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - cell*0.0007,
                        life:0, max:400, sz: cell*0.06*(0.6 + (i%3)*0.25) });
      }
    }
    if (doomed.length) { markOccDirty(); s.shake = Math.max(s.shake, cell*0.20); }
    Sound.power("finger");
    if (doomed.length) Sound.crunch(1);
    return doomed.length;
  }
  // One ring out from where he stands, and every monster caught inside it comes apart.
  //
  // Measured from his own position rather than his cell, and against each monster's world
  // position rather than its cell, so a thing halfway between two squares is judged on where it
  // actually IS. Rounding both to cells first made the reach lopsided — a monster a whisker
  // inside two tiles could round out of range while one further off rounded in.
  function unmakeMonsters(tiles, col) {
    const s = state, rp = visualAt(s.runIdx + s.runT), reach = tiles * cell;
    // The ring the player sees ends exactly ON the reach: spawnLight's radius runs out to
    // 1.55 cells at full scale, so this is the scale that puts its edge at `tiles`.
    spawnLight(runnerCell().c, runnerCell().r, tiles / 1.55, 520);
    const doomed = s.hazards.filter(h => h.kind === "monster" &&
                                    Math.hypot(h.wx - rp.x, h.wy - rp.y) <= reach);
    if (!doomed.length) { Sound.power("pulse"); return 0; }
    for (const h of doomed) {
      const body = (monKind(h).body) || col;
      spawnPop(h.cc, h.cr, body);
      for (let i = 0; i < 14; i++) {                   // it comes apart the way a stone does
        const a = (i / 14) * Math.PI * 2 + (i % 5) * 0.31, sp = cell * 0.0016;
        s.shards.push({ x:h.wx, y:h.wy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - cell*0.0007,
                        life:0, max:420, sz: cell*0.06*(0.6 + (i % 3)*0.25), color: body });
      }
    }
    s.hazards = s.hazards.filter(h => !doomed.includes(h));
    markOccDirty();                     // a blocking monster gone means the cell opens up
    s.shake = Math.max(s.shake, cell * 0.20);
    Sound.power("pulse");
    Sound.smash();
    return doomed.length;
  }
  // Step him back up to `n` tiles and put the board back the way it was when he was there.
  //
  // Moving runIdx alone is not enough. Once he passes a tile it frees, and the player has very
  // likely dragged it round to the front — where it is now holding up track. Winding him back
  // onto that node means taking the tile off the front and returning it, which in turn means
  // the track it was carrying has to come up too, along with everything laid beyond it.
  // Nothing is destroyed: whatever is orphaned goes back into his hand.
  function rewindRunner(n) {
    const s = state;
    // A tile eaten by a crumbling floor is gone for good, so the rewind stops short of it
    // rather than standing him on a hole.
    let target = s.runIdx;
    for (let k = 0; k < n; k++) {
      const nd = s.path[target - 1];
      if (!nd) break;
      if (nd.kind === "tile" && nd.tileId != null) {
        const t = s.tiles[nd.tileId];
        if (!t || t.status === "spent") break;
      }
      target--;
    }
    if (target === s.runIdx && s.runT < 0.02) return false;   // already as far back as it goes

    // Which tiles the rewound stretch needs, and the node each one has to return to.
    const want = new Map();
    for (let i = target; i <= s.runIdx && i < s.path.length; i++) {
      const nd = s.path[i];
      if (nd.kind === "tile" && nd.tileId != null && s.tiles[nd.tileId]) want.set(nd.tileId, nd);
    }
    // If one of them is laid ahead of him, the path is cut at the earliest such placement:
    // everything past that point was reached over ground that is about to move.
    let cut = s.path.length;
    for (let k = s.runIdx + 1; k < s.path.length; k++) {
      const nd = s.path[k];
      if (nd.kind === "tile" && nd.tileId != null && want.has(nd.tileId)) { cut = k; break; }
    }
    // Everything past the cut goes back into his hand where it lies — except the tiles being
    // reclaimed, which are about to be put back where they came from instead.
    for (let k = cut; k < s.path.length; k++) {
      const nd = s.path[k];
      if (nd.kind !== "tile" || nd.tileId == null) continue;
      const t = s.tiles[nd.tileId];
      if (t && !want.has(nd.tileId)) t.status = "free";
    }
    if (cut < s.path.length) s.path.length = cut;

    // Put the reclaimed tiles back under him, live track again. Clearing `exited` is what lets
    // each one free up a second time as he runs it — without that the tile would be stranded
    // on the board for the rest of the level.
    for (const [id, nd] of want) {
      const t = s.tiles[id];
      t.c = nd.c; t.r = nd.r; t.status = "active";
      nd.exited = false;
      spawnPop(nd.c, nd.r, "#9ad9b0");
    }

    s.runIdx = target; s.runT = 0;
    s.shake = Math.max(s.shake || 0, cell * 0.08);
    markOccDirty(); updateReadyHud(); linkParkedTiles();
    snapCamera();
    return true;
  }
  function runnerCell() {
    const n = state.path[Math.min(state.runIdx, state.path.length-1)] || state.path[0];
    return { c: n.c, r: n.r };
  }
  // Runs every frame while a timed power is up: counts it down, and does whatever that
  // particular power does per-tick. The Finger has no clock, so it is absent from here.
  function tickPower(dt) {
    const s = state;
    if (s.coinFly.length) {                       // coins already in flight, wherever from
      for (const f of s.coinFly) f.t += dt;
      for (const f of s.coinFly) if (f.t >= COIN_FLY_MS && !f.done) { f.done = true; grabCoin(f.c, f.r, true); }
      s.coinFly = s.coinFly.filter(f => !f.done);
    }
    if (!s.power.kind || s.power.t <= 0) return;
    s.power.t -= dt;
    if (s.power.kind === "magnet") {
      // Anything within reach comes off the board now and flies in; the pickup itself
      // lands when it arrives, so the sound and the score follow the coin rather than
      // the button press.
      const rp = visualAt(s.runIdx + s.runT), rx = rp.x/cell, ry = rp.y/cell;
      for (const ck of Array.from(s.coinCells)) {
        const i = ck.indexOf(","), c = +ck.slice(0, i), r = +ck.slice(i+1);
        if (Math.hypot(rx - (c+0.5), ry - (r+0.5)) > MAGNET_CELLS) continue;
        s.coinCells.delete(ck);
        s.coinFly.push({ c, r, t: 0, done: false });
      }
    }
    if (s.power.t <= 0) {                          // done — put everything back

      s.power.kind = null; s.power.t = 0; s.power.armed = false;
    }
  }
  // one coin, collected — shared by passing over it and by the Magnet reeling it in
  // `flew` marks a coin the Magnet reeled in. Running over one is a single event and earns
  // the full pop; a magnet pulls a fistful at once, and five or six rings expanding out of
  // five or six different cells reads as a fault rather than a reward. The tally and the
  // sound still fire, so nothing is lost — only the ripples.
  function grabCoin(c, r, flew) {
    const s = state;
    s.coinsGot++; s.score = computeScore(); updateScoreHud();
    // Held, not banked. What you pick up is yours only if you finish — see endWin. The tally
    // still counts up as you go, because the number it shows is what you WOULD walk away with,
    // and a run where the figure never moved would be a run with nothing to lose.
    s.purse += COIN_TILES; showTally(c, r);
    if (!flew) { spawnPop(c, r, "#ffd24a"); spawnLight(c, r); }
    Sound.coin(); haptic(6);
  }
  // The Hammer of God: lift a tile that has already been laid, along with everything laid
  // after it, and put it back in your hand. Only ahead of the runner — pulling the ground
  // out from under him would just be a scripted death.

  // the runner grabs the key by passing over its cell
  function collectKey() {
    const s = state;
    const rp = visualAt(s.runIdx + s.runT);
    const near = (c, r) => Math.hypot(rp.x-(c+0.5)*cell, rp.y-(r+0.5)*cell) < cell*0.7;
    const nearTight = (c, r) => Math.hypot(rp.x-(c+0.5)*cell, rp.y-(r+0.5)*cell) < cell*0.3;  // boost/slow: must nearly overlap
    // coins: grabbed by passing over them
    for (const ck of Array.from(s.coinCells)) {
      const [c, r] = ck.split(",").map(Number);
      if (near(c, r)) { s.coinCells.delete(ck); grabCoin(c, r); }
    }
    // talismans: passing over one unlocks it permanently, win or lose
    for (const t of s.talismans) {
      if (t.got || !near(t.c, t.r)) continue;
      t.got = true;
      const def = talById(t.id);
      const fresh = unlockTalisman(t.id);
      spawnPop(t.c, t.r, def ? def.col : "#ffd24a"); spawnLight(t.c, t.r);
      Sound.coin(); haptic([8, 30, 8]);
      // A level with a talisman and NO flag is that talisman's own maze: the charm IS the
      // exit, so picking it up finishes the level. Everywhere else it is just a pickup.
      if (!s.goal) { endWin(def); return; }
      // A talisman you already own pays out instead of doing nothing.
      if (fresh) flashTalisman(def);
      else { s.purse += COIN_TILES*2; showTally(t.c, t.r);
             s.score = computeScore(); updateScoreHud(); }
    }
    // boost / slow pickups: grabbed by passing over them → a time-limited speed effect
    for (const bk of Array.from(s.boost)) {
      const [c, r] = bk.split(",").map(Number);
      if (nearTight(c, r)) { s.boost.delete(bk); s.speedFx = { kind:"boost", t:BOOST_MS };
                        spawnPop(c, r, pal("boost")); spawnLight(c, r); (Sound.boost||Sound.coin)(); haptic(12); }
    }
    for (const bk of Array.from(s.slow)) {
      const [c, r] = bk.split(",").map(Number);
      if (nearTight(c, r)) { s.slow.delete(bk); s.speedFx = { kind:"slow", t:SLOW_MS };
                        spawnPop(c, r, pal("slow")); (Sound.slow||Sound.coin)(); haptic(12); }
    }
    // colored keys: each opens all doors of its colour; exit unlocks when ALL are held
    if (!s.keyCollected) {
      for (const k of s.keys) if (!k.got && near(k.c, k.r)) {
        k.got = true; spawnPop(k.c, k.r, k.color); haptic(10); Sound.key();
        for (const d of s.doors) if (d.color === k.color) d.open = true;
      }
      if (s.keys.every(k => k.got)) { s.keyCollected = true; updateKeyHud(); }
    }
    // doors keep their lock marker until the runner physically passes through them
    for (const d of s.doors) if (!d.reached && near(d.c, d.r)) d.reached = true;
  }

  // A tile becomes draggable the moment the runner crosses out of its cell
  // (i.e. past its centre-to-next midpoint), not when it reaches the next tile.
  function freeClearedTiles() {
    const s = state, param = s.runIdx + s.runT;
    let changed = false;
    for (let i = 0; i < s.path.length; i++) {
      const node = s.path[i];
      // fixed platforms clear like track but cost nothing and go back to the level,
      // not to your pool — no score, no combo, they're free ground.
      if (node.kind === "platform") {
        if (!node.exited && param > i + 0.5) {
          node.exited = true;
          Sound.clearTile();
          spawnLight(node.c, node.r);
        }
        continue;
      }
      if (node.kind !== "tile" || node.exited) continue;   // per-node, so re-placed tiles are unaffected
      if (param > i + 0.5) {
        node.exited = true;                                 // this placement is done
        Sound.clearTile();                                  // play a tone as the tile clears
        spawnLight(node.c, node.r);                         // burst of light from the cleared tile
        scoreClear(i);                                      // score, combo, juice on the beat
        if (node.tileId != null) {
          const t = s.tiles[node.tileId];
          if (t) {
            if (s.singularity.has(key(node.c, node.r))) {       // fragile floor: tile is consumed
              // It does not just stop existing. The rift takes it: a ghost of the tile is left
              // behind to spiral into the eye the way everything else on this square does, so
              // the one time the player LOSES a tile is the one time they get to watch it go.
              s.eaten.push({ c: node.c, r: node.r, t: 0 });
              t.status = "spent"; t.c = -1; t.r = -1;
              s.collapsed.add(key(node.c, node.r));
              s.shake = Math.max(s.shake, cell * 0.12);
              Sound.swallow();
            } else {
              t.status = "free";
            }
            changed = true;
          }
        }
      }
    }
    if (changed) { markOccDirty(); updateReadyHud(); }   // a tile freed/consumed — occupancy changed
  }

  // Award points for a cleared tile and drive the beat-combo + feedback.
  function scoreClear(clearedIdx) {
    const s = state;
    s.combo++;                       // the combo IS the running score's core (final combo length)
    if (s.combo > s.maxCombo) s.maxCombo = s.combo;
    // wind the pace on. msPerCell is what actually drives movement, so derive it back
    // from the ramped cps, and hand the new beat length to the backing track — the
    // sub-beat notes between clears are scheduled off it.
    s.cpsNow = Math.min(RAMP_MAX_CPS, s.cpsNow + RAMP_PER_TILE);
    s.msPerCell = 1000 / s.cpsNow;
    Sound.setTempo(s.msPerCell);
    // track "flow" clears (a healthy buffer of track ahead) for the star rating
    let ahead = 0;
    for (let j = clearedIdx + 1; j < s.path.length; j++)
      if ((s.path[j].kind === "tile" || s.path[j].kind === "platform") && !s.path[j].exited) ahead++;
    if (ahead >= 2) s.flowClears++;
    s.score = computeScore();
    updateScoreHud();
    s.beatPulse = 1;                 // pulse the visuals on the beat
    haptic(6);
  }

  // Is the cell the runner is about to enter solid? Walls, stones and closed blocks
  // all stop him dead; open air means there is nothing to hit and he just drops.
  function wallAhead() {
    const s = state, last = s.path[s.path.length - 1];
    if (!last) return false;
    const ri = runnerInfo();
    const dc = Math.abs(ri.tx) > Math.abs(ri.ty) ? Math.sign(ri.tx) : 0;
    const dr = dc ? 0 : Math.sign(ri.ty);
    const c = last.c + dc, r = last.r + dr;
    if (!inBounds(c, r)) return false;                    // off the board is a fall, not a wall
    if (s.walls.has(key(c, r))) return true;
    if (s.stones && s.stones.has(key(c, r))) return true;
    for (const b of (s.blocks || [])) {                   // a sliding block counts while it's there
      const bc = b.axis === "h" ? b.pos : b.c, br = b.axis === "h" ? b.r : b.pos;
      if (Math.round(bc) === c && Math.round(br) === r) return true;
    }
    return false;
  }
  // End of the track: hit a wall and he squashes first, otherwise he just runs off.
  function endRun() {
    if (state.status !== "play") return;
    if (!wallAhead()) { startFall(); return; }
    const ri = runnerInfo();
    state.status = "squash";
    state.combo = 0;
    state.squash = { t:0, x:ri.sx, y:ri.sy, angle:ri.angle };
    state.shake = Math.max(state.shake, cell * 0.16);
    Sound.smash();                    // the existing impact voice — thud plus grit
    haptic([18, 40, 10]);
