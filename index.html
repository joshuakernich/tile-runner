<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tile Runner">
<meta name="theme-color" content="#0d0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&display=swap" rel="stylesheet">
<title>Tile Runner</title>
<style>
  /* Headings and the title logo. Local file, so it works offline and needs no network
     round-trip — sw.js precaches it. It is the face for the whole UI. */
  @font-face {
    font-family:"SquareFont";
    src:url("./Square.ttf") format("truetype");
    font-weight:normal; font-style:normal; font-display:swap;
  }
  :root {
    --bg:        #0d0b1a;
    --panel:     #17142b;
    --grid-line: #221d40;
    --ink:       #e8e6ff;
    --dim:       #6f68a8;
    --accent:    #ff4d6d;
    --track:     #ffcf4d;   /* beam body */
    --track-lo:  #b8892a;   /* beam underside / shade */
    --rail:      #fff2c4;   /* running surface highlight */
    --free:      #b9b3ff;   /* freed / draggable tile */
    --runner:    #4dd6ff;
    --goal:      #7dff6b;
    --wall:      #3a2a55;
    --shadow:    #05040d;
    /* the whole UI. Fraunces stays in the stack only as a glyph fallback:
       SquareFont has no checkmark or arrow, and the level grid uses both. */
    --font: "SquareFont", "Fraunces", ui-serif, Georgia, serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:var(--font);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  #app {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { text-align:center; padding:10px 0 6px; width:100%; }
  header h1 {
    font-size:22px; font-weight:900; letter-spacing:4px; text-transform:uppercase; color:var(--track);
    text-shadow: 2px 0 var(--shadow), -2px 0 var(--shadow), 0 2px var(--shadow), 0 -2px var(--shadow), 2px 2px var(--accent);
  }
  :root { --body: 19px; --btn: 15px; }   /* body text = death-screen byline; buttons a touch smaller */
  #hud {
    display:flex; gap:12px; align-items:center; justify-content:center;
    margin-top:8px; font-size:var(--body); letter-spacing:2px; text-transform:uppercase; color:var(--dim);
  }
  #hud b { color:var(--ink); }
  #ov-stars { font-size:30px; letter-spacing:8px; margin-bottom:10px; color:var(--track); min-height:34px; }
  /* LEVEL CLEAR: no stars, no score — just the heading and a (barbed) compliment,
     laid out exactly like the death screen so the two read as a matched pair */
  #overlay.win #ov-stars { min-height:0; margin:0; }
  #overlay.win p { font-size:var(--body); line-height:1.5; color:#fff1ea; margin-bottom:26px; }
  #ov-score:empty { margin:0; }
  #ov-score { display:flex; flex-direction:column; gap:5px; margin:2px auto 20px; max-width:230px; }
  #ov-score .ov-ln { display:flex; justify-content:space-between; gap:24px; color:#fff; font-size:var(--body);
    letter-spacing:1px; text-transform:uppercase; opacity:0; transform:translateY(7px);
    transition:opacity .26s ease, transform .26s ease; }
  #ov-score .ov-ln span:last-child { font-weight:900; }
  #ov-score .ov-ln.show { opacity:1; transform:none; }
  #ov-score .ov-total { font-size:var(--body); font-weight:900; color:#fff; margin-top:7px; padding-top:9px;
    border-top:2px solid rgba(255,255,255,0.25); }
  #ov-score .ov-best { justify-content:center; color:var(--goal); font-size:var(--body); margin-top:6px; }
  #overlay.lose #ov-score { display:none; }
  #pauseFloat {
    position:fixed; z-index:15; padding:0; cursor:pointer;
    top:calc(env(safe-area-inset-top) + 12px); right:calc(env(safe-area-inset-right) + 12px);
    /* square, like every other button in the UI — the circle was the odd one out */
    width:44px; height:44px; border-radius:0; display:flex; align-items:center; justify-content:center; gap:5px;
    background:rgba(23,20,43,0.72); border:2px solid var(--grid-line); box-shadow:2px 2px 0 var(--shadow);
  }
  #pauseFloat span { width:4px; height:16px; background:var(--ink); border-radius:1px; }
  /* The whirlpool eats the canvas, but the two floating buttons are DOM — so they get
     pulled in too rather than simply blinking out a moment before everything else. */
  body.vortex #pauseFloat, body.vortex #power {
    transition: transform 2.4s cubic-bezier(.6,0,.85,.2), opacity 2.4s ease-in;
    transform: scale(0.02) rotate(520deg); opacity: 0; pointer-events: none;
  }
  /* The talisman's one shot at this level. Bottom RIGHT — diagonally opposite the pause
     button, clear of the board's top edge (which is where the runner is heading), and on the
     side a thumb is already on. Just the icon: the name never changed between presses and the
     sub-line's job is done by the class — dim for spent or running, armed for waiting, plus
     the bar draining along the bottom. */
  /* Every talisman you have found, along the bottom of the level. No plate, no border, no
     shadow — each is just the object itself, the way it looks lying on the board. A row of
     bordered buttons down there read as UI chrome competing with the track. */
  #power {
    position:fixed; z-index:15; display:none; align-items:flex-end; justify-content:center;
    gap:2px; left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom) + 10px);
    pointer-events:none;                 /* the strip is a layout box; only the charms take taps */
  }
  #power.on { display:flex; }
  /* The charms sit over the board, which is whatever colour that level happens to be — and a
     gold talisman on a gold track is a talisman you cannot find. This grounds the strip: a tall
     soft shadow rising out of the bottom edge, dark enough to separate them from the ground
     behind and diffuse enough never to read as a bar. It is behind the buttons and takes no
     taps, so nothing about reaching them changes. */
  #power::before {
    content:""; position:fixed; left:0; right:0; bottom:0; height:210px;
    background:linear-gradient(to top,
      rgba(5,4,13,0.72) 0%, rgba(5,4,13,0.52) 26%, rgba(5,4,13,0.24) 58%, rgba(5,4,13,0) 100%);
    pointer-events:none; z-index:-1;
  }
  #power .pw {
    /* box-shadow has to be cleared explicitly: the global `button` rule paints a 3px offset
       plate shadow, and killing only the background and border left that behind — which is
       exactly the button shape that was still showing through. */
    position:relative; background:none; border:0; box-shadow:none; padding:0; margin:0;
    cursor:pointer; pointer-events:auto; line-height:0;
    /* Each hangs at its own slight angle, set per charm in JS — five identical uprights read
       as a toolbar, a few degrees apart reads as things you collected. The tilt lives in a
       custom property so :active can add its nudge without throwing the rotation away. */
    transform:rotate(var(--tilt, 0deg));
    transition:opacity 0.18s, transform 0.12s;
  }
  #power .pw canvas { width:58px; height:58px; display:block; }
  #power .pw:active { transform:rotate(var(--tilt, 0deg)) translateY(2px); }
  /* running: a bar draining under the one that is up */
  #power .pw-bar { position:absolute; left:12%; bottom:2px; height:3px; width:0; background:var(--goal); }
  /* one power per level: once any has fired, the rest have nothing left to give */
  #power .pw.dim { opacity:0.30; cursor:default; }
  #power .pw.live { opacity:1; }
  /* armed and waiting to be aimed (the Hammer) */
  #power .pw.armed canvas { filter:drop-shadow(0 0 6px var(--goal)); }
  #pauseFloat:active { transform:translate(2px,2px); box-shadow:none; }
  /* A talisman maze's win card. Bigger title, the charm itself where the stars normally go,
     and no score furniture — this screen is about the object, not the run. */
  #overlay.relic #ov-title { font-size:26px; letter-spacing:3px; color:var(--goal); }
  .ov-relic { width:170px; height:170px; display:block; margin:2px auto -6px; }
  .ov-relic-does { display:block; font-size:15px; letter-spacing:2px; line-height:1.35;
    color:var(--ink); text-transform:uppercase; font-weight:900; margin:4px auto 2px; }
  /* the standing rule, last and quietest */
  #overlay.relic #ov-msg { font-size:11px; letter-spacing:0.6px; line-height:1.5;
    color:var(--dim); text-transform:none; font-weight:700; max-width:34ch; margin:2px auto 0; }
  #mechpop {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(5,4,13,0.86); z-index:35;
    padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 24px)
            calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);
  }
  #mechpop.show { display:flex; }
  .mech-card {
    max-width:300px; text-align:center; background:var(--panel);
    border:3px solid var(--grid-line); box-shadow:5px 5px 0 var(--shadow); padding:20px 22px 18px;
  }
  .mech-tag { font-size:var(--body); letter-spacing:3px; text-transform:uppercase; color:var(--accent); font-weight:900; }
  #mech-icon { width:112px; height:112px; margin:8px auto 4px; display:block; }
  .mech-card h3 { font-size:18px; letter-spacing:2px; text-transform:uppercase; color:var(--track); margin:2px 0 8px; }
  .mech-card p { font-size:var(--body); line-height:1.6; color:var(--ink); margin-bottom:16px; }
  .mech-card button { width:100%; }
  #ready { color:var(--free); }
  #board-wrap { flex:1; width:100%; display:flex; align-items:stretch; justify-content:center; min-height:0; overflow:hidden; }
  canvas { image-rendering:pixelated; touch-action:none; display:block; }
  footer { padding:10px 0 16px; display:flex; gap:12px; }
  button {
    font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:2px; font-size:var(--btn);
    color:var(--ink); background:var(--panel); border:3px solid var(--grid-line);
    box-shadow:3px 3px 0 var(--shadow); padding:11px 16px; cursor:pointer; touch-action:manipulation;
  }
  button:active { transform:translate(3px,3px); box-shadow:none; }
  #overlay {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:radial-gradient(ellipse 76% 56% at 50% 46%, rgba(5,4,13,0.52) 0%, rgba(5,4,13,0.42) 45%, rgba(5,4,13,0.10) 100%);
    z-index:20; text-align:center;
    padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 24px)
            calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);
  }
  #overlay.show { display:flex; }
  #overlay .card { max-width:340px; }
  /* big, bold, 3D-extruded like the title header (just smaller) */
  #overlay h2 { font-size:46px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
    margin-bottom:16px; transform:rotate(-4deg); line-height:1.05; }
  #overlay p { font-size:var(--body); line-height:1.5; color:var(--dim); margin:0 auto 20px; letter-spacing:1px;
    max-width:19rem; text-wrap:balance; }   /* setByline() places the break; 19rem is the narrowest
                                              width at which all 47 quips still fit on two lines */
  #overlay.win h2 { color:#8dff78;
    text-shadow:1px 1px 0 #3a8a45, 2px 2px 0 #2f7439, 3px 3px 0 #256030, 4px 4px 0 #1c4c26, 5px 6px 10px rgba(5,4,13,0.65); }
  #overlay.lose h2 { color:#ff8f74; margin-bottom:15px;
    text-shadow:1px 1px 0 #c24a34, 2px 2px 0 #a83b2a, 3px 3px 0 #8a2f21, 4px 4px 0 #6b2318, 5px 6px 10px rgba(5,4,13,0.65); }
  /* death screen: tighten heading↔byline, bigger/brighter byline, larger retry button */
  #overlay.lose #ov-stars { min-height:0; margin-bottom:0; }
  #overlay.lose p { font-size:var(--body); line-height:1.5; color:#fff1ea; margin-bottom:26px; }
  /* Both end screens carry the same two buttons, and they are sized like the menu's — same
     330px column, same full width — so the end of a level lands on the same shape as every
     other decision in the game rather than on a pair of one-off pills. */
  #overlay.lose #ov-btn, #overlay.win #ov-btn { font-size:var(--btn); padding:16px 40px; }
  #overlay.lose #ov-btn, #overlay.win #ov-btn {
    display:block; width:100%; max-width:330px; margin-left:auto; margin-right:auto; }
  /* flex, not block: this one carries a label, the tile and the count as three children */
  #overlay.lose #ov-shop, #overlay.win #ov-shop {
    display:flex; width:100%; max-width:330px; margin-left:auto; margin-right:auto; }
  /* The way into the shop, on BOTH end screens — a fall is exactly when you have just banked
     a handful of tiles and might want to spend them. Same gold, same size, same weight as the
     one in the menu: it is the same button and has no business looking like a different one. */
  #ov-shop { display:none; margin:10px auto 0; font-size:var(--btn); letter-spacing:2px;
    padding:14px 22px; }

  /* "Add to Home Screen" prompt (mobile browsers only) */
  #a2hs {
    position:fixed; left:12px; right:12px; bottom:14px; z-index:28;
    display:none; align-items:center; gap:11px;
    background:var(--panel); border:3px solid var(--grid-line);
    box-shadow:4px 4px 0 var(--shadow); padding:11px 12px 11px 13px;
  }
  #a2hs.show { display:flex; animation:a2hsIn .34s ease-out; }
  @keyframes a2hsIn { from { transform:translateY(26px); opacity:0; } to { transform:none; opacity:1; } }
  #a2hs-ic { flex:none; color:var(--track); display:flex; align-items:center; }
  #a2hs-ic svg { display:block; }
  #a2hs-txt { flex:1; font-size:11.5px; line-height:1.55; letter-spacing:.4px; color:var(--ink); text-transform:none; }
  #a2hs-txt b { color:var(--track); font-weight:900; }
  #a2hs .a2hs-acts { flex:none; display:flex; flex-direction:column; gap:6px; }
  #a2hs .a2hs-acts button { padding:8px 10px; font-size:10px; letter-spacing:1px; box-shadow:2px 2px 0 var(--shadow); }
  #a2hs .a2hs-x { background:transparent; border-color:transparent; box-shadow:none; color:var(--dim); padding:6px 8px; }
  #a2hs .a2hs-x:active { transform:none; }

  /* colorblind-friendly palette (Okabe–Ito) */
  .cb { --accent:#d55e00; --goal:#009e73; --runner:#56b4e9; }

  #menu {
    /* A centred flex child that outgrows its scroll container gets clipped at the TOP and
       can't be scrolled back to — which the shop, being the tallest screen here, does.
       safe-centring keeps it centred while it fits and pins it to the top once it doesn't. */
    position:fixed; inset:0; display:none; align-items:safe center; justify-content:center;
    /* the shop is the tall one — it is pinned to the top so the runner and the tabs stay put
       as you switch between racks of different lengths, instead of the whole card sliding */
    background:radial-gradient(ellipse 84% 70% at 50% 50%, rgba(5,4,13,0.58) 0%, rgba(5,4,13,0.48) 48%, rgba(5,4,13,0.14) 100%);
    z-index:30; overflow:auto;
    /* #app pads for the notch, but a fixed inset:0 layer sits OUTSIDE it and covers the whole
       screen — so the shop's title landed under the notch. Add the insets here as well. */
    padding:calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + 22px)
            calc(env(safe-area-inset-bottom) + 22px) calc(env(safe-area-inset-left) + 22px);
  }
  #menu.show { display:flex; }
  #menu.top { align-items:flex-start; }
  .menu-card { width:100%; max-width:330px; text-align:center; }
  .menu-ver { font-size:var(--body); letter-spacing:2px; color:var(--dim); margin-top:14px; opacity:0.7; }
  .menu-card h2 { font-size:18px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--track);
    text-shadow:2px 2px var(--shadow); margin-bottom:16px; }
  /* the main menu's header is the title logo in miniature — same flat gold extrusion and
     -4° tilt as the canvas one in draw3DText (TITLE_SIDE), just built out of text-shadow */
  .menu-card h2.logo {
    font-size:40px; line-height:0.9; letter-spacing:1px; margin-bottom:24px;
    transform:rotate(-4deg);
    text-shadow:
      1px 1px 0 #a87b18, 2px 2px 0 #a87b18, 3px 4px 0 #a87b18, 4px 5px 0 #a87b18,
      5px 6px 0 #a87b18, 6px 7px 0 #a87b18;
  }
  #menu-body { display:flex; flex-direction:column; gap:9px; }
  #menu-body button { width:100%; }
  /* The one button in the menu that is about money, in the colour of the money. A deeper
     gold than the loot tile itself, so the tile sitting on it still reads as an object rather
     than dissolving into its own background. */
  #menu-body button.gold, #ov-shop { background:#e0aa1e; border-color:#8f6a10; color:#38270a;
    box-shadow:3px 3px 0 rgba(5,4,13,0.55); }
  #menu-body button.gold:active, #ov-shop:active { transform:translate(3px,3px); box-shadow:none; }
  /* label · coin · count, on one line and centred as a group */
  #menu-body button:has(canvas.wallet), #ov-shop {
    display:flex; align-items:center; justify-content:center; gap:9px; }
  canvas.wallet { width:17px; height:17px; display:block; }
  /* armed, and about to throw everything away */
  #menu-body button.danger { border-color:#ff6d6d; color:#ff9d9d; box-shadow:0 0 0 2px #ff6d6d inset; }
  .menu-sub { font-size:var(--btn); font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--dim);
    margin:10px 0 2px; }
  .toggle { display:flex; justify-content:space-between; align-items:center;
    border:3px solid var(--grid-line); background:var(--panel); box-shadow:3px 3px 0 var(--shadow);
    padding:10px 14px; font-family:inherit; font-weight:900; text-transform:uppercase;
    letter-spacing:2px; font-size:var(--btn); color:var(--ink); cursor:pointer; }
  .toggle .val { color:var(--track); }
  .toggle.off .val { color:var(--dim); }
  .lvl-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .lvl-grid button { display:flex; flex-direction:column; gap:3px; padding:12px 0; line-height:1.1; }
  .tal-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  /* Stock is a square of glass, not a button: no outline, no offset plate, just a 5% white
     wash. A shop item is a thing on a shelf — fifteen bevelled plates read as a wall of
     controls. The border is kept and made transparent so .on and .nope can still colour it
     without shifting anything by 3px. The swatch is the item, so it gets the room. */
  .tal-grid .tal { display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; padding:7px 3px; aspect-ratio:1;
    background:rgba(255,255,255,0.05); border-color:transparent; box-shadow:none; color:#fff; }
  .tal-grid .tal:active { transform:none; background:rgba(255,255,255,0.14); }
  .tal-grid .tal canvas { width:62px; height:62px; }
  /* names are long ("Nightshard", "Green Sprig") and the cells are a third of a narrow
     menu — well below body size, tight leading, and allowed to wrap to two lines. */
  .tal-grid .tal span { font-size:11px; letter-spacing:0.2px; line-height:1.15;
                        text-align:center; hyphens:none; color:#fff; }
  .tal-grid .tal.locked span { color:var(--dim); }
  /* what the talisman actually does — the reason to pick one over another */
  .tal-grid .tal .tal-blurb { font-size:9px; letter-spacing:0.2px; line-height:1.1; font-style:normal;
    text-transform:none; font-weight:700; color:var(--track); text-align:center; }
  /* What is worn reads as a lit plate rather than a ringed one — an outline on a square that
     already has a border competes with it, where a brighter ground just says "this one". */
  .tal-grid .tal.on { background:rgba(125,255,107,0.16); border-color:transparent;
                      box-shadow:none; color:#eaffe6; }
  .tal-grid .tal.on span { color:#dcffd4; }
  /* The talisman shelf. Deliberately NOT buttons: no border, no plate, no shadow — a talisman
     is a thing you found, and dressing it in the same chrome as RESUME made it stock. What
     marks the worn one is a soft halo of its own colour, not a pressed-in frame. */
  .relic-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px 0; margin:2px 0 10px; }
  .relic { display:flex; flex-direction:column; align-items:center; gap:1px;
    background:none; border:0; padding:0; cursor:pointer; }
  .relic canvas { width:96px; height:96px; display:block; }
  .relic span { font-size:10px; letter-spacing:0.4px; line-height:1.15; text-align:center;
    text-transform:uppercase; font-weight:900; color:var(--ink); }
  .relic i { font-size:9px; letter-spacing:0.2px; line-height:1.1; font-style:normal;
    font-weight:700; color:var(--track); text-align:center; }
  .relic.locked { cursor:default; }
  .relic.locked span { color:var(--dim); }
  .relic.on canvas { filter:drop-shadow(0 0 7px var(--goal)); }
  .relic.on span { color:var(--goal); }
  /* SHOP wears the big title treatment — it is a destination, not a sub-menu */
  #menu-title.shop { font-size:40px; letter-spacing:7px; margin-bottom:4px; }
  /* the shop: him at the top, tucked right under the title, then a tab per category */
  .shop-fig { width:100%; max-width:230px; margin:-6px auto 0; }
  .shop-fig canvas { display:block; width:100%; height:auto; }
  /* the wallet, sitting on the picture rather than costing a line of its own */
  /* The count IS the wallet — the word "TILES" said nothing the coin beside it didn't, and
     it was the only reason the number had to stay small enough to leave room for it. */
  .shop-purse { display:flex; align-items:center; justify-content:center; gap:9px;
    margin:-4px auto 10px; font-size:26px; letter-spacing:1px; color:var(--track); font-weight:900; }
  .shop-purse canvas { width:26px; height:26px; }
  /* #menu-body button sets width:100%, and an id beats a class — so these have to match it */
  .shop-tabs { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:6px; }
  #menu-body .shop-tabs button { width:100%; padding:5px 0 4px; font-size:7px; letter-spacing:0.2px;
    border-width:2px; box-shadow:2px 2px 0 var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1; }
  #menu-body .shop-tabs button canvas { width:20px; height:20px; display:block; }
  #menu-body .shop-tabs button.on { border-color:var(--goal); color:var(--goal);
    box-shadow:0 0 0 2px var(--goal) inset; }
  #menu-body .shop-tabs button:active { transform:translate(2px,2px); box-shadow:none; }
  /* the rack scrolls on its own, so the runner and the tabs stay put while you browse */
  .shop-rack { max-height:44vh; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; padding:2px; margin-bottom:10px; }
  /* the way out, and the only thing you can do wrong is not press it */
  /* The way out is pinned to the viewport, not to the end of the rack: the racks are
     different lengths and the shop is top-aligned, so otherwise it wanders down the page and
     on the long ones you have to scroll to leave. #menu-body sets width:100% and an id beats
     a class, so the width has to be restated here. */
  #menu-body .shop-go {
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 16px);
    width:calc(100% - 44px); max-width:330px; z-index:2;
    font-size:13px; letter-spacing:2px; padding:14px 10px; line-height:1.2;
  }
  #menu-body .shop-go:active { transform:translateX(-50%) translate(3px,3px); box-shadow:none; }
  /* ...and the rack keeps clear of it, so the last row is never stuck underneath */
  #menu.top #menu-body { padding-bottom:80px; }
  /* what the tab is showing, and what of it is on */
  .shop-worn { text-align:center; font-size:11px; letter-spacing:0.5px; color:var(--dim);
    text-transform:none; font-weight:700; margin:1px 0 2px; }
  /* can't afford it yet — a short shake rather than a dialog */
  .tal-grid .tal.nope { animation:nope 0.4s; border-color:#ff8f74; }
  @keyframes nope { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);}
                    50%{transform:translateX(4px);} 75%{transform:translateX(-2px);} }
  /* The level rack scrolls inside itself, exactly as the shop's does, so cells never slide
     under the pinned BACK. It has no runner or tab strip above it, so it takes everything
     between the INTRO button and the button's landing strip. */
  .lvl-rack { max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 210px);
              min-height:180px; }
  .lvl-grid .st { font-size:var(--body); color:var(--goal); letter-spacing:1px; font-weight:900; }
  .lvl-grid .st.none { color:var(--dim); font-weight:400; }

</style>
</head>

<script src="levels.js"></script>
<script>
(() => {
  "use strict";

  // ---------- Levels ------------------------------------------------------
  let COLS = 7, ROWS = 13;                   // per-level board size (set in beginLevel)
  const FULL_COLS = 7, FULL_ROWS = 13;       // fallback board size if a level omits cols/rows
  // --- TEST LEVEL: breaking stone is REQUIRED to reach the goal -----------
  // Three full-width barriers span the grid; the ONLY opening in each is a
  // stone tile, so the runner physically cannot advance without smashing it.
  // Verified by BFS: solvable when the stones can be broken, and impossible
  // if they were treated as unbreakable walls. The forced route passes over
  // all three stones ([3,8] and [1,5] before the key, [4,2] after) on the
  // way to the key and the exit.
  // 50-level campaign: each new mechanic is introduced on its own level (see `intro`).
  // The campaign lives in levels.js and nowhere else. It is loaded by the <script> tag
  // above as a global, so there is no second copy here to drift out of step with it.
  // `n` is the editor's label for a level; the game indexes by position and ignores it.
  const LEVELS = (typeof LEVELS_DATA !== "undefined" ? LEVELS_DATA : [])
                   .map(L => { const { n, ...rest } = L; return rest; });

  // ---------- DOM ---------------------------------------------------------
  const canvas = document.getElementById("game");
  let ctx = canvas.getContext("2d");     // `let`, so hint icons can borrow the game's own
                                        // drawing routines against another canvas (withCanvas)
  const elLevel = document.getElementById("level");
  const elReady = document.getElementById("ready");
  const elKey = document.getElementById("keystate");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ov-title");
  const ovMsg = document.getElementById("ov-msg");
  // The card's byline always reads as two balanced lines. CSS text-wrap:balance can even up
  // a line that already wraps but cannot force a short quip onto two, and a one-line card
  // sits at a different height from a two-line one — which is what makes the win screen
  // jump about between levels. Split on the word boundary nearest the middle.
  const escHtml = t => t.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  function setByline(el, text) {
    const w = String(text).split(/\s+/).filter(Boolean);
    if (w.length < 2) { el.textContent = text; return; }
    let cut = 1, best = Infinity;
    for (let i = 1; i < w.length; i++) {
      const d = Math.abs(w.slice(0, i).join(" ").length - w.slice(i).join(" ").length);
      if (d < best) { best = d; cut = i; }
    }
    el.innerHTML = escHtml(w.slice(0, cut).join(" ")) + "<br>" + escHtml(w.slice(cut).join(" "));
  }
  const ovBtn = document.getElementById("ov-btn");
  const ovShop = document.getElementById("ov-shop");
  const elScore = document.getElementById("score");
  const ovStars = document.getElementById("ov-stars");
  const ovScore = document.getElementById("ov-score");

  // ---------- Tunables ----------------------------------------------------
  // How many track tiles a level plays with. Three is the game's shape and what all 24
  // shipped levels use, but nothing in the engine assumes it: the count is the start cell
  // plus however many are pre-laid in `init`, and the runner's head is the last of them.
  // A level carrying more simply lists more cells. TILES_MAX is a sanity bound.
  const TILES_MAX = 8;
  const GRACE_MS = 2600;
  const MIN_CELL = 78, MAX_CELL = 170;
  const VIEW_COLS = 4.2, VIEW_ROWS = 6;
  const CAM_LERP = 0.009;
  // Slack, in CELLS, that the camera may travel past the outer edge of the board. Without
  // it the camera stops dead on the last row/column and the edge tiles sit welded to the
  // frame; a sliver of overshoot lets the backdrop breathe around the board. Every edge gets
  // the same slack — the top used to get double, which just read as a lopsided board.
  // Widened from 0.05 when the boundary walls went in: at 0.05 the camera stopped 6px past
  // the board, so the left and right courses were drawn and never seen. This shows a band of
  // them when the runner hugs a side, without meaningfully changing how much board is in shot.
  const CAM_EDGE_PAD = 0.22;                  // left, right and bottom
  // The TOP gets much more than the other three. The speed plate and the pause button live up
  // there, and with the same sliver everywhere the whole first row sat squarely behind them.
  // The UI band measures a shade under half a cell, so this leaves the first row overlapping
  // it by only its top sliver. Going past ~0.46 opens a visible gap instead, which reads as
  // the board having slipped down the screen rather than as breathing room.
  const CAM_TOP_PAD = 0.38;
  // ...and the BOTTOM gets its own, because the talisman rack lives down there on every level.
  // The rack is 58px of charm plus a 10px gap — about 0.54 of a cell — so this clears it with
  // a little to spare rather than leaving the last row half-buried under the charms.
  const CAM_BOTTOM_PAD = 0.60;
  const TRACK_T = 0.44;        // platform thickness as fraction of cell (hangs below centre)
  const SAMPLE_D = 0.42;       // tangent smoothing window (path-param units)
  const FALL_G = 0.0022, FALL_MS = 850;   // gravity fall on lose
  // Running into a wall reads differently to running off a ledge, so it gets its own
  // beat: the runner concertinas against the face, then peels off and falls.
  const SQUASH_MS = 260;                  // how long the squash holds before gravity
  const SQUASH_X  = 0.52;                 // compression along travel at full squash
  const SQUASH_Y  = 1.26;                 // matching bulge across it (keeps the mass honest)

  // ---------- Sound engine ------------------------------------------------
  // A tiny Web Audio synth + backing band. Every cleared tile is one BEAT: the
  // runner moves at a constant ms-per-cell, so clears land at a perfectly even
  // cadence. Each beat plays the next note of a looping MELODY and, locked to
  // that same instant, a bass note, a soft kick, and an off-beat hi-hat; each
  // bar (4 beats) also (re)starts a sustained chord PAD. Because every beat is
  // anchored to a real tile event and the between-beat hat is scheduled on the
  // audio clock, the whole arrangement stays in sync with the tiles with no
  // drift, and its tempo tracks each level's speed. Resets each level.
  // ---------- Music -------------------------------------------------------
  // Tuned in music-lab.html and pasted here whole. A level may carry `music: {...}` in
  // levels.js to override any of these for itself; everything else falls through.
  const MUSIC_DEFAULTS = {
    seed: 0,
    scale: "pentaMajor",
    keyLock: 0,
    key: 0,
    prog: -1,
    chordType: "auto",
    melodyLeap: 0.15,
    melodyStart: -1,
    swing: 0,
    beatsPerTile: 4,
    midVel: 0.42,
    barLen: 4,
    bgEvery: 4,
    bgFollow: "chord",
    leadOn: 1,
    padOn: 1,
    kickOn: 1,
    hatOn: 1,
    subOn: 1,
    offBassOn: 1,
    leadVel: 0.8,
    padVel: 0.14,
    kickVel: 0.7,
    hatVel: 0.12,
    subVel: 0.85,
    offBassVel: 0.42,
    leadOct: 0,
    padOct: -12,
    master: 0.16,
    baseHz: 220,
    waveA: "sine",
    waveB: "sine",
    delayTime: 0.24,
    feedback: 0.34,
    damp: 2400,
    wet: 0.3,
    bassLpf: 340,
    kickHz: 130,
    kickDrop: 46,
    hatHz: 7000,
    voxOn: 0,
    voxStyle: "choir",
    voxVel: 0.2,
    voxOct: -12,
    voxVowel: 0.25,
    voxVib: 5.2,
    voxVibDepth: 8,
    voxSpread: 12,
    voxShimmer: 0.25,
    leadA: 0.008,
    leadD: 0.9,
    leadS: 0,
    leadR: 0.01,
    bgA: 0.3,
    bgD: 4.6,
    bgS: 0,
    bgR: 0.02,
    basA: 0.012,
    basD: 1.1,
    basS: 0,
    basR: 0.02,
    kickA: 0.005,
    kickD: 0.15,
    kickS: 0,
    kickR: 0.01,
    hatA: 0.003,
    hatD: 0.045,
    hatS: 0,
    hatR: 0.005,
    voxWet: 0.55,
    bassStyle: "classic",
    bassDrive: 0.3,
    bassSubVel: 1,
    bassFM: 1.5,
    bassGlide: 0.05
  };

  const Sound = (() => {
    const BASE = 220;                          // A3, in Hz
    const WAVES  = ["sine", "sine"];           // lead timbre alternates per step
    // Melody notes per cleared tile. The tile clear itself gets the full detuned
    // two-oscillator voice; the three notes between clears are single-oscillator
    // and quieter, so the ear still hears the clear as the downbeat.
    const SUBDIV  = 4;
    const MID_VEL = 0.42;                      // in-between note level, vs 0.8 on the clear
    // Lead melody + chord loop — regenerated per level by setSong(seed).
    let MELODY = [0, 4, 7, 4,  9, 7, 4, 2,  0, 4, 7, 12,  9, 7, 4, 2];
    let CHORDS = [ {root:0,tones:[0,4,7]}, {root:5,tones:[5,9,12]}, {root:9,tones:[9,12,16]}, {root:7,tones:[7,11,14]} ];
    let KEY = 0, PROGUSED = 0;
    // The live music settings: the defaults with this level's `music` block laid over them.
    // Named MU rather than M because ambTick() already has a local M, and shadowing it there
    // would be a trap rather than a convenience.
    let MU = { ...MUSIC_DEFAULTS };
    const mhz = semi => MU.baseHz * Math.pow(2, semi/12);
    let delayN = null, fbN = null, dampN = null, wetN = null;
    // Everything the music makes leaves through here. The sound effects do not, which is what
    // lets a level end silence the backing — including notes still ringing, and at bgEvery 8
    // a background note can be ten seconds long — without muting the win jingle on top of it.
    let musicBus = null;
    const SCALES = {
      pentaMajor:[0,2,4,7,9,12,14],       // the shipped sound: open, bright, no wrong notes
      pentaMinor:[0,3,5,7,10,12,15],      // instantly tense — the saw-level sound
      dorian:    [0,2,3,5,7,9,10,12],     // minor with a raised 6th: melancholy but not grim
      aeolian:   [0,2,3,5,7,8,10,12],     // natural minor, the darkest of these
      lydian:    [0,2,4,6,7,9,11,12],     // major with a #4: floaty, dreamlike
      hirajoshi: [0,2,3,7,8,12,14,15],    // Japanese pentatonic, very distinctive
      blues:     [0,3,5,6,7,10,12,15],
      wholeTone: [0,2,4,6,8,10,12,14],    // no home note at all — unsettling, use sparingly
    };
    const PROGS = [
      [0,5,7,5], [0,7,9,7], [0,5,9,7], [0,9,5,7], [0,4,5,7],   // the five the game ships
      [0,3,8,7], [0,10,5,7], [0,8,3,5], [0,0,5,5],             // minor-leaning + a static one
    ];
    const CHORDS_T = {
      triad:[0,4,7], minor:[0,3,7], sus4:[0,5,7], sus2:[0,2,7],
      min7:[0,3,7,10], maj7:[0,4,7,11], add9:[0,4,7,14], fifth:[0,7],
    };
    const MINORISH = { pentaMinor:1, dorian:1, aeolian:1, blues:1, hirajoshi:1 };
    
    function chordIvls(){
      if (MU.chordType !== "auto") return CHORDS_T[MU.chordType] || CHORDS_T.triad;
      return MINORISH[MU.scale] ? CHORDS_T.minor : CHORDS_T.triad;
    }
    const ENV = pre => ({ a:+MU[pre+"A"], d:+MU[pre+"D"], s:+MU[pre+"S"], r:+MU[pre+"R"] });
    function adsr(g, t, dur, vel, E){
      const v = Math.max(0.0002, vel);
      let a = Math.max(0.002, E.a), d = Math.max(0.002, E.d), r = Math.max(0.004, E.r);
      // A sustain of zero is a struck voice: attack, then ONE decay that dies inside the note.
      // The decay is capped by the note rather than fixed, which is what makes a short note snap
      // and a long one ring — the same shape every voice in this game had before it had an
      // envelope at all. Release has nothing left to do, so it sits this case out.
      if (E.s <= 0.0005) {
        const aa = Math.min(a, dur*0.5), dd = Math.min(d, Math.max(0.004, dur - aa));
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(v, t + aa);
        g.gain.exponentialRampToValueAtTime(0.0006, t + aa + dd);
        return aa + dd;
      }
      // An envelope has to fit inside its own note. Unclamped, a long decay made a SHORT note
      // ring on well past the next one — the notes filling the gaps between tile clears are a
      // fifth of a beat each, and a 0.9s tail on those is a smear, not a melody.
      const need = a + d + r;
      if (need > dur) { const k = dur / need; a *= k; d *= k; r *= k; }
      const sv = Math.max(0.0002, v * Math.min(1, Math.max(0, E.s)));
      const rel = Math.max(a + d, dur - r);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + a);
      g.gain.exponentialRampToValueAtTime(sv, t + Math.min(a + d, rel));
      g.gain.setValueAtTime(sv, t + rel);
      g.gain.exponentialRampToValueAtTime(0.0006, t + rel + r);
      return rel + r;                                     // how long the note actually runs for
    }
    const VOWELS = {
      ah: [[800,1150,2900],[1.00,0.50,0.25]],
      oo: [[325, 700,2530],[1.00,0.35,0.12]],
      oh: [[500,1000,2400],[1.00,0.45,0.18]],
      ee: [[270,2300,3000],[1.00,0.60,0.30]],
      eh: [[530,1850,2500],[1.00,0.55,0.22]],
    };
    const VOX_STYLES = {
      choir:    { vowels:["ah","oh"], wave:"sawtooth", voices:[-14,-5,5,14], oct:  0, q:7, sh:1.0 },
      nebula:   { vowels:["oo","ah"], wave:"sawtooth", voices:[-20,-7,7,20], oct:  0, q:5, sh:1.6 },
      monolith: { vowels:["oh","oo"], wave:"sawtooth", voices:[-9,-3,3,9],   oct:-12, q:9, sh:0.4 },
      aurora:   { vowels:["eh","ee"], wave:"triangle", voices:[-16,-6,6,16], oct: 12, q:6, sh:2.0 },
    };
    const _curves = {};
    function driveCurve(amt){
      const k = Math.round(Math.max(0.001, amt)*80);
      if (_curves[k]) return _curves[k];
      const n = 1024, c = new Float32Array(n);
      for (let i=0;i<n;i++){ const x = i*2/n - 1; c[i] = (1+k)*x/(1+k*Math.abs(x)); }
      return (_curves[k] = c);
    }
    function voxVoice(t, semi, dur, vel){
      const S = VOX_STYLES[MU.voxStyle] || VOX_STYLES.choir;
      const A = VOWELS[S.vowels[0]], B = VOWELS[S.vowels[1]], u = MU.voxVowel;
      const f = mhz(semi + S.oct);
      const out = ac.createGain();
      dur = adsr(out, t, dur, vel, ENV("bg"));
      out.connect(musicBus);
      if (MU.voxWet > 0){ const w = ac.createGain(); w.gain.value = MU.voxWet; out.connect(w); w.connect(sendBus); }
    
      // the singers, all sharing one vibrato so they breathe together rather than fight
      const raw = ac.createGain(); raw.gain.value = 1/(S.voices.length+1);
      const lfo = ac.createOscillator(); lfo.type="sine"; lfo.frequency.value = MU.voxVib;
      const lfoG = ac.createGain(); lfoG.gain.value = MU.voxVibDepth;
      lfo.connect(lfoG); lfo.start(t); lfo.stop(t+dur+0.1);
      const spread = MU.voxSpread/14;
      for (const c of S.voices){
        const o = ac.createOscillator(); o.type = S.wave;
        o.frequency.setValueAtTime(f, t); o.detune.setValueAtTime(c*spread, t);
        lfoG.connect(o.detune);
        o.connect(raw); o.start(t); o.stop(t+dur+0.1);
      }
      if (MU.voxShimmer > 0){                      // the octave-up ghost
        const o = ac.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(f*2, t);
        const g = ac.createGain(); g.gain.value = MU.voxShimmer*S.sh*0.18;
        lfoG.connect(o.detune);
        o.connect(g); g.connect(raw); o.start(t); o.stop(t+dur+0.1);
      }
      for (let i=0;i<3;i++){                      // the formant bank — the voice itself
        const bp = ac.createBiquadFilter(); bp.type="bandpass";
        bp.frequency.value = A[0][i]*(1-u) + B[0][i]*u;
        bp.Q.value = S.q;
        const g = ac.createGain(); g.gain.value = A[1][i]*(1-u) + B[1][i]*u;
        raw.connect(bp); bp.connect(g); g.connect(out);
      }
      const body = ac.createGain(); body.gain.value = 0.18;   // a little raw tone underneath, or
      raw.connect(body); body.connect(out);                    // the formants sound hollow
    }
    function bassHeavy(t, semi, dur, vel){
      const style = MU.bassStyle, f = mhz(semi);
      const out = ac.createGain();
      dur = adsr(out, t, dur, vel, ENV("bas"));
      const lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.Q.value = 1.1;
      lp.frequency.setValueAtTime(MU.bassLpf*2.2, t);                       // a filter sweep down
      lp.frequency.exponentialRampToValueAtTime(Math.max(60, MU.bassLpf), t+Math.max(0.05,dur*0.5));
      out.connect(lp); lp.connect(musicBus);
      const sub = ac.createOscillator(); sub.type="sine";
      sub.frequency.setValueAtTime(f*(1 + MU.bassGlide*2), t);              // dips into pitch
      sub.frequency.exponentialRampToValueAtTime(f, t+Math.max(0.01, MU.bassGlide));
      const sg = ac.createGain(); sg.gain.value = MU.bassSubVel;
      sub.connect(sg); sg.connect(out); sub.start(t); sub.stop(t+dur+0.06);
      if (style !== "rumble"){
        const b = ac.createOscillator(); b.type = style==="growl" ? "square" : "sawtooth";
        b.frequency.setValueAtTime(f*2, t);
        if (style === "growl"){                                            // FM snarl
          const mod = ac.createOscillator(); mod.type="sine"; mod.frequency.value = f*MU.bassFM;
          const mg = ac.createGain(); mg.gain.value = f*1.8;
          mod.connect(mg); mg.connect(b.frequency); mod.start(t); mod.stop(t+dur+0.06);
        }
        const sh = ac.createWaveShaper(); sh.curve = driveCurve(MU.bassDrive); sh.oversample="2x";
        const bg = ac.createGain(); bg.gain.value = style==="deep" ? 0.55 : 0.42;
        b.connect(sh); sh.connect(bg); bg.connect(out); b.start(t); b.stop(t+dur+0.06);
      }
    }
    function bgNotes(s, chord){
      if (MU.bgFollow === "chord") return chord.tones;
      // "melody" walks the tune at the background's own pace — one melody note per background
      // note. "lead" reads the note the melody is actually on at that instant, which is the
      // literal match but can land on the same note every time: the tune loops every
      // MELODY.length/beatsPerTile beats (8, as shipped), so any bgEvery that is a multiple of
      // that samples the same point of the loop forever. That is a drone, which may well be what
      // you want under a melody — but it is worth knowing which one you have chosen.
      const idx = MU.bgFollow === "melody"
        ? Math.floor(s / Math.max(1, MU.bgEvery|0))
        : s * MU.beatsPerTile;

      og.gain.setValueAtTime(0.0001, t);
