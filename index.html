      // two squares both asking for attention, and by the end of the pan the answer is the one
      // in front of you — the cleared one has been acknowledged and is now just another place
      // on the map, which is the whole point of having gone there.
      glow = P.shine + P.t/900;                // ...carrying on from where the pause left it
      glowA = 1 - k;                          // ...and it lets go as the camera leaves it

    } else if (P.ph === "whip") {
      const k = easeIn(Math.min(1, P.t / WIN.whip));

      S = Sfit + (S0*2.4 - Sfit)*k;
      litK = 1; ring = 1 - k;
      P.black = k;
    }
    drawVoid(ts);                                 // the cosmos: what the levels hang in
    const opts = { glowIdx: P.idx, glow, glowA, ringIdx: P.next, ring };
    if (P.ph === "pan" || P.ph === "wait" || P.ph === "whip") { opts.litIdx = P.next; opts.lit = litK; }
    drawMap(ts, S, cx0, cy0, opts);
    // ...and the level itself, shrinking from the whole screen into that one square. The rect
    // is walked from one to the other and the picture is drawn to COVER it, so the level never
    // letterboxes on its way down — it is the same image the whole time, just smaller.
    if (shotK > 0) {
      const R = mapRect(P.idx, S, cx0, cy0);
      const x = R.x, y = R.y, w = S;
      const rx = 0 + (x - 0)*shotT, ry = 0 + (y - 0)*shotT;
      const rw = viewW + (w - viewW)*shotT, rh = viewH + (w - viewH)*shotT;
      ctx.save();
      ctx.globalAlpha = shotK;
      rrect(rx, ry, rw, rh, tileR(Math.min(rw, rh))*shotT); ctx.clip();
      const sc = Math.max(rw/viewW, rh/viewH);              // cover, never letterbox
      ctx.drawImage(winFrame(ts), rx + (rw - viewW*sc)/2, ry + (rh - viewH*sc)/2, viewW*sc, viewH*sc);
      ctx.restore();
    }
    // The name of what you just did, and — while it is waiting on you — how to leave it. Both
    // go as the camera starts moving: by then the screen is about the NEXT level, and a heading
    // naming the last one over the top of it is the sequence talking over itself.
    // One line at a time, the way the opening card does it. Both lines landing together is a
    // sign appearing; the number arriving and then the word for what happened to it is the
    // sequence telling you, which is what it has been doing all the way through.
    const outK = P.ph === "pan" ? Math.max(0, 1 - P.t/(WIN.pan*0.45)) : (P.ph === "name" ? 1 : 0);
    if (outK > 0) {
      const size = Math.min(46, viewW*0.11);
      const inK = (at) => P.ph === "name" ? Math.min(1, Math.max(0, (P.t - at)/260)) : 1;
      winHeading("Chapter " + (P.idx + 1), viewH*0.16, size, inK(0)*outK);
      winHeading("Complete", viewH*0.16 + size*1.15, size, inK(340)*outK);
    }
    if (P.ph === "name" && P.t > 900) {                 // ...and last of all, the way out
      ctx.save();
      ctx.globalAlpha = Math.min(1, (P.t - 900)/380) * (0.55 + 0.45*Math.sin(P.t/380));
      ctx.fillStyle = "#bfc6e0";
      ctx.font = "900 " + Math.round(Math.min(15, viewW*0.036)) + "px " + UI_FONT;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.letterSpacing = "2px";
      ctx.fillText("TAP TO CONTINUE", viewW/2, viewH*0.86);
      ctx.restore();
    }
    if (P.black > 0) {
      ctx.fillStyle = "rgba(5,4,13," + P.black.toFixed(3) + ")";
      ctx.fillRect(0, 0, viewW, viewH);
    }
  }
  // The level, LIVE, on a canvas of its own — the coins still turning, the backdrop still
  // drifting, him still standing on the flag. It is rendered off-screen and then blitted into

  // is underneath: the level has to be composed somewhere else before it can be made small.
  let _winFrame = null;
  function winFrame(ts) {
    if (!_winFrame || _winFrame.width !== canvas.width || _winFrame.height !== canvas.height) {
      _winFrame = document.createElement("canvas");
      _winFrame.width = canvas.width; _winFrame.height = canvas.height;
    }
    const g = _winFrame.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, _winFrame.width, _winFrame.height);

    try { draw(ts); } finally { ctx = was; }

  }

  // own fixed rails are drawn with, so what you are looking at is the shape of your solution in
  // the game's own material rather than a line drawn over it.
  function drawWinRoute(ts, n) {
    const P = win; if (!P || n <= 0) return;
    ctx.save();
    for (let i = 0; i < n && i < P.route.length; i++) {
      const nd = P.route[i], prev = P.route[i-1] || null, next = P.route[i+1] || null;
      drawGlass(cx(nd.c), cy(nd.r), cell);
      drawPlatformSurface(nd, tileSurface(nd, prev, next), curTrack());
      // the newest one flashes as it lands, exactly as a laid tile does
      if (i === n - 1) winRouteFlash(nd, 1 - Math.min(1, (P.flashT || 0)/240));

  }

    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.5*k;
    ctx.fillStyle = "#fff7d6";
    rrect(cx(nd.c), cy(nd.r), cell, cell, tileR(cell)); ctx.fill();
    ctx.restore();

  // ---------- The talisman ceremony ---------------------------------------
  // Five beats, each one waiting on the last rather than on a shared clock, so any of them can
  // be retimed without shifting the rest. The whole thing is drawn on the GAME canvas, not in
  // the overlay: the overlay is a card, and a card is exactly what this is not.
  const CEREMONY = {
    dark:  700,    // the board fades out and the fanfare goes up
    beam:  900,    // the shaft of light finds him
    fall: 1500,    // the charm descends into it
    land:  700,    // it settles over his head; the horns; the words
  };
  let cere = null;
  function endCeremony() { cere = null; }
  // The quilt every level wears, in the charm's own colour and mostly not in it: a handful of
  // near-blacks with the metal itself walked down through them, so the backdrop belongs to the
  // talisman without ever competing with the beam standing on top of it.
  // ---- the VOID -----------------------------------------------------------------------
  // The place this game happens in, as opposed to any level inside it: a near-black quilt with
  // the hue walked right round the wheel — every level's family of colour represented, none of
  // them owning it — with hard white stars over the top. Anywhere that is OUTSIDE a level asks
  // for this by name: the Tileverse, the opening, and whatever comes next.
  const VOID_THEME = { colors: Array.from({ length: 8 }, (_, i) =>
                         "hsl(" + Math.round(i * 360 / 8) + ",46%,7%)"),
                       patchW: 0.55, drift: 0.5, dir: 1, stripeW: 3 };
  const drawVoid = ts => drawBackground(ts, VOID_THEME, true, "drift");
  // The TILEVERSE button, wearing the cosmos the Tileverse hangs in — the same eight hues on the
  // same 45-degree ping-pong that drawVoid paints, so the button is a window onto where it goes
  // rather than a flat near-black that only happened to look like it.
  //
  // Rasterised ONE PIXEL PER PATCH and blown up by background-size, rather than drawn at full
  // size: one whole cycle of the pattern is 2*(n-1)*stripeW patches across, which at a grid
  // square each would be a 630px canvas to hold a 42-colour repeat. At a pixel a patch it is
  // 42x42, and `image-rendering: pixelated` puts the squares back at exactly --chq — so the
  // scale is the interface's grid, not the cosmos's own.
  // Any theme, a pixel a patch. One routine, because the cosmos is not the only plate that
  // wants a quilt on it now.
  function patchTileURL(T){
    const P = 2*(T.colors.length - 1) * T.stripeW;
    const c = document.createElement("canvas"); c.width = c.height = P;
    const g = c.getContext("2d");
    for (let j = 0; j < P; j++) for (let i = 0; i < P; i++) {

    return { url: c.toDataURL(), patches: P };
  }
  // A quilt in ONE colour: the plate's own hue walked up and down a few steps of lightness,
  // on the same 45-degree ping-pong and at the same patch size the cosmos uses. That is what
  // makes TILE SHOP and HOLY TALISMANS read as the same material as TILEVERSE rather than as
  // two flat slabs beside a textured one — and `spread` is small on purpose: the cosmos is
  // near-black on near-black and barely there, and gold on gold has to be quieter still or it
  // stops being a finish and starts being a pattern.
  const PLATE_SPREAD = 9;                 // lightness either side of the base, 0-255
  const plateTheme = hex => ({
    colors: [-1.5, -0.5, 0.5, 1.5].map(k => tintHex(hex, 0, 1, Math.round(k * PLATE_SPREAD))),
    patchW: 0.55, drift: 0.5, dir: 1, stripeW: 3 });
  {
    const r = document.documentElement.style;
    const set = (name, T) => { const V = patchTileURL(T);
      r.setProperty("--" + name + "-bg", "url(" + V.url + ")");
      r.setProperty("--" + name + "-bg-size", "calc(var(--chq) * " + V.patches + ")"); };
    set("gold",  plateTheme("#e0aa1e"));   // ...the same three colours the rules below fill with
    set("amber", plateTheme("#e07a1e"));
    set("sky",   plateTheme("#5f96de"));
  }
  function ceremonyTheme(def) {
    const n = parseInt((def.col || "#ffd24a").replace("#",""), 16);
    const r0 = (n>>16)&255, g0 = (n>>8)&255, b0 = n&255;
    const mix = k => "rgb(" + Math.round(6 + r0*k) + "," + Math.round(5 + g0*k) + "," +
                              Math.round(11 + b0*k) + ")";
    return { colors: [mix(0.02), mix(0.10), mix(0.05), mix(0.16), mix(0.03), mix(0.11)],
             patchW: 0.55, drift: 0.5, dir: 1, stripeW: 3 };
  }
  function startCeremony(def, last) {
    cere = { def, last, t:0, beat:0, ready:false, snd:{}, theme: ceremonyTheme(def) };
    paused = false;
    state.status = "ceremony";
    Sound.levelMusicStop(true);
    Sound.ceremony("fanfare");
  }
  function tickCeremony(dt) {
    if (!cere) return;
    cere.t += dt;
    const C = CEREMONY, T = cere.t;
    const at = (T < C.dark) ? 0 : (T < C.dark+C.beam) ? 1
             : (T < C.dark+C.beam+C.fall) ? 2 : (T < C.dark+C.beam+C.fall+C.land) ? 3 : 4;
    if (at !== cere.beat) {
      cere.beat = at;
      if (at === 1) Sound.ceremony("beam");
      if (at === 2) Sound.ceremony("descend");
      if (at === 3) Sound.ceremony("horns");
      if (at === 4) showCeremonyCard();
    }
  }
  // The card is the LAST beat, not the frame around it: it arrives once the charm has landed.
  function showCeremonyCard() {
    const def = cere.def;
    void def;
    // Back to "win" the moment the card is up, so the Continue button is the same button it
    // always was. The ceremony keeps painting underneath it — `cere` is what draws, not the
    // status — and is cleared when that button is pressed.
    // No card at all. A pair of chrome buttons in front of this was the game handing you a
    // form to fill in at the one moment it has stopped being a game — the title screen asks
    // for a tap and nothing else, and so does this. `ready` is what the tap listens for, so
    // the prompt and the thing it promises arrive together.
    cere.ready = true;
  }
  // A tap anywhere once the horns have landed. Returns true when it consumed the tap, so the
  // board underneath never sees it.
  function ceremonyTap() {
    if (!cere || !cere.ready) return false;
    const last = cere.last;
    endCeremony();
    Sound.tapBig();
    if (last) { openMenu("world"); }
    else { levelIdx = levelIdx + 1; loadLevel(levelIdx); }
    return true;
  }
  function drawCeremony(ts) {
    if (!cere) return;
    const C = CEREMONY, T = cere.t;
    const W = viewW, H = viewH;
    // 1. the level goes out and the charm's own quilt comes up behind it. Faded IN over the
    //    board rather than swapped for it, so the level does not blink out from under him.
    const dark = Math.min(1, T / C.dark);
    ctx.save();
    ctx.globalAlpha = dark;
    // Drifting, not welded. There is no board under a ceremony for the quilt to be nailed to,
    // and a still field of squares behind a still character reads as a painted backdrop. It
    // also brings the two glint passes into line: the one inside drawPatchwork was running off
    // the CAMERA while the stronger one below runs off bgScrollX/Y, so on a welded quilt the
    // two sets of sparks were lighting different squares.
    drawPatchwork(ts, cere.theme, false, "drift");
    ctx.globalAlpha = 1;

    ctx.fillRect(0, 0, W, H);
    // The glisten goes on TOP of that press, and harder than the levels wear it. Under the
    // wash it was being dimmed by the very thing that makes the room dark; over it, and on a
    // near-black quilt, it reads as the light catching something.
    drawGlints(ts, { x:bgScrollX, y:bgScrollY }, patchStepPx || cell*0.55, 1.3*dark);
    // High enough that the words below him and the buttons below those all have room: the card
    // that follows is pinned to the lower half, and he was standing behind it.
    const fx = W/2, fy = H*0.42;                       // where he stands
    // 2. the beam
    const bK = Math.max(0, Math.min(1, (T - C.dark) / C.beam));
    if (bK > 0) {

      // right across the pool it was supposed to be making, which read as a seam drawn through
      // the middle of the circle. It now runs on past the floor to the bottom of the pool and
      // fades to nothing on the way, so the two meet as light meeting light and there is no
      // edge anywhere to see.
      // Nearly a column. It was a wide cone — 0.28 of a cell at the top opening to 1.15 at the
      // floor — which is a stage light swung out over an audience, not a shaft coming straight
      // down on one person. The narrower it is, the further away whatever is holding it reads.
      const halfTop = cell*0.62, halfBot = cell*0.86, top = -H*0.1;
      const poolH = halfBot*0.34;
      // The shaft stops ON the floor and is already at zero by the time it gets there. Running
      // it PAST the floor to blur the join put light outside the circle it was supposed to be
      // casting — a lit skirt below the pool with nothing making it. Fading to nothing at the
      // floor line does the same job with none of the spill: there is no edge to see because
      // there is nothing left to draw by then, and the pool below carries on from there.
      const g = ctx.createLinearGradient(0, top, 0, fy);
      g.addColorStop(0,    "rgba(255,248,214,0)");
      g.addColorStop(0.35, "rgba(255,248,214," + (0.15*bK) + ")");
      g.addColorStop(0.86, "rgba(255,248,214," + (0.24*bK) + ")");
      g.addColorStop(1,    "rgba(255,248,214,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(fx - halfTop, top); ctx.lineTo(fx + halfTop, top);
      ctx.lineTo(fx + halfBot, fy);  ctx.lineTo(fx - halfBot, fy);
      ctx.closePath(); ctx.fill();
      // the pool it throws on the floor, laid over the tail of the shaft
      const p = ctx.createRadialGradient(fx, fy, 0, fx, fy, halfBot);
      p.addColorStop(0, "rgba(255,248,214," + (0.30*bK) + ")");
      p.addColorStop(1, "rgba(255,248,214,0)");
      ctx.fillStyle = p;
      ctx.beginPath(); ctx.ellipse(fx, fy, halfBot, poolH, 0, 0, Math.PI*2); ctx.fill();
    }
    // he is lit from the moment the beam is
    paintRunner(fx, fy, cell, ts/RUNNER.stepMs*0.35, 0, false, ts, 0, true);
    // 3 + 4. the charm comes down and settles over his head
    const dK = Math.max(0, Math.min(1, (T - C.dark - C.beam) / C.fall));
    if (dK > 0) {
      const ease = 1 - Math.pow(1 - dK, 3);
      const restY = fy - cell*1.55, y = -cell + (restY + cell)*ease;
      const landed = Math.max(0, Math.min(1, (T - C.dark - C.beam - C.fall) / C.land));
      const bob = landed > 0 ? Math.sin(T/520) * cell*0.05 : 0;
      const R = cell*0.42*(0.72 + 0.28*ease);
      ctx.save();
      ctx.globalAlpha = Math.min(1, dK*2.2);
      // a glow travelling down with it, so it reads as coming out of the light
      const hal = ctx.createRadialGradient(fx, y + bob, 0, fx, y + bob, R*2.4);
      hal.addColorStop(0, "rgba(255,248,214,0.42)"); hal.addColorStop(1, "rgba(255,248,214,0)");
      ctx.fillStyle = hal;
      ctx.beginPath(); ctx.arc(fx, y + bob, R*2.4, 0, Math.PI*2); ctx.fill();
      // the hanging loop goes down FIRST, so the panel covers where it enters — talBadge does
      // not draw it, which is why the charm on the shelf has one and this had none
      talHook(ctx, fx, y + bob, R, cere.def);
      cere.def.draw(ctx, fx, y + bob, R);
      ctx.restore();
      // ...and once it has landed, what it is. On the canvas, under him, rather than only on
      // the card that follows: the card is the way OUT of the moment, and by the time you are
      // reading a button the moment is over.
      const wK = Math.max(0, Math.min(1, (T - C.dark - C.beam - C.fall) / (C.land*0.7)));
      if (wK > 0) {
        const nameSz = Math.round(Math.min(W*0.085, cell*0.52));
        const blurbSz = Math.round(nameSz*0.40);
        ctx.save();
        ctx.globalAlpha = wK;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const ny = fy + cell*0.92;
        // A MENU HEADING, drawn by the routine that draws them: the shaded five-step
        // extrusion and the four-degree tilt, rather than the flat four-step stack it used to
        // carry. This is the one moment the game names something, and it should be named in
        // the same lettering everything else in the game is titled with.
        ctx.save();
        ctx.translate(fx, ny); ctx.rotate(-4 * Math.PI/180);
        draw3DText(cere.def.name.toUpperCase(), 0, 0, nameSz);
        ctx.restore();
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        // the blurb, wrapped to the screen rather than to a guess
        ctx.font = "700 " + blurbSz + "px " + UI_FONT;
        ctx.fillStyle = "rgba(226,222,255,0.86)";
        const words = cere.def.blurb.split(" "), lines = [];
        let line = "";
        for (const wd of words) {
          const t2 = line ? line + " " + wd : wd;
          if (ctx.measureText(t2).width > W*0.78 && line) { lines.push(line); line = wd; }
          else line = t2;
        }
        if (line) lines.push(line);
        lines.forEach((ln, i) => ctx.fillText(ln, fx, ny + nameSz*0.95 + i*blurbSz*1.45));
        ctx.restore();
      }
      // ...and once it is all said, the same prompt the title screen ends on, breathing at the
      // same rate, in the same place down the screen.
      if (cere.ready) {
        const pulse = 0.5 + 0.5*Math.sin(ts/380);
        ctx.save();
        ctx.globalAlpha = 0.45 + 0.55*pulse;
        ctx.fillStyle = "#eef0ff";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = "900 " + Math.round(Math.min(W*0.05, 19)) + "px " + UI_FONT;
        ctx.fillText("TAP TO CONTINUE", W/2, H*0.90);
        ctx.restore();
      }

    ctx.restore();
  }
  // The charm on the win card: it rises into place, then hangs there turning gently.
  let relicShow = null, relicShowT = 0;

    if (!relicShow) return;
    relicShowT += dt;
    const { g, def } = relicShow, S = 260;
    const inK = Math.min(1, relicShowT/460), e = 1 - Math.pow(1 - inK, 3);
    g.clearRect(0, 0, S, S);
    g.save();
    g.translate(S/2, S*0.52 + (1 - e)*40);
    g.globalAlpha = e;
    g.rotate(Math.sin(relicShowT/900) * 0.10);          // a slow hang, not a spin

    talHook(g, 0, 0, R, def);
    def.draw(g, 0, 0, R);
    g.restore();
  }
  const LOSE_QUIPS = [
    "Gravity: still undefeated.",
    "That's not a shortcut, that's a cliff.",
    "You'd like a word with HR about job safety.",
    "Bold strategy — laying track behind yourself.",
    "You had ONE job. It was the floor.",
    "You ran out of ground and options.",
    "Tiles are reusable. So are second chances.",
    "The floor is lava. Also, missing.",
    "Somewhere, a tile is feeling unused.",
    "Speedrunning… into the void.",
    "You trusted gravity. Rookie mistake.",
    "Great pace! Shame about the ending.",
    "Next time, maybe put a tile there.",
    "That was a controlled descent. Very controlled.",
    "You filed a complaint. It fell through.",
    "Physics 1, You 0.",
    "So close. So very, very not close.",
    "You're fine. You always land on your… nope.",
    "A for effort, F for flooring.",
    "The abyss says thanks for the snack.",
  ];
  const LOSE_TITLES = ["You Fell", "Wipeout!", "Splat.", "Down You Go", "Ouch.", "Gap Year"];
  let _lastQuip = -1;
  function showLose() {
    state.status = "lose";
    Sound.levelMusicStop();        // ...and with a fall, too
    // Nothing banked: a run you did not finish pays nothing, and the tiles it found go back on
    // the board with it. The purse is dropped rather than saved.
    state.purse = 0;
    let i = (Math.random() * LOSE_QUIPS.length) | 0;
    if (i === _lastQuip) i = (i + 1) % LOSE_QUIPS.length;   // avoid repeating the last quip
    _lastQuip = i;
    state.end = { kind:"lose", last:false,
      title: LOSE_TITLES[(Math.random() * LOSE_TITLES.length) | 0],
      byline: LOSE_QUIPS[i] };

    Sound.death();                  // a short sad jingle on the death screen
  }

  // ---------- Rendering ---------------------------------------------------
  function draw(ts) {
    // Outside a level — the map of them all — the backdrop is the void rather than any one
    // level's quilt.
    // Decided here rather than below, because the board's EDGE is now something you can see:
    // the backdrop is clipped to it, so the quilt has to shake with the board or the level
    // would slide about inside its own outline.
    const sh = state.shake || 0;
    const shx = sh ? (Math.random()*2-1)*sh : 0, shy = sh ? (Math.random()*2-1)*sh : 0;
    const menuOpen = menuEl && menuEl.classList.contains("show");
    // "win" is the status for the whole victory sequence, and for the first half of it the level
    // is still the thing on screen — the camera is pulling back off it, not putting a card in
    // front of it. Treating that as an end screen made draw() paint the level's ground edge to
    // edge and return before the board, so what pulled back was a backdrop with the rebuilt
    // route on it rather than the level itself: no runner standing on the flag, no coins, no
    // loose tiles. It is a screen once the sequence is over, and not before.
    const endScreen = !win && (state.status === "win" || state.status === "lose");
    // The Tileverse keeps the void, and is checked FIRST for that reason: it is the map of every
    // level, so no one level's ground belongs under it — the cosmos is the thing they all hang
    // in. Every menu AND both end screens stand on the LEVEL YOU ARE ON, edge to edge: not the
    // board-bounded quilt, because behind a card there is no board for the backdrop to stop at,
    // and stopping it left cosmos showing in the margins of a screen with no level on it — most
    // obviously on the win and lose screens, where the board is gone and its outline was still
    // cut into the backdrop. Drawn "weld", so it is the level's own ground and not a second,
    // drifting one.
    // The Tileverse keeps the void — and so does a FAILED run. Dying puts you back outside the
    // level rather than inside it: the ground you were standing on is the thing you just fell
    // off, and leaving it spread edge to edge behind the words reads as though you were still
    // on it. The cosmos is where you are between levels, and a fall is between levels.
    if (worldOpen() || (endScreen && state.end && state.end.kind === "lose")) drawVoid(ts);
    else if (menuOpen || endScreen)
      // ...and it DRIFTS, on menus as well as on the end screens. The argument for welding a
      // menu was that the level is still there underneath and should sit where you left it —
      // but nothing of the level is drawn behind a menu any more, only its ground, and a still
      // field of squares behind a card reads as a screenshot rather than as a place. Scrolling
      // gently on, it stays the same kind of thing the cosmos and the title screen are.
      drawBackground(ts, (state && state.bgTheme) || undefined, false, "drift");
    else drawBoardBackdrop(ts, shx, shy);     // the level's quilt, bounded by the level
    // pause / win / death: show ONLY the level background (a clean replica) behind the card
    if (endScreen || menuOpen) {
      // A FALL keeps its heap. The menu that comes up after one is standing over the place he
      // landed, and cutting to an empty cosmos throws away the only thing on the screen that
      // says what just happened — and the joke it was building.
      // (the lose screen IS a menu — openMenu opens it — so this must not exclude menuOpen)
      if (state.end && state.end.kind === "lose" && state.fall) {

        ctx.translate(-Math.round(camX), -Math.round(camY));
        drawRunner(ts); drawFallPile(ts);
        ctx.restore();
      }
      // ...except the ceremony, which is not a card on a background — it IS the screen, and it
      // stays lit under its own card once the words arrive.
      if (cere && !menuOpen) drawCeremony(ts);
      return;
    }
    if (state.status === "ceremony") { drawCeremony(ts); return; }
    ctx.save();
    ctx.translate(-Math.round(camX - shx), -Math.round(camY - shy));

    // The board's own boundary. Off now: the level's backdrop stops at the level and the cosmos
    // shows around it, so the edge is a thing you can SEE rather than something that had to be
    // hinted at with hazard stripes when a tile strayed near it. Flip this to bring them back —
    // the machinery below is intact and costs nothing while nothing calls it, including the two
    // full-viewport canvases it would otherwise allocate for its mask.
    if (EDGE_STRIPES) drawEdgeWalls();
    if (wallLayerDirty) buildWallLayer();
    if (wallLayer && state.walls && state.walls.size) {
      // The one cached wall, stamped at each wall that is on screen. Culled to the view with a
      // little padding for the screen shake, which moves the visible window a few pixels.
      const pad = 8 + (state.shake || 0);
      const c0 = Math.floor((camX - pad)/cell), c1 = Math.ceil((camX + viewW + pad)/cell);
      const r0 = Math.floor((camY - pad)/cell), r1 = Math.ceil((camY + viewH + pad)/cell);
      for (const wk of state.walls) {
        const i = wk.indexOf(","), c = +wk.slice(0, i), r = +wk.slice(i+1);
        if (c < c0 || c > c1 || r < r0 || r > r1) continue;
        ctx.drawImage(wallLayer, cx(c), cy(r), cell, cell);
      }
    }
    drawWallEyes(ts);                             // ...and the eyes, which cannot be baked in
    for (const [sk, st] of state.stones) {
      const [c, r] = sk.split(",").map(Number);
      drawStone(c, r, ts, st);
    }
    drawPlatforms(ts);

    drawBarriers(ts);
    drawSliders(ts);
    drawBlocks(ts);
    drawManualDoors(ts);
    drawHazardPaths(ts);      // ground markings — under the track and the tiles standing on it
    drawTrack(ts);
    if (state.drag) drawTargets(ts);
    // The loose tiles are OFF during the victory replay. They are lying on the very cells the
    // route is being rebuilt across — they are the same three tiles, recycled — so leaving them
    // in covered the replay with the panes it is made of, and the rebuild drew underneath them
    // without a mark showing.
    for (const t of (win ? [] : state.tiles))
      if ((t.status === "free" || t.status === "parked") && (!state.drag || state.drag.tile.id !== t.id)) {
        // A tile parked over a rift shivers: the floor under it is already trying to take it,
        // and it is the only warning the player gets that this one is not coming back. Same
        // two-sine shake the eye uses, at a third the throw, so the pair read as one thing
        // pulling and the other resisting rather than as two separate animations.
        const doomed = state.singularity && state.singularity.has(key(t.c, t.r)) &&
                       !state.collapsed.has(key(t.c, t.r));
        let jx = 0, jy = 0;
        if (doomed) { const tr = cell * RIFT.tremble * 0.34;
          jx = (Math.sin(ts/47) + Math.sin(ts/31.3)*0.6) * tr;
          jy = (Math.cos(ts/41) + Math.cos(ts/27.7)*0.6) * tr; }
        const fly = flyPos();
        if (fly && fly.id === t.id) drawFreeTile(fly.x, fly.y, ts, true);   // lifted, mid-throw
        else drawFreeTile(cx(t.c) + jx, cy(t.r) + jy, ts, false);
      }

    drawPickups(ts);
    drawJunctionMarks(ts);                        // over the coins: it is the thing you aim at
    drawShards();
    drawPops();
    drawLights();
    drawTrail();                                  // worn light trail, under the runner
    drawStarDust();                               // ...and the Cloak's dust, behind him too
    drawLover(ts);                                // she runs her own track, beside his
    if (state.status === "intro") drawIntro(ts);
    else if (state.status === "campan" || state.status === "hold") { /* not formed yet */ }
    // HIM first, the heap over the top of him: he goes into it head first, and a body that

    // only the legs are left out in the air, which is the picture.

               (f.r+0.5)*cell + ((rp.y - cell*0.3) - (f.r+0.5)*cell)*e, ts);
    }

    if (state.drag) {
      const d = state.drag;

    }

    // Off-screen indicators (screen space): the exit, and any key not yet taken. Shown only
    // while the Wayfinder is lit — see its entry in TALISMANS for why they are not simply on.
    if (powerActive("lode") && (state.status === "play" || state.status === "falling")) {
      if (!state.keyCollected)
        for (const k of state.keys) if (!k.got)
          drawOffscreenArrow((k.c+0.5)*cell, (k.r+0.5)*cell, k.color, "key");
      if (state.goal)
        drawOffscreenArrow((state.goal.c+0.5)*cell, (state.goal.r+0.5)*cell, "#ffffff", "flag");   // white flag
    }
    drawSpeedHud();
    drawCeremony(ts);                   // over the board and under nothing: it IS the screen
    drawTalismanFlash(16, ts);
    drawVortex(ts);                     // ...and the whirlpool, over the top of everything
  }

  // The Mushroom's visuals. Rather than warping every drawing routine, the finished frame is
  // copied off and repainted as a stack of horizontal strips, each slid sideways on a
  // travelling sine — the old scanline-warp trick. It costs one full-canvas copy and a
  // strip's worth of blits, and only while the power is up. The whole frame goes through it,

  // The UI grid, read from the stylesheet rather than restated here — --chq is where it lives,
  // and a second copy in JS is a second thing to forget. Cached because this is asked for on
  // every HUD frame and a computed-style read is not free; resize() clears it.
  let _uiGrid = 0;
  function uiGrid() {
    if (!_uiGrid) _uiGrid =
      parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--chq")) || 15;
    return _uiGrid;
  }
  // The speedo's plate size, and the margin it sits at. The pause button is DOM and the speedo
  // is canvas, so nothing makes them agree by themselves — this is the number both take, one
  // through CSS variables and one directly, so they cannot drift apart at any viewport.
  function hudPlate() {
    const m  = Math.round(Math.min(viewW, viewH) * 0.028);
    const fs = Math.max(15, Math.round(Math.min(viewW, viewH) * 0.045));
    // Three grid spaces, the same three a menu button is tall, rather than one and a half times
    // whatever the type came out at. Both the pause button and the speedo take this — one
    // through a CSS variable and one directly — so pinning it to the grid pins the pair, and
    // they cannot line up with each other but not with everything else.
    return { m, fs, h: uiGrid() * 3 };
  }
  function syncHudChrome() {
    const P = hudPlate(), root = document.documentElement.style;
    root.setProperty("--hud-h", P.h + "px");
    root.setProperty("--hud-m", P.m + "px");
  }
  // live runner speed, top-left (screen space). Shown as cells/second on a dark pill.
  function drawSpeedHud() {
    const s = state;
    if (!s || (s.status !== "play" && s.status !== "falling" && s.status !== "vortex")) return;
    const factor = s.liveFactor != null ? s.liveFactor : 1;
    const cps = 1000 * factor / (s.msPerCell || 1000);      // cells per second
    const P = hudPlate(), m = P.m, fs = P.fs;
    ctx.save();
    ctx.textBaseline = "middle";
    const label = "SPEED", val = cps.toFixed(3), unit = " tiles/s";   // three decimals — the per-tile ramp is small
    const smallF = "700 " + Math.round(fs*0.52) + "px " + UI_FONT;
    const bigF   = "900 " + fs + "px " + UI_FONT;
    ctx.font = smallF; const lw = ctx.measureText(label).width;
    ctx.font = bigF;   const vw = ctx.measureText(val).width;
    ctx.font = smallF; const uw = ctx.measureText(unit).width;
    const padX = Math.round(fs*0.55), gap = Math.round(fs*0.4);
    const boxW = padX*2 + lw + gap + vw + uw, boxH = P.h;
    // Square plate, matching the DOM buttons (which carry no radius at all) — and matching the
    // pause button's box exactly, since both take their height from hudPlate(). No outline:
    // the plate is dark enough against the board to be its own edge, and the hairline it used
    // to wear was the only thing on either of the two HUD boxes drawing a border.
    rrect(m, m, boxW, boxH, 0);
    ctx.fillStyle = "rgba(10,8,22,0.62)"; ctx.fill();
    const midY = m + boxH/2;
    ctx.textAlign = "left";
    ctx.font = smallF;
    ctx.fillStyle = "rgba(214,218,240,0.78)";
    ctx.fillText(label, m + padX, midY + 1);
    ctx.font = bigF;
    // The RAIL, not the earth. The number is the one bright thing on this plate and the rail is
    // the design's own bright line — the colour of the track he is running on, in the readable
    // sense. The earth colour is the dark ground under it: on Midnight or Blood that is nearly
    // black, which put a black number on a near-black plate.
    ctx.fillStyle = (typeof curRail === "function") ? curRail() : "#ffd24a";
    ctx.fillText(val, m + padX + lw + gap, midY);
    ctx.font = smallF;                                                // unit in a smaller dim suffix
    ctx.fillStyle = "rgba(214,218,240,0.66)";
    ctx.fillText(unit, m + padX + lw + gap + vw, midY + 1);
    ctx.restore();
  }
  // The tile tally. Deliberately NOT a permanent HUD: the number only changes at the instant
  // you collect something, so a counter sitting there the rest of the time is one more thing
  // competing with the board for attention. It shows up big when the number moves, holds, and
  // gets out of the way. Grand total only — the old "3/7 this level" was answering a question
  // the coins already answer by still being on the board.
  let tallyDX = 0, tallyDY = -1;    // the way it drifts, as a unit vector on the board
  let tallySwing = 0;               // ...and which way that vector turns as it goes, +1 or -1
  const TALLY = {
    hold: 900,      // ms at full strength
    fade: 500,      // ...then this long dissolving
    pop:  260,      // the overshoot on arrival
    rise: 0.85,     // how far it drifts up over its life, in CELLS
    above: 0.55,    // how far above the coin's own centre it starts, in cells
    size:  0.30,    // cap height, as a fraction of a cell
    spin:  0.55,    // radians the CARD turns across its whole life, always away from him
  };
  // How far the card has turned at `u` of its life. This is the pop-up rotating on the spot as
  // it goes, not the line it travels along: it leaves on one bearing and keeps it, and the
  // turning is the thing itself tipping over as it fades. Bending the path instead moved the
  // number to somewhere you were not looking for it.
  const tallySpin = u => TALLY.spin * u * tallySwing;
  let tallyAt = -1e9, tallyC = 0, tallyR = 0;
  // Which way it drifts is decided HERE, not at draw time: he may well have turned a corner
  // by the time it fades, and the tally should keep going the way it set off.
  function showTally(c, r) {
    tallyAt = performance.now(); tallyC = c; tallyR = r;
    // Back over his shoulder: the bisector of straight-behind-him and straight-up-out-of-his-
    // head. Those two are always perpendicular — the runner's own up is the track's normal, and
    // he runs along it — so the halfway line is a clean 45 degrees whichever way he is facing,
    // and it never degenerates the way bisecting against SCREEN up would when he runs north.
    //
    // Both are taken in his frame for a reason. Dead ahead is the worst place for it, sitting
    // over the cells he is reading; straight back is safe but dull and can crowd the track he
    // just left. Splitting the difference lifts it clear of the line entirely.
    tallyDX = 0; tallyDY = -1;              // no run in progress: up, the way it always went
    if (state && state.status === "play" && state.path && state.path.length) {
      const ri = runnerInfo();
      const bx = -ri.tx + ri.nx, by = -ri.ty + ri.ny, m = Math.hypot(bx, by);
      // Standing on a one-node path he has no tangent at all, and both halves of the bisector
      // come out zero — which would pin the tally exactly on the coin instead of moving it.
      // Keep the plain upward drift for that case rather than dividing by nothing.
      if (m > 1e-6) {
        tallyDX = bx/m; tallyDY = by/m;
        // Which way "away" is depends on which side of him it set off — turning the same way
        // every time would swing it back across his nose on half the corners. Rather than
        // derive the sign from a cross product and have it come out backwards, turn it a
        // little each way and keep whichever opens the angle to his heading. The test IS the
        // requirement, so it cannot disagree with it.
        const tryTurn = sgn => { const a = 0.1*sgn, cs = Math.cos(a), sn = Math.sin(a);
          return (tallyDX*cs - tallyDY*sn)*ri.tx + (tallyDX*sn + tallyDY*cs)*ri.ty; };
        tallySwing = tryTurn(1) < tryTurn(-1) ? 1 : -1;      // smaller dot = further from him
      }
    }
  }
  // Drawn INSIDE the board transform, so it rides with the camera and stays over the cell the
  // coin came out of. Sized in cells for the same reason: it has to sit against the board, not
  // against the screen, or it changes size relative to the coin it just replaced.
  function drawTally() {
    const age = performance.now() - tallyAt, life = TALLY.hold + TALLY.fade;
    if (age < 0 || age > life) return;
    const u = age/life;
    const a = age < TALLY.hold ? 1 : 1 - (age - TALLY.hold)/TALLY.fade;
    const k = 0.80 + 0.20*easeOutBack(Math.min(1, age/TALLY.pop));   // a short pop as it lands
    const f2 = Math.round(cell*TALLY.size);
    // Banked plus held: the figure has to be what you would walk away with if you finished,
    // or picking a coin up would move a number that has not changed.
    const txt = String(wallet.tiles + ((state && state.purse) || 0));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.font = "900 " + f2 + "px " + UI_FONT;
    const ic = Math.round(f2*0.88), gap = Math.round(f2*0.30);
    const w = ic + gap + ctx.measureText(txt).width;
    // The same distance every time, in a straight line on the bearing it set off on. Both that
    // bearing and the way the card turns are fixed at pickup, not read here: he may well have
    // gone round a corner by the time it fades, and the tally should keep to what it started.
    const drift = cell*(TALLY.above + TALLY.rise*u);
    const cxm = (tallyC + 0.5)*cell + tallyDX*drift;
    const cym = (tallyR + 0.5)*cell + tallyDY*drift;
    // Scale and spin share the one pivot — the card's own centre — so it grows and tips about
    // the same point instead of swinging around an origin somewhere off to the side.
    ctx.translate(cxm, cym); ctx.scale(k, k); ctx.rotate(tallySpin(u)); ctx.translate(-cxm, -cym);
    coinGlyph(cxm - w/2 + ic/2, cym, ic);
    // No plate and no outline: a plate popping in and out over the board is noisier than the
    // number it carries, and the black stroke around it was doing the same job twice as hard.
    const tx = cxm - w/2 + ic + gap;
    ctx.fillStyle = "#ffd24a"; ctx.fillText(txt, tx, cym);
    ctx.restore();
  }
  // The Magnet's reach, while it is up: rings that keep falling inward onto him, so the
  // ground it covers is a thing you can see rather than a number in a menu — and so the
  // direction of the pull is legible without a single coin being in range.
  function drawMagnetField(ts) {
    if (!powerActive("magnet")) return;
    const rp = visualAt(state.runIdx + state.runT);
    const cxm = rp.x, cym = rp.y - cell*0.3, R = MAGNET_CELLS * cell;
    ctx.save();
    // a wash under it all, so the reach still reads as an AREA between the discs
    ctx.globalAlpha = 0.12; ctx.fillStyle = "#ff6d6d";
    ctx.beginPath(); ctx.arc(cxm, cym, R, 0, Math.PI*2); ctx.fill();
    // Shaded discs rather than drawn rings. An outline is a hard edge travelling across the
    // board, which reads as a boundary; a disc that is brightest at its rim and clear in the
    // middle reads as something closing IN, which is the whole idea.
    for (let i = 0; i < MAGNET_RINGS; i++) {
      // u runs 0 at the rim to 1 at him. Evenly spread, so one leaves as another arrives.
      const u = ((ts / MAGNET_RING_MS) + i / MAGNET_RINGS) % 1;
      const rad = R * (1 - u);
      if (rad < cell*0.05) continue;
      // in as it leaves the rim, out as it lands, so nothing ever pops into or out of being
      // Brighter, and the bright part is a narrower band at the rim — spreading the same ink
      // from 55% of the radius outward made a soft blob, where keeping it near the edge reads
      // as a ring closing in. Nearly white at the leading edge so it holds up over gold track.
      const a = 0.72 * Math.pow(Math.sin(Math.PI*u), 0.55);
      const g = ctx.createRadialGradient(cxm, cym, rad*0.72, cxm, cym, rad);
      g.addColorStop(0,    "rgba(255,157,157,0)");
      g.addColorStop(0.55, "rgba(255,140,140," + (a*0.40).toFixed(4) + ")");
      g.addColorStop(0.88, "rgba(255,190,190," + a.toFixed(4) + ")");
      g.addColorStop(1,    "rgba(255,236,236," + (a*0.80).toFixed(4) + ")");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cxm, cym, rad, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  // the coin as a flat badge, for the HUD and the shop — no float, no shine, just the shape
  function coinGlyph(cxp, cyp, s2) {
    const h = s2/2, r = s2*TILE.radius;
    ctx.save();
    rrect(cxp - h + s2*0.06, cyp - h + s2*0.10, s2, s2, r); ctx.fillStyle = COIN_EDGE; ctx.fill();
    rrect(cxp - h, cyp - h, s2, s2, r); ctx.fillStyle = "#ffd24a"; ctx.fill();
    if (COIN.panelA > 0) {                                        // the same pressed panel
      const ip = s2*COIN.panelPad;
      ctx.globalAlpha = COIN.panelA; ctx.fillStyle = COIN_EDGE;
      rrect(cxp - h + ip, cyp - h + ip, s2 - 2*ip, s2 - 2*ip, Math.max(0, r - ip*0.6)); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = Math.max(1, s2*0.07);
    ctx.beginPath(); ctx.moveTo(cxp - h + r, cyp - h + ctx.lineWidth*0.5);
    ctx.lineTo(cxp + h - r, cyp - h + ctx.lineWidth*0.5); ctx.stroke();
    ctx.restore();
  }

  // The laid path is drawn as a set of per-tile platform segments. Each tile
  // renders its OWN piece (a straight or corner beam) contained within its
  // cell: a glass background, then the platform whose running surface passes
  // through the tile centre and whose body hangs into the lower half.
  function drawTrack(ts) {
    const p = state.path, idx = state.runIdx;
    if (idx >= p.length) return;

    // a node carries a platform until the runner exits it (per-node flag, so a
    // re-placed tile's stale old node never affects its fresh placement).
    const live = (n) => n.kind === "tile" && !n.exited;

    drawPathGlass(p.slice(idx).filter(live));

    for (let i = idx; i < p.length; i++)
      if (live(p[i])) {
        // leading tile = 3-way junction, unless it's the final tile on the goal cell
        if (i === p.length - 1 && !onGoal(p[i])) drawJunction(p[i], p[i-1], ts);
        else drawPlatformTile(p[i], p[i-1], p[i+1]);
      }

    // The victory replay's route goes down HERE — the last thing in the track layer, before the
    // flag and long before the runner. It is track: laying it over the top of him and the flag
    // he is standing on made the replay look like something happening to the level rather than
    // something the level is made of.
    if (win && win.laid > 0) drawWinRoute(ts, win.laid);
    // the exit is a floating flag on its cell; you must lay a tile there to finish
    if (state.goal) drawFlag(state.goal.c, state.goal.r, ts, false);   // never locked (no primary key)
  }

  // floating finish flag; you place a tile on its cell to reach the exit
  function drawFlag(c, r, ts, locked) {
    const x = (c+0.5)*cell, cy0 = (r+0.5)*cell, s = cell;
    const pt = state.flagPlantT || 0;                     // 0 floating -> 1 planted on the tile
    const bob = (1-pt) * Math.sin(ts/300)*s*0.05;
    // Once there is a tile here, the flag plants on the RUNNING SURFACE at the middle of that
    // tile's path — the point the runner actually crosses — rather than on the cell's centre
    // with a fudge factor. On a corner tile that midpoint is out on the arc, so the flag
    // stands on the track instead of hovering beside it.
    const gi = state.path.findIndex(n => n.kind === "tile" && n.c === c && n.r === r);
    let ax = x, ay = cy0, tang = null;
    if (gi >= 0) {
      const S = tileSurface(state.path[gi], state.path[gi-1], state.path[gi+1]);
      const m = Math.floor((S.length - 1)/2);
      ax = x + (S[m].x - x)*pt; ay = cy0 + (S[m].y - cy0)*pt;   // slide onto it as it plants
      const a = S[Math.max(0, m-1)], b = S[Math.min(S.length-1, m+1)];
      tang = Math.atan2(b.y - a.y, b.x - a.x);            // the surface's own direction there
    }
    const baseY = ay + bob;
    ctx.save();
    // place-here target ring (fades out once the flag is planted)
    if (pt < 0.98) {

      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(2, s*0.04);
      ctx.setLineDash([s*0.12, s*0.09]);
      ctx.beginPath(); ctx.arc(x, cy0, s*0.28, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    if (locked) drawLock(x, cy0 + s*0.02, ts);   // small padlock (unused: exit never locked now)
    // as it plants, the flag tilts to stand square on the surface it is planting into
    let rot = 0;
    if (tang != null) rot = tang;
    else if (gi > 0) { const pv = state.path[gi-1]; rot = Math.atan2((r - pv.r), (c - pv.c)); }
    ctx.translate(ax, baseY);
    ctx.rotate(rot * pt);                                 // upright while floating, aligned once planted
    // Shorter, all-white pole. The base sits AT the origin, not below it: the origin is the
    // midpoint of the tile's path, and once the flag has planted, the local +y axis points
    // across the track rather than down the screen — so a base at +0.08 landed that far to
    // one side of the centreline. Zero puts the foot on the path itself. The pole keeps its
    // old 0.38-cell length by growing upward instead.
    const poleTop = -s*0.38, poleBot = 0;
    // The pool at the foot is the flag's shadow on the track, in the runner's shadow ink and
    // at his exact opacity — the two things standing on the same rail are lit the same way.
    // Drawn BEFORE the pole: a shadow the pole stands in, not a collar painted over its end.
    if (pt > 0.05) {
      ctx.globalAlpha = pt; ctx.fillStyle = "rgba(5,4,13," + RUNNER.shadowA + ")";
      ctx.beginPath(); ctx.ellipse(0, poleBot, s*0.07*pt, s*0.03*pt, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(2, s*0.035); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, poleTop); ctx.lineTo(0, poleBot); ctx.stroke();
    // smaller white pennant (wave settles as it plants), flying along the travel direction
    const wave = (0.4 + 0.6*(1-pt)) * Math.sin(ts/180)*s*0.03, fw = s*0.24, fh = s*0.15;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.moveTo(0, poleTop);
    ctx.quadraticCurveTo(fw*0.6, poleTop + fh*0.1 + wave, fw, poleTop + fh*0.5);
    ctx.quadraticCurveTo(fw*0.6, poleTop + fh*0.9 - wave, 0, poleTop + fh);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawKey(x, y, ts, color) {
    color = color || "#ffd24a";
    const s = cell*0.85, bob = Math.sin(ts/300)*s*0.05;   // a little smaller
    y += bob;
    ctx.save();
    ctx.globalAlpha = 0.28; ctx.fillStyle = color;                                   // soft glow
    ctx.beginPath(); ctx.arc(x, y, s*0.4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    const R = s*0.12, bx = x - s*0.10;

    ctx.beginPath();
    ctx.arc(bx, y, R, 0, Math.PI*2);                                                 // outer edge
    ctx.arc(bx, y, R*0.46, 0, Math.PI*2, true);                                       // inner edge -> hole
    ctx.fill("evenodd");                                                             // centre left transparent (shows the scene behind)

    ctx.fillStyle = color;
    ctx.fillRect(sx0, y - s*0.028, sl, s*0.056);                                     // shaft
    ctx.fillRect(tipX - tw, y + s*0.012, tw, th);                                     // teeth — near the tip
    ctx.fillRect(tipX - tw - s*0.07, y + s*0.012, tw, th);
    ctx.restore();
  }

  // --- Batch 2 cell-type rendering ---------------------------------------
  function drawBarriers(ts) {
    const s = state;
    for (const ck of s.singularity) if (!s.collapsed.has(ck)) { const [c,r]=ck.split(",").map(Number); drawSingularity(c,r,false,ts); }
    for (const ck of s.collapsed) { const [c,r]=ck.split(",").map(Number); drawSingularity(c,r,true,ts); }
    drawEaten();                                  // ...and whatever is currently going down one
    for (const bk of s.boost) { const [c,r]=bk.split(",").map(Number); drawFxPickup(c,r,ts,"boost"); }
    for (const bk of s.slow)  { const [c,r]=bk.split(",").map(Number); drawFxPickup(c,r,ts,"slow"); }
    for (const d of s.doors) {
      // coloured key-doors read as a LOCK (padlock marker); no full door tile
      if (!d.reached) drawDoorLock(d.c,d.r,ts,d.color,d.open);   // lock marker stays until the runner arrives
    }
    // linked switch/door groups: wires first (behind), then the sliding door, then the buttons
    for (const grp of s.gateGroups) {
      grp.switches.forEach((sw, i) => drawSwitchWire(sw, grp.door, grp.color, sw.used, ts, i, grp.switches.length));
    }
    for (const grp of s.gateGroups) drawSlidingDoor(grp, ts);
    for (const grp of s.gateGroups) {
      for (const sw of grp.switches) drawArcadeButton(sw.c, sw.r, sw.used, ts, grp.color);
    }
  }
  // a thin wire from a switch to its door. Multiple wires to the same door run in parallel
  // lanes (offset by index) so they never draw on top of one another.
  function drawSwitchWire(sw, door, color, used, ts, idx, count) {
    const x1 = (sw.c+0.5)*cell, y1 = (sw.r+0.5)*cell, x2 = (door.c+0.5)*cell, y2 = (door.r+0.5)*cell;
    const lane = (idx - (count-1)/2) * cell*0.16;   // per-switch parallel lane
    const ex = x2 + lane;                           // vertical run sits in its own lane
    const pts = [[x1, y1], [ex, y1], [ex, y2], [x2, y2]];
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = used ? color : "rgba(150,156,172,0.5)";
    ctx.globalAlpha = used ? 0.85 : 0.5;
    ctx.lineWidth = Math.max(1.5, cell*0.03);
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    if (used) {   // a travelling pulse along the polyline
      const segs = []; let tot = 0;
      for (let i = 0; i < pts.length-1; i++) { const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); segs.push(d); tot += d; }
      let ph = ((ts/500) % 1) * (tot || 1), px = pts[0][0], py = pts[0][1];
      for (let i = 0; i < segs.length; i++) {
        if (ph <= segs[i] || i === segs.length-1) { const f = segs[i] ? ph/segs[i] : 0;
          px = pts[i][0] + (pts[i+1][0]-pts[i][0])*f; py = pts[i][1] + (pts[i+1][1]-pts[i][1])*f; break; }
        ph -= segs[i];
      }
      ctx.globalAlpha = 0.9; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(px, py, cell*0.05, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  // a dual sliding door: two slim riveted colour panels (styled like the wall tiles) that part as it opens
  function drawSlidingDoor(grp, ts) {
    const { c, r } = grp.door, x = cx(c), y = cy(r), s = cell, t = grp.openT, color = grp.color;
    if (t >= 0.995) return;                       // fully open — nothing to draw
    ctx.save();
    rrect(x, y, s, s, tileR(s)); ctx.clip();
    const off = t * (s*0.5 + 2);                  // each panel slides outward by up to half a cell
    const pw = s*0.5 - 1;
    const panel = (px) => {
      const g = ctx.createLinearGradient(px, y, px, y+s);
      g.addColorStop(0, shade(color, 34)); g.addColorStop(0.5, color); g.addColorStop(1, shade(color, -48));
      rrect(px, y+2, pw, s-4, tileR(s)); ctx.fillStyle = g; ctx.fill();
      ctx.save(); rrect(px, y+2, pw, s-4, tileR(s)); ctx.clip(); grainFill(px, y, pw, s, 0.7); ctx.restore();  // paper grain, like other tiles
      // corner rivets, matching the wall tiles' rivet size (s*0.05)
      const ox = Math.max(3, pw*0.24), oy = s*0.16, br = s*0.05;
      ctx.fillStyle = "rgba(0,0,0,0.30)";
      for (const [bx,by] of [[ox,oy],[pw-ox,oy],[ox,s-oy],[pw-ox,s-oy]]) { ctx.fillRect((px+bx) - br, (y+by) - br, br*2, br*2); }
    };
    panel(x - off);                               // left panel slides left
    panel(x + s*0.5 + off + 1);                   // right panel slides right
    ctx.restore();
  }
  // a simple 2.5D arcade push-button mounted on a metal wall: a flat top face on a coloured base
  function drawArcadeButton(c, r, used, ts, color) {
    const x = cx(c)+cell*0.5, y = cy(r)+cell*0.5, s = cell;
    const pulse = used ? 0 : 0.5 + 0.5*Math.sin(ts/300);
    const R = s*0.19, depth = used ? s*0.03 : s*0.09;   // extrusion; pressed sits lower
    const topY = y - depth*0.5, baseCol = shade(color, -80), topCol = used ? shade(color, -22) : color;
    ctx.save();
    // dark round housing (mounted on the wall)
    ctx.fillStyle = "#191b22"; ctx.beginPath(); ctx.arc(x, y + depth*0.5, R*1.3, 0, Math.PI*2); ctx.fill();
    // side wall (the 2.5D thickness): base disc + a connecting band = a short cylinder
    ctx.fillStyle = baseCol;
    ctx.beginPath(); ctx.arc(x, topY + depth, R, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(x - R, topY, R*2, depth);
    // flat top face
    ctx.fillStyle = topCol; ctx.beginPath(); ctx.arc(x, topY, R, 0, Math.PI*2); ctx.fill();
    if (!used) {
      // simple crescent sheen along the top edge
      ctx.fillStyle = shade(color, 55); ctx.beginPath(); ctx.arc(x, topY - R*0.12, R*0.66, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = topCol; ctx.beginPath(); ctx.arc(x, topY + R*0.04, R*0.78, 0, Math.PI*2); ctx.fill();
      // pulsing "tap me" ring
      ctx.globalAlpha = 0.3 + 0.45*pulse; ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, s*0.028);
      ctx.beginPath(); ctx.arc(x, topY, R*1.12, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = Math.max(1.5, s*0.03); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x - R*0.4, topY); ctx.lineTo(x - R*0.1, topY + R*0.35); ctx.lineTo(x + R*0.45, topY - R*0.35); ctx.stroke();
    }
    ctx.restore();
  }
  // lighten/darken a #rrggbb by amount (-255..255)
  // shade(), but returning hex so hexA() can put an alpha on it — the junction needs both
  function shadeHex(hex, amt) {
    const n = parseInt(hex.replace("#",""), 16);
    const cl = v => Math.max(0, Math.min(255, v + amt));
    const to = v => cl(v).toString(16).padStart(2, "0");
    return "#" + to((n>>16)&255) + to((n>>8)&255) + to(n&255);
  }
  // Turn a hex colour's hue, drain its saturation and shift its lightness, all at once.
  // shade() only moves lightness, which is why the ground could only ever be a darker copy
  // of the track — this lets it be a different material.
  function tintHex(hex, degrees, satMul, lightAmt) {
    const n = parseInt(hex.replace("#",""), 16);
    let r = ((n>>16)&255)/255, g = ((n>>8)&255)/255, b = (n&255)/255;
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
    let h = 0; const l = (mx+mn)/2;
    let sat = d === 0 ? 0 : d / (1 - Math.abs(2*l - 1));
    if (d !== 0) {
      h = mx === r ? ((g-b)/d + (g < b ? 6 : 0)) : mx === g ? ((b-r)/d + 2) : ((r-g)/d + 4);
      h *= 60;
    }
    h = (h + degrees + 360) % 360;
    sat = Math.max(0, Math.min(1, sat * satMul));
    const L = Math.max(0, Math.min(1, l + (lightAmt || 0)/255));
    const C = (1 - Math.abs(2*L - 1)) * sat, X = C * (1 - Math.abs(((h/60) % 2) - 1)), m = L - C/2;
    const seg = Math.floor(h/60) % 6;
    const rgb = [[C,X,0],[X,C,0],[0,C,X],[0,X,C],[X,0,C],[C,0,X]][seg];
    const to = v => Math.round((v + m)*255).toString(16).padStart(2,"0");
    return "#" + to(rgb[0]) + to(rgb[1]) + to(rgb[2]);
  }
  function shade(hex, amt) {
    const n = parseInt(hex.replace("#",""), 16);
    const cl = v => Math.max(0, Math.min(255, v + amt));
    return "rgb(" + cl((n>>16)&255) + "," + cl((n>>8)&255) + "," + cl(n&255) + ")";
  }
  function drawPickups(ts) {
    if (!state.keyCollected) for (const k of state.keys) if (!k.got) drawKey((k.c+0.5)*cell,(k.r+0.5)*cell,ts,k.color);
    for (const t of state.talismans) drawTalismanCell(t, ts);
  }
  // Rails, routes and their turnaround caps. Split out from the hazards themselves and drawn
  // UNDER the track, because they are markings ON the ground: a dashed line painted over a
  // tile the player has just laid makes the tile look like the lower of the two, which is the
  // wrong way round — the tile is a solid object standing on the board.
  //
  // Both ends of a there-and-back route get a cap, and only those: it is the spot the thing
  // turns round at, so it tells you the extent of its reach without watching it get there. A
  // closed loop has no such spot and gets none.
  function drawHazardPaths(ts) {
    const capR = cell*0.075;
    const cap = (pts, col) => { ctx.fillStyle = col;
      for (const [ex,ey] of pts) { ctx.beginPath(); ctx.arc(ex,ey,capR,0,Math.PI*2); ctx.fill(); } };

    // onto the thrust, which is the thing that is meant to be exactly one tile.

  function railRate(P) {

  function drawRailMonster(x, y, ts, dir, K, off) {

    // Easing differs between the two on purpose: the drive snaps away and settles, the
    // recovery is a smooth glide, which is what separates rowing from spinning.
    // Handed in by updateHazards, which is what keeps the teeth and the travel in step —
    // reading the shared clock here instead let the two drift apart, and made every monster

    const P = off || 0;

    if (P < dv) {

    // vertical mover carries its banks down the left and right sides and strokes them up and
    // down, a horizontal one carries them along the top and bottom and strokes them side to
    // side. Both banks always share one offset, which is what reads as a single animal rowing
    // rather than as a wheel that happens to be turning.
    //
    // Travel is set aside FIRST and the teeth are spaced across what is left, so the whole
    // bank stays on the straight run of its edge no matter how far it strokes — no tooth ever
    // climbs into a rounded corner or pops in and out at an end.
    const vert = K.split === "v";
    const base = -h + R, run = 2*(h - R);
    const per = Math.max(1, MONSTER.railBank|0);
    const amp = run * MONSTER.railSlide;
    const step = (run - amp) / per;
    const slide = (ang / MONSTER.railSweep) * amp * sgn;
    const tw = step * MONSTER.railToothW;
    // The middle of each bank is the big one — the stroke reads as coming FROM somewhere
    // rather than from three identical prongs. Grown in both directions at once; the width
    // stays inside its own spacing (railToothW is 0.6 of a step, so even at 1.55 it does not
    // reach a neighbour) so the teeth never merge at the extremes of the stroke.
    const midK = (per % 2) ? (per - 1)/2 : -1;

    // spaced down y); otherwise on the top and bottom. `sl` is how far along their own face
    // they have slid — the rowing pair get the stroke, any others get none.

    // spike can sweep backwards along. A monster that turns corners also carries a second pair
    // on the faces it is heading into and away from; those cannot row — sliding them would be
    // sideways — so they just bristle in and out on `reach` with the rest.

    // off the face alone rather than off watching him move. `dir` is +1 down the rail, which
    // is rightward for a horizontal mover and downward for a vertical one — the same sign
    // works for both, it just applies to a different axis.
    //

    // runs along x, which is his line of travel but not the vertical mover's, so a vertical
    // one is given no bias and simply carries its eyes up or down the panel.

  function drawMonster(x, y, ts, faceX, phase, cfg) {

    // stroke offset is enough to break the lockstep: with only the shared clock, a rank of
    // six rowed in perfect unison, which reads as clockwork rather than as six animals.
    if (K.move === "rail" || K.look === "rail") return drawRailMonster(x, y, ts, faceX, K, phase);
    const s = cell, S = s*MONSTER.size, h = S/2, R = tileR(S);
    const face = faceX < 0 ? -1 : 1;
    // Shut, then a fast snap open, then shut again. Held near zero for most of the cycle,
    // which reads as chomping; a plain sine reads as breathing.
    const u = phase != null ? phase : (ts % MONSTER.chompMs) / MONSTER.chompMs;
    const open = Math.pow(Math.max(0, Math.sin(u*Math.PI)), 0.7);

    // jaw's cut face by `overbite`, so the halves stay apart and all that is left between
    // them is the zigzag channel between the teeth. Derived from the tooth length rather than
    // typed in, so lengthening the teeth closes the bite by exactly as much.
    const shut = h*MONSTER.toothH*(1 - MONSTER.overbite);         // tips past the far face
    const wide = Math.max(shut, h*(K.gap != null ? K.gap : MONSTER.gap));
    const lift = shut + (wide - shut)*open, tilt = MONSTER.tilt*open;
    // One colour for the whole animal — body, teeth and eyes alike, exactly as the rail
    // monsters wear it. The teeth read because they stand out into the gap against the board
    // behind, and the eyes read because they sit on the inscribed panel, which is the only
    // thing on him darker than he is.
    const body = K.body || "#b24dff";

    ctx.save();
    ctx.translate(x, y);
    // A vertical mover splits left/right instead of up/down, so it still bites along its own
    // line of travel. One rotation does it — everything below is written once.
    if (K.split === "v") ctx.rotate(Math.PI/2);
    ctx.scale(face, 1);                                           // face the way it travels

    // No dark backing behind the gap: when he opens, you see the board straight through him,
    // which is what makes the split read as a split rather than a painted-on mouth.

    // Each half is the WHOLE tile drawn behind a straight cut, so both keep the rounded
    // outer corners and neither can show a corner the tile never had.
    for (const j of [-1, 1]) {                                    // upper half, then lower
      ctx.save();

      ctx.save();

      else       ctx.rect(-S, 0, S*2, S*2);                       // ...and below it
      ctx.clip();

      rrect(-h, -h, S, S, R); ctx.clip();                         // grain stays on the tile
      grainFill(-h, -h, S, S, MONSTER.grain);                     // the same paper as everything
      // The inscribed panel the walls and the rail monsters carry. Drawn INSIDE the half's
      // clip, so it is cut by the same straight edge the body is and splits with the jaws
      // rather than bridging the gap between them.
      const ip = S*MONSTER.panelPad;
      ctx.fillStyle = "rgba(9,6,20," + MONSTER.panelA + ")";
      rrect(-h + ip, -h + ip, S - 2*ip, S - 2*ip, Math.max(0, R - ip*0.6)); ctx.fill();
      ctx.restore();                                              // the teeth stand PAST the cut,
      ctx.fillStyle = body;                                       // so they must not be clipped to it

      // teeth sit in the gaps between the upper ones instead of meeting them point to point.
      const n = MONSTER.teeth, span = S*0.86, x0 = -span/2, tw = span/n, tl = S*MONSTER.toothH;

      if (j < 0) drawEyes(ctx, 0, -h + S*0.30, s, body, 1, ts, 0);

  }
  // On the floor: the talisman bobs on a soft disc of its own colour. Once it's been

    }
    const y = y0 + Math.sin(ts/320) * cell * 0.05;

    ctx.restore();

  // "New Talisman" card, low on the screen. It used to sit across the TOP, which is exactly

  function talFlashRect() {
    const w = Math.min(viewW * 0.8, 340), h = Math.round(Math.min(viewW, viewH) * 0.13);

  }
  function drawTalismanFlash(dt, ts) {

    if (talFlash.out) { talFlash.out -= dt; if (talFlash.out <= 0) { talFlash = null; return; } }

  // A coin is a little golden TILE hovering off the board: the same rounded square the game

  // the ground and shrinks as it rises, which is what sells the float.

  const COIN = {
    size:     0.34,   // fraction of a cell
    float:    0.07,   // bob height, fraction of a cell
    floatMs:  620,    // one full bob
    rock:     0.08,   // lazy rotation, radians
    shadowA:  0.28,   // ground shadow opacity
    gloss:    0.45,   // fixed diagonal sheen across the face
    rim:      0.55,   // bright edge along the top
    sweep:    0.55,   // travelling glint strength
    sweepMs:  2200,   // how often it crosses
    spark:    0.80,   // corner twinkle strength
    sparkMs:  2600,   // how often it twinkles
    panelPad: 0.15,   // the inscribed square's inset, fraction of the coin
    panelA:   1.00,   // ...and how solidly it is filled, in COIN_EDGE

  const COIN_EDGE = "#c78b16";

  // tuning the coin in coin-lab tunes these too and the family can't drift apart; the two
  // edge offsets below are the one thing still written twice (drawCoin has the other copy),

  // whole illusion, and it only works because the offset agrees with the gloss: both are lit
  // from the top-left. Flip one and the motif pops out as a relief instead.
  // Talisman badge geometry. No lab tunes these, so they live here rather than in a block.
  const TAL = {
    loopR:    0.050,  // the hanging loop's radius, fraction of a CELL
    loopY:    0.255,  // ...and how far above the badge's centre it sits
    loopW:    0.046,  // ...and how thick its line is
    panelPad: 0.100,  // the inscribed square's inset
    panelA:   0.250,  // ...and how far it darkens the face under it
    lift:     0.000,  // the icon's drop shadow, fraction of the icon. 0 = none at all
    grain:    0.85,   // paper texture over the badge, as everything else in the game wears
  };
  // createPattern belongs to the context that made it, and talismans are painted onto the
  // board, a dozen swatch canvases and the power button — so cache one per context rather
  // than rebuilding it every frame or handing the wrong context's pattern around.
  const _talGrain = new WeakMap();
  function talGrain(g) {
    let p = _talGrain.get(g);
    if (!p) { p = g.createPattern(paperTile, "repeat"); _talGrain.set(g, p); }
    return p;
  }
  // The loop a talisman hangs from, in the tile's OUTER colour — the face, the same lighter
  // metal the frame is — so the hook reads as part of the charm rather than as a dark cord
  // behind it. Drawn BEFORE the badge everywhere it appears, so its ends disappear behind the
  // tile and it looks attached.
  //
  // TAL's numbers are fractions of a CELL and a badge is drawn at 0.26 of one, so the cell a
  // badge of radius r stands in is r/0.26. Scale the hook by anything else — a canvas width,
  // say — and it lands inside the tile, hidden.

    const CE = r / 0.26;

  // face and the two ran together, and a near-black stood the badge on a slab of something
  // else entirely. extrude() shades it further as it falls away, so this is the NEAR step and
  // the far one is another EXTRUDE_SHADE below it.
  const TAL_SIDE_SHADE = 30;
  // The charm's TRUE colour — the one it is known by, the one its name is printed in and the
  // one the ceremony's quilt is mixed from. Every badge used to be painted in a separate
  // `face`, a shade or two off the real thing, so the object never quite matched the colour
  // the rest of the game used for it. One source now: the metal, its wall and its raised icon
  // are all this, and only the wall is darkened.

  const talSide = def => tintHex(talFace(def), 0, 1, -TAL_SIDE_SHADE);
  function talBadge(g, x, y, r, def) {
    const s2 = r*1.9, h = s2/2, rad = s2*TILE.radius;
    const rr = (X, Y, W, H, R) => { g.beginPath(); g.moveTo(X+R,Y);
      g.arcTo(X+W,Y,X+W,Y+H,R); g.arcTo(X+W,Y+H,X,Y+H,R);
      g.arcTo(X,Y+H,X,Y,R); g.arcTo(X,Y,X+W,Y,R); g.closePath(); };

    g.save(); rr(x-h, y-h, s2, s2, rad); g.clip();

    // as on a monster, so the panel reads as a recess in the paper rather than a sticker.

      // RAISED, and in the tile's OUTER colour — the face, not the edge — so the icon sits
      // lighter than the panel it stands on. That is what makes it read as standing proud:
      // the panel is the face darkened, so an icon at full face colour is the one thing on
      // the badge catching light. Its shadow falls down and right, away from the same corner
      // the rest of the game is lit from.
      // A floor of 0.6px keeps the shadow visible at small sizes — but only once there is a
      // shadow to keep. At lift 0 it is skipped outright, or the slider's own minimum would
      // still leave a sub-pixel smudge and "off" would be unreachable.
      const d = TAL.lift > 0 ? Math.max(0.6, r*TAL.lift) : 0;

      if (d > 0) { g.fillStyle = g.strokeStyle = "rgba(9,6,20,0.38)"; def.etch(g, x + d, y + d, r*0.80); }
      g.fillStyle = g.strokeStyle = talFace(def);              def.etch(g, x,     y,     r*0.80);
    }
    // No diagonal gloss and no lit top edge: a talisman is flat colour. It borrowed both from
    // the coin, which left it looking like currency — the one thing on the board it must not
    // be mistaken for. Three flat tones now do the work: the edge, the face, and the panel.
    g.restore();
    g.restore();
  }
  function drawCoin(x, y, ts) {
    const s2 = cell * COIN.size, r = tileR(s2), h = s2/2;
    const t = ts / COIN.floatMs;
    const lift = (0.5 + 0.5*Math.sin(t)) * cell * COIN.float;
    const tilt = Math.sin(t*0.8) * COIN.rock;
    ctx.save();
    // ground shadow, tied to the lift

  // The Singularity, tuned in crumble-lab.html — paste the RIFT block between the two.

  // full strength exactly as it lands, so the square and the eye become the same black at the
  // same moment and the hand-off cannot be seen.

  // these on a board cost what one does, and none of them can drift out of step with itself.
  const RIFT = {

    drift:   0.17,     // how far off centre they wander, fraction of a cell
    turns:   0.55,     // turns each one makes on its way in
    ms:      1500,     // one square's whole fall
    ease:    1.5,      // slow to leave, then it lets go
    big:     1.1,      // where a square comes in, as a fraction of a CELL
    peak:    1,        // its opacity as it lands on the eye
    tint:    0,        // 0 = black; higher walks a hue round the wheel square to square
    tremble: 0.014,    // how hard the eye shakes, fraction of a cell

    halo:    0.6,      // the bruise the pull leaves in the floor

  function tickEaten(dt) {
    const s = state; if (!s || !s.eaten || !s.eaten.length) return;
    for (const e of s.eaten) e.t += dt;
    s.eaten = s.eaten.filter(e => e.t < EATEN_MS);

  // centred on the eye — so it does not read as a different effect happening at the same place.
  function drawEaten() {
    const s = state; if (!s.eaten) return;
    for (const e of s.eaten) {
      const k = Math.min(1, e.t / EATEN_MS), q = 1 - Math.pow(1 - k, 3);
      const x = cx(e.c) + cell*0.5, y = cy(e.r) + cell*0.5;

      // the player carries — not the length of track that happened to be drawn on it. Losing a
      // tile is what this costs you, so a tile is what you should see leave.
      //

      const k2 = 1 - q * (1 - RIFT.hole*0.6);

  function drawSingularity(c, r, gone, ts) {

      h.addColorStop(0,   "rgba(78,44,128,0)");

      const e = Math.pow(k, P.ease);

      if (sz <= eye + 0.5) continue;                    // arrived; the eye has it now
      const ang = e * P.turns * Math.PI*2 + i*0.4;

      ctx.save();

      ctx.translate(Math.cos(i*2.4 + e*3.1) * off, Math.sin(i*2.4 + e*3.1) * off);

    // divide into each other, so the shake never repeats and never falls into a rhythm you
    // could tap along to. It is deliberately NOT on the swirl's clock: the two running in
    // different times is what makes it read as something straining rather than something
    // being animated.
    const tr = cell * P.tremble;

  // The blade. Bigger than it was, with a lot of small teeth instead of a few big ones, a

  // collar and hole are concentric, so rotating them would cost work and change nothing.

    teeth:  38,     // how many

    plate:  0.80,   // the disc inside the teeth

  const doorScratch = document.createElement("canvas");   // the lock body, so its hole can be cut

  function drawDoorLock(c, r, ts, color, open) {
    const x = cx(c)+cell*0.5, y = cy(r)+cell*0.5, s = cell*0.5;
    ctx.save();

    if (!open) {
      const tx = cx(c), ty = cy(r);

  // tiny flag glyph centred in a badge of radius ~r
  function drawMiniFlag(x, y, r, color) {

    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, r*0.16); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x - r*0.28, y - r*0.62); ctx.lineTo(x - r*0.28, y + r*0.62); ctx.stroke();  // pole
    ctx.fillStyle = color;                                                                                   // pennant

    ctx.arc(x - r*0.42, y, r*0.15, 0, Math.PI*2, true);    // ...with a hole

  // one tile's platform piece, clipped to its own cell. The top surface is the
  // tile's surface polyline (a straight line, or a quarter-circle arc for
  // corners); the body hangs off the down-normal side.
  function drawPlatformTile(n, prev, next) {
    drawPlatformSurface(n, tileSurface(n, prev, next), curTrack());
  }

  // draw a platform body + rail from a surface polyline S, clipped to the cell.
  // The body is solid from the running surface all the way to the tile edge.
  function hexA(hex, a) {   // "#ffcf4d" -> "rgba(255,207,77,a)"
    const n = parseInt(hex.replace("#",""), 16);

  // build the body polygon (surface S, extended past the far tile edge) as the current path
  // The slab hanging under the running surface, as a SIMPLE polygon: the surface itself, then
  // closed along the cell's own edges and corners.
  //
  // It used to be built by pushing every surface point 1.7 cells down its own normal. On a
  // straight that is a clean parallel offset, but on a CORNER the normals converge on the
  // arc's centre, and an offset that long shoots straight through it and out the far side —
  // so the "underside" arrived reversed and the polygon crossed itself. Nonzero winding then
  // cancelled parts of the overlap, which is what ate the thin slivers along the edges of
  // corner tiles. Nothing here offsets any more, so there is nothing to overshoot.
  function bodyPath(S, C) {
    const h = cell/2, last = S.length - 1, mid = last >> 1;
    // which side the body hangs on, from the tangent at the middle of the surface
    const a = S[Math.max(0, mid-1)], b = S[Math.min(last, mid+1)];
    let tx = b.x - a.x, ty = b.y - a.y; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const bx = -ty, by = tx;                             // same convention as the old -normal
    ctx.moveTo(S[0].x, S[0].y);                          // adds a subpath (caller does beginPath/fill)
    for (let k = 1; k <= last; k++) ctx.lineTo(S[k].x, S[k].y);
    if (last === 2) {                                    // straight: a slab half a cell deep
      ctx.lineTo(S[last].x + bx*h, S[last].y + by*h);
      ctx.lineTo(S[0].x    + bx*h, S[0].y    + by*h);
    } else {
      // corner: the arc's centre is the cell corner it bends around
      const O = { x: S[0].x + S[last].x - C.x, y: S[0].y + S[last].y - C.y };
      const M = S[mid];
      if ((O.x - M.x)*bx + (O.y - M.y)*by > 0) {         // body on the inside — hug that corner
        ctx.lineTo(O.x, O.y);
      } else {                                           // body on the outside — wrap the other three
        const cs = [{x:C.x-h,y:C.y-h},{x:C.x+h,y:C.y-h},{x:C.x+h,y:C.y+h},{x:C.x-h,y:C.y+h}];
        let k0 = 0, best = Infinity;
        for (let i = 0; i < 4; i++) { const d = Math.hypot(cs[i].x-O.x, cs[i].y-O.y); if (d < best) { best = d; k0 = i; } }
        const n1 = (k0+1)%4, n3 = (k0+3)%4;
        const first = Math.hypot(cs[n1].x-S[last].x, cs[n1].y-S[last].y)
