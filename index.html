    // Dark upper on purpose: the whole point is the strip of light under it, and a neon shin
    // as well would make him a torch rather than a runner in loud shoes.
    { id:"neon", name:"Neon", cost:10, col:"#c6ff2e", cover:0.17, legCol:"#2b2740",
      draw(g,s,col){
        g.fillStyle = "#2b2740"; bootBody(g,s,-0.030,-0.020,0.052,0.014); g.fill();
        g.fillStyle = col; soleSlab(g,s,-0.034,0.056,0.014); g.fill();
        g.globalAlpha = 0.30; soleSlab(g,s,-0.050,0.072,0.006,0.003); g.fill();   // spill
        g.globalAlpha = 1; } },

    // Both of these are one colour on itself, so the SOLE is the only thing separating shoe
    // from shoe — a half-step of the same tone, which is the joke.
    { id:"blackout", name:"Black on Black", cost:10, col:"#15151c", cover:0.28, legCol:"#15151c",
      draw(g,s,col){
        g.fillStyle = col; bootBody(g,s,-0.030,-0.024,0.054,0.014); g.fill();
        g.fillStyle = "#2c2c38"; soleSlab(g,s,-0.034,0.058,0.012); g.fill(); } },

    { id:"whiteout", name:"White on White", cost:15, col:"#f4f4f7", cover:0.28, legCol:"#f4f4f7",
      draw(g,s,col){
        g.fillStyle = col; bootBody(g,s,-0.030,-0.024,0.054,0.014); g.fill();
        g.fillStyle = "#d3d3dd"; soleSlab(g,s,-0.034,0.058,0.012); g.fill(); } },

    // Black leather, yellow sole — and the yellow WELT above it, which is the detail everyone
    // actually recognises these by.
    { id:"docs", name:"Docs", cost:15, col:"#17161c", cover:0.40, legCol:"#17161c",
      draw(g,s,col){
        g.fillStyle = col; bootBody(g,s,-0.032,-0.034,0.050,0.010); g.fill();
        g.fillStyle = "#f0c25c"; soleSlab(g,s,-0.038,0.056,0.015,0.005); g.fill();
        g.fillRect(-s*0.034, s*(KICK_SOLE-0.021), s*0.088, s*0.004); } },

    // One blunt lump with holes in it. It covers almost no leg — that is what a clog is — so
    // nearly all of this shoe is the shape.
    { id:"crocs", name:"Crocs", cost:20, col:"#5bbf7a", cover:0.06, legCol:"#5bbf7a",
      draw(g,s,col){
        g.fillStyle = col; bootBody(g,s,-0.026,-0.020,0.058,0.022); g.fill();
        g.fillStyle = "rgba(16,52,30,0.45)";
        for (let k=0;k<3;k++){ g.beginPath(); g.arc(s*(0.010+k*0.015), -s*0.009, s*0.005, 0, 7); g.fill(); }
        g.fillStyle = col; g.fillRect(-s*0.034, -s*0.012, s*0.009, s*0.030); } },   // the strap

    // Bigger wheels than the boot has any business carrying, which is the look. The boot STOPS
    // above them — bottom is passed explicitly — so it is riding the wheels rather than
    // standing on the ground with two circles stuck to it.
    { id:"skate", name:"Skates", cost:20, col:"#e8506b", cover:0.34, legCol:"#e8506b",
      draw(g,s,col){
        g.fillStyle = col; bootBody(g,s,-0.028,-0.034,0.048,0.014, KICK_SOLE-0.032); g.fill();
        g.fillStyle = "#d9dfe8";
        rr2(g, -s*0.032, s*(KICK_SOLE-0.044), s*0.086, s*0.012, s*0.005); g.fill();  // the plate
        for (const x of [-0.010, 0.034]) {
          g.fillStyle = "#2b2740";
          g.beginPath(); g.arc(s*x, s*(KICK_SOLE-0.019), s*0.019, 0, 7); g.fill();
          g.fillStyle = "#8f96a8";                                                    // the hub
          g.beginPath(); g.arc(s*x, s*(KICK_SOLE-0.019), s*0.007, 0, 7); g.fill(); } } },

    { id:"welly", name:"Wellies", cost:25, col:"#3f8f5a", cover:0.62, legCol:"#3f8f5a",
      draw(g,s,col){                                    // tall, wide, and blunt at the toe
        g.fillStyle = col; bootBody(g,s,-0.032,-0.046,0.046,0.012); g.fill();
        g.fillStyle = "#1e4a2e"; soleSlab(g,s,-0.038,0.052,0.014,0.004); g.fill(); } },

    // Twice the length of any other shoe here and blunt at the end of it. The measurements are
    // the joke, so they are deliberately absurd rather than merely large.
    { id:"clown", name:"Clown", cost:25, col:"#e8506b", cover:0.20, legCol:"#f0c25c",
      draw(g,s,col){
        const top = -0.016, h = s*(KICK_SOLE - top);
        g.fillStyle = col; rr2(g, -s*0.038, s*top, s*0.148, h, s*0.020); g.fill();
        g.save(); rr2(g, -s*0.038, s*top, s*0.148, h, s*0.020); g.clip();
        g.fillStyle = "#f4f6ff"; g.fillRect(s*0.074, s*(top-0.01), s*0.040, h + s*0.02);
        g.restore();
        g.fillStyle = "#4dc9ff"; soleSlab(g,s,-0.042,0.114,0.008,0.004); g.fill(); } },

    // A heel is an ARCH: the ball of the foot on the ground at the front, a spike at the back,
    // and nothing at all in between. All one red, shaft included — no sole in a second colour,
    // no black — so the shape is the only thing saying what it is, and the shape had better be
    // a POINT. The toe runs a good half-cell past where any other shoe here stops.
    { id:"kink", name:"Kink", cost:30, col:"#d61f3e", cover:0.55, legCol:"#d61f3e",
      draw(g,s,col){
        const SOLE = s*KICK_SOLE;
        g.fillStyle = col;
        g.beginPath();                                   // the arch, drawn out to a sharp toe
        g.moveTo(-s*0.018, -s*0.016);
        g.lineTo( s*0.030, -s*0.012);
        g.quadraticCurveTo( s*0.070, -s*0.002, s*0.086, s*0.019);   // the taper
        g.lineTo( s*0.088, SOLE);                                    // ...to a point on the floor
        g.lineTo(-s*0.004, SOLE);
        g.quadraticCurveTo(-s*0.014, s*0.004, -s*0.018, -s*0.016);
        g.closePath(); g.fill();
        g.beginPath();                                   // ...and the spike behind it
        g.moveTo(-s*0.022, -s*0.012);
        g.lineTo(-s*0.006,  s*0.006);
        g.lineTo(-s*0.008, SOLE);
        g.lineTo(-s*0.020, SOLE);
        g.closePath(); g.fill(); } },
  ];
  // The kicks rack shows LEGS AND SHOES and nothing else — no body, no eyes. Every other
  // category needs the bust because it is selling something you wear on it; a shoe is sold on
  // the foot, and a runner drawn small enough to fit above two feet left the shoes too small
  // to tell apart, which is the only job this card has.
  //
  // The pair faces OUTWARD, one mirrored, so the shape is read from both sides at once — and
  // so a long shoe (the clown's is a third of the card) has somewhere to go instead of the two
  // of them running into each other.
  KICKS.forEach(sh => { if (!sh.draw) return;
    sh.swatch = (g,S) => {
      const skin = "#bfe6ff";
      const s = S*2.2;                        // the runner size these shoes are cut for
      const GROUND = S*0.80, footY = GROUND - s*KICK_SOLE;
      // Straight down and cut square at the top: a card is a diagram, not a pose. Splayed
      // legs with domed ends read as a little figure with its body cropped off, which put the
      // eye on the crop instead of on the shoe.
      const hipY = S*0.22, footX = S*0.115;
      const legs = [[-footX, -footX], [footX, footX]];
      g.lineWidth = s*RUNNER.legWidth; g.lineJoin = "round";
      g.lineCap = "butt"; g.strokeStyle = skin;
      g.beginPath();
      for (const [hx,fx] of legs) { g.moveTo(S/2+hx, hipY); g.lineTo(S/2+fx, footY); }
      g.stroke();
      // the kick's own length of leg over it, cut square at the top exactly as in play
      if (sh.cover > 0 && sh.legCol) {
        g.strokeStyle = sh.legCol; g.lineCap = "butt";
        g.beginPath();
        for (const [hx,fx] of legs) {
          g.moveTo(S/2 + hx + (fx-hx)*(1-sh.cover), hipY + (footY-hipY)*(1-sh.cover));
          g.lineTo(S/2 + fx, footY);
        }
        g.stroke();
        g.fillStyle = sh.legCol;              // ...and the round foot end back
        for (const [,fx] of legs) {
          g.beginPath(); g.arc(S/2+fx, footY, s*RUNNER.legWidth/2, 0, 7); g.fill(); }
      }
      legs.forEach(([,fx], i) => {
        g.save(); g.translate(S/2+fx, footY);
        if (i === 0) g.scale(-1, 1);          // the left one turns to face out
        sh.draw(g, s, sh.col || skin, skin);
        g.restore();
      });
    }; });

  // Twelve designs for the track. Each is a RAIL — the bright line the runner's feet are on —
  // over an EARTH, which is the pieced ground under it: squares a quarter of a tile across,
  // laid out by `earthMode` (see EARTH_LAYOUT). Three of them bring one of the older drawn
  // patterns instead of a colour set, so those are not lost.
  //
  // The first is the default and costs nothing. It is no longer the level's own generated hue:
  // the track is the one thing on the board that is the same in every level, and it reads far
  // better as a fixed thing the runner brings with him than as one more colour the level picks.
  const TRACK_DEFAULT = { id:"classic", name:"Classic", cost:0,
                          earth:["#e8912a","#f6c445"] };
  const TRACKS = [
    TRACK_DEFAULT,
    // Black on black. The rail is barely a shade off its ground — you can see where to run,
    // and only just, which is the whole joke of it.
    { id:"midnight", name:"Midnight", cost:15, earth:["#09080e","#181628"] },
    // ...and its opposite, which is harder to read and worse for you.
    { id:"bone",   name:"Bone",      cost:15, earth:["#e2e0ec","#fcfbff"] },
    { id:"blood",  name:"Blood",     cost:20, earth:["#4a0a0f","#7d1219"] },
    // Neon: tube colours scattered over a night-black ground. Black takes half the entries, so
    // it wins half the squares and the bright ones stay sparse — a sign lit against the dark,
    // rather than a bright floor with some black in it. Scattered rather than checked, because
    // a neon sign is not a tiled pattern.
    { id:"neon",   name:"Neon",      cost:30, earthMode:"scatter",
      earth:["#0b0b14","#0b0b14","#0b0b14","#0b0b14",
             "#ff2fd0","#2fe8ff","#c6ff2f","#8b2fff"] },
    // Every colour it can find, one to a square, fixed per place on the board so the ground
    // does not shimmer as the camera moves.
    { id:"poly",   name:"Polychrome", cost:30, earthMode:"scatter",
      earth:["#ff4d4d","#ff9f1c","#ffe14d","#3ddc84","#3db4ff","#8f6cff","#ff5fd2","#20e3c0"] },
    // The same colours, but ordered and by COLUMN, so the spectrum runs across the ground
    // rather than being scattered through it.
    { id:"rainbow", name:"Rainbow",  cost:30, earthMode:"bands",
      earth:["#ff4d4d","#ff9f1c","#ffe14d","#3ddc84","#3db4ff","#8f6cff"] },
    { id:"picnic", name:"Picnic",    cost:25, earthMode:"gingham",
      earth:["#c62828","#e28c88","#fdf6ec"] },   // full red, the half tone, and the cloth
    // Vertical stripes: `bands` colours by COLUMN alone, so a colour runs the full height of
    // the level in an unbroken line rather than alternating down the way a check does. Two
    // tones, one square each, so a stripe is a quarter of a tile — the same measure as
    // everything else on the ground.
    { id:"lawn",   name:"Lawn",      cost:20, earthMode:"bands",
      earth:["#2a6642","#3d8f5c"] },
    // Striped like the Lawn, but the stripes GRADE rather than alternate: blue walking to
    // green a step at a time. The ramp is a ring — up through the middle tones and back down
    // the same ones — so the last column meets the first without a seam where the cycle wraps,
    // which a plain blue-to-green list would give you every eighth column. Eight of them, so
    // the whole cycle is two tiles wide.
    { id:"water",  name:"Water",     cost:25, earthMode:"bands",
      earth:["#2f6fd0","#2f82bf","#2f94ad","#2fa79c","#2fb98a","#2fa79c","#2f94ad","#2f82bf"] },
    { id:"mint",   name:"Mint",      cost:10, earth:["#2fae86","#54d6a4"] },
    // Gold. Four tones scattered rather than two checked, so it reads as beaten metal catching
    // the light at different angles rather than as a tiled floor that happens to be yellow —
    // and the rail is the palest of them, so the line he runs on is the shine on it.
    { id:"gold",   name:"Gold",      cost:30, earthMode:"scatter",
      earth:["#b8860b","#d4a017","#f0c33c","#a8760a"] },
  ];
  // The rail takes its colour FROM the earth it runs over: the brightest of that design's
  // squares, drained a little and lifted toward white. A hand-picked rail per design drifts the
  // moment the earth is retuned — Gold's rail was still Timber's cream after Timber became Gold
  // — and the rail is not an independent colour anyway. It is the light catching the top edge
  // of whatever the ground is made of, so it should be that colour and brighter.
  const RAIL_LIFT = 70;                          // lightness added, out of 255
  const lumOf = h => { const n = parseInt(h.slice(1), 16);
                       return (n>>16 & 255)*0.299 + (n>>8 & 255)*0.587 + (n & 255)*0.114; };
  const railFrom = cols => {
    let best = cols[0];
    for (const c of cols) if (lumOf(c) > lumOf(best)) best = c;
    return tintHex(best, 0, 0.85, RAIL_LIFT);
  };
  TRACKS.forEach(t => { if (t.earth) t.rail = railFrom(t.earth); });

  // One swatch routine for all twelve: the pane, the earth as this design lays it out, and the
  // rail across it. Drawn from the SAME fields the board draws from, so a swatch can never show
  // a design the game does not paint.
  TRACKS.forEach(t => {
    // A track card is the DESIGN and nothing else: a plain rectangle of earth with the rail
    // across it. It used to be a rounded plaque floating on a lilac plate, which sold the
    // plaque rather than the pattern — and rounded corners cut the very grid you are buying.
    // Square, edge to edge, so the quarter-tile squares run off all four sides the way they
    // do on the board.
    t.swatch = (g,S) => {
      const cols = t.earth || TRACK_DEFAULT.earth;
      const lay = EARTH_LAYOUT[t.earthMode || "check"] || EARTH_LAYOUT.check;
      // Sized from the SQUARES out, not the card in: four across is a tile's own quarter-grid,
      // and the height is the rail plus exactly TWO whole rows of them. It used to be a fixed
      // rectangle with the rail 38% down it, which left a quarter of the card empty above the
      // rail and cut the second row of earth off halfway — so a design whose pattern repeats
      // every two rows (every one of them does) could not show its repeat.
      const n = 4, ROWS = 2;
      const w = S*0.88, q = w/n, railH = Math.max(2, Math.round(S*0.085));
      const h = railH + ROWS*q, x = (S-w)/2, y = (S-h)/2;
      g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
      for (let j = 0; j < ROWS; j++) for (let i = 0; i < n; i++) {
        g.fillStyle = lay(cols, i, j);
        g.fillRect(x + i*q, y + railH + j*q, q + 1, q + 1);
      }
      g.restore();
      g.fillStyle = t.rail; g.fillRect(x, y, w, railH);   // the rail, straight across the top
    };
  });

  // one table so the shop, the save format and the drawing all agree on what exists
  // A picture per category for the shop's tab strip. Six tabs across a phone leaves about
  // twenty pixels each, which is not enough for a word — so each draws the thing it sells.
  const LOOK_ICONS = {
    drip: (g,S) => { rr2(g, S*0.20, S*0.24, S*0.60, S*0.52, S*0.10); g.fillStyle="#bfe6ff"; g.fill();
      g.fillStyle="#17263f";
      g.beginPath(); g.arc(S*0.40, S*0.46, S*0.055, 0, 7); g.arc(S*0.62, S*0.46, S*0.055, 0, 7); g.fill(); },
    hat: (g,S) => { g.fillStyle="#2b2740";
      g.fillRect(S*0.14, S*0.58, S*0.72, S*0.10);
      rr2(g, S*0.30, S*0.24, S*0.40, S*0.36, S*0.04); g.fill(); },
    trail: (g,S) => { const cols=["#ff595e","#ff924c","#ffca3a","#8ac926","#1982c4"];
      cols.forEach((c,i)=>{ g.fillStyle=c; g.fillRect(S*0.10, S*0.30 + i*S*0.08, S*0.80, S*0.08); }); },
    swagger: (g,S) => { g.strokeStyle="#bfe6ff"; g.lineWidth=S*0.10; g.lineCap="round";
      g.beginPath(); g.moveTo(S*0.30,S*0.28); g.lineTo(S*0.52,S*0.52); g.lineTo(S*0.34,S*0.78); g.stroke();
      g.beginPath(); g.moveTo(S*0.52,S*0.52); g.lineTo(S*0.74,S*0.72); g.stroke(); },
    kicks: (g,S) => { g.fillStyle="#f2f4ff";
      rr2(g, S*0.16, S*0.44, S*0.44, S*0.24, S*0.08); g.fill();
      rr2(g, S*0.44, S*0.32, S*0.40, S*0.36, S*0.08); g.fill();
      g.fillStyle="rgba(23,38,63,0.45)"; g.fillRect(S*0.14, S*0.66, S*0.72, S*0.10); },
    track: (g,S) => { rr2(g, S*0.12, S*0.30, S*0.76, S*0.40, S*0.07); g.fillStyle="#8d86c9"; g.fill();
      g.fillStyle="#ffcf4d"; g.fillRect(S*0.12, S*0.52, S*0.76, S*0.18);
      g.fillStyle="#fff2c4"; g.fillRect(S*0.12, S*0.49, S*0.76, S*0.05); },
  };
  const LOOK = [
    { key:"drip",   label:"Drip",    items:SKIN_COLOURS },
    { key:"hat",    label:"Hat",     items:HATS },
    { key:"trail",   label:"Trail",   items:TRAILS },
    { key:"swagger", label:"Swagger", items:SWAGGERS },
    { key:"kicks",   label:"Kicks",   items:KICKS },
    { key:"track",   label:"Track",   items:TRACKS },
  ];
  LOOK.forEach(l => { l.icon = LOOK_ICONS[l.key]; });
  // A tap on stock you do not own puts it ON — on the figure at the top of the shop, nowhere
  // else — and turns its cell into its own buy button. Nothing is spent until you tap it again.
  // It rides in FRONT of `settings.look` rather than replacing it, so the moment it is cleared
  // the real look is back: there is nothing to restore and so nothing to get wrong.
  let shopPreview = null;                 // { key, id }, or null
  const shopScroll = {};                  // how far down each tab's rack was left
  const lookOwned = k => (settings.look && settings.look[k]) || LOOK.find(l=>l.key===k).items[0].id;
  const lookWorn = k => (shopPreview && shopPreview.key === k ? shopPreview.id : null) || lookOwned(k);
  const lookItem = k => { const cat = LOOK.find(l=>l.key===k);
                          return cat.items.find(i => i.id === lookWorn(k)) || cat.items[0]; };
  // Prices are live. The six zero-cost items are the kit you start in — they have to stay
  // owned or the runner would have nothing to wear on level 1 — and everything else is locked
  // until it is bought. The whole shop totals 222 tiles against 111 coins in the campaign, so
  // it is two full clears, every coin collected, to own the lot.
  const UNLOCK_ALL = false;
  const owns = it => UNLOCK_ALL || it.cost === 0 || wallet.owned.has(it.id);
  function wearLook(k, id){ settings.look = settings.look || {}; settings.look[k] = id; saveSettings(); }

  // ---------- Per-level look (background theme + track colour) -----------
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function hashSeed(str){ let h=2166136261; str=String(str); for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  // Every level's COLOURS come from its own number, which fixes them forever — and level one
  // drew a muted green nobody chose. This salt reshuffles the whole campaign's palettes in one
  // character: change it and every level gets a different set, deterministic as ever. "f" gives
  // level one a blue-teal, two a deep red, three plum, four orange-yellow, five indigo.
  //
  // Deliberately NOT applied to the per-level melody, which is seeded off the same number one
  // line below: retuning the look of the game should not silently rewrite its music.
  const THEME_SALT = "f";
  const themeSeed = label => hashSeed(THEME_SALT + label);
  // a distinct background theme per level (colours / patch size / angle / style)
  function genTheme(seed){
    const rnd=mulberry32((seed^0x9e3779b9)>>>0 || 7);
    const baseH=rnd()*360, N=4+Math.floor(rnd()*4);
    const sat=(28+rnd()*34)|0, lig=(24+rnd()*18)|0;            // muted (lifted from the old 15–30% range)
    // How far round the hue wheel the whole set walks. It used to run 50..330 degrees, which
    // at the top end put reds next to greens next to blues in one quilt — a patchwork, not a
    // gradient. Level 25 was the one everybody liked: about 110 degrees across six patches,
    // so each square is a clear step from its neighbour without the set ever leaving its own
    // family of colour. This range is built around that. Every backdrop in the game comes
    // through here — levels, the title, the cinematic — so they all soften together.
    const spread=45+rnd()*85, colors=[];
    for(let i=0;i<N;i++){ const h=((baseH+spread*i/N)%360)|0; colors.push("hsl("+h+","+sat+"%,"+lig+"%)"); }
    // A quilt wants to sit square-on or on-point, not at an arbitrary tilt — an angle
    // between the two reads as a mistake rather than a choice. Pick one, then add a
    // small hand-sewn wobble so it never looks machine-aligned.
    // patchW is a fraction of the CELL, and stays under PATCH_MAX so a background patch
    // is never within 30% of a foreground tile — see the clamp in drawPatchwork().
    // stripeW is a WHOLE number of patches: a fractional stripe width makes the staircase
    // steps uneven, which reads as a mistake rather than as a diagonal.
    return { colors, patchW:0.38+rnd()*0.32,
             dir:rnd()<0.5?1:-1,                               // which way the stripes lean
             stripeW:2+Math.floor(rnd()*3),                    // patches per stripe
             drift:(rnd()<0.5?1:-1)*(0.2+rnd()*0.5) };
  }
  // HSL -> "#rrggbb" (so hexA() can add alpha to the platform colours)
  function hslHex(h, s, l){
    s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
    const f=n=>l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    const to=x=>Math.round(x*255).toString(16).padStart(2,"0");
    return "#"+to(f(0))+to(f(8))+to(f(4));
  }
  // A worn track skin overrides the level's generated palette; "Level" keeps it.
  const curTrack = () => lookItem("track").track || (lookItem("track").earth || TRACK_DEFAULT.earth)[0];
  const curRail  = () => lookItem("track").rail  || TRACK_DEFAULT.rail;

  function loadLevel(i) { endCeremony();                            // no ceremony survives a load
                         Sound.warp(false); Sound.ambient(null);   // the tiles drive the music now
    levelIdx = clamp(i, 0, LEVELS.length - 1);
    levelAttempts[levelIdx] = (levelAttempts[levelIdx] || 0) + 1;      // count each start (incl. retries)
    beginLevel(LEVELS[levelIdx], String(levelIdx + 1));
    state.attempts = levelAttempts[levelIdx];
    state.score = computeScore(); updateScoreHud();
  }
  function beginLevel(L, label) {
    // Whatever the last chapter was doing, it is not doing it any more. The victory sequence
    // owns the frame while it runs, so a chapter loaded out from under it — Skip, the Tileverse,
    // a demo — would go on being drawn as a map with the new level running invisibly beneath.
    if (win) winEnd();
    markOccDirty();                            // fresh board — occupancy has to be rebuilt
    // The wall bitmap is one CELL, not the board, so a new level does not invalidate it — only
    // a change of cell size does, and resize() marks it for that.
    COLS = L.cols || FULL_COLS; ROWS = L.rows || FULL_ROWS;   // this level's board size
    const walls = new Set(L.walls.map(w => key(w[0], w[1])));
    // where this level starts dealing crack variations, so levels don't all open with Var 1
    const stoneRot = (L.stone && L.stone.length)
      ? _sHash(L.stone[0][0] + 1, L.stone[0][1] + 1) % _STONE_VARS.length : 0;
    // The START cell is the only tile that begins as laid track. Everything else the level
    // names is simply PARKED where the level put it — loose, exactly as if you had dropped it
    // there yourself — and is no part of the starting pathway until the game's own chaining
    // says so. linkParkedTiles runs once the board is up (see the end of this function) and
    // pulls in whatever legally continues the track, so `init` is a set of PLACEMENTS rather
    // than an authored route: line them up and they chain themselves in the order the track
    // reaches them; scatter them and they just lie there waiting to be dragged.
    //
    // Levels written under the old rules are unaffected: their init cells already form a
    // contiguous run out of the start, so the chaining walks them in the same order and lays
    // exactly the path they used to be given outright.
    const cells = [L.start, ...L.init].slice(0, TILES_MAX);
    const tiles = cells.map((cp, idx) => ({ id:idx, c:cp[0], r:cp[1],
                                            status: idx === 0 ? "active" : "free" }));
    const path = [{ c:tiles[0].c, r:tiles[0].r, kind:"tile", tileId:tiles[0].id }];
    // starting pace, tiles/sec, declared per level. Every shipped level now starts at
    // 0.80; the old 0.80 -> 1.00 ramp across the curriculum arcs is gone. Pace still
    // climbs WITHIN a level via RAMP_PER_TILE.
    // The player's setting wins over the level's own. Since v9.6 every monster crosses a tile
    // in the time the RUNNER takes one, so slowing the game down slows the whole board with it
    // — the old warning about a slow runner making a saw level unsolvable no longer applies.
    const cps = startCps();
    const speedTier = 0, startSpeedMult = 1;
    const effSpeed = Math.max(90, Math.round(1000 / cps));
    state = {
      L, walls, tiles, path,
      speedTier, startSpeedMult, baseSpeed: L.speed,
      // Crack variation is dealt round-robin (rotated per level) rather than picked from a
      // position hash, so ANY level with 3+ stones is guaranteed to show all three sets
      // instead of leaving it to chance — the old hash gave level 18 four Var-1 stones of five.
      stones: new Map((L.stone || []).map((w, i) => [key(w[0], w[1]),
        { hp: w[2] || 1, max: w[2] || 1, hit: 0, vi: (i + stoneRot) % _STONE_VARS.length }])),
      shards: [],
      // A level may have NO exit at all, in which case there is nothing to reach and the
      // run only ends when he falls. Everything downstream checks for null rather than
      // assuming a cell, so an endless level needs no other special case.
      goal: L.goal ? { c:L.goal[0], r:L.goal[1] } : null,
      keyCollected:false,
      runIdx:0, runT:0, msPerCell:effSpeed, speedMult:1, cpsNow: 1000/effSpeed,
      cps0: 1000/effSpeed,          // what it STARTED at, so the ramp can survive a retune
      status:"play", drag:null, fall:null, runPhase:0,
      // Counts every time a tile leaves the path. "The oldest one you are not using" is the
      // tile with the lowest count, which is the one the runner cleared longest ago.
      freeSeq:0, flyTile:null,
      // Every cell he has stood on, in order — see update(). Seeded with the START, because he
      // is standing on it before he has taken a step and the replay is the whole route: without
      // it the rebuild began one tile in and the start gate was the one square it never laid.
      // Seeded HERE rather than in loadLevel so that every way into a chapter gets it.
      walked:[{ c:path[0].c, r:path[0].r }],

      score:0, combo:0, maxCombo:0, coins:0, elapsed:0, flowClears:0,
      purse:0,                     // tiles found this run, unbanked until the flag is reached
      par: L.par || 24000,
      shake:0, beatPulse:0, pops:[], lights:[], laidFlash:[], trail:[], trailT:0,
      // --- Batch 2: optional extra cell types & hazards ---
      coinCells: new Set((L.coins||[]).map(c=>key(c[0],c[1]))),
      // [c, r, id] — a talisman sits on the floor and is grabbed by passing over it
      talismans: (L.talismans||[]).filter(t => talLive(t[2]))
                                  .map(t=>({ c:t[0], r:t[1], id:t[2], got:false })),
      coinsGot: 0,
      keys: (L.keys || (L.key ? [[L.key[0], L.key[1], "#ffd24a"]] : [])).map(k=>({ c:k[0], r:k[1], color:k[2]||"#ffd24a", got:false })),
      doors: (L.doors||[]).map(d=>({ c:d[0], r:d[1], color:d[2]||"#ff6d6d", open:false, reached:false })),
      // linked switch/door groups: every switch (arcade button on a wall) in a group must be
      // tapped to slide its door open. Each group gets its own colour + wires to the door.
      gateGroups: (L.gates||[]).map((g,i)=>({
        door:{ c:g.door[0], r:g.door[1] }, doorKey: key(g.door[0], g.door[1]),
        switches: (g.switches||[]).map(s=>({ c:s[0], r:s[1], used:false })),
        openT: 0, color: GATE_COLORS[i % GATE_COLORS.length],
      })),
      boost: new Set((L.boost||[]).map(c=>key(c[0],c[1]))),
      slow:  new Set((L.slow ||[]).map(c=>key(c[0],c[1]))),
      speedFx: { kind: null, t: 0 },        // active timed speed effect from a collected pickup
      hold: 0,                              // ms the runner is held still for, by whatever did it
      // The Ankh used to have to be pressed BEFORE you fell, which meant arming it on the off
      // chance and spending it on a level you would have cleared anyway. It is a second chance,
      // so it is offered at the moment you need one: fall with an unspent Ankh and the rack
      // stays live for this long, mid-tumble, waiting for you to reach for it.
      ankhGrace: 0,
      // Her track is given outright — a list of cells, run end to end. `lover` on a level is
      // the whole feature: no tiles to lay, nothing to solve, just somebody running beside you.
      lover: (L.lover && L.lover.length > 1)
        ? { path: L.lover.map(p => ({ c:p[0], r:p[1] })), idx:0, t:0, phase:0 } : null,
      // The worn talisman's one shot at this level: armed on load, spent on the button.
      // kind is the id while the effect runs; armed survives past it for the Finger, which
      // waits for a tile to be pressed rather than running on a clock.
      // Every charm you are carrying is good for ONE use on this level. `used` is what has
      // been spent; `kind`/`t`/`ms` is the timed effect currently running, if any; `ankh` is
      // its own latch because it is not an effect at all — it sits waiting for a death that
      // may never come, and it must not be clobbered by the next charm you press.
      power: { used: new Set(), kind: null, t: 0, ms: 0, armed: false, ankh: false },
      coinFly: [],                          // coins on their way to him, pulled by the Magnet
      loop: null,                           // a circuit he is going round, once we are sure
      vortex: null,                         // ...and what happens to the world when he is
      singularity: new Set((L.singularity||[]).map(c=>key(c[0],c[1]))),
      collapsed: new Set(),
      eaten: [],                            // tiles the rift is currently swallowing
      // fixed platforms: permanent free track cast into a wall plinth (see trackConnects)
      platforms: (L.platforms||[]).map((p,i)=>({ id:i, c:p[0], r:p[1], dirs:parsePfDirs(p[2]), lit:0 })),
      platformMap: new Map(),
      hazards: (L.hazards||[]).map(h=>{ const ax = h.axis||"h", kind = h.kind||"saw";
        if (kind === "monster") {
          const CW = cell || 90;
          // A variant may be named outright; otherwise it is inferred, so the older data that
          // only carried a path still means what it always did.
          const variant = h.variant || (h.path ? "patrol" : ax === "v" ? "vrail" : "hrail");
          const K = MONSTER_KINDS[variant] || MONSTER_KINDS.patrol;
          const base = { kind, variant, faceX:1, chompT:0 };   // pace comes from monPace()
          if (K.move === "rail") {
            // Rail monsters move EXACTLY as the saws they replace: one traverse takes `speed`
            // ms whatever the rail's length, ping-ponging, with `phase` staggering the start.
            // Keeping the maths identical is what lets the tuned saw levels survive the swap.
            const ph = (((h.phase || 0) % 1) + 1) % 1, u = ph * 2;
            const raw = u <= 1 ? u : 2 - u, dir = u <= 1 ? 1 : -1;
            // Snapped to a whole tile. A thrust is one tile, so a rail that BEGINS half a tile
            // along can never land on one: every leg from that start is a fractional number of
            // tiles, and the thrusts get stretched to fit it. Starting on a tile centre is what
            // makes "one thrust, one tile" true for the first leg as well as the rest.
            const span0 = Math.max(1, Math.abs(h.hi - h.lo));
            const cell0 = Math.round(h.lo + (h.hi - h.lo) * raw);
            const t = Math.abs(cell0 - h.lo) / span0;
            const p0 = cell0;
            return { ...base, axis:ax, lo:h.lo, hi:h.hi, c:h.c, r:h.r, t, dir, pos:p0,
                     rowT:0, rowP:0, legN:null,   // the leg is laid out on the first tick
                     cc: ax==="h"?cell0:h.c, cr: ax==="h"?h.r:cell0,
                     wx: (ax==="h"?p0:h.c)*CW + CW/2, wy: (ax==="h"?h.r:p0)*CW + CW/2 };
          }
          if (K.move === "trap") {
            return { ...base, c:h.c, r:h.r, cc:h.c, cr:h.r, trapT: (h.phase||0)*TRAP_CYCLE,
                     wx:(h.c+0.5)*CW, wy:(h.r+0.5)*CW };
          }
          if (K.move === "hunt") {
            return { ...base, cc:h.c, cr:h.r, from:[h.c,h.r], to:[h.c,h.r], segT:1, pause:0,
                     rowT:0, rowP:0, headSplit:"h", headDir:1,
                     wx:(h.c+0.5)*CW, wy:(h.r+0.5)*CW };
          }
          // a path: given outright, or generated as the ring of a square
          const path = h.path ? h.path.map(p=>p.slice())
            : variant === "square"
              ? (() => { const w = (h.w||2), hh = (h.h||2), c0 = h.c, r0 = h.r;
                         return [[c0,r0],[c0+w,r0],[c0+w,r0+hh],[c0,r0+hh]]; })()
              : (ax==="h" ? [[h.lo,h.r],[h.hi,h.r]] : [[h.c,h.lo],[h.c,h.hi]]);
          // Where on its own route it sets off — the leg it begins on, and how far along that
          // leg. Every path monster used to begin at waypoint one, so two sharing a route moved
          // as one and a rail could only ever start at an end. Both are clamped, because a route
          // can be redrawn shorter than the numbers saved against it.
          const loop0 = variant === "square" ? true : !!h.loop;
          const s0 = Math.max(0, Math.min(path.length - 1, h.seg0 | 0));
          const n0 = loop0 ? (s0 + 1) % path.length
                           : Math.max(0, Math.min(path.length - 1, s0 + 1));
          const A = path[s0], B = path[n0];
          // Snapped to a whole tile along the leg, for the same reason a rail's start is: a
          // thrust is one tile, so beginning part-way through one leaves every thrust of that
          // leg landing between squares.
          const legTiles = Math.max(1, Math.abs(B[0]-A[0]) + Math.abs(B[1]-A[1]));
          const step0 = Math.max(0, Math.min(legTiles - 1,
                          Math.round(Math.max(0, Math.min(0.999, +h.segT0 || 0)) * legTiles)));
          const t0 = step0 / legTiles;
          const ax0 = A[0] + (B[0] - A[0])*t0, ay0 = A[1] + (B[1] - A[1])*t0;
          // A rail-looking walker positions itself from a STROKE CLOCK, which starts at zero and
          // would have thrown this start away on the very first tick. Seeding the clock with the
          // whole thrusts already behind it is what makes the start survive.
          return { ...base, path, loop: loop0,
                   seg:s0, segT:t0, mdir:1, pause:0,
                   rowT: step0 * effSpeed, rowP: 0,
                   wx:(ax0+0.5)*CW, wy:(ay0+0.5)*CW, cc:Math.round(ax0), cr:Math.round(ay0) };
        }
        // `phase` (0..1) is how far into the full ping-pong cycle this saw starts:
        // 0 = parked at lo heading for hi, 0.5 = at hi heading back. Without it, every saw
        // on a level starts together and a row of them sweeps as one solid line.
        const ph = (((h.phase || 0) % 1) + 1) % 1, u = ph * 2;
        const t = u <= 1 ? u : 2 - u, dir = u <= 1 ? 1 : -1;
        const p0 = h.lo + (h.hi - h.lo) * t, cell0 = Math.round(p0);
        return { axis:ax, lo:h.lo, hi:h.hi, c:h.c, r:h.r, speed:h.speed||4800, t, dir, kind,
                 cc: ax==="h"?cell0:h.c, cr: ax==="h"?h.r:cell0, pos: p0 }; }),
      // movable "sliding platform": a wall band whose crossing point the player drags into place
      sliders: (L.sliders||[]).map(sl=>({ axis:sl.axis||"h", c:sl.c!=null?sl.c:0, r:sl.r!=null?sl.r:0,
        lo:sl.lo, hi:sl.hi, pos: sl.pos0!=null?sl.pos0:sl.lo })),
      sliderDrag: null,
      // movable wall block: slides along a rail; its current cell is a wall (drag it off the mouth)
      blocks: (L.blocks||[]).map(b=>({ axis:b.axis||"h", c:b.c!=null?b.c:0, r:b.r!=null?b.r:0,
        lo:b.lo, hi:b.hi, pos: b.pos0!=null?b.pos0:b.lo })),
      blockDrag: null,
      // manual sliding door: drag BOTH panels apart to open (left/right = 0..1 each)
      manualDoors: (L.mdoors||[]).map(d=>({ c:d[0], r:d[1], left:0, right:0 })),
      mdoorDrag: null,
      flagPlantT: 0,               // 0 = flag floating over the exit, 1 = planted on the laid tile
      attempts: 1,                 // set by loadLevel for normal levels
      lastPlacedId: null,
    };
    for (const pf of state.platforms) state.platformMap.set(key(pf.c, pf.r), pf);
    // Now that the board exists, let the parked tiles chain themselves off the start the way
    // they would mid-run. This is the whole of the "starting pathway" — there isn't one in the
    // level data any more, only tiles and the rules that link them.
    markOccDirty();
    linkParkedTiles();
    if (elLevel) elLevel.textContent = label;
    updateReadyHud();
    updateScoreHud();
    updateKeyHud();
    const seed = hashSeed(label);            // the melody's seed: unsalted, so tunes never move
    state.bgTheme = genTheme(themeSeed(label));   // ...and the look, which the salt does move
    Sound.setMusic(L.music);                 // this level's music block, over the defaults
    Sound.setSong(seed);                     // per-level melody
    Sound.resetMelody();
    Sound.setTempo(effSpeed);     // backing-track tempo tracks this level's (ramped) runner speed
    computeLayout();
    snapCamera();                 // camera at the runner's start
    // if the finish flag starts off-screen, open on the flag and glide back to the start
    const startCam = { x: camX, y: camY };
    const g = state.goal;
    const gx = g ? (g.c + 0.5) * cell : 0, gy = g ? (g.r + 0.5) * cell : 0;
    const gsx = gx - startCam.x, gsy = gy - startCam.y;
    // no flag = nothing to open on, so skip the fly-in and start where he stands
    const goalOnScreen = !g || (gsx >= 0 && gsx <= viewW && gsy >= 0 && gsy <= viewH);
    // Hold on the start until any pop-ups are cleared; only THEN run the opening pan +
    // character intro, so neither plays out behind the tutorial / speed-up cards.
    state.introPlan = { goalOnScreen, startCam, gx, gy };
    // The opening, in order: the flag with the music under it, a pan back to where he starts,
    // then anything the level has to explain, then the character assembling, and only then
    // does he move — on a beat. Each step hands to the next rather than running on a timer,
    // so a pop-up can take as long as it likes without the rest playing out behind it.
    if (!goalOnScreen && g) { const fc = camForPoint(gx, gy); camX = fc.x; camY = fc.y; }
    else { camX = startCam.x; camY = startCam.y; }
    Sound.levelMusicStart();      // 0. the backing starts here, not when he does — under the
    state.status = "hold";        //    verse as well, so the level has already begun in the ear
    state.peekT = null;           //    before it begins in the eye
    // Every chapter opens with its CARD. It holds everything — the flag, the pan, the hint
    // cards, him — until it is dismissed, rather than playing over the top of the opening: the
    // whole of its effect is that there is nothing else on the screen while you read it.
    showOpening(label, L.poem, L.by, () => { state.peekT = FLAG_HOLD_MS; });  // 1. the flag, then the pan
  }
  // The chapter's title card: its number, its verse if it has one, whoever said it, and the way
  // out — arriving in that order. It opens EVERY chapter, including a retry: the number is the
  // thing that tells you where you are, and a retry is still a chapter starting.
  let _poemClose = null;                     // the card currently up, if any
  let _openedIdx = -1;                       // whose card was last shown — a repeat is a retry
  function showOpening(label, text, by, done) {
    // Whatever was up belongs to a chapter that is no longer loading. Take it down without
    // running its continuation — that chapter's opening is not going to happen now.
    if (_poemClose) _poemClose(false);
    const el = document.getElementById("poem");
    const body = String(text || "").trim();
    // Every chapter gets its card, verse or no verse — it is the chapter's title, and a game
    // that names some of its chapters and not others is a game that looks like it forgot. Two
    // exceptions. Nobody is looking yet: the boot loads chapter one behind the TITLE SCREEN,
    // and a card recited to a menu is a card spent. And a RETRY, which is the same chapter
    // opening again — you have read it, you died, and being told where you are on the way back
    // in is the game explaining the joke.
    if (!el || titleActive || cineActive || levelIdx === _openedIdx) { done(); return; }
    _openedIdx = levelIdx;
    // The attribution is its own field, and it is set apart rather than left running on because
    // it is not part of the poem. A verse written the old way — "…the line. - Who said it" —
    // still comes out right: the tail after a dash is taken as the attribution when there is no
    // field to say otherwise, so nothing has to be rewritten to keep reading properly.
    const m = by ? null : body.match(/^([\s\S]+?)\s+[-–—]\s*([^\n]{1,60})$/);
    document.getElementById("poem-n").textContent    = "Chapter " + label;
    document.getElementById("poem-text").textContent = m ? m[1].trim() : body;
    document.getElementById("poem-by").textContent   = by ? String(by).trim() : (m ? m[2].trim() : "");
    // The lines are on CSS delays, so the animations have to be restarted rather than merely
    // re-shown: without this a second chapter card would arrive fully formed.
    for (const q of el.querySelectorAll("p")) { q.style.animation = "none"; void q.offsetWidth; q.style.animation = ""; }
    paused = true;
    el.classList.add("show");
    const close = (go) => {
      el.removeEventListener("pointerdown", close);
      el.classList.remove("show");
      _poemClose = null;
      paused = false;
      if (go === false) return;              // torn down by a new level, not by a reader
      Sound.tapBig();
      done();
    };
    _poemClose = close;
    el.addEventListener("pointerdown", close);
  }
  const FLAG_HOLD_MS = 900;       // how long the flag is held before the camera pulls back
  // Counts out the hold on the flag. Runs on "hold", where update() is already inert, so the
  // board sits still and unobstructed for the duration.
  function tickHold(dt) {
    const s = state;
    if (s.peekT == null) return;
    s.peekT -= dt;
    if (s.peekT > 0) return;
    s.peekT = null;
    beginLevelPan();
  }
  // 2. pull back from the flag to where he starts
  function beginLevelPan() {
    const pl = state.introPlan; if (!pl) { afterLevelPan(); return; }
    if (!pl.goalOnScreen) {
      state.status = "campan";
      state.pan = { t: 0, hold: 0, dur: 840, from: { x: camX, y: camY }, to: pl.startCam };
    } else {
      afterLevelPan();            // the flag was already in shot; nothing to pan
    }
  }
  // 3. anything this level has to teach, now that the board has been seen
  function afterLevelPan() {
    state.introPlan = null;
    state.status = "hold"; state.peekT = null;
    maybeShowMechIntro(state.L);
    if (!mechQueue.length) startIntro();     // 4. nothing to explain → form him now
  }

  function updateReadyHud() {
    if (elReady) elReady.textContent = String(state.tiles.filter(t => t.status === "free" || t.status === "parked").length);
  }
  function updateScoreHud() { if (elScore) elScore.textContent = String(state.score); }
  // ---------- the Cloak of Light's golden dust -----------------------------
  // Shed from him while the Cloak is up and left behind to fade, so the trail is something the
  // board keeps for a moment rather than a shape stuck to his back. Kept ticking after the
  // power ends so the last of it settles instead of vanishing mid-air.
  const STAR_DUST_MS = 620;
  function tickStarDust(dt) {
    const s = state;
    if (!s.starDust) s.starDust = [];
    if (powerActive("star") && s.status === "play") {
      const ri = runnerInfo();
      // His local +x is the way he is travelling, so everything is shed along -x: dropped
      // behind him and drifting further back, which is what makes it read as a trail rather
      // than sparks coming off a firework. The old version threw them upward, so they hung
      // over him instead of falling away.
      // Both offsets are taken in HIS frame — back along the reverse of travel, up along the
      // surface normal. Using world "up" for the body offset put the dust in front of him
      // whenever he ran vertically: up-screen and behind-him are the same axis there, and the
      // taller of the two offsets won.
      const tx = ri.tx, ty = ri.ty, nx = ri.nx, ny = ri.ny;
      for (let k = 0; k < 3; k++) {
        const back  = cell * (0.10 + Math.random()*0.26);        // how far behind it starts
        const up    = cell * (0.06 + Math.random()*0.34);        // up his body, not off it
        const drift = cell * (0.00030 + Math.random()*0.00032);  // it keeps falling further back
        s.starDust.push({
          x: ri.sx - tx*back + nx*up + (Math.random()*2 - 1) * cell*0.05,
          y: ri.sy - ty*back + ny*up + (Math.random()*2 - 1) * cell*0.05,
          vx: -tx*drift + (Math.random()*2 - 1) * cell*0.00010,
          vy: -ty*drift + (Math.random()*2 - 1) * cell*0.00010,
          sz: cell*(0.03 + Math.random()*0.045),
          life: 0, max: STAR_DUST_MS * (0.6 + Math.random()*0.8),
        });
      }
    }
    if (!s.starDust.length) return;
    for (const d of s.starDust) { d.life += dt; d.x += d.vx*dt; d.y += d.vy*dt; }
    s.starDust = s.starDust.filter(d => d.life < d.max);
  }
  function drawStarDust() {
    const s = state;
    if (!s.starDust || !s.starDust.length) return;
    ctx.save();
    for (const d of s.starDust) {
      const u = d.life / d.max;
      ctx.globalAlpha = (1 - u) * 0.9;
      ctx.fillStyle = u < 0.45 ? "#fff6d0" : "#ffd24a";   // white-hot, cooling to gold
      const r = d.sz * (1 - u*0.55);
      ctx.fillRect(d.x - r/2, d.y - r/2, r, r);
    }
    ctx.restore();
  }

  // spawn an expanding ring "pop" at a cell centre (tile placed, coin, etc.)
  function spawnPop(c, r, color) {
    state.pops.push({ x:(c+0.5)*cell, y:(r+0.5)*cell, life:0, max:340, color: color || getVar("--free") });
  }
  // a burst of light that pulses out from a cell (tile cleared). `scale` shrinks the whole
  // thing, for the smaller bursts that mark a change of state rather than an event.
  function spawnLight(c, r, scale, ms) {
    state.lights.push({ x:(c+0.5)*cell, y:(r+0.5)*cell, life:0, max: ms || 520, k: scale || 1 });
  }
  // The tile that has just BECOME track. A ring pulsing outward was the wrong shape for this:
  // nothing travels anywhere, one square changed into another square. So the flash IS the tile
  // — its own footprint, its own corner radius — laid over the graphic and fading off it.
  const LAID_FLASH_MS = 260;
  function spawnLaidFlash(c, r) {
    state.laidFlash.push({ c, r, life:0, max: LAID_FLASH_MS });
  }
  function drawLaidFlash() {
    const F = state.laidFlash;
    if (!F || !F.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";     // brighten the tile, do not paint over it
    for (const f of F) {
      const k = f.life / f.max, fade = (1 - k) * (1 - k);
      ctx.globalAlpha = 0.85 * fade;
      ctx.fillStyle = "#fff7d6";
      rrect(cx(f.c), cy(f.r), cell, cell, tileR(cell));
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- Level-start intro (pixels assemble into the character) ------
  const INTRO_CONVERGE = 950, INTRO_FLASH = 2000;
  function startIntro() {
    const s = state; s.status = "intro"; s.introT = 0; s.introSnd = { gather:false, flash:false };
    const rp = visualAt(0);                        // where the character forms (start tile)
    s.introTarget = { x: rp.x, y: rp.y };
    s.introParticles = [];
    // Held as polar starts plus a landing offset inside his silhouette, both unitless, so the
    // cloud converges on the middle of his BODY and settles across his whole shape rather
    // than collapsing to a point at his feet. Bounds come from RUNNER, so a retune carries.
    const N = 90;
    for (let i = 0; i < N; i++) {
      const inBody = Math.random() < 0.72;         // most of him is body; the rest is legs
      s.introParticles.push({
        ang: Math.random()*Math.PI*2, dist: 0.55 + Math.random()*0.6,
        ex: (Math.random()*2 - 1) * RUNNER.bodyW * (inBody ? 0.5 : 0.35),
        ey: inBody ? -(RUNNER.legLen + RUNNER.bodyH*Math.random())
                   : -RUNNER.legLen * Math.random(),
        sz: cell*(0.05 + Math.random()*0.07),
        col: Math.random() < 0.7 ? getVar("--runner") : "#ffffff",
      });
    }
  }
  function tickIntro(dt) {
    const s = state;
    if (!s.introSnd.gather) { s.introSnd.gather = true; Sound.introGather(); }  // plays once the intro runs (audio unlocked)
    const before = s.introT; s.introT += dt;
    if (before < INTRO_CONVERGE && s.introT >= INTRO_CONVERGE && !s.introSnd.flash) { s.introSnd.flash = true; Sound.introFlash(); }
    if (s.introT >= INTRO_CONVERGE + INTRO_FLASH && s.status === "intro") {
      s.introParticles = null;
      // He is assembled but not moving yet: wait out the rest of the current beat so his first
      // stride lands with the backing rather than a fraction of a beat off it.
      s.status = "cue"; s.cueT = Sound.cueDelay ? Sound.cueDelay() : 0;
    }
  }
  function tickCue(dt) {
    const s = state;
    s.cueT -= dt;
    if (s.cueT > 0) return;
    Sound.levelMusicHandover();   // from here his tile clears ARE the beat
    s.status = "play";
  }
  function drawIntro(ts) {
    const s = state, t = s.introT, tgt = s.introTarget;
    if (t < INTRO_CONVERGE) {                       // pixels stream in from all around
      const u = t / INTRO_CONVERGE, e = 1 - Math.pow(1-u, 3);   // ease-out
      const reach = Math.max(viewW, viewH);

    const mons = (L.hazards || []).filter(h => h.kind === "monster");
    const allHunt = mons.length > 0 && mons.every(h => h.variant === "hunter" || h.variant === "wander");

  // draw a small representative icon for a mechanic on a 2d context of size S

  // quietly goes stale. ctx and cell are module-wide, so the swap is guarded — a throw
  // mid-icon must never leave the board rendering into a 90px canvas.
  function withCanvas(g, cellPx, ox, oy, fn) {

    finally { ctx = oldCtx; cell = oldCell; }

  // dozen hand-drawn likenesses, and the likenesses had already drifted — the monster card

  // learned to split in half. Nothing is drawn twice here now, so an icon cannot go stale.
  function drawMechIcon(g, type, S) {

    // for the card's, and swallows a throw: a broken icon must never take the pop-up with it.

    const real = (fn, cp, ox, oy) => {
      const c = cp || CP;

    };

      // board draws one. The recycling arrow that used to loop round it was explaining the
      // mechanic twice — the card says it in words underneath, and the dots already say

  // ---------- Layout + camera --------------------------------------------
  function computeLayout() {
    const wrap = document.getElementById("board-wrap");
    viewW = Math.floor(wrap.clientWidth);
    viewH = Math.floor(wrap.clientHeight);
    cell = Math.round(clamp(Math.min(viewW / VIEW_COLS, viewH / VIEW_ROWS), MIN_CELL, MAX_CELL) * 0.9);
    worldW = cell * COLS; worldH = cell * ROWS;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = viewW * dpr; canvas.height = viewH * dpr;
    canvas.style.width = viewW + "px"; canvas.style.height = viewH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wallLayerDirty = true;                      // cell/world size changed — rebuild wall + grain caches
    _uiGrid = 0;                                // ...and re-read the grid, in case the CSS moved
    grainScreen = null;
    syncHudChrome();                            // the pause button follows the speedo's plate
  }

  const nodeCenter = n => ({ x:(n.c + 0.5) * cell, y:(n.r + 0.5) * cell });
  function pathPos(param) {
    const p = state.path, len = p.length;
    const f = clamp(param, 0, len - 1), i = Math.floor(f);
    if (i >= len - 1) return nodeCenter(p[len - 1]);
    const fr = f - i, a = nodeCenter(p[i]), b = nodeCenter(p[i + 1]);
    return { x:a.x + (b.x - a.x) * fr, y:a.y + (b.y - a.y) * fr };
  }
  // A leaping swagger does not travel at a constant rate: it stands still on the ground and
  // then covers a whole gap in one jump. Given the true path parameter it returns where he
  // should APPEAR and how far off the ground he is, 0..1. The true parameter is untouched, so
  // the pace, the saws, the coins and the camera all carry on as if he were sliding — only the
  // drawing stutters, which is the whole trick: he arrives at each tile exactly when he always
  // did, having spent the journey standing still and then leaping.
  function leapAt(w, param) {
    const step = 1 / w.leap;                         // grounded every 1/leap of a tile
    const idx = Math.floor(param / step);            // which leap this is — its parity is which
    const anchor = idx * step;                       // foot leads, for a style that alternates
    const foot = (idx & 1) ? -1 : 1;
    const u = (param - anchor) / step;               // 0..1 through this leap
    const hold = w.leapHold == null ? 0.40 : w.leapHold;
    // `pose` is what the legs do: negative folds them under him, positive stretches them out.
    if (u < hold) {
      const g = u / hold;                            // 0 the instant he lands, 1 as he leaves
      // The impact is a hard squash — it SHOULD arrive as a snap, since that is what landing
      // is — and it recovers over the first half of the stand. The rest of the stand is the
      // wind-up: he sinks again, on purpose this time, loading for the next jump.
      return { param: anchor, lift: 0, foot, air: 0,
               pose: g < 0.55 ? -(1 - g/0.55) : -0.75 * (g - 0.55)/0.45 };
    }
    const f = (u - hold) / (1 - hold);               // 0..1 through the air
    // Linear across the gap, because a jump has no horizontal brakes; the arc is all vertical.
    // The legs stretch in proportion to the arc, so they are longest at the apex and back to
    // their standing length exactly as he takes off and again as he touches down.
    const a = Math.sin(Math.PI * f);

  }

  // it is here rather than inside runnerInfo because the board is not the only place a runner
  // runs: the title screen and the cinematic walk their own polylines, and a style that only
  // worked on the board would be a style you buy and then cannot see on the menu you bought it
  // from. Callers that are not the board clear the flags with resetLeap() when they are done.
  function applyLeap(tiles, moving) {
    const w = lookItem("swagger");
    if (!(w && w.leap > 0 && moving !== false)) { resetLeap(); return tiles; }
    const L = leapAt(w, tiles);
    _leapLift = L.lift; _leapPose = L.pose; _leapFoot = L.foot; _leapAir = L.air;
    return L.param;
  }

  function runnerInfo() {
    const param = applyLeap(state.runIdx + state.runT, state.status === "play");
    const lift = _leapLift, pose = _leapPose, foot = _leapFoot, air = _leapAir;
    const pos = visualAt(param);                     // follows the curved surface
    const a = visualAt(param - 0.08), b = visualAt(param + 0.08);

  // ---- visual path: node-to-node motion with corner tiles rounded ---------
  const axisDir = (from, to) => ({ x: Math.sign(to.c - from.c), y: Math.sign(to.r - from.r) });

  // ---- fixed platforms ---------------------------------------------------
  // A platform is a WALL cell with a piece of track cast into it. You can't drop a
  // tile on it and you can't move it, but the runner rides across it for free and it
  // never wears out — so it extends your reach without spending from the 3-tile pool.
  // Its two connectors are fixed: `"ns"` is a straight, `"ne"` an elbow. The runner
  // may only enter/leave through a drawn end, which is what makes them a puzzle.
  const PF_OPP = { n:"s", s:"n", e:"w", w:"e" };
  const PF_VEC = { n:{x:0,y:-1}, s:{x:0,y:1}, e:{x:1,y:0}, w:{x:-1,y:0} };
  function parsePfDirs(spec) {
    const out = [];
    for (const ch of String(spec || "ns").toLowerCase())
      if (PF_OPP[ch] && out.indexOf(ch) < 0) out.push(ch);
    return out.length >= 2 ? out.slice(0, 2) : ["n", "s"];   // exactly two connectors
  }

  function stepDir(a, b) {

    if (Math.abs(dc) + Math.abs(dr) !== 1) return null;
    return dc === 1 ? "e" : dc === -1 ? "w" : dr === 1 ? "s" : "n";
  }

  function trackConnects(a, b) {
    const d = stepDir(a, b);
    if (!d) return false;
    const pa = pfAt(a.c, a.r), pb = pfAt(b.c, b.r);
    if (pa && pa.dirs.indexOf(d) < 0) return false;              // leaving a: must be a drawn end
    if (pb && pb.dirs.indexOf(PF_OPP[d]) < 0) return false;      // entering b: same

    return true;

  // the top-surface points of one tile: straight (3 pts) or a quarter-circle arc
  function tileSurface(n, prev, next) {
    const C = nodeCenter(n), h = cell/2;
    let entry = prev ? axisDir(n, prev) : null;   // toward prev
    let exit  = next ? axisDir(n, next) : null;    // toward next
    if (!entry && !exit) { entry = { x:-1, y:0 }; exit = { x:1, y:0 }; }
    else if (!entry)     { entry = { x:-exit.x, y:-exit.y }; }
    else if (!exit)      { exit  = { x:-entry.x, y:-entry.y }; }
    const Me = { x:C.x + entry.x*h, y:C.y + entry.y*h };
    const Mx = { x:C.x + exit.x*h,  y:C.y + exit.y*h };
    if (entry.x === -exit.x && entry.y === -exit.y) return [Me, { x:C.x, y:C.y }, Mx];  // straight
    // corner: quarter circle centred on the shared cell corner, radius h
    const O = { x:C.x + (entry.x+exit.x)*h, y:C.y + (entry.y+exit.y)*h };
    let a0 = Math.atan2(Me.y-O.y, Me.x-O.x), a1 = Math.atan2(Mx.y-O.y, Mx.x-O.x);

  function samplePolyline(pts, u) {
    if (pts.length === 1) return pts[0];
    let total = 0; const seg = [];
    for (let k = 0; k < pts.length-1; k++) { const d = Math.hypot(pts[k+1].x-pts[k].x, pts[k+1].y-pts[k].y); seg.push(d); total += d; }
    let target = clamp(u,0,1) * total;
    for (let k = 0; k < seg.length; k++) {
      if (target <= seg[k] || k === seg.length-1) { const t = seg[k] ? target/seg[k] : 0;
        return { x:pts[k].x + (pts[k+1].x-pts[k].x)*t, y:pts[k].y + (pts[k+1].y-pts[k].y)*t }; }
      target -= seg[k];

  const surfaceAtTile = (i, u) => samplePolyline(tileSurface(state.path[i], state.path[i-1], state.path[i+1]), u);
  // position along the whole route at fractional node index `param`
  function visualAt(param) {
    const len = state.path.length;
    const f = clamp(param, 0, len-0.5);              // allow the leading tile to run out to its far edge
    let i = clamp(Math.round(f), 0, len-1);
    return surfaceAtTile(i, (f - i) + 0.5);          // each tile spans param [i-0.5, i+0.5]
  }

  // Vertical camera: centre the followed point, then let it run a little past each edge so
  // the board isn't welded to the frame. The top edge gets CAM_TOP_PAD instead, which is what
  // keeps the first row clear of the speed plate and the pause button.
  const camPad = () => cell * CAM_EDGE_PAD;
  const camTopPad = () => cell * CAM_TOP_PAD;
  const camBotPad = () => cell * CAM_BOTTOM_PAD;
  // The test for "does the whole level fit" INCLUDES the pads. It used to be a bare
  // `worldH <= viewH`, which reads as fitting but isn't: a level one cell shorter than the
