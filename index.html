        ctx.lineTo(cs[first].x, cs[first].y);
        ctx.lineTo(cs[(k0+2)%4].x, cs[(k0+2)%4].y);
        ctx.lineTo(cs[first === n1 ? n3 : n1].x, cs[first === n1 ? n3 : n1].y);
      }
    }
    ctx.closePath();
  }
  // The slab under the rail is drawn as two layers rather than one flat colour, which is
  // what gives the track a cross-section: a BEAM in the track's own colour hugging the
  // running surface, and the GROUND beneath it in a darker shade of the same hue.
  //
  // The beam is a fat stroke laid along the surface line and clipped to the body, so only
  // its lower half survives — that keeps it hugging every curve of a corner for free,
  // rather than needing a second offset polyline that could drift from the rail.
  // The track is painted; the ground it is bolted to is not. It takes its own colour —
  // the level's hue turned and drained, so it still belongs to the palette without being a
  // darker copy of the beam — and its own marking: flat bedding lines, which read as cut
  // earth rather than as more track. The paper grain then goes over both, as before.
  function groundColour(fill) { return tintHex(fill, TILE.underHue, TILE.underSat, TILE.underShade); }
  // ---- ground patterns ---------------------------------------------------------------
  // Bedding by default; a skin that brings a pattern gets that instead.
  function drawGround(x, y, s, c, r) {
    ctx.save(); drawGroundQuilt(x, y, s, c || 0, r || 0); ctx.restore();
  }
  // The ground is PIECED rather than bedded: a grid of squares a quarter of a cell across,
  // each one a step lighter or darker than the ground's own colour. It reads as something laid
  // rather than something cut, and it is the same measure as everything else in the game — four
  // to a tile across, so a square of ground is a quarter of a square of track.
  //
  // Keyed off the WORLD sub-cell, not the screen and not the tile: the grid runs on across a
  // join instead of restarting inside every cell, and it does not slide when the camera moves.
  // `strataN` is how many to a side and `strata` is how far their shades run apart; both come
  // off the TILE block so the lab still tunes them.
  // How a design lays its colours out over the earth's grid.
  //   check    the two-colour board — colour by (column + row), so it alternates both ways
  //   scatter  one of the set at random per square, fixed per place in the world
  //   bands    by COLUMN, so a long set runs across the ground as a spectrum
  const EARTH_LAYOUT = {
    check:   (cols, gi, gj) => cols[(gi + gj) & 1],
    scatter: (cols, gi, gj) => cols[bgHash(gi, gj) % cols.length],
    bands:   (cols, gi, gj) => cols[((gi % cols.length) + cols.length) % cols.length],
    // GINGHAM is not a check. A check alternates two colours; gingham is two sets of BANDS
    // laid across each other, and the three tones come out of how they overlap — colour over
    // colour is the full colour, colour over cloth is a half tone, cloth over cloth is bare
    // cloth. So it wants three: [full, half, bare]. Bitwise parity, which is right for
    // negative columns too — the board runs left of the origin as well as right of it.
    gingham: (cols, gi, gj) => {
      const a = !(gi & 1), b = !(gj & 1);

    },
  };
  function drawGroundQuilt(x, y, s, c, r) {
    const N = Math.max(1, Math.round(TILE.strataN)), it = lookItem("track");
    const cols = it.earth || TRACK_DEFAULT.earth;
    const lay = EARTH_LAYOUT[it.earthMode || "check"] || EARTH_LAYOUT.check;
    const q = s/N;
    ctx.globalAlpha = Math.max(0, Math.min(1, TILE.strata));   // how far the piecing shows
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      ctx.fillStyle = lay(cols, c*N + i, r*N + j);

    }

  }
  function drawPlatformBody(n, S, fill) {
    ctx.save();
    rrect(cx(n.c), cy(n.r), cell, cell, tileR(cell)); ctx.clip();
    ctx.beginPath(); bodyPath(S, nodeCenter(n)); ctx.clip();   // everything below stays in the slab
    ctx.fillStyle = groundColour(fill);                        // the ground, in its own colour
    ctx.fillRect(cx(n.c), cy(n.r), cell, cell);

    // The beam's shadow first, as a WIDER stroke on the same line: the beam is then laid
    // over the top of it, and what is left showing below is exactly shadowW deep. Drawing
    // it this way means the shadow follows a corner's curve as precisely as the beam does.
    if (TILE.pathW > 0 && TILE.shadowW > 0) {
      ctx.strokeStyle = tintHex(fill, TILE.underHue, TILE.underSat, TILE.underShade + TILE.shadowShade);
      ctx.lineWidth = Math.max(1, cell*(TILE.pathW + TILE.shadowW)*2);

      ctx.beginPath(); railPath(S); ctx.stroke();

    ctx.restore();
  }
  // The beam and its shadow hang off the surface as BANDS here rather than fat strokes
  // clipped to the body. On a junction the three options' bodies overlap — a turn's body is
  // most of the cell — so a stroke clipped to their union leaks out above its own surface.
  // A band is exact, and all three go into one path so the overlaps don't build up.
  function surfaceBand(S, C, d) {
    const h = cell/2, last = S.length - 1, mid = last >> 1;
    const a = S[Math.max(0, mid-1)], b = S[Math.min(last, mid+1)];
    let tx = b.x - a.x, ty = b.y - a.y; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const bx = -ty, by = tx;                             // the side the body hangs on
    let off;
    if (last === 2) {                                    // straight: parallel offset
      off = S.map(P => ({ x:P.x + bx*d, y:P.y + by*d }));
    } else {                                             // corner: a concentric arc
      const O = { x:S[0].x + S[last].x - C.x, y:S[0].y + S[last].y - C.y };
      const M = S[mid], inside = (O.x - M.x)*bx + (O.y - M.y)*by > 0;
      const r = inside ? h - d : h + d;
      off = S.map(P => { const ux = P.x-O.x, uy = P.y-O.y, L = Math.hypot(ux, uy) || 1;
        return { x:O.x + ux/L*r, y:O.y + uy/L*r }; });

    const loop = S.concat(off.slice().reverse());
    let area = 0;                                        // same winding every time, or the
    for (let k = 0; k < loop.length; k++) {              // overlaps cancel under nonzero fill
      const p = loop[k], q = loop[(k+1) % loop.length]; area += p.x*q.y - q.x*p.y;
    }
    if (area < 0) loop.reverse();
    ctx.moveTo(loop[0].x, loop[0].y);
    for (let k = 1; k < loop.length; k++) ctx.lineTo(loop[k].x, loop[k].y);

  }
  function drawPlatformRail(n, S) {
    ctx.save();
    rrect(cx(n.c), cy(n.r), cell, cell, tileR(cell)); ctx.clip();
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.strokeStyle = RAIL_COL; ctx.lineWidth = RAIL_PX;
    ctx.beginPath(); railPath(S); if (SHOW_RAIL) ctx.stroke();
    ctx.restore();
  }
  function drawPlatformSurface(n, S, fill) {
    drawPlatformBody(n, S, fill);
    surfaceEdge(cx(n.c), cy(n.r), S, nodeCenter(n));
    drawPlatformRail(n, S);
  }
  // The lip along the running surface. surfaceBand already knows how to hang a band off one —
  // a parallel offset for a straight run, a CONCENTRIC arc for a corner — so stacking a few at
  // decreasing depth gives a falloff that contours the edge whatever direction it takes. A
  // point at depth x lies inside every band deeper than x, so the alpha it collects is
  // proportional to (1 - x/depth): a straight ramp from the surface down, on a curve as
  // readily as on a straight, which is the thing a canvas gradient cannot do.
  const EDGE_STEPS = 7;
  function surfaceEdge(X, Y, S, C) {
    const d = cell * TILE.edgeDepth, a = TILE.edgeA;
    if (!(d > 0) || !(a > 0)) return;
    const v = Math.round(255 * Math.max(0, Math.min(1, TILE.edgeInk)));
    ctx.save();
    rrect(X, Y, cell, cell, tileR(cell)); ctx.clip();
    ctx.fillStyle = "rgba(" + v + "," + v + "," + v + "," + (a / EDGE_STEPS).toFixed(4) + ")";
    for (let k = 0; k < EDGE_STEPS; k++) {

    }
    // ...and a second ramp inside the first, over a much shallower depth: the same falloff run
    // again in the top slice of the lip, so the very edge collects both and comes out far
    // whiter than a single ramp of any strength would leave it. A stop rather than a brighter
    // lip — the body of the contour keeps the weight it had, only the rim is lifted.
    const td = d * TILE.edgeTip, ta = TILE.edgeTipA;

      ctx.fillStyle = "rgba(" + v + "," + v + "," + v + "," + (ta / EDGE_STEPS).toFixed(4) + ")";
      for (let k = 0; k < EDGE_STEPS; k++) {

      }
    }
    if (TILE.edgeGrain > 0) {                    // ...and a tooth to it, cut to the same band
      ctx.beginPath(); surfaceBand(S, C, d); ctx.clip();

    ctx.moveTo(S[0].x, S[0].y);
    for (let k = 1; k < S.length; k++) ctx.lineTo(S[k].x, S[k].y);
  }

  // Tuning for the leading tile's 3-way junction. Edit these in junction-lab.html and paste
  // the block back — never hand-patch one copy.
  //
  // The three options are filled in ONE path and stroked in ONE stroke, which is what keeps
  // the tile at a single flat opacity: they genuinely overlap each other near the centre, so
  // any second fill at a second alpha builds up in the overlap and the tile goes blotchy.
  // That is why there is one body alpha and one rail alpha rather than separate entry and
  // exit values — see git history if the split is ever wanted back.
  const JUNCTION = {
    left:    1.00,   // the turn one way   — the three routes are STACKED, not unioned, so where
    ahead:   0.40,   // straight on          two of them agree the alpha builds and where all
    right:   0.20,   // the turn the other   three do it builds again. Tune in junction-lab.html.
    mark:    0.25,   // the white ring marking each cell you may build into, its opacity
    grain:   0.40,   // paper grain over the whole tile
  };                 // rail thickness is TILE.railW — the junction IS track, so it matches it
  // How far the hint rings have opened out. They sit at a half tile while he is running and
  // grow to fill the cell the moment a tile leaves the rack, so picking one up makes every
  // place it could go bloom rather than just sitting there. Eased so it reads as the board
  // reacting to the pickup, not as two different drawings swapped over.
  let markGrow = 0;
  // ...and how much of the hint's own opacity it is allowed, 0 when you have no tile to send.
  let markLive = 1;
  const MARK_EMPTY = 0.10;                 // what a hint fades to with nothing in hand
  const jScratch = document.createElement("canvas");   // reused every frame
  // ...and a second, for the junction's three-way mask. The options are stacked into it rather
  // than unioned, so the shared trunk builds up and the arms only one route reaches stay faint.
  const jMask = document.createElement("canvas");
  // the leading tile renders as a 3-way junction: three real platform pieces
  // oriented to the travel direction — a flat run forward, plus a curve each way
  // (up / down relative to travel) — signalling the path isn't set yet.
  // The cells the leading tile can actually grow into: the three ways out of it, less any that
  // are off-grid, already occupied, or would double the runner back. The junction draws a
  // marker in each of them and a TAP on one sends a tile there, so the two have to agree
  // exactly — one list, computed once, rather than the same filter written twice.
  function junctionExits(n, prev) {
    const din = prev ? axisDir(prev, n) : { x:0, y:-1 };
    const dirs = [{ x:-din.y, y:din.x }, din, { x:din.y, y:-din.x }];   // left, ahead, right
    const occ = occupiedFor(null);
    const out = [];
    for (const d of dirs) {
      const c = n.c + d.x, r = n.r + d.y;
      if (inBounds(c, r) && !occ.has(key(c, r)) && !foldsBack(c, r)) out.push({ c, r, d });

  // A node standing on the exit. The front tile stops being a junction the moment it lands
  // there — there is nowhere further to build — so both the drawing and the tap ask this.
  const onGoal = (n) => !!state.goal && n.c === state.goal.c && n.r === state.goal.r;
  // The tile at the front of the track, if it is a live junction — the one thing both the
  // marker and the tap need to find, and neither should go looking for on its own.
  function leadNode() {
    const p = state.path;
    if (!p || !p.length) return null;
    const n = p[p.length - 1];
    return (n && !onGoal(n)) ? { n, prev: p[p.length - 2] } : null;
  }
  function drawJunction(n, prev, ts) {
    const din = prev ? axisDir(prev, n) : { x:0, y:-1 };   // travel direction into the tile
    const left  = { x:-din.y, y:din.x };
    const right = { x: din.y, y:-din.x };
    // Laid down as they read across the tile — the turn one way, straight on, the turn the
    // other — rather than forward-first. They are stacked at a third each and all three carry
    // the same ground, so the ORDER cannot change what comes out; it is written this way so
    // that giving any one of them a weight of its own later is an edit to the list and nothing
    // else.
    const exits = [left, din, right];

    const surfaces = exits.map(d => tileSurface(n, prev, { c:n.c + d.x, r:n.r + d.y }));
    const C = nodeCenter(n), h = cell*0.5;

    const track = curTrack();
    // Ground, beam and rail are rendered together at FULL opacity off-screen, and only the
    // finished tile is faded — one gradient, applied once, to the whole thing. Give any layer
    // an alpha of its own and it blends with whatever is behind the tile instead of with the
    // tile, and every overlap reads as a smudge.
    const X = cx(n.c), Y = cy(n.r);
    const DX = Math.floor(X*dpr) - 1, DY = Math.floor(Y*dpr) - 1;   // device-pixel aligned, so
    const px = Math.ceil(cell*dpr) + 3;                             // the blit back is 1:1
    if (jScratch.width !== px) { jScratch.width = jScratch.height = px; }
    const g = jScratch.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, px, px);
    g.setTransform(dpr, 0, 0, dpr, -DX, -DY);                       // same world coords as the board
    const main = ctx; ctx = g;
    try {
      ctx.save();
      rrect(X, Y, cell, cell, tileR(cell)); ctx.clip();
      // Each route is a complete tile of its own — ground, worn skin, the beam's shadow, the
      // beam, grain and the lip along its own top edge — rendered next door, cut to its own
      // shape, and only then laid down at its weight. Drawing all three into ONE layer and
      // masking the result at the end was wrong: the lips are drawn at full strength, so
      // wherever two routes ran together their contours added up and the junction came out
      // brighter than any single route ever is.
      //
      // Order is faintest to strongest — right, straight, left — so the route the tile is most
      // sure of is the one on top, and a weaker route never draws over it.
      if (jMask.width !== px) { jMask.width = jMask.height = px; }
      const mg = jMask.getContext("2d");
      const mix = [JUNCTION.left, JUNCTION.ahead, JUNCTION.right];   // same order as `exits`
      for (const i of [2, 1, 0]) {
        const w = Math.max(0, Math.min(1, mix[i]));

        mg.setTransform(1, 0, 0, 1, 0, 0); mg.clearRect(0, 0, px, px);
        mg.setTransform(dpr, 0, 0, dpr, -DX, -DY);       // the board's own world coordinates, so
        const was = ctx; ctx = mg;                       // a skin keyed off world x/y lines up
        ctx.fillStyle = groundColour(track);
        ctx.fillRect(X, Y, cell, cell);                               // the ground...
        drawGround(X, Y, cell, n.c, n.r);                             // ...and the worn skin on it
        if (TILE.pathW > 0 && TILE.shadowW > 0) {
          ctx.fillStyle = tintHex(track, TILE.underHue, TILE.underSat, TILE.underShade + TILE.shadowShade);
