      // used to hand the compositor all of it, every frame, to show a phone screen's worth.
      // The padding covers the screen shake, which moves the visible window a few px.
      const pad = 8 + (state.shake || 0);
      const vx0 = Math.max(0, Math.floor(camX - pad)), vy0 = Math.max(0, Math.floor(camY - pad));
      const vx1 = Math.min(worldW, Math.ceil(camX + viewW + pad));
      const vy1 = Math.min(worldH, Math.ceil(camY + viewH + pad));
      if (vx1 > vx0 && vy1 > vy0)
        ctx.drawImage(wallLayer, vx0*dpr, vy0*dpr, (vx1-vx0)*dpr, (vy1-vy0)*dpr,
                      vx0, vy0, vx1-vx0, vy1-vy0);
    }
    drawWallEyes(ts);                             // ...and the eyes, which cannot be baked in
    for (const [sk, st] of state.stones) {
      const [c, r] = sk.split(",").map(Number);
      drawStone(c, r, ts, st);
    }
    drawPlatforms(ts);

    drawBarriers(ts);
    drawSliders(ts);
    drawBlocks(ts);
    drawManualDoors(ts);
    drawHazardPaths(ts);      // ground markings — under the track and the tiles standing on it
    drawTrack(ts);
    if (state.drag) drawTargets(ts);
    for (const t of state.tiles)
      if ((t.status === "free" || t.status === "parked") && (!state.drag || state.drag.tile.id !== t.id)) {
        // A tile parked over a rift shivers: the floor under it is already trying to take it,
        // and it is the only warning the player gets that this one is not coming back. Same
        // two-sine shake the eye uses, at a third the throw, so the pair read as one thing
        // pulling and the other resisting rather than as two separate animations.
        const doomed = state.singularity && state.singularity.has(key(t.c, t.r)) &&
                       !state.collapsed.has(key(t.c, t.r));
        let jx = 0, jy = 0;
        if (doomed) { const tr = cell * RIFT.tremble * 0.34;
          jx = (Math.sin(ts/47) + Math.sin(ts/31.3)*0.6) * tr;
          jy = (Math.cos(ts/41) + Math.cos(ts/27.7)*0.6) * tr; }
        drawFreeTile(cx(t.c) + jx, cy(t.r) + jy, ts, false);
      }
    drawLaidFlash();                              // over the tile it belongs to, nothing else

    drawPickups(ts);
    drawShards();
    drawPops();
    drawLights();
    drawTrail();                                  // worn light trail, under the runner
    drawStarDust();                               // ...and the Cloak's dust, behind him too
    drawLover(ts);                                // she runs her own track, beside his
    if (state.status === "intro") drawIntro(ts);
    else if (state.status === "campan" || state.status === "hold") { /* not formed yet */ }
    else drawRunner(ts);                          // "cue" included: standing, about to go
    drawHazards(ts);
    // Coins last of everything on the board. They hover off the surface, so a saw or a
    // block passing over one used to swallow it and the player would never know it was there.
    for (const ck of state.coinCells) { const [c,r] = ck.split(",").map(Number); drawCoin((c+0.5)*cell, (r+0.5)*cell, ts); }
    drawMagnetField(ts);
    for (const f of state.coinFly) {                 // reeled in: coin -> runner, over COIN_FLY_MS
      const rp = visualAt(state.runIdx + state.runT);
      const u = Math.min(1, f.t / COIN_FLY_MS), e = u*u*(3 - 2*u);   // ease so it accelerates in
      drawCoin((f.c+0.5)*cell + ((rp.x) - (f.c+0.5)*cell)*e,
               (f.r+0.5)*cell + ((rp.y - cell*0.3) - (f.r+0.5)*cell)*e, ts);
    }

    drawTally();                                  // ...and the count, over the cell it came from

    if (state.drag) {
      const d = state.drag;
      drawFreeTile(d.sx + camX - d.grabDX, d.sy + camY - d.grabDY, ts, true);
    }
    ctx.restore();

    // off-screen indicators (screen space): key (until collected) + exit
    if (state.status === "play" || state.status === "falling") {
      if (!state.keyCollected)
        for (const k of state.keys) if (!k.got)
          drawOffscreenArrow((k.c+0.5)*cell, (k.r+0.5)*cell, k.color, "key");
      if (state.goal)
        drawOffscreenArrow((state.goal.c+0.5)*cell, (state.goal.r+0.5)*cell, "#ffffff", "flag");   // white flag
    }
    drawSpeedHud();
    drawCeremony(ts);                   // over the board and under nothing: it IS the screen
    drawTalismanFlash(16, ts);
    drawVortex(ts);                     // ...and the whirlpool, over the top of everything
  }

  // The Mushroom's visuals. Rather than warping every drawing routine, the finished frame is
  // copied off and repainted as a stack of horizontal strips, each slid sideways on a
  // travelling sine — the old scanline-warp trick. It costs one full-canvas copy and a
  // strip's worth of blits, and only while the power is up. The whole frame goes through it,

  // The speedo's plate size, and the margin it sits at. The pause button is DOM and the speedo
  // is canvas, so nothing makes them agree by themselves — this is the number both take, one
  // through CSS variables and one directly, so they cannot drift apart at any viewport.
  function hudPlate() {
    const m  = Math.round(Math.min(viewW, viewH) * 0.028);
    const fs = Math.max(15, Math.round(Math.min(viewW, viewH) * 0.045));
    return { m, fs, h: Math.round(fs*1.5) };
  }
  function syncHudChrome() {
    const P = hudPlate(), root = document.documentElement.style;
    root.setProperty("--hud-h", P.h + "px");
    root.setProperty("--hud-m", P.m + "px");
  }
  // live runner speed, top-left (screen space). Shown as cells/second on a dark pill.
  function drawSpeedHud() {
    const s = state;
    if (!s || (s.status !== "play" && s.status !== "falling" && s.status !== "vortex")) return;
    const factor = s.liveFactor != null ? s.liveFactor : 1;
    const cps = 1000 * factor / (s.msPerCell || 1000);      // cells per second
    const P = hudPlate(), m = P.m, fs = P.fs;
    ctx.save();
    ctx.textBaseline = "middle";
    const label = "SPEED", val = cps.toFixed(3), unit = " tiles/s";   // three decimals — the per-tile ramp is small
    const smallF = "700 " + Math.round(fs*0.52) + "px " + UI_FONT;
    const bigF   = "900 " + fs + "px " + UI_FONT;
    ctx.font = smallF; const lw = ctx.measureText(label).width;
    ctx.font = bigF;   const vw = ctx.measureText(val).width;
    ctx.font = smallF; const uw = ctx.measureText(unit).width;
    const padX = Math.round(fs*0.55), gap = Math.round(fs*0.4);
    const boxW = padX*2 + lw + gap + vw + uw, boxH = P.h;
    // Square plate, matching the DOM buttons (which carry no radius at all) — and matching the
    // pause button's box exactly, since both take their height from hudPlate(). No outline:
    // the plate is dark enough against the board to be its own edge, and the hairline it used
    // to wear was the only thing on either of the two HUD boxes drawing a border.
    rrect(m, m, boxW, boxH, 0);
    ctx.fillStyle = "rgba(10,8,22,0.62)"; ctx.fill();
    const midY = m + boxH/2;
    ctx.textAlign = "left";
    ctx.font = smallF;
    ctx.fillStyle = "rgba(214,218,240,0.78)";
    ctx.fillText(label, m + padX, midY + 1);
    ctx.font = bigF;
    ctx.fillStyle = (typeof curTrack === "function") ? curTrack() : "#ffd24a";
    ctx.fillText(val, m + padX + lw + gap, midY);
    ctx.font = smallF;                                                // unit in a smaller dim suffix
    ctx.fillStyle = "rgba(214,218,240,0.66)";
    ctx.fillText(unit, m + padX + lw + gap + vw, midY + 1);
    ctx.restore();
  }
  // The tile tally. Deliberately NOT a permanent HUD: the number only changes at the instant
  // you collect something, so a counter sitting there the rest of the time is one more thing
  // competing with the board for attention. It shows up big when the number moves, holds, and
  // gets out of the way. Grand total only — the old "3/7 this level" was answering a question
  // the coins already answer by still being on the board.
  let tallyDX = 0, tallyDY = -1;    // the way it drifts, as a unit vector on the board
  let tallySwing = 0;               // ...and which way that vector turns as it goes, +1 or -1
  const TALLY = {
    hold: 900,      // ms at full strength
    fade: 500,      // ...then this long dissolving
    pop:  260,      // the overshoot on arrival
    rise: 0.85,     // how far it drifts up over its life, in CELLS
    above: 0.55,    // how far above the coin's own centre it starts, in cells
    size:  0.30,    // cap height, as a fraction of a cell
    spin:  0.55,    // radians the CARD turns across its whole life, always away from him
  };
  // How far the card has turned at `u` of its life. This is the pop-up rotating on the spot as
  // it goes, not the line it travels along: it leaves on one bearing and keeps it, and the
  // turning is the thing itself tipping over as it fades. Bending the path instead moved the
  // number to somewhere you were not looking for it.
  const tallySpin = u => TALLY.spin * u * tallySwing;
  let tallyAt = -1e9, tallyC = 0, tallyR = 0;
  // Which way it drifts is decided HERE, not at draw time: he may well have turned a corner
  // by the time it fades, and the tally should keep going the way it set off.
  function showTally(c, r) {
    tallyAt = performance.now(); tallyC = c; tallyR = r;
    // Back over his shoulder: the bisector of straight-behind-him and straight-up-out-of-his-
    // head. Those two are always perpendicular — the runner's own up is the track's normal, and
    // he runs along it — so the halfway line is a clean 45 degrees whichever way he is facing,
    // and it never degenerates the way bisecting against SCREEN up would when he runs north.
    //
    // Both are taken in his frame for a reason. Dead ahead is the worst place for it, sitting
    // over the cells he is reading; straight back is safe but dull and can crowd the track he
    // just left. Splitting the difference lifts it clear of the line entirely.
    tallyDX = 0; tallyDY = -1;              // no run in progress: up, the way it always went
    if (state && state.status === "play" && state.path && state.path.length) {
      const ri = runnerInfo();
      const bx = -ri.tx + ri.nx, by = -ri.ty + ri.ny, m = Math.hypot(bx, by);
      // Standing on a one-node path he has no tangent at all, and both halves of the bisector
      // come out zero — which would pin the tally exactly on the coin instead of moving it.
      // Keep the plain upward drift for that case rather than dividing by nothing.
      if (m > 1e-6) {
        tallyDX = bx/m; tallyDY = by/m;
        // Which way "away" is depends on which side of him it set off — turning the same way
        // every time would swing it back across his nose on half the corners. Rather than
        // derive the sign from a cross product and have it come out backwards, turn it a
        // little each way and keep whichever opens the angle to his heading. The test IS the
        // requirement, so it cannot disagree with it.
        const tryTurn = sgn => { const a = 0.1*sgn, cs = Math.cos(a), sn = Math.sin(a);
          return (tallyDX*cs - tallyDY*sn)*ri.tx + (tallyDX*sn + tallyDY*cs)*ri.ty; };
        tallySwing = tryTurn(1) < tryTurn(-1) ? 1 : -1;      // smaller dot = further from him
      }
    }
  }
  // Drawn INSIDE the board transform, so it rides with the camera and stays over the cell the
  // coin came out of. Sized in cells for the same reason: it has to sit against the board, not
  // against the screen, or it changes size relative to the coin it just replaced.
  function drawTally() {
    const age = performance.now() - tallyAt, life = TALLY.hold + TALLY.fade;
    if (age < 0 || age > life) return;
    const u = age/life;
    const a = age < TALLY.hold ? 1 : 1 - (age - TALLY.hold)/TALLY.fade;
    const k = 0.80 + 0.20*easeOutBack(Math.min(1, age/TALLY.pop));   // a short pop as it lands
    const f2 = Math.round(cell*TALLY.size);
    // Banked plus held: the figure has to be what you would walk away with if you finished,
    // or picking a coin up would move a number that has not changed.
    const txt = String(wallet.tiles + ((state && state.purse) || 0));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.font = "900 " + f2 + "px " + UI_FONT;
    const ic = Math.round(f2*0.88), gap = Math.round(f2*0.30);
    const w = ic + gap + ctx.measureText(txt).width;
    // The same distance every time, in a straight line on the bearing it set off on. Both that
    // bearing and the way the card turns are fixed at pickup, not read here: he may well have
    // gone round a corner by the time it fades, and the tally should keep to what it started.
    const drift = cell*(TALLY.above + TALLY.rise*u);
    const cxm = (tallyC + 0.5)*cell + tallyDX*drift;
    const cym = (tallyR + 0.5)*cell + tallyDY*drift;
    // Scale and spin share the one pivot — the card's own centre — so it grows and tips about
    // the same point instead of swinging around an origin somewhere off to the side.
    ctx.translate(cxm, cym); ctx.scale(k, k); ctx.rotate(tallySpin(u)); ctx.translate(-cxm, -cym);
    coinGlyph(cxm - w/2 + ic/2, cym, ic);
    // No plate and no outline: a plate popping in and out over the board is noisier than the
    // number it carries, and the black stroke around it was doing the same job twice as hard.
    const tx = cxm - w/2 + ic + gap;
    ctx.fillStyle = "#ffd24a"; ctx.fillText(txt, tx, cym);
    ctx.restore();
  }
  // The Magnet's reach, while it is up: rings that keep falling inward onto him, so the
  // ground it covers is a thing you can see rather than a number in a menu — and so the
  // direction of the pull is legible without a single coin being in range.
  function drawMagnetField(ts) {
    if (!powerActive("magnet")) return;
    const rp = visualAt(state.runIdx + state.runT);
    const cxm = rp.x, cym = rp.y - cell*0.3, R = MAGNET_CELLS * cell;
    ctx.save();
    // a wash under it all, so the reach still reads as an AREA between the discs
    ctx.globalAlpha = 0.12; ctx.fillStyle = "#ff6d6d";
    ctx.beginPath(); ctx.arc(cxm, cym, R, 0, Math.PI*2); ctx.fill();
    // Shaded discs rather than drawn rings. An outline is a hard edge travelling across the
    // board, which reads as a boundary; a disc that is brightest at its rim and clear in the
    // middle reads as something closing IN, which is the whole idea.
    for (let i = 0; i < MAGNET_RINGS; i++) {
      // u runs 0 at the rim to 1 at him. Evenly spread, so one leaves as another arrives.
      const u = ((ts / MAGNET_RING_MS) + i / MAGNET_RINGS) % 1;
      const rad = R * (1 - u);
      if (rad < cell*0.05) continue;
      // in as it leaves the rim, out as it lands, so nothing ever pops into or out of being
      // Brighter, and the bright part is a narrower band at the rim — spreading the same ink
      // from 55% of the radius outward made a soft blob, where keeping it near the edge reads
      // as a ring closing in. Nearly white at the leading edge so it holds up over gold track.
      const a = 0.72 * Math.pow(Math.sin(Math.PI*u), 0.55);
      const g = ctx.createRadialGradient(cxm, cym, rad*0.72, cxm, cym, rad);
      g.addColorStop(0,    "rgba(255,157,157,0)");
      g.addColorStop(0.55, "rgba(255,140,140," + (a*0.40).toFixed(4) + ")");
      g.addColorStop(0.88, "rgba(255,190,190," + a.toFixed(4) + ")");
      g.addColorStop(1,    "rgba(255,236,236," + (a*0.80).toFixed(4) + ")");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cxm, cym, rad, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  // the coin as a flat badge, for the HUD and the shop — no float, no shine, just the shape
  function coinGlyph(cxp, cyp, s2) {
    const h = s2/2, r = s2*TILE.radius;
    ctx.save();
    rrect(cxp - h + s2*0.06, cyp - h + s2*0.10, s2, s2, r); ctx.fillStyle = COIN_EDGE; ctx.fill();
    rrect(cxp - h, cyp - h, s2, s2, r); ctx.fillStyle = "#ffd24a"; ctx.fill();
    if (COIN.panelA > 0) {                                        // the same pressed panel
      const ip = s2*COIN.panelPad;
      ctx.globalAlpha = COIN.panelA; ctx.fillStyle = COIN_EDGE;
      rrect(cxp - h + ip, cyp - h + ip, s2 - 2*ip, s2 - 2*ip, Math.max(0, r - ip*0.6)); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = Math.max(1, s2*0.07);
    ctx.beginPath(); ctx.moveTo(cxp - h + r, cyp - h + ctx.lineWidth*0.5);
    ctx.lineTo(cxp + h - r, cyp - h + ctx.lineWidth*0.5); ctx.stroke();
    ctx.restore();
  }

  // The laid path is drawn as a set of per-tile platform segments. Each tile
  // renders its OWN piece (a straight or corner beam) contained within its
  // cell: a glass background, then the platform whose running surface passes
  // through the tile centre and whose body hangs into the lower half.
  function drawTrack(ts) {
    const p = state.path, idx = state.runIdx;
    if (idx >= p.length) return;

    // a node carries a platform until the runner exits it (per-node flag, so a
    // re-placed tile's stale old node never affects its fresh placement).
    const live = (n) => n.kind === "tile" && !n.exited;
    const onGoal = (n) => !!state.goal && n.c === state.goal.c && n.r === state.goal.r;

    drawPathGlass(p.slice(idx).filter(live));

    for (let i = idx; i < p.length; i++)
      if (live(p[i])) {
        // leading tile = 3-way junction, unless it's the final tile on the goal cell
        if (i === p.length - 1 && !onGoal(p[i])) drawJunction(p[i], p[i-1], ts);
        else drawPlatformTile(p[i], p[i-1], p[i+1]);
      }

    // the exit is a floating flag on its cell; you must lay a tile there to finish
    if (state.goal) drawFlag(state.goal.c, state.goal.r, ts, false);   // never locked (no primary key)
  }

  // floating finish flag; you place a tile on its cell to reach the exit
  function drawFlag(c, r, ts, locked) {
    const x = (c+0.5)*cell, cy0 = (r+0.5)*cell, s = cell;
    const pt = state.flagPlantT || 0;                     // 0 floating -> 1 planted on the tile
    const bob = (1-pt) * Math.sin(ts/300)*s*0.05;
    // Once there is a tile here, the flag plants on the RUNNING SURFACE at the middle of that
    // tile's path — the point the runner actually crosses — rather than on the cell's centre
    // with a fudge factor. On a corner tile that midpoint is out on the arc, so the flag
    // stands on the track instead of hovering beside it.
    const gi = state.path.findIndex(n => n.kind === "tile" && n.c === c && n.r === r);
    let ax = x, ay = cy0, tang = null;
    if (gi >= 0) {
      const S = tileSurface(state.path[gi], state.path[gi-1], state.path[gi+1]);
      const m = Math.floor((S.length - 1)/2);
      ax = x + (S[m].x - x)*pt; ay = cy0 + (S[m].y - cy0)*pt;   // slide onto it as it plants
      const a = S[Math.max(0, m-1)], b = S[Math.min(S.length-1, m+1)];
      tang = Math.atan2(b.y - a.y, b.x - a.x);            // the surface's own direction there
    }
    const baseY = ay + bob;
    ctx.save();
    // place-here target ring (fades out once the flag is planted)
    if (pt < 0.98) {
      ctx.globalAlpha = (1-pt) * (0.4 + 0.3*Math.sin(ts/240));
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(2, s*0.04);
      ctx.setLineDash([s*0.12, s*0.09]);
      ctx.beginPath(); ctx.arc(x, cy0, s*0.28, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    if (locked) drawLock(x, cy0 + s*0.02, ts);   // small padlock (unused: exit never locked now)
    // as it plants, the flag tilts to stand square on the surface it is planting into
    let rot = 0;
    if (tang != null) rot = tang;
    else if (gi > 0) { const pv = state.path[gi-1]; rot = Math.atan2((r - pv.r), (c - pv.c)); }
    ctx.translate(ax, baseY);
    ctx.rotate(rot * pt);                                 // upright while floating, aligned once planted
    // Shorter, all-white pole. The base sits AT the origin, not below it: the origin is the
    // midpoint of the tile's path, and once the flag has planted, the local +y axis points
    // across the track rather than down the screen — so a base at +0.08 landed that far to
    // one side of the centreline. Zero puts the foot on the path itself. The pole keeps its
    // old 0.38-cell length by growing upward instead.
    const poleTop = -s*0.38, poleBot = 0;
    // The pool at the foot is the flag's shadow on the track, in the runner's shadow ink and
    // at his exact opacity — the two things standing on the same rail are lit the same way.
    // Drawn BEFORE the pole: a shadow the pole stands in, not a collar painted over its end.
    if (pt > 0.05) {
      ctx.globalAlpha = pt; ctx.fillStyle = "rgba(5,4,13," + RUNNER.shadowA + ")";
      ctx.beginPath(); ctx.ellipse(0, poleBot, s*0.07*pt, s*0.03*pt, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(2, s*0.035); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, poleTop); ctx.lineTo(0, poleBot); ctx.stroke();
    // smaller white pennant (wave settles as it plants), flying along the travel direction
    const wave = (0.4 + 0.6*(1-pt)) * Math.sin(ts/180)*s*0.03, fw = s*0.24, fh = s*0.15;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.moveTo(0, poleTop);
    ctx.quadraticCurveTo(fw*0.6, poleTop + fh*0.1 + wave, fw, poleTop + fh*0.5);
    ctx.quadraticCurveTo(fw*0.6, poleTop + fh*0.9 - wave, 0, poleTop + fh);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawKey(x, y, ts, color) {
    color = color || "#ffd24a";
    const s = cell*0.85, bob = Math.sin(ts/300)*s*0.05;   // a little smaller
    y += bob;
    ctx.save();
    ctx.globalAlpha = 0.28; ctx.fillStyle = color;                                   // soft glow
    ctx.beginPath(); ctx.arc(x, y, s*0.4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    const R = s*0.12, bx = x - s*0.10;
    ctx.fillStyle = color;                                                           // bow drawn as a true ring:
    ctx.beginPath();
    ctx.arc(bx, y, R, 0, Math.PI*2);                                                 // outer edge
    ctx.arc(bx, y, R*0.46, 0, Math.PI*2, true);                                       // inner edge -> hole
    ctx.fill("evenodd");                                                             // centre left transparent (shows the scene behind)
    const sx0 = bx + R*0.6, sl = s*0.30, tipX = sx0 + sl, tw = s*0.035, th = s*0.07;
    ctx.fillStyle = color;
    ctx.fillRect(sx0, y - s*0.028, sl, s*0.056);                                     // shaft
    ctx.fillRect(tipX - tw, y + s*0.012, tw, th);                                     // teeth — near the tip
    ctx.fillRect(tipX - tw - s*0.07, y + s*0.012, tw, th);
    ctx.restore();
  }

  // --- Batch 2 cell-type rendering ---------------------------------------
  function drawBarriers(ts) {
    const s = state;
    for (const ck of s.singularity) if (!s.collapsed.has(ck)) { const [c,r]=ck.split(",").map(Number); drawSingularity(c,r,false,ts); }
    for (const ck of s.collapsed) { const [c,r]=ck.split(",").map(Number); drawSingularity(c,r,true,ts); }
    drawEaten();                                  // ...and whatever is currently going down one
    for (const bk of s.boost) { const [c,r]=bk.split(",").map(Number); drawFxPickup(c,r,ts,"boost"); }
    for (const bk of s.slow)  { const [c,r]=bk.split(",").map(Number); drawFxPickup(c,r,ts,"slow"); }
    for (const d of s.doors) {
      // coloured key-doors read as a LOCK (padlock marker); no full door tile
      if (!d.reached) drawDoorLock(d.c,d.r,ts,d.color,d.open);   // lock marker stays until the runner arrives

    railBank:   3,      // teeth per bank. Every rail monster has two banks of oars: a vertical
                        // mover's are down its left and right sides, a horizontal mover's along
                        // its top and bottom. Nothing has teeth right round it any more.
    railToothH: 0.13,   // how far each stands off the edge, fraction of the body
    railToothW: 0.60,   // how much of its share of the rim each one occupies
    // The teeth do not march round at a constant rate any more — they ROW. One cycle is a
    // quick power stroke with the teeth out and driving backwards, then a longer recovery
    // where they feather in and slide forward to catch again. Same idea as an oar, and the
    // asymmetry is the whole thing: equal halves read as a wobble, not as propulsion.
    railStrokeMs: 780,  // TARGET length of one stroke. The actual length is stretched or
                        // squeezed a little per leg so a whole number of strokes spans the
                        // rail exactly — see railLegSetup. A rail is not a multiple of 780ms,
                        // and a monster that reached the end halfway through a thrust stopped

    railDrive:  0.34,   // fraction of that spent driving; the rest is the recovery
    railSweep:  0.085,  // how far round the rim a tooth travels in a stroke, in TURNS
    railFeather:0.34,   // how far the teeth pull in on the recovery (1 = not at all)
    railSurge:  0.030,  // body lurch along its line of travel per stroke, fraction of a cell
    railSlide:  0.34,   // peak-to-peak travel of a bank, as a fraction of its own length. The

                        // set aside, so however far they stroke they stay on the straight run

                        // makes up whatever this gives away, so the AVERAGE speed over a

                        // their timing, and only the moment-to-moment pace changes.
    panelPad:   0.11,   // the inscribed square's inset, fraction of the body
    panelA:     0.18,   // ...and how far it darkens what is under it

  // The family. One tile-shaped body, five ways of behaving — told apart by colour and by
  // which way the tile splits, so you can read what a monster does before it does it.
  //
  //   move   how it gets about: a rail it slides along, a waypoint path, a random walk, or
  //          nothing at all (the trap)
  //   split  "h" halves part up and down; "v" they part left and right. Set to the axis it
  //          travels along, so it always bites in the direction it is going.
  //   blocks whether you may lay track through its cell. The movers you can build across and
  //          time your run through; only the patrols hold ground.
  const MONSTER_KINDS = {
    hrail:  { move:"rail",   split:"h", body:"#b24dff", blocks:false },   // was a horizontal saw
    vrail:  { move:"rail",   split:"v", body:"#4dc9ff", blocks:false },   // was a vertical saw
    patrol: { move:"path",   split:"h", body:"#b24dff", blocks:true  },   // the waypoint walker

    hunter: { move:"hunt", look:"rail", banks:"all", split:"h",

    stealth: { move:"hunt", look:"rail", banks:"all", split:"h",

  // It was the "wanderer" until it learned to hunt. Old level data still says so.
  MONSTER_KINDS.wander = MONSTER_KINDS.hunter;
  const monKind = h => MONSTER_KINDS[h.variant] || MONSTER_KINDS.patrol;
  // The trap's cycle, in ms: shut, yawning open, held wide (safe to run through), then the snap.
  const TRAP = { rest: 1500, open: 620, hold: 2600, snap: 150, warn: 620 };
  function trapPhase(t) {
    const T = TRAP, a = T.rest, b = a + T.open, c = b + T.hold, d = c + T.snap;
    const u = t % d;
    // SHUT and winding up. Lethal, and it is not open, so nothing may stand here.
    if (u < a) return { open: 0, lethal: true, wide: false, shake: 0, u };
    // Opening. Safe from the first frame of it: the jaws are moving apart, and a mouth that is
    // coming open is not a mouth that is about to close on you. Waiting for it to be fully
    // wide made the safe window narrower than it looks, which reads as the trap cheating.
    if (u < b) return { open: (u - a)/T.open, lethal: false, wide: false, shake: 0, u };

    // only warning that the hold is ending, and without one the snap is unfair rather than
    // hard. It ramps so the shake itself says how long you have left.
    if (u < c) { const left = c - u;

  // `phase` is 0..1 through one bite, kept on the hazard so the sound and the picture cannot
  // drift apart. Without one it falls back to the wall clock, which is what the mechanic
  // card's static icon wants.
  // The rail monster: one whole tile with two banks of oars. It never opens — the menace is
  // that it rows straight at you, not that it bites — which is what tells it apart at a
  // glance from the ones that split.
  // How fast a rower travels at stroke-phase P, relative to its own average. Coasts through
  // the recovery at `railCoast`, and drives through the power stroke at whatever rate makes
  // the mean come back to exactly 1 — `2sin²` averages 1 over its half-cycle, which is what
  // makes that solvable in closed form instead of by fudging. It also meets the coast rate at
  // both ends of the drive, so the pace never steps.
  // Distance covered by stroke-phase P, as a fraction of one whole stroke — the integral of
  // railRate, in closed form. Having it exactly means a leg can be positioned from its stroke

  // end of the rail to the pixel instead of drifting there.
  function railProgress(P) {

  // Lay out the leg the monster is about to swim: how far it has to go, and how many whole

  function railLegSetup(h) {
    for (let guard = 0; guard < 2; guard++) {
      h.legFrom = h.t;
      h.legSpan = Math.abs((h.dir > 0 ? 1 : 0) - h.t);
      if (h.legSpan > 1e-6) break;
      h.dir = -h.dir;                          // already at that end — turn and try the other way
    }
    const full = Math.max(1, Math.round(h.speed / MONSTER.railStrokeMs));   // strokes per whole rail
    h.legN  = Math.max(1, Math.round(full * h.legSpan));
    h.legSd = (h.speed * h.legSpan) / h.legN;  // this leg's stroke, ms
    h.rowT  = 0;

  function railRate(P) {
    const d = MONSTER.railDrive, B = MONSTER.railCoast;
    if (P >= d) return B;
    const driveMean = (1 - (1 - d)*B) / d;
    const t = P/d, sn = Math.sin(t*Math.PI);
    return B + (driveMean - B) * 2*sn*sn;
  }
  function drawRailMonster(x, y, ts, dir, K, off) {
    const s = cell, S = s*MONSTER.railSize, h = S/2, R = tileR(S);
    // His eyes are his own colour, not the family's ink — they read against the inscribed
    // panel they sit on, which is the only thing darker than he is. Unless the kind names one:
    // a body dark enough to BE the panel has to borrow a colour from somewhere.
    const body = K.body || "#b24dff", eye = K.eye || body;
    // ---- the stroke -------------------------------------------------------------------
    // P runs 0..1 through one row. During the DRIVE the teeth are fully out and sweep
    // backwards along the rim; during the RECOVERY they pull in and slide forward again.
    // Easing differs between the two on purpose: the drive snaps away and settles, the
    // recovery is a smooth glide, which is what separates rowing from spinning.
    // Handed in by updateHazards, which is what keeps the teeth and the travel in step —
    // reading the shared clock here instead let the two drift apart, and made every monster

    const P = off || 0;

      ang = (e - 0.5) * MONSTER.railSweep;

      push = 1 - e;                                        // ...and coasts while he resets
    }
    const sgn = dir < 0 ? -1 : 1;
    ctx.save();
    // The lurch is VISUAL only — the hitbox stays on cc/cr — so a monster never eats you on
    // the strength of a wobble. Along his own line of travel: a vertical mover surges in y.
    const surge = (push - 0.5) * s * MONSTER.railSurge * 2 * sgn;
    const sx = K.split === "v" ? 0 : surge, sy = K.split === "v" ? surge : 0;
    ctx.translate(x + sx, y + sy + Math.sin(ts/260)*s*MONSTER.bob);
    const tl = S*MONSTER.railToothH * reach;
    ctx.fillStyle = body;                  // teeth in his own colour: oars, not a cog
    // Two banks of oars, stroking together. Only the AXIS differs between the two kinds: a
    // vertical mover carries its banks down the left and right sides and strokes them up and
    // down, a horizontal one carries them along the top and bottom and strokes them side to
    // side. Both banks always share one offset, which is what reads as a single animal rowing
    // rather than as a wheel that happens to be turning.
    //
    // Travel is set aside FIRST and the teeth are spaced across what is left, so the whole
    // bank stays on the straight run of its edge no matter how far it strokes — no tooth ever
    // climbs into a rounded corner or pops in and out at an end.
    const vert = K.split === "v";
    const base = -h + R, run = 2*(h - R);
    const per = Math.max(1, MONSTER.railBank|0);
    const amp = run * MONSTER.railSlide;
    const step = (run - amp) / per;
    const slide = (ang / MONSTER.railSweep) * amp * sgn;
    const tw = step * MONSTER.railToothW;
    // The middle of each bank is the big one — the stroke reads as coming FROM somewhere
    // rather than from three identical prongs. Grown in both directions at once; the width
    // stays inside its own spacing (railToothW is 0.6 of a step, so even at 1.55 it does not
    // reach a neighbour) so the teeth never merge at the extremes of the stroke.
    const midK = (per % 2) ? (per - 1)/2 : -1;
    // One pair of banks. `downY` puts them on the left and right faces (spikes out along x,
    // spaced down y); otherwise on the top and bottom. `sl` is how far along their own face
    // they have slid — the rowing pair get the stroke, any others get none.
    const bank = (downY, sl) => {
      for (const side of [-1, 1]) {
        for (let k = 0; k < per; k++) {
          const big = (k === midK) ? MONSTER.railMidSpike : 1;
          const c = base + amp/2 + (k + 0.5)*step + sl;
          const hw = tw*big/2, len = tl*big;

          if (downY) {
            ctx.moveTo(side*h, c - hw);
            ctx.lineTo(side*h, c + hw);
            ctx.lineTo(side*(h + len), c);
          } else {
            ctx.moveTo(c - hw, side*h);
            ctx.lineTo(c + hw, side*h);
            ctx.lineTo(c, side*(h + len));

          ctx.closePath(); ctx.fill();

    };
    // The rowing pair sit on the faces PARALLEL to travel, because those are the only ones a
    // spike can sweep backwards along. A monster that turns corners also carries a second pair
    // on the faces it is heading into and away from; those cannot row — sliding them would be
    // sideways — so they just bristle in and out on `reach` with the rest.
    bank(vert, slide);
    if (K.banks === "all") bank(!vert, 0);
    ctx.fillStyle = body; rrect(-h, -h, S, S, R); ctx.fill();     // the tile, over the tooth roots
    ctx.save(); rrect(-h, -h, S, S, R); ctx.clip();
    grainFill(-h, -h, S, S, MONSTER.grain);
    ctx.restore();
    // an inscribed panel, a shade darker than the body — the same trick the walls use to
    // stop a plain coloured square reading as a flat sticker
    const ip = S*MONSTER.panelPad;
    ctx.fillStyle = "rgba(9,6,20," + MONSTER.panelA + ")";
    rrect(-h + ip, -h + ip, S - 2*ip, S - 2*ip, Math.max(0, R - ip*0.6)); ctx.fill();
    // The eyes LEAD: they sit toward whichever end he is heading for, so his direction reads
    // off the face alone rather than off watching him move. `dir` is +1 down the rail, which
    // is rightward for a horizontal mover and downward for a vertical one — the same sign
    // works for both, it just applies to a different axis.
    //
    // Only the horizontal one also leans the pair that way: the shared painter's own bias
    // runs along x, which is his line of travel but not the vertical mover's, so a vertical
    // one is given no bias and simply carries its eyes up or down the panel.
    const lead = S * MONSTER.railEyeLead * sgn;
    drawEyes(ctx, vert ? 0 : lead, vert ? lead : 0, s, eye, vert ? 0 : sgn, ts, 0);
    ctx.restore();
  }
  function drawMonster(x, y, ts, faceX, phase, cfg) {
    const K = cfg || MONSTER_KINDS.patrol;
    // `phase` for a rail monster is its position along its own rail. Feeding it in as a
    // stroke offset is enough to break the lockstep: with only the shared clock, a rank of
    // six rowed in perfect unison, which reads as clockwork rather than as six animals.
    if (K.move === "rail" || K.look === "rail") return drawRailMonster(x, y, ts, faceX, K, phase);
    const s = cell, S = s*MONSTER.size, h = S/2, R = tileR(S);
    const face = faceX < 0 ? -1 : 1;
    // Shut, then a fast snap open, then shut again. Held near zero for most of the cycle,
    // which reads as chomping; a plain sine reads as breathing.
    const u = phase != null ? phase : (ts % MONSTER.chompMs) / MONSTER.chompMs;
    const open = Math.pow(Math.max(0, Math.sin(u*Math.PI)), 0.7);
    y += Math.sin(ts/260)*s*MONSTER.bob;
    // He never shuts fully. Closed is the MESHED position: the tips reach past the other
    // jaw's cut face by `overbite`, so the halves stay apart and all that is left between
    // them is the zigzag channel between the teeth. Derived from the tooth length rather than
    // typed in, so lengthening the teeth closes the bite by exactly as much.
    const shut = h*MONSTER.toothH*(1 - MONSTER.overbite);         // tips past the far face
    const wide = Math.max(shut, h*(K.gap != null ? K.gap : MONSTER.gap));
    const lift = shut + (wide - shut)*open, tilt = MONSTER.tilt*open;
    // One colour for the whole animal — body, teeth and eyes alike, exactly as the rail
    // monsters wear it. The teeth read because they stand out into the gap against the board
    // behind, and the eyes read because they sit on the inscribed panel, which is the only
    // thing on him darker than he is.
    const body = K.body || "#b24dff";

    ctx.save();
    ctx.translate(x, y);
    // A vertical mover splits left/right instead of up/down, so it still bites along its own
    // line of travel. One rotation does it — everything below is written once.
    if (K.split === "v") ctx.rotate(Math.PI/2);
    ctx.scale(face, 1);                                           // face the way it travels

    // No dark backing behind the gap: when he opens, you see the board straight through him,
    // which is what makes the split read as a split rather than a painted-on mouth.

    // Each half is the WHOLE tile drawn behind a straight cut, so both keep the rounded
    // outer corners and neither can show a corner the tile never had.
    for (const j of [-1, 1]) {                                    // upper half, then lower
      ctx.save();
      ctx.translate(0, j*lift);
      ctx.rotate(j*tilt*face);                                    // a slight hinge swing
      ctx.save();
      ctx.beginPath();                                            // keep only this half
      if (j < 0) ctx.rect(-S, -S*2, S*2, S*2);                    // everything above the cut
      else       ctx.rect(-S, 0, S*2, S*2);                       // ...and below it
      ctx.clip();
      ctx.fillStyle = body; rrect(-h, -h, S, S, R); ctx.fill();
      rrect(-h, -h, S, S, R); ctx.clip();                         // grain stays on the tile
      grainFill(-h, -h, S, S, MONSTER.grain);                     // the same paper as everything
      // The inscribed panel the walls and the rail monsters carry. Drawn INSIDE the half's
      // clip, so it is cut by the same straight edge the body is and splits with the jaws
      // rather than bridging the gap between them.
      const ip = S*MONSTER.panelPad;
      ctx.fillStyle = "rgba(9,6,20," + MONSTER.panelA + ")";
      rrect(-h + ip, -h + ip, S - 2*ip, S - 2*ip, Math.max(0, R - ip*0.6)); ctx.fill();
      ctx.restore();                                              // the teeth stand PAST the cut,
      ctx.fillStyle = body;                                       // so they must not be clipped to it
      // The two rows MESH: the lower jaw is offset half a tooth and carries one fewer, so its
      // teeth sit in the gaps between the upper ones instead of meeting them point to point.
      const n = MONSTER.teeth, span = S*0.86, x0 = -span/2, tw = span/n, tl = S*MONSTER.toothH;
      const cnt = j < 0 ? n : n - 1, off = j < 0 ? 0 : tw*0.5;
      for (let k = 0; k < cnt; k++) {
        const tx = x0 + off + k*tw;
        ctx.beginPath();
        ctx.moveTo(tx, 0); ctx.lineTo(tx + tw*0.84, 0);
        ctx.lineTo(tx + tw*0.42, -j*tl);                          // pointing into the gap
        ctx.closePath(); ctx.fill();
      }
      // the same eyes as everything else, on the upper half
      if (j < 0) drawEyes(ctx, 0, -h + S*0.30, s, body, 1, ts, 0);
      ctx.restore();
    }
    ctx.restore();
  }
  // On the floor: the talisman bobs on a soft disc of its own colour. Once it's been
  // taken it stays as a faint outline, so a replayed level still reads the same.
  function drawTalismanCell(t, ts) {
    const def = talById(t.id); if (!def) return;
    const x = (t.c + 0.5) * cell, y0 = (t.r + 0.5) * cell;
    if (t.got) {
      ctx.save(); ctx.globalAlpha = 0.16;
      def.draw(ctx, x, y0, cell * 0.24);
      ctx.restore(); return;
    }
    const y = y0 + Math.sin(ts/320) * cell * 0.05;
    ctx.save();
    talHook(ctx, x, y, cell * 0.26, def);
    def.draw(ctx, x, y, cell * 0.26);
    ctx.restore();
  }
  // "New Talisman" card, low on the screen. It used to sit across the TOP, which is exactly
  // where the runner is heading and where the speed and coin plates already live — so the one

  // you are busy laying track.
  const TAL_IN = 260, TAL_OUT = 320;

  function talFlashRect() {
    const w = Math.min(viewW * 0.8, 340), h = Math.round(Math.min(viewW, viewH) * 0.13);
    return { x: (viewW - w)/2, y: Math.round(viewH * 0.86) - h, w, h };

  // a tap anywhere on the card sends it away; returns true if it swallowed the tap

    const R = talFlashRect();
    if (sx < R.x || sx > R.x + R.w || sy < R.y || sy > R.y + R.h) return false;
    talFlash.out = TAL_OUT; Sound.tap(); haptic(4);
    return true;
  }
  function drawTalismanFlash(dt, ts) {
    if (!talFlash) return;
    talFlash.t += dt;
    if (talFlash.out) { talFlash.out -= dt; if (talFlash.out <= 0) { talFlash = null; return; } }
    const k = Math.min(1, talFlash.t / TAL_IN);
    const a = talFlash.out ? Math.min(k, talFlash.out / TAL_OUT) : k;
    const R = talFlashRect();
    const w = R.w, h = R.h, x = R.x, y = R.y + (1-k) * 18;
    ctx.save(); ctx.globalAlpha = a;
    rrect(x, y, w, h, h*0.28); ctx.fillStyle = "rgba(10,8,22,0.82)"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = hexA(talFlash.def.col, 0.7); ctx.stroke();
    talFlash.def.draw(ctx, x + h*0.55, y + h/2, h*0.30);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(214,218,240,0.8)";
    ctx.font = "700 " + Math.round(h*0.22) + "px " + UI_FONT;
    ctx.fillText("NEW TALISMAN", x + h, y + h*0.36);
    ctx.fillStyle = talFlash.def.col;
    ctx.font = "900 " + Math.round(h*0.32) + "px " + UI_FONT;
    ctx.fillText(talFlash.def.name, x + h, y + h*0.66);
    // Tucked under the name rather than beside it: the names run long ("Nightshard") and
    // the top line already carries NEW TALISMAN, so the middle and top right are both taken.
    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(214,218,240,0.42)";
    ctx.font = "700 " + Math.round(h*0.16) + "px " + UI_FONT;
    ctx.fillText("TAP TO DISMISS", x + w - h*0.34, y + h*0.90);
    ctx.restore();
  }
  // A coin is a little golden TILE hovering off the board: the same rounded square the game
  // is built from, at about a third size, with its own rail across it. Its shadow stays on
  // the ground and shrinks as it rises, which is what sells the float.
  //

  // GLOSS that gives it a lit side, a RIM along the top edge, a SWEEP that travels across
  // the face on a timer, and a SPARK that twinkles off one corner. Tune them in coin-lab.html.
  const COIN = {
    size:     0.34,   // fraction of a cell
    float:    0.07,   // bob height, fraction of a cell
    floatMs:  620,    // one full bob
    rock:     0.08,   // lazy rotation, radians
    shadowA:  0.28,   // ground shadow opacity
    gloss:    0.45,   // fixed diagonal sheen across the face
    rim:      0.55,   // bright edge along the top
    sweep:    0.55,   // travelling glint strength
    sweepMs:  2200,   // how often it crosses
    spark:    0.80,   // corner twinkle strength
    sparkMs:  2600,   // how often it twinkles
    panelPad: 0.15,   // the inscribed square's inset, fraction of the coin

    halo:    0.6,      // the bruise the pull leaves in the floor

  const doorScratch = document.createElement("canvas");   // the lock body, so its hole can be cut
  // a padlock marker on a colored door; open=true shows an unlocked shackle but stays until reached
  function drawDoorLock(c, r, ts, color, open) {
    const x = cx(c)+cell*0.5, y = cy(r)+cell*0.5, s = cell*0.5;
    ctx.save();
    // striped, colour-matched barrier filling the tile while still locked; clears once the key is collected
    if (!open) {
      const tx = cx(c), ty = cy(r);
      ctx.save();
      rrect(tx + cell*0.05, ty + cell*0.05, cell*0.90, cell*0.90, tileR(cell*0.90)); ctx.clip();
      ctx.globalAlpha = 0.18; ctx.fillStyle = color; ctx.fillRect(tx, ty, cell, cell);            // soft wash of the hue
      ctx.globalAlpha = 0.5;  ctx.strokeStyle = color; ctx.lineWidth = cell*0.16; ctx.lineCap = "butt";
      const step = cell*0.34, drift = (ts/45) % step;                                             // slow barber-pole drift
      ctx.beginPath();

      ctx.stroke();

    // Shackle AND body go down together at full strength, then the keyhole is cut out of the
    // pair, and the finished silhouette is composited ONCE. Drawing the two straight onto the
    // board meant the leg overlapping the body double-painted: at 50% that seam is plainly two
    // shapes stacked rather than one lock. Merged first, the whole thing fades as one object.
    //
    // An arc alone floats. A shackle is an arc with two LEGS running down into the body — that
    // join is what makes it read as a padlock rather than a croquet hoop.
    const shR = s*0.15, bodyTop = y - s*0.02, shCy = y - s*0.13, legY = bodyTop - shCy;

    // mode as well as the pixels or the lock silently stops drawing from the second frame on.
    g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation = "source-over"; g.clearRect(0,0,S,S);
    const ox = x - S/2, oy = y - S/2;            // the layer is centred on the lock
    g.translate(-ox, -oy);
    g.strokeStyle = color; g.fillStyle = color;
    g.lineWidth = Math.max(3, cell*0.06); g.lineCap = "round";
    g.save();
    // Open: the shackle is MIRRORED about the leg that stays in the body, not tilted. Flipping
    // it keeps the arc upright — still plainly the same shackle — while carrying the far leg
    // clear of the body and out past its edge. A tilt reads as a wonky lock; this reads as one
    // that has been let go.
    if (open) { const px = x - shR;
                g.translate(px, 0); g.scale(-1, 1); g.translate(-px, 0); }
    g.translate(x, shCy);
    g.beginPath();
    g.arc(0, 0, shR, Math.PI, 0);
    g.lineTo(shR, legY);                         // ...straight on down the right leg
    g.moveTo(-shR, 0); g.lineTo(-shR, legY);     // ...and the left one
    g.stroke();
    g.restore();

    g.beginPath();
    g.moveTo(bx+br, by); g.arcTo(bx+bw, by, bx+bw, by+bh, br); g.arcTo(bx+bw, by+bh, bx, by+bh, br);
    g.arcTo(bx, by+bh, bx, by, br); g.arcTo(bx, by, bx+bw, by, br); g.closePath();
    g.fill();

    // the striped barrier behind rather than a dark shape painted on the front.
    g.globalCompositeOperation = "destination-out";
    g.beginPath(); g.arc(x, y + s*0.14, s*0.065, 0, Math.PI*2); g.fill();
    g.fillRect(x - s*0.028, y + s*0.14, s*0.056, s*0.12);

    // reach it, but faded off the board as one piece.
    ctx.globalAlpha = open ? 0.5 : 1;
    ctx.drawImage(sc, ox, oy);
    ctx.restore();
  }

  // edge arrow pointing to an off-screen target (drawn in screen space)
  function drawOffscreenArrow(wx, wy, color, kind) {

    let dx = sx - cxs, dy = sy - cys; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const hw = viewW/2 - pad, hh = viewH/2 - pad;

  // one tile's platform piece, clipped to its own cell. The top surface is the

  function drawPlatformTile(n, prev, next) {
    drawPlatformSurface(n, tileSurface(n, prev, next), curTrack());

  // draw a platform body + rail from a surface polyline S, clipped to the cell.

  function hexA(hex, a) {   // "#ffcf4d" -> "rgba(255,207,77,a)"
    const n = parseInt(hex.replace("#",""), 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";

  // build the body polygon (surface S, extended past the far tile edge) as the current path

  // It used to be built by pushing every surface point 1.7 cells down its own normal. On a
  // straight that is a clean parallel offset, but on a CORNER the normals converge on the

  function bodyPath(S, C) {

  // the level's hue turned and drained, so it still belongs to the palette without being a

  // What a track skin lays under the beam instead of the stock bedding lines. Each is handed

  function surfaceBand(S, C, d) {

  // Tuning for the leading tile's 3-way junction. Edit these in junction-lab.html and paste

  const JUNCTION = {
    tileIn:  1.00,   // the finished tile where the runner enters
    tile:    0.32,   // ...fading to this out at the exits

  const jScratch = document.createElement("canvas");   // reused every frame
  // the leading tile renders as a 3-way junction: three real platform pieces

  // (up / down relative to travel) — signalling the path isn't set yet.
  function drawJunction(n, prev, ts) {

    const left  = { x:-din.y, y:din.x };

  // both out of the law of cosines. The offset is rotated to +x so the knee always leads.
  function solveKnee(hx, hy, fx, fy, bend, split, lead) {

    return { x: hx + ux*a + px*(h+lead), y: hy + uy*a + py*(h+lead) };

      // it becomes a slope, and the trailing foot sinks through the floor by as much as the
      // leading one floats above it. Put each foot back on the real ground plane — solve
      //   fx·sinL + fy·cosL = the height the stride wanted
      // for fy. Costs nothing when there is no lean, since sinL is 0 and cosL is 1.
      const L = w.lean || 0, sinL = Math.sin(L), cosL = Math.cos(L);
      for (const [hx, fx, fy0] of [[backHip, swing, lift(phase)], [frontHip, -swing, lift(phase + Math.PI)]]) {
        const fy = (fy0 - fx*sinL) / cosL;
        const k = RUNNER.knees ? solveKnee(hx, hipY, fx, fy, RUNNER.kneeBend, RUNNER.kneeSplit, kneeLead) : null;
        limbs.push([hx, k && k.x, k && k.y, fx, fy]);
      }
    }
    for (const [hx, kx, ky, fx, fy] of limbs) {
      ctx.beginPath(); ctx.moveTo(hx, hipY);
      if (kx != null) ctx.lineTo(kx, ky);
      ctx.lineTo(fx, fy); ctx.stroke();
      if (kx != null && RUNNER.kneeR > 0) {
        ctx.beginPath(); ctx.arc(kx, ky, s*RUNNER.kneeR, 0, Math.PI*2); ctx.fillStyle = finish; ctx.fill();
      }
      feet.push([fx, fy]);
    }
    // shoes ride on the feet, so the stride and the foot lift carry them for free
    const shoe = lookItem("kicks");
    if (shoe.draw) for (const [fx, fy] of feet) {
      ctx.save(); ctx.translate(fx, fy); shoe.draw(ctx, s, shoe.col); ctx.restore();
    }
    // body — no outline. The corner comes from RUNNER, like every other measurement of him:
    // this was a hardcoded 0.07 while both labs read R.bodyR, so the lab's corner slider moved
    // a runner the game did not draw. The block parity check compares VALUES between the three
    // copies and cannot see a key that one of them quietly stopped using.
    ctx.fillStyle = finish;
    rrect(-bodyW/2, byTop, bodyW, bodyH, s*RUNNER.bodyR); ctx.fill();
    // the finish's own detail — facets, streaks — kept inside the silhouette
    if (skin.sheen) {
      ctx.save(); ctx.clip();                       // the body path is still current after fill()
      skin.sheen(ctx, -bodyW/2, byTop, bodyW, bodyH, ts);
      ctx.restore();
    }
    // worn talisman: a cord across the chest with the pendant hanging from it
    const worn = wornTalisman();
    if (worn) {
      const cordY = byTop + bodyH*RUNNER.talCordY, hangY = byTop + bodyH*RUNNER.talHangY;
      const px = bodyW*RUNNER.talX, span = bodyW*RUNNER.talSpan;   // the cord's dip follows the pendant
      ctx.strokeStyle = "rgba(23,38,63," + RUNNER.talCordA + ")";
      ctx.lineWidth = Math.max(1, s*RUNNER.talCordW); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-span, cordY);
      ctx.quadraticCurveTo(px, hangY + s*RUNNER.talSag, span, cordY); ctx.stroke();
      worn.draw(ctx, px, hangY, s*RUNNER.talR);
    }
    // the shared eyes, facing +x = the way he is travelling
    drawEyes(ctx, 0, byTop + bodyH*RUNNER.eyeY, s, inkCol, 1, ts, 0);
    // last, so it sits on top of everything. Scaled up about the crown of his head — at the
    // shipped size the hats were a few pixels of trim on a small character and read as noise.
    const hat = as ? (as.hat || { draw:null }) : lookItem("hat");
    if (hat.draw) {
      ctx.save();
      ctx.translate(0, byTop); ctx.scale(HAT_SCALE, HAT_SCALE); ctx.translate(0, -byTop);
      hat.draw(ctx, s, bodyW, byTop, hat.col);
      ctx.restore();
    }
    ctx.restore();
  }

  // rounded-rectangle path (arcTo works on iOS 15+, unlike ctx.roundRect)
  function rrect(x, y, w, h, r) { ctx.beginPath(); rrectSub(x, y, w, h, r); }
  // the same outline as a SUBPATH — several of these make one fillable region, which is how
  // the whole run of track gets its backing in a single pass
  function rrectSub(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w/2, h/2));
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }

  // ---- wall layer, cached ----
  // Walls are static for the life of a level, yet drawWall (a gradient + clip + grain
  // pattern + four bolts, per wall) ran for every wall every frame. Bake the whole wall
  // layer into a world-sized offscreen once per level (or on resize) and blit it with a
  // single drawImage inside the camera transform.
  let wallLayer = null, wallLayerDirty = true;
  function markWallLayerDirty() { wallLayerDirty = true; }
  // The walls are watching. They cannot go into the baked wall layer — that is drawn once per
  // level and blitted — so they are painted over the top each frame, which is what lets them
  // blink and follow him. Two circles per wall is nothing next to the rest of a frame.
  // The walls wear the same eyes as everything else — only where they sit and how far they
  // will look are the walls' own business. They cannot go into the baked wall layer (that is
  // drawn once per level and blitted), so they are painted over the top each frame.
  const WALL_EYES = {
    y:     0.42,                  // down the tile from its top
    track: 0.020,                 // how far the pupils slide toward the runner
    reach: 6,                     // how many tiles away they stop bothering to look
  };                              // no colour of their own: they take the plate's, like the rivets
  function drawWallEyes(ts) {
    const s = state; if (!s.walls.size) return;
    let rx = null, ry = null;
    if (s.status === "play" || s.status === "falling") {
      const rp = s.status === "falling" && s.fall ? s.fall : visualAt(s.runIdx + s.runT);
      rx = rp.x; ry = rp.y;
    }
    // Only the walls you can SEE. This loop used to run for every wall on the board, which on
    // the big mazes is two hundred of them for the twenty or so on screen — and each one built
    // a gradient and drew a pair of animated eyes. Everything off-screen was painted into the
    // clip and thrown away.
    const c0 = Math.floor(camX / cell) - 1, c1 = Math.ceil((camX + viewW) / cell) + 1;
    const r0 = Math.floor(camY / cell) - 1, r1 = Math.ceil((camY + viewH) / cell) + 1;
    // ...and the gradient is vertical, so it depends on the ROW and nothing else. One per row
    // on screen rather than one per wall: a dozen instead of two hundred, and identical output.
    const rowGrad = new Map();
    const gradFor = (r) => { let g2 = rowGrad.get(r);
      if (!g2) { g2 = plateGrad(ctx, 0, cy(r), cell); rowGrad.set(r, g2); }
      return g2; };
    ctx.save();
    for (const wk of s.walls) {
      const i = wk.indexOf(","), c = +wk.slice(0, i), r = +wk.slice(i+1);
      if (c < c0 || c > c1 || r < r0 || r > r1) continue;      // not on screen; nothing to look with
      const cx0 = (c + 0.5)*cell, cy0 = (r + WALL_EYES.y)*cell;
      // The plate's own face, so an eye is the colour the edge is at that height — the same
      // rule the rivets follow.
      const grd = gradFor(r);
      // Each wall blinks on its own offset, or a row of them shutters like a Mexican wave.
      const off = (_sHash(c + 1, r + 1) % 1000) / 1000 * EYES.blinkMs;
      // ...and the pupils follow him. This is handed to the painter rather than over-painted
      // afterwards: the painter also applies its own wandering glance, so a second pass drawing
      // pupils without it lands beside the first pair instead of on top of it.
      let nx = 0, ny = 0;
      if (rx != null) {
        const dx = rx - cx0, dy = ry - cy0, d = Math.hypot(dx, dy) / cell;
        if (d < WALL_EYES.reach && d > 0.01) {
          const k2 = WALL_EYES.track * (1 - d/WALL_EYES.reach) / d;
          nx = dx*k2; ny = dy*k2;
        }
      }
      drawEyes(ctx, cx0, cy0, cell, grd, 0, ts, off, nx, ny);
    }
    ctx.restore();
  }

  // The plate's inscribed square: a recessed face set just inside the edge, following the same
  // corner as the plate itself. Shared by all three painters — the baked wall layer, the live
  // wall and the platform plinth — because three copies of a detail is three chances to drift.
  //
  // It is a translucent BLACK rather than a mixed-down grey, which is what makes it a darker
  // shade of the wall at every point: the plate is a top-to-bottom gradient and the paper grain
  // sits under this, so a flat opaque panel would kill both inside its own borders. Sitting the
  // darkening on top keeps the gradient running straight through the panel and the grain
  // showing within it.
  // The plate's face, as a gradient, defined once. The plate fill, its rivets and its eyes
  // all take THIS — so a rivet is exactly the colour the plate's edge is at that height, which
  // is what makes it read as standing proud of the recessed panel rather than as a spot of
  // paint on it. It was three hand-copied gradients before, one per painter.
  const PLATE_STOPS = [[0, "#697082"], [0.5, "#5c6474"], [1, "#4e5564"]];
  function plateGrad(g, x, y, s) {
    const gd = g.createLinearGradient(x, y, x, y + s);
    for (const st of PLATE_STOPS) gd.addColorStop(st[0], st[1]);
    return gd;
  }
  const PLATE_PAD   = 0.055;        // inset, fraction of the tile
  const PLATE_SHADE = 0.22;         // how far it darkens the plate under it
  function platePanel(g, x, y, s, rad) {
    const p = s*PLATE_PAD, r2 = Math.max(0, rad - p*0.6), w = s - 2*p;
    g.save();
    g.fillStyle = "rgba(5,4,13," + PLATE_SHADE + ")";
    g.beginPath();
    g.moveTo(x+p+r2, y+p);
    g.arcTo(x+p+w, y+p,   x+p+w, y+p+w, r2);
    g.arcTo(x+p+w, y+p+w, x+p,   y+p+w, r2);
    g.arcTo(x+p,   y+p+w, x+p,   y+p,   r2);
    g.arcTo(x+p,   y+p,   x+p+w, y+p,   r2);
    g.closePath(); g.fill();
    g.restore();
  }

  // self-contained wall painter (targets an arbitrary context, no reliance on global ctx)
  function paintWallInto(g, x, y, s) {
    const rad = tileR(s);           // was a hardcoded 0.16 — the one plate the radius pass missed
    const rp = (r) => { r = Math.max(0, Math.min(r, s/2)); g.beginPath(); g.moveTo(x+r,y);
      g.arcTo(x+s,y,x+s,y+s,r); g.arcTo(x+s,y+s,x,y+s,r); g.arcTo(x,y+s,x,y,r); g.arcTo(x,y,x+s,y,r); g.closePath(); };
    const grd = plateGrad(g, x, y, s);
    rp(rad); g.fillStyle = grd; g.fill();
    g.save(); rp(rad); g.clip();
    if (paperTile) { g.globalAlpha = 0.9; g.fillStyle = g.createPattern(paperTile, "repeat"); g.fillRect(x, y, s, s); g.globalAlpha = 1; }
    g.restore();
    platePanel(g, x, y, s, rad);
    const off = s*0.17, br = s*0.05;
    for (const [bx, by] of [[off,off],[s-off,off],[off,s-off],[s-off,s-off]]) {
      g.fillStyle = grd; g.beginPath(); g.arc(x+bx, y+by, br, 0, Math.PI*2); g.fill();
    }
  }
  // ---- the edge of the world ----------------------------------------------
  // The limit of what you can build on, drawn as hazard hatching rather than as a fence. A
  // full course of plate said "wall" so loudly that it competed with the real walls inside the
  // level — the ones that matter, because you have to route around them. This says the same
  // thing quietly: diagonal bars of faint white, every other one missing, fading out to
  // nothing as they go.
  //
  // Four bands, one per side, mitred at 45° so the corners meet on a seam instead of
  // overlapping — two overlapping bands would stack their alpha and leave the four corners
  // visibly brighter than the sides.
  //
  // The bars are ONE cached Path2D covering the whole outer rect, filled once per side
  // through that side's clip. Building a path per bar per frame would be ~70 fills a frame;
  // this is four, and the path only rebuilds when the board or the cell size changes.
  const EDGE_FADE   = 1.15;                 // how far the hatching reaches out, in cells
  const EDGE_A      = 0.11;                 // white at its strongest, at the peak of the rise
  const EDGE_STRIPE = 0.34;                 // one light bar + one gap, in cells
  const EDGE_RISE   = 0.20;                 // where it peaks, as a fraction of the way out
  // The wall is not a permanent feature of the level — it is what you find when you get close
  // to the edge with a tile in hand. Nothing shows until a tile is within EDGE_FAR of it; by
  // EDGE_NEAR it is at full strength. Away from the edges the whole pass costs nothing, because
  // the early-out below never touches the layers at all.
  const EDGE_NEAR = 2;                      // full strength within this many tiles of a tile
  const EDGE_FAR  = 3;                      // and invisible beyond this many
  const EDGE_STRIPES = false;               // see the call site in draw()
  let edgeLayer = null, edgeMask = null, edgeLayerKey = "";
  let edgeBars = null, edgeBarsKey = "";
  function edgeBarPath(B) {
    const key = Math.round(cell) + "/" + Math.round(worldW) + "x" + Math.round(worldH);
    if (edgeBars && key === edgeBarsKey) return edgeBars;
    const P = Math.max(4, EDGE_STRIPE * cell);          // one full light+dark cycle
    const x0 = -B, x1 = worldW + B, y0 = -B, y1 = worldH + B;
    const path = new Path2D();
    // A 45° bar is the strip between two lines of constant (x+y), so at any y its edges sit
    // at x = s - y and x = s + P/2 - y. Stepping s by P leaves a gap of exactly half a cycle.
    for (let sv = x0 + y0; sv <= x1 + y1; sv += P) {
      path.moveTo(sv - y0,       y0);
      path.lineTo(sv + P/2 - y0, y0);
      path.lineTo(sv + P/2 - y1, y1);
      path.lineTo(sv - y1,       y1);
      path.closePath();
    }
    edgeBars = path; edgeBarsKey = key;
    return path;
  }
  function edgeBand(g, ax, ay, bx, by, nx, ny, B, bars) {
    // Zero at BOTH ends. It used to open at full strength on the board's edge, which drew a
    // hard line right where the playable area stops — the one place the eye is already looking.
    // Now it rises out of nothing just outside the board, peaks, and trails away: no edge to
    // the edge, in either direction.
    const grd = g.createLinearGradient(ax, ay, ax + nx*B, ay + ny*B);
    const a = v => "rgba(255,255,255," + v.toFixed(4) + ")";
    grd.addColorStop(0,               a(0));
    grd.addColorStop(EDGE_RISE,       a(EDGE_A));
    grd.addColorStop(EDGE_RISE+0.30,  a(EDGE_A*0.45));  // most of the fall happens early,
    grd.addColorStop(1,               a(0));            // so the tail is a long soft nothing
    const ex = bx-ax, ey = by-ay, len = Math.hypot(ex, ey) || 1;
    const ux = ex/len, uy = ey/len;                      // along the edge, for the mitre
    g.save();
    g.beginPath();
    g.moveTo(ax, ay);
    g.lineTo(bx, by);
    g.lineTo(bx + nx*B + ux*B, by + ny*B + uy*B);
    g.lineTo(ax + nx*B - ux*B, ay + ny*B - uy*B);
    g.closePath(); g.clip();
    g.fillStyle = grd;
    g.fill(bars);
    g.restore();
  }
  function drawEdgeWalls() {
    if (worldW < 1 || worldH < 1 || !state.tiles || !state.tiles.length) return;
    const B = EDGE_FADE * cell, R = EDGE_FAR * cell;

    // Only tiles that are actually near the rim can light any of it. A tile in the middle of
    // the board would otherwise still cost a full radial-gradient disc every frame, for a
    // mask that lands nowhere near a band.
    const near = [];
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    for (const t of state.tiles) {
      if (Math.min(t.c + 0.5, t.r + 0.5, COLS - t.c - 0.5, ROWS - t.r - 0.5) > EDGE_FAR) continue;
      const sx = cx(t.c) + cell/2 - camX, sy = cy(t.r) + cell/2 - camY;
      if (sx < -R || sy < -R || sx > viewW + R || sy > viewH + R) continue;
      near.push({ sx, sy });
      if (sx-R < bx0) bx0 = sx-R;  if (sy-R < by0) by0 = sy-R;
      if (sx+R > bx1) bx1 = sx+R;  if (sy+R > by1) by1 = sy+R;
    }
    if (!near.length) return;

    // Everything below is confined to the box those discs occupy, clipped to the screen. The
    // revealed patch is a few hundred pixels across; clearing, compositing and blitting the
    // whole viewport for it — twice a frame, at whatever the device pixel ratio is — was
    // paying full-screen fill rate for a corner of the screen.
    bx0 = Math.max(0, Math.floor(bx0));  by0 = Math.max(0, Math.floor(by0));
    bx1 = Math.min(viewW, Math.ceil(bx1)); by1 = Math.min(viewH, Math.ceil(by1));
    const bw = bx1 - bx0, bh = by1 - by0;
    if (bw <= 0 || bh <= 0) return;

    const key = Math.round(viewW) + "x" + Math.round(viewH) + "@" + dpr;
    if (!edgeLayer || key !== edgeLayerKey) {
      edgeLayer = document.createElement("canvas");
      edgeLayer.width  = Math.max(1, Math.round(viewW*dpr));
      edgeLayer.height = Math.max(1, Math.round(viewH*dpr));
      // The mask is nothing but soft discs, so it is built at half resolution and scaled up —
      // a quarter of the pixels, and no detail lost that anyone could see.
      edgeMask = document.createElement("canvas");
      edgeMask.width  = Math.max(1, Math.round(viewW*dpr*0.5));
      edgeMask.height = Math.max(1, Math.round(viewH*dpr*0.5));
      edgeLayerKey = key;
    }
    const W = worldW, H = worldH, bars = edgeBarPath(B);

    // 1. the mask: one soft disc per contributing tile, in screen space
    const m = edgeMask.getContext("2d");
    m.setTransform(dpr*0.5, 0, 0, dpr*0.5, 0, 0);
    m.clearRect(bx0, by0, bw, bh);
    for (const t of near) {
      const rg = m.createRadialGradient(t.sx, t.sy, EDGE_NEAR*cell, t.sx, t.sy, R);
      rg.addColorStop(0, "rgba(255,255,255,1)");
      rg.addColorStop(1, "rgba(255,255,255,0)");
      m.fillStyle = rg;
      m.beginPath(); m.arc(t.sx, t.sy, R, 0, Math.PI*2); m.fill();
    }

    // 2. the bands, in world space, then multiplied by the mask in ONE operation — applied
    //    disc by disc a mask would INTERSECT rather than union, and erase itself. The clip
    //    holds destination-in to the box too, so the rest of the layer is never touched.
    const g = edgeLayer.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(bx0, by0, bw, bh);
    g.save();
    g.beginPath(); g.rect(bx0, by0, bw, bh); g.clip();
    g.translate(-camX, -camY);
    edgeBand(g, 0, 0,  W, 0,   0, -1, B, bars);  // clockwise, so every mitre meets its neighbour
    edgeBand(g, W, 0,  W, H,   1,  0, B, bars);
    edgeBand(g, W, H,  0, H,   0,  1, B, bars);
    edgeBand(g, 0, H,  0, 0,  -1,  0, B, bars);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.globalCompositeOperation = "destination-in";
    // The source rect is in the MASK's own device pixels, and the mask is half-resolution:
    // that is dpr*0.5 per CSS pixel, not 0.5. At dpr 2 the two happen to differ by exactly
    // the factor that leaves the box misaligned vertically but not horizontally, which is
    // the kind of wrong that looks right in the one screenshot you happen to take.
    const ms = dpr*0.5;
    g.drawImage(edgeMask, bx0*ms, by0*ms, bw*ms, bh*ms, bx0, by0, bw, bh);
    g.globalCompositeOperation = "source-over";
    g.restore();

    // 3. one blit of that box. The main context is translated by the camera, so it goes back
    //    at (camX,camY) — which also keeps it riding the screen shake with everything else.
    ctx.drawImage(edgeLayer, bx0*dpr, by0*dpr, bw*dpr, bh*dpr,
                  camX + bx0, camY + by0, bw, bh);
  }

  function buildWallLayer() {
    wallLayerDirty = false;
    if (!paperTile) buildPaper();
    if (!state || !state.walls || !state.walls.size || worldW < 1 || worldH < 1) { wallLayer = null; return; }
    const w = Math.max(1, Math.round(worldW * dpr)), h = Math.max(1, Math.round(worldH * dpr));
    wallLayer = document.createElement("canvas"); wallLayer.width = w; wallLayer.height = h;
    const g = wallLayer.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const wk of state.walls) { const [c, r] = wk.split(",").map(Number); paintWallInto(g, cx(c), cy(r), cell); }
  }

  // rounded, full-cell obstacle
  // metal barrier tile: brushed steel plate with a bevel, sheen and corner bolts
  function drawWall(c, r) {
    const x = cx(c), y = cy(r), s = cell, rad = tileR(s);
    const g = plateGrad(ctx, x, y, s);                                // gentler top-to-bottom gradient
    rrect(x, y, s, s, rad); ctx.fillStyle = g; ctx.fill();            // full-cell plate, no outline
    ctx.save(); rrect(x, y, s, s, rad); ctx.clip();
    grainFill(x, y, s, s, 0.9);                       // paper grain on the wall tile (no sheen)
    ctx.restore();
    // corner bolts (matte, no shine)
    platePanel(ctx, x, y, s, rad);
    const off = s*0.17, br = s*0.05;
    for (const [bx, by] of [[off,off],[s-off,off],[off,s-off],[s-off,s-off]]) {
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+bx, y+by, br, 0, Math.PI*2); ctx.fill();
    }
  }

  // ---- fixed platform: a metal plinth with track cast into it ------------
  // Same plate as a wall (so it reads as immovable), with a real platform surface
  // laid across it along the shape's two connectors. Dim while idle; it warms to the
  // full track colour and throws a glow the moment the runner's path latches onto it.
  function drawPlatform(pf, ts) {
    const x = cx(pf.c), y = cy(pf.r), s = cell, rad = tileR(s);
    const n = { c: pf.c, r: pf.r };
    const A = PF_VEC[pf.dirs[0]], B = PF_VEC[pf.dirs[1]];
    const S = tileSurface(n, { c: pf.c + A.x, r: pf.r + A.y }, { c: pf.c + B.x, r: pf.r + B.y });

    // the plinth — identical steel plate to a wall, so the eye reads "you can't build here"
    const g = plateGrad(ctx, x, y, s);
    rrect(x, y, s, s, rad); ctx.fillStyle = g; ctx.fill();
    ctx.save(); rrect(x, y, s, s, rad); ctx.clip();
    grainFill(x, y, s, s, 0.9);
    ctx.restore();
    platePanel(ctx, x, y, s, rad);
    const off = s*0.17, br = s*0.05;
    for (const [bx, by] of [[off,off],[s-off,off],[off,s-off],[s-off,s-off]]) {
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+bx, y+by, br, 0, Math.PI*2); ctx.fill();
    }

    const lit = pf.lit || 0;
    // NO platform body and no colour wash — a fixed platform is just the rail line, so
    // the steel plate stays fully visible and it never reads as a tile you could place.
    ctx.save();
    rrect(x, y, s, s, rad); ctx.clip();
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    // a recessed groove under the line so it reads as cast into the plate, not painted on
    ctx.strokeStyle = "rgba(26,28,38,0.45)";
    ctx.lineWidth = Math.max(4, s*0.10);
    ctx.beginPath(); railPath(S); ctx.stroke();

  function huntClaims(self) {

        // be a function of the wall clock, so every particle swam about long after it had left
        // him, and what should have been a wake read as a shoal.
        s.trail.push({ x: ri.sx + cell*(A.x*ca - A.y*sa),

  const TRAIL_MS = 2600, TRAIL_EVERY = 45;
  // Where the ribbon leaves him, in his own local frame (+x is travel, -y is up), in CELLS.
  // A swagger can hold the body a long way off its default height — float hovers above the
  // track, roll sits down on it, lean tips the whole body back about the feet, which both
  // lowers the body AND pushes it behind them — so a fixed offset detaches the ribbon from
  // the runner it is supposed to be coming out of.
  //
  // The stride bob IS in here, and the ripple it puts along the ribbon is the point: the trail
  // leaves his body, so when his body rises a step the ribbon has to rise with it or the two
  // come apart. Every term matches paintRunner exactly — the same bob, the same hop, the same
  // breathing hover — because the anchor is not an approximation of where he is, it is the
  // same sum arrived at twice.
  //
  // `phase` and `moving` are passed in rather than read: the shop figure runs a stride of its
  // own, off its own clock, and reading the level's would have the ribbon on the shop screen
  // bouncing to a runner nobody can see.
  function trailAnchor(ts, phase, moving) {
    const w = lookItem("swagger");
    const mul = (v, d) => (v == null ? d : v);
    if (phase == null) { phase = state ? state.runPhase : 0; moving = !!state && state.status === "play"; }
    const h0 = RUNNER.legLen + RUNNER.bodyH*0.5;         // body centre above the feet
    let bob = moving ? Math.abs(Math.sin(phase)) * RUNNER.bob * mul(w.bob, 1) : 0;
    if (w.hop && moving) bob += Math.max(0, Math.sin(phase)) * w.hop;    // one big bounce a stride
    const h = h0 + bob;                                  // bob lifts him along his OWN up, so it
    const L = w.lean || 0;                               // goes in before the lean is applied
    const hover = w.hover ? w.hover * (1 + 0.14*Math.sin(ts/430)) : 0;
    return { x: h*Math.sin(L), y: -(h*Math.cos(L) + hover) };

  // The ribbon: one polyline per stripe, offset along the path's own normal so the stripes
  // run parallel rather than nesting inside one another, and stroked segment by segment so
  // the tail can fade out instead of ending on a hard edge.
  function drawTrail() {
    const s = state, tr = lookItem("trail");
    if (!tr.cols || !s || !s.trail || s.trail.length < 2) return;
    const pts = s.trail, N = pts.length;
    const nor = pts.map((p, k) => {
      const a = pts[Math.max(0, k-1)], b = pts[Math.min(N-1, k+1)];
      let tx = b.x - a.x, ty = b.y - a.y; const m = Math.hypot(tx, ty) || 1;
      return { x: -ty/m, y: tx/m };

    const band = cell * RUNNER.bodyH;                 // exactly as deep as he is
    const n = tr.cols.length, sw = band / n;
    const T = performance.now();

    // ---- particles: no ribbon at all, just what he shed, thinning as it ages ----
    if (tr.style === "dots") {
      ctx.save();
      for (let k = 0; k < N; k++) {
        const u = k / (N - 1);                       // 0 at the tail, 1 at his heels
        // Scatter taken from the POINT, not from the clock and not from its index: the index
        // shifts as older points expire, which would crawl the pattern along the wake.
        const p = pts[k];
        const wob = tr.wobble ? (p.w || 0) * band * tr.wobble : 0;
        const nx = p.nx != null ? p.nx : nor[k].x, ny = p.ny != null ? p.ny : nor[k].y;
        const x = p.x + nx*wob, y = p.y + ny*wob;
        const r = band * (tr.dot || 0.16) * (tr.grow === false ? 1 : 0.30 + u*0.70);
        if (r < 0.4) continue;
        ctx.globalAlpha = Math.pow(u, tr.fade || 1.3) * 0.92;
        ctx.fillStyle = tr.cols[k % n];
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
      return;
    }
    // The ribbon used to be STROKED: each stripe a fat polyline, cut into ten chunks at ten
    // alphas, every chunk overlapping its neighbour by a point and every stripe overlapping
    // the next by 0.75px. Two semi-transparent things laid on top of each other are darker
    // than either, so both kinds of overlap drew themselves in as lines and the whole thing
    // read as a stack of chunks. Filled QUADS instead: each piece meets its neighbours on a
    // shared edge and never crosses one, so nothing is ever painted twice.
    const SEGS = 26;                                  // steps in the fade; nothing overlaps now
    ctx.save();
    // Both variations live here, in the one place that turns a point and an offset into a
    // position: `wobble` slides the whole ribbon side to side along its length, and `taper`
    // scales the offset toward the tail so the band narrows to nothing behind him.
    const at = (k, off) => {
      const wob = tr.wobble ? Math.sin(k*(tr.freq||0.5) + T/(tr.speed||200)) * band * tr.wobble : 0;
      const tp  = tr.taper ? (0.18 + 0.82*(k/(N-1))) : 1;
      return { x: pts[k].x + nor[k].x*(off*tp + wob), y: pts[k].y + nor[k].y*(off*tp + wob) };
    };
    for (let i = 0; i < n; i++) {
      // Sides get a hair of bleed so neighbouring stripes butt rather than leaving an
      // antialiased hairline of background between them. Colours differ, so the overlap
      // reads as a blend rather than the dark seam an alpha overlap would give.
      const lo = (i - n/2) * sw - 0.35, hi = (i - n/2 + 1) * sw + 0.35;
      ctx.fillStyle = tr.cols[i];
      for (let c = 0; c < SEGS; c++) {
        if (tr.dash && (c % 2)) continue;            // every other chunk left out
        const a = Math.round((N-1) * c / SEGS), b = Math.round((N-1) * (c+1) / SEGS);
        if (b <= a) continue;
        ctx.globalAlpha = Math.pow((c + 1) / SEGS, 1.4) * 0.92;   // oldest end nearly gone
        ctx.beginPath();
        for (let k = a; k <= b; k++) { const q = at(k, lo);
          if (k === a) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y); }
        for (let k = b; k >= a; k--) { const q = at(k, hi); ctx.lineTo(q.x, q.y); }
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  //
  // The three sine terms are prime-ish multiples of the angle so they never line up and repeat:
  // one big lobe, one medium, one small. Fixed phases, so it is the same cloud every time.
  function tileverseLayout(n) {
    const edgeAt = (th, base) => base * (1 + 0.20*Math.sin(3*th + 0.9)
                                           + 0.13*Math.sin(5*th - 2.1)
                                           + 0.07*Math.sin(7*th + 4.3));
    let found = [];
    for (let base = 1.5; base < 40; base += 0.12) {
      const R = Math.ceil(base * 1.5) + 2, out = [];
      for (let r = -R; r <= R; r++) for (let c = -R; c <= R; c++) {
        const d = Math.hypot(c, r);
        const slack = edgeAt(Math.atan2(r, c), base) - d;
        if (slack >= 0) out.push({ c, r, slack });

      if (out.length >= n) { found = out; break; }
    }
    if (found.length < n) return [];                     // never happens; a level list this big would not fit
    found.sort((a, b) => a.slack - b.slack);             // rim first
    found = found.slice(found.length - n);               // ...and the rim is what goes
    const minC = Math.min(...found.map(p => p.c)), minR = Math.min(...found.map(p => p.r));
    found.forEach(p => { p.c -= minC; p.r -= minR; });

        const afford = wallet.tiles >= it.cost;
        el.className = "tal" + (on ? " on" : "") + (have ? "" : " locked")
                             + (trying ? " preview" : "") + (trying && !afford ? " poor" : "");
