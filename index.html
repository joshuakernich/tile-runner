  const Sound = (() => {
    const BASE = 220;                          // A3, in Hz
    const WAVES  = ["sine", "sine"];           // lead timbre alternates per step
    // Melody notes per cleared tile. The tile clear itself gets the full detuned
    // two-oscillator voice; the three notes between clears are single-oscillator
    // and quieter, so the ear still hears the clear as the downbeat.
    const SUBDIV  = 4;
    const MID_VEL = 0.42;                      // in-between note level, vs 0.8 on the clear
    // Lead melody + chord loop — regenerated per level by setSong(seed).
    let MELODY = [0, 4, 7, 4,  9, 7, 4, 2,  0, 4, 7, 12,  9, 7, 4, 2];
    let CHORDS = [ {root:0,tones:[0,4,7]}, {root:5,tones:[5,9,12]}, {root:9,tones:[9,12,16]}, {root:7,tones:[7,11,14]} ];
    let KEY = 0, PROGUSED = 0;
    // The live music settings: the defaults with this level's `music` block laid over them.
    // Named MU rather than M because ambTick() already has a local M, and shadowing it there
    // would be a trap rather than a convenience.
    let MU = { ...MUSIC_DEFAULTS };
    const mhz = semi => MU.baseHz * Math.pow(2, semi/12);
    let delayN = null, fbN = null, dampN = null, wetN = null;
    // Everything the music makes leaves through here. The sound effects do not, which is what
    // lets a level end silence the backing — including notes still ringing, and at bgEvery 8
    // a background note can be ten seconds long — without muting the win jingle on top of it.
    let musicBus = null;
    const SCALES = {
      pentaMajor:[0,2,4,7,9,12,14],       // the shipped sound: open, bright, no wrong notes
      pentaMinor:[0,3,5,7,10,12,15],      // instantly tense — the saw-level sound
      dorian:    [0,2,3,5,7,9,10,12],     // minor with a raised 6th: melancholy but not grim
      aeolian:   [0,2,3,5,7,8,10,12],     // natural minor, the darkest of these
      lydian:    [0,2,4,6,7,9,11,12],     // major with a #4: floaty, dreamlike
      hirajoshi: [0,2,3,7,8,12,14,15],    // Japanese pentatonic, very distinctive
      blues:     [0,3,5,6,7,10,12,15],
      wholeTone: [0,2,4,6,8,10,12,14],    // no home note at all — unsettling, use sparingly
    };
    const PROGS = [
      [0,5,7,5], [0,7,9,7], [0,5,9,7], [0,9,5,7], [0,4,5,7],   // the five the game ships
      [0,3,8,7], [0,10,5,7], [0,8,3,5], [0,0,5,5],             // minor-leaning + a static one
    ];
    const CHORDS_T = {
      triad:[0,4,7], minor:[0,3,7], sus4:[0,5,7], sus2:[0,2,7],
      min7:[0,3,7,10], maj7:[0,4,7,11], add9:[0,4,7,14], fifth:[0,7],
    };
    const MINORISH = { pentaMinor:1, dorian:1, aeolian:1, blues:1, hirajoshi:1 };
    
    function chordIvls(){
      if (MU.chordType !== "auto") return CHORDS_T[MU.chordType] || CHORDS_T.triad;
      return MINORISH[MU.scale] ? CHORDS_T.minor : CHORDS_T.triad;
    }
    const ENV = pre => ({ a:+MU[pre+"A"], d:+MU[pre+"D"], s:+MU[pre+"S"], r:+MU[pre+"R"] });
    function adsr(g, t, dur, vel, E){
      const v = Math.max(0.0002, vel);
      let a = Math.max(0.002, E.a), d = Math.max(0.002, E.d), r = Math.max(0.004, E.r);
      // A sustain of zero is a struck voice: attack, then ONE decay that dies inside the note.
      // The decay is capped by the note rather than fixed, which is what makes a short note snap
      // and a long one ring — the same shape every voice in this game had before it had an
      // envelope at all. Release has nothing left to do, so it sits this case out.
      if (E.s <= 0.0005) {
        const aa = Math.min(a, dur*0.5), dd = Math.min(d, Math.max(0.004, dur - aa));
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(v, t + aa);
        g.gain.exponentialRampToValueAtTime(0.0006, t + aa + dd);
        return aa + dd;
      }
      // An envelope has to fit inside its own note. Unclamped, a long decay made a SHORT note
      // ring on well past the next one — the notes filling the gaps between tile clears are a
      // fifth of a beat each, and a 0.9s tail on those is a smear, not a melody.
      const need = a + d + r;
      if (need > dur) { const k = dur / need; a *= k; d *= k; r *= k; }
      const sv = Math.max(0.0002, v * Math.min(1, Math.max(0, E.s)));
      const rel = Math.max(a + d, dur - r);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + a);
      g.gain.exponentialRampToValueAtTime(sv, t + Math.min(a + d, rel));
      g.gain.setValueAtTime(sv, t + rel);
      g.gain.exponentialRampToValueAtTime(0.0006, t + rel + r);
      return rel + r;                                     // how long the note actually runs for
    }
    const VOWELS = {
      ah: [[800,1150,2900],[1.00,0.50,0.25]],
      oo: [[325, 700,2530],[1.00,0.35,0.12]],
      oh: [[500,1000,2400],[1.00,0.45,0.18]],
      ee: [[270,2300,3000],[1.00,0.60,0.30]],
      eh: [[530,1850,2500],[1.00,0.55,0.22]],
    };
    const VOX_STYLES = {
      choir:    { vowels:["ah","oh"], wave:"sawtooth", voices:[-14,-5,5,14], oct:  0, q:7, sh:1.0 },
      nebula:   { vowels:["oo","ah"], wave:"sawtooth", voices:[-20,-7,7,20], oct:  0, q:5, sh:1.6 },
      monolith: { vowels:["oh","oo"], wave:"sawtooth", voices:[-9,-3,3,9],   oct:-12, q:9, sh:0.4 },
      aurora:   { vowels:["eh","ee"], wave:"triangle", voices:[-16,-6,6,16], oct: 12, q:6, sh:2.0 },
    };
    const _curves = {};
    function driveCurve(amt){
      const k = Math.round(Math.max(0.001, amt)*80);
      if (_curves[k]) return _curves[k];
      const n = 1024, c = new Float32Array(n);
      for (let i=0;i<n;i++){ const x = i*2/n - 1; c[i] = (1+k)*x/(1+k*Math.abs(x)); }
      return (_curves[k] = c);
    }
    function voxVoice(t, semi, dur, vel){
      const S = VOX_STYLES[MU.voxStyle] || VOX_STYLES.choir;
      const A = VOWELS[S.vowels[0]], B = VOWELS[S.vowels[1]], u = MU.voxVowel;
      const f = mhz(semi + S.oct);
      const out = ac.createGain();
      dur = adsr(out, t, dur, vel, ENV("bg"));
      out.connect(musicBus);
      if (MU.voxWet > 0){ const w = ac.createGain(); w.gain.value = MU.voxWet; out.connect(w); w.connect(sendBus); }
    
      // the singers, all sharing one vibrato so they breathe together rather than fight
      const raw = ac.createGain(); raw.gain.value = 1/(S.voices.length+1);
      const lfo = ac.createOscillator(); lfo.type="sine"; lfo.frequency.value = MU.voxVib;
      const lfoG = ac.createGain(); lfoG.gain.value = MU.voxVibDepth;
      lfo.connect(lfoG); lfo.start(t); lfo.stop(t+dur+0.1);
      const spread = MU.voxSpread/14;
      for (const c of S.voices){
        const o = ac.createOscillator(); o.type = S.wave;
        o.frequency.setValueAtTime(f, t); o.detune.setValueAtTime(c*spread, t);
        lfoG.connect(o.detune);
        o.connect(raw); o.start(t); o.stop(t+dur+0.1);
      }
      if (MU.voxShimmer > 0){                      // the octave-up ghost
        const o = ac.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(f*2, t);
        const g = ac.createGain(); g.gain.value = MU.voxShimmer*S.sh*0.18;
        lfoG.connect(o.detune);
        o.connect(g); g.connect(raw); o.start(t); o.stop(t+dur+0.1);
      }
      for (let i=0;i<3;i++){                      // the formant bank — the voice itself
        const bp = ac.createBiquadFilter(); bp.type="bandpass";
        bp.frequency.value = A[0][i]*(1-u) + B[0][i]*u;
        bp.Q.value = S.q;
        const g = ac.createGain(); g.gain.value = A[1][i]*(1-u) + B[1][i]*u;
        raw.connect(bp); bp.connect(g); g.connect(out);
      }
      const body = ac.createGain(); body.gain.value = 0.18;   // a little raw tone underneath, or
      raw.connect(body); body.connect(out);                    // the formants sound hollow
    }
    function bassHeavy(t, semi, dur, vel){
      const style = MU.bassStyle, f = mhz(semi);
      const out = ac.createGain();
      dur = adsr(out, t, dur, vel, ENV("bas"));
      const lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.Q.value = 1.1;
      lp.frequency.setValueAtTime(MU.bassLpf*2.2, t);                       // a filter sweep down
      lp.frequency.exponentialRampToValueAtTime(Math.max(60, MU.bassLpf), t+Math.max(0.05,dur*0.5));
      out.connect(lp); lp.connect(musicBus);
      const sub = ac.createOscillator(); sub.type="sine";
      sub.frequency.setValueAtTime(f*(1 + MU.bassGlide*2), t);              // dips into pitch
      sub.frequency.exponentialRampToValueAtTime(f, t+Math.max(0.01, MU.bassGlide));
      const sg = ac.createGain(); sg.gain.value = MU.bassSubVel;
      sub.connect(sg); sg.connect(out); sub.start(t); sub.stop(t+dur+0.06);
      if (style !== "rumble"){
        const b = ac.createOscillator(); b.type = style==="growl" ? "square" : "sawtooth";
        b.frequency.setValueAtTime(f*2, t);
        if (style === "growl"){                                            // FM snarl
          const mod = ac.createOscillator(); mod.type="sine"; mod.frequency.value = f*MU.bassFM;
          const mg = ac.createGain(); mg.gain.value = f*1.8;
          mod.connect(mg); mg.connect(b.frequency); mod.start(t); mod.stop(t+dur+0.06);
        }
        const sh = ac.createWaveShaper(); sh.curve = driveCurve(MU.bassDrive); sh.oversample="2x";
        const bg = ac.createGain(); bg.gain.value = style==="deep" ? 0.55 : 0.42;
        b.connect(sh); sh.connect(bg); bg.connect(out); b.start(t); b.stop(t+dur+0.06);
      }
    }
    function bgNotes(s, chord){
      if (MU.bgFollow === "chord") return chord.tones;
      // "melody" walks the tune at the background's own pace — one melody note per background
      // note. "lead" reads the note the melody is actually on at that instant, which is the
      // literal match but can land on the same note every time: the tune loops every
      // MELODY.length/beatsPerTile beats (8, as shipped), so any bgEvery that is a multiple of
      // that samples the same point of the loop forever. That is a drone, which may well be what
      // you want under a melody — but it is worth knowing which one you have chosen.
      const idx = MU.bgFollow === "melody"
        ? Math.floor(s / Math.max(1, MU.bgEvery|0))
        : s * MU.beatsPerTile;
      const lead = MELODY[((idx % MELODY.length) + MELODY.length) % MELODY.length];
      if (MU.bgFollow === "lead" || MU.bgFollow === "melody") return [lead];
      const out = [lead];                                    // leadChord: melody on top, chord under
      for (const tn of chord.tones) if ((((tn - lead) % 12) + 12) % 12 !== 0) out.push(tn);
      return out;
    }
    let ac = null, master = null, sendBus = null, noiseBuf = null;
    let warpDry = null, warpWet = null, warpLfo = null;
    let muted = false, step = 0, beatSec = 1.15;

    // Pick a fresh melody + chord progression from a seed (each level differs). This is
    // the music lab's buildSong, verbatim — tools/check.mjs holds the two to each other.
    function setSong(seed){
      const rnd = mulberry32((seed>>>0)||1);
      const SC = SCALES[MU.scale] || SCALES.pentaMajor;
      const tr0 = [-5,-3,0,0,2,4,5,7][Math.floor(rnd()*8)];
      KEY = MU.keyLock ? MU.key : tr0;
      let d = MU.melodyStart >= 0 ? MU.melodyStart : 2 + Math.floor(rnd()*3);
      if (MU.melodyStart >= 0) rnd();                       // keep the call order stable
      MELODY = [];
      for (let i=0;i<32;i++){
        d += Math.floor(rnd()*3)-1;
        if (rnd() < MU.melodyLeap) d += Math.floor(rnd()*3)-1;
        d = Math.max(0, Math.min(SC.length-1, d));
        MELODY.push(SC[d] + KEY);
      }
      const pi = Math.floor(rnd()*5);
      PROGUSED = MU.prog >= 0 ? (MU.prog % PROGS.length) : pi;
      const iv = chordIvls();
      CHORDS = PROGS[PROGUSED].map(r => ({ root:r+KEY, tones: iv.map(x=>r+KEY+x) }));
    }

    function ensure() {
      if (ac) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = MU.master;
      musicBus = ac.createGain(); musicBus.gain.value = 1; musicBus.connect(master);
      ambBus  = ac.createGain(); ambBus.gain.value  = 1; ambBus.connect(master);
      // Everything leaves through one of two legs. Dry is the normal one. Wet runs the whole
      // mix through a modulated delay (a delay whose length wobbles IS a pitch wobble, which
      // is what a warped tape sounds like), then a distortion curve, then a lowpass whose
      // corner sways — the Mushroom. warp() crossfades between the two.
      warpDry = ac.createGain(); warpDry.gain.value = 1;
      warpWet = ac.createGain(); warpWet.gain.value = 0;
      master.connect(warpDry); warpDry.connect(ac.destination);
      const wd = ac.createDelay(0.2); wd.delayTime.value = 0.035;
      const shaper = ac.createWaveShaper();
      const curve = new Float32Array(1024);                        // a soft-clip fold
      for (let i = 0; i < 1024; i++) { const v = i/511.5 - 1; curve[i] = Math.tanh(v*3.2)*0.72; }
      shaper.curve = curve; shaper.oversample = "2x";
      const wlp = ac.createBiquadFilter(); wlp.type = "lowpass";
      wlp.frequency.value = 1400; wlp.Q.value = 6;
      master.connect(wd); wd.connect(shaper); shaper.connect(wlp);
      wlp.connect(warpWet); warpWet.connect(ac.destination);
      warpLfo = ac.createOscillator(); warpLfo.type = "sine"; warpLfo.frequency.value = 2.4;
      const wg = ac.createGain(); wg.gain.value = 0.011;           // +/- 11ms of wobble
      warpLfo.connect(wg); wg.connect(wd.delayTime);
      const flt = ac.createOscillator(); flt.type = "sine"; flt.frequency.value = 0.7;
      const fg = ac.createGain(); fg.gain.value = 900;
      flt.connect(fg); fg.connect(wlp.frequency);
      warpLfo.start(); flt.start();
      // Damped feedback delay = a ringing echo tail so tones resonate.
      const delay = ac.createDelay(1.0); delay.delayTime.value = MU.delayTime;
      const fb    = ac.createGain();     fb.gain.value = MU.feedback;   // echo regeneration
      const damp  = ac.createBiquadFilter(); damp.type = "lowpass"; damp.frequency.value = MU.damp;
      const wet   = ac.createGain();     wet.gain.value = MU.wet;       // echo level into mix
      delayN = delay; fbN = fb; dampN = damp; wetN = wet;           // ...so setMusic can retune them
      delay.connect(damp); damp.connect(fb); fb.connect(delay);     // feedback loop, softened
      delay.connect(wet);  wet.connect(master);
      sendBus = delay;                                              // tonal voices feed the echo
      // A short noise buffer reused for the hi-hat.
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.2), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    }
    // Must be triggered from a user gesture so iOS/Safari unlocks audio.
    function unlock() {
      if (!ensure()) return;
      if (ac.state !== "running") ac.resume();
      // iOS needs an actual sound started inside the gesture to fully wake the context
      try {
        const b = ac.createBufferSource();
        b.buffer = ac.createBuffer(1, 1, ac.sampleRate);
        b.connect(ac.destination); b.start(0);
      } catch (_) {}
      ambientResume();          // the title asks for music before a gesture is allowed
    }
    // iOS suspends the audio context when the app is backgrounded / the phone locks — wake it on return
    if (typeof document !== "undefined") {
      const wake = () => { if (ac && ac.state !== "running") ac.resume(); };
      document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
      window.addEventListener("focus", wake);
      window.addEventListener("pageshow", wake);
    }
    // The music's voices. Deliberately separate from voice()/the SFX below: those are fixed
    // sounds with hand-written envelopes, while these are the ones the lab drives, and they
    // take an envelope NAME rather than an attack time.
    function mvoice(t, semi, wave, dur, vel, pre, wet, mono){
      const g = ac.createGain();
      dur = adsr(g, t, dur, vel, ENV(pre || "lead"));
      for (const cents of (mono ? [0] : [-6,6])){
        const o = ac.createOscillator(); o.type = wave;
        o.frequency.setValueAtTime(mhz(semi), t); o.detune.setValueAtTime(cents, t);
        o.connect(g); o.start(t); o.stop(t+dur+0.05);
      }
      g.connect(musicBus); if (wet) g.connect(sendBus);
    }
    function mbass(t, semi, dur, vel){
      const f = mhz(semi);
      const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=MU.bassLpf; lp.Q.value=0.9;
      const g=ac.createGain();
      dur = adsr(g, t, dur, vel, ENV("bas"));
      const sub=ac.createOscillator(); sub.type="sine";
      sub.frequency.setValueAtTime(f*1.5,t); sub.frequency.exponentialRampToValueAtTime(f,t+0.06);
      const body=ac.createOscillator(); body.type="triangle"; body.frequency.setValueAtTime(f*2,t);
      const bg=ac.createGain(); bg.gain.value=0.45;
      sub.connect(g); body.connect(bg); bg.connect(g); g.connect(lp); lp.connect(musicBus);
      sub.start(t); sub.stop(t+dur+0.05); body.start(t); body.stop(t+dur+0.05);
    }
    function mkick(t, vel){
      const o=ac.createOscillator(), g=ac.createGain();
      const E=ENV("kick"), dur=E.a+E.d+E.r;
      o.type="sine"; o.frequency.setValueAtTime(MU.kickHz,t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20,MU.kickDrop), t+Math.max(0.02,dur*0.7));
      adsr(g, t, dur, vel, E);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+dur+0.05);
    }
    function mhat(t, vel){
      if (!noiseBuf) return;
      const src=ac.createBufferSource(); src.buffer=noiseBuf;
      const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=MU.hatHz;
      const g=ac.createGain();
      const E=ENV("hat"), dur=E.a+E.d+E.r;
      adsr(g, t, dur, vel, E);
      src.connect(hp); hp.connect(g); g.connect(musicBus); src.start(t); src.stop(t+dur+0.03);
    }
    // A snare: noise for the crack, a short falling body underneath so it lands rather than
    // hisses. The game had a kick and a hat and nothing in between, and a count-in needs the
    // back-beat or it is just a pulse.
    function msnare(t, vel) {
      if (!noiseBuf) return;
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1500;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0004, vel), t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0006, t + 0.155);
      src.connect(hp); hp.connect(g); g.connect(musicBus);
      src.start(t); src.stop(t + 0.20);
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(215, t);
      o.frequency.exponentialRampToValueAtTime(125, t + 0.075);
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(Math.max(0.0004, vel*0.55), t + 0.004);
      og.gain.exponentialRampToValueAtTime(0.0006, t + 0.10);
      o.connect(og); og.connect(musicBus); o.start(t); o.stop(t + 0.13);
    }
    // The count-in, played over the opening pan and the character assembling. It runs on the
    // same beat grid the backing already keeps, so when he finally sets off — on a beat — he
    // sets off in the pocket this has been marking out. Independent of the level's kickOn and
    // hatOn: those describe the arrangement, and this is the count that precedes it.
    function introDrums(t, s) {
      const b = s % 4, B = beatSec;
      if (b === 0 || b === 2) mkick(t, 0.55);
      // Snares on the back-beat and again between every beat — a roll rather than a pulse, so
      // the count-in has somewhere to build to instead of just marking time.
      msnare(t + B*0.5, 0.20);

  const RAMP_PER_TILE = 0.005;   // tiles/sec added per clear
  const RAMP_MAX_CPS  = 3.0;     // hard ceiling — past this the animation stops reading
  const VERSION = "v10.6";                    // shown on the title & pause screens
  // Canvas twin of the CSS --font. Canvas never triggers a webfont fetch on its own —
  // only DOM text does — and most of the UI text lives inside panels that are hidden
  // at boot, so without this nudge the canvas would draw in the fallback face until some
  // DOM text forced the fetch. Everything redraws each frame, so it swaps in on arrival.
  const UI_FONT = "'SquareFont','Fraunces',ui-serif,Georgia,serif";
  if (document.fonts && document.fonts.load) document.fonts.load("900 100px SquareFont");
  const DEFAULT_CPS = 0.8;                    // fallback only — every shipped level sets its own L.cps
  // The player's own starting pace, which OVERRIDES whatever a level declares. Six steps, and
  // the middle of them is what every shipped level already runs at, so the default changes
  // nothing. Literal values rather than an arithmetic ramp: 0.5 + 0.1 is not 0.6 in binary,
  // and a stepper that compares its stored value against the list has to find it there.
  const START_CPS = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0];
  const startCps = () => START_CPS.indexOf(settings.startCps) >= 0 ? settings.startCps : DEFAULT_CPS;
  const GATE_COLORS = ["#7dff6b", "#ff9e4d", "#c77dff"];   // per switch/door group (button, wire, door seam)
  // collected boost / slow pickups apply a time-limited speed effect
  const BOOST_MULT = 1.8, SLOW_MULT = 0.5, BOOST_MS = 3000, SLOW_MS = 2600;
  const SPEED_CHARM_MS = 500;
  // The Millstone's sit, declared up here because the charm's own `ms` names it and TALISMANS is
  // built before any of the drawing below exists. Down, held, up, and a beat on his feet.
  const REST = { down: 380, still: 1500, up: 380, settle: 260 };
  const REST_MS = REST.down + REST.still + REST.up + REST.settle;
  const REST_TEMPO = 6;                   // how many times slower the track gets at the bottom
  const REST_SINK  = 0.10;                // how far he settles toward the track, fraction of a cell
  const REVEAL_MS = 5000;                  // how long the Wayfinder shows the way      // the Spur and the Millstone, in ms — half a second each
  const REVIVE_HOLD_MS = 3000;     // how long the Ankh stands him still after bringing him back
  const COIN_BONUS = 5;                      // score value per coin
  const levelAttempts = {};                  // how many times each level has been started this session
  // level score = final combo length + coin bonus − number of attempts
  function computeScore() {
    const s = state; if (!s) return 0;
    return Math.max(0, s.combo + s.coinsGot * COIN_BONUS - (s.attempts || 1));
  }
  // ---------- Talismans ---------------------------------------------------
  // A set of unique collectibles. Passing over one unlocks it forever; an unlocked
  // talisman can be worn round the runner's neck from the menu. Cosmetic for now —
  // `perk` is the hook for giving one an effect later without reshaping any of this.
  // A talisman is a WORN CHARM that grants one power per level — armed when you start the
  // level, spent the moment you press the button at the bottom of the screen. One per level
  // is what keeps it a decision rather than a crutch: the interesting question is which
  // moment in a level is worth spending it on, not whether to spend it at all.
  //
  //   ms    how long the effect runs; 0 means it stays armed until it is spent on something
  //   blurb one line, shown on the button and in the talisman screen
  const TALISMANS = [

    // A lodestone is magnetite that has been struck by lightning and come out magnetic — which
    // is what this is. The name was on the charm below until this one earned it.
    { id:"magnet", name:"Lodestone", col:"#ff6d6d", ms:3000,
      face:"#f2685f", edge:"#8f2820",
      blurb:"Pulls coins in",
      etch:(g,x,y,r)=>{
        g.lineCap="butt"; g.lineWidth=r*0.28;                    // a horseshoe: half-ring, two legs
        g.beginPath(); g.arc(x, y-r*0.08, r*0.46, Math.PI, 0); g.stroke();
        g.beginPath();
        g.moveTo(x-r*0.46, y-r*0.08); g.lineTo(x-r*0.46, y+r*0.52);
        g.moveTo(x+r*0.46, y-r*0.08); g.lineTo(x+r*0.46, y+r*0.52);
        g.stroke(); } },

    // The id stays "finger": it is written into level 16's data, into the editor's picker and
    // into every save that has unlocked it, and none of that is worth churning for a name only
    // the player ever sees.
    { id:"finger", name:"Hammer of God", col:"#ffe9a8", ms:0,
      face:"#e8dcc0", edge:"#8d7c58",
      blurb:"A fell voice that shatters stone",
      etch:(g,x,y,r)=>{
        // A sledge, head-on: a broad head with the haft hanging from the middle of it. The
        // two overlap by a hair so they fill as one solid silhouette rather than a head
        // balanced on a stick — at badge size a gap between them reads as a join coming apart.
        const rr=(X,Y,W,H,R)=>{ g.beginPath(); g.moveTo(X+R,Y);
          g.arcTo(X+W,Y,X+W,Y+H,R); g.arcTo(X+W,Y+H,X,Y+H,R);
          g.arcTo(X,Y+H,X,Y,R); g.arcTo(X,Y,X+W,Y,R); g.closePath(); g.fill(); };
        // The head is a WEDGE, not a bar: a flat striking face on the left tapering to a peen
        // on the right, and deep enough to outweigh the haft two to one. A rectangular head on
        // a haft of similar width is not a hammer at badge size — it is the letter T.
        g.beginPath();
        g.moveTo(x-r*0.68, y-r*0.74); g.lineTo(x+r*0.62, y-r*0.60);
        g.lineTo(x+r*0.62, y-r*0.14); g.lineTo(x-r*0.68, y-r*0.00);
        g.closePath(); g.fill();
        // The haft runs THROUGH the head rather than stopping under it: a stub of it shows
        // above the top edge, which is the notch every real sledge has where the handle is
        // wedged home. Same rectangle as before, started higher — nothing is added, so the
        // two still fill as one silhouette and there is no join to come apart. The head's top
        // is sloped, so what shows is a small wedge rather than a flat tab, which is exactly
        // what you would see looking at one head-on.
        rr(x-r*0.13, y-r*0.80, r*0.26, r*1.50, r*0.10); } },

    { id:"brake", name:"Millstone", col:"#9aa3b8", ms:REST_MS,
      face:"#8b95ab", edge:"#3a4152",
      blurb:"Slows the heart and body",
      etch:(g,x,y,r)=>{
        // A SILHOUETTE: one solid stone with its eye and its dressing grooves cut OUT of it,
        // rather than a thin ring with spokes laid across it and a solid square in the middle
        // where the hole should be. Everything else on the shelf is a filled shape — the
        // sledge, the bell, the cap of the mushroom — and a 0.12r stroke is the first thing to
        // go at badge size.
        //
        // ONE path, filled even-odd: inside the eye or a groove the count is two, so it reads
        // as a hole. That is also why the grooves stop short of the rim — run past it and the
        // part outside the stone is crossed once, which fills instead of cutting.
        // The outer radius matches what the ring measured with its stroke, so the motif keeps
        // exactly the footprint it had.
        const R = r*0.72, eye = r*0.17, w = r*0.085, i0 = r*0.30, i1 = r*0.62;
        g.beginPath();
        g.arc(x, y, R, 0, Math.PI*2);                       // the stone
        g.rect(x - eye, y - eye, eye*2, eye*2);             // ...its square eye, punched through
        for (let k = 0; k < 4; k++) {                       // ...and four dressing grooves
          const a2 = k/4*Math.PI*2 + Math.PI/4;
          const ux = Math.cos(a2), uy = Math.sin(a2), px = -uy, py = ux;
          g.moveTo(x + ux*i0 + px*w, y + uy*i0 + py*w);
          g.lineTo(x + ux*i1 + px*w, y + uy*i1 + py*w);
          g.lineTo(x + ux*i1 - px*w, y + uy*i1 - py*w);
          g.lineTo(x + ux*i0 - px*w, y + uy*i0 - py*w);
          g.closePath();
        }
        g.fill("evenodd"); } },

    // The one charm you do not choose the moment for. Pressing it ARMS it — like the Hammer,
    // which also waits for something to happen rather than running on a clock — and it is
    // spent the instant the run would have ended, putting him back on the last tile he stood
    // on and holding him there while you work out what went wrong.
    { id:"ankh", name:"Ankh", col:"#7ee0c8", ms:0,
      face:"#63cbb1", edge:"#1f5f50",
      blurb:"A second chance to die",
      etch:(g,x,y,r)=>{
        // A SILHOUETTE, like the sledge and the stone: filled, not traced. Three shapes wound
        // the same way and one wound the other, filled NON-ZERO — so where the shaft runs up
        // into the ring they merge into one solid object, and only the counter-wound circle
        // punches a hole. Even-odd would have cancelled every overlap into a hole instead.
        //
        // The loop stays ROUND; everything below it is square. That is the shape an ankh is,
        // and the one curve on the shelf earns its place by being the thing that names it.
        const CY = y - r*0.46, RO = r*0.34, RI = r*0.17;   // the loop, and its eye
        const AX = r*0.60, C0 = y - r*0.02, C1 = y + r*0.24;   // the arms
        const SW = r*0.15, ST = y - r*0.26, SY = y + r*0.86;   // the shaft
        g.beginPath();
        g.arc(x, CY, RO, 0, Math.PI*2);                   // the loop
        g.rect(x - AX, C0, AX*2, C1 - C0);                // the arms
        g.rect(x - SW, ST, SW*2, SY - ST);                // the shaft, tucked up into the ring
        // Counter-wound, so it subtracts. It stops short of the shaft's head — a hole the
        // shaft reached into would be wound twice and fill straight back in.
        g.arc(x, CY, RI, 0, Math.PI*2, true);
        g.fill(); } },

    { id:"pulse", name:"Bell of Unmaking", col:"#c9b6ff", ms:0,
      face:"#b49df5", edge:"#4a3080",
      blurb:"A mighty scream to unmake monsters",
      etch:(g,x,y,r)=>{
        // A BELL. It used to be three rings going out from a struck centre — the shape of the
        // thing it does rather than the thing itself, which is the better rule in general, but
        // concentric arcs are also what "sound" looks like everywhere, so it read as a speaker
        // rather than as the object the charm is named for.
        //
        // Four parts, all solid: crown, body, lip, clapper. The body is ONE filled path — a
        // dome whose sides flare out to the lip — because at badge size an outlined bell fills
        // in anyway and a stroke only costs you the shape of the flare.
        //
        // A size down on the rest of the family: a bell is WIDE at the lip, and drawn to the
        // same radius as the ankh's arms or the magnet's legs it came out the biggest motif on
        // the shelf. Scaling the radius shrinks the whole thing about the badge's centre, so
        // every proportion below is left alone.
        r *= 0.86;
        const top = y - r*0.62, lipY = y + r*0.40, halfW = r*0.62;
        g.beginPath(); g.arc(x, top - r*0.10, r*0.13, 0, 7); g.fill();       // the crown loop
        g.beginPath();                                                        // the body
        g.moveTo(x - halfW, lipY);
        // Up the left side: out to the shoulder, then in to the crown. Two curves rather than
        // one, so the waist is a waist — a single quadratic gives a plain cone.
        g.quadraticCurveTo(x - r*0.52, y - r*0.14, x - r*0.30, top);
        g.quadraticCurveTo(x - r*0.16, top - r*0.13, x, top - r*0.13);
        g.quadraticCurveTo(x + r*0.16, top - r*0.13, x + r*0.30, top);
        g.quadraticCurveTo(x + r*0.52, y - r*0.14, x + halfW, lipY);
        g.closePath(); g.fill();
        // The lip: a straight bar a shade wider than the body, which is what stops a bell
        // reading as a hood.
        g.beginPath(); g.rect(x - r*0.72, lipY, r*1.44, r*0.17); g.fill();
        g.beginPath(); g.arc(x, lipY + r*0.34, r*0.15, 0, 7); g.fill(); } },  // the clapper

    { id:"mush", name:"Mushroom", col:"#ff8fc8", ms:0,
      face:"#ff7fb8", edge:"#9e2a60",
      blurb:"A gift from the Gods",
      etch:(g,x,y,r)=>{
        g.beginPath();                                           // stem
        g.moveTo(x-r*0.22, y-r*0.04); g.lineTo(x+r*0.22, y-r*0.04);
        g.lineTo(x+r*0.17, y+r*0.62); g.lineTo(x-r*0.17, y+r*0.62);
        g.closePath(); g.fill();
        g.beginPath();                                           // cap
        g.ellipse(x, y-r*0.02, r*0.76, r*0.56, 0, Math.PI, 0); g.fill();

    // Each is the golden tile in its own metal, with the motif cut into the face — see

    { id:"clock", name:"Hands of Time", col:"#8fd8ff", ms:1000,

      blurb:"Stops you dead for a second",

        g.beginPath(); g.arc(x,y,r*0.70,0,7); g.stroke();       // the case
        g.lineWidth=r*0.09;
        for(let k=0;k<4;k++){ const a=k/4*Math.PI*2;            // quarter ticks only: twelve of
          g.beginPath();                                        // them silt up at this size
          g.moveTo(x+Math.cos(a)*r*0.46, y+Math.sin(a)*r*0.46);
          g.lineTo(x+Math.cos(a)*r*0.58, y+Math.sin(a)*r*0.58); g.stroke(); }
        g.lineWidth=r*0.13;                                     // ten past ten, as clocks always are

    { id:"star", name:"Cloak of Light", col:"#ffd24a", ms:3000,
      face:"#ffab2e", edge:"#a55600",
      blurb:"Shrug off hazards",
      etch:(g,x,y,r)=>{
        g.beginPath();
        for(let k=0;k<10;k++){ const a=-Math.PI/2 + k*Math.PI/5, rad = k%2 ? r*0.32 : r*0.74;

        g.closePath(); g.fill(); } },

    // Instant, like the Hammer: ms 0, so it does its work the moment it is pressed rather

    { id:"rewind", name:"Tape of Regret", col:"#9ad9b0", ms:0,

      blurb:"Back up two tiles",
      etch:(g,x,y,r)=>{
        for (const dx of [0.10, -0.52]){
          g.beginPath();

        g.lineCap="round"; g.lineJoin="round"; g.lineWidth=r*0.15;
        for (const dx of [-0.44, 0.02, 0.48]) {          // three chevrons, pointing the way on
          g.beginPath();
          g.moveTo(x + r*(dx-0.16), y - r*0.44);
          g.lineTo(x + r*(dx+0.20), y);

    // The only charm that gives you nothing but INFORMATION. The arrows pointing off-screen at
    // the exit and at any key used to be on permanently, which answered the level's one standing
    // question — where am I going — before it had been asked. Now the board keeps its secret and

    // Its id is still `lode` — it is written into levels.js and into saved games, and an id is

    { id:"lode", name:"Wayfinder", col:"#8fe3c0", ms:REVEAL_MS,
      face:"#79cfae", edge:"#2c6b55",
      blurb:"Shows you the way, briefly",
      etch:(g,x,y,r)=>{
        // a compass needle: two struck triangles about a hub, pointing off somewhere
        const a = -Math.PI*0.28, ux = Math.cos(a), uy = Math.sin(a);
        const px2 = -uy, py2 = ux;                       // across the needle
        const tip = r*0.86, tail = r*0.62, half = r*0.20;
        const tri = (sx, sy, w) => { g.beginPath();
          g.moveTo(x + ux*sx, y + uy*sy);
          g.lineTo(x + px2*w, y + py2*w);
          g.lineTo(x - px2*w, y - py2*w);

  // One painter for all five. Each keeps its own metal; the shape, the shading and the
  // engraving are shared, so a talisman can never drift into looking like a different class
  // of object from the coin it sits next to on the board.
  // Shelved for now. A charm named here is out of the game entirely — off the shelf, off the
  // rack at the foot of a level, un-fireable, and skipped if a level tries to place one on the
  // board. One list rather than a flag on each, so putting them back is deleting a word.
  // Held back — drawn nowhere, placeable nowhere, and forgotten from any save that still names
  // one. The six that ship are the six at the top of TALISMANS, in the order they appear there.
  const TAL_OFF = new Set(["clock", "rewind", "star", "spur", "lode"]);
  const talLive = t => !TAL_OFF.has(typeof t === "string" ? t : t.id);
  TALISMANS.forEach(t => { t.draw = (g, x, y, r) => talBadge(g, x, y, r, t); });
  const talById = id => TALISMANS.find(t => t.id === id) || null;
  const TAL_KEY = "tilerunner:talismans";
  function loadTalismans(){ try { return new Set(JSON.parse(localStorage.getItem(TAL_KEY)) || []); } catch(_){ return new Set(); } }
  function saveTalismans(set){ try { localStorage.setItem(TAL_KEY, JSON.stringify([...set])); } catch(_){} }
  let talUnlocked = loadTalismans();
  {                                          // the set changed — forget ids that no longer exist
    const live = new Set(TALISMANS.map(t => t.id));
    let dropped = false;
    for (const id of [...talUnlocked]) if (!live.has(id)) { talUnlocked.delete(id); dropped = true; }
    if (dropped) saveTalismans(talUnlocked);
  }
  function unlockTalisman(id){ if (talUnlocked.has(id)) return false; talUnlocked.add(id); saveTalismans(talUnlocked); return true; }
  // the pendant currently worn (an id, or null)
  function wornTalisman(){ const w = settings.talisman;
    return w && talLive(w) && talUnlocked.has(w) ? talById(w) : null; }

  const BEST_KEY = "tilerunner:best";
  function loadBest(){ try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch(_){ return {}; } }
  function saveBest(o){ try { localStorage.setItem(BEST_KEY, JSON.stringify(o)); } catch(_){} }
  const SET_KEY = "tilerunner:settings";
  function loadSettings(){
    let o; try { o = JSON.parse(localStorage.getItem(SET_KEY)) || {}; } catch(_){ o = {}; }
    // Two shop categories were renamed. The stored wardrobe is keyed by category, so without
    // this everyone silently loses whatever they were wearing in those two and reverts to the
    // first item — a rename should never cost a player something they bought.
    if (o.look) {
      if (o.look.shoes  != null && o.look.kicks == null) o.look.kicks = o.look.shoes;
      if (o.look.colour != null && o.look.drip  == null) o.look.drip  = o.look.colour;
      delete o.look.shoes; delete o.look.colour;
    }
    return o;
  }
  function saveSettings(){ try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch(_){} }
  const settings = loadSettings();
  let paused = false;
  let titleActive = true;               // the attract/title screen is up before the first play
  // The very first launch gets a different title: no runner, because there is no runner yet —
  // the opening is about him arriving. It is the same screen otherwise, over the same cosmos
  // the opening happens in, and it asks for the one thing that has not happened yet.
  const CINE_SEEN_KEY = "tilerunner:cine";
  const cineSeen = () => { try { return localStorage.getItem(CINE_SEEN_KEY) === "1"; } catch(_) { return true; } };
  const markCineSeen = () => { try { localStorage.setItem(CINE_SEEN_KEY, "1"); } catch(_) {} };
  const firstLaunch = () => !cineSeen();
  let colorblind = !!settings.colorblind;
  // gameplay colours that need colorblind-safe alternates (Okabe–Ito)
  function pal(k){
    if (!colorblind) return ({ boost:"#7dff6b", slow:"#ff9e4d", saw:"#ff4d6d", sw:"#7dff6b", swOff:"#4a7d3a", gate:"#d7ff6b" })[k];
    return ({ boost:"#009e73", slow:"#e69f00", saw:"#d55e00", sw:"#009e73", swOff:"#33684f", gate:"#f0e442" })[k];
  }
  function applyColorblind(){ document.documentElement.classList.toggle("cb", colorblind); for (const k in _varCache) delete _varCache[k]; }


  // ---------- Cosmetics, and the tiles you buy them with ------------------
  // Every tile the runner clears is a tile in your pocket. Spend them here. Ownership and
  // the balance live in one localStorage record; what is currently WORN lives in settings,
  // so a skin you own is never lost by taking it off.
  const WALLET_KEY = "tilerunner:wallet";
  function loadWallet(){
    try { const w = JSON.parse(localStorage.getItem(WALLET_KEY)) || {};
          return { tiles: w.tiles|0, owned: new Set(w.owned || []) }; }
    catch(_) { return { tiles: 0, owned: new Set() }; }
  }
  function saveWallet(){
    try { localStorage.setItem(WALLET_KEY,
      JSON.stringify({ tiles: wallet.tiles, owned: [...wallet.owned] })); } catch(_){}
  }
  const wallet = loadWallet();

  // Each item draws its own swatch into an arbitrary 2d context, so the shop can preview it
  // without going anywhere near the game's canvas. The in-play drawing is separate, below.
  const rr2 = (g,x,y,w,h,r)=>{ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);
    g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };
  // a little runner bust, used as the backdrop of most swatches
  // `body` may be a flat colour OR a finish { paint, sheen } — the same pair paintRunner
  // uses — so a swatch shows the actual material rather than a flat stand-in for it.
  // `rad` is the corner, in fractions of S. It defaults to the runner's own rounding, because
  // most of these cards are selling something you wear ON him and want to look like him. The
  // DRIP cards pass 0: a finish is a material, and a material is best shown as a plain square
  // of itself — a rounded plaque puts a shape between you and the paint you are buying.
  function swatchBust(g, S, body, ink, fin, ts, rad){
    const w = S*0.42, h = S*0.42, x = S/2 - w/2, y = S*0.30;
    const R = S*(rad == null ? 0.07 : rad);
    if (fin && fin.glow) {                       // ...and its light, before it, as in play
      g.save(); g.globalCompositeOperation = "lighter";
      fin.glow(g, x + w/2, y + h/2, w/RUNNER.bodyW, ts||0);
      g.restore();
    }
    g.fillStyle = (fin && fin.paint) ? fin.paint(g, x, y, w, h, ts||0) : body;
    rr2(g, x, y, w, h, R); g.fill();
    if (fin && fin.sheen) { g.save(); rr2(g, x, y, w, h, R); g.clip(); fin.sheen(g, x, y, w, h, ts||0); g.restore(); }
    g.fillStyle = ink;
    g.beginPath(); g.arc(S/2 - w*0.16, y + h*0.40, S*0.035, 0, 7); g.fill();
    g.beginPath(); g.arc(S/2 + w*0.20, y + h*0.40, S*0.035, 0, 7); g.fill();
    return { x, y, w, h };
  }

  // A wide bench of them. Each is a body colour and the ink its eyes are drawn in — dark
  // eyes on a pale body, pale eyes on a dark one, or the reading falls apart.
  // ---- finishes -------------------------------------------------------------------
  // A finish is a colour that isn't one colour. `paint` hands back a fillStyle for a given
  // rect — a gradient, usually — and the optional `sheen` draws over the top of it, clipped
  // to the same shape. Both are handed the rect in whatever frame the runner is drawn in, so
  // a rolling metal ball's highlight rolls with it for free.
  //
  // A fixed highlight across the body — the band that separates polished from merely matte.
  //
  // It USED to travel on a loop, which is the honest way to say "this surface is glossy": a
  // reflection that moves while the object does not. It is parked now. The runner is a small
  // thing in constant motion and a second animation running inside him at his own scale reads
  // as flicker rather than as gloss, and it competed with the one thing on him that should
  // hold your eye, which is his stride.
  //
  // `ms` is kept in the signature and ignored: it is what each skin's line still says about how
  // fast it wanted to be, and setting one moving again is a one-line change here rather than an
  // edit to every skin. The pose is the third of a turn the shop swatch was already drawn at,
  // so every skin now looks exactly like the swatch that sold it.
  const GLINT_AT = 0.33;
  const glint = (col, ms, wide, alpha) => (g, x, y, w, h) => {
    const cx0 = x - w*0.35 + w*1.7*GLINT_AT;
    const k = Math.max(1, w*wide);
    // slanted: the two ends of the gradient sit at opposite corners, so the band leans the way
    // a highlight on a rounded body does rather than standing up like a bar
    const gd = g.createLinearGradient(cx0 - k, y + h, cx0 + k, y);
    gd.addColorStop(0, hexA(col, 0));
    gd.addColorStop(0.5, hexA(col, alpha));
    gd.addColorStop(1, hexA(col, 0));
    g.fillStyle = gd; g.fillRect(x, y, w, h);
  };
  // A hue wheel laid across the body. It used to TURN — `speed` was ms per revolution — and is
  // now held at the top of the wheel, for the same reason the glint is parked. `speed` is kept
  // and ignored, as above.
  const spectrum = (speed, sat, lum, spread) => (g, x, y, w, h) => {
    const gd = g.createLinearGradient(x, y + h, x + w, y);
    const base = 0;
    for (let k = 0; k <= 6; k++) gd.addColorStop(k/6, `hsl(${(base + k*spread) % 360} ${sat}% ${lum}%)`);
    return gd;
  };
  // TWELVE finishes. A skin is a `body` colour and the `ink` its eyes are drawn in — dark eyes
  // on a pale body, pale eyes on a dark one, or the reading falls apart. Anything more than a
  // flat colour adds `paint`, which hands back a fillStyle for a given rect, and optionally
  // `sheen`, drawn over the top and clipped to the same shape. Both get the rect in whatever
  // frame the runner is drawn in, so a rolling body's markings roll with it for free.
  const SKIN_COLOURS = [
    { id:"classic",  name:"Classic",  cost:0,  body:"#bfe6ff", ink:"#17263f" },
    { id:"blackout", name:"Black on Black", cost:5, body:"#15151c", ink:"#22222c" },
    { id:"whiteout", name:"White on White", cost:5, body:"#f4f4f7", ink:"#e0e0e6" },
    // A hard stop, not a blend: the split is what this is, and a gradient between the two
    // would just be grey. It runs down his TRAVEL axis, so the white half leads.
    { id:"twoface",  name:"Two Face", cost:10, body:"#8a8a96", ink:"#c9202f",
      paint(g, x, y, w, h){
        const gd = g.createLinearGradient(x, y, x + w, y);
        gd.addColorStop(0.00, "#15151c"); gd.addColorStop(0.50, "#15151c");
        gd.addColorStop(0.50, "#f4f4f7"); gd.addColorStop(1.00, "#f4f4f7");
        return gd; } },
    { id:"succubus", name:"Succubus", cost:10, body:"#c9202f", ink:"#fff4f4" },
    // Lit from inside rather than from a light source: the bright part is the middle of him,
    // and it falls off to a darker green at the edge. That is what separates glowing from
    // merely being bright green.
    { id:"radium",   name:"Radium",   cost:15, body:"#8fff3a", ink:"#123a00",
      paint(g, x, y, w, h){
        const gd = g.createRadialGradient(x + w*0.5, y + h*0.5, w*0.05,
                                          x + w*0.5, y + h*0.5, w*0.80);
        gd.addColorStop(0.00, "#eaffb8"); gd.addColorStop(0.40, "#8fff3a");
        gd.addColorStop(1.00, "#3f9e14"); return gd; },
      glow(g, cx, cy, s, ts){                   // ...and it lights the ground it runs on
        const R = s*0.66 * (1 + 0.05*Math.sin((ts||0)/470));
        const gd = g.createRadialGradient(cx, cy, s*0.02, cx, cy, R);
        gd.addColorStop(0.00, "rgba(233,255,184,0.95)");
        gd.addColorStop(0.24, "rgba(143,255,58,0.50)");
        gd.addColorStop(0.56, "rgba(63,158,20,0.18)");
        gd.addColorStop(1.00, "rgba(63,158,20,0)");
        g.fillStyle = gd; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill(); } },
    { id:"sun",      name:"The Sun",  cost:15, body:"#ffcf4d", ink:"#6b3f04",
      paint(g, x, y, w, h){
        const gd = g.createRadialGradient(x + w*0.5, y + h*0.40, w*0.04,
                                          x + w*0.5, y + h*0.50, w*0.88);
        gd.addColorStop(0.00, "#fffbe0"); gd.addColorStop(0.32, "#ffd24a");
        gd.addColorStop(0.74, "#ff9e2e"); gd.addColorStop(1.00, "#e8531e"); return gd; },
      sheen(g, x, y, w, h){                     // flares standing off the surface
        g.globalAlpha = 0.32; g.fillStyle = "#fffbe0";
        for (const [a2, b2, r] of [[0.24,0.24,0.11],[0.74,0.34,0.07],[0.46,0.78,0.08]]) {
          g.beginPath(); g.arc(x + w*a2, y + h*b2, w*r, 0, 7); g.fill(); }
        g.globalAlpha = 1; },
      // Bigger and whiter than the Radium's: a star does not tint what it lands on, it
      // bleaches it. The breath is slower too — this is a thing burning, not a thing buzzing.
      glow(g, cx, cy, s, ts){
        const R = s*0.86 * (1 + 0.04*Math.sin((ts||0)/760));
        const gd = g.createRadialGradient(cx, cy, s*0.02, cx, cy, R);
        gd.addColorStop(0.00, "rgba(255,252,232,1.00)");
        gd.addColorStop(0.18, "rgba(255,214,90,0.66)");
        gd.addColorStop(0.48, "rgba(255,120,36,0.26)");
        gd.addColorStop(1.00, "rgba(232,83,30,0)");
        g.fillStyle = gd; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill(); } },
    // Stripes off the BACK of the head only, and horizontal. Upright bars across the whole
    // face read as a flag, and they also sat over his eyes — the front of him is where you
    // look, so that is the part a marking should leave alone. In his local frame +x is travel,
    // so the back is the low-x edge: each stripe starts hard against it and tapers forward to
    // a point, which is what a stripe does and what a bar does not.
    { id:"tiger",    name:"Tiger",    cost:20, body:"#f59322", ink:"#2a1405",
      sheen(g, x, y, w, h){
        g.fillStyle = "#241202";
        // Pushed apart: the top one nearly touches the crown and the bottom one nearly the
        // chin, so the coat runs the whole depth of him and the bare band at eye level reads
        // as a gap in a pattern rather than as the space between two clumps.
        for (const [ty, len, th] of [[0.02,0.52,0.13],[0.32,0.64,0.13],
                                     [0.60,0.46,0.13],[0.84,0.34,0.12]]) {
          // Nothing at EYE LEVEL. Worked out from RUNNER.eyeY rather than by deleting the
          // offending stripe, so the gap goes on following the eyes if they ever move — and
          // the band stays in the list, which is what keeps the spacing of the other three
          // reading as a coat with a break in it rather than as three stripes.
          if (RUNNER.eyeY > ty - 0.03 && RUNNER.eyeY < ty + th + 0.03) continue;
          const y0 = y + h*ty, hh = h*th, xf = x + w*len;
          g.beginPath();
          g.moveTo(x, y0);
          g.lineTo(xf, y0 + hh*0.34);
          g.lineTo(xf, y0 + hh*0.66);
          g.lineTo(x, y0 + hh);
          g.closePath(); g.fill(); } } },
    { id:"zombie",   name:"Zombie",   cost:20, body:"#8fae6a", ink:"#f4f6d0",
      sheen(g, x, y, w, h){
        g.fillStyle = "rgba(58,78,36,0.55)";    // rot, in patches
        for (const [a2, b2, r] of [[0.26,0.62,0.16],[0.72,0.30,0.11],[0.52,0.16,0.08]]) {
          g.beginPath(); g.arc(x + w*a2, y + h*b2, w*r, 0, 7); g.fill(); }
        g.strokeStyle = "#3a4e24"; g.lineWidth = Math.max(1, w*0.035);   // ...and a seam
        g.beginPath(); g.moveTo(x + w*0.14, y + h*0.86); g.lineTo(x + w*0.86, y + h*0.72);
        g.stroke();
        g.lineWidth = Math.max(1, w*0.025);
        for (let k = 0; k < 4; k++) { const t = 0.2 + k*0.2;
          const px = x + w*(0.14 + 0.72*t), py = y + h*(0.86 - 0.14*t);
          g.beginPath(); g.moveTo(px, py - h*0.06); g.lineTo(px, py + h*0.06); g.stroke(); } } },
    { id:"cheese",   name:"Cheese",   cost:25, body:"#f2c94c", ink:"#6b4a10",
      sheen(g, x, y, w, h){
        g.fillStyle = "rgba(150,105,20,0.50)";  // holes, and one of them off the edge
        for (const [a2, b2, r] of [[0.24,0.32,0.13],[0.68,0.20,0.08],[0.46,0.74,0.10],[0.86,0.62,0.07]]) {
          g.beginPath(); g.arc(x + w*a2, y + h*b2, w*r, 0, 7); g.fill(); } } },
    // Transparent, and that is all it is. `paint` hands back nothing to paint with, so the
    // body AND the legs — which take the same finish — simply are not there. The eyes are
    // drawn separately in `ink`, so what is left running about the board is a pair of them.
    // No edge at all. There was a faint one, on the reasoning that you should be able to see
    // where he is — but a hollow runner with a rim around him is a glass runner, and what this
    // is meant to be is a pair of eyes with nothing behind them.
    { id:"hollow",   name:"Hollow",   cost:25, body:"#bfe6ff", ink:"#e8e6ff",
      paint: () => "rgba(0,0,0,0)" },
    { id:"polychrome", name:"Polychrome", cost:30, body:"#ffc2e6", ink:"#2a1240",
      paint: spectrum(9000, 90, 72, 60),
      // the hue wheel already turns underneath; the gloss on top is what makes it lacquer
      // rather than a colour cycle
      sheen: glint("#ffffff", 3000, 0.22, 0.42) },
  ];

  SKIN_COLOURS.forEach(c => c.swatch = (g,S) => swatchBust(g, S, c.body, c.ink, c, 0, 0));

  // Hats draw in the runner's local frame: +x is travel, the body spans byTop..byTop+bodyH.
  // HATS. Everything below is measured in `bw` — the head's own width — and nothing in `s`.
  // That is what makes "exactly as wide as his head" true and keeps it true: the shop's bust
  // and the runner in play have DIFFERENT ratios of head to body (0.42 of the card against
  // 0.26 of a cell), so a hat mixing the two came out a different size in the two places it
  // is seen. His head is square — bodyW and bodyH are both 0.26 — so bw is its height too.
  //
  // `byTop` is the crown line. Up is negative. H is half a head, so the widest part of every
  // hat here runs -H..+H and not a pixel further.
  const HATS = [
    { id:"none", name:"Bare", cost:0, draw:null,
      swatch:(g,S)=>swatchBust(g,S,"#bfe6ff","#17263f",null,0,0) },   // square, like the rest of the rack

    { id:"top", name:"Top Hat", cost:5, col:"#2b2740",
      draw(g,s,bw,byTop,col){ const H=bw*0.5;
        g.fillStyle=col;
        g.fillRect(-H, byTop - bw*0.06, bw, bw*0.09);              // the brim, head-wide
        g.fillRect(-H*0.66, byTop - bw*0.52, H*1.32, bw*0.46);     // the stack
        g.fillStyle="#c0392b";
        g.fillRect(-H*0.66, byTop - bw*0.17, H*1.32, bw*0.09); } },  // the band

    // THREE spikes, and the stone set toward the FRONT — +x is travel, so that is the face of
    // the band you actually see coming. It used to be two peaks with the rim corners rising
    // between them, which counts as four points from some angles and two from others.
    { id:"crown", name:"Crown", cost:5, col:"#ffd24a",
      draw(g,s,bw,byTop,col){
        const H = bw*0.5;
        const b = byTop + bw*0.04;        // the bottom of the band
        const v = byTop - bw*0.10;        // the valleys, and the rim it all stands on
        const t = byTop - bw*0.40;        // the spike tips
        g.fillStyle = col; g.beginPath();
        g.moveTo(-H, b); g.lineTo(-H, v);
        g.lineTo(-H*0.66, t); g.lineTo(-H*0.33, v);
        g.lineTo( 0,       t); g.lineTo( H*0.33, v);
        g.lineTo( H*0.66,  t); g.lineTo( H,      v);
        g.lineTo( H, b); g.closePath(); g.fill();
        // The band, in a darker gold across the foot of it. Same metal, less light on it —
        // which is what separates the rim a crown sits on from the points standing off it.
        // The stone is gone: at this size it was three pixels of red on a gold square and it
        // read as damage rather than as a jewel.
        g.fillStyle = "#c79418";
        g.fillRect(-H, v, bw, b - v); } },

    { id:"wizard", name:"Wizard", cost:5, col:"#4a3f9e",
      draw(g,s,bw,byTop,col){ const H=bw*0.5;
        g.fillStyle=col;
        g.beginPath();                                             // a tall cone, leaning back
        g.moveTo(-H*0.86, byTop+bw*0.02);
        g.lineTo( H*0.86, byTop+bw*0.02);
        g.lineTo( H*0.10, byTop-bw*1.10);
        g.closePath(); g.fill();
        g.fillRect(-H, byTop - bw*0.02, bw, bw*0.08);              // the brim, head-wide
        g.fillStyle="#ffd24a";                                     // stars on it
        for (const [x,y,r] of [[-0.10,-0.34,0.05],[0.06,-0.62,0.038],[-0.02,-0.86,0.03]]) {
          g.beginPath(); g.arc(bw*x, byTop+bw*y, bw*r, 0, 7); g.fill(); } } },

    { id:"gnome", name:"Gnome", cost:10, col:"#c0392b",
      draw(g,s,bw,byTop,col){ const H=bw*0.5;
        g.fillStyle=col;
        g.beginPath();                                             // short, fat, and flopping
        g.moveTo(-H, byTop+bw*0.04);
        g.lineTo( H, byTop+bw*0.04);
        g.quadraticCurveTo(H*0.9, byTop-bw*0.52, -H*0.20, byTop-bw*0.60);
        g.quadraticCurveTo(-H*0.55, byTop-bw*0.34, -H, byTop+bw*0.04);
        g.closePath(); g.fill();
        g.fillStyle="#f4f6ff";                                     // the bobble on the end
        g.beginPath(); g.arc(-H*0.24, byTop-bw*0.60, bw*0.09, 0, 7); g.fill(); } },

    // The ears are HIS colour, not a hat's: they are meant to read as part of him, the way a
    // cat's are, rather than as something strapped on. They take the whole finish, so a metal
    // or a gradient runs on up into them — a fill lives in user space, so it simply continues.
    // Wide, not tall: their bases nearly meet across the whole head, which is what makes them
    // read as ears rather than as horns — height was doing the opposite.
    { id:"cat", name:"Cat", cost:10, col:"#bfe6ff",
      draw(g,s,bw,byTop,col,skin){ const H=bw*0.5;
        for (const d of [-1, 1]) {
          g.fillStyle = skin || col; g.beginPath();                // ears at the head's corners
          g.moveTo(d*H,      byTop+bw*0.06);
          g.lineTo(d*H*0.92, byTop-bw*0.40);
          g.lineTo(d*H*0.10, byTop+bw*0.02);
          g.closePath(); g.fill();
          g.fillStyle="#ff8fc8"; g.beginPath();                    // ...and the inside of them
          g.moveTo(d*H*0.84, byTop+bw*0.00);
          g.lineTo(d*H*0.79, byTop-bw*0.26);
          g.lineTo(d*H*0.26, byTop-bw*0.02);
          g.closePath(); g.fill(); } } },

    // A COWL, not a hat: it comes down over the eyes, which is the only headgear here that
    // covers his face. Hats are drawn after the eyes, so it simply paints over them and gives
    // him two slits of its own.
    { id:"bat", name:"Batman", cost:10, col:"#1b1b2a",
      draw(g,s,bw,byTop,col){ const H=bw*0.5;
        g.fillStyle=col;
        g.fillRect(-H, byTop, bw, bw*0.46);                        // the mask over the top half
        for (const d of [-1, 1]) { g.beginPath();                  // two long ears
          g.moveTo(d*H*0.86, byTop+bw*0.02);
          g.lineTo(d*H*0.62, byTop-bw*0.52);
          g.lineTo(d*H*0.34, byTop+bw*0.02);
          g.closePath(); g.fill(); }
        g.fillStyle="#f4f6ff";                                     // the slits
        for (const d of [-1, 1]) {
          g.beginPath();
          g.moveTo(d*bw*0.10, byTop+bw*0.22); g.lineTo(d*bw*0.34, byTop+bw*0.17);
          g.lineTo(d*bw*0.34, byTop+bw*0.30); g.lineTo(d*bw*0.10, byTop+bw*0.31);
          g.closePath(); g.fill(); } } },

    // His own head, on his head — same square, same corner, same eyes, in whatever he happens
    // to be wearing. It takes the finish and the ink the body was painted with, which is why
    // `draw` is handed both.
    { id:"stack", name:"Head on Head", cost:15, col:null,
      draw(g,s,bw,byTop,col,skin,ink,ts){ const H=bw*0.5;
        g.fillStyle = skin || "#bfe6ff";
        rr2(g, -H, byTop - bw, bw, bw, bw*RUNNER.bodyR); g.fill();
        // The runner size is RECONSTRUCTED from the head, so the copy's eyes come out exactly
        // the size his do wherever this is drawn. And it takes the clock, so the two heads
        // blink together — the joke only lands if the copy is doing what he is doing.
        drawEyes(g, 0, byTop - bw + bw*RUNNER.eyeY, bw/RUNNER.bodyW, ink || "#17263f", 1,
                 ts == null ? EYES.blinkMs*0.5 : ts, 0); } },

    { id:"horns", name:"Horns", cost:15, col:"#f2ead6",
      draw(g,s,bw,byTop,col){ const H=bw*0.5;
        g.fillStyle=col;
        for (const d of [-1, 1]) { g.beginPath();                  // curling out to the corners
          g.moveTo(d*H*0.36, byTop+bw*0.04);
          g.quadraticCurveTo(d*H*1.00, byTop-bw*0.10, d*H*0.94, byTop-bw*0.46);
          g.quadraticCurveTo(d*H*0.74, byTop-bw*0.20, d*H*0.14, byTop+bw*0.04);
          g.closePath(); g.fill(); } } },

    // A ring of light, and now it actually gives some off. The glow goes down ADDITIVELY and
    // under the ring, squashed to the same ellipse so it reads as light coming off that ring
    // rather than as a lamp behind his head, and it breathes slowly so it never sits dead.
    { id:"halo", name:"Halo", cost:20, col:"#fff3a8",
      draw(g,s,bw,byTop,col,finish,inkCol,ts){ const H=bw*0.5, cy=byTop-bw*0.30;
        const puls = 0.88 + 0.12*Math.sin((ts||0)/430);
        g.save();
        g.globalCompositeOperation = "lighter";
        g.translate(0, cy); g.scale(1, 0.52);          // a round gradient, squashed to the ring
        const r = bw*1.30*puls;
        const gd = g.createRadialGradient(0, 0, 0, 0, 0, r);
        gd.addColorStop(0.00, "rgba(255,250,214," + (0.62*puls).toFixed(3) + ")");
        gd.addColorStop(0.28, "rgba(255,241,168," + (0.34*puls).toFixed(3) + ")");
        gd.addColorStop(0.62, "rgba(255,224,110," + (0.12*puls).toFixed(3) + ")");
        gd.addColorStop(1.00, "rgba(255,214,80,0)");
        g.fillStyle = gd; g.beginPath(); g.arc(0, 0, r, 0, Math.PI*2); g.fill();
        g.restore();
        g.strokeStyle=col; g.lineWidth=bw*0.075;
        g.beginPath(); g.ellipse(0, cy, H, bw*0.10, 0, 0, Math.PI*2); g.stroke(); } },

    // THE COMB, and nothing else. The wattle and the beak were two more small red things on a
    // head that already had one, and at this size the three of them read as clutter rather
    // than as a bird. One shape, standing three quarters of a head tall and running the full
    // width of him: the comb IS the joke, so it gets all the room.
    { id:"chicken", name:"Chicken", cost:20, col:"#e04141",
      draw(g,s,bw,byTop,col){
        const H = bw*0.5, base = byTop + bw*0.03;
        const LOBES = 4, span = bw/LOBES;
        g.fillStyle = col;
        g.beginPath();
        g.moveTo(-H, base);
        // Taller in the middle than at the ends, so it arches the way a comb does instead of
        // coming out as a row of identical bumps.
        for (let k = 0; k < LOBES; k++) {
          const x0 = -H + k*span, u = (k + 0.5)/LOBES;
          const tall = bw*(0.46 + 0.30*Math.sin(u*Math.PI));
          g.quadraticCurveTo(x0 + span*0.5, byTop - tall, x0 + span, base);
        }
        g.closePath(); g.fill(); } },

    // THE HORN, and nothing else. The pink mane under it was the bigger shape of the two and
    // it sat where a hat's brim goes, so what you saw first was a wig — with the horn reading
    // as a detail on top of it. One horn is the whole animal.
    { id:"unicorn", name:"Unicorn", cost:25, col:"#ffd24a",
      draw(g,s,bw,byTop,col){
        g.fillStyle = col;
        g.beginPath();                                             // wider at the root, taller
        g.moveTo(-bw*0.13, byTop + bw*0.03);
        g.lineTo( bw*0.13, byTop + bw*0.03);
        g.lineTo( bw*0.02, byTop - bw*0.86);
        g.closePath(); g.fill();
        g.strokeStyle = "#e8a020"; g.lineWidth = bw*0.032;         // the twist up its length
        g.lineCap = "round";
        for (let k = 1; k <= 4; k++) {
          const u = k/5, y = byTop + bw*0.03 - bw*0.89*u, hw = bw*0.12*(1 - u);
          g.beginPath(); g.moveTo(-hw, y); g.lineTo(hw, y - bw*0.035); g.stroke();
        } } },

    { id:"jelly", name:"Jelly", cost:25, col:"#9ad9ff",
      draw(g,s,bw,byTop,col){ const H=bw*0.5;
        g.globalAlpha=0.72; g.fillStyle=col;
        g.beginPath();                                             // a bell, exactly head-wide
        g.moveTo(-H, byTop+bw*0.06);
        g.quadraticCurveTo(-H, byTop-bw*0.58, 0, byTop-bw*0.58);
        g.quadraticCurveTo( H, byTop-bw*0.58, H, byTop+bw*0.06);
        g.closePath(); g.fill();
        g.strokeStyle=col; g.lineWidth=bw*0.055; g.lineCap="round";  // ...and what hangs off it
        for (const d of [-0.74, -0.26, 0.26, 0.74]) {
          g.beginPath(); g.moveTo(H*d, byTop+bw*0.04);
          g.quadraticCurveTo(H*d*1.15, byTop+bw*0.26, H*d*0.72, byTop+bw*0.44); g.stroke(); }
        g.globalAlpha=1; } },

    { id:"saiyan", name:"Super Saiyan", cost:30, col:"#ffd24a",
      draw(g,s,bw,byTop,col){ const H=bw*0.5;
        g.fillStyle=col;
        // Nine spikes off one base line, tallest in the middle — the flare is the whole look,
        // so the tips go a long way up while the BASE stays exactly a head across.
        const tip = [0.34, 0.62, 0.86, 1.10, 1.26, 1.10, 0.86, 0.62, 0.34];
        const lean = [-0.55, -0.42, -0.28, -0.13, 0, 0.13, 0.28, 0.42, 0.55];
        for (let k=0;k<9;k++){ const x0 = -H + (k/8)*bw, w = bw*0.075;
          g.beginPath();
          g.moveTo(x0 - w*0.5, byTop+bw*0.06);
          g.lineTo(x0 + w*0.5, byTop+bw*0.06);
          g.lineTo(x0 + bw*lean[k]*0.5, byTop - bw*tip[k]);
          g.closePath(); g.fill(); } } },
  ];
  HATS.forEach(h => { if (h.id === "none") return;
    // A square face, like the drip cards: the head is only here to hang the hat on, and a
    // rounded one puts a shape of its own between you and the thing you are buying.
    h.swatch = (g,S) => { const b = swatchBust(g,S,"#bfe6ff","#17263f",null,0,0);
      g.save(); g.translate(S/2, 0);
      h.draw(g, S, b.w, b.y, h.col, "#bfe6ff", "#17263f", EYES.blinkMs*0.5); g.restore(); }; });

  // Nyan-style ribbons: a band of parallel stripes laid along the runner's recent path,
  // exactly as deep as his body. Stored outermost-first; the drawing offsets each stripe
  // along the path's normal, so they stay parallel round corners instead of nesting.
  const TRAILS = [
    { id:"none", name:"None", cost:0, cols:null, swatch:(g,S)=>swatchBust(g,S,"#bfe6ff","#17263f") },
    { id:"rainbow", name:"Rainbow", cost:5, cols:["#ff595e","#ff924c","#ffca3a","#8ac926","#1982c4"] },
    { id:"spark",   name:"Sparks",  cost:5, cols:["#ffe9a8","#ffd24a","#ff9e4d"] },
    // A plain ribbon and nothing else — no wobble, no taper, no particles — in the one colour
    // that reads as an absence rather than a colour. It takes Coolant's slot because Ripple
    // already owns the ice ground and does more with it.
    //
    // The ID stays `cyan`. It is the key the wallet remembers a purchase by, so changing it
    // would quietly delete Coolant from anyone who had bought it and keep their tiles. A
    // reskin should cost the player nothing; the id is bookkeeping, the name is the product.
    // ONE stripe, so the band is the full depth of him rather than three thinner ones with
    // seams between. A shadow is a single solid thing; splitting it into stripes gave it an
    // internal structure that a shadow does not have.
    { id:"cyan",    name:"Shadow",  cost:10, cols:["#000000"] },
    { id:"scarlet", name:"Scarlet", cost:10, cols:["#b3081a"] },
    { id:"rose",    name:"Rose",    cost:10, cols:["#ffd6e8","#ff9ec7","#e0559a"] },
    // ---- the same ribbon, made to move ----
    { id:"ripple",  name:"Ripple",  cost:15, cols:["#dffaff","#7fe4ff"],
      wobble:0.55, freq:0.42, speed:170 },
    { id:"serpent", name:"Serpent", cost:15, cols:["#173d1d","#5ad46b","#c8ffb0"],
      wobble:0.85, freq:0.30, speed:260 },
    { id:"comet",   name:"Comet",   cost:20, cols:["#ffffff","#ffe9a8","#ff9e4d"], taper:true },
    { id:"morse",   name:"Morse",   cost:20, cols:["#9ad9ff","#2f8fd6"], dash:true },
    // ---- no ribbon at all: what he sheds, left to thin out ----
    { id:"embers",  name:"Embers",  cost:25, style:"dots", cols:["#fff0b8","#ffb03a","#e5482a"],
      dot:0.20, fade:1.6 },
    { id:"bubbles", name:"Bubbles", cost:25, style:"dots", cols:["#dffaff","#a6e9ff","#ffffff"],
      dot:0.26, fade:1.0, wobble:0.30, freq:0.6, speed:300 },
    { id:"static",  name:"Static",  cost:30, style:"dots", cols:["#ffffff","#c9a4ff","#7a5cff"],
      dot:0.11, fade:2.2, grow:false, wobble:0.9, freq:1.7, speed:90 },
  ];
  // The swatch is the TRAIL and nothing else. It used to draw the runner as well, which left
  // barely a third of the tile for the thing being sold and made every option look alike; and
  // a trail is a shape that only reads over distance, so it needs the whole width. Each style
  // is drawn the way it actually draws in play — wobble, taper, dash, particles — and fades
  // out along its length, so the head end is the solid one.
  TRAILS.forEach(t => { if (!t.cols) return;
    // The REAL ribbon, painted by the game's own routine along a straight run of points, with
    // him at the head of it — a trail is a wake, and a wake only reads if the thing that left
    // it is there. Laid tail-first, left to right, so he is travelling the way he does on the
    // board and the fade falls off behind him exactly as it does in play.
    t.swatch = (g, S) => {
      // The REAL ribbon, painted by the game's own routine along a straight run of points laid
      // tail-first — so the fade, the taper, the wobble and the dashes are the ones on the
      // board rather than a second set drawn to look like them. withCanvas is what puts it on
      // THIS canvas: paintTrail draws into the module-wide ctx, like everything else here.
      const band = S*0.34, cellPx = band / RUNNER.bodyH;
      const headX = S*1.02, tailX = -S*0.06, y = S*0.50, N = 46;
      const pts = [];
      for (let k = 0; k < N; k++) {
        const u = k/(N-1);
        pts.push({ x: tailX + (headX-tailX)*u, y,
                   nx: 0, ny: -1,                    // "up" is straight up along a flat run
                   w: Math.sin(k*1.7)*0.5 });        // each point's own fixed scatter
      }
      withCanvas(g, cellPx, 0, 0, () => paintTrail(t, pts, band, 0));
      // No runner at the head of it. The card is selling the WAKE, and a head sitting on the
      // end of it is the biggest, brightest thing on a square where the ribbon is the only
      // thing you came to look at.
    }; });
  // "None" has no trail to show, so it shows the absence of one rather than a runner.
  TRAILS[0].swatch = (g,S) => {
    g.globalAlpha = 0.22; g.strokeStyle = "#bfc6e0";
    g.lineWidth = Math.max(1, S*0.02); g.setLineDash([S*0.07, S*0.06]); g.lineCap = "round";
    g.beginPath(); g.moveTo(S*0.10, S*0.5); g.lineTo(S*0.90, S*0.5); g.stroke();
    g.setLineDash([]); g.globalAlpha = 1;
  };

  // SWAGGER — the way he runs. Every field is a multiplier or an addition on top of the
  // RUNNER tuning rather than a replacement for it, so retuning the runner in the lab still
  // moves all five styles together instead of leaving four of them behind.
  //   lean  extra body tilt, radians (negative = leaning back)
  //   bob / swing / lift  scale the stock rise, stride reach and foot lift
  //   hop   one big bounce per stride, fraction of a cell
  //   hover a constant height off the track, fraction of a cell
  //   spin  radians per ms of continuous roll
  //   pose  a named leg fold that replaces the stock stride: lotus, fetal, onefoot
  //   leap  leaps per TILE. He stands still on the ground at every 1/leap of a tile and
  //         covers the whole of that gap in one jump, so his forward motion happens only in
  //         the air. leapH is how high, leapHold the share of each cycle spent on the ground,
  //         leapSplit how far the feet part at the apex, leapAlt swapping which foot is the
  //         key one from one leap to the next so he comes down on them in turn, leapSpin
  //         whole turns in the air per leap — positive forward, negative back.
  const SWAGGERS = [
    { id:"classic", name:"Classic",   cost:0 },
    { id:"lean",    name:"Lean Back", cost:5, lean:-0.30, bob:0.70, swing:1.20, lift:1.15 },
    { id:"hop",     name:"Hopping",   cost:5, pose:"onefoot", hop:0.15, bob:0.15, swing:0, lift:0 },
    { id:"float",   name:"Floating",  cost:10, pose:"lotus",   hover:0.085, bob:0.35, swing:0, lift:0 },
    // a NEGATIVE hover: the ball sinks until it is all but touching the track, because a
    // roll that happens in mid-air is just a spin
    { id:"roll",    name:"Rolling",   cost:10, pose:"fetal",   spin:0.0055, hover:-0.068, bob:0 },
    // Built from the same handful of knobs — a pose, how far he leans, how hard he bobs, how
    // wide the arms swing, how high the knees come up. No new drawing code.
    { id:"stomp",   name:"Stomp",     cost:20, lean:0.20, bob:2.60, swing:1.35, lift:2.60,
      hop:0.055 },   // the hop is the SLAM: one hard bounce a stride, on top of the bob
    // The one style that moves him differently rather than just holding him differently: two
    // jumps a tile, planted at 0, a half and 1, still on the ground between them. Every other
    // swagger is a decoration on a runner who slides along at a constant rate; this one makes
    // the tile grid something he lands on.
    { id:"jump",    name:"Pogo",      cost:30, leap:2, leapH:0.30, leapHold:0.40,
      swing:0, lift:0, bob:0 },
    // The same gearing, thrown wide: he opens at the apex and shuts again to land, so the
    // straddle is the thing the eye reads rather than the height.
    { id:"splits",  name:"Splits",    cost:35, leap:2, leapH:0.34, leapHold:0.34, leapSplit:0.14,
      swing:0, lift:0, bob:0 },
    // One leg does all the work and the other stays folded up out of the way, landing after
    // landing. The onefoot pose already draws exactly that; it just never had a leap under it.
    { id:"flamingo",name:"Flamingo",  cost:35, leap:2, leapH:0.28, leapHold:0.38, pose:"onefoot",
      swing:0, lift:0, bob:0 },
    // ...and the same hop again with the key foot swapping every leap: he comes down on one
    // foot, then the other, the idle leg folded up out of the way either way.
    { id:"bound",   name:"Bounding",  cost:40, leap:2, leapH:0.28, leapHold:0.34, pose:"onefoot",
      leapAlt:1, leapSplit:0.16, swing:0, lift:0, bob:0 },
    // One whole turn per leap, timed to the flight rather than to the clock: he leaves the
    // ground upright and arrives upright, having gone all the way over in between. Higher and
    // with a longer flight than the others, because a turn needs room to finish.
    { id:"somer",   name:"Somersault",cost:45, leap:2, leapH:0.36, leapHold:0.28, leapSpin:1,
      leapSplit:0.028, swing:0, lift:0, bob:0 },
    { id:"backflip",name:"Backflip",  cost:50, leap:2, leapH:0.38, leapHold:0.28, leapSpin:-1,
      leapSplit:0.028, swing:0, lift:0, bob:0 },
  ];
  // Each swatch is the same bust in the pose that style would hold it in — a still frame
  // reads the difference far better than a name does.
  SWAGGERS.forEach(w => { w.swatch = (g,S) => {
    g.save(); g.translate(S/2, 0);
    if (w.lean)  g.rotate(w.lean*0.8);
    if (w.spin)  g.rotate(0.7);
    if (w.leapSpin) g.rotate(0.9 * Math.sign(w.leapSpin));
    if (w.hover || w.hop || w.leapH) g.translate(0, -S*(w.hover || w.hop || w.leapH)*0.8);
    g.translate(-S/2, 0);
    const b = swatchBust(g, S, "#bfe6ff", "#17263f");
    // a suggestion of legs under the body, in whatever the style holds them in
    g.strokeStyle = "#bfe6ff"; g.lineWidth = S*0.05; g.lineCap = "round"; g.lineJoin = "round";
    const bx = S/2, by = b.y + b.h, u = S*0.11;
    g.beginPath();
    if (w.pose === "lotus") {                     // cross-legged: a shallow fold under him
      g.moveTo(bx - b.w*0.20, by); g.lineTo(bx - b.w*0.60, by + u*0.52); g.lineTo(bx - b.w*0.06, by + u*0.80);
      g.moveTo(bx + b.w*0.20, by); g.lineTo(bx + b.w*0.60, by + u*0.52); g.lineTo(bx + b.w*0.06, by + u*0.80);
    } else if (w.pose === "fetal") {              // curled: knees out front, feet tucked under
      g.moveTo(bx - b.w*0.16, by); g.lineTo(bx + b.w*0.44, by - u*0.42); g.lineTo(bx + b.w*0.08, by + u*0.30);
      g.moveTo(bx + b.w*0.16, by); g.lineTo(bx + b.w*0.82, by - u*0.56); g.lineTo(bx + b.w*0.44, by + u*0.30);
    } else if (w.pose === "onefoot") {            // one leg down, the other bent up under him
      g.moveTo(bx + b.w*0.20, by); g.lineTo(bx + b.w*0.26, by + u*1.05);
      g.moveTo(bx - b.w*0.20, by); g.lineTo(bx + b.w*0.20, by + u*0.44); g.lineTo(bx - b.w*0.42, by + u*0.74);
    } else if (w.leapSplit) {                     // thrown wide, the way it reads at the apex
      const rch = S*0.16;
      g.moveTo(bx - b.w*0.20, by); g.lineTo(bx - b.w*0.20 - rch, by + u*0.72);
      g.moveTo(bx + b.w*0.20, by); g.lineTo(bx + b.w*0.20 + rch, by + u*0.72);
    } else {
      const rch = S*0.09*(w.swing == null ? 1 : w.swing);
      g.moveTo(bx - b.w*0.20, by); g.lineTo(bx - b.w*0.20 - rch, by + u);
      g.moveTo(bx + b.w*0.20, by); g.lineTo(bx + b.w*0.20 + rch, by + u);
    }
    g.stroke();
    g.restore();
  }; });

  // KICKS — drawn at each foot, in the runner's local frame, +x being travel. The foot
  // itself is the anchor, so they follow the stride and the lift for free.
  // WHERE THE GROUND IS, for anything worn on a foot. The runner's local y=0 is the track's
  // own surface, and a leg is stroked with a ROUND cap — so the end of it already bulges half
  // a leg-width past the foot, 0.025 of a cell. A sole drawn any shallower than that has the
  // leg's own curve hanging below it, which is exactly what makes a flat-bottomed boot look
  // round. Every kick's sole belongs on this line.
  const KICK_SOLE = 0.026;
  // Two shapes every kick is built from, so the whole family stands on one ground and is cut
  // to one set of proportions. `bootBody` is the upper: a rounded box whose BOTTOM is always
  // the sole line, however tall its top. `soleSlab` is what it stands on.
  const bootBody = (g,s,back,top,front,rad,bottom) =>
    rr2(g, s*back, s*top, s*(front-back),
        s*((bottom==null?KICK_SOLE:bottom) - top), s*(rad==null?0.014:rad));
  const soleSlab = (g,s,back,front,thick,rad) =>
    rr2(g, s*back, s*(KICK_SOLE-thick), s*(front-back), s*thick, s*(rad==null?0.006:rad));
  // The bare foot itself, as a path — heel on the sole line, one straight underneath, the toe
  // and the heel curving up off it and never into it. Shared, because anything that shows the
  // foot rather than enclosing it needs the same silhouette.
  function footPath(g,s){
    const SOLE = s*KICK_SOLE;
    g.beginPath();
    g.moveTo(-s*0.020, -s*0.014);                                  // the ankle, at the back
    g.quadraticCurveTo(-s*0.030,  s*0.006, -s*0.028, SOLE);        // down the back of the heel
    g.lineTo( s*0.050, SOLE);                                      // THE SOLE — one straight
    g.quadraticCurveTo( s*0.056,  s*0.016,  s*0.046,  s*0.004);    // the toe, rounded off
    g.quadraticCurveTo( s*0.032, -s*0.008,  s*0.012, -s*0.016);    // ...and back up the instep
    g.closePath();
  }
  // Every kick is TWO things: `cover`, a fraction of the leg from the foot back that gets
  // restroked in `legCol` — the sock, the upper, the shaft — and `draw`, the shape that stands
  // on the ground. A thigh boot is mostly cover; a croc is all shape and almost none.
  const KICKS = [
    // Barefoot is not "no kick": it is a FOOT, in whatever colour he happens to be, covering no
    // leg because a foot is where the leg stops.
    { id:"none", name:"Barefoot", cost:0, cover:0, col:null,
      draw(g,s,col){ g.fillStyle = col; footPath(g,s); g.fill(); } },

    // A sock is the FOOT in fabric — no sole, no shape of its own, the leg simply carried on
    // over the toes. The two bands at the ankle are the whole reason it does not read as a
    // pale foot, and they are clipped to the sock so neither runs off the back of the heel.
    { id:"socks", name:"Socks", cost:5, col:"#f4f6ff", cover:0.30, legCol:"#f4f6ff",
      draw(g,s,col){
        g.fillStyle = col; footPath(g,s); g.fill();
        g.save(); footPath(g,s); g.clip();
        g.fillStyle = "#e8506b"; g.fillRect(-s*0.05, -s*0.015, s*0.12, s*0.007);
        g.fillStyle = "#4dc9ff"; g.fillRect(-s*0.05, -s*0.004, s*0.12, s*0.007);
        g.restore(); } },

    { id:"sneaker", name:"Sneakers", cost:5, col:"#f2f4ff", cover:0.13, legCol:"#f2f4ff",
      draw(g,s,col){                                    // a low shoe on a rubber sole
        g.fillStyle = col; bootBody(g,s,-0.030,-0.016,0.054,0.016); g.fill();
        g.fillStyle = "rgba(23,38,63,0.38)"; soleSlab(g,s,-0.034,0.058,0.012); g.fill(); } },
