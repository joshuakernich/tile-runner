        trackConnects(h, p) && !foldsBack(p.c, p.r) && platformFree(p));
      if (pf) {
        s.path.push({ c: pf.c, r: pf.r, kind: "platform", pfId: pf.id });
        pf.lit = 1;
        linked = true;
        continue;
      }
      // "parked" is a tile you have just dropped. "free" is one the runner has cleared and
      // left lying where it was. A free tile normally waits to be dragged — but if it is
      // ALREADY sitting on a cell that legally continues the track from the front, dragging
      // it would only put it back where it is. That is what a closed circuit is: the tile
      // the runner just cleared is the very next tile of the loop. So it re-links itself,
      // and four tiles laid in a square carry him round for ever with no input at all.
      const t = s.tiles.find(t => (t.status === "parked" || t.status === "free") &&
                                  trackConnects(h, { c:t.c, r:t.r }) && !foldsBack(t.c, t.r));
      if (!t) break;
      t.status = "active";
      // A tile joining the track changes what it IS — a loose pane becomes laid platform — and
      // that swap happened silently between two frames. A short flash on the cell carries the
      // eye across it. Only mid-run: at level load a whole starting chain links at once, and
      // half a dozen flashes on the opening frame is a fault, not a flourish.
      if (s.status === "play") spawnLaidFlash(t.c, t.r);
      s.path.push({ c: t.c, r: t.r, kind: "tile", tileId: t.id });
      linked = true;
    }
    if (linked) updateReadyHud();
  }

  // ---------- The lover ---------------------------------------------------
  // She is not a hazard and she is not a puzzle: she runs her own track, laid for her by the
  // level, at the same pace he does. Nothing she touches matters and nothing touches her. The
  // whole point is that for one level there is someone else out there.
  const LOVER = {
    skin: { body:"#ff9ec7", ink:"#5c1638" },
    // a bow, drawn in her own frame the way every hat is: two loops and a knot on the crown
    hat: { col:"#ff5f9e", draw(g, s, bw, byTop, col) {
      g.fillStyle = col;
      for (const sx2 of [-1, 1]) {
        g.beginPath();
        g.ellipse(sx2*bw*0.30, byTop - s*0.030, bw*0.24, s*0.042, sx2*0.5, 0, Math.PI*2);
        g.fill();
      }
      g.beginPath(); g.arc(0, byTop - s*0.028, s*0.028, 0, Math.PI*2); g.fill();
    } },
  };
  function loverPos() {
    const lv = state.lover;
    if (!lv || lv.path.length < 2) return null;
    const f = Math.min(lv.idx + lv.t, lv.path.length - 1), i = Math.floor(f), fr = f - i;
    const a = lv.path[i], b = lv.path[Math.min(i + 1, lv.path.length - 1)];
    return { x:(a.c + (b.c - a.c)*fr + 0.5)*cell, y:(a.r + (b.r - a.r)*fr + 0.5)*cell,
             angle: Math.atan2(b.r - a.r, b.c - a.c) };
  }
  function tickLover(dt) {
    const lv = state.lover;
    if (!lv || state.status !== "play") return;
    lv.phase += dt / RUNNER.stepMs;
    if (lv.idx >= lv.path.length - 1) return;          // she has arrived; she waits
    lv.t += dt / Math.max(1, state.msPerCell);
    while (lv.t >= 1 && lv.idx < lv.path.length - 1) { lv.t -= 1; lv.idx++; }
    if (lv.idx >= lv.path.length - 1) lv.t = 0;
  }
  function drawLover(ts) {
    const p = loverPos();
    if (!p) return;
    const lv = state.lover;
    const running = state.status === "play" && lv.idx < lv.path.length - 1;
    paintRunner(p.x, p.y, cell, lv.phase, p.angle, running, ts, 0, true, LOVER);
  }

  // ---------- Runner logic ------------------------------------------------
  // Stride cycles per tile. Two puts a footfall on every half tile, which is where a leaping
  // swagger lands, so the styles that walk and the styles that jump agree about the grid.
  const STRIDES_PER_TILE = 2;
  function update(dt) {
    if (state.status !== "play") return;
    const s = state;
    // The legs are GEARED TO THE TRACK rather than run off the clock: the phase is a pure
    // function of how far along the path he is, so one tile is always the same number of
    // strides whatever the pace. Every swagger hangs off this phase — the bob, the swing, the
    // hop, the roll, the hover's breath — so all of them slow down and speed up with him
    // instead of drifting against the tiles the way a clock-driven stride does.
    s.runPhase = (s.runIdx + s.runT) * Math.PI*2 * STRIDES_PER_TILE;
    s.elapsed += dt;                        // level clock (for time bonus / stars)
    tickFly(dt);                            // a tile on its way to a tapped hint square
    // the flag snaps down and plants itself once a tile is laid on the exit cell
    const planted = !!s.goal && s.path.some(n => n.kind === "tile" && n.c === s.goal.c && n.r === s.goal.r);
    s.flagPlantT += ((planted ? 1 : 0) - s.flagPlantT) * Math.min(1, dt/70);
    // sliding doors ease open once all their linked switches are pressed
    for (const grp of s.gateGroups) {
      const open = grp.switches.every(w => w.used);
      grp.openT += ((open ? 1 : 0) - grp.openT) * Math.min(1, dt/120);
    }
    // stone hit-flash decays
    for (const st of s.stones.values()) if (st.hit > 0) st.hit = Math.max(0, st.hit - dt/180);
    // timed speed effect from a collected boost / slow pickup (see collectKey)
    let factor = 1;
    if (s.speedFx.t > 0) {
      s.speedFx.t -= dt;
      if (s.speedFx.kind === "boost") factor *= BOOST_MULT;
      else if (s.speedFx.kind === "slow") factor *= SLOW_MULT;
      if (s.speedFx.t <= 0) { s.speedFx.kind = null; s.speedFx.t = 0; }
    }
    // Hands of Time stops HIM, not the level: the saws keep sweeping and the monsters keep
    // rowing, so a second of standing still is a second of everything else catching up.
    if (powerActive("clock")) factor = 0;
    // ...and the Ankh's breath, which is the same stop by a different door
    if (s.hold > 0) { s.hold -= dt; factor = 0; }
    // fixed pace for now — no within-level combo speed-up (was: 1 + min(combo*0.01, 0.5))
    const comboSpeed = 1;
    factor *= comboSpeed;
    s.speedMult = comboSpeed;                 // for the live speed readout
    s.liveFactor = factor;                     // includes boost/slow zone + combo, for the readout
    s.runT += (dt / s.msPerCell) * factor;
    while (s.runT >= 1 && s.runIdx + 1 < s.path.length) {
      s.runT -= 1;
      s.runIdx++;
      const now = s.path[s.runIdx];
      // Every cell he has ever stood on, in the order he stood on it. The path itself is only
      // the LIVE stretch — tiles are recycled out from behind him — so by the time he reaches
      // the flag there is no record left of how he got there. The win sequence rebuilds the
      // whole route, so the whole route has to be remembered as it happens.
      s.walked.push({ c: now.c, r: now.r });
      if (s.goal && now.c === s.goal.c && now.r === s.goal.r) { s.runT = 0; endWin(); return; }
      noticeLoop();
    }
    freeClearedTiles();
    collectKey();
    linkParkedTiles();      // connect any staged tile that now touches the front
    // no tile ahead: the runner keeps going to the edge of the last tile, then falls off.
    // (visual position across the tile u = runT + 0.5, so the 80% mark is runT = 0.3)
    if (s.runIdx + 1 >= s.path.length) {
      if (s.runT >= 0.5) { endRun(); return; }
    }
  }

  // undo the most recent placement (if the runner hasn't reached it yet)
  function undoLast() {
    const s = state;
    if (s.status !== "play" || s.lastPlacedId == null) return;
    const t = s.tiles[s.lastPlacedId];
    if (!t) return;
    // the tile may have auto-chained onto one or more fixed platforms; those trailing
    // platform nodes come off with it, as long as the runner hasn't reached them yet
    let tip = s.path.length - 1;
    while (tip > 0 && s.path[tip].kind === "platform") tip--;
    const h = s.path[tip];
    if (h.kind === "tile" && h.tileId === t.id && s.runIdx < tip) {
      while (s.path.length > tip) s.path.pop();
      t.status = "free"; t.freedAt = ++s.freeSeq;   // pop it off the front, back into the pool
    } else if (t.status === "parked") {
      t.status = "free"; t.freedAt = ++s.freeSeq;   // un-stage a parked tile
    } else { return; }
    s.lastPlacedId = null;
    markOccDirty();                            // occupancy changed
    spawnPop(t.c, t.r, "#ff6d6d");
    updateReadyHud();
  }

  // ---------- The vortex ---------------------------------------------------
  // Close the track into a circuit and he can run for ever. Rather than leave that as a
  // soft-lock, the game notices, winds him up to a flat sprint, and then folds the whole
  // picture — board, HUD and all — into the middle of the loop he built.
  const LOOP_MIN = 4, LOOP_MAX = 14;   // circuit lengths we look for, in cells
  const LOOP_LAPS = 2;                 // clean laps before we are sure it is a circuit
  const VORTEX = {
    cps:   4.0,     // the sprint he is wound up to
    ramp:  2400,    // ms winding up to it
    hold:  900,     // ms at full pelt before the world lets go
    pull:  2600,    // ms of whirlpool
    black: 1500,    // ms of nothing, then back to the title
    rings: 42,      // annuli the frame is torn into — more is smoother and slower
    turns: 2.6,     // how many full twists the innermost ring takes
  };
  // The cell he just entered is one he entered L steps ago, and so is every cell between.
  // Checked over two laps so a path that merely crosses itself once does not count.
  function circuitLength() {
    const p = state.path, i = state.runIdx;
    for (let L = LOOP_MIN; L <= LOOP_MAX; L++) {
      // the furthest back we reach is i-(L-1)-LOOP_LAPS*L; anything shorter and there is
      // simply not enough history yet to tell a circuit from a coincidence
      if (i - (LOOP_LAPS + 1)*L + 1 < 0) break;
      let same = true;
      for (let lap = 1; lap <= LOOP_LAPS && same; lap++)
        for (let k = 0; k < L && same; k++)
          same = p[i-k].c === p[i-k-lap*L].c && p[i-k].r === p[i-k-lap*L].r;
      if (same) return L;
    }
    return 0;
  }
  function noticeLoop() {
    const s = state;
    if (s.vortex) return;
    const L = circuitLength();
    if (!L) { s.loop = null; return; }
    if (!s.loop || s.loop.len !== L) { s.loop = { len: L, at: s.runIdx }; return; }
    // The middle of the circuit, in world units — where everything is about to go — and
    // which way round he is going. Walked FORWARD (the loop above collects backwards), so the
    // shoelace comes out with the sign of his actual travel.
    const ring = [];
    for (let k = L - 1; k >= 0; k--) ring.push(s.path[s.runIdx - k]);
    let cx = 0, cy = 0, area = 0;
    for (let k = 0; k < L; k++) {
      const a = ring[k], b = ring[(k + 1) % L];
      cx += a.c + 0.5; cy += a.r + 0.5;
      area += (a.c + 0.5)*(b.r + 0.5) - (b.c + 0.5)*(a.r + 0.5);
    }
    // Canvas y runs downward, so a positive shoelace is a CLOCKWISE lap on screen — and a
    // positive rotate() is clockwise too. Taking the sign straight across means the
    // whirlpool turns the way he runs rather than against him.
    s.vortex = { phase: "ramp", t: 0, wx: cx/L, wy: cy/L, len: L, spin: area >= 0 ? 1 : -1 };
    Sound.vortex(true);
    document.body.classList.add("vortex");        // the DOM buttons go down with the ship
  }
  function tickVortex(dt) {
    const s = state, v = s.vortex; if (!v) return;
    v.t += dt;
    if (v.phase === "ramp") {
      const u = Math.min(1, v.t / VORTEX.ramp);
      s.cpsNow = s.cpsNow + (VORTEX.cps - s.cpsNow) * Math.min(1, dt/220);
      s.msPerCell = 1000 / s.cpsNow;
      Sound.setTempo(s.msPerCell);
      if (u >= 1) { v.phase = "hold"; v.t = 0; }
    } else if (v.phase === "hold") {
      s.cpsNow = VORTEX.cps; s.msPerCell = 1000 / VORTEX.cps;
      if (v.t >= VORTEX.hold) { v.phase = "pull"; v.t = 0; s.status = "vortex"; }
    } else if (v.phase === "pull") {
      if (v.t >= VORTEX.pull) { v.phase = "black"; v.t = 0; Sound.vortex(false); Sound.ambient(null); }
    } else if (v.phase === "black") {
      if (v.t >= VORTEX.black) {
        s.vortex = null;
        document.body.classList.remove("vortex");
        startTitle();                              // out the other side, back to the beginning
      }
    }
  }
  // The whirlpool itself. The finished frame is copied off and redrawn as a stack of rings,
  // each rotated further and pulled further in than the one outside it — the swirl is in the
  // difference between them. Everything on the canvas goes, HUD included.
  let vortexCv = null;
  function drawVortex(ts) {
    const v = state.vortex; if (!v || (v.phase !== "pull" && v.phase !== "black")) return;
    const W = canvas.width, H = canvas.height;
    if (v.phase === "black") {
      const u = Math.min(1, v.t / 260);
      ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle = "#000"; ctx.globalAlpha = 1; ctx.fillRect(0,0,viewW,viewH); ctx.restore();
      return;
    }
    const u = Math.min(1, v.t / VORTEX.pull);
    const ease = u*u;                                       // slow to start, then it lets go
    if (!vortexCv) vortexCv = document.createElement("canvas");
    if (vortexCv.width !== W || vortexCv.height !== H) { vortexCv.width = W; vortexCv.height = H; }
    const g = vortexCv.getContext("2d");
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H); g.drawImage(canvas, 0, 0);
    const px = v.wx*cell - camX, py = v.wy*cell - camY;     // the eye, in screen units
    const far = Math.hypot(Math.max(px, viewW-px), Math.max(py, viewH-py)) + cell;
    ctx.save();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = "#000"; ctx.fillRect(0,0,viewW,viewH);
    for (let i = VORTEX.rings; i >= 1; i--) {
      const r0 = far * (i-1)/VORTEX.rings, r1 = far * i/VORTEX.rings;
      const k = 1 - (i-1)/VORTEX.rings;                     // 0 at the rim, 1 at the eye
      const twist = v.spin * ease * VORTEX.turns * Math.PI*2 * k*k;
      const draw  = 1 - ease * (0.35 + 0.65*k);             // inner rings fall in fastest
      ctx.save();
      ctx.beginPath();                                      // the annulus this ring lives in
      ctx.arc(px, py, r1, 0, Math.PI*2);
      ctx.arc(px, py, r0, 0, Math.PI*2, true);
      ctx.clip("evenodd");
      ctx.translate(px, py); ctx.rotate(twist); ctx.scale(draw, draw); ctx.translate(-px, -py);
      ctx.globalAlpha = Math.max(0, 1 - ease*ease*(0.2 + 0.8*k));
      ctx.drawImage(vortexCv, 0, 0, W, H, 0, 0, viewW, viewH);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- Talisman powers ---------------------------------------------
  const REWIND_TILES = 2;      // how far back the Tape of Regret puts you
  const MAGNET_CELLS = 2.5;    // the Magnet's reach, in tiles
  // The reach is drawn as rings falling inward rather than as one ring sitting still: a
  // static circle says "this is the area", where a collapsing one says "and it is pulling".
  const MAGNET_RINGS = 2;      // how many are on their way in at any moment
  const MAGNET_RING_MS = 820;  // one disc's trip from the rim to him
  const COIN_FLY_MS = 240;     // how long a pulled coin takes to reach him
  // Press the button: the worn talisman gives up its one power for this level.
  // A level still allows ONE power — that has always been the balance — but which one is now
  // decided at the moment you use it rather than committed to in a menu beforehand.
  function firePower(id) {
    const s = state;
    const def = id ? (talLive(id) && talUnlocked.has(id) ? talById(id) : null) : wornTalisman();
    // Normally only while he is running. The exception is the Ankh's grace: he is already
    // falling, and that is precisely when the offer is open.
    const grace = s && s.status === "falling" && s.ankhGrace > 0;
    if (!s || (s.status !== "play" && !grace) || !def || s.power.used.has(def.id)) return false;
    s.power.used.add(def.id);
    // Every charm marks itself with a pulse on the runner's cell — except the Hammer, whose
    // whole statement is the circle.
    if (def.id !== "finger") spawnPop(runnerCell().c, runnerCell().r, def.col);
    Sound.tap();                            // pressing it is a press; the charm speaks for itself
    haptic([10, 30, 14]);

    // Charms that do their work on the spot and let go. These deliberately do not touch the
    // running-effect slot: when only one charm could ever be used they could clear it freely,
    // because there was nothing of anyone else's in there. Now there might be — press the Bell
    // while the Ankh is waiting and clearing the slot would quietly disarm it.
    if (def.id === "rewind") { rewindRunner(REWIND_TILES); return true; }
    // A FOURTH tile, out of nowhere, in the middle of the board. The Mushroom used to warp the
    // screen for six seconds, which was a joke at the player's expense rather than a power —
    // this is the only charm that changes what you have to work with instead of what is
    // happening to you, and three tiles is the whole shape of the game.
    if (def.id === "mush")   { spawnSpareTile(def.col); return true; }
    // The Hammer stopped being a thing you aim and became a thing you set off: it used to wait,
    // armed, for you to tap a laid tile and lift it. A charm that does its work the moment you
    // press it is one fewer rule to hold, and breaking rock is what a sledge was always for.
    if (def.id === "finger") { startRoar("finger"); return true; }   // the smash happens mid-shout
    if (def.id === "pulse")  { startRoar("pulse");  return true; }   // the unmaking happens mid-shout
    // The Millstone stopped being a speed multiplier and became a MOMENT: he sits down. It is
    // the only charm whose effect is entirely on him rather than on the board, which is what
    // "slows the heart and body" was always describing — the old version just scaled his pace
    // for half a second, which you felt as a stutter rather than as a rest.
    if (def.id === "brake")  { startRest();         return true; }
    // The Ankh does nothing at all when pressed. It latches, and `startFall` spends it. Its own
    // flag, not the effect slot, so pressing anything else afterwards leaves it waiting.
    // Caught in the air, it does its work now. Pressed while running, it waits for the fall
    // that may never come.
    if (def.id === "ankh")   {
      if (grace) { s.ankhGrace = 0; reviveRunner(); } else s.power.ankh = true;
      return true;
    }

    // ...and what is left is a timed effect, which takes the slot.
    s.power.kind = def.id;
    s.power.ms = def.ms;
    s.power.t = def.ms;
    s.power.armed = true;
    if (def.id === "star") Sound.starTheme(def.ms);
    // The Spur starts the effect the floor pads start, and its own clock is set to the same half
    // second, so the draining bar on the button and the thing it is draining for are one
    // duration rather than two that only look alike. The Millstone used to be its mirror; it is
    // a sit now, and returns above without ever reaching this slot.
    if (def.id === "spur")  s.speedFx = { kind:"boost", t:SPEED_CHARM_MS };
    return true;
  }
  const powerActive = id => state && state.power.kind === id && state.power.t > 0;
  const PULSE_TILES = 1;                   // how far the Bell reaches, in cells
  const HAMMER_TILES = 1;                  // ...and the Hammer, which breaks rock instead
  // The Hammer is not a button, it is a MOMENT. He stops, straightens, leans back, and shouts
  // the rock apart. Three beats: the draw of breath, the shout itself, and a beat of quiet
  // afterwards before he runs on — without that last one the run resumes on the same frame the
  // sound ends and the whole thing reads as a stutter rather than as an act.
  const ROAR_LEAN = 0.34;                  // radians thrown back from the waist, about 19 degrees
  const ROAR = { wind: 220, blast: 950, settle: 260 };
  const ROAR_MS = ROAR.wind + ROAR.blast + ROAR.settle;
  // The two shouting charms. They are the same MOMENT — the same freeze, lean, shake and
  // circle — and differ only in what they unmake and what colour they do it in. The Hammer
  // takes rock and wears the rock's own colour; the Bell takes monsters and is black, because
  // what it does is subtract something from the world.
  const ROAR_KIND = {
    finger: { fill: "#574d38", mid: "rgba(198,184,146,",  rim: "rgba(226,214,182," },
    pulse:  { fill: "#05040c", mid: "rgba(12,10,24,",     rim: "rgba(0,0,0," },
  };
  // ---- the Millstone: he sits down --------------------------------------------------------
  // The one charm that does nothing TO the world. He stops, folds down cross-legged, shuts his
  // eyes for a second and a half, gets up and carries on — and the backing track slurs down to
  // a crawl and back while he is under. Everything else in the game is a thing you set off at
  // the board; this is a thing you do to yourself, so it is drawn entirely on him.
  function startRest(){
    const s = state;
    s.rest = { t: 0 };
    s.hold = REST_MS;                     // he is not going anywhere until he has had his moment
  }
  function tickRest(dt){
    const s = state, R = s.rest; if (!R) return;
    R.t += dt;
    // The tempo follows him down and back up rather than stepping, so the track sags into it.
    try { Sound.setTempo && Sound.setTempo(s.msPerCell * (1 + (REST_TEMPO - 1)*restK())); } catch(_){}
    if (R.t >= REST_MS) {
      s.rest = null;
      try { Sound.setTempo && Sound.setTempo(s.msPerCell); } catch(_){}   // ...and back to pace
    }
  }
  // 0 standing, 1 fully folded. Down, hold, up, then a beat on his feet before he runs.
  function restK(){
    const R = state && state.rest; if (!R) return 0;
    if (R.t < REST.down) return cineSmooth(R.t / REST.down);
    if (R.t < REST.down + REST.still) return 1;
    if (R.t < REST.down + REST.still + REST.up)
      return 1 - cineSmooth((R.t - REST.down - REST.still) / REST.up);
    return 0;
  }
  function startRoar(kind){
    const s = state;
    s.roar = { t: 0, fired: false, kind };
    s.hold = ROAR_MS;                       // he is not going anywhere until it is done
  }
  function tickRoar(dt){
    const s = state, R = s.roar; if (!R) return;
    R.t += dt;
    if (!R.fired && R.t >= ROAR.wind) {     // the shout, and whatever goes with it
      R.fired = true;
      if (R.kind === "pulse") unmakeMonsters(PULSE_TILES, "#c9b6ff");
      else                    smashStones(HAMMER_TILES);
      try { Sound.roar && Sound.roar(R.kind); } catch(_){}
      haptic([12, 26, 60]);
    }
    // the ground goes while he is shouting, and settles as he does
    if (R.fired && R.t < ROAR.wind + ROAR.blast) {
      const k = 1 - (R.t - ROAR.wind) / ROAR.blast;
      s.shake = Math.max(s.shake, cell * 0.09 * k);
    }
    if (R.t >= ROAR_MS) s.roar = null;
  }
  // 0 while he runs, 1 at the top of the shout — drives both his lean and the ring.
  function roarK(){
    const R = state && state.roar; if (!R) return 0;
    if (R.t < ROAR.wind) return R.t / ROAR.wind;                       // drawing breath
    if (R.t < ROAR.wind + ROAR.blast) return 1;                        // held
    return Math.max(0, 1 - (R.t - ROAR.wind - ROAR.blast) / ROAR.settle);
  }
  // The circle of influence, in the stone's own colour. It does not grow: it appears and goes
  // at EXACTLY the radius the Hammer reaches, because that is the one thing it is for. An
  // expanding ring says "a wave is travelling outward" and invites you to watch where it gets
  // to; the Hammer does not work like that. smashStones takes every stone whose centre lies
  // within HAMMER_TILES cells of him, measured straight — so this is that circle, drawn.
  function drawRoarRing(){
    const R = state && state.roar; if (!R || !R.fired) return;
    const u = Math.min(1, (R.t - ROAR.wind) / ROAR.blast);
    const p = visualAt(state.runIdx + state.runT);
    // quick to arrive, slower to leave
    const a = u < 0.12 ? u/0.12 : Math.pow(Math.max(0, 1 - (u - 0.12)/0.88), 1.5);
    if (a <= 0.004) return;
    const C = ROAR_KIND[R.kind] || ROAR_KIND.finger;
    const R2 = (R.kind === "pulse" ? PULSE_TILES : HAMMER_TILES) * cell;
    ctx.save();
    // The flat disc: the reach itself, stated plainly and at one size.
    ctx.globalAlpha = 0.45 * a;
    ctx.fillStyle = C.fill;
    ctx.beginPath(); ctx.arc(p.x, p.y, R2, 0, Math.PI*2); ctx.fill();
    // ...and over it, the blast RUNNING OUT to that edge. It races the whole way in the first
    // fifth of the shout and then holds — so it reads as something arriving at the boundary
    // rather than as a wave still travelling when the stones have already gone.
    //
    // Clear in the middle and solid at the rim: the force is at the FRONT of the thing, and he
    // is standing in the quiet at its centre. Bright at him instead would have put the loudest
    // part of the picture on the one spot nothing happens, and hidden him behind it.
    const grow = Math.min(1, u / 0.20);
    const rad = R2 * (1 - Math.pow(1 - grow, 3));

      const g2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
      g2.addColorStop(0,    C.mid + "0)");
      g2.addColorStop(0.55, C.mid + (0.22*a).toFixed(3) + ")");
      g2.addColorStop(0.88, C.rim + (0.72*a).toFixed(3) + ")");
      g2.addColorStop(1,    C.rim + a.toFixed(3) + ")");
      ctx.globalAlpha = 1;

  // One more tile in the hand, dropped as close to the middle of the board as there is room
  // for. It goes down LOOSE, exactly as if you had dragged it there yourself: it is a fourth
  // tile to cycle, not a piece of track laid for you.
  function spawnSpareTile(col) {
    const s = state;
    const t = { id: s.tiles.length, c: 0, r: 0, status: "free", freedAt: ++s.freeSeq };
    s.tiles.push(t);
    // Free STAYS free. A loose tile that happens to sit where the track could continue links
    // itself on the next frame — that is what closes a circuit — so dropping this one in the
    // exact middle handed the player a length of laid track instead of a tile to carry. Look
    // outward from the middle for the first free cell that does NOT continue the front.
    const occ = occupiedFor(t), h = head();
    const mc = Math.floor(COLS/2), mr = Math.floor(ROWS/2);
    let spot = null;
    for (let rad = 0; rad < Math.max(COLS, ROWS) && !spot; rad++)
      for (let dr = -rad; dr <= rad && !spot; dr++)
        for (let dc = -rad; dc <= rad && !spot; dc++) {
          if (Math.max(Math.abs(dc), Math.abs(dr)) !== rad) continue;   // the ring, not the disc
          const c = mc + dc, r = mr + dr;
          if (!inBounds(c, r) || occ.has(key(c, r))) continue;
          if (trackConnects(h, { c, r }) && !foldsBack(c, r)) continue; // it would lay itself
          spot = { c, r };
        }
    // Every free cell on the board continues the track: take the nearest one anyway rather
    // than give nothing, and let it lay itself. A tile is a tile.
    if (!spot) spot = nearestFreeCell(t, mc, mr);
    if (!spot) { s.tiles.pop(); return false; }   // nowhere free at all — nothing to give
    t.c = spot.c; t.r = spot.r;
    markOccDirty(); updateReadyHud();
    spawnPop(t.c, t.r, col || "#ff8fc8");
    spawnLight(t.c, t.r, 0.9, 460);
    s.shake = Math.max(s.shake, cell * 0.10);
    return true;
  }
  // Every stone inside the ring comes apart at once, however much hit-point it had left.
  // Measured the way the Bell measures monsters — his real position against the stone's real
  // centre — so the two charms cannot disagree about what "within range" means. They no longer
  // reach the same distance: the Bell takes two tiles, the Hammer one.
  function smashStones(tiles) {
    // No burst of light and no ring per stone. The Hammer says what it does with ONE shape —
    // the filled circle of its reach — and every extra pulse thrown on top argued with it,
    // expanding past an edge the circle had just drawn. The stones still throw their shards,
    // because that is the rock coming apart rather than an effect about the rock.
    const s = state, rp = visualAt(s.runIdx + s.runT), reach = tiles * cell;
    const doomed = [];
    for (const sk of s.stones.keys()) {
      const i = sk.indexOf(","), c = +sk.slice(0, i), r = +sk.slice(i+1);
      // TOUCHING is enough: the circle takes any stone it overlaps at all, rather than only
      // those whose CENTRE it reaches. Measuring to centres meant the drawn circle could lie
      // visibly across a stone and leave it standing — and at a one-tile reach the stone in the
      // very next square sits at exactly that distance, so whether it broke came down to
      // floating point. Nearest point on the stone's square to him, against the radius.
      const nx = Math.max(c*cell, Math.min(rp.x, (c+1)*cell));
      const ny = Math.max(r*cell, Math.min(rp.y, (r+1)*cell));
      if (Math.hypot(nx - rp.x, ny - rp.y) <= reach) doomed.push([sk, c, r]);
    }
    for (const [sk, c, r] of doomed) {
      s.stones.delete(sk);
      const wx = (c+0.5)*cell, wy = (r+0.5)*cell;
      for (let i = 0; i < 12; i++) {
        const a = (i/12)*Math.PI*2 + (i%5)*0.29, sp = cell*0.0015;
        s.shards.push({ x:wx, y:wy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - cell*0.0007,
                        life:0, max:400, sz: cell*0.06*(0.6 + (i%3)*0.25) });
      }
    }
    if (doomed.length) { markOccDirty(); s.shake = Math.max(s.shake, cell*0.20); }
    Sound.power("finger");
    if (doomed.length) Sound.crunch(1);
    return doomed.length;
  }
  // One ring out from where he stands, and every monster caught inside it comes apart.
  //
  // Measured from his own position rather than his cell, and against each monster's world
  // position rather than its cell, so a thing halfway between two squares is judged on where it
  // actually IS. Rounding both to cells first made the reach lopsided — a monster a whisker
  // inside the reach could round out of range while one further off rounded in.
  function unmakeMonsters(tiles, col) {
    // No burst of light: the Bell states its reach with the one circle, the same way the
    // Hammer does, and a second expanding ring on top only argued with it.
    const s = state, rp = visualAt(s.runIdx + s.runT), reach = tiles * cell;
    // TOUCHING is enough, as with the Hammer. A monster is a cell-sized body about its own
    // position, so this is the nearest point of THAT square against the radius — a monster the
    // circle visibly lies across comes apart, rather than surviving because its middle was a
    // few pixels outside.
    const h2 = cell/2;
    const doomed = s.hazards.filter(h => {
      if (h.kind !== "monster") return false;
      const nx = Math.max(h.wx - h2, Math.min(rp.x, h.wx + h2));
      const ny = Math.max(h.wy - h2, Math.min(rp.y, h.wy + h2));
      return Math.hypot(nx - rp.x, ny - rp.y) <= reach;
    });
    if (!doomed.length) return 0;           // the shout already rang; nothing to add
    for (const h of doomed) {
      const body = (monKind(h).body) || col;
      for (let i = 0; i < 14; i++) {                   // it comes apart the way a stone does
        const a = (i / 14) * Math.PI * 2 + (i % 5) * 0.31, sp = cell * 0.0016;
        s.shards.push({ x:h.wx, y:h.wy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - cell*0.0007,
                        life:0, max:420, sz: cell*0.06*(0.6 + (i % 3)*0.25), color: body });
      }
    }
    s.hazards = s.hazards.filter(h => !doomed.includes(h));
    markOccDirty();                     // a blocking monster gone means the cell opens up
    s.shake = Math.max(s.shake, cell * 0.20);
    Sound.smash();
    return doomed.length;
  }
  // Step him back up to `n` tiles and put the board back the way it was when he was there.
  //
  // Moving runIdx alone is not enough. Once he passes a tile it frees, and the player has very
  // likely dragged it round to the front — where it is now holding up track. Winding him back
  // onto that node means taking the tile off the front and returning it, which in turn means
  // the track it was carrying has to come up too, along with everything laid beyond it.
  // Nothing is destroyed: whatever is orphaned goes back into his hand.
  function rewindRunner(n) {
    const s = state;
    // A tile eaten by a crumbling floor is gone for good, so the rewind stops short of it
    // rather than standing him on a hole.
    let target = s.runIdx;
    for (let k = 0; k < n; k++) {
      const nd = s.path[target - 1];
      if (!nd) break;
      if (nd.kind === "tile" && nd.tileId != null) {
        const t = s.tiles[nd.tileId];
        if (!t || t.status === "spent") break;
      }
      target--;
    }
    if (target === s.runIdx && s.runT < 0.02) return false;   // already as far back as it goes

    // Which tiles the rewound stretch needs, and the node each one has to return to.
    const want = new Map();
    for (let i = target; i <= s.runIdx && i < s.path.length; i++) {
      const nd = s.path[i];
      if (nd.kind === "tile" && nd.tileId != null && s.tiles[nd.tileId]) want.set(nd.tileId, nd);
    }
    // If one of them is laid ahead of him, the path is cut at the earliest such placement:
    // everything past that point was reached over ground that is about to move.
    let cut = s.path.length;
    for (let k = s.runIdx + 1; k < s.path.length; k++) {
      const nd = s.path[k];
      if (nd.kind === "tile" && nd.tileId != null && want.has(nd.tileId)) { cut = k; break; }
    }
    // Everything past the cut goes back into his hand where it lies — except the tiles being
    // reclaimed, which are about to be put back where they came from instead.
    for (let k = cut; k < s.path.length; k++) {
      const nd = s.path[k];
      if (nd.kind !== "tile" || nd.tileId == null) continue;
      const t = s.tiles[nd.tileId];
      if (t && !want.has(nd.tileId)) { t.status = "free"; t.freedAt = ++s.freeSeq; }
    }
    if (cut < s.path.length) s.path.length = cut;

    // Put the reclaimed tiles back under him, live track again. Clearing `exited` is what lets
    // each one free up a second time as he runs it — without that the tile would be stranded
    // on the board for the rest of the level.
    for (const [id, nd] of want) {
      const t = s.tiles[id];
      t.c = nd.c; t.r = nd.r; t.status = "active";
      nd.exited = false;
      spawnPop(nd.c, nd.r, "#9ad9b0");
    }

    s.runIdx = target; s.runT = 0;
    s.shake = Math.max(s.shake || 0, cell * 0.08);
    markOccDirty(); updateReadyHud(); linkParkedTiles();
    snapCamera();
    return true;
  }
  function runnerCell() {
    const n = state.path[Math.min(state.runIdx, state.path.length-1)] || state.path[0];
    return { c: n.c, r: n.r };
  }
  // Runs every frame while a timed power is up: counts it down, and does whatever that
  // particular power does per-tick. The Finger has no clock, so it is absent from here.
  function tickPower(dt) {
    const s = state;
    if (s.coinFly.length) {                       // coins already in flight, wherever from
      for (const f of s.coinFly) f.t += dt;
      for (const f of s.coinFly) if (f.t >= COIN_FLY_MS && !f.done) { f.done = true; grabCoin(f.c, f.r, true); }
      s.coinFly = s.coinFly.filter(f => !f.done);
    }
    if (!s.power.kind || s.power.t <= 0) return;
    s.power.t -= dt;
    if (s.power.kind === "magnet") {
      // Anything within reach comes off the board now and flies in; the pickup itself
      // lands when it arrives, so the sound and the score follow the coin rather than
      // the button press.
      const rp = visualAt(s.runIdx + s.runT), rx = rp.x/cell, ry = rp.y/cell;
      for (const ck of Array.from(s.coinCells)) {
        const i = ck.indexOf(","), c = +ck.slice(0, i), r = +ck.slice(i+1);
        if (Math.hypot(rx - (c+0.5), ry - (r+0.5)) > MAGNET_CELLS) continue;
        s.coinCells.delete(ck);
        s.coinFly.push({ c, r, t: 0, done: false });
      }
    }
    if (s.power.t <= 0) {                          // done — put everything back

      s.power.kind = null; s.power.t = 0; s.power.armed = false;
    }
  }
  // one coin, collected — shared by passing over it and by the Magnet reeling it in
  // `flew` marks a coin the Magnet reeled in. Running over one is a single event and earns
  // the full pop; a magnet pulls a fistful at once, and five or six rings expanding out of
  // five or six different cells reads as a fault rather than a reward. The tally and the
  // sound still fire, so nothing is lost — only the ripples.
  function grabCoin(c, r, flew) {
    const s = state;
    s.coinsGot++; s.score = computeScore(); updateScoreHud();
    // Held, not banked. What you pick up is yours only if you finish — see endWin. The tally
    // still counts up as you go, because the number it shows is what you WOULD walk away with,
    // and a run where the figure never moved would be a run with nothing to lose.
    s.purse += COIN_TILES;
    // A coin the Magnet reeled in was collected AT THE RUNNER, not where it had been lying —
    // it flew the whole way to him and the cell it left is empty by now. Firing the tally at
    // its old address popped the number up over bare ground somewhere off across the board,
    // and with a fistful arriving at once they scattered. Fractional cell coordinates, because
    // he is between cells more often than not and the card should leave from where he IS.
    if (flew && s.status === "play" && s.path && s.path.length) {
      const rp = visualAt(s.runIdx + s.runT);
      showTally(rp.x/cell - 0.5, rp.y/cell - 0.5);
    } else showTally(c, r);
    if (!flew) { spawnPop(c, r, "#ffd24a"); spawnLight(c, r); }
    Sound.coin(); haptic(6);
  }
  // The Hammer of God: lift a tile that has already been laid, along with everything laid
  // after it, and put it back in your hand. Only ahead of the runner — pulling the ground
  // out from under him would just be a scripted death.

  // the runner grabs the key by passing over its cell
  function collectKey() {
    const s = state;
    const rp = visualAt(s.runIdx + s.runT);
    const near = (c, r) => Math.hypot(rp.x-(c+0.5)*cell, rp.y-(r+0.5)*cell) < cell*0.7;
    const nearTight = (c, r) => Math.hypot(rp.x-(c+0.5)*cell, rp.y-(r+0.5)*cell) < cell*0.3;  // boost/slow: must nearly overlap
    // coins: grabbed by passing over them
    for (const ck of Array.from(s.coinCells)) {
      const [c, r] = ck.split(",").map(Number);
      if (near(c, r)) { s.coinCells.delete(ck); grabCoin(c, r); }
    }
    // talismans: passing over one unlocks it permanently, win or lose
    for (const t of s.talismans) {
      if (t.got || !near(t.c, t.r)) continue;
      t.got = true;
      const def = talById(t.id);
      const fresh = unlockTalisman(t.id);
      spawnPop(t.c, t.r, def ? def.col : "#ffd24a"); spawnLight(t.c, t.r);
      Sound.coin(); haptic([8, 30, 8]);
      // A level with a talisman and NO flag is that talisman's own maze: the charm IS the
      // exit, so picking it up finishes the level. Everywhere else it is just a pickup.
      if (!s.goal) { endWin(def); return; }
      // A talisman you already own pays out instead of doing nothing.
      if (fresh) flashTalisman(def);
      else { s.purse += COIN_TILES*2; showTally(t.c, t.r);
             s.score = computeScore(); updateScoreHud(); }
    }
    // boost / slow pickups: grabbed by passing over them → a time-limited speed effect
    for (const bk of Array.from(s.boost)) {
      const [c, r] = bk.split(",").map(Number);
      if (nearTight(c, r)) { s.boost.delete(bk); s.speedFx = { kind:"boost", t:BOOST_MS };
                        spawnPop(c, r, pal("boost")); spawnLight(c, r); (Sound.boost||Sound.coin)(); haptic(12); }
    }
    for (const bk of Array.from(s.slow)) {
      const [c, r] = bk.split(",").map(Number);
      if (nearTight(c, r)) { s.slow.delete(bk); s.speedFx = { kind:"slow", t:SLOW_MS };
                        spawnPop(c, r, pal("slow")); (Sound.slow||Sound.coin)(); haptic(12); }

    if (!s.keyCollected) {
      for (const k of s.keys) if (!k.got && near(k.c, k.r)) {
        k.got = true; spawnPop(k.c, k.r, k.color); haptic(10); Sound.key();
        for (const d of s.doors) if (d.color === k.color) d.open = true;
      }
      if (s.keys.every(k => k.got)) { s.keyCollected = true; updateKeyHud(); }
    }
    // doors keep their lock marker until the runner physically passes through them
    for (const d of s.doors) if (!d.reached && near(d.c, d.r)) d.reached = true;
  }

  // A tile becomes draggable the moment the runner crosses out of its cell
  // (i.e. past its centre-to-next midpoint), not when it reaches the next tile.
  function freeClearedTiles() {
    const s = state, param = s.runIdx + s.runT;
    let changed = false;
    for (let i = 0; i < s.path.length; i++) {
      const node = s.path[i];
      // fixed platforms clear like track but cost nothing and go back to the level,
      // not to your pool — no score, no combo, they're free ground.
      if (node.kind === "platform") {
        if (!node.exited && param > i + 0.5) {
          node.exited = true;
          Sound.clearTile();
          spawnLight(node.c, node.r);
        }
        continue;
      }
      if (node.kind !== "tile" || node.exited) continue;   // per-node, so re-placed tiles are unaffected
      if (param > i + 0.5) {
        node.exited = true;                                 // this placement is done
        Sound.clearTile();                                  // play a tone as the tile clears
        spawnLight(node.c, node.r);                         // burst of light from the cleared tile
        scoreClear(i);                                      // score, combo, juice on the beat
        if (node.tileId != null) {
          const t = s.tiles[node.tileId];
          if (t) {
            if (s.singularity.has(key(node.c, node.r))) {       // fragile floor: tile is consumed
              // It does not just stop existing. The rift takes it: a ghost of the tile is left
              // behind to spiral into the eye the way everything else on this square does, so
              // the one time the player LOSES a tile is the one time they get to watch it go.
              s.eaten.push({ c: node.c, r: node.r, t: 0 });
              t.status = "spent"; t.c = -1; t.r = -1;
              s.collapsed.add(key(node.c, node.r));
              s.shake = Math.max(s.shake, cell * 0.12);
              Sound.swallow();
            } else {
              t.status = "free"; t.freedAt = ++s.freeSeq;
            }
            changed = true;
          }
        }
      }
    }
    if (changed) { markOccDirty(); updateReadyHud(); }   // a tile freed/consumed — occupancy changed
  }

  // Award points for a cleared tile and drive the beat-combo + feedback.
  function scoreClear(clearedIdx) {
    const s = state;
    s.combo++;                       // the combo IS the running score's core (final combo length)
    if (s.combo > s.maxCombo) s.maxCombo = s.combo;
    // wind the pace on. msPerCell is what actually drives movement, so derive it back
    // from the ramped cps, and hand the new beat length to the backing track — the
    // sub-beat notes between clears are scheduled off it.
    s.cpsNow = Math.min(RAMP_MAX_CPS, s.cpsNow + RAMP_PER_TILE);
    s.msPerCell = 1000 / s.cpsNow;
    Sound.setTempo(s.msPerCell);
    // track "flow" clears (a healthy buffer of track ahead) for the star rating
    let ahead = 0;
    for (let j = clearedIdx + 1; j < s.path.length; j++)
      if ((s.path[j].kind === "tile" || s.path[j].kind === "platform") && !s.path[j].exited) ahead++;
    if (ahead >= 2) s.flowClears++;
    s.score = computeScore();
    updateScoreHud();
    s.beatPulse = 1;                 // pulse the visuals on the beat
    haptic(6);
  }

  // Is the cell the runner is about to enter solid? Walls, stones and closed blocks
  // all stop him dead; open air means there is nothing to hit and he just drops.
  function wallAhead() {
    const s = state, last = s.path[s.path.length - 1];
    if (!last) return false;
    const ri = runnerInfo();
    const dc = Math.abs(ri.tx) > Math.abs(ri.ty) ? Math.sign(ri.tx) : 0;
    const dr = dc ? 0 : Math.sign(ri.ty);
    const c = last.c + dc, r = last.r + dr;
    if (!inBounds(c, r)) return false;                    // off the board is a fall, not a wall
    if (s.walls.has(key(c, r))) return true;
    if (s.stones && s.stones.has(key(c, r))) return true;
    for (const b of (s.blocks || [])) {                   // a sliding block counts while it's there
      const bc = b.axis === "h" ? b.pos : b.c, br = b.axis === "h" ? b.r : b.pos;
      if (Math.round(bc) === c && Math.round(br) === r) return true;
    }
    return false;
  }
  // End of the track: hit a wall and he squashes first, otherwise he just runs off.
  function endRun() {
    if (state.status !== "play") return;
    if (!wallAhead()) { startFall(); return; }
    const ri = runnerInfo();
    state.status = "squash";
    state.combo = 0;
    state.squash = { t:0, x:ri.sx, y:ri.sy, angle:ri.angle };
    state.shake = Math.max(state.shake, cell * 0.16);
    Sound.smash();                    // the existing impact voice — thud plus grit
    haptic([18, 40, 10]);
    state.drag = null;
  }
  // squash profile: compress hard, then relax part-way as he peels off the wall
  function squashK() {
    const q = state.squash; if (!q) return 0;
    const u = Math.min(1, q.t / SQUASH_MS);
    return u < 0.45 ? u/0.45 : 1 - 0.45*((u - 0.45)/0.55);
  }
  function tickSquash(dt) {
    const q = state.squash; if (!q) return;
    q.t += dt;
    if (q.t >= SQUASH_MS) { startFall(true); state.squash = null; }   // peeled off the wall
  }

  // `offWall` is the difference between the two ways a run ends. Off a ledge he keeps his
  // forward momentum and gravity takes it from there. Into a wall he has just been stopped
  // dead by something solid, so he comes back off it: thrown BACKWARDS along his own travel
  // direction, popped up a little, and tumbling the other way.
  // Back onto the last tile he actually stood on, and held there. runIdx is already that node —
  // the fall fires as he runs off the END of it — so putting runT back to 0 stands him at its
  // centre rather than half over the edge. The hold is a factor of zero on his pace, the same
  // stop the Hands of Time uses, so nothing else in the game has to know about it.
  function reviveRunner() {
    const s = state;
    // It can now be called mid-tumble, so it has to put the run back rather than merely
    // decline to end it: he is on the board again, and nothing is falling.
    s.status = "play";
    s.fall = null;
    s.ankhGrace = 0;
    s.runT = 0;
    s.combo = 0;
    s.power.armed = false; s.power.kind = null; s.power.t = 0;
    s.hold = REVIVE_HOLD_MS;
    const n = s.path[Math.min(s.runIdx, s.path.length - 1)];
    if (n) { spawnLight(n.c, n.r, 1.4, 700); spawnPop(n.c, n.r, "#7ee0c8"); }
    s.shake = Math.max(s.shake, cell * 0.14);
    Sound.power("ankh");
    haptic([14, 40, 14]);
  }
  // How long the rack stays reachable after he goes over the edge.
  const ANKH_GRACE_MS = 2000;
  const ankhOffered = () =>
    state && talLive("ankh") && talUnlocked.has("ankh") && !state.power.used.has("ankh");
  const WALL_BOUNCE = 0.55;          // of his running speed, sent back the way he came
  const WALL_POP    = 0.62;          // upward kick out of the impact, same units
  // ---------- caught ------------------------------------------------------
  // A monster reaching him used to drop him down the hole on the same frame it touched him,
  // which read as the runner tripping over nothing: the thing that killed you had already
  // rowed on by the time you looked. Now the whole board stops dead on the frame of contact,
  // the bite lands, and that picture is held for a beat before the fall starts.
  //
  // The freeze is total on purpose — the hazards stop mid-thrust and the animation clock stops
  // with them, so idle bobs and jaws hold too. A still frame is what makes the cause legible:
  // you get long enough to see WHAT hit you and from which side.
  const CRUNCH_MS = 420;              // how long the board holds that picture
  function startCrunch() {
    const s = state;
    if (s.status !== "play") return;  // already dying, or not running: nothing to catch
    s.status = "crunched";
    s.crunch = { t: 0, ts: lastTs };  // ts freezes the DRAWN clock at this instant
    Sound.crunch(1);                  // the bite: splintering under the weight of two halves
  }
  function tickCrunch(dt) {
    const s = state; if (!s.crunch) return;
    s.crunch.t += dt;
    if (s.crunch.t < CRUNCH_MS) return;
    s.crunch = null;
    // Hand back exactly the state startFall expects to end — including the Ankh, which is
    // spent in there. Held over the pause, the charm now brings him back after the crunch
    // rather than instead of it, so you see what nearly had him.
    s.status = "play";
    startFall();
  }

  function startFall(offWall) {
    // Every way a run ends comes through here, which is exactly why the Ankh is spent here and
    // not in each of them. Nothing else about the fall has happened yet — no sound, no status
    // change — so bringing him back is simply declining to start it.
    if (state.power.ankh) { state.power.ankh = false; reviveRunner(); return; }
    // ...and if it is equipped but unspent, the fall starts anyway and the offer goes up.
    if (ankhOffered()) state.ankhGrace = ANKH_GRACE_MS;
    const ri = runnerInfo();
    state.status = "falling";
    state.combo = 0;                 // the run ends — combo breaks
    state.shake = Math.max(state.shake, cell * 0.10);
    Sound.fall();                    // descending whistle as the runner tumbles
    haptic(60);
    state.drag = null;
    const spd = cell / state.msPerCell;            // the runner's forward speed (px/ms)
    if (offWall) {
      // "up" is perpendicular to travel, so the pop is away from the track he was on
      const ux = Math.sin(ri.angle), uy = -Math.cos(ri.angle);
      state.fall = { x:ri.sx, y:ri.sy, angle:ri.angle,
                     vx: -ri.tx*spd*WALL_BOUNCE + ux*spd*WALL_POP,
                     vy: -ri.ty*spd*WALL_BOUNCE + uy*spd*WALL_POP,
                     va: (ri.tx >= 0 ? -1 : 1) * 0.006, t:0, cell0: cell, floor: worldH + viewH*PILE_DROP, px: ri.sx };
    } else {
      state.fall = { x:ri.sx, y:ri.sy, angle:ri.angle,
                     vx:ri.tx * spd, vy:ri.ty * spd,  // run off the edge, then gravity takes over
                     va:(ri.tx >= 0 ? 1 : -1) * 0.004, t:0, cell0: cell, floor: worldH + viewH*PILE_DROP, px: ri.sx };
    }
  }
  // How far below the board the heap sits, and how long he lies in it before the words come.
  // The drop pushes IN. Everything on the board is measured in cells, the heap included, so the
  // whole scene scales together and the bodies stay the size of the runner lying on them.
  const PILE_DROP = 1.35, PILE_REST = 2200, FALL_ZOOM = 1.35;
  const PILE_SKIRT = 5;                     // rows of heap carried on below the base, off-frame
  const WRIGGLE_MS = 1700;                  // how long the legs go on kicking once he is in
  const LAND_SPRING = 700;                  // ...and how long the impact takes to settle out
  const pileY = () => (state.fall && state.fall.floor != null) ? state.fall.floor
                                                               : worldH + viewH*PILE_DROP;
  // The drop pushes IN on him. Everything on the board is measured in `cell`, so growing it is
  // the zoom — but the fall is carried in world pixels, and those have to be dragged along with
  // it or he would be left behind by his own scale. The camera is derived from him each frame
  // anyway, so it needs no correction of its own.
  function tickFallZoom(dt) {
    const f = state.fall; if (!f || !f.cell0) return;
    const want = f.cell0 * FALL_ZOOM;
    const nc = cell + (want - cell) * Math.min(1, dt/520);
    const k = nc / cell;
    if (!(k > 0) || Math.abs(k - 1) < 1e-7) return;
    cell = nc; worldW = cell*COLS; worldH = cell*ROWS;
    zoomWorldPoints(k);
    f.x *= k; f.y *= k; f.vx *= k; f.vy *= k; f.floor *= k; f.px *= k;
    camX *= k; camY *= k;
  }
  function tickFall(dt) {
    const f = state.fall;
    if (f.land != null) {                      // down. Lie there a moment, then say so.
      f.land += dt;
      // The zoom is still running under him, and the heap is measured in cells — so its summit
      // rises while he lies on it. Sit him back on top of it each frame rather than leaving him
      // at the height it was when he arrived.
      // His FEET sit above the crest and everything else hangs below it. Drawn behind the heap,
      // that is what leaves a pair of legs kicking out of the top of a pile that has closed over
      // the rest of him — level with the crest, the summit row covers the legs too and he goes
      // missing altogether.
      const spot = pileLandSpot();
      f.y = spot.y; f.x += (spot.x - f.x) * Math.min(1, dt/160);
      // The landing has a bit of give in it: he tips over on impact and springs back to where
      // he ends up, on a damped wobble rather than a slide, so it reads as him being caught by
      // something soft rather than being placed there.
      const k = Math.min(1, f.land/LAND_SPRING);
      f.angle = f.rest + Math.exp(-k*5.2) * Math.sin(k*Math.PI*2.6) * 0.55;
      // ...and the legs kick, and give up. The phase advances at a rate that runs down to
      // nothing over WRIGGLE_MS, so the kicking slows to a halt rather than being switched off
      // — he stops because he has stopped, not because a timer said so.
      f.wrig += dt * Math.max(0, 1 - f.land/WRIGGLE_MS);
      if (f.land >= PILE_REST && !(state.ankhGrace > 0)) showLose();
      return;
    }
    f.t += dt; f.vy += FALL_G * dt;
    f.x += f.vx * dt; f.y += f.vy * dt; f.angle += f.va * dt;
    // The heap. He does not fall forever and he does not vanish either — he lands on everyone
    // who came before him, which is the joke, and it is only a joke if you see him arrive.
    // He lands on the SUMMIT, not on the floor the heap is built up from — otherwise he ends
    // the fall buried in the middle of it with bodies drawn over his head.
    if (f.y >= pileLandSpot().y) {
      f.land = 0; f.vy = 0; f.vx *= 0.2; f.va = 0;
      // HEAD FIRST. Turned all the way over, his feet end up at the anchor and everything else
      // is drawn below it — so anchoring him at the summit buries the head in the heap and
      // leaves the legs sticking out of the top of it, which is the whole picture.
      f.rest = Math.PI + (f.vx >= 0 ? 0.20 : -0.20);
      f.angle = f.rest;
      f.wrig = 0;
      state.shake = Math.max(state.shake || 0, cell*0.18);
      Sound.thud ? Sound.thud() : Sound.clack();
      haptic(18);
      return;
    }
    // ...but not while the Ankh is still on offer. The drop is shorter than the grace, and
    // ending the run underneath an offer the player is still reaching for would make the
    // second chance a lie.
    if (f.t >= FALL_MS*4 && !(state.ankhGrace > 0)) showLose();   // a backstop, nothing more
  }
  // A whip pan: the camera goes after him rather than watching him leave, and it is allowed
  // BELOW the board to do it — the clamp that keeps the level in frame is the one thing that
  // would stop the fall being followed at all.
  function tickFallCam(dt) {
    const f = state.fall; if (!f) return;
    const want = f.y - viewH*0.62;               // the summit sits low, the heap running off the foot
    camY += (want - camY) * Math.min(1, dt/90);
    // Centred on the HEAP, not on him: he comes down off to one side of the peak, and a camera
    // that follows him puts the mountain off-centre for the whole of the fall and the screen it
    // ends on. The heap is the subject by then; he is a detail on top of it.
    camX += ((pileMidX() - viewW/2) - camX) * Math.min(1, dt/140);
  }
  // Finishing a level earns you a compliment. Sort of. Split by whether you got it
  // first go or wore it down, because the backhand lands differently either way.
  const WIN_QUIPS = [
    "First go. Don't get used to it.",
    "Clean. Suspiciously clean.",
    "That was almost elegant.",
    "You made it look harder than it was.",
    "Textbook — if the textbook had typos.",
    "Efficient. Not the word I'd have picked, but efficient.",
    "Nicely done. The flag was getting bored.",
    "Great instincts. We'll work on the pace.",
    "Barely a wasted tile. Barely.",
    "Confidence like that can't be taught. Timing can.",
    "Smooth. Ish.",
    "The runner never doubted you. Not out loud.",
    "Solid work, by the standards you've set.",
    "You had a plan the whole time. Obviously.",
  ];
  const WIN_QUIPS_RETRY = [
    "Got there in the end. Emphasis on 'end'.",
    "Persistence is a kind of talent.",
    "That's the one. We'll ignore the others.",
    "Practice makes… this.",
    "Beautiful. Let's never speak of the attempts.",
    "You wore it down. That counts.",
    "Whichever try that was, it's the one that counts.",
    "The floor forgives you.",
    "A masterclass in trial and error. Mostly error.",
    "Took a few goes, but the last one was lovely.",
    "Every failure taught you something. Allegedly.",
    "Worth the wait. For you, anyway.",
  ];
  const pickQuip = a => a[(Math.random() * a.length) | 0];

  function endWin(relic) {
    state.status = "win";
    Sound.levelMusicStop();        // the level's backing ends with the level
    const att = state.attempts || 1;
    // THE payout. Everything the run picked up has been sitting in the level's own purse; it
    // moves into the wallet here and nowhere else, so reaching the flag is what the coins are
    // actually for. Falling short forfeits them — see showLose, which banks nothing.
    wallet.tiles += state.purse || 0;
    state.purse = 0;
    saveWallet();
    {                                           // remember it's cleared — nothing else to track
      const best = loadBest(), keyId = "L" + levelIdx;
      best[keyId] = { done: true };
      saveBest(best);
    }
    Sound.win();
    haptic([12, 40, 12]);
    const last = levelIdx >= LEVELS.length - 1;
    // A talisman maze gets its own curtain call: the charm itself, big and turning, its name
    // and what it does. Reaching the end of one of these is the only time the game hands you
    // a new verb, so it does not share the ordinary "Chapter Clear" card.
    if (relic) {
      // Finding one of these is the rarest thing in the game, and it used to be a card with a
      // picture on it. It gets a ceremony now: the board goes, he stands alone in the dark, a
      // shaft of light finds him, and the charm comes down out of it. Nothing is on screen but
      // those two until the horns land — the name, what it does, and only then the way out.
      startCeremony(relic, last);
      return;
    }
    relicShow = null;
    // The ordinary clear plays as a MOVE rather than as a screen — see winStart. The last level
    // still gets the card, because there is no next square to fly to and the run of the whole
    // campaign deserves saying out loud rather than being answered with a map.
    if (!last) { winStart(false); return; }
    state.end = { kind:"win", last,
      title: last ? "That's All of Them" : "Chapter Clear",
      byline: last
        ? "All " + LEVELS.length + " chapters. You've run out of track — and excuses."
        : pickQuip(att > 1 ? WIN_QUIPS_RETRY : WIN_QUIPS) };
    openMenu("main");
  }
  // Anything held in WORLD PIXELS has to be dragged along when the cell size changes under it.
  // The board itself is measured in cells and rescales for free; the runner's wake is not — its
  // points were laid down at whatever the cell was at the time, so a zoom left the ribbon at its
  // old size, hanging off a level that had shrunk out from under it.
  function zoomWorldPoints(k) {
    if (!(k > 0) || Math.abs(k - 1) < 1e-7) return;
    for (const p of (state.trail || [])) { p.x *= k; p.y *= k; }
  }

  // ---------- The heap ----------------------------------------------------
  // Everyone who has already fallen off this chapter, lying at the bottom of the drop. It is
  // the one place the game keeps a tally of your failures, and it keeps it in the only form
  // that is funny rather than discouraging: a soft landing, made of you.
  //
  // Deterministic — the scatter is a hash of the body's index, not a random number — so the
  // heap does not reshuffle itself every frame, and it is the same heap on the way down as it
  // is once he is lying in it.
  // Each body is dressed out of the SHOP: a drip and a hat and a pair of kicks pulled from the
  // real racks, so the heap is a crowd of runners who each got as far as this and no further —
  // wearing what they were wearing when they did. Deterministic per body, and it costs nothing:
  // paintRunner already takes a whole outfit through `as`, it was just being handed one colour.
  function pileOutfit(rnd) {
    const pick = (arr) => arr[(rnd()*arr.length) | 0];
    return { skin: pick(SKIN_COLOURS), hat: pick(HATS), kicks: pick(KICKS), dead: true };
  }
  // mulberry32, not a one-line index hash. The first attempt used the latter and every body's
  // HEIGHT came out correlated with its position across the heap — so instead of filling the
  // mound they traced its outline, and a pile of thirty runners read as a rainbow.
  const PILE_SEED = 0x51ed2701;
  // The heap's geometry, in one place: the tap that lands him on the summit and the drawing
  // that builds the summit have to agree about where it is.
  //
  // The BASE is wide enough to leave the screen on both sides, and the row count follows from
  // it rather than being chosen — a stack that loses two bodies a row only comes to a POINT if
  // it has half as many rows as its base is wide. Picking the two independently is what gave
  // the first version a plateau with the flanks still off-screen.
  const pileMidX = () => (state.fall && state.fall.px != null) ? state.fall.px : worldW/2;
  const F0x = () => (state.fall ? state.fall.x : worldW/2);   // where the impact was, this frame
  // Where he comes down: NOT the apex, but one or two places down the flank of it. Landing
  // dead on the point is a stunt; landing just off it, on the slope, is a fall. `d` is how many
  // places out he lands, and the height follows from the heap's own arithmetic — a body `d`
  // steps from the middle is covered by every row that still has 2d+1 columns in it.
  function pileLandSpot() {
    const G = pileGeom();
    const d = 1 + ((state.attempts || 1) & 1);
    const side = (state.fall && state.fall.vx < 0) ? -1 : 1;
    // Row r is 2r columns narrower than the base, so it reaches out to (cols-2r-1)/2 steps —
    // which puts the highest row covering distance `d` at rows - d.
    const row = Math.max(0, Math.min(G.rows - 1, G.rows - d));
    // ...and high enough above that row for the legs to clear the bodies lying on it. He is
    // drawn BEHIND the heap, so level with the local surface is out of sight entirely.
    return { x: pileMidX() + side*d*G.stepX - cell*0.22,
             y: pileY() - row*G.stepY - cell*0.55 };
  }
  function pileGeom() {
    // Squeezed toward the middle: a narrow step across packs the bodies into each other, so the
    // mountain is a dense mass at the centre of the screen rather than a thin slope spread the
    // whole way over it. The base still reaches the edges — it is the middle that is crowded.
    const s = cell, stepX = s*0.22, stepY = s*0.23;
    // The ROW COUNT leads and the base follows it. Deriving the rows from a screen-wide base
    // gave a heap twenty-odd rows tall — far more of it than the moment needs. Seven rows, and
    // a base exactly wide enough that losing two columns a row brings it to a point.
    const rows = Math.min(10, 7 + Math.floor(((state.attempts || 1) - 1)/3));
    return { stepX, stepY, rows, cols: rows*2 + 1 };
  }
  function drawFallPile(ts) {
    if (state.status !== "falling" && state.status !== "lose") return;
    const y0 = pileY(), s = cell;
    // BUILT, not scattered. Rows, each one two bodies narrower than the row below it, stacked
    // and offset half a step like brickwork — so the silhouette is a triangle by construction
    // rather than by luck. Random placement kept producing a cloud with a vaguely pointed top;
    // the shape has to be the structure, and the randomness only what stops it looking stamped.
    const G = pileGeom();
    const stepX = G.stepX, stepY = G.stepY, rows = G.rows, cols0 = G.cols;
    const rnd = mulberry32(PILE_SEED);
    // The impact, still ringing. He lands ON these people, and a heap that takes a body without
    // moving is a heap made of bricks — so everything near the point of contact is shoved a
    // little way clear of it and settles back over the next half second. It is a function of
    // how long ago he landed, so the bodies drift home on their own with nothing to remember.
    const F = state.fall;
    const hit = (F && F.land != null) ? Math.exp(-F.land/380) : 0;
    const REACH = s*3.2;
    let k = 0;
    // Top row first, bottom row last: on a heap the bodies nearest you are the ones at the
    // front of the base, and they overlap everything behind them.
    // ...and it carries on BELOW the base. The camera frames the summit high enough now that the
    // bottom row would otherwise be on screen, and a mountain with a visible underside is a
    // mountain floating in the air. The extra rows are full width and simply run off the frame.
    for (let r = rows - 1; r >= -PILE_SKIRT; r--) {
      const cols = Math.max(1, cols0 - Math.max(0, r)*2);
      for (let c = 0; c < cols; c++, k++) {
        const j1 = rnd(), j2 = rnd(), j3 = rnd(), j4 = rnd(), j5 = rnd();
        const fit = pileOutfit(rnd);
        let x = pileMidX() + (c - (cols - 1)/2)*stepX + (j1 - 0.5)*s*0.10;
        let y = y0 - r*stepY + (j2 - 0.5)*s*0.08;
        let shove = 0;
        if (hit > 0.004) {
          const dx = x - F.x, dy = y - F.y, dd = Math.hypot(dx, dy) || 1;
          shove = hit * Math.max(0, 1 - dd/REACH);         // nearest are shifted most
          x += dx/dd * shove * s*0.30;
          y += dy/dd * shove * s*0.22;
        }
        ctx.save();
        // Solid, every one of them. The back rows used to sit a shade quieter to give the heap
        // some depth, but a translucent body lets the one behind it show through its head — and
        // a pile you can see INTO is a pile of ghosts. The size ramp does the depth now.
        // Every one of them at its OWN angle, right round the circle. Alternating two clusters
        // of tilt gave a heap where half the bodies leaned one way and half the other, which
        // reads as a pattern; a body that has landed on a pile of bodies is lying however it
        // landed, and no two of them landed the same way. They also turn a little as they are
        // shoved, away from him, which stops the impact reading as one sheet sliding.
        // More than half of them are UPSIDE DOWN — legs in the air, head in the heap. That is
        // how you arrive here: head first, off the end of a chapter, the same way he just did.
        // The rest lie any which way, so the heap does not come out combed.
        const ang = (j5 < 0.58 ? Math.PI + (j4 - 0.5)*1.2 : j4*Math.PI*2)
                  + shove * 0.5 * (x >= F0x() ? 1 : -1);
        // Bigger toward the BOTTOM. Nothing about a heap is in perspective, but a body at the
        // front of the base being half again the size of one at the peak is the cheapest way to
        // say that the peak is further away — and it makes the mountain read as one object
        // rather than as a stack of identical stickers.
        const depth = rows > 1 ? 1 - Math.max(0, r)/(rows - 1) : 1;
        paintRunner(x, y, s*(0.82 + depth*0.46 + j3*0.08), j4*6, ang, false, ts, 0, false,
                    fit);
        ctx.restore();
      }
    }
  }

  // ---------- The victory sequence ----------------------------------------
  // Reaching the flag used to open the pause menu with a different heading on it. It now plays
  // out as a move of the CAMERA rather than as a screen: the level pulls back until you can see
  // the whole of it, your route rebuilds itself across it in the order you laid it, and then the
  // level keeps shrinking until it is one square of the Tileverse — its own square, in its own
  // place — with the next one lighting up beside it. Nothing cuts. The point of it is that the
  // level you just played and the dot on the map are shown to be the same object.
  const WIN = {
    fit:   700,    // pull back until the whole level is on screen
    hold:  240,    // ...a beat, so the pull-back lands before anything else starts
    rest:  560,    // ...and another with the finished route standing there
    out:  1200,    // the level shrinks into its square on the map
                   // (LEVEL N COMPLETE has no duration: it waits for a tap — see tickWin)
    pan:   950,    // over to the next square, which colours up
    whip:  520,    // and into it, to black
    fade:  480,    // out of black, into the next level
    route:1500,    // the rebuild takes this long however long the route is
  };
  let win = null;
  let _mapCells = null;                         // tileverseLayout is a search; do it once
  const mapCells = () => (_mapCells || (_mapCells = tileverseLayout(LEVELS.length)));
  const easeOut  = k => 1 - Math.pow(1 - k, 3);
  const easeIn   = k => k*k*k;
  const easeBoth = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;

  function winStart(last) {
    // The route, start included. `walked` records every cell he stood on as he stood on it,
    // which is the only record of the whole thing: the path itself is recycled out from behind
    // him as he goes.
    const route = (state.walked || []).slice();
    win = { ph: "fit", t: 0, last, idx: levelIdx, next: Math.min(LEVELS.length - 1, levelIdx + 1),
            route, laid: 0, cell0: cell, black: 0, shine: 0.35 };
    // Whatever cell size shows the whole board with a tile of air around it.
    win.cellFit = Math.max(4, Math.min(viewW/(COLS + 2), viewH/(ROWS + 2)));
    win.stepMs = route.length ? WIN.route / route.length : 40;
    hideWinUI();
  }
  function winEnd() { win = null; hideWinUI(); }
  // A tap anywhere moves the paused beat on. Returns true when it took the tap, so the board's
  // own pointer handling can leave it alone.
  function winTap() {
    if (!win || win.ph !== "name" || win.t < 700) return false;   // not until it has arrived
    Sound.unlock(); Sound.tapBig();
    win.ph = "pan"; win.t = 0;
    return true;
  }
  function showWinUI() {
    const el = document.getElementById("winui"); if (!el) return;
    const nx = document.getElementById("win-next");
    labelWithArrow(nx, "Play Chapter");
    el.classList.add("show");
  }
  function hideWinUI() {
    const el = document.getElementById("winui"); if (el) el.classList.remove("show");
  }

  // Where a level's square sits on screen, given the scale and where the camera is looking.
  // The map is laid out in whole cells; `S` is how many pixels one of them is.
  function mapRect(i, S, cx0, cy0) {
    const cells = mapCells(), p = cells[i] || { c: 0, r: 0 };
    return { x: viewW/2 + (p.c - cx0)*S - S/2, y: viewH/2 + (p.r - cy0)*S - S/2, w: S, h: S };
  }
  // The whole map, drawn on the board's own canvas rather than in the menu's DOM: this has to
  // be something the camera can fly through, and a grid of buttons is not.
  function drawMap(ts, S, cx0, cy0, opts) {
    const cells = mapCells(), best = loadBest(), o = opts || {};
    const isDone = k => { const b = best["L" + k]; return !!(b && (b.done || b.stars)); };
    let furthest = -1;
    for (let k = 0; k < LEVELS.length; k++) if (isDone(k)) furthest = k;
    // No gap between squares. The menu's map spaces them out because it is a list of places you
    // can press; this one is a PLACE — the cosmos seen close up — and the levels are the ground
    // of it, so they meet edge to edge with nothing showing between.
    const r = tileR(S);
    for (let i = 0; i < cells.length; i++) {
      const R = mapRect(i, S, cx0, cy0);
      if (R.x > viewW + S || R.y > viewH + S || R.x + S < -S || R.y + S < -S) continue;   // off screen
      const x = R.x, y = R.y, w = S;
      // How much colour this square has. Everything cleared is in colour and everything past
      // the frontier is grey — and `lit` lets one square be walked from one to the other while
      // you watch, which is the whole of "the next level comes alive".
      let lit = (isDone(i) || i <= furthest + 1) ? 1 : 0;
      if (o.litIdx === i && o.lit != null) lit = o.lit;
      const cols = genTheme(themeSeed(String(i + 1))).colors;
      ctx.save();
      rrect(x, y, w, w, r); ctx.clip();
      const q = LEVEL_SWATCH, qs = w/q;
      // Unreached levels keep their own quilt and lose their COLOUR — drained and dimmed, not
      // blacked out, so the map reads as a cloud of places rather than a handful of lit ones in
      // a hole. `filter` rather than a per-colour tint, and for a reason: a level's palette is
      // hsl() strings, which the hex tinting the rest of the game uses cannot read at all — it
      // was quietly returning black for every square past the frontier. This is also exactly
      // what the menu's own map does to a locked tile, so the two agree.
      ctx.save();
      if (lit < 1) ctx.filter = "grayscale(" + (1 - lit).toFixed(3) + ") brightness(" + (1 - 0.45*(1 - lit)).toFixed(3) + ")";
      for (let k = 0; k < q*q; k++) {
        ctx.fillStyle = cols[k % cols.length];
        ctx.fillRect(x + (k % q)*qs - 0.5, y + Math.floor(k/q)*qs - 0.5, qs + 1, qs + 1);
      }
      ctx.restore();
      ctx.restore();

      // cosmos. It is the only thing on the map that is doing anything, so it does not need to
      // do much.
      const ga = o.glowA == null ? 1 : o.glowA;
      if (o.glowIdx === i && o.glow > 0 && ga > 0) {
        // The shine PASSES rather than sits: a band of light crosses the square and then there
        // is a beat of nothing before the next one. A permanent white wash bleaches the palette
        // it is supposed to be showing off.
        const cyc = o.glow % 1.8;
        if (cyc < 1) {
          ctx.save();
          rrect(x, y, w, w, r); ctx.clip();
          ctx.globalCompositeOperation = "lighter";
          const gx = x - w + cyc*w*3;
          const g = ctx.createLinearGradient(gx, y, gx + w*0.8, y + w);
          g.addColorStop(0, "rgba(255,255,255,0)");
          g.addColorStop(0.5, "rgba(255,255,255," + (0.38*ga).toFixed(3) + ")");
          g.addColorStop(1, "rgba(255,255,255,0)");

        const pul = (0.45 + 0.30*Math.sin(o.glow*3.4)) * ga;
        ctx.strokeStyle = "rgba(255,255,255," + pul.toFixed(3) + ")";

        // Drawn INSIDE its own square now that they touch: a ring hung outside one would be
        // sitting on its neighbours.
        const lw = Math.max(1, S*0.045);
        ctx.strokeStyle = "rgba(255,255,255," + (0.9*o.ring).toFixed(3) + ")";
        ctx.lineWidth = lw;
        rrect(x + lw/2, y + lw/2, w - lw, w - lw, Math.max(0, r - lw/2)); ctx.stroke();
      }

  }
  // The heading, in the same extruded gold the title screen and the menus use.
  function winHeading(text, y, size, k) {
    if (k <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k);
    ctx.font = "900 " + Math.round(size) + "px " + UI_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.letterSpacing = Math.round(size*0.14) + "px";
    extrude(ctx, size, TITLE_SIDE, (dx, dy) => ctx.fillText(text, viewW/2 + dx, y + dy));
    ctx.fillStyle = "#ffd24a"; ctx.fillText(text, viewW/2, y);
    ctx.restore();
  }

  function tickWin(dt) {
    if (!win) return;
    win.t += dt;
    const P = win;
    const done = (ms) => P.t >= ms;
    if (P.ph === "fit") {
      // Ease the camera and the cell size together. cell is what everything on the board is
      // measured in, so changing it IS the zoom — there is no second scale to keep in step.
      const k = easeOut(Math.min(1, P.t / WIN.fit));
      const was = cell;
      cell = P.cell0 + (P.cellFit - P.cell0)*k;
      zoomWorldPoints(cell / was);
      worldW = cell*COLS; worldH = cell*ROWS;
      camX = (worldW - viewW)/2; camY = (worldH - viewH)/2;   // fits, so it centres
      if (done(WIN.fit)) { P.ph = "hold"; P.t = 0; }
    } else if (P.ph === "hold") {
      if (done(WIN.hold)) { P.ph = "build"; P.t = 0; Sound.tapBig(); }
    } else if (P.ph === "build") {
      const want = Math.min(P.route.length, Math.floor(P.t / P.stepMs));
      while (P.laid < want) {
        P.laid++; P.flashT = 0;                     // the newest piece is the one that flashes
        if (P.laid % 2 === 0) Sound.tileLaid();     // every other one: a route is long
      }
      P.flashT = (P.flashT || 0) + dt;
      if (P.laid >= P.route.length) { P.ph = "rest"; P.t = 0; }
    } else if (P.ph === "rest") {
      // The last piece keeps flashing while this runs down, and then it is simply track. A
      // route that ends with one tile still lit reads as unfinished — the flash is the moment
      // of ARRIVING, and by now everything has arrived.
      P.flashT = (P.flashT || 0) + dt;
      if (done(WIN.rest)) { P.ph = "out"; P.t = 0; Sound.warp(true); }
    } else if (P.ph === "out") {
      if (done(WIN.out)) { P.ph = "name"; P.t = 0; Sound.warp(false); Sound.win(); }
    } else if (P.ph === "name") {
      // Holds. The level you just finished is on the screen with its name on it, and moving on
      // from that is YOUR decision — the sequence has been running on its own long enough by
      // this point, and a beat you can sit in is what turns a cutscene into a moment.
    } else if (P.ph === "pan") {
      if (done(WIN.pan)) { P.ph = "wait"; P.t = 0; showWinUI(); }
    } else if (P.ph === "whip") {
      if (done(WIN.whip)) {

        const nx = P.next, was = P.idx;

      }
    } else if (P.ph === "fade") {

    }
  }

  function drawWin(ts) {
    const P = win; if (!P) return;
    // The last beat is the NEXT level playing normally with the black lifting off it.
    if (P.ph === "fade") {
      draw(ts);
      ctx.fillStyle = "rgba(5,4,13," + (1 - easeOut(Math.min(1, P.t / WIN.fade))).toFixed(3) + ")";
      ctx.fillRect(0, 0, viewW, viewH);

    }
    // Board beats: the level as it always looks, at whatever the zoom has reached, with the
    // route being cast back across it.
    if (P.ph === "fit" || P.ph === "hold" || P.ph === "build" || P.ph === "rest") {

      return;

    // shrinking into its own square, and the words.
    const cells = mapCells();
    const mCols = Math.max(...cells.map(p => p.c)) + 1, mRows = Math.max(...cells.map(p => p.r)) + 1;
    const Sfit = Math.min(viewW/(mCols + 1), viewH/(mRows + 1));
    const S0 = Math.max(win.cellFit*COLS, win.cellFit*ROWS);     // one square covering the board
    const here = cells[P.idx] || { c:0, r:0 }, there = cells[P.next] || here;
    let S = Sfit, cx0 = here.c, cy0 = here.r, shotK = 0, shotT = 0, litK = 1, glow = 0, glowA = 1, ring = 0;
    if (P.ph === "out") {

      S = S0 + (Sfit - S0)*k;

      shotK = 1 - Math.max(0, (k - 0.72)/0.28);             // handing over at the end of it
    } else if (P.ph === "name") {

    } else if (P.ph === "pan") {
      const k = easeBoth(Math.min(1, P.t / WIN.pan));
      cx0 = here.c + (there.c - here.c)*k;
      cy0 = here.r + (there.r - here.r)*k;
