    if (s.lights && s.lights.length) {
      for (const p of s.lights) p.life += dt;
      s.lights = s.lights.filter(p => p.life < p.max);
    }
    // Worn trail. Sampled from where the runner IS rather than where he was last drawn, so
    // it keeps up through corners, and from his BODY's centre rather than his feet — the
    // ribbon has to leave him at the height it will be drawn at.
    const tr = lookItem("trail");
    if (tr.cols && s.trail) {
      s.trail = wakeAge(s.trail, dt);
      s.trailT -= dt;
      // Sampled while he is falling too. Cutting the trail off the instant he leaves the
      // track left the ribbon hanging in mid-air at the lip while he dropped away from it —
      // it should follow him down, which is most of what makes the fall read.
      const live = s.status === "play" || s.status === "falling" || s.status === "squash";
      if (s.trailT <= 0 && live) {
        s.trailT = TRAIL_EVERY;
        const ri = (s.status === "falling" && s.fall)
          ? { sx: s.fall.x, sy: s.fall.y, angle: s.fall.angle }
          : runnerInfo();
        // paintRunner does translate(sx,sy) then rotate(angle), so his local frame maps to the
        // world by exactly this rotation. Same maths here, or the ribbon leaves the wrong spot
        // on every corner.
        wakeSample(s.trail, ri.sx, ri.sy, ri.angle, cell, performance.now(),
                   s.runPhase, s.status === "play");
      }
    } else if (s.trail && s.trail.length) s.trail.length = 0;
  }
  // A long streamer — a few tiles of it. The sample interval is loosened to match, since
  // the path between tiles is straight and there is nothing for extra points to describe.
  const TRAIL_MS = 2600, TRAIL_EVERY = 45;
  const TRAIL_MIN = 0.035;                 // closest two samples may be laid, in cells
  // Age a wake and drop what has expired. Trivial, and shared anyway: the board is not the
  // only runner with a trail, and two copies of a lifetime are two lifetimes.
  const wakeAge = (pts, dt) => { for (const p of pts) p.life += dt; return pts.filter(p => p.life < TRAIL_MS); };
  // Lay one point of a wake behind a runner standing at (sx,sy) facing `angle`, at `cellPx` to
  // the cell. Every caller gets the same anchor, the same leap, the same scatter and the same
  // minimum spacing — the board, the title screen and the cinematic all shed the same wake.
  function wakeSample(pts, sx, sy, angle, cellPx, ts, phase, moving) {
    const A = trailAnchor(ts, phase, moving);
    // The anchor knows about hover and lean and bob, all of which are the swagger holding him
    // differently; the leap is the swagger MOVING him, and it lives on the runner rather than
    // on the style, so it is added here where the runner is known.
    const w = lookItem("swagger");
    if (w.leap && _leapLift) A.y -= _leapLift * (w.leapH || 0.22);
    // paintRunner does translate(sx,sy) then rotate(angle), so his local frame maps to the
    // world by exactly this rotation. Same maths here, or the ribbon leaves the wrong spot
    // on every corner.
    const ca = Math.cos(angle), sa = Math.sin(angle);
    const px = sx + cellPx*(A.x*ca - A.y*sa), py = sy + cellPx*(A.x*sa + A.y*ca);
    // A leaping swagger STANDS STILL for a good share of every tile, and a sample every 45ms
    // of a runner who is not moving is a dozen points on the same spot — a dozen translucent
    // quads of zero length stacked into a dark blot. Space them out instead.
    const last = pts[pts.length - 1];
    if (last && Math.hypot(px - last.x, py - last.y) <= cellPx*TRAIL_MIN) return;
    // `w` is this point's own scatter, fixed the moment it is laid down, and `nx/ny` the
    // direction to scatter it along — his surface normal, taken here rather than at draw time.
    // Together they let a shed particle sit STILL in the world.
    pts.push({ x: px, y: py, life: 0, w: Math.random()*2 - 1, nx: -sa, ny: ca });
  }
  // Where the ribbon leaves him, in his own local frame (+x is travel, -y is up), in CELLS.
  // A swagger can hold the body a long way off its default height — float hovers above the
  // track, roll sits down on it, lean tips the whole body back about the feet, which both
  // lowers the body AND pushes it behind them — so a fixed offset detaches the ribbon from
  // the runner it is supposed to be coming out of.
  //
  // The stride bob IS in here, and the ripple it puts along the ribbon is the point: the trail
  // leaves his body, so when his body rises a step the ribbon has to rise with it or the two
  // come apart. Every term matches paintRunner exactly — the same bob, the same hop, the same
  // breathing hover — because the anchor is not an approximation of where he is, it is the
  // same sum arrived at twice.
  //
  // `phase` and `moving` are passed in rather than read: the shop figure runs a stride of its
  // own, off its own clock, and reading the level's would have the ribbon on the shop screen
  // bouncing to a runner nobody can see.
  function trailAnchor(ts, phase, moving) {
    const w = lookItem("swagger");
    const mul = (v, d) => (v == null ? d : v);
    if (phase == null) { phase = state ? state.runPhase : 0; moving = !!state && state.status === "play"; }
    const h0 = RUNNER.legLen + RUNNER.bodyH*0.5;         // body centre above the feet
    let bob = moving ? Math.abs(Math.sin(phase)) * RUNNER.bob * mul(w.bob, 1) : 0;
    if (w.hop && moving) bob += Math.max(0, Math.sin(phase)) * w.hop;    // one big bounce a stride
    const h = h0 + bob;                                  // bob lifts him along his OWN up, so it
    const L = w.lean || 0;                               // goes in before the lean is applied
    const hover = w.hover ? w.hover * (1 + 0.14*Math.sin(ts/430)) : 0;
    return { x: h*Math.sin(L), y: -(h*Math.cos(L) + hover) };
  }
  // The ribbon: one polyline per stripe, offset along the path's own normal so the stripes
  // run parallel rather than nesting inside one another, and stroked segment by segment so
  // the tail can fade out instead of ending on a hard edge.
  function drawTrail() {
    const s = state, tr = lookItem("trail");
    if (!tr.cols || !s || !s.trail || s.trail.length < 2) return;
    paintTrail(tr, s.trail, cell * RUNNER.bodyH, performance.now());
  }
  // The ribbon itself, given a trail and a run of points laid tail-first. Split out of
  // drawTrail so the SHOP can show the real thing: the rack used to carry a second copy of
  // wobble, taper, dash and fade drawn along a straight line, and a copy of a drawing is a
  // copy that drifts — this one had, in every one of those four.
  // `band` is how deep the ribbon is (a body, on the board) and `T` the clock the wobble runs
  // on, both passed rather than read so a still card can ask for a still ribbon.
  const TRAIL_SMOOTH = 9;                  // half-window of the smoothing pass, in samples
  function paintTrail(tr, pts, band, T) {
    const N = pts.length;
    const nor = pts.map((p, k) => {
      const a = pts[Math.max(0, k-1)], b = pts[Math.min(N-1, k+1)];
      let tx = b.x - a.x, ty = b.y - a.y; const m = Math.hypot(tx, ty) || 1;
      return { x: -ty/m, y: tx/m };
    });
    const n = tr.cols.length, sw = band / n;

    // ---- particles: no ribbon at all, just what he shed, thinning as it ages ----
    if (tr.style === "dots") {
      ctx.save();
      for (let k = 0; k < N; k++) {
        const u = k / (N - 1);                       // 0 at the tail, 1 at his heels
        // Scatter taken from the POINT, not from the clock and not from its index: the index
        // shifts as older points expire, which would crawl the pattern along the wake.
        const p = pts[k];
        const wob = tr.wobble ? (p.w || 0) * band * tr.wobble : 0;
        const nx = p.nx != null ? p.nx : nor[k].x, ny = p.ny != null ? p.ny : nor[k].y;
        const x = p.x + nx*wob, y = p.y + ny*wob;
        const r = band * (tr.dot || 0.16) * (tr.grow === false ? 1 : 0.30 + u*0.70);
        if (r < 0.4) continue;
        ctx.globalAlpha = Math.pow(u, tr.fade || 1.3) * 0.92;
        ctx.fillStyle = tr.cols[k % n];
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
      return;
    }
    // The wake is SMOOTHED before anything is drawn along it. The points are laid down at his
    // body, and his body bobs a step at a time, so the raw wake is a sawtooth — and a striped
    // band offset along the normal of a sawtooth folds over itself at every tooth, which is
    // most of the overlapping the ribbon used to do. A triangular moving average takes the
    // ripple out; the window closes to nothing at the head, so the ribbon still leaves his
    // body at exactly the point it always did and only settles as it falls behind him.
    if (N > 2) {
      const sm = new Array(N);
      for (let k = 0; k < N; k++) {
        const u = k / (N - 1);                                   // 1 at his heels
        const w = Math.round(TRAIL_SMOOTH * (1 - u*u*u));
        if (w <= 0) { sm[k] = pts[k]; continue; }
        let sx = 0, sy = 0, tot = 0;
        for (let j = -w; j <= w; j++) {
          const q = pts[Math.min(N-1, Math.max(0, k + j))];
          const wt = 1 - Math.abs(j)/(w + 1);
          sx += q.x*wt; sy += q.y*wt; tot += wt;
        }
        sm[k] = { x: sx/tot, y: sy/tot };
      }
      pts = sm;
      for (let k = 0; k < N; k++) {                              // normals follow the new line
        const a = pts[Math.max(0, k-1)], b = pts[Math.min(N-1, k+1)];
        const tx = b.x - a.x, ty = b.y - a.y, m = Math.hypot(tx, ty) || 1;
        nor[k].x = -ty/m; nor[k].y = tx/m;
      }
    }
    // The ribbon used to be STROKED: each stripe a fat polyline, cut into ten chunks at ten
    // alphas, every chunk overlapping its neighbour by a point and every stripe overlapping
    // the next by 0.75px. Two semi-transparent things laid on top of each other are darker
    // than either, so both kinds of overlap drew themselves in as lines and the whole thing
    // read as a stack of chunks. Filled QUADS instead: each piece meets its neighbours on a
    // shared edge and never crosses one, so nothing is ever painted twice.
    const SEGS = 26;                                  // steps in the fade; nothing overlaps now
    ctx.save();
    // Both variations live here, in the one place that turns a point and an offset into a
    // position: `wobble` slides the whole ribbon side to side along its length, and `taper`
    // scales the offset toward the tail so the band narrows to nothing behind him.
    const at = (k, off) => {
      const wob = tr.wobble ? Math.sin(k*(tr.freq||0.5) + T/(tr.speed||200)) * band * tr.wobble : 0;
      const tp  = tr.taper ? (0.18 + 0.82*(k/(N-1))) : 1;
      return { x: pts[k].x + nor[k].x*(off*tp + wob), y: pts[k].y + nor[k].y*(off*tp + wob) };
    };
    for (let i = 0; i < n; i++) {
      // Sides get a hair of bleed so neighbouring stripes butt rather than leaving an
      // antialiased hairline of background between them. Colours differ, so the overlap
      // reads as a blend rather than the dark seam an alpha overlap would give.
      const lo = (i - n/2) * sw - 0.35, hi = (i - n/2 + 1) * sw + 0.35;
      ctx.fillStyle = tr.cols[i];
      for (let c = 0; c < SEGS; c++) {
        if (tr.dash && (c % 2)) continue;            // every other chunk left out
        const a = Math.round((N-1) * c / SEGS), b = Math.round((N-1) * (c+1) / SEGS);
        if (b <= a) continue;
        ctx.globalAlpha = Math.pow((c + 1) / SEGS, 1.4) * 0.92;   // oldest end nearly gone
        ctx.beginPath();
        for (let k = a; k <= b; k++) { const q = at(k, lo);
          if (k === a) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y); }
        for (let k = b; k >= a; k--) { const q = at(k, hi); ctx.lineTo(q.x, q.y); }
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---------- Buttons & menu ---------------------------------------------
  // The one button that means "onward" says so. Drawn rather than typed: a glyph would be at
  // the mercy of whichever font the device falls back to, and this one has to match the label
  // it sits beside.
  function arrowChip(px, col){
    const c = document.createElement("canvas");
    c.className = "arrow"; c.width = c.height = Math.round(px*2);
    const g = c.getContext("2d"), S = c.width, m = S*0.22;
    g.strokeStyle = col; g.lineWidth = S*0.13; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath(); g.moveTo(m, S/2); g.lineTo(S-m, S/2); g.stroke();
    g.beginPath(); g.moveTo(S*0.56, S*0.26); g.lineTo(S-m, S/2); g.lineTo(S*0.56, S*0.74); g.stroke();
    return c;
  }
  // RESTART: a loop that goes round and comes back, with the same head the arrow chip wears.
  // Square-capped and drawn as an arc rather than a ring, because a closed circle reads as a
  // status light — the gap is what makes it a journey back to the beginning.
  // The resume arrow, with a semicircle hooked onto the back of its line. Same weight, same
  // round caps, same chevron head, same direction — it IS the other chip, plus the loop that
  // says you are going round again. Drawn as one path so the hook and the shaft join without a
  // seam, and sitting low in the box so the loop has somewhere to go.
  function restartChip(px, col){
    const c = document.createElement("canvas");
    c.className = "arrow"; c.width = c.height = Math.round(px*2);
    const g = c.getContext("2d"), S = c.width;
    const m = S*0.26, y = S*0.64, r = S*0.19;
    g.strokeStyle = col; g.lineWidth = S*0.13; g.lineCap = "round"; g.lineJoin = "round";
    // Flipped about the horizontal, so the hook drops BELOW the shaft rather than rising above
    // it. Done as a transform rather than by negating every y: the head is symmetric about the
    // line, so mirroring the whole drawing leaves it pointing right exactly as it was, and the
    // numbers below stay readable as "a line with a loop on the back of it".
    g.translate(0, S); g.scale(1, -1);
    // the hook: a half turn coming off the tail and bulging back to the left, then the shaft
    g.beginPath();
    g.arc(m, y - r, r, Math.PI*0.5, Math.PI*1.5);      // (m, y) round the left to (m, y - 2r)
    g.moveTo(m, y); g.lineTo(S - m, y);
    g.stroke();
    // ...and the same head the straight one wears, on the same end, pointing the same way
    g.beginPath();
    g.moveTo(S - m - S*0.22, y - S*0.24);
    g.lineTo(S - m, y);
    g.lineTo(S - m - S*0.22, y + S*0.24);
    g.stroke();
    return c;
  }
  function labelWithRestart(el, text){
    el.textContent = "";
    const t = document.createElement("span"); t.textContent = text;
    el.appendChild(t);
    el.appendChild(restartChip(11, getComputedStyle(el).color || "#e8e6ff"));
  }
  function labelWithArrow(el, text){
    el.textContent = "";
    const t = document.createElement("span"); t.textContent = text;
    el.appendChild(t);
    el.appendChild(arrowChip(11, getComputedStyle(el).color || "#e8e6ff"));
  }
  document.getElementById("pauseFloat").addEventListener("click", () => { Sound.unlock(); Sound.tap(); openMenu("main"); });
  document.getElementById("win-next").addEventListener("click", () => {
    if (!win || win.ph !== "wait") return;
    Sound.unlock(); Sound.tapBig(); Sound.warp(true);
    hideWinUI(); win.ph = "whip"; win.t = 0;
  });
  document.getElementById("win-menu").addEventListener("click", () => {
    if (!win) return;
    Sound.unlock(); Sound.tapBig();
    // Out of the sequence and onto the real map — the same one it has been flying over.
    const nx = win.next; winEnd();
    levelIdx = nx; loadLevel(nx); openMenu("world");
  });
  document.getElementById("mech-ok").addEventListener("click", () => { Sound.unlock(); Sound.tapBig(); mechQueue.shift(); showNextMech(); });

  const menuEl = document.getElementById("menu");
  const menuBody = document.getElementById("menu-body");
  // menuReturn: opened from somewhere that is still on screen behind us (the level-clear
  // card), so Back has to hand control straight back rather than land on the pause menu.
  let menuReturn = null;
  // A menu takes the whole screen: the backdrop stays (draw() paints only that once a menu is
  // up) and everything else goes. Opening the shop from the clear card used to leave LEVEL
  // CLEAR, its byline and its buttons showing through from underneath, and the talisman rack
  // and pause button sitting over the top of it.
  function openMenu(screen, ret) { paused = true; menuReturn = ret || null;
                                   buildMenu(screen || "main"); menuEl.classList.add("show");
                                   document.body.classList.add("menu-open");
                                   Sound.ambient("pause"); }
  // Any rack that scrolls stops exactly where the pinned button begins. Measured rather than
  // guessed: both the rack's top and the button's top depend on how much sits above them,
  // which differs per screen and changes with the notch.
  function fitScrollRack() {
    const rack = menuBody.querySelector(".shop-rack"), go = menuBody.querySelector(".shop-go");
    if (!rack || !go) return;
    // The Tileverse pane sizes itself: it is the whole screen, with the chrome floating over
    // it. Measuring a floor for it would put the bottom band back.
    if (rack.classList.contains("lvl-rack")) return;
    const gap = 12;
    // Whichever pinned button is highest is the floor the rack has to stop above — the buy
    // button appears above CARRY ON when something is being tried on, and measuring against
    // CARRY ON alone would run the last row underneath it.
    const buy = menuBody.querySelector(".shop-buy");
    const floorTop = Math.min(go.getBoundingClientRect().top,
                              buy ? buy.getBoundingClientRect().top : Infinity);
    const h = floorTop - rack.getBoundingClientRect().top - gap;
    const maxH = Math.max(140, Math.round(h));
    rack.style.maxHeight = maxH + "px";
    // The stock fills the WIDTH: a cell is a third of it, and square, whatever that does to how
    // many rows fit. Height used to have a vote — three whole rows had to fit above the button,
    // and on a wide screen that vote always won and left the rack a narrow column adrift in the
    // middle of it. A sliced row at the bottom is the honest signal that there is more below;
    // a shop that does not use the screen it is on is not.
    const grid = rack.querySelector(".tal-grid");
    if (!grid) return;
    const g = 9, n = 3;
    // The stock is measured off the TAB SHELF, not off the rack. The rack now runs the full
    // width of the screen so it can be dragged anywhere, but the stock has to line up with the
    // tabs above it and the button below — so it takes its width from the very thing it has to
    // match, and the three edges cannot drift apart however the card is sized.
    const shelf = menuBody.querySelector(".shop-tabs");
    const shelfW = shelf ? shelf.getBoundingClientRect().width : rack.clientWidth;
    // Columns are FRACTIONS, not a rounded pixel count: rounding a third of the width down and
    // multiplying it back left a few pixels over, and those pixels were the misalignment.
    const cell = (shelfW - g*(n-1)) / n;
    grid.style.gridTemplateColumns = "repeat(" + n + ", 1fr)";
    // The ROW is pinned to what a column actually measures, so a cell is square whatever its
    // contents want. aspect-ratio alone loses that argument: an item whose three lines do not
    // fit simply grows, and the grid quietly stops being square.
    grid.style.gridAutoRows = cell + "px";
    grid.style.width = shelfW + "px";
    grid.style.marginLeft = "auto"; grid.style.marginRight = "auto";
    // Buying something rebuilds the whole screen, which threw the rack back to the top and
    // lost your place on a twelve-item shelf. The scroll offset is remembered per tab and put
    // back once the rows have been sized — before that the rack is short and the browser
    // clamps the offset to nothing.
    if (shopScroll[shopTab] != null) rack.scrollTop = shopScroll[shopTab];
    rack.onscroll = () => { shopScroll[shopTab] = rack.scrollTop; };
    // The panel takes every pixel between where it starts and the button, and a row landing
    // half in and half out at the bottom is fine — it is a scroll view, and a sliced row is
    // the honest signal that there is more below.
  }
  function closeMenu() { stopShopFig(); stopRelics(); shopPreview = null; endCeremony();
                         paused = false; menuReturn = null; menuEl.classList.remove("show");
                         document.body.classList.remove("menu-open");

  // Every generated button clicks when pressed. Wired here rather than at each call site so

  // Two labels always carry the same glyph, so the button says it rather than each call site

  const BTN_GLYPH = [
    [/^(done|resume|next|chapter select|skip)/i, labelWithArrow],
    [/^(restart|retry)/i,                 labelWithRestart],

  function btn(label, fn, big) {
    const b = document.createElement("button"); b.textContent = label;
    b.onclick = (e) => { Sound.unlock(); (big ? Sound.tapBig : Sound.tap)(); fn(e); };
    // ...after the button exists, so the chip can take its computed colour.

  // A stepper wearing a toggle's clothes: same plate, same height, same chequer — the only
  // difference is that pressing it moves on through a list rather than flipping a flag, and
  // the value on the right says where in the list you are.
  // A row of choices instead of a value you cycle. `vals` are the options in order, `val` the
  // one that is on, `fmt` how each is written and `fn` what to do with the one that is picked.
  function picker(label, vals, val, fmt, fn) {
    const d = document.createElement("div"); d.className = "toggle picker";
    const l = document.createElement("span"); l.textContent = label;
    const track = document.createElement("div"); track.className = "track";
    for (const v of vals) {
      const seg = document.createElement("div");
      seg.className = "seg" + (v === val ? " on" : "");
      seg.textContent = fmt(v);
      seg.onclick = (e) => { e.stopPropagation(); Sound.unlock(); Sound.tap(); fn(v); };
      track.appendChild(seg);
    }
    d.appendChild(l); d.appendChild(track);
    return d;
  }
  function toggle(label, on, fn) {
    const d = document.createElement("div"); d.className = "toggle" + (on ? "" : " off");
    d.innerHTML = "<span>" + label + "</span><span class='val'>" + (on ? "ON" : "OFF") + "</span>";
    d.onclick = (e) => { Sound.unlock(); Sound.tap(); fn(e); }; return d;
  }
  // The wallet, as it appears everywhere it appears: the tile itself, then the count. A "·"
  // and a number was a label for the currency; this IS the currency.
  function coinChip(px){

    c.className = "wallet";
    c.width = c.height = Math.round(px * 1.32);

  // One shop animation at a time. Every rebuild — a new tab, a new item worn — replaces the
  // painter, and closing the menu stops it: an orphaned rAF would go on drawing into a canvas
  // that is no longer in the document, forever.
  // The talisman shelf animates the same way the shop figure does: one loop for the screen,
  // replaced on every rebuild and stopped when the menu closes. An orphaned rAF would go on
  // painting canvases that have left the document.
  let relicPainters = [], _relicRaf = 0;
  function stopRelics() { if (_relicRaf) { cancelAnimationFrame(_relicRaf); _relicRaf = 0; } relicPainters = []; }
  function startRelics() {
    if (_relicRaf) cancelAnimationFrame(_relicRaf);
    const step = (ts) => { for (const p of relicPainters) p(ts); _relicRaf = requestAnimationFrame(step); };
    _relicRaf = requestAnimationFrame(step);
  }
  let _shopFigRaf = 0;
  function stopShopFig() { if (_shopFigRaf) { cancelAnimationFrame(_shopFigRaf); _shopFigRaf = 0; } }
  function startShopFig(paint) {
    stopShopFig();
    const step = (ts) => { paint(ts); _shopFigRaf = requestAnimationFrame(step); };
    _shopFigRaf = requestAnimationFrame(step);
  }
  let shopTab = "drip";                   // the shop remembers which rack you were looking at
  // Every menu rebuild re-measures the rack. Tab switches call buildMenu directly, so hooking
  // this to openMenu alone would fit the first rack you saw and no other.
  function buildMenu(screen) {
    buildMenu_(screen);
    requestAnimationFrame(fitScrollRack);
  }
  // Which cells of the matrix the blob occupies, for `n` levels. Grow a wobbly radius until it
  // holds enough, then drop whichever cells sit closest to the boundary until it holds exactly
  // enough — trimming from the rim keeps the lumps, where trimming by distance from the centre
  // would quietly round it back into a circle.
  //
  // The three sine terms are prime-ish multiples of the angle so they never line up and repeat:
  // one big lobe, one medium, one small. Fixed phases, so it is the same cloud every time.
  // How many squares of a level's own palette stand for that level, across and down. It is
  // used three times over — the Tileverse map, the sides of the Tiloid and every tile the
  // cloud grows — and all three must agree or the cube unfolds into tiles that do not match
  // the map it is unfolding into.
  const LEVEL_SWATCH = 3;
  function tileverseLayout(n) {
    const edgeAt = (th, base) => base * (1 + 0.20*Math.sin(3*th + 0.9)
                                           + 0.13*Math.sin(5*th - 2.1)
                                           + 0.07*Math.sin(7*th + 4.3));
    let found = [];
    for (let base = 1.5; base < 40; base += 0.12) {
      const R = Math.ceil(base * 1.5) + 2, out = [];
      for (let r = -R; r <= R; r++) for (let c = -R; c <= R; c++) {
        const d = Math.hypot(c, r);
        const slack = edgeAt(Math.atan2(r, c), base) - d;
        if (slack >= 0) out.push({ c, r, slack });
      }
      if (out.length >= n) { found = out; break; }
    }
    if (found.length < n) return [];                     // never happens; a level list this big would not fit
    found.sort((a, b) => a.slack - b.slack);             // rim first
    found = found.slice(found.length - n);               // ...and the rim is what goes
    const minC = Math.min(...found.map(p => p.c)), minR = Math.min(...found.map(p => p.r));
    found.forEach(p => { p.c -= minC; p.r -= minR; });
    found.sort((a, b) => a.r - b.r || a.c - b.c);        // reading order: 1 at the top left
    return found;
  }
  let menuScreen = "main";
  function buildMenu_(screen) {
    menuScreen = screen;
    stopShopFig(); stopRelics();          // whatever was animating is about to leave the DOM
    relicPainters = [];
    menuBody.innerHTML = "";
    // Anything that is a SHELF is pinned to the top: its content changes length as you unlock
    // things, and a centred card slides up and down the screen while you browse it.
    // `.top` pins a screen to the top of the viewport and reserves room under it for the fixed
    // DONE. It is for screens whose content is TALLER than the screen — the shop's shelves, the
    // map. The talisman shelf was on that list when it held eleven charms; it holds six, they
    // fit twice over, and pinning them to the top left the block stranded above a screen's worth
    // of empty ground. Centred, it sits where the eye already is.
    // A FALL is pinned to the top too: its byline belongs directly under the heading, where it
    // reads as the heading's second line rather than as a caption floating in the middle of the
    // screen with the buttons chasing it.
    const fell = state && state.end && state.end.kind === "lose" &&
                 (state.status === "lose") && screen === "main";
    menuEl.classList.toggle("top",
      screen === "shop" || screen.indexOf("shop:") === 0 || screen === "levels" ||
      screen === "world" || fell);
    menuEl.classList.toggle("fell", !!fell);
    // the map is a map: it wants the screen, the same as the shop's shelves do
    menuEl.classList.toggle("wide",
      screen === "shop" || screen.indexOf("shop:") === 0 || screen === "world");
    // Anywhere but the rack it came from — another tab, another screen — and the fitting is off.
    if (shopPreview && screen !== "shop:" + shopPreview.key) shopPreview = null;
    const title = document.getElementById("menu-title");
    // Pinned headings are out of the flow, so anything that has to clear one needs its height.
    // Measured rather than guessed: it is two lines on the main screen and one everywhere else.
    requestAnimationFrame(() => {
      const chq = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--chq")) || 15;
      // Its BOTTOM edge, not its height: the heading is pushed down from the top of the screen
      // by its own offset, so height alone under-measures the clearance by exactly that offset —
      // and the offset has now moved twice.
      // ...and measured against #menu-body's OWN top, not the viewport's. It is consumed as
      // padding-top ON that element, which already starts a little way down the screen — so a
      // figure taken from the viewport over-padded by exactly that offset, and every pinned
      // screen sat a good 20px lower under its heading than the one grid square it asks for.
      // padding-top does not move the element's top edge, so there is no loop in measuring it.
      document.documentElement.style.setProperty("--title-h",
        Math.round(title.getBoundingClientRect().bottom
                   - menuBody.getBoundingClientRect().top + chq) + "px");
    });
    title.className = "";                      // only the main screen wears the logo treatment
    // ---- the shop: him at the top, a tab per category, then that tab's rack ----
    if (screen === "shop" || screen.indexOf("shop:") === 0) {
      if (screen.indexOf("shop:") === 0) shopTab = screen.slice(5);
      if (!LOOK.some(l => l.key === shopTab)) shopTab = LOOK[0].key;
      title.textContent = "Tile Shop"; title.className = "shop big gilt";
      saveWallet();                                   // banks whatever the last run earned

      // A picture of him wearing everything currently on, standing on a real tile. It sits
      // above the tabs so a change is visible the moment it is bought — the whole point of
      // a shop screen is seeing what you are buying on the thing you are buying it for.
      // The canvas is cut to the composition rather than left square: at 300x300 the tile and
      // the runner sat in the bottom half and the top 44% of it was empty, which showed up as
      // a hole between the title and the picture. Height is derived from his size, with a
      // little headroom above for the taller hats.
      // He and his tile are drawn at CELL — the very size the board gives them in play — and
      // the canvas is sized around that rather than the other way about. The composition keeps
      // the proportions it had (he is 0.56 of the frame, the frame 1.20 of him tall); it is
      // only the scale that is now the game's rather than a number that looked right.
      const rs = Math.round(cell);
      const S  = Math.round(rs / 0.56);
      const SH = Math.round(rs*1.20);                 // just enough to hold tile + hat
      const fig = document.createElement("div"); fig.className = "shop-fig";
      fig.style.width = S + "px";                     // 1:1 with the bitmap — see .shop-fig
      const cv = document.createElement("canvas"); cv.width = S; cv.height = SH;
      fig.appendChild(cv);
      const g = cv.getContext("2d");
      const foot = { x: S*0.50, y: Math.round(SH*0.52) };   // where his feet stand

      // He runs on the spot for as long as the shop is open, rather than being frozen at
      // whatever millisecond the menu happened to be built on. A still frame can't show a
      // swagger — a hop, a roll and a lotus all look like standing there — and the whole
      // point of the picture is to show what you are buying in motion.
      const paintFig = (ts) => {
      g.clearRect(0, 0, S, SH);
      // The game's own pane, body and rail, in whatever track skin is worn — so the track
      // is on show here too rather than being represented by a stand-in.
      withCanvas(g, rs, foot.x - rs/2, foot.y - rs/2, () => {
        const n = { c:0, r:0 };
        drawGlass(0, 0, cell);
        drawPlatformSurface(n, tileSurface(n, { c:-1, r:0 }, { c:1, r:0 }), curTrack());
      });

      // The worn trail, leaving him the way it does in play: exactly as deep as his body,
      // running out from UNDER him — it is drawn before he is, so his body covers the join
      // and it reads as attached — and fading along its length on the same curve the game
      // uses, rather than stopping dead in a flat block short of his back.
      // The REAL ribbon, painted by the game's own routine along a straight run of points —
      // the same thing the shop CARDS do. This used to be a stack of gradient-filled rectangles
      // that reproduced the fade and nothing else: no taper, no wobble, no dashes, and a fade
      // that had to be kept in step with the board's by hand. Four of the trails in the shop
      // were being sold by a picture of a fifth.
      const tr = lookItem("trail");
      if (tr.cols) {
        const A = trailAnchor(ts, ts/RUNNER.stepMs, true);      // his stride, not the board's
        const cyb = foot.y + rs*A.y;
        const headX = foot.x + rs*(A.x + RUNNER.bodyW*0.20), tailX = S*0.03, N = 46;
        const pts = [];
        for (let k = 0; k < N; k++) {
          const u = k/(N-1);
          pts.push({ x: tailX + (headX-tailX)*u, y: cyb, nx: 0, ny: -1, w: Math.sin(k*1.7)*0.5 });
        }
        withCanvas(g, rs, 0, 0, () => paintTrail(tr, pts, rs*RUNNER.bodyH, ts));
      }
      // ...and the runner himself, drawn by the game, mid-stride so the swagger reads
      withCanvas(g, rs, 0, 0, () =>
        paintRunner(foot.x, foot.y, rs, ts/RUNNER.stepMs, 0, true, ts, 0, true));
      };
      startShopFig(paintFig);
      menuBody.appendChild(fig);

      const purse = document.createElement("div"); purse.className = "shop-purse";
      const pc = document.createElement("canvas"); pc.width = 34; pc.height = 34;
      withCanvas(pc.getContext("2d"), 34, 0, 0, () => coinGlyph(17, 17, 26));
      purse.appendChild(pc);
      const pv = document.createElement("span"); pv.textContent = wallet.tiles;
      purse.appendChild(pv);
      menuBody.appendChild(purse);

      // Six tabs across, so each gets a picture rather than a word — at this width the
      // labels alone were unreadable, and the icon is what you actually scan for.
      // Six tabs: only what is BOUGHT. The talismans used to sit here as a seventh, but they
      // are not merchandise — you find them on the board — and a rack of them behind a shop
      // tab said otherwise. They have their own screen now.
      const TABS = LOOK;
      const tabs = document.createElement("div"); tabs.className = "shop-tabs";
      TABS.forEach(catg => {
        const t = document.createElement("button");
        const ic = document.createElement("canvas"); ic.width = 44; ic.height = 44;
        catg.icon(ic.getContext("2d"), 44);
        const lb = document.createElement("span"); lb.textContent = catg.label;
        t.appendChild(ic); t.appendChild(lb);
        if (catg.key === shopTab) t.className = "on";
        t.onclick = () => { Sound.unlock(); Sound.tap(); buildMenu("shop:" + catg.key); };
        tabs.appendChild(t);
      });
      menuBody.appendChild(tabs);

      const rack = document.createElement("div"); rack.className = "shop-rack";
      const grid = document.createElement("div"); grid.className = "tal-grid";
      const cat = LOOK.find(l => l.key === shopTab);
      // What the shelf marks as EQUIPPED is what you actually own and wear — not the fitting.
      // Reading lookWorn here meant that trying something on took the green off the thing you
      // are still wearing and gave it to nothing, since the fitting wears gold instead.
      const wornId = lookOwned(cat.key);
      cat.items.forEach(it => {
        const have = owns(it), on = wornId === it.id;
        const trying = !!shopPreview && shopPreview.key === cat.key && shopPreview.id === it.id;
        const el = document.createElement("button");
        const afford = wallet.tiles >= it.cost;
        el.className = "tal" + (on ? " on" : "") + (have ? "" : " locked")
                             + (trying ? " preview" : "") + (trying && !afford ? " poor" : "");
        // Locked stock is shown in full — its real colours and its real name. Greying it to a
        // silhouette and putting the price where the name goes hid the two things you need in
        // order to want it, and the price is what tells you it is locked anyway.
        // Price on top, the thing itself in the middle, its name underneath — the order you
        // read a price tag in. An owned item still gets the row, hidden: buying something must
        // not make its icon and name jump up the tile, and a cell that reflows on purchase
        // makes the whole grid twitch as you shop.
        const pr = document.createElement("span"); pr.className = "price";
        // Tried on: the same row says what pressing it again would do, in front of the number
        // it would cost. One more word in a row that already exists costs the cell no height.
        if (trying) { const lb = document.createElement("span"); lb.textContent = "Purchase";
                      lb.style.fontWeight = "900"; pr.appendChild(lb); }
        pr.appendChild(coinChip(11));
        const pn = document.createElement("span"); pn.textContent = it.cost;
        pr.appendChild(pn);
        // The worn item says so where its price used to be — same slot, so nothing moves.
        if (on) { pr.textContent = "EQUIPPED"; pr.classList.add("equipped"); }
        else if (have) pr.style.visibility = "hidden";
        el.appendChild(pr);
        const sc = document.createElement("canvas"); sc.width = 96; sc.height = 96;
        if (it.swatch) it.swatch(sc.getContext("2d"), 96);
        const nm = document.createElement("span");
        nm.textContent = it.name;
        el.appendChild(sc); el.appendChild(nm);
        el.onclick = () => {
          Sound.unlock();
          if (have) { shopPreview = null; wearLook(cat.key, it.id); Sound.tap(); }
          // Locked stock takes two taps. The first is a fitting: it goes on the figure so you
          // can see it before you decide, and the cell tells you what keeping it would cost.
          // The second is the purchase, and only the second one spends anything.
          else if (!trying) { shopPreview = { key: cat.key, id: it.id }; Sound.tap(); }
          else if (wallet.tiles >= it.cost) {
            wallet.tiles -= it.cost; wallet.owned.add(it.id); saveWallet();
            shopPreview = null; wearLook(cat.key, it.id); Sound.tapBig(); Sound.coin();
          } else { Sound.tap(); el.classList.add("nope");
                   setTimeout(() => el.classList.remove("nope"), 420); return; }
          buildMenu("shop:" + cat.key);
        };
        grid.appendChild(el);
      });
      rack.appendChild(grid);
      menuBody.appendChild(rack);
      // Trying something on puts the offer down here too, where your thumb already is after
      // tapping the cell — on a full-width shelf the cell you pressed can be a long way from
      // where you are holding the phone.
      if (shopPreview && shopPreview.key === cat.key) {
        const it = cat.items.find(i => i.id === shopPreview.id);
        if (it) {
          const buy = btn("Purchase", () => {
            Sound.unlock();
            if (wallet.tiles < it.cost) { Sound.tap(); buy.classList.add("nope");
              setTimeout(() => buy.classList.remove("nope"), 420); return; }
            wallet.tiles -= it.cost; wallet.owned.add(it.id); saveWallet();
            shopPreview = null; wearLook(cat.key, it.id); Sound.tapBig(); Sound.coin();
            buildMenu("shop:" + cat.key);
          }, true);
          buy.className = "shop-buy" + (wallet.tiles >= it.cost ? "" : " poor");
          buy.textContent = "";
          const lb = document.createElement("span"); lb.textContent = "Purchase";
          buy.appendChild(lb); buy.appendChild(coinChip(17));
          const pn = document.createElement("span"); pn.textContent = it.cost;
          buy.appendChild(pn);
          menuBody.appendChild(buy);
        }
      }
      const go = btn("Done",
                     () => buildMenu("main"), true);
      go.className = "shop-go";
      labelWithArrow(go, "Done");
      menuBody.appendChild(go);
      // the buy button is stacked on top of this one, so it has to know how tall it is
      requestAnimationFrame(() => document.documentElement.style.setProperty(
        "--go-h", Math.round(go.getBoundingClientRect().height) + "px"));
      return;
    }
    // ---- Holy Talismans: found, never bought, and shown as objects rather than as stock ----
    if (screen === "talismans") {
      // Two lines. It is the longest heading in the game and at 46px it ran the whole width of
      // a phone with its tilt carrying the last letters off the edge; stacked, it sits inside
      // the screen and matches TILE RUNNER's own two-line treatment on the pause menu.
      title.innerHTML = "Holy<br>Talismans"; title.className = "shop big amber";
      const worn = settings.talisman;
      const grid = document.createElement("div"); grid.className = "relic-grid";
      TALISMANS.filter(talLive).forEach((t, i) => {
        const got = talUnlocked.has(t.id), on = got && worn === t.id;
        const el = document.createElement("div");
        el.className = "relic" + (on ? " on" : "") + (got ? "" : " locked");
        const c = document.createElement("canvas"); c.width = 150; c.height = 150;
        c.style.setProperty("--tilt", TAL_TILT[i % TAL_TILT.length] + "deg");
        const g = c.getContext("2d");
        // Each hangs on its own bob, offset so the five drift out of step with one another —
        // a row of them rising and falling together reads as one object, not five.
        const R = 40;
        const paint = (ts) => {
          g.clearRect(0, 0, 150, 150);
          const y = 82 + Math.sin(ts/900 + i*1.3) * 5;
          g.save();
          talHook(g, 75, y, R, t);
          t.draw(g, 75, y, R);
          if (!got) {                                  // not found yet: a flat silhouette
            g.globalCompositeOperation = "source-atop";
            g.fillStyle = "rgba(120,124,150,0.88)"; g.fillRect(0, 0, 150, 150);
          }
          g.restore();
        };
        el.appendChild(c);
        const nm = document.createElement("span"); nm.textContent = got ? t.name : "???";
        const bl = document.createElement("i"); bl.textContent = got ? t.blurb : "";
        el.appendChild(nm); el.appendChild(bl);
        if (got) el.onclick = () => { Sound.unlock(); Sound.tap();
          settings.talisman = (worn === t.id) ? null : t.id; saveSettings(); buildMenu("talismans"); };
        grid.appendChild(el);
        relicPainters.push(paint);
      });
      menuBody.appendChild(grid);
      // No tally. It counted against TALISMANS.length, which includes the ones held back, so it
      // could never reach its own total — and a shelf of charms says how many you have by being
      // a shelf with gaps in it.
      const back = btn("Done",
                       () => buildMenu("main"), true);
      back.className = "shop-go";
      labelWithArrow(back, "Done");     // the button was built as Done and then relabelled Back
      menuBody.appendChild(back);
      startRelics();
      return;
    }
    // ---- Debug: the levers you want while building the thing, kept off the main menu ----
    // Everything you can SET, in one place. The two toggles used to sit loose at the bottom of
    // the main menu and the rest lived behind a button called Debug — which meant the things a
    // player actually wants (sound off) and the things only I want (give me a hundred tiles)
    // were in two different places, neither of them called Settings.
    if (screen === "settings") {
      title.textContent = "Settings"; title.className = "shop";
      menuBody.appendChild(toggle("Sound", !Sound.isMuted(),
        () => { Sound.unlock(); Sound.setMuted(!Sound.isMuted()); buildMenu(screen); }));
      menuBody.appendChild(toggle("Colorblind", colorblind,
        () => { colorblind = !colorblind; settings.colorblind = colorblind; saveSettings();
                applyColorblind(); buildMenu(screen); }));
      menuBody.appendChild(picker("Speed", START_CPS, startCps(), v => v.toFixed(1), (v) => {
        settings.startCps = v;
        saveSettings();
        // Live, not on the next load: this is reached from the pause menu mid-level, and a
        // speed control that does nothing until you die is a speed control you cannot feel.
        // The RAMP is kept — whatever the run has earned so far rides on top of the new
        // starting pace rather than being thrown away with it.
        if (state && state.cps0) {
          state.cpsNow = Math.max(0.1, startCps() + (state.cpsNow - state.cps0));
          state.cps0 = startCps();
          state.msPerCell = 1000 / state.cpsNow;
          try { Sound.setTempo(state.msPerCell); } catch(_){}
        }
        buildMenu(screen);
      }));
      menuBody.appendChild(btn("Give 100 tiles", () => {
        Sound.unlock(); Sound.coin();
        wallet.tiles += 100; saveWallet();
      }));
      menuBody.appendChild(btn("Unlock all talismans", (e) => {
        Sound.unlock(); Sound.tapBig();
        const live = TALISMANS.filter(talLive);
        for (const t of live) unlockTalisman(t.id);        // the real unlock path, so it persists
        e && e.target && (e.target.textContent = "All " + live.length + " unlocked");
      }));
      // Wipes EVERYTHING the player has: levels cleared, coins, everything bought and worn,
      // talismans found, settings, and the record of which tutorials have been seen. The old
      // tutorials-only reset needed no confirmation because it was harmless and instantly
      // repeatable. This is neither, so the button arms itself first and you have to mean it.
      let armed = false, armT = null;
      const rb = btn("Reset All Data", () => {
        Sound.unlock();
        if (!armed) {
          armed = true; rb.textContent = "Tap again to erase it all"; rb.classList.add("danger");
          armT = setTimeout(() => { armed = false;
            if (rb.isConnected) { rb.textContent = "Reset All Data"; rb.classList.remove("danger"); } }, 3200);
          return;
        }
        clearTimeout(armT);
        // CINE_SEEN_KEY belongs in here too: it is what remembers that the creation myth has
        // been watched, and it is the difference between the ordinary title screen and the one
        // a brand new player gets — the cosmos, no runner, TAP TO CREATE A TILEVERSE. Erasing
        // everything else and leaving that behind meant "starting over" started you somewhere
        // no first-time player has ever been.
        for (const k of [SEEN_KEY, BEST_KEY, WALLET_KEY, TAL_KEY, SET_KEY, CINE_SEEN_KEY])
          { try { localStorage.removeItem(k); } catch(_) {} }
        rb.textContent = "Erased — starting over";
        // A reload is the honest way back to a fresh player: every default is read at boot.
        setTimeout(() => { try { location.reload(); } catch(_) {} }, 480);
      });
      menuBody.appendChild(rb);
      const back = btn("Done", () => buildMenu("main"));
      back.className = "shop-go";
      menuBody.appendChild(back);
      return;
    }
    // ---- the Tileverse: the campaign as one climbing trail ----
    // ---- the Tileverse: every level at once, as one object ----
    // A perfect matrix — same pitch across and down, nothing nudged — with a silhouette that is
    // anything but. The campaign is one THING rather than a list, and a rectangle of tiles says
    // "table of contents" where a cloud says "place". The edge is generated from a few sine
    // terms round the angle, so it is lumpy in a way no hand would draw twice and yet is exactly
    // the same lumps every time you open it.
    if (screen === "world") {
      title.textContent = "Tileverse"; title.className = "shop big pale";
      // The opening is not a button any more — it is a square of the map, one place to the
      // LEFT of level one. It is the story of what happened before the campaign, so it lives
      // in the space before the campaign's first tile.
      const rack = document.createElement("div"); rack.className = "shop-rack lvl-rack";
      const map = document.createElement("div"); map.className = "lvl-map blob";
      const best = loadBest();
      const cells = tileverseLayout(LEVELS.length);
      const cols = Math.max(...cells.map(p => p.c)) + 1;
      const rows = Math.max(...cells.map(p => p.r)) + 1;
      // The tile is whatever divides the panel evenly; the map is then exactly as tall as it
      // needs to be. Read off the rack rather than guessed, so it fills whatever it is given.
      // The intro square sits at level one's column minus one. If level one is already in
      // column zero there is nowhere to its left, so the whole cloud shifts one place right
      // and the map grows a column — the shape is untouched, it just starts further over.
      const introC = cells[0].c - 1, shift = introC < 0 ? 1 : 0;
      map.style.setProperty("--cols", cols + shift);
      map.style.setProperty("--rows", rows);
      // How far you have got: everything cleared, plus the one after the furthest of them, is
      // open. Everything past that is greyed. It is a LOOK, not a gate — every tile is still
      // pressable, because this game has never stopped you picking a level and quietly starting
      // now is not a decision a colour should be making.
      const isDone = k => { const b = best["L" + k]; return !!(b && (b.done || b.stars)); };
      let furthest = -1;
      for (let k = 0; k < LEVELS.length; k++) if (isDone(k)) furthest = k;
      cells.forEach((p, i) => {
        const done = isDone(i), open = done || i <= furthest + 1;
        const el = document.createElement("button");
        el.className = "stop" + (done ? " done" : "") + (open ? "" : " shut") +
                       (i === levelIdx ? " here" : "");
        el.style.gridColumn = (p.c + 1 + shift); el.style.gridRow = (p.r + 1);
        // Nine of the level's OWN backdrop colours, laid out the way the quilt lays them. The
        // seed is the level number, which is all beginLevel gives genTheme, so this is the
        // actual palette you will be looking at rather than a stand-in for it — every tile in
        // the cloud is a little window onto its level.
        // ONE PIXEL PER COLOUR, blown up by `image-rendering: pixelated` — the same trick the
        // TILEVERSE button's cosmos uses. It used to rasterise each colour as a 16px block, so
        // the bitmap came out 48 wide inside a 45px tile: a 0.94 DOWNSCALE, which on any screen
        // that is not 2x device pixels the browser resamples — and every colour bled a pixel
        // into its neighbour. At a pixel a colour the scale is a whole number on every device
        // (15x at dpr 1, 30x at dpr 2) and there is nothing to resample.
        const sw = document.createElement("canvas"); sw.className = "swatch";
        sw.width = sw.height = LEVEL_SWATCH;
        const g = sw.getContext("2d");
        const cols = genTheme(themeSeed(String(i + 1))).colors;
        for (let k = 0; k < LEVEL_SWATCH*LEVEL_SWATCH; k++) {
          g.fillStyle = cols[k % cols.length];
          g.fillRect(k % LEVEL_SWATCH, Math.floor(k / LEVEL_SWATCH), 1, 1);
        }
        el.appendChild(sw);
        const num = document.createElement("span"); num.textContent = (i + 1);
        el.appendChild(num);
        el.title = (LEVELS[i] && LEVELS[i].name) || ("Chapter " + (i + 1));
        el.onclick = () => { levelIdx = i; loadLevel(i); closeMenu(); };
        map.appendChild(el);
      });
      // ...and the origin story, wearing the cosmos it is set in rather than a level's palette,
      // half-there because it is not a place you can go — it is what the places are made of.
      const intro = document.createElement("button");
      intro.className = "stop intro";
      intro.style.gridColumn = (introC + 1 + shift); intro.style.gridRow = (cells[0].r + 1);
      intro.title = "How the Tileverse was made";
      const isw = document.createElement("canvas"); isw.className = "swatch";
      isw.width = isw.height = LEVEL_SWATCH;               // a pixel a colour, as above
      const ig = isw.getContext("2d"), vcol = VOID_THEME.colors;
      for (let k = 0; k < LEVEL_SWATCH*LEVEL_SWATCH; k++) {
        ig.fillStyle = vcol[k % vcol.length];
        ig.fillRect(k % LEVEL_SWATCH, Math.floor(k / LEVEL_SWATCH), 1, 1);
      }
      intro.appendChild(isw);
      intro.appendChild(document.createElement("span")).className = "play";
      intro.onclick = () => { closeMenu(); startCine("menu"); };
      map.appendChild(intro);
      rack.appendChild(map);
      menuBody.appendChild(rack);
      const back = btn("Done", () => buildMenu("main"));
      back.className = "shop-go";
      menuBody.appendChild(back);
      // Open on the level you are on, centred in the pane. offsetTop is measured inside the
      // map, and the map now carries its own padding, so the two are added rather than assumed
      // to be the same thing.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const here = map.querySelector(".stop.here");
        rack.scrollTop = here
          ? Math.max(0, here.offsetTop + map.offsetTop - rack.clientHeight/2 + here.offsetHeight/2)
          : 0;
      }));
      return;
    }
    if (screen === "levels") {
      // Laid out like the shop: the header stays under the notch at the top, the grid scrolls
      // on its own, and BACK is pinned to the viewport instead of trailing 33 cells down.
      title.textContent = "Chapters"; title.className = "shop big gilt";
      menuBody.appendChild(btn("Intro", () => { closeMenu(); startCine("menu"); }));   // first item
      const rack = document.createElement("div"); rack.className = "shop-rack lvl-rack";
      const grid = document.createElement("div"); grid.className = "lvl-grid";
      const best = loadBest();
      LEVELS.forEach((L, i) => {
        const b = best["L" + i], done = !!(b && (b.done || b.stars));   // b.stars: pre-v4.4 saves
        const el = document.createElement("button");
        el.innerHTML = "<span>" + (i + 1) + "</span><span class='st" + (done ? "" : " none") + "'>" +
          (done ? "✓" : "—") + "</span>";
        el.onclick = () => { levelIdx = i; loadLevel(i); closeMenu(); };
        grid.appendChild(el);
      });
      rack.appendChild(grid);
      menuBody.appendChild(rack);
      const back = btn("Done", () => buildMenu("main"));
      back.className = "shop-go";
      menuBody.appendChild(back);
      return;
    }
    // ---- main / pause / end-of-run --------------------------------------------------
    // ONE screen, wearing three faces. A cleared level and a fall used to get bespoke cards of
    // their own, with their own layout, their own button sizes and their own doors out — three
    // places for the game's shape to drift apart, and two of them seen after every single
    // level. What actually differs between a pause and an ending is the heading, one line of
    // commentary, and which of RESUME / RETRY / NEXT you are owed. So that is all that differs.
    const end = (state.status === "win" || state.status === "lose") ? state.end : null;
    if (end) {
      title.textContent = end.title;
      title.className = end.kind === "win" ? "clear" : "dead";
      const by = document.createElement("p"); by.className = "menu-byline";
      setByline(by, end.byline);
      menuBody.appendChild(by);
    } else {
      // the menu header IS the title, small: stacked over two lines, tilted and extruded
      title.innerHTML = "Tile<br>Runner";
      title.className = "logo";
    }
    // RESUME only where there is a run to go back to. On an end screen it would be a lie, and
    // it is also the only thing that closes the menu — which is why an ending cannot be
    // dismissed by accident into a level that has already stopped.
    if (!end) menuBody.appendChild(btn("Resume", closeMenu));
    // NEXT only on a clear. The last level has nowhere to go on to, so it hands you the map.
    if (end && end.kind === "win")
      menuBody.appendChild(btn(end.last ? "Chapter Select" : "Next Chapter", () => {
        endCeremony();
        if (end.last) { buildMenu("world"); return; }
        levelIdx = levelIdx + 1; loadLevel(levelIdx); closeMenu();
      }));
    // RETRY everywhere but a clear — starting again is what a fall leaves you, and what a
    // pause offers; on a level you have just finished it is not what you came for.
    // RETRY is built LAST on a fall — see below, where it is pushed to the foot of the screen.
    if (!end)
      menuBody.appendChild(btn("Restart Chapter", () => { loadLevel(levelIdx); closeMenu(); }));
    // ...and a way PAST it. Only where you have just failed, and only where there is a level
    // to skip to: a run you cannot finish should not be the end of the campaign for you, and
    // the alternative — hunting through the Tileverse for the next square — makes being stuck
    // feel like being punished.
    if (end && end.kind === "lose" && levelIdx < LEVELS.length - 1) {
      const skipBtn = btn("Skip Chapter", () => {
        levelIdx = levelIdx + 1; loadLevel(levelIdx); closeMenu();
      });
      skipBtn.classList.add("rust");
      menuBody.appendChild(skipBtn);
    }
    // A FALL offers three answers and stops: go again, go past it, or go back to the map. The
    // shop and the talismans and the settings are all still there, one tap away on the map —
    // but a screen that has just told you you died is not the moment to sell you a hat, and six
    // buttons is a list rather than a decision.
    if (end && end.kind === "lose") {
      const back = btn("Menu", () => buildMenu("world"));
      back.classList.add("void");
      menuBody.appendChild(back);
      // ...and RETRY at the very bottom, a screen away from the two that take you elsewhere.
      // It is the one you will press most and the one you press without reading, so it wants to
      // be under your thumb rather than first in a list — and the gap is what stops it being
      // pressed by accident on the way to the other two.
      const gap = document.createElement("div"); gap.className = "menu-push";
      menuBody.appendChild(gap);
      menuBody.appendChild(btn("Retry", () => { loadLevel(levelIdx); closeMenu(); }));
      const ver0 = document.createElement("div"); ver0.className = "menu-ver"; ver0.textContent = VERSION;
      menuBody.appendChild(ver0);
      return;
    }
    const worldBtn = btn("Tileverse", () => buildMenu("world"));
    worldBtn.classList.add("void");
    menuBody.appendChild(worldBtn);
    // The plain grid is off the menu. The Tileverse says everything it said and says it as a
    // place; two doors onto the same list was one door too many. The screen itself is left
    // standing — it costs nothing, and the Intro button lives on it — but nothing routes there
    // any more, so every way in now lands on the map.
    // The balance belongs on the way in, not two taps deep: the question "can I afford
    // anything yet" is the only reason to open the shop at all.
    const talBtn = btn("Holy Talismans", () => buildMenu("talismans"));
    talBtn.classList.add("amber");
    menuBody.appendChild(talBtn);
    const shopBtn = btn("Tile Shop", () => buildMenu("shop"));
    shopBtn.classList.add("gold");
    walletInto(shopBtn, "Tile Shop");
    menuBody.appendChild(shopBtn);
    menuBody.appendChild(btn("Settings", () => buildMenu("settings")));
    const ver = document.createElement("div"); ver.className = "menu-ver"; ver.textContent = VERSION;
    menuBody.appendChild(ver);
  }

  // The level's backing and its count-in belong to the level. Anywhere else has its own tune.
  Sound.setMusicGate(() => !paused && !cineActive && !titleActive);

  applyColorblind();   // apply saved colorblind setting on load

  window.addEventListener("resize", () => { computeLayout(); snapCamera(); });
  window.addEventListener("orientationchange", () => setTimeout(() => { computeLayout(); snapCamera(); }, 150));
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault());

    tapCell: (c, r) => {                       // simulate a tap at a grid cell (stone/switch)

    },
    occupied: (c, r) => occupiedFor(null).has(key(c, r)),
    // where a hunting monster standing on (c,r) would step next — the chase, without a chase
    hunt: (c, r) => monsterHuntStep([c, r]),
    talismans: { all: () => TALISMANS.map(t=>t.id), unlocked: () => [...talUnlocked],
                 wear: (id) => { settings.talisman = id; saveSettings(); },
                 worn: () => settings.talisman || null,
                 onBoard: () => state.talismans.map(t=>({c:t.c,r:t.r,id:t.id,got:t.got})),

    moveBlock: (i, pos) => { const b = state.blocks[i]; if (b) { b.pos = clamp(pos, b.lo, b.hi); markOccDirty(); } },
    openMDoor: (i) => { const md = state.manualDoors[i]; if (md) { md.left = 1; md.right = 1; markOccDirty(); } },
    ui: {
      undo: () => undoLast(),
      relink: () => linkParkedTiles(),      // the pass update() runs every frame

      trapPhase: (t) => trapPhase(t),
      noticeLoop: () => noticeLoop(),       // the circuit check update() runs on every step
      openMenu: (s) => openMenu(s), closeMenu: () => closeMenu(),
      isPaused: () => paused,
      setColorblind: (v) => { colorblind = v; applyColorblind(); }, isColorblind: () => colorblind,
      menuButtons: () => Array.from(menuBody.querySelectorAll("button,.toggle")).map(e => e.textContent),
    },
  };

  // ---------- Title / attract screen -------------------------------------
  const TITLE_WORDS = ["TILE", "RUNNER"];
  const TITLE_TILE_DX = 0.13;            // how far left TILE sits, as a fraction of its size
  const TITLE = { t: 0, u: 0 };
  function easeOutBack(p){ const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); }

  function startTitle(){
    titleActive = true;
    TITLE.t = 0; TITLE.u = 0;
    const pf = document.getElementById("pauseFloat"); if (pf) pf.style.display = "none";
    Sound.ambient("title");
  }
  function leaveTitle(){
    if (!titleActive) return;
    titleActive = false;
    const pf = document.getElementById("pauseFloat"); if (pf) pf.style.display = "";
    Sound.unlock();
    // The creation myth plays ONCE, for someone who has never seen it — it loads level one
    // itself when it ends. Everybody else lands in the Tileverse and picks where to go, which
    // is what a returning player wanted anyway: the old rule keyed off the level you were on,
    // so anyone still on level one sat through the whole opening every single launch.
    if (!cineSeen()) startCine("level");      // the cinematic picks the theme up from here
    else openMenu("world");                   // the map, opened on the level you are up to
  }

  // ---------- BIG MAN LITTLE ----------------------------------------------
  // The studio mark: the name set as a JUSTIFIED STACK — every line ruled to the same width,
  // so the number of letters in a word is what decides how tall it stands. BIG and MAN are
  // three letters each and come out big; LITTLE is six and comes out half the height. The joke
  // does its own typesetting, and the block squares off on both edges because every line was
  // measured to the same rule.
  //
  // Deliberately not the game's gold extrusion — that treatment is TILE RUNNER's own, and a
  // studio card that wears it reads as part of the game rather than as the house behind it.
  const LOGO = {
    words: ["BIG", "MAN", "LITTLE"],
    lead:  0.105,    // between lines, as a fraction of the mark's width
    ink:   "#f4f2ff",
  };
  // Draws the mark centred on (cx, cy) and exactly W wide, and reports the band it filled so
  // a caller can hang something under it.
  function drawLogo(cx, cy, W, ts, alpha){
    if (alpha <= 0.004) return { top: cy, bottom: cy };
    const lines = LOGO.words.map(word => {
      ctx.font = "900 100px " + UI_FONT;
      const w = ctx.measureText(word).width || 1;
      const size = 100 * W / w;
      ctx.font = "900 " + Math.round(size) + "px " + UI_FONT;
      const m = ctx.measureText(word);
      // Real ink extents, not the em box: a justified stack has to sit on the letters
      // themselves or the gaps between the lines come out uneven.
      const asc = m.actualBoundingBoxAscent  || size*0.72;
      const dsc = m.actualBoundingBoxDescent || 0;
      return { word, size, asc, dsc, h: asc + dsc };
    });
    const lead   = W*LOGO.lead;
    const totalH = lines.reduce((s, l) => s + l.h, 0) + lead*(lines.length - 1);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = LOGO.ink;
    let y = cy - totalH/2;
    for (const l of lines) {
      ctx.font = "900 " + Math.round(l.size) + "px " + UI_FONT;
      ctx.fillText(l.word, cx, y + l.asc);
      y += l.h + lead;
    }
    ctx.restore();
    return { top: cy - totalH/2, bottom: cy + totalH/2 };
  }

  // ---------- Opening cinematic -------------------------------------------
  // The creation myth, in eight beats: nothing, the Sacred Tiloid, its unfolding into the
  // Tileverse, and the runner the whole place was missing. Plays ahead of level one when the
  // game is started from the title, and is replayable from the top of the Tileverse.
  // Tap anywhere to skip.
  //
  // Every beat is a timestamp in ms so the whole thing retimes by reading down this one
  // table; nothing below hard-codes a duration.
  const CINE = {
    line1:  [  400,  1100,  2500,  3050],   // AT FIRST, THERE WAS NOTHING.
    seed:   [ 3100,  5600],                 // a square shoulders its way in, shaking
    born:   5600,                           // ...and is the Tiloid, on a flash
    line2:  [ 5750,  6300,  8300,  8850],   // UNTIL THE SACRED TILOID CAME INTO THE VOID.
    spin:   [ 5600, 10250],                 // it turns, and swells toward a sphere and back
    line3:  [ 9000,  9500, 11300, 11850],   // IT UNFOLDED.
    unfold: [ 9700, 11500],                 // six faces peel off the solid and lie flat
    grow:   [11500, 15700],                 // ...and bud outward until the cloud is whole
    line4:  [15800, 16300, 18300, 18850],   // AND THE TILEVERSE WAS CREATED.
    // Three moments, not two: the camera first CENTRES on level one at the cloud's own scale,
    // and only then expands into it. Doing both at once swings the tile across the frame while
    // it grows, so it is off in a corner for most of the move and arrives rather than being
    // approached. Pan, then push in.
    dive:   [19000, 20050, 21800],          // begin the pan | begin the zoom | inside it
    pixels: [20050, 22300],                 // the quilt subdivides with the ZOOM, not the pan
    line5:  [22100, 22600, 27200, 27750],   // ALGORITHMIC EMERGENCE GAVE RISE TO A RUNNER
    // Conway, at LENGTH. This was 800ms — fifteen generations at 55ms each, which is a boil
    // rather than a process: the one moment in the story where something is being computed
    // went past too fast to read as computation at all. Four and a half times as long, and
    // each generation held nearly three times as long, so you can see a pattern settle and
    // die. It is also what makes the note per generation musical rather than a machine gun.
    gather: [22300, 25900],                 // every one of those pixels rushes together into him
    fall:   [25900, 26600],                 // and he drops out of the place he was made
    plinth: 26600,                          // ...onto a tile that is suddenly under his feet
    line6:  [27900, 28400, 30200, 30750],   // A BEING WITH ONE SACRED PURPOSE...
    line7:  [30900, 31400, 36200, 36750],   // TO RUN.
    run:    31200,                          // track lays itself ahead and he goes
    // At 0.8 tiles a second, and on the winding path's average of two thirds of a column per
    // tile, clearing the frame takes him between 4.7s (a narrow phone) and 6.3s (a wide one).
    // The fade waits for the first of those and catches the last mid-stride, which is the right
    // way round: better to fade on a runner still going than to sit on an empty picture.
    fade:   [36800, 37800],
    end:    38100
  };
  const CINE_LINES = {
    line1: "AT FIRST, THERE WAS NOTHING.",
    line2: "UNTIL THE SACRED TILOID CAME INTO THE VOID.",
    line3: "IT UNFOLDED.",
    line4: "AND THE TILEVERSE WAS CREATED.",
    line5: "ALGORITHMIC EMERGENCE\nGAVE RISE TO A RUNNER",
    line6: "A BEING WITH ONE SACRED PURPOSE...",
    line7: "TO RUN.",
  };
  // The house card, ahead of everything. It buys its time by OFFSETTING the story rather than
  // by renumbering the table above: drawCine works in story time, `cineT - CINE_LEAD`, which
  // is simply negative while the card is up and every envelope below already reads that as
  // "not yet". Retime the card and not one line of the beat table has to move.
  const CINE_LEAD = 3300;
  const CINE_CARD = { in: 560, out: 2850, gone: 3300 };
  // Where each chapter of the story begins, in cineT. A tap moves the show on by ONE of these
  // rather than throwing the whole thing away — someone who has seen the Tiloid a dozen times
  // can still want to watch the Tileverse build. Taking a tap past the last one ends it.
  //
  // The story has ten beats; a tap stops at seven of them. Three are deliberately NOT landing
  // places — the square rumbling in (3), the unfold (5) and the dive into level one (7). Each
  // of those is the PAYOFF of the line before it rather than a chapter of its own, so a tap
  // ought to carry you over it to the next thing that is said, not strand you at the top of an
  // animation you have just chosen to hurry past. They all still play in full when the show
  // runs of its own accord.
  const CINE_STEPS = [
    0,                                    //  1. BIG MAN LITTLE presents
    CINE_LEAD,                            //  2. AT FIRST, THERE WAS NOTHING.
                                          //  3. (the square rumbles in — played, never stopped at)
    CINE_LEAD + CINE.born     - 320,      //  4. UNTIL THE SACRED TILOID CAME INTO THE VOID.
                                          //  5. (IT UNFOLDED — played, never stopped at)
    CINE_LEAD + CINE.line4[0] - 200,      //  6. AND THE TILEVERSE WAS CREATED.
                                          //  7. (the dive into level one — played, never stopped at)
    CINE_LEAD + CINE.line5[0] - 300,      //  8. ALGORITHMIC EMERGENCE GAVE RISE TO A RUNNER
    CINE_LEAD + CINE.line6[0] - 200,      //  9. A BEING WITH ONE SACRED PURPOSE...
    CINE_LEAD + CINE.line7[0] - 400,      // 10. TO RUN.
  ];
  const CINE_RUN_SPD = 0.0008;      // tiles per ms once he sets off — 0.8 tiles a second
  const CINE_LAY     = 190;         // ms between the two tiles that arrive to start him off
  // Where along his first tile he is standing when he sets off. A tile is two background squares
  // wide, so its centre is a seam and the nearest square centre is a quarter of a tile back —
  // see cineFinalBox. The run picks up from exactly there.
  const CINE_RUN_U0  = 0.25;
  // The size he is, and the size the tiles under him are, from the moment he forms. The dive
  // ends with level one filling the screen, so the tile he was made out of is far too big to
  // stand on; the world comes back to human scale as he arrives in it — and human scale here is
  // literally the game's own: `cell`, the very tile he will be running on a second later, which
  // is what the title screen's own auto-run uses too. Nothing about the handover from the story
  // to the game is a change of scale.
  //
  // It also makes the backdrop exactly right for free. Half of `cell` is the measure the level
  // quilt is pieced to — see drawPatchwork — so the squares behind him in the cinematic are the
  // same size as the squares behind him in play.
  const CINE_RUN_TILE = () => cell || 90;
  // What the square before the Tiloid flickers through. Not level one's palette: this is
  // BEFORE the Tileverse has any colours of its own, so it runs the raw primaries and black,
  // with the first level's own colours folded in at the end as the only hint of what it is going
  // to settle into being — through themeSeed, so it follows the salt like everything else. Black is in there on purpose — a square that blinks out entirely for a
  // frame is far more unstable-looking than one that merely changes hue.
  const CINE_SEED_COLS = [
    "#ff2d2d", "#2dff5a", "#2d6bff", "#ffe02d", "#00e5ff", "#ff2df0", "#ffffff",
    "#000000", "#ff2d2d", "#000000", "#2d6bff", "#000000", "#ffe02d", "#2dff5a",
  ].concat(genTheme(themeSeed("1")).colors);
  const CINE_POP     = 340;         // how long one tile takes to bud out of its parent
  const CINE_PERSP   = 4.5;         // camera distance from the solid, in cells
  const cineC01    = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const cineMix    = (a, b, k) => a + (b - a)*k;
  const cineSmooth = k => k*k*(3 - 2*k);

  let cineActive = false, cineNext = "level", cineT = 0, cineFired = 0;
  // Every moment at which some square of the world comes down flat — the six faces of the
  // Tiloid and every tile that buds off them afterwards — in one sorted list, and how far
  // through it we are. One list rather than two, because they are the same event.
  let cineFlaps = null, cineFlapI = 0;
  // ...and every moment a TRACK tile arrives under or ahead of the runner: the one that catches
  // him, the two that start him off, and each one the queue flies to the front thereafter.
  let cineLays = null, cineLayI = 0;
  let cineGenI = 0;                 // generations of Life already sung
  // Story time of the last tap-to-skip, or null while the show is running of its own accord.
  // A line whose fade-in the tap landed in front of is drawn at full strength instead of
  // easing up: skipping AHEAD to a chapter and then watching its words wash in is the tap
  // failing to do the thing it was pressed for.
  let cineSnapAt = null;
  let cineCloud = null, cineNet = null;

  // The Tileverse cloud, plus the order it grows in. Breadth-first out from the six faces, so
  // every tile after the sixth has a NEIGHBOUR already standing to bud out of — which is the
  // whole point of the beat: nothing appears out of empty space.
  function cineBuildCloud(){
    const cells = tileverseLayout(LEVELS.length);
    if (!cells.length) return null;
    const cols = Math.max(...cells.map(p => p.c)) + 1;
    const rows = Math.max(...cells.map(p => p.r)) + 1;
    const at = new Map(); cells.forEach((p, i) => at.set(p.c + "," + p.r, i));
    return { cells, cols, rows, at, n: cells.length };
  }
  // ...and the order the rest of it arrives in, once the net has claimed its six squares.
  function cineSeedGrowth(C, seeds){
    const parent = new Array(C.n).fill(-1), rank = new Array(C.n).fill(-1);
    const isSeed = new Array(C.n).fill(false), q = [];
    for (const i of seeds) { if (i == null || rank[i] >= 0) continue; rank[i] = 0; isSeed[i] = true; q.push(i); }
    for (let h = 0; h < q.length; h++) {
      const i = q[h], p = C.cells[i];
      for (const [dc, dr] of DIRS) {
        const j = C.at.get((p.c + dc) + "," + (p.r + dr));
        if (j == null || rank[j] >= 0) continue;
        rank[j] = q.length; parent[j] = i; q.push(j);
      }
    }
    // The blob is a filled disc, so this never fires — but a layout that ever grew an island
    // would otherwise leave tiles that simply never appear.
    for (let i = 0; i < C.n; i++) if (rank[i] < 0) { rank[i] = q.length; q.push(i); }
    C.parent = parent; C.rank = rank; C.isSeed = isSeed; C.seeds = seeds.length;
  }

  // The box level one ends the dive as: square, big enough to cover the screen, a whole number
  // of half-tiles on a side, and seated so its own grid IS the grid the runner's tiles sit on.
  // Everything about the end of the dive falls out of this one rectangle.
  function cineFinalBox(){
    const s0 = CINE_RUN_TILE(), h2 = s0/2;
    // An EVEN number of half-tiles, big enough that a centred square of that side covers the
    // screen. Even matters: centred, the box's left edge sits h2*(n-2)/2 from the runner's own
    // grid line, which is a whole number of squares only when n is. That one condition buys
    // horizontal alignment without moving the camera off the tile — and the camera has to stay
    // on the tile, or it drifts across the frame as it grows instead of opening out from where
    // it already is.
    const n = 2*Math.ceil(Math.max(viewW, viewH)/(2*h2));
    const size = n*h2, x = (viewW - size)/2, y = (viewH - size)/2;
    // Vertically there is no such luck, so the RUNNER'S GROUND moves to meet the quilt instead:
    // the nearest line of the box's own grid to where the ground wanted to be. Worst case that
    // is half a background square — about a thirtieth of the screen — and in exchange the tiles
    // he runs on sit exactly two background squares deep, everywhere, for nothing.
    const want = viewH*0.66 - s0/2;
    const gy = y + Math.round((want - y)/h2)*h2;
    // He forms in the dead CENTRE of a background square, not on the seam between two. The
    // tile's own middle is a seam — a tile is exactly two squares wide — so the nearest centre
    // is a quarter of a tile back from it, and that is where he lands: toward the BACK of the
    // tile he arrives on, with the rest of it ahead of him to run into.
    const spawnX = viewW/2 - s0/4;
    const spawnY = y + (Math.floor((viewH*0.34 - y)/h2) + 0.5)*h2;
    return { x, y, n, size, q: h2, groundY: gy + s0/2, spawnX, spawnY };
  }
  // Where the camera is, as a tile size and the screen point cloud-cell (0,0)'s corner sits at.
  // Three framings, and the whole shot is a walk between them: the six faces filling the frame,
  // the finished cloud fitting it, and level one filling it again on the dive.
  function cineCam(t){
    const C = cineCloud, base = Math.min(viewW, viewH);
    // The squares the NET claimed, which are not the first six in reading order — a cube net
    // cannot be a 2x3 block, so it reaches further into the cloud than the sixth tile.
    const seeds = cineNet.seeds.map(i => C.cells[i]);
    const span = (arr, k) => [Math.min(...arr.map(p => p[k])), Math.max(...arr.map(p => p[k]))];
    const [sc0, sc1] = span(seeds, "c"), [sr0, sr1] = span(seeds, "r");
    const A = { tile: Math.min(base*0.20, viewW*0.72/(sc1 - sc0 + 1)),
                fc: (sc0 + sc1 + 1)/2, fr: (sr0 + sr1 + 1)/2, ax: 0.5, ay: 0.52 };
    const B = { tile: Math.min(viewW*0.88/C.cols, viewH*0.60/C.rows),
                fc: C.cols/2, fr: C.rows/2, ax: 0.5, ay: 0.52 };
    // ...and level one, filling the screen outright — the dive is supposed to end INSIDE the
    // tile, with its quilt as the whole picture and nothing else left to look at.
    //
    // Its final size is not a round fraction of the screen but a WHOLE NUMBER of half-tiles,
    // seated on the runner's own grid. That is what lets the tile scale as one picture on the
    // way in and still land with its squares at exactly half a runner tile, edge on edge —
