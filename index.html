    wallet.tiles += COIN_TILES; saveWallet(); showTally(c, r);
    if (!flew) { spawnPop(c, r, "#ffd24a"); spawnLight(c, r); }
    Sound.coin(); haptic(6);
  }
  // The Hammer of God: lift a tile that has already been laid, along with everything laid
  // after it, and put it back in your hand. Only ahead of the runner — pulling the ground
  // out from under him would just be a scripted death.
  function fingerLift(c, r) {
    const s = state;
    if (!(s.power.kind === "finger" && s.power.armed)) return null;
    const idx = s.path.findIndex(n => n.kind === "tile" && n.c === c && n.r === r);
    if (idx <= s.runIdx + 1) return null;          // he is on it, or about to step onto it
    const t = s.tiles[s.path[idx].tileId];
    if (!t) return null;
    while (s.path.length > idx) {                  // everything from here forward comes off
      const n = s.path.pop();
      if (n.kind === "tile" && s.tiles[n.tileId]) s.tiles[n.tileId].status = "free";
      else if (n.kind === "platform") { const pf = (s.platforms||[]).find(p => p.id === n.pfId); if (pf) pf.lit = 0; }
    }
    s.power.armed = false; s.power.kind = null;    // spent
    s.lastPlacedId = null;
    markOccDirty(); updateReadyHud();
    spawnPop(c, r, "#ffe9a8");
    return t;
  }

  // the runner grabs the key by passing over its cell
  function collectKey() {
    const s = state;
    const rp = visualAt(s.runIdx + s.runT);
    const near = (c, r) => Math.hypot(rp.x-(c+0.5)*cell, rp.y-(r+0.5)*cell) < cell*0.7;
    const nearTight = (c, r) => Math.hypot(rp.x-(c+0.5)*cell, rp.y-(r+0.5)*cell) < cell*0.3;  // boost/slow: must nearly overlap
    // coins: grabbed by passing over them
    for (const ck of Array.from(s.coinCells)) {
      const [c, r] = ck.split(",").map(Number);
      if (near(c, r)) { s.coinCells.delete(ck); grabCoin(c, r); }
    }
    // talismans: passing over one unlocks it permanently, win or lose
    for (const t of s.talismans) {
      if (t.got || !near(t.c, t.r)) continue;
      t.got = true;
      const def = talById(t.id);
      const fresh = unlockTalisman(t.id);
      spawnPop(t.c, t.r, def ? def.col : "#ffd24a"); spawnLight(t.c, t.r);
      Sound.coin(); haptic([8, 30, 8]);
      // A level with a talisman and NO flag is that talisman's own maze: the charm IS the
      // exit, so picking it up finishes the level. Everywhere else it is just a pickup.
      if (!s.goal) { endWin(def); return; }
      // A talisman you already own pays out instead of doing nothing.
      if (fresh) flashTalisman(def);
      else { wallet.tiles += COIN_TILES*2; saveWallet(); showTally(t.c, t.r);
             s.score = computeScore(); updateScoreHud(); }
    }
    // boost / slow pickups: grabbed by passing over them → a time-limited speed effect
    for (const bk of Array.from(s.boost)) {
      const [c, r] = bk.split(",").map(Number);
      if (nearTight(c, r)) { s.boost.delete(bk); s.speedFx = { kind:"boost", t:BOOST_MS };
                        spawnPop(c, r, pal("boost")); spawnLight(c, r); (Sound.boost||Sound.coin)(); haptic(12); }
    }
    for (const bk of Array.from(s.slow)) {
      const [c, r] = bk.split(",").map(Number);
      if (nearTight(c, r)) { s.slow.delete(bk); s.speedFx = { kind:"slow", t:SLOW_MS };
                        spawnPop(c, r, pal("slow")); (Sound.slow||Sound.coin)(); haptic(12); }
    }
    // colored keys: each opens all doors of its colour; exit unlocks when ALL are held
    if (!s.keyCollected) {
      for (const k of s.keys) if (!k.got && near(k.c, k.r)) {
        k.got = true; spawnPop(k.c, k.r, k.color); haptic(10); Sound.key();
        for (const d of s.doors) if (d.color === k.color) d.open = true;
      }
      if (s.keys.every(k => k.got)) { s.keyCollected = true; updateKeyHud(); }
    }
    // doors keep their lock marker until the runner physically passes through them
    for (const d of s.doors) if (!d.reached && near(d.c, d.r)) d.reached = true;
  }

  // A tile becomes draggable the moment the runner crosses out of its cell
  // (i.e. past its centre-to-next midpoint), not when it reaches the next tile.
  function freeClearedTiles() {
    const s = state, param = s.runIdx + s.runT;
    let changed = false;
    for (let i = 0; i < s.path.length; i++) {
      const node = s.path[i];
      // fixed platforms clear like track but cost nothing and go back to the level,
      // not to your pool — no score, no combo, they're free ground.
      if (node.kind === "platform") {
        if (!node.exited && param > i + 0.5) {
          node.exited = true;
          Sound.clearTile();
          spawnLight(node.c, node.r);
        }
        continue;
      }
      if (node.kind !== "tile" || node.exited) continue;   // per-node, so re-placed tiles are unaffected
      if (param > i + 0.5) {
        node.exited = true;                                 // this placement is done
        Sound.clearTile();                                  // play a tone as the tile clears
        spawnLight(node.c, node.r);                         // burst of light from the cleared tile
        scoreClear(i);                                      // score, combo, juice on the beat
        if (node.tileId != null) {
          const t = s.tiles[node.tileId];
          if (t) {
            if (s.crumble.has(key(node.c, node.r))) {       // fragile floor: tile is consumed
              t.status = "spent"; t.c = -1; t.r = -1;
              s.crumbled.add(key(node.c, node.r));
              s.shake = Math.max(s.shake, cell * 0.12);
            } else {
              t.status = "free";
            }
            changed = true;
          }
        }
      }
    }
    if (changed) { markOccDirty(); updateReadyHud(); }   // a tile freed/consumed — occupancy changed
  }

  // Award points for a cleared tile and drive the beat-combo + feedback.
  function scoreClear(clearedIdx) {
    const s = state;
    s.combo++;                       // the combo IS the running score's core (final combo length)
    if (s.combo > s.maxCombo) s.maxCombo = s.combo;
    // wind the pace on. msPerCell is what actually drives movement, so derive it back
    // from the ramped cps, and hand the new beat length to the backing track — the
    // sub-beat notes between clears are scheduled off it.
    s.cpsNow = Math.min(RAMP_MAX_CPS, s.cpsNow + RAMP_PER_TILE);
    s.msPerCell = 1000 / s.cpsNow;
    Sound.setTempo(s.msPerCell);
    // track "flow" clears (a healthy buffer of track ahead) for the star rating
    let ahead = 0;
    for (let j = clearedIdx + 1; j < s.path.length; j++)
      if ((s.path[j].kind === "tile" || s.path[j].kind === "platform") && !s.path[j].exited) ahead++;
    if (ahead >= 2) s.flowClears++;
    s.score = computeScore();
    updateScoreHud();
    s.beatPulse = 1;                 // pulse the visuals on the beat
    haptic(6);
  }

  // Is the cell the runner is about to enter solid? Walls, stones and closed blocks
  // all stop him dead; open air means there is nothing to hit and he just drops.
  function wallAhead() {
    const s = state, last = s.path[s.path.length - 1];
    if (!last) return false;
    const ri = runnerInfo();
    const dc = Math.abs(ri.tx) > Math.abs(ri.ty) ? Math.sign(ri.tx) : 0;
    const dr = dc ? 0 : Math.sign(ri.ty);
    const c = last.c + dc, r = last.r + dr;
    if (!inBounds(c, r)) return false;                    // off the board is a fall, not a wall
    if (s.walls.has(key(c, r))) return true;
    if (s.stones && s.stones.has(key(c, r))) return true;
    for (const b of (s.blocks || [])) {                   // a sliding block counts while it's there
      const bc = b.axis === "h" ? b.pos : b.c, br = b.axis === "h" ? b.r : b.pos;
      if (Math.round(bc) === c && Math.round(br) === r) return true;
    }
    return false;
  }
  // End of the track: hit a wall and he squashes first, otherwise he just runs off.
  function endRun() {
    if (state.status !== "play") return;
    if (!wallAhead()) { startFall(); return; }
    const ri = runnerInfo();
    state.status = "squash";
    state.combo = 0;
    state.squash = { t:0, x:ri.sx, y:ri.sy, angle:ri.angle };
    state.shake = Math.max(state.shake, cell * 0.16);
    Sound.smash();                    // the existing impact voice — thud plus grit
    haptic([18, 40, 10]);
    state.drag = null;
  }
  // squash profile: compress hard, then relax part-way as he peels off the wall
  function squashK() {
    const q = state.squash; if (!q) return 0;
    const u = Math.min(1, q.t / SQUASH_MS);
    return u < 0.45 ? u/0.45 : 1 - 0.45*((u - 0.45)/0.55);
  }
  function tickSquash(dt) {
    const q = state.squash; if (!q) return;
    q.t += dt;
    if (q.t >= SQUASH_MS) { startFall(true); state.squash = null; }   // peeled off the wall
  }

  // `offWall` is the difference between the two ways a run ends. Off a ledge he keeps his
  // forward momentum and gravity takes it from there. Into a wall he has just been stopped
  // dead by something solid, so he comes back off it: thrown BACKWARDS along his own travel
  // direction, popped up a little, and tumbling the other way.
  const WALL_BOUNCE = 0.55;          // of his running speed, sent back the way he came
  const WALL_POP    = 0.62;          // upward kick out of the impact, same units
  function startFall(offWall) {
    const ri = runnerInfo();
    state.status = "falling";
    state.combo = 0;                 // the run ends — combo breaks
    state.shake = Math.max(state.shake, cell * 0.10);
    Sound.fall();                    // descending whistle as the runner tumbles
    haptic(60);
    state.drag = null;
    const spd = cell / state.msPerCell;            // the runner's forward speed (px/ms)
    if (offWall) {
      // "up" is perpendicular to travel, so the pop is away from the track he was on
      const ux = Math.sin(ri.angle), uy = -Math.cos(ri.angle);
      state.fall = { x:ri.sx, y:ri.sy, angle:ri.angle,
                     vx: -ri.tx*spd*WALL_BOUNCE + ux*spd*WALL_POP,
                     vy: -ri.ty*spd*WALL_BOUNCE + uy*spd*WALL_POP,
                     va: (ri.tx >= 0 ? -1 : 1) * 0.006, t:0 };
    } else {
      state.fall = { x:ri.sx, y:ri.sy, angle:ri.angle,
                     vx:ri.tx * spd, vy:ri.ty * spd,  // run off the edge, then gravity takes over
                     va:(ri.tx >= 0 ? 1 : -1) * 0.004, t:0 };
    }
  }
  function tickFall(dt) {
    const f = state.fall;
    f.t += dt; f.vy += FALL_G * dt;
    f.x += f.vx * dt; f.y += f.vy * dt; f.angle += f.va * dt;
    if (f.t >= FALL_MS) showLose();
  }
  // Reveal the LEVEL CLEAR score one white line at a time, then the final total.
  let winAnimToken = 0;
  function animateWinScore(rows, total, bestText) {
    const myToken = ++winAnimToken;
    ovScore.innerHTML = "";
    const mkLine = (label, val, cls) => {
      const d = document.createElement("div"); d.className = "ov-ln" + (cls ? " " + cls : "");
      d.innerHTML = "<span>" + label + "</span><span>" + val + "</span>";
      ovScore.appendChild(d); return d;
    };
    const els = rows.map(([label, val]) => mkLine(label, val));
    let i = 0;
    const step = () => {
      if (myToken !== winAnimToken) return;                 // a newer level started — abort
      if (i < els.length) { els[i].classList.add("show"); i++; setTimeout(step, 430); return; }
      const totalEl = mkLine("Score", total, "ov-total");    // …then the final score
      requestAnimationFrame(() => totalEl.classList.add("show"));
      if (bestText) { const b = mkLine("", bestText, "ov-best");
        setTimeout(() => { if (myToken === winAnimToken) b.classList.add("show"); }, 220); }
    };
    setTimeout(step, 320);
  }
  // Finishing a level earns you a compliment. Sort of. Split by whether you got it
  // first go or wore it down, because the backhand lands differently either way.
  const WIN_QUIPS = [
    "First go. Don't get used to it.",
    "Clean. Suspiciously clean.",
    "That was almost elegant.",
    "You made it look harder than it was.",
    "Textbook — if the textbook had typos.",
    "Efficient. Not the word I'd have picked, but efficient.",
    "Nicely done. The flag was getting bored.",
    "Great instincts. We'll work on the pace.",
    "Barely a wasted tile. Barely.",
    "Confidence like that can't be taught. Timing can.",
    "Smooth. Ish.",
    "The runner never doubted you. Not out loud.",
    "Solid work, by the standards you've set.",
    "You had a plan the whole time. Obviously.",
  ];
  const WIN_QUIPS_RETRY = [
    "Got there in the end. Emphasis on 'end'.",
    "Persistence is a kind of talent.",
    "That's the one. We'll ignore the others.",
    "Practice makes… this.",
    "Beautiful. Let's never speak of the attempts.",
    "You wore it down. That counts.",
    "Whichever try that was, it's the one that counts.",
    "The floor forgives you.",
    "A masterclass in trial and error. Mostly error.",
    "Took a few goes, but the last one was lovely.",
    "Every failure taught you something. Allegedly.",
    "Worth the wait. For you, anyway.",
  ];
  const pickQuip = a => a[(Math.random() * a.length) | 0];

  function endWin(relic) {
    state.status = "win";
    Sound.levelMusicStop();        // the level's backing ends with the level
    const att = state.attempts || 1;
    saveWallet();                               // bank the tiles this run collected
    {                                           // remember it's cleared — nothing else to track
      const best = loadBest(), keyId = "L" + levelIdx;
      best[keyId] = { done: true };
      saveBest(best);
    }
    Sound.win();
    haptic([12, 40, 12]);
    winAnimToken++;                             // cancel any in-flight score reveal
    ovStars.textContent = "";
    ovScore.innerHTML = "";
    const last = levelIdx >= LEVELS.length - 1;
    // A talisman maze gets its own curtain call: the charm itself, big and turning, its name
    // and what it does. Reaching the end of one of these is the only time the game hands you
    // a new verb, so it does not share the ordinary "Level Clear" card.
    if (relic) {
      overlay.className = "win relic show";
      ovTitle.textContent = relic.name;
      ovStars.innerHTML = "";
      const c = document.createElement("canvas"); c.width = 260; c.height = 260;
      c.className = "ov-relic";
      ovStars.appendChild(c);
      const g = c.getContext("2d");
      relicShowT = 0; relicShow = { g, def: relic };     // the frame loop turns it
      // The card reads top to bottom: the charm, its name, what it DOES, then the standing
      // rule. ov-score sits above ov-msg in the markup, so the blurb goes in score.
      ovScore.innerHTML = "<span class='ov-relic-does'></span>";
      ovScore.firstChild.textContent = relic.blurb;
      setByline(ovMsg, "A new talisman. Use it from the foot of any level — one power per run.");
      ovBtn.textContent = last ? "Level Select" : "Continue";
      updateOvShop();
      return;
    }
    relicShow = null;
    overlay.className = "win show";
    ovTitle.textContent = last ? "That's All of Them" : "Level Clear";
    setByline(ovMsg, last
      ? "All " + LEVELS.length + " levels. You've run out of track — and excuses."
      : pickQuip(att > 1 ? WIN_QUIPS_RETRY : WIN_QUIPS));
    ovBtn.textContent = last ? "Level Select" : "Next Level";
    updateOvShop();
  }
  // The charm on the win card: it rises into place, then hangs there turning gently.
  let relicShow = null, relicShowT = 0;
  function tickRelicShow(dt) {
    if (!relicShow) return;
    relicShowT += dt;
    const { g, def } = relicShow, S = 260;
    const inK = Math.min(1, relicShowT/460), e = 1 - Math.pow(1 - inK, 3);
    g.clearRect(0, 0, S, S);
    g.save();
    g.translate(S/2, S*0.52 + (1 - e)*40);
    g.globalAlpha = e;
    g.rotate(Math.sin(relicShowT/900) * 0.10);          // a slow hang, not a spin
    const R = 74;
    talHook(g, 0, 0, R, def);
    def.draw(g, 0, 0, R);
    g.restore();
  }
  const LOSE_QUIPS = [
    "Gravity: still undefeated.",
    "That's not a shortcut, that's a cliff.",
    "You'd like a word with HR about job safety.",
    "Bold strategy — laying track behind yourself.",
    "You had ONE job. It was the floor.",
    "You ran out of ground and options.",
    "Tiles are reusable. So are second chances.",
    "The floor is lava. Also, missing.",
    "Somewhere, a tile is feeling unused.",
    "Speedrunning… into the void.",
    "You trusted gravity. Rookie mistake.",
    "Great pace! Shame about the ending.",
    "Next time, maybe put a tile there.",
    "That was a controlled descent. Very controlled.",
    "You filed a complaint. It fell through.",
    "Physics 1, You 0.",
    "So close. So very, very not close.",
    "You're fine. You always land on your… nope.",
    "A for effort, F for flooring.",
    "The abyss says thanks for the snack.",
  ];
  const LOSE_TITLES = ["You Fell", "Wipeout!", "Splat.", "Down You Go", "Ouch.", "Gap Year"];
  let _lastQuip = -1;
  function showLose() {
    state.status = "lose";
    Sound.levelMusicStop();        // ...and with a fall, too
    saveWallet();                             // a failed run still keeps the tiles it cleared
    winAnimToken++; ovScore.innerHTML = "";   // cancel any pending win-score reveal
    ovStars.textContent = "";
    overlay.className = "lose show";
    let i = (Math.random() * LOSE_QUIPS.length) | 0;
    if (i === _lastQuip) i = (i + 1) % LOSE_QUIPS.length;   // avoid repeating the last quip
    _lastQuip = i;
    ovTitle.textContent = LOSE_TITLES[(Math.random() * LOSE_TITLES.length) | 0];
    setByline(ovMsg, LOSE_QUIPS[i]);
    ovBtn.textContent = "Retry";
    updateOvShop();
    Sound.death();                  // a short sad jingle on the death screen
  }

  // ---------- Rendering ---------------------------------------------------
  function draw(ts) {
    drawBackground(ts);                       // parallax procedural backdrop (screen space)
    // pause / win / death: show ONLY the level background (a clean replica) behind the card
    const menuOpen = menuEl && menuEl.classList.contains("show");
    if (state.status === "win" || state.status === "lose" || menuOpen) return;
    const sh = state.shake || 0;
    const shx = sh ? (Math.random()*2-1)*sh : 0, shy = sh ? (Math.random()*2-1)*sh : 0;
    ctx.save();
    ctx.translate(-Math.round(camX - shx), -Math.round(camY - shy));

    drawEdgeWalls();                              // the board's own boundary, before anything on it
    if (wallLayerDirty) buildWallLayer();
    if (wallLayer) {
      // Only the part of it that is on screen. The layer holds the WHOLE world at device
      // resolution — on the 13x19 maze at dpr 3 that is a ~29-megapixel texture — and this
      // used to hand the compositor all of it, every frame, to show a phone screen's worth.
      // The padding covers the screen shake, which moves the visible window a few px.
      const pad = 8 + (state.shake || 0);
      const vx0 = Math.max(0, Math.floor(camX - pad)), vy0 = Math.max(0, Math.floor(camY - pad));
      const vx1 = Math.min(worldW, Math.ceil(camX + viewW + pad));
      const vy1 = Math.min(worldH, Math.ceil(camY + viewH + pad));
      if (vx1 > vx0 && vy1 > vy0)
        ctx.drawImage(wallLayer, vx0*dpr, vy0*dpr, (vx1-vx0)*dpr, (vy1-vy0)*dpr,
                      vx0, vy0, vx1-vx0, vy1-vy0);
    }
    drawWallEyes(ts);                             // ...and the eyes, which cannot be baked in
    for (const [sk, st] of state.stones) {
      const [c, r] = sk.split(",").map(Number);
      drawStone(c, r, ts, st);
    }
    drawPlatforms(ts);

    drawBarriers(ts);
    drawSliders(ts);
    drawBlocks(ts);
    drawManualDoors(ts);
    drawTrack(ts);
    if (state.drag) drawTargets(ts);
    for (const t of state.tiles)
      if ((t.status === "free" || t.status === "parked") && (!state.drag || state.drag.tile.id !== t.id))
        drawFreeTile(cx(t.c), cy(t.r), ts, false);

    drawPickups(ts);
    drawShards();
    drawPops();
    drawLights();
    drawTrail();                                  // worn light trail, under the runner
    drawStarDust();                               // ...and the Cloak's dust, behind him too
    if (state.status === "intro") drawIntro(ts);
    else if (state.status === "campan" || state.status === "hold") { /* not formed yet */ }
    else drawRunner(ts);                          // "cue" included: standing, about to go
    drawHazards(ts);
    // Coins last of everything on the board. They hover off the surface, so a saw or a
    // block passing over one used to swallow it and the player would never know it was there.
    for (const ck of state.coinCells) { const [c,r] = ck.split(",").map(Number); drawCoin((c+0.5)*cell, (r+0.5)*cell, ts); }
    drawMagnetField(ts);
    for (const f of state.coinFly) {                 // reeled in: coin -> runner, over COIN_FLY_MS
      const rp = visualAt(state.runIdx + state.runT);
      const u = Math.min(1, f.t / COIN_FLY_MS), e = u*u*(3 - 2*u);   // ease so it accelerates in
      drawCoin((f.c+0.5)*cell + ((rp.x) - (f.c+0.5)*cell)*e,
               (f.r+0.5)*cell + ((rp.y - cell*0.3) - (f.r+0.5)*cell)*e, ts);
    }

    drawTally();                                  // ...and the count, over the cell it came from

    if (state.drag) {
      const d = state.drag;
      drawFreeTile(d.sx + camX - d.grabDX, d.sy + camY - d.grabDY, ts, true);
    }
    ctx.restore();

    // off-screen indicators (screen space): key (until collected) + exit
    if (state.status === "play" || state.status === "falling") {
      if (!state.keyCollected)
        for (const k of state.keys) if (!k.got)
          drawOffscreenArrow((k.c+0.5)*cell, (k.r+0.5)*cell, k.color, "key");
      if (state.goal)
        drawOffscreenArrow((state.goal.c+0.5)*cell, (state.goal.r+0.5)*cell, "#ffffff", "flag");   // white flag
    }
    drawSpeedHud();
    drawTalismanFlash(16, ts);
    drawWobble(ts);                     // the Mushroom, over the top of the finished frame
    drawVortex(ts);                     // ...and the whirlpool, over the top of everything
  }

  // The Mushroom's visuals. Rather than warping every drawing routine, the finished frame is
  // copied off and repainted as a stack of horizontal strips, each slid sideways on a
  // travelling sine — the old scanline-warp trick. It costs one full-canvas copy and a
  // strip's worth of blits, and only while the power is up. The whole frame goes through it,
  // HUD included: for six seconds the game itself is what's unwell.
  let wobbleCv = null;
  const WOBBLE_STRIP = 5;               // CSS px per strip; smaller = smoother, more blits
  function drawWobble(ts) {
    if (!powerActive("mush")) return;
    const p = state.power, ms = p.ms || 1;
    // eased in and out, so it swims up and settles rather than snapping on and off
    const k = Math.min(1, (ms - p.t) / 420) * Math.min(1, p.t / 500);
    if (k <= 0.001) return;
    if (!wobbleCv) wobbleCv = document.createElement("canvas");
    const W = canvas.width, H = canvas.height;
    if (wobbleCv.width !== W || wobbleCv.height !== H) { wobbleCv.width = W; wobbleCv.height = H; }
    const g = wobbleCv.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
    g.drawImage(canvas, 0, 0);
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#0a0817"; ctx.fillRect(0, 0, viewW, viewH);   // strips slide, so clear first
    ctx.filter = "hue-rotate(" + Math.round(Math.sin(ts/700)*46*k) + "deg) saturate(" + (1 + 0.55*k) + ")";
    const amp = cell * 0.16 * k, amp2 = cell * 0.05 * k;
    for (let y = 0; y < viewH; y += WOBBLE_STRIP) {
      const h = Math.min(WOBBLE_STRIP, viewH - y);
      const dx = Math.sin(y/38 + ts/230)*amp + Math.sin(y/13 - ts/150)*amp2;
      const dy = Math.sin(y/90 + ts/380)*amp*0.35;
      ctx.drawImage(wobbleCv, 0, y*dpr, W, h*dpr, dx, y + dy, viewW, h);
    }
    ctx.filter = "none";
    ctx.restore();
  }

  // live runner speed, top-left (screen space). Shown as cells/second on a dark pill.
  function drawSpeedHud() {
    const s = state;
    if (!s || (s.status !== "play" && s.status !== "falling" && s.status !== "vortex")) return;
    const factor = s.liveFactor != null ? s.liveFactor : 1;
    const cps = 1000 * factor / (s.msPerCell || 1000);      // cells per second
    const m = Math.round(Math.min(viewW, viewH) * 0.028);
    const fs = Math.max(15, Math.round(Math.min(viewW, viewH) * 0.045));
    ctx.save();
    ctx.textBaseline = "middle";
    const label = "SPEED", val = cps.toFixed(3), unit = " tiles/s";   // three decimals — the per-tile ramp is small
    const smallF = "700 " + Math.round(fs*0.52) + "px " + UI_FONT;
    const bigF   = "900 " + fs + "px " + UI_FONT;
    ctx.font = smallF; const lw = ctx.measureText(label).width;
    ctx.font = bigF;   const vw = ctx.measureText(val).width;
    ctx.font = smallF; const uw = ctx.measureText(unit).width;
    const padX = Math.round(fs*0.55), gap = Math.round(fs*0.4);
    const boxW = padX*2 + lw + gap + vw + uw, boxH = Math.round(fs*1.5);
    // square plate, matching the DOM buttons (which carry no radius at all)
    rrect(m, m, boxW, boxH, 0);
    ctx.fillStyle = "rgba(10,8,22,0.62)"; ctx.fill();
    ctx.lineWidth = Math.max(1, fs*0.05); ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.stroke();
    const midY = m + boxH/2;
    ctx.textAlign = "left";
    ctx.font = smallF;
    ctx.fillStyle = "rgba(214,218,240,0.78)";
    ctx.fillText(label, m + padX, midY + 1);
    ctx.font = bigF;
    ctx.fillStyle = (typeof curTrack === "function") ? curTrack() : "#ffd24a";
    ctx.fillText(val, m + padX + lw + gap, midY);
    ctx.font = smallF;                                                // unit in a smaller dim suffix
    ctx.fillStyle = "rgba(214,218,240,0.66)";
    ctx.fillText(unit, m + padX + lw + gap + vw, midY + 1);
    ctx.restore();
  }
  // The tile tally. Deliberately NOT a permanent HUD: the number only changes at the instant
  // you collect something, so a counter sitting there the rest of the time is one more thing
  // competing with the board for attention. It shows up big when the number moves, holds, and
  // gets out of the way. Grand total only — the old "3/7 this level" was answering a question
  // the coins already answer by still being on the board.
  const TALLY = {
    hold: 900,      // ms at full strength
    fade: 500,      // ...then this long dissolving
    pop:  260,      // the overshoot on arrival
    rise: 0.85,     // how far it drifts up over its life, in CELLS
    above: 0.55,    // how far above the coin's own centre it starts, in cells
    size:  0.30,    // cap height, as a fraction of a cell
  };
  let tallyAt = -1e9, tallyC = 0, tallyR = 0;
  function showTally(c, r) { tallyAt = performance.now(); tallyC = c; tallyR = r; }
  // Drawn INSIDE the board transform, so it rides with the camera and stays over the cell the
  // coin came out of. Sized in cells for the same reason: it has to sit against the board, not
  // against the screen, or it changes size relative to the coin it just replaced.
  function drawTally() {
    const age = performance.now() - tallyAt, life = TALLY.hold + TALLY.fade;
    if (age < 0 || age > life) return;
    const u = age/life;
    const a = age < TALLY.hold ? 1 : 1 - (age - TALLY.hold)/TALLY.fade;
    const k = 0.80 + 0.20*easeOutBack(Math.min(1, age/TALLY.pop));   // a short pop as it lands
    const f2 = Math.round(cell*TALLY.size);
    const txt = String(wallet.tiles);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.font = "900 " + f2 + "px " + UI_FONT;
    const ic = Math.round(f2*0.88), gap = Math.round(f2*0.30);
    const w = ic + gap + ctx.measureText(txt).width;
    const cxm = (tallyC + 0.5)*cell;
    const cym = (tallyR + 0.5)*cell - cell*(TALLY.above + TALLY.rise*u);
    ctx.translate(cxm, cym); ctx.scale(k, k); ctx.translate(-cxm, -cym);
    coinGlyph(cxm - w/2 + ic/2, cym, ic);
    // No plate and no outline: a plate popping in and out over the board is noisier than the
    // number it carries, and the black stroke around it was doing the same job twice as hard.
    const tx = cxm - w/2 + ic + gap;
    ctx.fillStyle = "#ffd24a"; ctx.fillText(txt, tx, cym);
    ctx.restore();
  }
  // The Magnet's reach, while it is up: rings that keep falling inward onto him, so the
  // ground it covers is a thing you can see rather than a number in a menu — and so the
  // direction of the pull is legible without a single coin being in range.
  function drawMagnetField(ts) {
    if (!powerActive("magnet")) return;
    const rp = visualAt(state.runIdx + state.runT);
    const cxm = rp.x, cym = rp.y - cell*0.3, R = MAGNET_CELLS * cell;
    ctx.save();
    // the faintest wash, purely so the reach still reads as an AREA between rings
    ctx.globalAlpha = 0.07; ctx.fillStyle = "#ff6d6d";
    ctx.beginPath(); ctx.arc(cxm, cym, R, 0, Math.PI*2); ctx.fill();
    // Shaded discs rather than drawn rings. An outline is a hard edge travelling across the
    // board, which reads as a boundary; a disc that is brightest at its rim and clear in the
    // middle reads as something closing IN, which is the whole idea.
    for (let i = 0; i < MAGNET_RINGS; i++) {
      // u runs 0 at the rim to 1 at him. Evenly spread, so one leaves as another arrives.
      const u = ((ts / MAGNET_RING_MS) + i / MAGNET_RINGS) % 1;
      const rad = R * (1 - u);
      if (rad < cell*0.05) continue;
      // in as it leaves the rim, out as it lands, so nothing ever pops into or out of being
      const a = 0.30 * Math.pow(Math.sin(Math.PI*u), 0.6);
      const g = ctx.createRadialGradient(cxm, cym, rad*0.55, cxm, cym, rad);
      g.addColorStop(0,    "rgba(255,157,157,0)");
      g.addColorStop(0.72, "rgba(255,157,157," + (a*0.45).toFixed(4) + ")");
      g.addColorStop(1,    "rgba(255,157,157," + a.toFixed(4) + ")");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cxm, cym, rad, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  // the coin as a flat badge, for the HUD and the shop — no float, no shine, just the shape
  function coinGlyph(cxp, cyp, s2) {
    const h = s2/2, r = s2*TILE.radius;
    ctx.save();
    rrect(cxp - h + s2*0.06, cyp - h + s2*0.10, s2, s2, r); ctx.fillStyle = COIN_EDGE; ctx.fill();
    rrect(cxp - h, cyp - h, s2, s2, r); ctx.fillStyle = "#ffd24a"; ctx.fill();
    if (COIN.panelA > 0) {                                        // the same pressed panel
      const ip = s2*COIN.panelPad;
      ctx.globalAlpha = COIN.panelA; ctx.fillStyle = COIN_EDGE;
      rrect(cxp - h + ip, cyp - h + ip, s2 - 2*ip, s2 - 2*ip, Math.max(0, r - ip*0.6)); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = Math.max(1, s2*0.07);
    ctx.beginPath(); ctx.moveTo(cxp - h + r, cyp - h + ctx.lineWidth*0.5);
    ctx.lineTo(cxp + h - r, cyp - h + ctx.lineWidth*0.5); ctx.stroke();
    ctx.restore();
  }

  // The laid path is drawn as a set of per-tile platform segments. Each tile
  // renders its OWN piece (a straight or corner beam) contained within its
  // cell: a glass background, then the platform whose running surface passes
  // through the tile centre and whose body hangs into the lower half.
  function drawTrack(ts) {
    const p = state.path, idx = state.runIdx;
    if (idx >= p.length) return;

    // a node carries a platform until the runner exits it (per-node flag, so a
    // re-placed tile's stale old node never affects its fresh placement).
    const live = (n) => n.kind === "tile" && !n.exited;
    const onGoal = (n) => !!state.goal && n.c === state.goal.c && n.r === state.goal.r;

    drawPathGlass(p.slice(idx).filter(live));

    for (let i = idx; i < p.length; i++)
      if (live(p[i])) {
        // leading tile = 3-way junction, unless it's the final tile on the goal cell
        if (i === p.length - 1 && !onGoal(p[i])) drawJunction(p[i], p[i-1], ts);
        else drawPlatformTile(p[i], p[i-1], p[i+1]);
      }

    // the exit is a floating flag on its cell; you must lay a tile there to finish
    if (state.goal) drawFlag(state.goal.c, state.goal.r, ts, false);   // never locked (no primary key)
  }

  // floating finish flag; you place a tile on its cell to reach the exit
  function drawFlag(c, r, ts, locked) {
    const x = (c+0.5)*cell, cy0 = (r+0.5)*cell, s = cell;
    const pt = state.flagPlantT || 0;                     // 0 floating -> 1 planted on the tile
    const bob = (1-pt) * Math.sin(ts/300)*s*0.05;
    // Once there is a tile here, the flag plants on the RUNNING SURFACE at the middle of that
    // tile's path — the point the runner actually crosses — rather than on the cell's centre
    // with a fudge factor. On a corner tile that midpoint is out on the arc, so the flag
    // stands on the track instead of hovering beside it.
    const gi = state.path.findIndex(n => n.kind === "tile" && n.c === c && n.r === r);
    let ax = x, ay = cy0, tang = null;
    if (gi >= 0) {
      const S = tileSurface(state.path[gi], state.path[gi-1], state.path[gi+1]);
      const m = Math.floor((S.length - 1)/2);
      ax = x + (S[m].x - x)*pt; ay = cy0 + (S[m].y - cy0)*pt;   // slide onto it as it plants
      const a = S[Math.max(0, m-1)], b = S[Math.min(S.length-1, m+1)];
      tang = Math.atan2(b.y - a.y, b.x - a.x);            // the surface's own direction there
    }
    const baseY = ay + bob;
    ctx.save();
    // place-here target ring (fades out once the flag is planted)
    if (pt < 0.98) {
      ctx.globalAlpha = (1-pt) * (0.4 + 0.3*Math.sin(ts/240));
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(2, s*0.04);
      ctx.setLineDash([s*0.12, s*0.09]);
      ctx.beginPath(); ctx.arc(x, cy0, s*0.28, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    if (locked) drawLock(x, cy0 + s*0.02, ts);   // small padlock (unused: exit never locked now)
    // as it plants, the flag tilts to stand square on the surface it is planting into
    let rot = 0;
    if (tang != null) rot = tang;
    else if (gi > 0) { const pv = state.path[gi-1]; rot = Math.atan2((r - pv.r), (c - pv.c)); }
    ctx.translate(ax, baseY);
    ctx.rotate(rot * pt);                                 // upright while floating, aligned once planted
    // Shorter, all-white pole. The base sits AT the origin, not below it: the origin is the
    // midpoint of the tile's path, and once the flag has planted, the local +y axis points
    // across the track rather than down the screen — so a base at +0.08 landed that far to
    // one side of the centreline. Zero puts the foot on the path itself. The pole keeps its
    // old 0.38-cell length by growing upward instead.
    const poleTop = -s*0.38, poleBot = 0;
    // The pool at the foot is the flag's shadow on the track, in the runner's shadow ink and
    // at his exact opacity — the two things standing on the same rail are lit the same way.
    // Drawn BEFORE the pole: a shadow the pole stands in, not a collar painted over its end.
    if (pt > 0.05) {
      ctx.globalAlpha = pt; ctx.fillStyle = "rgba(5,4,13," + RUNNER.shadowA + ")";
      ctx.beginPath(); ctx.ellipse(0, poleBot, s*0.07*pt, s*0.03*pt, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(2, s*0.035); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, poleTop); ctx.lineTo(0, poleBot); ctx.stroke();
    // smaller white pennant (wave settles as it plants), flying along the travel direction
    const wave = (0.4 + 0.6*(1-pt)) * Math.sin(ts/180)*s*0.03, fw = s*0.24, fh = s*0.15;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.moveTo(0, poleTop);
    ctx.quadraticCurveTo(fw*0.6, poleTop + fh*0.1 + wave, fw, poleTop + fh*0.5);
    ctx.quadraticCurveTo(fw*0.6, poleTop + fh*0.9 - wave, 0, poleTop + fh);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawKey(x, y, ts, color) {
    color = color || "#ffd24a";
    const s = cell*0.85, bob = Math.sin(ts/300)*s*0.05;   // a little smaller
    y += bob;
    ctx.save();
    ctx.globalAlpha = 0.28; ctx.fillStyle = color;                                   // soft glow
    ctx.beginPath(); ctx.arc(x, y, s*0.4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    const R = s*0.12, bx = x - s*0.10;
    ctx.fillStyle = color;                                                           // bow drawn as a true ring:
    ctx.beginPath();
    ctx.arc(bx, y, R, 0, Math.PI*2);                                                 // outer edge
    ctx.arc(bx, y, R*0.46, 0, Math.PI*2, true);                                       // inner edge -> hole
    ctx.fill("evenodd");                                                             // centre left transparent (shows the scene behind)
    const sx0 = bx + R*0.6, sl = s*0.30, tipX = sx0 + sl, tw = s*0.035, th = s*0.07;
    ctx.fillStyle = color;
    ctx.fillRect(sx0, y - s*0.028, sl, s*0.056);                                     // shaft
    ctx.fillRect(tipX - tw, y + s*0.012, tw, th);                                     // teeth — near the tip
    ctx.fillRect(tipX - tw - s*0.07, y + s*0.012, tw, th);
    ctx.restore();
  }

  // --- Batch 2 cell-type rendering ---------------------------------------
  function drawBarriers(ts) {
    const s = state;
    for (const ck of s.crumble) if (!s.crumbled.has(ck)) { const [c,r]=ck.split(",").map(Number); drawCrumble(c,r,false,ts); }
    for (const ck of s.crumbled) { const [c,r]=ck.split(",").map(Number); drawCrumble(c,r,true,ts); }
    for (const bk of s.boost) { const [c,r]=bk.split(",").map(Number); drawFxPickup(c,r,ts,"boost"); }
    for (const bk of s.slow)  { const [c,r]=bk.split(",").map(Number); drawFxPickup(c,r,ts,"slow"); }
    for (const d of s.doors) {
      // coloured key-doors read as a LOCK (padlock marker); no full door tile
      if (!d.reached) drawDoorLock(d.c,d.r,ts,d.color,d.open);   // lock marker stays until the runner arrives
    }
    // linked switch/door groups: wires first (behind), then the sliding door, then the buttons
    for (const grp of s.gateGroups) {
      grp.switches.forEach((sw, i) => drawSwitchWire(sw, grp.door, grp.color, sw.used, ts, i, grp.switches.length));
    }
    for (const grp of s.gateGroups) drawSlidingDoor(grp, ts);
    for (const grp of s.gateGroups) {
      for (const sw of grp.switches) drawArcadeButton(sw.c, sw.r, sw.used, ts, grp.color);
    }
  }
  // a thin wire from a switch to its door. Multiple wires to the same door run in parallel
  // lanes (offset by index) so they never draw on top of one another.
  function drawSwitchWire(sw, door, color, used, ts, idx, count) {
    const x1 = (sw.c+0.5)*cell, y1 = (sw.r+0.5)*cell, x2 = (door.c+0.5)*cell, y2 = (door.r+0.5)*cell;
    const lane = (idx - (count-1)/2) * cell*0.16;   // per-switch parallel lane
    const ex = x2 + lane;                           // vertical run sits in its own lane
    const pts = [[x1, y1], [ex, y1], [ex, y2], [x2, y2]];
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = used ? color : "rgba(150,156,172,0.5)";
    ctx.globalAlpha = used ? 0.85 : 0.5;
    ctx.lineWidth = Math.max(1.5, cell*0.03);
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    if (used) {   // a travelling pulse along the polyline
      const segs = []; let tot = 0;
      for (let i = 0; i < pts.length-1; i++) { const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); segs.push(d); tot += d; }
      let ph = ((ts/500) % 1) * (tot || 1), px = pts[0][0], py = pts[0][1];
      for (let i = 0; i < segs.length; i++) {
        if (ph <= segs[i] || i === segs.length-1) { const f = segs[i] ? ph/segs[i] : 0;
          px = pts[i][0] + (pts[i+1][0]-pts[i][0])*f; py = pts[i][1] + (pts[i+1][1]-pts[i][1])*f; break; }
        ph -= segs[i];
      }
      ctx.globalAlpha = 0.9; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(px, py, cell*0.05, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  // a dual sliding door: two slim riveted colour panels (styled like the wall tiles) that part as it opens
  function drawSlidingDoor(grp, ts) {
    const { c, r } = grp.door, x = cx(c), y = cy(r), s = cell, t = grp.openT, color = grp.color;
    if (t >= 0.995) return;                       // fully open — nothing to draw
    ctx.save();
    rrect(x, y, s, s, tileR(s)); ctx.clip();
    const off = t * (s*0.5 + 2);                  // each panel slides outward by up to half a cell
    const pw = s*0.5 - 1;
    const panel = (px) => {
      const g = ctx.createLinearGradient(px, y, px, y+s);
      g.addColorStop(0, shade(color, 34)); g.addColorStop(0.5, color); g.addColorStop(1, shade(color, -48));
      rrect(px, y+2, pw, s-4, tileR(s)); ctx.fillStyle = g; ctx.fill();
      ctx.save(); rrect(px, y+2, pw, s-4, tileR(s)); ctx.clip(); grainFill(px, y, pw, s, 0.7); ctx.restore();  // paper grain, like other tiles
      // corner rivets, matching the wall tiles' rivet size (s*0.05)
      const ox = Math.max(3, pw*0.24), oy = s*0.16, br = s*0.05;
      ctx.fillStyle = "rgba(0,0,0,0.30)";
      for (const [bx,by] of [[ox,oy],[pw-ox,oy],[ox,s-oy],[pw-ox,s-oy]]) { ctx.beginPath(); ctx.arc(px+bx, y+by, br, 0, Math.PI*2); ctx.fill(); }
    };
    panel(x - off);                               // left panel slides left
    panel(x + s*0.5 + off + 1);                   // right panel slides right
    ctx.restore();
  }
  // a simple 2.5D arcade push-button mounted on a metal wall: a flat top face on a coloured base
  function drawArcadeButton(c, r, used, ts, color) {
    const x = cx(c)+cell*0.5, y = cy(r)+cell*0.5, s = cell;
    const pulse = used ? 0 : 0.5 + 0.5*Math.sin(ts/300);
    const R = s*0.19, depth = used ? s*0.03 : s*0.09;   // extrusion; pressed sits lower
    const topY = y - depth*0.5, baseCol = shade(color, -80), topCol = used ? shade(color, -22) : color;
    ctx.save();
    // dark round housing (mounted on the wall)
    ctx.fillStyle = "#191b22"; ctx.beginPath(); ctx.arc(x, y + depth*0.5, R*1.3, 0, Math.PI*2); ctx.fill();
    // side wall (the 2.5D thickness): base disc + a connecting band = a short cylinder
    ctx.fillStyle = baseCol;
    ctx.beginPath(); ctx.arc(x, topY + depth, R, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(x - R, topY, R*2, depth);
    // flat top face
    ctx.fillStyle = topCol; ctx.beginPath(); ctx.arc(x, topY, R, 0, Math.PI*2); ctx.fill();
    if (!used) {
      // simple crescent sheen along the top edge
      ctx.fillStyle = shade(color, 55); ctx.beginPath(); ctx.arc(x, topY - R*0.12, R*0.66, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = topCol; ctx.beginPath(); ctx.arc(x, topY + R*0.04, R*0.78, 0, Math.PI*2); ctx.fill();
      // pulsing "tap me" ring
      ctx.globalAlpha = 0.3 + 0.45*pulse; ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, s*0.028);
      ctx.beginPath(); ctx.arc(x, topY, R*1.12, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = Math.max(1.5, s*0.03); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x - R*0.4, topY); ctx.lineTo(x - R*0.1, topY + R*0.35); ctx.lineTo(x + R*0.45, topY - R*0.35); ctx.stroke();
    }
    ctx.restore();
  }
  // lighten/darken a #rrggbb by amount (-255..255)
  // shade(), but returning hex so hexA() can put an alpha on it — the junction needs both
  function shadeHex(hex, amt) {
    const n = parseInt(hex.replace("#",""), 16);
    const cl = v => Math.max(0, Math.min(255, v + amt));
    const to = v => cl(v).toString(16).padStart(2, "0");
    return "#" + to((n>>16)&255) + to((n>>8)&255) + to(n&255);
  }
  // Turn a hex colour's hue, drain its saturation and shift its lightness, all at once.
  // shade() only moves lightness, which is why the ground could only ever be a darker copy
  // of the track — this lets it be a different material.
  function tintHex(hex, degrees, satMul, lightAmt) {
    const n = parseInt(hex.replace("#",""), 16);
    let r = ((n>>16)&255)/255, g = ((n>>8)&255)/255, b = (n&255)/255;
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
    let h = 0; const l = (mx+mn)/2;
    let sat = d === 0 ? 0 : d / (1 - Math.abs(2*l - 1));
    if (d !== 0) {
      h = mx === r ? ((g-b)/d + (g < b ? 6 : 0)) : mx === g ? ((b-r)/d + 2) : ((r-g)/d + 4);
      h *= 60;
    }

    return p;

  // The loop a talisman hangs from, in the tile's OUTER colour — the face, the same lighter

  // tile and it looks attached.

    ctx.beginPath();                                          // arrowhead
    ctx.moveTo(x - aw, tipY - dir*hl);
    ctx.lineTo(x,       tipY);
    ctx.lineTo(x + aw, tipY - dir*hl);
    ctx.stroke();
    ctx.restore();
  }
  function drawChevrons(c, r, ts, dir, color) {   // dir -1 = boost (up), +1 = slow (down)
    const x = cx(c), y = cy(r), s = cell, ph = (ts/380) % 1;
    ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, s*0.05);
    for (let k=0;k<3;k++){ const yy = y + s*(0.22 + ((k*0.26 + (dir<0?1-ph:ph)) % 0.78));
      ctx.beginPath(); ctx.moveTo(x+s*0.30, yy - dir*s*0.06); ctx.lineTo(x+s*0.5, yy + dir*s*0.06); ctx.lineTo(x+s*0.70, yy - dir*s*0.06); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.restore();
  }
  function drawCrumble(c, r, gone, ts) {
    // a swirling black hole: a pure-black event horizon ringed by a glowing accretion
    // disc, with spiral arms of matter being dragged inward.
    const x = cx(c)+cell*0.5, y = cy(r)+cell*0.5, s = cell*0.44, rot = (ts||0)/650;
    const a = gone ? 0.35 : 1, coreR = s*0.46;   // bigger event-horizon hole
    ctx.save(); ctx.translate(x, y);
    // faint gravitational halo
    ctx.globalAlpha = a;
    const halo = ctx.createRadialGradient(0,0,s*0.3,0,0,s);
    halo.addColorStop(0,"rgba(50,28,86,0)"); halo.addColorStop(0.7,"rgba(78,44,128,0.16)"); halo.addColorStop(1,"rgba(78,44,128,0)");
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.fill();
    // spiral arms of infalling matter (swirling around the hole)
    ctx.lineCap = "round";
    const arms = 5;
    for (let i=0;i<arms;i++){
      ctx.beginPath();
      for (let t=0;t<=1.0001;t+=0.05){
        const rad = coreR + (s*0.96 - coreR)*t;                    // from the horizon rim outward
        const ang = rot + i/arms*Math.PI*2 + (1-t)*Math.PI*2.6;    // winds tighter toward the core
        const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
        if (t===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.globalAlpha = a*0.8;
      ctx.strokeStyle = i%2 ? "rgba(255,168,72,0.75)" : "rgba(255,226,176,0.7)";
      ctx.lineWidth = Math.max(1.2, s*0.05);
      ctx.stroke();
    }
    // glowing accretion rim just outside the event horizon
    ctx.globalAlpha = a*(0.82 + 0.18*Math.sin((ts||0)/200));
    const ring = ctx.createRadialGradient(0,0,coreR*0.85,0,0,coreR*1.55);
    ring.addColorStop(0,"rgba(255,240,210,0)"); ring.addColorStop(0.45,"rgba(255,192,110,0.95)"); ring.addColorStop(1,"rgba(255,140,70,0)");
    ctx.fillStyle = ring; ctx.beginPath(); ctx.arc(0,0,coreR*1.55,0,Math.PI*2); ctx.fill();
    // event horizon — pure black core
    ctx.globalAlpha = a;
    const core = ctx.createRadialGradient(0,0,0,0,0,coreR);
    core.addColorStop(0,"#000000"); core.addColorStop(0.72,"#000000"); core.addColorStop(1,"#0b0714");
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0,0,coreR,0,Math.PI*2); ctx.fill();
    // thin bright photon ring hugging the horizon
    ctx.globalAlpha = a*0.9; ctx.lineWidth = Math.max(1, s*0.03);
    ctx.strokeStyle = "rgba(255,224,176,0.9)"; ctx.beginPath(); ctx.arc(0,0,coreR,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  // a coloured key-door: two slim riveted panels (styled like the wall tiles) side by side
  function drawKeyDoor(c, r, color) {
    const x = cx(c), y = cy(r), s = cell, gap = s*0.03;
    const pw = (s - gap) / 2 - 2;                    // width of each slim panel (2px inset)
    for (let i = 0; i < 2; i++) {
      const px = x + 2 + i * (pw + gap);
      const g = ctx.createLinearGradient(px, y, px, y + s);
      g.addColorStop(0, shade(color, 34)); g.addColorStop(0.5, color); g.addColorStop(1, shade(color, -48));
      rrect(px, y + 2, pw, s - 4, tileR(s)); ctx.fillStyle = g; ctx.fill();
      // corner rivets, like the wall tiles
      const ox = Math.max(3, pw * 0.24), oy = s * 0.16, br = Math.max(2, s * 0.032);
      ctx.fillStyle = "rgba(0,0,0,0.30)";
      for (const [bx, by] of [[ox, oy], [pw - ox, oy], [ox, s - oy], [pw - ox, s - oy]]) {
        ctx.beginPath(); ctx.arc(px + bx, y + by, br, 0, Math.PI*2); ctx.fill();
      }

  }
  function drawGateCell(c, r, ts) {
    const x = cx(c), y = cy(r), s = cell, pulse = 0.5+0.5*Math.sin(ts/240);
    pixelRect(x+3, y+3, s-6, s-6, "#6b6f2e", getVar("--shadow"));
    ctx.save(); ctx.globalAlpha = 0.4+0.3*pulse; ctx.fillStyle = pal("gate");
    ctx.fillRect(x+s*0.15, y+s*0.45, s*0.7, s*0.1); ctx.globalAlpha=1; ctx.restore();
  }
  function drawSwitch(c, r, used, ts) {
    const x = cx(c)+cell*0.5, y = cy(r)+cell*0.5, s = cell, pulse = 0.5+0.5*Math.sin(ts/200);
    ctx.save();
    ctx.fillStyle = used ? pal("swOff") : pal("sw"); ctx.globalAlpha = used ? 0.7 : 0.6+0.4*pulse;
    ctx.beginPath(); ctx.arc(x, y, s*0.18, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = getVar("--shadow");
    ctx.fillRect(x - s*0.02, y - (used? -s*0.02 : s*0.12), s*0.04, s*0.16);    // lever flips when used
    ctx.restore();
  }
  // The blade. Bigger than it was, with a lot of small teeth instead of a few big ones, a
  // plain disc inside the tooth ring, and a collared hole at the centre — so it reads as a
  // piece of machinery rather than a spiky blob. Only the teeth and the plate spin; the
  // collar and hole are concentric, so rotating them would cost work and change nothing.
  const SAW = {
    r:      0.44,   // blade radius, fraction of a cell
    teeth:  38,     // how many
    toothD: 0.10,   // how deep each one bites, fraction of the blade radius
    plate:  0.80,   // the disc inside the teeth
    collar: 0.34,   // the ring around the hole
    hole:   0.19,   // the hole itself — clipped out, so it is a genuine hole
    spinMs: 160,    // ms per radian
    grain:  0.60,   // paper texture over the blade, like every other surface
  };
  function drawSaw(x, y, ts) {
    const R = cell*SAW.r, rot = ts/SAW.spinMs;
    ctx.save();
    // A real hole, not a light disc: everything the blade draws is clipped to a ring, so
    // the centre is never painted at all and whatever is behind it shows through. Two arcs,
    // the inner one reversed, and an even-odd clip — the middle is simply outside the clip.
    ctx.beginPath();
    ctx.arc(x, y, R*1.02, 0, Math.PI*2);
    ctx.arc(x, y, R*SAW.hole, 0, Math.PI*2, true);
    ctx.clip("evenodd");

    ctx.save();
    ctx.translate(x, y);
    ctx.save(); ctx.rotate(rot);
    ctx.fillStyle = "#c9ced6";                             // the toothed rim
    ctx.beginPath();
    const N = SAW.teeth*2, inner = R*(1 - SAW.toothD);
    for (let k = 0; k < N; k++) {
      const a = k/N*Math.PI*2, rr = k%2 ? R : inner;
      const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#b6bcc7";                             // the disc just inside them
    ctx.beginPath(); ctx.arc(0, 0, R*SAW.plate, 0, Math.PI*2); ctx.fill();
    ctx.restore();                                         // the collar is concentric — no spin needed
    ctx.fillStyle = "#9099a6";                             // the ring around the hole
    ctx.beginPath(); ctx.arc(0, 0, R*SAW.collar, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Grain in WORLD space, not the blade's: the paper is the surface everything in this
    // game is printed on, and it does not spin just because the saw does. Still inside the
    // ring clip, so it stops at the hole like everything else.
    grainFill(x - R, y - R, R*2, R*2, SAW.grain);
    ctx.restore();
  }

  function drawLock(x, y, ts) {
    const s = cell*0.46, pulse = 0.6 + 0.4*Math.sin(ts/260);
    ctx.save();
    ctx.globalAlpha = 0.4 + 0.35*pulse;
    ctx.strokeStyle = getVar("--accent"); ctx.lineWidth = Math.max(3, cell*0.05);
    ctx.beginPath(); ctx.arc(x, y - s*0.06, s*0.17, Math.PI, 0); ctx.stroke();        // shackle (smaller arc)
    ctx.globalAlpha = 1;
    rrect(x - s*0.3, y - s*0.02, s*0.6, s*0.42, s*0.08);
    ctx.fillStyle = getVar("--shadow"); ctx.fill();
    rrect(x - s*0.26, y + s*0.01, s*0.52, s*0.36, s*0.06);
    ctx.fillStyle = "#d9d3ff"; ctx.fill();
    ctx.fillStyle = getVar("--shadow");

    ctx.fillRect(x - s*0.03, y + s*0.16, s*0.06, s*0.13);
    ctx.restore();
  }

  // a padlock marker on a colored door; open=true shows an unlocked shackle but stays until reached
  function drawDoorLock(c, r, ts, color, open) {
    const x = cx(c)+cell*0.5, y = cy(r)+cell*0.5, s = cell*0.5, pulse = 0.6 + 0.4*Math.sin(ts/260);
    ctx.save();
    // striped, colour-matched barrier filling the tile while still locked; clears once the key is collected
    if (!open) {
      const tx = cx(c), ty = cy(r);
      ctx.save();
      rrect(tx + cell*0.05, ty + cell*0.05, cell*0.90, cell*0.90, tileR(cell*0.90)); ctx.clip();
      ctx.globalAlpha = 0.18; ctx.fillStyle = color; ctx.fillRect(tx, ty, cell, cell);            // soft wash of the hue
      ctx.globalAlpha = 0.5;  ctx.strokeStyle = color; ctx.lineWidth = cell*0.16; ctx.lineCap = "butt";
      const step = cell*0.34, drift = (ts/45) % step;                                             // slow barber-pole drift
      ctx.beginPath();
      for (let o = -cell + drift; o < cell*2; o += step) { ctx.moveTo(tx + o, ty); ctx.lineTo(tx + o + cell, ty + cell); }
      ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(3, cell*0.06); ctx.lineCap = "round";
    ctx.globalAlpha = open ? 0.85 : 0.55 + 0.35*pulse;
    ctx.beginPath();
    if (open) ctx.arc(x + s*0.24, y - s*0.10, s*0.15, Math.PI, 0);   // same shackle arc, just slid aside = unlocked
    else      ctx.arc(x,          y - s*0.10, s*0.15, Math.PI, 0);    // shackle closed
    ctx.stroke();
    ctx.globalAlpha = 1;
    rrect(x - s*0.26, y - s*0.02, s*0.52, s*0.38, s*0.07); ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath(); ctx.arc(x, y + s*0.14, s*0.065, 0, Math.PI*2); ctx.fill();      // keyhole
    ctx.fillRect(x - s*0.028, y + s*0.14, s*0.056, s*0.12);
    ctx.restore();
  }

  // edge arrow pointing to an off-screen target (drawn in screen space)
  function drawOffscreenArrow(wx, wy, color, kind) {
    const sx = wx - camX, sy = wy - camY;
    if (sx >= 0 && sx <= viewW && sy >= 0 && sy <= viewH) return;   // on-screen
    const cxs = viewW/2, cys = viewH/2, pad = 34;
    let dx = sx - cxs, dy = sy - cys; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const hw = viewW/2 - pad, hh = viewH/2 - pad;
    const scale = Math.min(hw/Math.max(Math.abs(dx),1e-6), hh/Math.max(Math.abs(dy),1e-6));
    const ax = cxs + dx*scale, ay = cys + dy*scale;
    const sz = (cell || 90) * 0.115;
    // the arrowhead, rotated to point at the target
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = color;                             // colour matches the object
    ctx.beginPath(); ctx.moveTo(sz, 0); ctx.lineTo(-sz*0.7, -sz*0.8); ctx.lineTo(-sz*0.35, 0); ctx.lineTo(-sz*0.7, sz*0.8); ctx.closePath();
    ctx.fill();
    ctx.restore();
    // a small unrotated icon badge just inside the arrow, telling you WHAT it points to
    if (kind) {
      const br = sz * 1.35;
      const bx = ax - dx * (sz + br + 3), by = ay - dy * (sz + br + 3);
      ctx.save();
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2);
      ctx.fillStyle = "rgba(10,8,22,0.82)"; ctx.fill();
      ctx.lineWidth = Math.max(1.5, br*0.14); ctx.strokeStyle = color; ctx.stroke();
      if (kind === "flag") drawMiniFlag(bx, by, br*0.82, color);
      else if (kind === "key") drawMiniKey(bx, by, br*0.82, color);
      ctx.restore();
    }
  }
  // tiny flag glyph centred in a badge of radius ~r
  function drawMiniFlag(x, y, r, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, r*0.16); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x - r*0.28, y - r*0.62); ctx.lineTo(x - r*0.28, y + r*0.62); ctx.stroke();  // pole
    ctx.fillStyle = color;                                                                                   // pennant
    ctx.beginPath(); ctx.moveTo(x - r*0.28, y - r*0.62);
    ctx.lineTo(x + r*0.55, y - r*0.32); ctx.lineTo(x - r*0.28, y - r*0.02); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // tiny key glyph centred in a badge of radius ~r

    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x - r*0.42, y, r*0.34, 0, Math.PI*2);          // bow ring...
    ctx.arc(x - r*0.42, y, r*0.15, 0, Math.PI*2, true);    // ...with a hole

    ctx.beginPath(); ctx.moveTo(x + r*0.6, y); ctx.lineTo(x + r*0.6, y + r*0.34); ctx.stroke(); // tooth

    ctx.restore();

  // one tile's platform piece, clipped to its own cell. The top surface is the
  // tile's surface polyline (a straight line, or a quarter-circle arc for
  // corners); the body hangs off the down-normal side.
  function drawPlatformTile(n, prev, next) {
    drawPlatformSurface(n, tileSurface(n, prev, next), curTrack());
  }

  // draw a platform body + rail from a surface polyline S, clipped to the cell.
  // The body is solid from the running surface all the way to the tile edge.
  function hexA(hex, a) {   // "#ffcf4d" -> "rgba(255,207,77,a)"
    const n = parseInt(hex.replace("#",""), 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }
  // build the body polygon (surface S, extended past the far tile edge) as the current path
  // The slab hanging under the running surface, as a SIMPLE polygon: the surface itself, then
  // closed along the cell's own edges and corners.
  //
  // It used to be built by pushing every surface point 1.7 cells down its own normal. On a
  // straight that is a clean parallel offset, but on a CORNER the normals converge on the
  // arc's centre, and an offset that long shoots straight through it and out the far side —
  // so the "underside" arrived reversed and the polygon crossed itself. Nonzero winding then
  // cancelled parts of the overlap, which is what ate the thin slivers along the edges of
  // corner tiles. Nothing here offsets any more, so there is nothing to overshoot.
  function bodyPath(S, C) {
    const h = cell/2, last = S.length - 1, mid = last >> 1;
    // which side the body hangs on, from the tangent at the middle of the surface
    const a = S[Math.max(0, mid-1)], b = S[Math.min(last, mid+1)];
    let tx = b.x - a.x, ty = b.y - a.y; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const bx = -ty, by = tx;                             // same convention as the old -normal
    ctx.moveTo(S[0].x, S[0].y);                          // adds a subpath (caller does beginPath/fill)
    for (let k = 1; k <= last; k++) ctx.lineTo(S[k].x, S[k].y);
    if (last === 2) {                                    // straight: a slab half a cell deep
      ctx.lineTo(S[last].x + bx*h, S[last].y + by*h);
      ctx.lineTo(S[0].x    + bx*h, S[0].y    + by*h);
    } else {
      // corner: the arc's centre is the cell corner it bends around
      const O = { x: S[0].x + S[last].x - C.x, y: S[0].y + S[last].y - C.y };
      const M = S[mid];
      if ((O.x - M.x)*bx + (O.y - M.y)*by > 0) {         // body on the inside — hug that corner
        ctx.lineTo(O.x, O.y);
      } else {                                           // body on the outside — wrap the other three
        const cs = [{x:C.x-h,y:C.y-h},{x:C.x+h,y:C.y-h},{x:C.x+h,y:C.y+h},{x:C.x-h,y:C.y+h}];
        let k0 = 0, best = Infinity;
        for (let i = 0; i < 4; i++) { const d = Math.hypot(cs[i].x-O.x, cs[i].y-O.y); if (d < best) { best = d; k0 = i; } }
        const n1 = (k0+1)%4, n3 = (k0+3)%4;
        const first = Math.hypot(cs[n1].x-S[last].x, cs[n1].y-S[last].y)
                    < Math.hypot(cs[n3].x-S[last].x, cs[n3].y-S[last].y) ? n1 : n3;
        ctx.lineTo(cs[first].x, cs[first].y);
        ctx.lineTo(cs[(k0+2)%4].x, cs[(k0+2)%4].y);
        ctx.lineTo(cs[first === n1 ? n3 : n1].x, cs[first === n1 ? n3 : n1].y);
      }
    }
    ctx.closePath();
  }
  // The slab under the rail is drawn as two layers rather than one flat colour, which is
  // what gives the track a cross-section: a BEAM in the track's own colour hugging the
  // running surface, and the GROUND beneath it in a darker shade of the same hue.
  //
  // The beam is a fat stroke laid along the surface line and clipped to the body, so only
  // its lower half survives — that keeps it hugging every curve of a corner for free,
  // rather than needing a second offset polyline that could drift from the rail.
  // The track is painted; the ground it is bolted to is not. It takes its own colour —
  // the level's hue turned and drained, so it still belongs to the palette without being a
  // darker copy of the beam — and its own marking: flat bedding lines, which read as cut
  // earth rather than as more track. The paper grain then goes over both, as before.
  function groundColour(fill) { return tintHex(fill, TILE.underHue, TILE.underSat, TILE.underShade); }
  // ---- ground patterns ---------------------------------------------------------------
  // What a track skin lays under the beam instead of the stock bedding lines. Each is handed
  // the cell's box and its grid position, and is already clipped to the platform body.
  //
  // The rule that matters: everything must be keyed off WORLD coordinates or off values that
  // repeat exactly per cell. Anything keyed off the screen slides as the camera moves, and
  // anything that repeats per cell but shouldn't (a brick course, a diagonal band) shows a
  // seam at every tile join. Both mistakes look fine in a screenshot and awful in motion.
  const GROUND_PATTERNS = {
    // Broad diagonal bands. The band index comes from x+y in world space, so a band runs
    // straight on across a join rather than restarting inside each cell.
    stripe(g, x, y, s) {
      const p = s*0.62;                                  // one band plus one gap
      g.save(); g.globalAlpha = 0.20; g.fillStyle = "#05040d";
      for (let i = Math.floor((x + y)/p) - 1; i <= Math.ceil((x + y + 2*s)/p); i++) {
        const d = i*p, w = p*0.5;
        g.beginPath();                                   // the strip between x+y=d and x+y=d+w
        g.moveTo(d - y, y);         g.lineTo(d + w - y, y);
        g.lineTo(d + w - (y+s), y+s); g.lineTo(d - (y+s), y+s);
        g.closePath(); g.fill();
      }
      g.restore();
    },
    // Staggered courses. Two stones to a cell across and three down, so the joints line up
    // column to column; the half-stone stagger is driven by the world row, so it alternates
    // course by course all the way down a level instead of resetting at every cell.
    cobble(g, x, y, s, c, r) {
      const rows = 3, bw = s/2, bh = s/rows;
      g.save();
      g.lineWidth = Math.max(1, s*0.016); g.lineCap = "butt";
      g.strokeStyle = "rgba(5,4,13,0.34)";
      g.beginPath();
      for (let k = 0; k <= rows; k++) { const yy = y + k*bh; g.moveTo(x, yy); g.lineTo(x + s, yy); }
      for (let k = 0; k < rows; k++) {
        const yy = y + k*bh, stag = (((r*rows + k) % 2) ? bw/2 : 0);
        for (let j = -1; j <= 2; j++) {
          const xx = x + stag + j*bw;
          if (xx > x - 0.01 && xx < x + s + 0.01) { g.moveTo(xx, yy); g.lineTo(xx, yy + bh); }
        }
      }
      g.stroke();
      g.strokeStyle = "rgba(255,255,255,0.10)";          // a lit top edge, so they read as blocks
      g.beginPath();
      for (let k = 0; k < rows; k++) { const yy = y + k*bh + g.lineWidth; g.moveTo(x, yy); g.lineTo(x + s, yy); }
      g.stroke();
      g.restore();
    },
    // Long grain with the odd knot. The waviness is a function of world x, so the grain of
    // one plank carries on into the next tile along.
    grain(g, x, y, s, c, r) {
      const n = 7;
      g.save(); g.lineWidth = Math.max(1, s*0.013); g.lineCap = "round";
      for (let k = 0; k < n; k++) {
        const yy = y + (k + 0.5)*s/n;
        g.strokeStyle = (k % 3 === 0) ? "rgba(5,4,13,0.26)" : "rgba(5,4,13,0.13)";
        g.beginPath();
        for (let j = 0; j <= 6; j++) {

      ctx.save();

      // swagger's lean and its hover before drawing it. Leaning back tipped the ellipse up
      // on its edge, which read as him dragging a plank rather than casting a shadow.
      if (w.lean) ctx.rotate(-w.lean);
