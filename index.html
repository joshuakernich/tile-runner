      // routes and nothing else.
      // ...and the rail is drawn ON TOP of the finished stack, so it stays fully opaque the whole
      // way out to each edge. It is the one part of this tile that is a promise rather than a
      // sketch — it says where you MAY go, and a promise should not be drawn in a whisper.
      ctx.save();
      rrect(X, Y, cell, cell, tileR(cell)); ctx.clip();
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.strokeStyle = RAIL_COL; ctx.lineWidth = RAIL_PX;
      ctx.beginPath(); for (const S of surfaces) railPath(S); if (SHOW_RAIL) ctx.stroke();
      ctx.restore();
      ctx.restore();
    } finally { ctx = main; }
    ctx.drawImage(jScratch, DX/dpr, DY/dpr, px/dpr, px/dpr);
  }

  // A marker in each cell you can actually build into: a square ring — a half-tile square with
  // everything but its border punched out, so the band is an eighth of a tile thick and lies
  // INSIDE the square, which keeps the hint the same size whatever the band does. The arrows it
  // replaces pointed FROM the junction, which put them in the gutter between two cells and made
  // you read a direction; a ring drawn on the cell itself just says "here" — and leaving the
  // middle open means whatever is already in that cell still reads through it.
  //
  // Drawn as its own pass, ON TOP of the pickups, rather than as the tail of the junction tile.
  // It is a thing you AIM AT — a tap on it fetches a tile — and it was going down under the
  // coins, so the one square the game was asking you to hit could be the one square with a
  // great gold tile floating over it.
  function drawJunctionMarks(ts) {
    if (JUNCTION.mark <= 0) return;
    const lead = leadNode();
    if (!lead) return;
    markGrow += ((state.drag ? 1 : 0) - markGrow) * 0.22;
    // With nothing in hand the hints are still worth showing — they are where the track can go,
    // which is the thing you are working out while you wait for a tile to free up — but they are
    // no longer an invitation to tap, so they drop to a whisper.
    //
    // Up QUICKLY, down slowly. A tile coming free is news — the moment it does, the squares you
    // can send it to should be there — but arriving in three frames rather than in one is what
    // makes them read as OPENING rather than as appearing out of nothing, and it is the opening
    // that says a tile just came back to you. Spending one is not news in the same way; it is
    // something you just did, so the way back down is allowed to take its time rather than
    // snapping shut under the tap that caused it.
    const live = (oldestFreeTile() || state.flyTile) ? 1 : 0;
    markLive += (live - markLive) * (live > markLive ? 0.42 : 0.14);
    const C = nodeCenter(lead.n);
    const a = MARK_EMPTY + (JUNCTION.mark - MARK_EMPTY)*markLive;
    ctx.fillStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
    for (const e of junctionExits(lead.n, lead.prev)) {
      const mx = C.x + e.d.x*cell, my = C.y + e.d.y*cell;
      // The SQUARE shrinks as the pool empties — half a tile with something to send, a quarter
      // with nothing — while the band stays an eighth of a tile throughout. At a quarter the two
      // outlines meet and there is no middle left, so the hint closes up into a small solid mark
      // rather than filling in at full size. A ring is a target; this is a note of where the
      // track can go, which is all it can honestly be while you have nothing to put there.
      const os = cell*(0.125 + 0.125*markLive + 0.25*markGrow);
      const hs = Math.max(0, os - cell/8);
      if (os <= 0) continue;
      ctx.beginPath();
      ctx.rect(mx - os, my - os, os*2, os*2);                        // the half-tile square...
      if (hs > 0) ctx.rect(mx - hs, my - hs, hs*2, hs*2);            // ...less its middle, if it has one
      ctx.fill("evenodd");
    }
  }

  // permanent start/goal gate: glass cell, a straight platform along `dir`,
  // and a little door at the closed end. `dir` is the travel direction the
  // tile operates in (start: toward the first tile; goal: into the goal).
  function drawGate(node, dir, isGoal, ts) {
    const C = nodeCenter(node), h = cell/2;
    drawGlass(cx(node.c), cy(node.r), cell);
    // straight surface spanning the cell along dir
    const Me = { x:C.x - dir.x*h, y:C.y - dir.y*h };   // open end (track connects here)
    const Mx = { x:C.x + dir.x*h, y:C.y + dir.y*h };   // closed end (door)
    drawPlatformSurface(node, [Me, { x:C.x, y:C.y }, Mx], isGoal ? getVar("--goal") : curTrack());
    // door: goal -> at the far end it runs into; start -> at the back it emerges from
    const end = isGoal ? Mx : Me, sgn = isGoal ? -1 : 1;
    const doorPos = { x:end.x + dir.x*(cell*0.2)*sgn, y:end.y + dir.y*(cell*0.2)*sgn };
    drawDoor(node, doorPos, dir, isGoal, ts);
  }

  function drawDoor(node, pos, dir, isGoal, ts) {
    const s = cell, up = { x:dir.y, y:-dir.x };          // surface normal
    const w = s*0.34, hgt = s*0.46;
    ctx.save();
    ctx.beginPath(); ctx.rect(cx(node.c), cy(node.r), cell, cell); ctx.clip();
    ctx.translate(pos.x, pos.y); ctx.rotate(Math.atan2(dir.y, dir.x));
    // local frame: +x = travel (out of door), local up (0,-1) = surface normal
    const frame = isGoal ? getVar("--goal") : getVar("--runner");
    // frame — no outline
    ctx.fillStyle = frame; ctx.fillRect(-w/2, -hgt, w, hgt);
    // dark opening
    ctx.fillStyle = getVar("--shadow"); ctx.fillRect(-w/2+4, -hgt+4, w-8, hgt-4);
    // opening inner glow / depth
    ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fillRect(-w/2+4, -hgt+4, w-8, 4);
    // knob
    ctx.fillStyle = frame; ctx.beginPath(); ctx.arc(w*0.22, -hgt*0.5, s*0.03, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function strokePoly(pts, w, color) {
    ctx.strokeStyle = color; ctx.lineWidth = w;
    strokePathOnly(pts); ctx.stroke();
  }
  function strokePathOnly(pts) {
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  }

  // ---------- Runner animation ------------------------------------------
  // Every number the runner's look and motion depends on, in one place. All the
  // lengths are fractions of the cell size, so the little chap scales with the board.
  // `runner-lab.html` edits exactly this block and prints it back out — keep the two
  // in step, and paste whole rather than hand-patching individual values.
  // Every face in the game wears the same eyes — the runner, all six monsters and the walls.
  // Sizes are fractions of a CELL, not of the body they sit on, which is the whole point: a
  // wall is four times the size of the runner's head and the eyes still have to match. Tune
  // in eye-lab.html and paste the block back; tools/check.mjs diffs the two.
  const EYES = {
    r:        0.038,   // radius
    gap:      0.115,   // centre to centre
    bias:     0.020,   // how far the pair sits toward the way the face is looking
    lid:      0.60,    // shut-lid stroke width, as a fraction of the radius
    glanceX:  0.030,   // how far the pupils dart sideways
    glanceY:  0.024,   // ...and up
    glanceMs: 5200,    // one full look-around
    blinkMs:  3000,    // one blink cycle (it is a double-blink)
  };
  // Draws one pair, wherever a face wants them. `face` is +1/-1 for which way it looks, `t`
  // is the clock, `off` staggers the blink so a row of walls never shutters as one. `nx`/`ny`
  // nudge the PUPILS (not the sockets) toward something the face is watching — it has to happen
  // in here, on top of the glance, or the caller ends up painting a second pair beside this one.
  // The same two eyes, struck out. Same places, same size, same ink — a cross where the dot
  // was — so it reads as the same face with something having happened to it.
  function drawDeadEyes(g, cx0, cy0, s, col) {
    // Small, and pushed over to one side of the face — the same way the living eyes carry a
    // bias toward the direction of travel, only further, because a face with both eyes off
    // centre reads as a face that has stopped deciding where to look.
    // Small, but the stroke has to come down with the size or the two arms meet in the middle
    // and the cross fills in — at 0.80 of the eye's radius on arms half that long it was a blob.
    const R = s*EYES.r*0.50, gap = s*EYES.gap*0.86, bias = s*EYES.bias*2.2;
    g.save();
    g.globalAlpha = 1;                       // full strength whatever is drawing them
    g.strokeStyle = col; g.lineWidth = Math.max(1, s*EYES.r*0.54); g.lineCap = "round";
    for (const x of [cx0 + bias - gap/2, cx0 + bias + gap/2]) {
      g.beginPath();
      g.moveTo(x - R, cy0 - R); g.lineTo(x + R, cy0 + R);
      g.moveTo(x + R, cy0 - R); g.lineTo(x - R, cy0 + R);
      g.stroke();
    }
    g.restore();
  }
  function drawEyes(g, cx0, cy0, s, col, face, t, off, nx, ny) {
    const R = s*EYES.r, gap = s*EYES.gap, bias = s*EYES.bias*(face || 0);
    const G = EYES.glanceMs, gt = (t + (off||0)) % G;
    let gx = 0, gy = 0;
    if (gt < G*0.125)                      gx = -s*EYES.glanceX;
    else if (gt < G*0.25)                  gx =  s*EYES.glanceX;
    else if (gt > G*0.654 && gt < G*0.779) gy = -s*EYES.glanceY;
    const bt = (t + (off||0)) % EYES.blinkMs;
    const shut = bt < EYES.blinkMs*0.04 || (bt > EYES.blinkMs*0.058 && bt < EYES.blinkMs*0.085);
    const x1 = cx0 + bias - gap/2, x2 = cx0 + bias + gap/2;
    if (shut) {
      g.strokeStyle = col; g.lineWidth = Math.max(1, R*EYES.lid); g.lineCap = "round";
      g.beginPath();
      g.moveTo(x1 - R, cy0 + gy); g.lineTo(x1 + R, cy0 + gy);
      g.moveTo(x2 - R, cy0 + gy); g.lineTo(x2 + R, cy0 + gy);
      g.stroke();
    } else {
      g.fillStyle = col;
      const px = gx + (nx || 0), py = gy + (ny || 0);
      g.beginPath(); g.arc(x1 + px, cy0 + py, R, 0, Math.PI*2); g.fill();
      g.beginPath(); g.arc(x2 + px, cy0 + py, R, 0, Math.PI*2); g.fill();
    }
  }
  const RUNNER = {
    stepMs:   110,     // ms per radian of stride phase — lower = faster legs. On the board the
                       // phase comes off the TRACK (STRIDES_PER_TILE) rather than the clock, so
                       // this drives the title, the shop and the cinematic, and sets the gearing
                       // between a swagger's spin rate and that phase.
    swing:    0.16,    // how far a foot reaches, fraction of a cell
    bob:      0.064,   // body rise and fall per stride
    legLen:   0.12,    // hip height above the track
    legWidth: 0.05,    // stroke width of a leg
    legSplay: 0.22,    // hip separation, fraction of body width
    hipRise:  0.06,    // hips move UP inside the body, fraction of body height (0 = bottom edge, 1 = top)
    footLift: 0.098,   // peak height of the swinging foot, fraction of a cell; 0 = feet pinned to the track
    footLiftPow:1,     // shape of that lift: 1 = broad cosine hump, higher = a later, snappier kick
    knees:    1,       // 1 bends each leg at a knee (two-bone IK), 0 is a straight hip-to-foot line
    kneeBend: 0.045,   // how bent, as slack relative to hip-foot distance; 0 = straight
    kneeSplit:0.5,     // how much of that is thigh
    kneeLead: -0.002,  // extra forward push on the knee, 0 = pure IK
    kneeR:    0,       // knee cap radius, 0 = none
    bodyW:    0.26,
    bodyH:    0.26,
    bodyR:    0,    // corner radius of the body
    shadow:   0.090,   // ground shadow: vertical RADIUS, so drawn height is twice this. Wide
                       // and soft rather than tight and hard — it is a radial falloff, so the
    shadowW:  1.12,    // rim is transparent and only the middle carries the full opacity below
    shadowA:  0.30,    // ground shadow opacity — held flat out to half the radius, then faded
    shadowY:  0.00,    // shadow offset below that edge, fraction of a cell — 0 = centred
    shadowBob:0.48,    // how much the shadow shrinks as he rises — 0 keeps it fixed, 1 in proportion to the bob
    eyeR:     0.034,
    eyeY:     0.38,    // down the body from its top, fraction of body height
    eyeAx:    -0.02,   // rear eye, fraction of body width from centre
    eyeBx:    0.28,    // front eye
    glanceMs: 5200,    // one full look-around cycle
    glanceX:  0.03,    // how far the pupils dart
    glanceY:  0.024,
    blinkMs:  3000,    // one blink cycle (it's a double-blink)
    talCordY: 0.77,    // talisman cord, fraction of body height from its top
    talHangY: 1.01,    // where the pendant hangs
    talR:     0.052,   // pendant radius, fraction of a cell
    talX:     0.165,   // pendant offset from centre, fraction of body width (- = back, + = forward)
    talCordW: 0.02,    // cord thickness, fraction of a cell
    talCordA: 0.75,    // cord opacity
    talSpan:  0.485,   // where the cord meets the body's sides, fraction of body width
    talSag:   -0.003,  // cord droop past the pendant, fraction of a cell (- pulls it taut)
    body:  "#bfe6ff",
    ink:   "#17263f",
  };

  // Two-bone IK for the knee. The bones are sized RELATIVE to the current hip-to-foot
  // distance (total = d * (1 + bend)) rather than being fixed: over one stride that distance
  // nearly doubles, so fixed bones give an almost-straight leg at full reach and a knee folded
  // under the body at mid-step. Scaling with d holds the bend even the whole way round.
  // `a` is how far along the hip->foot line the knee projects, `h` how far it stands off it —
  // both out of the law of cosines. The offset is rotated to +x so the knee always leads.
  function solveKnee(hx, hy, fx, fy, bend, split, lead) {
    const dx = fx-hx, dy = fy-hy;
    const d = Math.hypot(dx, dy) || 1e-4;
    const total = d * (1 + Math.max(0, bend));
    const thigh = total*split, shin = total - total*split;
    const a = (thigh*thigh - shin*shin + d*d) / (2*d);
    const h = Math.sqrt(Math.max(0, thigh*thigh - a*a));
    const ux = dx/d, uy = dy/d, px = uy, py = -ux;
    return { x: hx + ux*a + px*(h+lead), y: hy + uy*a + py*(h+lead) };
  }

  function drawRunner(ts) {
    let sx, sy, angle, moving;
    let phaseOver = null;
    // "lose" as well as "falling": the words come up over the heap he is lying in, so he has to
    // go on being drawn where he landed rather than being teleported back onto a track that is
    // no longer under him.
    if (state.fall && (state.status === "falling" || state.status === "lose")) {
      const f = state.fall;
      sx = f.x; sy = f.y; angle = f.angle; moving = false;
      // Buried head first, kicking. The stride is what draws a kick, so he is "moving" — on a
      // phase of his own that winds down to a stop rather than on the level's, which stopped
      // with him.
      if (f.land != null && f.wrig != null) {
        moving = f.land < WRIGGLE_MS; phaseOver = f.wrig/95;   // slow, small strokes
        _scurry = moving ? 1 : 0;
        _deadEyes = 1;                       // he has joined the heap; he gets the heap's face
      }
      resetLeap();                                   // he is not leaping, he is going down
    } else {
      const ri = runnerInfo(); sx = ri.sx; sy = ri.sy; angle = ri.angle;   // sets the leap flags
      moving = state.status === "play";      // the runner is always moving now
    }
    const s = cell;
    const phase = phaseOver != null ? phaseOver : state.runPhase;
    // What his shadow is allowed to land on: the bodies of the live tiles around him, plus the
    // whole cell of any loose pane he is over — a cleared tile is still something rendered, and
    // without it the shadow would blink off for the half of every tile he spends on one.
    runnerShadowClip = () => {
      const p = state.path;
      for (let i = Math.max(0, state.runIdx - 1); i <= Math.min(p.length - 1, state.runIdx + 1); i++) {
        const n = p[i];
        if (n.kind === "platform") { ctx.rect(cx(n.c), cy(n.r), cell, cell); continue; }
        if (n.exited) continue;                       // its track is gone; its pane is caught below
        bodyPath(tileSurface(n, p[i-1], p[i+1]), nodeCenter(n));
      }
      for (const t of state.tiles) {
        if (t.status !== "free" && t.status !== "parked") continue;
        if (Math.abs(t.c - state.path[Math.min(state.runIdx, state.path.length-1)].c) > 1 ||
            Math.abs(t.r - state.path[Math.min(state.runIdx, state.path.length-1)].r) > 1) continue;
        ctx.rect(cx(t.c), cy(t.r), cell, cell);
      }
    };

    // The Star draws nothing here any more. It had a pulsing disc AND a ring of orbiting
    // sparks stacked on top of a runner who already turns solid gold and sheds a trail of it —
    // four ways of saying "nothing can touch me", three of them in the way of watching him run.
    // aura while a timed boost/slow effect is active
    if (state.speedFx && state.speedFx.t > 0) {
      const col = state.speedFx.kind === "boost" ? pal("boost") : pal("slow");
      const puls = 0.5 + 0.5*Math.sin(ts/120);
      ctx.save();
      ctx.globalAlpha = 0.22 + 0.16*puls; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(sx, sy - s*0.2, s*0.42, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // Mid-shout he is not running. He STANDS — upright on his own platform, keeping whatever
    // tilt the track under him has, and throws back from there. Straightening him against the
    // WORLD instead would tip him off a sloped tile, which reads as him losing his footing at
    // the exact moment he is supposed to look immovable. Legs still, because a stride under a
    // roar reads as him being blown over rather than doing the blowing.
    const rk = roarK();
    if (rk > 0) {
      angle -= ROAR_LEAN * rk;
      moving = false;
    }
    // ...and the Millstone, which is the opposite gesture: down rather than back. He settles
    // toward the track as he folds, so the fold looks like weight coming off his legs rather
    // than his legs vanishing under him.
    const sk = restK();
    if (sk > 0) {
      moving = false;
      _restFold = sk;                                  // paintRunner folds him, and sinks him
    }
    paintRunner(sx, sy, s, phase, angle, moving, ts, (state.status === "squash") ? squashK() : 0,
                state.status !== "falling");
    runnerShadowClip = null;      // every other caller — the lover, the shop, the opening — has no board
    _restFold = 0; _scurry = 0; _deadEyes = 0;
    resetLeap();
    drawRoarRing();
  }
  // A roll is read off the STRIDE PHASE, which is itself geared to the track — so the ball
  // turns once per so much track rather than once per so much time, and standing still stops
  // it dead because the phase stops too. `rate` is still radians per ms, as it always was:
  // multiplying by stepMs converts it back through the phase, so the numbers in SWAGGERS carry
  // over unchanged and the off-board runners (title, shop, cinematic), whose phase IS a clock,
  // spin at exactly the speed they used to.
  function rollAngle(phase, rate) {
    return (phase * RUNNER.stepMs * rate) % (Math.PI*2);
  }
  // The runner himself, at an arbitrary place and size — knees, foot lift, bob, talisman and
  // all. Split out of drawRunner so the title screen and the opening cinematic can draw the
  // real character instead of a lookalike, and so there is only ever one of him to retune.
  // `as` paints someone who is NOT the player: a skin and a hat given outright instead of read
  // off the wardrobe, and none of the player's powers applying. She is the same character in
  // every other respect — the same stride, the same shadow, the same everything — because
  // there is only one of him to tune and she should never drift away from it.
  // How far the runner is folded into the Millstone's sit, 0..1. A module flag rather than a
  // parameter because paintRunner is called from eight places — the board, the title, the
  // cinematic, the shop swatches — and seven of them have no idea what a Millstone is.
  let _restFold = 0;
  // Set while he is buried in the heap kicking his legs. It replaces the swagger for the one
  // frame it is up: whatever he runs like, being upside down in a pile of himself is a scurry —
  // short, fast strokes with the knees coming right up, which is what legs do when they are
  // trying to get somewhere and have nothing to push against.
  let _scurry = 0;
  // ...and whether the runner being drawn has crosses for eyes. The heap sets it through `as`;
  // the player's own runner sets it the moment he lands in the heap, because at that point he
  // is one of them.
  let _deadEyes = 0;
  const SCURRY = { swing: 0.10, lift: 0.75, bob: 0.04, hop: 0, lean: 0, hover: 0 };
  // ...and how far a leaping swagger has him off the track, 0..1. Same reasoning: paintRunner
  // is called from places that have no path to leap along.
  let _leapLift = 0, _leapPose = 0, _leapFoot = 1, _leapAir = 0;
  // Stroke the last `frac` of a limb, walking BACK from the foot along its bones — hip to
  // knee to foot, or hip straight to foot on a runner with no knees. The pen is whatever the
  // caller set, so this lays the kick's colour into the leg's own line rather than beside it.
  function strokeLimbTail(pts, frac) {
    const seg = []; let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = Math.hypot(pts[i+1][0] - pts[i][0], pts[i+1][1] - pts[i][1]);
      seg.push(d); total += d;
    }
    let want = total * Math.max(0, Math.min(1, frac));
    const out = [pts[pts.length - 1]];
    for (let i = seg.length - 1; i >= 0 && want > 0; i--) {
      if (want >= seg[i]) { out.push(pts[i]); want -= seg[i]; continue; }
      const t = seg[i] ? want / seg[i] : 0;                      // part way up this bone
      out.push([pts[i+1][0] + (pts[i][0] - pts[i+1][0])*t,
                pts[i+1][1] + (pts[i][1] - pts[i+1][1])*t]);
      want = 0;
    }
    if (out.length < 2) return;
    ctx.beginPath(); ctx.moveTo(out[0][0], out[0][1]);
    for (let i = 1; i < out.length; i++) ctx.lineTo(out[i][0], out[i][1]);
    ctx.stroke();
  }
  // Set for the duration of one paintRunner call, by the ONE caller that has a board to clip
  // against. A builder rather than a path, because it is invoked inside the runner's own save()
  // with the world transform put back — see the shadow block.
  let runnerShadowClip = null;
  function paintRunner(sx, sy, s, phase, angle, moving, ts, sq, grounded, as) {
    // SWAGGER rides on top of the stock stride rather than replacing it — every field is a
    // multiplier or an addition, so the numbers in RUNNER still drive all five styles.
    // Sitting down overrides whatever he was wearing: the lotus fold IS the sit, and a hover or
    // a hop underneath it would have him meditating in mid-air.
    const w = _restFold > 0.5 ? { pose: "lotus", swing: 0, lift: 0, bob: 0 }
            : _scurry > 0.5 ? SCURRY
            : as ? (as.swagger || {}) : lookItem("swagger");
    const mul = (v, d) => (v == null ? d : v);
    const swing = moving ? Math.sin(phase) * s*RUNNER.swing * mul(w.swing, 1) : 0;
    let   bob   = moving ? Math.abs(Math.sin(phase)) * s*RUNNER.bob * mul(w.bob, 1) : 0;
    if (w.hop && moving) bob += Math.max(0, Math.sin(phase)) * s*w.hop;   // one big bounce a stride
    // a hover sits him off the track and breathes, whether or not he is running
    const hover = (w.hover ? s*w.hover * (1 + 0.14*Math.sin(phase*0.256)) : 0)
                + (_leapLift ? s*(w.leapH || 0.22)*_leapLift : 0);
    // Sitting settles him toward the track. It goes on HERE rather than being added to sx/sy by
    // the caller, so that it lands in the runner's own rotated frame — down the tile's normal on
    // a corner, not down the screen — and so the shadow below can undo it the same way it undoes
    // the hover. Moving him from outside took his shadow with him, and it slid under the rail.
    const sink = s * REST_SINK * _restFold;
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(angle);
    if (hover) ctx.translate(0, -hover);
    if (sink)  ctx.translate(0, sink);
    if (w.lean) ctx.rotate(w.lean);                       // tilt about the feet
    // Wall squash: in the local frame +x is travel, so compressing x and bulging y is
    // exactly "flattened against the face". Scale about the feet (y=0) so he stays on
    // the track, and nudge him forward by what he lost so he stays flush with the wall.
    if (sq > 0) {
      const kx = 1 - (1 - SQUASH_X)*sq, ky = 1 + (SQUASH_Y - 1)*sq;
      ctx.translate(s*RUNNER.bodyW*0.5*(1 - kx), 0);
      ctx.scale(kx, ky);
    }
    // local frame: +x = travel, feet at y=0, body toward -y (surface "up")
    // A worn colour replaces RUNNER's two rather than editing the block the labs paste
    // between themselves — the tuning stays the tuning, the skin is just what's on today.
    const skin = as ? as.skin : lookItem("drip");
    // The Cloak of Light overrides the drip entirely — a finish is a paint job, and this is
    // supposed to read as him being made of the stuff for three seconds.
    const golden = !as && powerActive("star");
    const pale = golden ? "#ffdf78" : (skin.body || RUNNER.body);
    const inkCol = golden ? "#6b3f04" : (skin.ink || RUNNER.ink);
    // A leap folds the legs under him as he lands and stretches them out as he flies. Scaling
    // the leg is the whole of it: the feet are on the ground plane and the body hangs off the
    // hip, so a shorter leg drops him into a crouch with the knees taking up the difference,
    // and a longer one points him. Crouching further than it stretches, because a landing
    // absorbs and a jump only reaches.
    const legK = 1 + (_leapPose < 0 ? _leapPose*0.50 : _leapPose*0.18);
    const legL = s*RUNNER.legLen*legK, bodyH = s*RUNNER.bodyH, bodyW = s*RUNNER.bodyW;
    // soft ground shadow (not an outline). shadowBob ties it to the body's rise, so a
    // high bob can read as him actually leaving the ground rather than sliding along it.
    // Skipped entirely once he is falling — there is no ground left to cast it on, and a
    // shadow pinned under a plummeting character is the tell that it was never really there.
    if (grounded !== false) {
      // The leap counts as rising, the same as the bob does — a shadow that stays full size
      // under a runner three quarters of a tile in the air is the tell that he never left.
      const rise = (bob / Math.max(1e-6, s*RUNNER.bob || 1e-6)) + _leapLift;
      const shk = 1 - RUNNER.shadowBob * rise * 0.5;
      ctx.save();
      // Cut to the GROUND HE IS ACTUALLY OVER. A shadow is cast on something, and his was
      // falling on whatever happened to be under it — the void past the edge of a tile, and
      // the blank half of the junction where no route has been drawn. The clip is built in the
      // BOARD's frame, so it is undone here and put back after: `runnerShadowClip` is handed
      // the world transform to draw into and the runner's own frame is restored on top of it.
      const clip = runnerShadowClip;
      if (clip) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.translate(-Math.round(camX), -Math.round(camY));
        ctx.beginPath(); clip(); ctx.clip();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.translate(-Math.round(camX), -Math.round(camY));
        ctx.translate(sx, sy); ctx.rotate(angle);
        if (hover) ctx.translate(0, -hover);
        if (sink)  ctx.translate(0, sink);
        if (w.lean) ctx.rotate(w.lean);
      }
      // The shadow is cast ON THE TRACK, so it must not come along for the ride: undo the
      // swagger's lean and its hover before drawing it. Leaning back tipped the ellipse up
      // on its edge, which read as him dragging a plank rather than casting a shadow.
      if (w.lean) ctx.rotate(-w.lean);
      if (hover) ctx.translate(0, hover);
      if (sink)  ctx.translate(0, -sink);      // he sits down; the shadow he casts does not
      // A radial falloff, not a flat disc. Big and flat reads as a sticker cut to shape; big
      // and graded reads as light being blocked. Full opacity is HELD to half the radius and
      // all of the fade happens in the outer half, so it keeps a solid core and only its rim
      // is soft. The gradient is built as a CIRCLE and the circle is squashed back into the
      // ellipse, because a radial gradient is round by definition — there is no way to give
      // it two radii.
      const rx = bodyW*RUNNER.shadowW*shk, ry = s*RUNNER.shadow*shk;
      // Dead centre on the surface line. sy is the point on the visual path the runner stands
      // on — the platform's top edge — so y = 0 in this frame IS that edge, and the ellipse
      // straddles it half above, half below.
      ctx.translate(0, s*RUNNER.shadowY);
      if (rx > 0.01 && ry > 0.01) {
        ctx.scale(1, ry/rx);
        const gd = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        gd.addColorStop(0.00, "rgba(5,4,13," + RUNNER.shadowA + ")");
        gd.addColorStop(0.50, "rgba(5,4,13," + RUNNER.shadowA + ")");   // flat to the halfway mark
        gd.addColorStop(1.00, "rgba(5,4,13,0)");                        // then all of the falloff
        ctx.fillStyle = gd;
        ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    const byTop = -(legL + bodyH) - bob;
    // A rolling swagger tumbles the whole body about its own centre. It happens before the
    // legs because a curled-up runner rolls WITH his legs; the ground shadow is already down.
    if (w.spin) {
      const bcy = byTop + bodyH/2;
      ctx.translate(0, bcy); ctx.rotate(rollAngle(phase, w.spin)); ctx.translate(0, -bcy);
    }
    // A somersault is one whole turn spent entirely in the AIR: the angle is a function of how
    // far through the flight he is, not of the clock, so he leaves the ground upright, goes all
    // the way over, and arrives upright — every leap, at any pace. Positive turns him forward,
    // negative back. Zero on the ground, which is what keeps the landing honest.
    if (w.leapSpin && _leapAir > 0) {
      const bcy = byTop + bodyH/2;
      ctx.translate(0, bcy); ctx.rotate(Math.PI*2 * w.leapSpin * _leapAir); ctx.translate(0, -bcy);
    }
    // A finish (metal, gem, spectrum) paints the body with a gradient instead of a flat
    // colour. The legs take the SAME one: a gradient lives in user space at paint time, so
    // one object covers both and the leg is lit to match the body it hangs off rather than
    // being a flat stripe stuck to a polished ball.
    const finish = (!golden && skin.paint) ? skin.paint(ctx, -bodyW/2, byTop, bodyW, bodyH, ts) : pale;
    // A GLOW is the one part of a finish that is not clipped to him. `paint` and `sheen` both
    // live inside his silhouette, which is right for a colour and useless for light — light
    // leaves him and lands on the board around him. Drawn additively and BEFORE the legs and
    // the body, so everything he is made of still reads crisply on top of its own glare.
    if (!golden && skin.glow) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      skin.glow(ctx, 0, byTop + bodyH/2, s, ts);
      ctx.restore();
    }
    // legs — same colour as body, no outline
    ctx.strokeStyle = finish; ctx.lineWidth = Math.max(3, s*RUNNER.legWidth); ctx.lineCap = "round"; ctx.lineJoin = "round";
    const hipY = -legL - bob - bodyH*(RUNNER.hipRise||0), kneeLead = s*RUNNER.kneeLead;
    const backHip = -bodyW*RUNNER.legSplay, frontHip = bodyW*RUNNER.legSplay;
    const feet = [];
    // A foot lifts while it is travelling FORWARD and is planted while it is travelling back —
    // that is what separates a run from a skate. Foot x is sin(phase), so its direction of
    // travel is cos(phase): positive = swinging forward. footLift is the peak height.
    const lift = (ph) => moving ? -s*RUNNER.footLift * mul(w.lift, 1) * Math.pow(Math.max(0, Math.cos(ph)), RUNNER.footLiftPow) : 0;
    // Every limb is hip → knee → foot. The stock stride works its knee out with IK from where
    // the foot landed; a folded pose places knee AND foot by hand, because a folded knee is
    // nowhere near the hip-to-foot line and there is no talking IK into putting it there.
    // seg is one bone, drawn a shade longer than the standing leg is: at this size a properly
    // foreshortened tuck just reads as a stump, and nobody measures a bent leg.
    const seg = (legL + bodyH*(RUNNER.hipRise||0)) * 0.88;
    const limbs = [];                                   // [hipX, kneeX, kneeY, footX, footY]
    if (w.pose === "lotus") {
      // Sitting cross-legged, seen side-on: one knee forward, one back, the feet tucked in
      // to meet under the middle. It hangs below the body's bottom edge, which is the only
      // reason it reads at all — legs the same colour as the body are invisible over it.
      const br = 1 + 0.05*Math.sin(ts/430);             // the fold breathes along with the hover
      for (const d of [1, -1]) {
        const kx = d*(frontHip + seg*0.78), ky = hipY + seg*0.445*br;
        limbs.push([d*frontHip, kx, ky, kx - d*seg*0.88, ky + seg*0.25*br]);
      }
    } else if (w.pose === "fetal") {
      // Curled into a ball: knees up in front of the chest, feet tucked back underneath.
      // The near leg reaches further so its knee clears the body and the pair reads as two.
      for (const [hx, reach] of [[backHip, 0.72], [frontHip, 0.92]]) {
        const kx = hx + seg*reach, ky = hipY - seg*0.55;
        limbs.push([hx, kx, ky, kx - seg*0.45, ky + seg*0.85]);
      }
    } else if (w.pose === "onefoot") {
      // Hopping on the one leg. The foot leaves the track at the top of the hop rather than
      // staying pinned to it — otherwise the leg has to stretch to the full height of the hop.
      const up = _leapLift || (moving ? Math.max(0, Math.sin(phase)) : 0);
      const fx = moving ? Math.sin(phase)*s*0.03 : 0, fy = -up*s*(w.hop||0)*0.80;
      if (w.leapAlt) {
        // A bound. He comes down on one foot and swaps which one every leap, and the idle leg
        // is folded BACK the whole time — never up in front — so the only thing that changes
        // from leap to leap is which side is carrying him. In the air the pair opens right
        // out, the key leg reaching forward for the landing and the idle one trailing straight
        // behind, and closes back into the tuck as he touches down. Both legs are placed by
        // their FEET and left to the knee solver, so the fold is a consequence of where the
        // foot is rather than a shape drawn by hand.
        const air = Math.max(0, _leapPose), sp = s*(w.leapSplit || 0.15)*air;
        const standHip = _leapFoot > 0 ? frontHip : backHip;
        const tuckHip  = _leapFoot > 0 ? backHip  : frontHip;
        const kf = solveKnee(standHip, hipY, fx + sp, fy, RUNNER.kneeBend, RUNNER.kneeSplit, kneeLead);
        limbs.push([standHip, kf.x, kf.y, fx + sp, fy]);
        const tfx = -seg*0.55*(1 - air) - sp;           // behind him, and further behind in the air
        const tfy = (hipY + seg*0.10)*(1 - air) + fy*air;   // tucked up to hip height on the ground
        // a negative lead puts the knee BEHIND the hip-to-foot line, which is what folding
        // backwards means — the same solver, pointed the other way
        const kt = solveKnee(tuckHip, hipY, tfx, tfy, RUNNER.kneeBend, RUNNER.kneeSplit, -kneeLead);
        limbs.push([tuckHip, kt.x, kt.y, tfx, tfy]);
      } else {
      const k = solveKnee(frontHip, hipY, fx, fy, RUNNER.kneeBend, RUNNER.kneeSplit, kneeLead);
      limbs.push([frontHip, k.x, k.y, fx, fy]);
      const tk = 1 - 0.18*up;                           // the idle leg curls tighter at the apex
      const kx = backHip + seg*0.85, ky = hipY + seg*0.35*tk;
      limbs.push([backHip, kx, ky, kx - seg*0.95, ky + seg*0.30*tk]);
      }
    } else if (w.leapSpin) {
      // Flipping. He curls up the moment he leaves the ground — knees out in front, feet drawn
      // in under him — and opens back out as he comes down, landing with his feet a little
      // apart to take it. Both ends are placed by hand and crossfaded on the leap's own arc:
      // IK is no use for a tuck, where the foot ends up nearer the hip than the knee is, and a
      // ball of a runner needs its knee where the drawing wants it rather than where a solver
      // put it. It also means the tuck is tightest exactly at the apex, which is the half of
      // the turn the eye actually reads.
      const air = Math.max(0, _leapPose), sp = s*(w.leapSplit || 0.06);
      for (const [hx, side] of [[backHip, -1], [frontHip, 1]]) {
        const gkx = hx + side*sp*0.5, gky = hipY + seg*0.55;      // planted: straight down,
        const gfx = hx + side*sp,     gfy = 0;                    // feet a little apart
        const tkx = hx + seg*0.62,    tky = hipY + seg*0.10;      // tucked: knee up in front,
        const tfx = hx + seg*0.10,    tfy = hipY + seg*0.62;      // foot drawn in under the hip
        limbs.push([hx, gkx + (tkx-gkx)*air, gky + (tky-gky)*air,
                        gfx + (tfx-gfx)*air, gfy + (tfy-gfy)*air]);
      }
    } else {
      // A lean tips the WHOLE local frame about the feet, so y=0 stops meaning "on the track":
      // it becomes a slope, and the trailing foot sinks through the floor by as much as the
      // leading one floats above it. Put each foot back on the real ground plane — solve
      //   fx·sinL + fy·cosL = the height the stride wanted
      // for fy. Costs nothing when there is no lean, since sinL is 0 and cosL is 1.
      const L = w.lean || 0, sinL = Math.sin(L), cosL = Math.cos(L);
      // A straddling leap throws the feet apart at the apex and shuts them again to land. It
      // goes in as extra STRIDE REACH rather than as a pose of its own: the two feet already
      // sit at +reach and -reach, so opening him up is the same arithmetic the run uses, and
      // the knees, the kicks and the lean all keep working without knowing about it.
      // A plain straddle opens only in the air. An alternating one keeps a share of the split
      // through the landing, so there is always a lead foot to come down on, and flips its sign
      // every leap — which is the whole of "he lands on them in turn".
      const open = w.leapAlt ? 0.45 + 0.55*Math.max(0, _leapPose) : Math.max(0, _leapPose);
      const sp = w.leapSplit ? s*w.leapSplit*open*(w.leapAlt ? _leapFoot : 1) : 0;
      const reach = swing + sp;
      for (const [hx, fx, fy0] of [[backHip, reach, lift(phase)], [frontHip, -reach, lift(phase + Math.PI)]]) {
        const fy = (fy0 - fx*sinL) / cosL;
        const k = RUNNER.knees ? solveKnee(hx, hipY, fx, fy, RUNNER.kneeBend, RUNNER.kneeSplit, kneeLead) : null;
        limbs.push([hx, k && k.x, k && k.y, fx, fy]);
      }
    }
    for (const [hx, kx, ky, fx, fy] of limbs) {
      ctx.beginPath(); ctx.moveTo(hx, hipY);
      if (kx != null) ctx.lineTo(kx, ky);
      ctx.lineTo(fx, fy); ctx.stroke();
      if (kx != null && RUNNER.kneeR > 0) {
        ctx.beginPath(); ctx.arc(kx, ky, s*RUNNER.kneeR, 0, Math.PI*2); ctx.fillStyle = finish; ctx.fill();
      }
      feet.push([fx, fy]);
    }
    // ---- kicks -----------------------------------------------------------------------
    // A kick is TWO things. First a length of the leg, measured back from the foot, restroked
    // in the kick's own colour with the same pen the leg was drawn with — the sock, the upper,
    // the cuff. Painting the limb rather than covering it is what makes a boot part of the leg
    // instead of a lump pushed onto the end of a stick. Second the shape on the ground: the
    // sole, the blade, the pad.
    // Somebody who is not the player wears their own kit or nothing: the heap at the bottom of
    // a fall is a crowd, and a crowd in your shoes is a crowd of you.
    const shoe = as ? (as.kicks || { id:"none" }) : lookItem("kicks");
    if (shoe.cover > 0 && shoe.legCol) {
      const lw = Math.max(3, s*RUNNER.legWidth);
      ctx.strokeStyle = shoe.legCol;
      // BUTT, not round: the top of an upper is a cut edge — a hem, a cuff, the lip of a boot —
      // and a round cap put a dome on the end of every one of them. The foot end wants its
      // round back, so it is filled in afterwards rather than left squared off inside the shoe.
      ctx.lineCap = "butt";
      for (const [hx, kx, ky, fx, fy] of limbs)
        strokeLimbTail(kx != null ? [[hx, hipY], [kx, ky], [fx, fy]] : [[hx, hipY], [fx, fy]],
                       shoe.cover);
      ctx.fillStyle = shoe.legCol;
      for (const [fx, fy] of feet) { ctx.beginPath(); ctx.arc(fx, fy, lw/2, 0, Math.PI*2); ctx.fill(); }
      ctx.lineCap = "round";
    }
    // ...and the shape itself, held FLAT TO THE GROUND while he runs. The swagger leans the
    // whole body about the feet, and a boot that leans with it points at the sky on every
    // stride — a foot stays level with the track it is running on. Standing still it can lean:
    // that is a pose, and a pose is meant to read as one.
    if (shoe.draw) for (const [fx, fy] of feet) {
      ctx.save(); ctx.translate(fx, fy);
      if (moving && w.lean) ctx.rotate(-w.lean);
      shoe.draw(ctx, s, shoe.col || finish, finish);
      ctx.restore();
    }
    // body — no outline. The corner comes from RUNNER, like every other measurement of him:
    // this was a hardcoded 0.07 while both labs read R.bodyR, so the lab's corner slider moved
    // a runner the game did not draw. The block parity check compares VALUES between the three
    // copies and cannot see a key that one of them quietly stopped using.
    ctx.fillStyle = finish;
    rrect(-bodyW/2, byTop, bodyW, bodyH, s*RUNNER.bodyR); ctx.fill();
    // the finish's own detail — facets, streaks — kept inside the silhouette
    if (skin.sheen) {
      ctx.save(); ctx.clip();                       // the body path is still current after fill()
      skin.sheen(ctx, -bodyW/2, byTop, bodyW, bodyH, ts);
      ctx.restore();
    }
    // worn talisman: a cord across the chest with the pendant hanging from it
    // OFF for now. The charm is a busy little object on a body that is 0.26 of a cell, and
    // with the drip, the hat and the kicks all doing their own work on him it was one thing
    // too many — most of what you saw of it was a dark smudge across his chest. The whole
    // block is left standing and switched by one flag, because the mechanic still equips a
    // talisman and the rack still shows which; only the necklace is hidden.
    const SHOW_TALISMAN_CORD = false;
    const worn = SHOW_TALISMAN_CORD && wornTalisman();
    if (worn) {
      const cordY = byTop + bodyH*RUNNER.talCordY, hangY = byTop + bodyH*RUNNER.talHangY;
      const px = bodyW*RUNNER.talX, span = bodyW*RUNNER.talSpan;   // the cord's dip follows the pendant
      ctx.strokeStyle = "rgba(23,38,63," + RUNNER.talCordA + ")";
      ctx.lineWidth = Math.max(1, s*RUNNER.talCordW); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-span, cordY);
      ctx.quadraticCurveTo(px, hangY + s*RUNNER.talSag, span, cordY); ctx.stroke();
      worn.draw(ctx, px, hangY, s*RUNNER.talR);
    }
    // the shared eyes, facing +x = the way he is travelling
    // Eyes shut once he is down. drawEyes blinks off the clock, so it is handed a time that
    // parks it inside a blink and keeps it there for as long as he is folded.
    // ...or two little crosses, for somebody who is not getting up. It is the one drawing in
    // the game that says a runner is FINISHED rather than resting, and it is why the heap at
    // the bottom of a fall reads as a heap rather than as a crowd having a lie down.
    if ((as && as.dead) || _deadEyes) drawDeadEyes(ctx, 0, byTop + bodyH*RUNNER.eyeY, s, inkCol);
    else drawEyes(ctx, 0, byTop + bodyH*RUNNER.eyeY, s, inkCol, 1,
                  _restFold > 0.5 ? EYES.blinkMs*0.02 : ts, 0);
    // last, so it sits on top of everything. Scaled up about the crown of his head — at the
    // shipped size the hats were a few pixels of trim on a small character and read as noise.
    // No scale-up any more. Hats are cut to the HEAD — every measurement in them is a fraction
    // of bodyW — so nudging them 15% larger about the crown made "exactly as wide as his head"
    // exactly 15% wider than his head. They also take the finish and the ink the body was
    // painted with, so a hat that is a copy of him is a copy of what he is wearing today.
    const hat = as ? (as.hat || { draw:null }) : lookItem("hat");
    if (hat.draw) {
      ctx.save();
      hat.draw(ctx, s, bodyW, byTop, hat.col, finish, inkCol, ts);
      ctx.restore();
    }
    ctx.restore();
  }

  // rounded-rectangle path (arcTo works on iOS 15+, unlike ctx.roundRect)
  function rrect(x, y, w, h, r) { ctx.beginPath(); rrectSub(x, y, w, h, r); }
  // the same outline as a SUBPATH — several of these make one fillable region, which is how
  // the whole run of track gets its backing in a single pass
  function rrectSub(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w/2, h/2));
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }

  // ---- wall layer, cached ----
  // Walls are static for the life of a level, yet drawWall (a gradient + clip + grain
  // pattern + four bolts, per wall) ran for every wall every frame. Bake the whole wall
  // layer into a world-sized offscreen once per level (or on resize) and blit it with a
  // single drawImage inside the camera transform.
  let wallLayer = null, wallLayerDirty = true;
  function markWallLayerDirty() { wallLayerDirty = true; }
  // The walls are watching. They cannot go into the baked wall layer — that is drawn once per
  // level and blitted — so they are painted over the top each frame, which is what lets them
  // blink and follow him. Two circles per wall is nothing next to the rest of a frame.
  // The walls wear the same eyes as everything else — only where they sit and how far they
  // will look are the walls' own business. They cannot go into the baked wall layer (that is
  // drawn once per level and blitted), so they are painted over the top each frame.
  const WALL_EYES = {
    y:     0.42,                  // down the tile from its top
    track: 0.020,                 // how far the pupils slide toward the runner
    reach: 6,                     // how many tiles away they stop bothering to look
  };                              // no colour of their own: they take the plate's, like the rivets
  function drawWallEyes(ts) {
    const s = state; if (!s.walls.size) return;
    let rx = null, ry = null;
    if (s.status === "play" || s.status === "falling") {
      const rp = s.status === "falling" && s.fall ? s.fall : visualAt(s.runIdx + s.runT);
      rx = rp.x; ry = rp.y;
    }
    // Only the walls you can SEE. This loop used to run for every wall on the board, which on
    // the big mazes is two hundred of them for the twenty or so on screen — and each one built
    // a gradient and drew a pair of animated eyes. Everything off-screen was painted into the
    // clip and thrown away.
    const c0 = Math.floor(camX / cell) - 1, c1 = Math.ceil((camX + viewW) / cell) + 1;
    const r0 = Math.floor(camY / cell) - 1, r1 = Math.ceil((camY + viewH) / cell) + 1;
    // This one is kept DEAD VERTICAL, `lean` forced to 0, and it is not the plate's own fill —
    // it is the ramp the eyes sample their colour from, and that rule is "the colour the edge is
    // at that HEIGHT". Height only, so it depends on the ROW and nothing else, and one per row
    // serves every wall in it: a dozen instead of two hundred. Leaning it would also break the
    // sharing outright, since a leaning ramp spans a little way horizontally and every wall away
    // from x=0 would sample past its end and come out flat.
    const rowGrad = new Map();
    const gradFor = (r) => { let g2 = rowGrad.get(r);
      if (!g2) { g2 = plateGrad(ctx, 0, cy(r), cell, 0); rowGrad.set(r, g2); }
      return g2; };
    ctx.save();
    for (const wk of s.walls) {
      const i = wk.indexOf(","), c = +wk.slice(0, i), r = +wk.slice(i+1);
      if (c < c0 || c > c1 || r < r0 || r > r1) continue;      // not on screen; nothing to look with
      const cx0 = (c + 0.5)*cell, cy0 = (r + WALL_EYES.y)*cell;
      // The plate's own face, so an eye is the colour the edge is at that height — the same
      // rule the rivets follow.
      const grd = gradFor(r);
      // Each wall blinks on its own offset, or a row of them shutters like a Mexican wave.
      const off = (_sHash(c + 1, r + 1) % 1000) / 1000 * EYES.blinkMs;
      // ...and the pupils follow him. This is handed to the painter rather than over-painted
      // afterwards: the painter also applies its own wandering glance, so a second pass drawing
      // pupils without it lands beside the first pair instead of on top of it.
      let nx = 0, ny = 0;
      if (rx != null) {
        const dx = rx - cx0, dy = ry - cy0, d = Math.hypot(dx, dy) / cell;
        if (d < WALL_EYES.reach && d > 0.01) {
          const k2 = WALL_EYES.track * (1 - d/WALL_EYES.reach) / d;
          nx = dx*k2; ny = dy*k2;
        }
      }
      drawEyes(ctx, cx0, cy0, cell, grd, 0, ts, off, nx, ny);
    }
    ctx.restore();
  }

  // The plate's inscribed square: a recessed face set just inside the edge, following the same
  // corner as the plate itself. Shared by all three painters — the baked wall layer, the live
  // wall and the platform plinth — because three copies of a detail is three chances to drift.
  //
  // It is a translucent BLACK rather than a mixed-down grey, which is what makes it a darker
  // shade of the wall at every point: the plate is a top-to-bottom gradient and the paper grain
  // sits under this, so a flat opaque panel would kill both inside its own borders. Sitting the
  // darkening on top keeps the gradient running straight through the panel and the grain
  // showing within it.
  // The plate's face, as a gradient, defined once. The plate fill, its rivets and its eyes
  // all take THIS — so a rivet is exactly the colour the plate's edge is at that height, which
  // is what makes it read as standing proud of the recessed panel rather than as a spot of
  // paint on it. It was three hand-copied gradients before, one per painter.
  const PLATE_STOPS = [[0, "#697082"], [0.5, "#5c6474"], [1, "#4e5564"]];
  // How far the plate's gradient tips off vertical, as a fraction of the tile it crosses. Dead
  // vertical read as a printed band; a slight lean reads as light falling on a metal face from
  // somewhere off to one side, which is what it is meant to be. Small on purpose — past about a
  // third the corner nearest the light goes bright enough to look like a different plate.
  const PLATE_LEAN = 0.30;
  function plateGrad(g, x, y, s, lean) {
    const L = (lean == null ? PLATE_LEAN : lean) * s;
    const gd = g.createLinearGradient(x - L/2, y, x + L/2, y + s);
    for (const st of PLATE_STOPS) gd.addColorStop(st[0], st[1]);
    return gd;
  }
  // Where a rivet sits on a steel plate and how big it is, as fractions of the tile. Three
  // painters drove the corner rivets from their own copies of these — the baked wall, the live
  // wall and the rail's plinth — and the bolted rail's end rivets were at a fourth number
  // entirely, which is what put them nearer the edge than every other rivet in the game.
  const PLATE_RIVET = { inset: 0.17, r: 0.05 };
  // How wide the bar behind a bolted rail is, fraction of a cell. Comfortably wider than
  // TILE.railW so the line reads as sitting ON it rather than beside it.
  const PF_BAR = 0.20;
  const PLATE_PAD   = 0.055;        // inset, fraction of the tile
  const PLATE_SHADE = 0.22;         // how far it darkens the plate under it
  function platePanel(g, x, y, s, rad) {
    const p = s*PLATE_PAD, r2 = Math.max(0, rad - p*0.6), w = s - 2*p;
    g.save();
    g.fillStyle = "rgba(5,4,13," + PLATE_SHADE + ")";
    g.beginPath();
    g.moveTo(x+p+r2, y+p);
    g.arcTo(x+p+w, y+p,   x+p+w, y+p+w, r2);
    g.arcTo(x+p+w, y+p+w, x+p,   y+p+w, r2);
    g.arcTo(x+p,   y+p+w, x+p,   y+p,   r2);
    g.arcTo(x+p,   y+p,   x+p+w, y+p,   r2);
    g.closePath(); g.fill();
    g.restore();
  }

  // self-contained wall painter (targets an arbitrary context, no reliance on global ctx)
  function paintWallInto(g, x, y, s) {
    const rad = tileR(s);           // was a hardcoded 0.16 — the one plate the radius pass missed
    const rp = (r) => { r = Math.max(0, Math.min(r, s/2)); g.beginPath(); g.moveTo(x+r,y);
      g.arcTo(x+s,y,x+s,y+s,r); g.arcTo(x+s,y+s,x,y+s,r); g.arcTo(x,y+s,x,y,r); g.arcTo(x,y,x+s,y,r); g.closePath(); };
    const grd = plateGrad(g, x, y, s);
    rp(rad); g.fillStyle = grd; g.fill();
    g.save(); rp(rad); g.clip();
    if (paperTile) { g.globalAlpha = 0.9; g.fillStyle = g.createPattern(paperTile, "repeat"); g.fillRect(x, y, s, s); g.globalAlpha = 1; }
    g.restore();
    platePanel(g, x, y, s, rad);
    const off = s*PLATE_RIVET.inset, br = s*PLATE_RIVET.r;   // square, like everything else here
    for (const [bx, by] of [[off,off],[s-off,off],[off,s-off],[s-off,s-off]]) {
      g.fillStyle = grd; g.fillRect((x+bx) - br, (y+by) - br, br*2, br*2);
    }
  }
  // ---- the edge of the world ----------------------------------------------
  // The limit of what you can build on, drawn as hazard hatching rather than as a fence. A
  // full course of plate said "wall" so loudly that it competed with the real walls inside the
  // level — the ones that matter, because you have to route around them. This says the same
  // thing quietly: diagonal bars of faint white, every other one missing, fading out to
  // nothing as they go.
  //
  // Four bands, one per side, mitred at 45° so the corners meet on a seam instead of
  // overlapping — two overlapping bands would stack their alpha and leave the four corners
  // visibly brighter than the sides.
  //
  // The bars are ONE cached Path2D covering the whole outer rect, filled once per side
  // through that side's clip. Building a path per bar per frame would be ~70 fills a frame;
  // this is four, and the path only rebuilds when the board or the cell size changes.
  const EDGE_FADE   = 1.15;                 // how far the hatching reaches out, in cells
  const EDGE_A      = 0.11;                 // white at its strongest, at the peak of the rise
  const EDGE_STRIPE = 0.34;                 // one light bar + one gap, in cells
  const EDGE_RISE   = 0.20;                 // where it peaks, as a fraction of the way out
  // The wall is not a permanent feature of the level — it is what you find when you get close
  // to the edge with a tile in hand. Nothing shows until a tile is within EDGE_FAR of it; by
  // EDGE_NEAR it is at full strength. Away from the edges the whole pass costs nothing, because
  // the early-out below never touches the layers at all.
  const EDGE_NEAR = 2;                      // full strength within this many tiles of a tile
  const EDGE_FAR  = 3;                      // and invisible beyond this many
  const EDGE_STRIPES = false;               // see the call site in draw()
  let edgeLayer = null, edgeMask = null, edgeLayerKey = "";
  let edgeBars = null, edgeBarsKey = "";
  function edgeBarPath(B) {
    const key = Math.round(cell) + "/" + Math.round(worldW) + "x" + Math.round(worldH);
    if (edgeBars && key === edgeBarsKey) return edgeBars;
    const P = Math.max(4, EDGE_STRIPE * cell);          // one full light+dark cycle
    const x0 = -B, x1 = worldW + B, y0 = -B, y1 = worldH + B;
    const path = new Path2D();
    // A 45° bar is the strip between two lines of constant (x+y), so at any y its edges sit
    // at x = s - y and x = s + P/2 - y. Stepping s by P leaves a gap of exactly half a cycle.
    for (let sv = x0 + y0; sv <= x1 + y1; sv += P) {
      path.moveTo(sv - y0,       y0);
      path.lineTo(sv + P/2 - y0, y0);
      path.lineTo(sv + P/2 - y1, y1);
      path.lineTo(sv - y1,       y1);
      path.closePath();
    }
    edgeBars = path; edgeBarsKey = key;
    return path;
  }
  function edgeBand(g, ax, ay, bx, by, nx, ny, B, bars) {
    // Zero at BOTH ends. It used to open at full strength on the board's edge, which drew a
    // hard line right where the playable area stops — the one place the eye is already looking.
    // Now it rises out of nothing just outside the board, peaks, and trails away: no edge to
    // the edge, in either direction.
    const grd = g.createLinearGradient(ax, ay, ax + nx*B, ay + ny*B);
    const a = v => "rgba(255,255,255," + v.toFixed(4) + ")";
    grd.addColorStop(0,               a(0));
    grd.addColorStop(EDGE_RISE,       a(EDGE_A));
    grd.addColorStop(EDGE_RISE+0.30,  a(EDGE_A*0.45));  // most of the fall happens early,
    grd.addColorStop(1,               a(0));            // so the tail is a long soft nothing
    const ex = bx-ax, ey = by-ay, len = Math.hypot(ex, ey) || 1;
    const ux = ex/len, uy = ey/len;                      // along the edge, for the mitre
    g.save();
    g.beginPath();
    g.moveTo(ax, ay);
    g.lineTo(bx, by);
    g.lineTo(bx + nx*B + ux*B, by + ny*B + uy*B);
    g.lineTo(ax + nx*B - ux*B, ay + ny*B - uy*B);
    g.closePath(); g.clip();
    g.fillStyle = grd;
    g.fill(bars);
    g.restore();
  }
  function drawEdgeWalls() {
    if (worldW < 1 || worldH < 1 || !state.tiles || !state.tiles.length) return;
    const B = EDGE_FADE * cell, R = EDGE_FAR * cell;

    // Only tiles that are actually near the rim can light any of it. A tile in the middle of
    // the board would otherwise still cost a full radial-gradient disc every frame, for a
    // mask that lands nowhere near a band.
    const near = [];
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    for (const t of state.tiles) {
      if (Math.min(t.c + 0.5, t.r + 0.5, COLS - t.c - 0.5, ROWS - t.r - 0.5) > EDGE_FAR) continue;
      const sx = cx(t.c) + cell/2 - camX, sy = cy(t.r) + cell/2 - camY;
      if (sx < -R || sy < -R || sx > viewW + R || sy > viewH + R) continue;
      near.push({ sx, sy });
      if (sx-R < bx0) bx0 = sx-R;  if (sy-R < by0) by0 = sy-R;
      if (sx+R > bx1) bx1 = sx+R;  if (sy+R > by1) by1 = sy+R;
    }
    if (!near.length) return;

    // Everything below is confined to the box those discs occupy, clipped to the screen. The
    // revealed patch is a few hundred pixels across; clearing, compositing and blitting the
    // whole viewport for it — twice a frame, at whatever the device pixel ratio is — was
    // paying full-screen fill rate for a corner of the screen.
    bx0 = Math.max(0, Math.floor(bx0));  by0 = Math.max(0, Math.floor(by0));
    bx1 = Math.min(viewW, Math.ceil(bx1)); by1 = Math.min(viewH, Math.ceil(by1));
    const bw = bx1 - bx0, bh = by1 - by0;
    if (bw <= 0 || bh <= 0) return;

    const key = Math.round(viewW) + "x" + Math.round(viewH) + "@" + dpr;
    if (!edgeLayer || key !== edgeLayerKey) {
      edgeLayer = document.createElement("canvas");
      edgeLayer.width  = Math.max(1, Math.round(viewW*dpr));
      edgeLayer.height = Math.max(1, Math.round(viewH*dpr));
      // The mask is nothing but soft discs, so it is built at half resolution and scaled up —
      // a quarter of the pixels, and no detail lost that anyone could see.
      edgeMask = document.createElement("canvas");
      edgeMask.width  = Math.max(1, Math.round(viewW*dpr*0.5));
      edgeMask.height = Math.max(1, Math.round(viewH*dpr*0.5));
      edgeLayerKey = key;
    }
    const W = worldW, H = worldH, bars = edgeBarPath(B);

    // 1. the mask: one soft disc per contributing tile, in screen space
    const m = edgeMask.getContext("2d");
    m.setTransform(dpr*0.5, 0, 0, dpr*0.5, 0, 0);
    m.clearRect(bx0, by0, bw, bh);
    for (const t of near) {
      const rg = m.createRadialGradient(t.sx, t.sy, EDGE_NEAR*cell, t.sx, t.sy, R);
      rg.addColorStop(0, "rgba(255,255,255,1)");
      rg.addColorStop(1, "rgba(255,255,255,0)");
      m.fillStyle = rg;
      m.beginPath(); m.arc(t.sx, t.sy, R, 0, Math.PI*2); m.fill();
    }

    // 2. the bands, in world space, then multiplied by the mask in ONE operation — applied
    //    disc by disc a mask would INTERSECT rather than union, and erase itself. The clip
    //    holds destination-in to the box too, so the rest of the layer is never touched.
    const g = edgeLayer.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(bx0, by0, bw, bh);
    g.save();
    g.beginPath(); g.rect(bx0, by0, bw, bh); g.clip();
    g.translate(-camX, -camY);
    edgeBand(g, 0, 0,  W, 0,   0, -1, B, bars);  // clockwise, so every mitre meets its neighbour
    edgeBand(g, W, 0,  W, H,   1,  0, B, bars);
    edgeBand(g, W, H,  0, H,   0,  1, B, bars);
    edgeBand(g, 0, H,  0, 0,  -1,  0, B, bars);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.globalCompositeOperation = "destination-in";
    // The source rect is in the MASK's own device pixels, and the mask is half-resolution:
    // that is dpr*0.5 per CSS pixel, not 0.5. At dpr 2 the two happen to differ by exactly
    // the factor that leaves the box misaligned vertically but not horizontally, which is
    // the kind of wrong that looks right in the one screenshot you happen to take.
    const ms = dpr*0.5;
    g.drawImage(edgeMask, bx0*ms, by0*ms, bw*ms, bh*ms, bx0, by0, bw, bh);
    g.globalCompositeOperation = "source-over";
    g.restore();

    // 3. one blit of that box. The main context is translated by the camera, so it goes back
    //    at (camX,camY) — which also keeps it riding the screen shake with everything else.
    ctx.drawImage(edgeLayer, bx0*dpr, by0*dpr, bw*dpr, bh*dpr,
                  camX + bx0, camY + by0, bw, bh);
  }

  // ONE wall, at cell size, blitted wherever a wall stands.
  //
  // It used to be the whole WORLD at device resolution — on the 13x19 maze at dpr 3, a
  // ~29-megapixel texture — rebuilt from scratch whenever the board or the cell size changed,
  // and every wall painted into it one at a time. But every wall tile is drawn identically:
  // same plate, same gradient, same grain, same four rivets. Nothing about it depends on WHERE
  // it is. So there is exactly one bitmap to hold, it is a single cell across, and it only ever
  // has to be rebuilt when the cell size changes.
  //
  // What is left out is the eyes, which blink on their own offsets and follow the runner — they
  // were never in the layer either.
  function buildWallLayer() {
    wallLayerDirty = false;
    if (!paperTile) buildPaper();
    if (!(cell > 0)) { wallLayer = null; return; }
    const px = Math.max(1, Math.round(cell * dpr));
    wallLayer = document.createElement("canvas"); wallLayer.width = px; wallLayer.height = px;
    const g = wallLayer.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintWallInto(g, 0, 0, cell);
  }

  // rounded, full-cell obstacle
  // metal barrier tile: brushed steel plate with a bevel, sheen and corner bolts
  function drawWall(c, r) {
    const x = cx(c), y = cy(r), s = cell, rad = tileR(s);
    const g = plateGrad(ctx, x, y, s);                                // gentler top-to-bottom gradient
    rrect(x, y, s, s, rad); ctx.fillStyle = g; ctx.fill();            // full-cell plate, no outline
    ctx.save(); rrect(x, y, s, s, rad); ctx.clip();
    grainFill(x, y, s, s, 0.9);                       // paper grain on the wall tile (no sheen)
    ctx.restore();
    // corner bolts (matte, no shine)
    platePanel(ctx, x, y, s, rad);
    const off = s*PLATE_RIVET.inset, br = s*PLATE_RIVET.r;   // square, like everything else here
    for (const [bx, by] of [[off,off],[s-off,off],[off,s-off],[s-off,s-off]]) {
      ctx.fillStyle = g; ctx.fillRect((x+bx) - br, (y+by) - br, br*2, br*2);
    }
  }

  // ---- fixed platform: a metal plinth with track cast into it ------------
  // Same plate as a wall (so it reads as immovable), with a real platform surface
  // laid across it along the shape's two connectors. Dim while idle; it warms to the
  // full track colour and throws a glow the moment the runner's path latches onto it.
  function drawPlatform(pf, ts) {
    const x = cx(pf.c), y = cy(pf.r), s = cell, rad = tileR(s);
    const n = { c: pf.c, r: pf.r };
    const A = PF_VEC[pf.dirs[0]], B = PF_VEC[pf.dirs[1]];
    const S = tileSurface(n, { c: pf.c + A.x, r: pf.r + A.y }, { c: pf.c + B.x, r: pf.r + B.y });

    // the plinth — identical steel plate to a wall, so the eye reads "you can't build here"
    const g = plateGrad(ctx, x, y, s);
    rrect(x, y, s, s, rad); ctx.fillStyle = g; ctx.fill();
    ctx.save(); rrect(x, y, s, s, rad); ctx.clip();
    grainFill(x, y, s, s, 0.9);
    ctx.restore();
    platePanel(ctx, x, y, s, rad);
    const off = s*PLATE_RIVET.inset, br = s*PLATE_RIVET.r;   // square, like everything else here
    for (const [bx, by] of [[off,off],[s-off,off],[off,s-off],[s-off,s-off]]) {
      ctx.fillStyle = g; ctx.fillRect((x+bx) - br, (y+by) - br, br*2, br*2);
    }

    const lit = pf.lit || 0;
    // NO platform body and no colour wash — a fixed rail is JUST THE LINE, drawn exactly as the
    // runner's own laid rail is: same colour, same TILE.railW, same round caps. It used to be a
    // fatter line of its own over a dark recessed groove, which made a bolted rail a different
    // kind of thing from the rail he lays — and the two meet end to end, so the join showed.
    ctx.save();
    rrect(x, y, s, s, rad); ctx.clip();
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    // live state lives entirely on the line: it brightens and blooms, the plate stays steel
    if (lit > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = hexA(curTrack(), 0.5*lit);
      ctx.lineWidth = Math.max(6, s*0.16);
      ctx.filter = "blur(" + Math.max(1, s*0.05) + "px)";
      ctx.beginPath(); railPath(S); ctx.stroke();
      ctx.restore();
    }
    // A thicker bar behind the line, in the PLATE'S OWN gradient — the colour of the plate's
    // outer rim, which is the metal before platePanel darkens the recess inside it. So the rail
    // reads as standing on a raised bar of the same steel the plinth is cut from, running the
    // whole way across rather than being pinned down at its two ends. That is what the rivets
    // were for, and this says it along the entire length instead of twice.
    ctx.strokeStyle = g;
    ctx.lineWidth = Math.max(5, s*PF_BAR);
    ctx.beginPath(); railPath(S); ctx.stroke();
    ctx.globalAlpha = 0.6 + 0.4*lit;                 // dim while idle, full once live
    ctx.strokeStyle = curRail();
    ctx.lineWidth = Math.max(3, s*TILE.railW);       // the laid rail's own width, not one of its own
    ctx.beginPath(); railPath(S); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function drawPlatforms(ts) {
    const s = state;
    if (!s.platforms || !s.platforms.length) return;
    for (const pf of s.platforms) {
      const live = s.path.some(n => n.kind === "platform" && n.c === pf.c && n.r === pf.r && !n.exited);
      pf.lit += ((live ? 1 : 0) - pf.lit) * 0.16;      // ease the highlight in/out
      drawPlatform(pf, ts);
    }
  }

  // three deterministic crack polylines (unit coords), revealed one per tap taken
  // ---- breakable stone: 3 crack variations, staged by remaining taps (hp) ----
  // Each stone picks a variation by position; the crack set grows as hp falls (3=pristine wear,
  // 2=one fissure through, 1=four fissures / shattered). Baked into a cached bitmap per
  // (variant, grain, taps) and blitted, so the carved gaps reveal the level background behind
  // rather than a flat void — see stoneBitmap.
  function _srr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  // 32-bit avalanche. The old version multiplied with `*`, which leaves 32-bit range and
  // loses the low bits to float rounding — the result was visibly skewed (over a 16x16
  // board it picked variation 1 ~43% more often than variation 3). Math.imul keeps it exact.
  function _sHash(a,b){
    let h = Math.imul(a|0, 0x27d4eb2d) ^ Math.imul(b|0, 0x165667b1);
    h ^= h >>> 15; h = Math.imul(h, 0x2545f491);
    h ^= h >>> 13; h = Math.imul(h, 0x3d73373b);
    h ^= h >>> 16;
    return h >>> 0;
  }
  function _sResample(path,sub){ const o=[]; for(let i=0;i<path.length-1;i++){ const a=path[i],b=path[i+1]; for(let j=0;j<sub;j++){ const t=j/sub; o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]); } } o.push(path[path.length-1]); return o; }
  function _sInside(p){ return p[0]>0.04&&p[0]<0.96&&p[1]>0.04&&p[1]<0.96; }
  // ---- crack tuning (mirrored exactly in stone-generator.html) -----------
  // BASE_W is the crack half-width as a fraction of the cell, by taps remaining.
  // WOB_* are the two sine amplitudes that make a crack breathe along its length —
  // small values keep the line an even hairline instead of a lumpy vein.
  const STONE_TUNE = {
    BASE_W: { 3:0.026, 2:0.029, 1:0.034 },
    W_MID: 0.58, WOB_A: 0.05, WOB_B: 0.02, W_MIN: 0.52, W_MAX: 0.64,
    BEVEL: 0, BEVEL_MULT: 1.5,   // 0 = no lit lip; the crack is flat STONE_EDGE
  };
  function _sWidth(t,seed,ts_,te){ const T=STONE_TUNE;
    let w=T.W_MID+T.WOB_A*Math.sin(t*9+seed)+T.WOB_B*Math.sin(t*19+seed*1.7);
    w=Math.max(T.W_MIN,Math.min(T.W_MAX,w)); let f=1;
    if(ts_)f=Math.min(f,t/0.30); if(te)f=Math.min(f,(1-t)/0.30);   // taper to a point at a tip inside the tile
    return w*Math.max(0,Math.min(1,f)); }
  function _sPoly(g,s,path,baseW,seed,mult){ mult=mult||1; const pts=_sResample(path,6),n=pts.length; const ts_=_sInside(path[0]),te=_sInside(path[path.length-1]);
    const nrm=pts.map((p,k)=>{ const a=pts[Math.max(0,k-1)],b=pts[Math.min(n-1,k+1)]; let tx=b[0]-a[0],ty=b[1]-a[1]; const m=Math.hypot(tx,ty)||1; return [ty/m,-tx/m]; });
    const hw=pts.map((p,k)=>baseW*_sWidth(k/(n-1),seed,ts_,te)*mult);

    // whose edge you can now SEE reads as the level sliding about on top of its own ground.
    // Drifting: the cosmos and the title, which have no board to be nailed to, and which move
    // ALWAYS rather than only while the game is paused. A still starfield is a painted one.
    const weld = mode !== "drift";
    const off = weld ? { x: camX, y: camY } : bgScrollOffset(ts, true);
    ctx.save();
    ctx.translate(-off.x, -off.y);
    ctx.fillStyle = patchPat;
    // Exactly the screen, and not a pixel more. After the translate, screen (0,0) sits at
    // (off.x, off.y) in this space — so that is where the fill starts. It used to begin at the
    // origin and run a whole pattern period past the far corner, on the reasoning that the
    // scroll offset had to be covered. The offset moves the fill, it does not enlarge it, and
    // the period is not a small number: on a 1024x1300 board it painted 11.5 megapixels a frame
    // to show 1.3 — nearly nine times over, and worse the bigger the screen.
    ctx.fillRect(off.x, off.y, viewW, viewH);
    ctx.restore();
    drawGlints(ts, off, patchStepPx || w);   // the quilt's real step, so a glint fills a patch

  }
  // The glisten. Each patch on screen is identified by its position in the endless quilt,
  // hashed once to decide whether it glints at all and to give it its own phase, so they
  // breathe out of step. Additive, so it lifts the patch's own colour rather than washing it,
  // and FLAT across the whole patch — the patch itself is the shape, so a soft blob inside it
  // just blurred the edge the quilt is made of.
  function drawGlints(ts, off, w, strength) {

      // this pass is additive, so an overlapping edge gets lit TWICE and two glinting
      // neighbours grow a bright seam between them. Abutting rects are safe — the boundary
      // pixel's coverage is split between them and sums back to one.

  // A level's quilt stops where the LEVEL stops, and the cosmos the Tileverse hangs in shows

  //

  function drawBackground(ts, themeOverride, stars, mode) {

  // the gap necessarily squares the two corners that make it. Measured at a 190px cell it
  // is 15px of a 186px edge. Rounded corners and a seamless join are mutually exclusive
  // while a tile is drawn as a rounded square — see the notes if that trade is revisited.
  function drawPathGlass(nodes) {
    if (!nodes.length) return;
    const r = tileR(cell);

    ctx.save();
    ctx.beginPath();
    for (const n of nodes) {
      const x = cx(n.c), y = cy(n.r);

      x0 = Math.min(x0, x); y0 = Math.min(y0, y);

    ctx.fillRect(x0, y0, x1-x0, y1-y0);

    ctx.restore();
  }

    ctx.save();
    rrect(x, y, s, s, tileR(s)); ctx.clip();
    ctx.fillStyle = "rgba(180,174,235," + TILE.glassA + ")";   // flat matte paper fill (no gloss/sheen)
    ctx.fillRect(x, y, s, s);
    grainFill(x, y, s, s, TILE.glassGrain);           // paper grain on the tile
    ctx.restore();

  function frame(ts){

    if (titleActive) { tickTitle(dt); drawTitle(ts); requestAnimationFrame(frame); return; }
    // The victory sequence owns the frame outright: it is a camera move over a board that has
    // stopped, so nothing of the level's own update has any business running under it.
    if (win) { tickWin(dt); drawWin(ts); updatePauseBtn(); requestAnimationFrame(frame); return; }
    if (!paused) {
      if (state.status === "hold") tickHold(dt);
      else if (state.status === "campan") tickCamPan(dt);
      else if (state.status === "intro") tickIntro(dt);
      else if (state.status === "cue") tickCue(dt);      // assembled, waiting for the downbeat
