<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tile Runner — Music Lab</title>
<style>
  :root{ --bg:#12102a; --panel:#1b1838; --line:#2b2850; --ink:#cfe9ff; --accent:#7dd0ff; --gold:#ffd24a; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;}
  header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;}
  header h1{font-size:15px;margin:0 10px 0 0;font-weight:700;letter-spacing:.5px;}
  .wrap{display:flex;gap:18px;padding:14px;align-items:flex-start;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:8px;}
  canvas{background:#0d0b22;border:1px solid var(--line);border-radius:9px;display:block;}
  .panel{width:335px;display:flex;flex-direction:column;gap:2px;}
  .group{margin:12px 0 3px;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.5;
         border-top:1px solid var(--line);padding-top:9px;}
  .group:first-child{border-top:0;margin-top:0;}
  .sl{display:grid;grid-template-columns:92px 1fr 50px;gap:8px;align-items:center;font-size:11px;}
  .sl label{opacity:.85;}
  .sl input[type=range]{width:100%;accent-color:var(--accent);}
  .sl .val{text-align:right;opacity:.7;font-variant-numeric:tabular-nums;}
  .rowline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;margin:3px 0;}
  .rowline label{opacity:.85;}
  .togs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;}
  .env{margin:4px 0 8px;}
  .env canvas{display:block;width:100%;height:52px;background:#0d0b22;border:1px solid var(--line);
              border-radius:6px;}
  .env .adsr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px;}
  .env .adsr div{display:flex;flex-direction:column;gap:1px;}
  .env .adsr label{font-size:9px;opacity:.55;letter-spacing:.5px;text-transform:uppercase;}
  .env .adsr input{width:100%;accent-color:var(--accent);}
  .env .adsr .v{font-size:9px;opacity:.6;font-variant-numeric:tabular-nums;}
  button.act{background:#233;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;font:inherit;font-size:11px;}
  button.act:hover{border-color:var(--accent);}
  button.act.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  button.prim{background:#1c6;color:#04120a;font-weight:700;border:none;}
  button.warn{background:#c34;color:#fff;border:none;}
  select,input[type=number]{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:3px 5px;font:inherit;font-size:11px;}
  textarea{width:100%;height:150px;background:#0d0b22;color:#bfe;border:1px solid var(--line);
           border-radius:8px;padding:9px;font:inherit;font-size:10px;line-height:1.45;white-space:pre;}
  .hint{font-size:11px;opacity:.72;line-height:1.65;}
  .hint b{opacity:1;}
  .pill{font-size:11px;background:#0d0b22;border:1px solid var(--line);border-radius:20px;padding:3px 9px;}
  .pill.live{border-color:var(--gold);color:var(--gold);}
  table.lv{border-collapse:collapse;font-size:10px;width:100%;}
  table.lv td,table.lv th{border-bottom:1px solid var(--line);padding:2px 5px;text-align:left;}
  table.lv th{opacity:.5;font-weight:400;}
  table.lv tr.has td:first-child{color:var(--gold);}
</style>
</head>
<body>
<header>
  <h1>TILE RUNNER · MUSIC LAB</h1>
  <button class="act prim" id="play">▶ Play</button>
  <span class="pill" id="beat">—</span>
  <span class="pill" id="saved" style="opacity:.35;transition:opacity .3s">saved</span>
  <label>level <select id="lv"></select></label>
  <label>pace <input type="number" id="cps" min="0.3" max="2" step="0.01" value="1" style="width:64px"> tiles/s</label>
</header>

<div class="wrap">
  <div class="col">
    <canvas id="roll" width="620" height="300"></canvas>
    <div class="rowline">
      <button class="act" id="dice">🎲 New seed</button>
      <label>seed <input type="number" id="seed" value="1" style="width:88px"></label>
      <span class="pill" id="seedinfo">—</span>
    </div>
    <div class="rowline">
      <button class="act prim" id="savedef">Save as defaults</button>
      <button class="act" id="revertdef">Revert to shipped</button>
    </div>
    <div class="rowline">
      <button class="act prim" id="savelv">Save for this level</button>
      <button class="act" id="clearlv">Clear this level</button>
      <button class="act warn" id="clearall">Clear all overrides</button>
    </div>
    <table class="lv" id="lvtab"></table>
    <div class="panel" id="panelSong" style="width:100%"></div>
  </div>

  <div class="panel" id="panelFg"></div>
  <div class="panel" id="panelBg"></div>

  <div class="panel" style="width:360px">
    <div class="group">Export</div>
    <textarea id="out" spellcheck="false"></textarea>
    <div class="rowline">
      <button class="act prim" id="tofile">Save to game</button>
      <button class="act" id="pickfile">Choose index.html…</button>
      <button class="act" id="copy">Copy</button>
      <button class="act" id="paste">Load from box</button>
      <button class="act" id="reset">Reset to shipped</button>
    </div>
    <div class="hint" id="notes"></div>
  </div>
</div>

<script>
// ============================================================================
// The shipped engine's constants. Anything not exposed below is hard-coded in
// index.html's Sound module and is the same on every level.
// ============================================================================
const SHIPPED = {
  // --- song ---
  seed: 0,               // 0 = derive from the level index, as the game does today
  scale: "pentaMajor",
  keyLock: 0, key: 0,    // keyLock 1 forces `key`; else the seed picks a transpose
  prog: -1,              // -1 = seed picks; 0..N forces one
  chordType: "auto",
  melodyLeap: 0.15,      // chance a step takes an extra jump
  melodyStart: -1,       // -1 = seed picks the opening degree
  // --- groove ---
  swing: 0,              // pushes every off-beat later, as a fraction of a beat
  beatsPerTile: 4,       // melody notes per cleared tile; only the 1st is the two-tone voice
  midVel: 0.42,          // level of the single-tone notes filling the gaps
  barLen: 4,             // beats per chord
  // How long ONE background note is held, in beats — independent of how fast the chords
  // move. Set it longer than barLen and the pad drones across a chord change, which is most
  // of what makes a backing sound vast rather than busy.
  bgEvery: 8,
  // What fraction of a background note is spent letting go of it. Everything before that is
  // held dead flat: the note arrives, sits there, and only moves when the next one is due.
  // A pad that decays across its own length is a struck sound pretending to be a held one.
  // Where the background gets its pitch. "chord" is the old behaviour — the triad, moving on
  // its own. "lead" takes whatever note the melody is on at the moment the background note
  // starts and holds THAT, so the two are singing the same thing. "leadChord" keeps the
  // melody note on top and fills the chord in underneath it.
  bgFollow: "lead",
  // --- layers ---
  leadOn: 1, padOn: 1, kickOn: 1, hatOn: 1, subOn: 1, offBassOn: 1,
  leadVel: 0.80, padVel: 0.14, kickVel: 0.70, hatVel: 0.12, subVel: 0.85, offBassVel: 0.42,
  leadOct: 0, padOct: -12,
  // --- tone ---
  master: 0.16, baseHz: 220,
  waveA: "sine", waveB: "sine",
  delayTime: 0.24, feedback: 0.34, damp: 2400, wet: 0.30,
  bassLpf: 340, kickHz: 130, kickDrop: 46, hatHz: 7000,
  // --- cosmic vox: a formant choir standing in for the sine pad ---
  // A pad made of sine tones is a pad. What makes something read as a VOICE is formants —
  // two or three fixed resonances that stay put while the pitch moves under them. So the
  // source here is a clutch of detuned saws, and the character comes from the bandpass bank
  // they run through, morphing between two vowels.
  voxOn: 0,                 // off in the shipped setting; the presets below switch it on
  voxStyle: "choir",        // choir | nebula | monolith | aurora
  voxVel: 0.20, voxOct: -12,
  voxVowel: 0.25,           // morph between the style's two vowels, 0..1
  voxVib: 5.2, voxVibDepth: 8,   // the wobble that stops it sounding like an organ
  voxSpread: 12,            // how far apart the singers are, cents
  voxShimmer: 0.25,         // an octave-up ghost — most of the "cosmic"
  // --- envelopes, one per instrument: attack / decay / sustain / release ---
  // A, D and R are SECONDS; S is the fraction of the peak the note settles back to and holds.
  // S at 1 means it never decays at all — which is what a background drone wants and what a
  // plucked lead very much does not.
  leadA: 0.008, leadD: 0.12, leadS: 0.35, leadR: 0.30,
  bgA:   0.006, bgD:   0.20, bgS:   1.00, bgR:   0.60,
  basA:  0.012, basD:  0.10, basS:  0.60, basR:  0.20,
  kickA: 0.005, kickD: 0.09, kickS: 0.02, kickR: 0.06,
  hatA:  0.003, hatD:  0.03, hatS:  0.01, hatR:  0.03,
  voxWet: 0.55,             // how much of it goes to the echo
  // --- heavy bass ---
  bassStyle: "classic",     // classic | deep | growl | rumble
  bassDrive: 0.30,          // waveshaper on the body, not the sub — the sub stays clean
  bassSubVel: 1.00,         // the pure sine you feel rather than hear
  bassFM: 1.50,             // growl only: modulator ratio
  bassGlide: 0.05,          // pitch dip into the note, seconds
};
// SHIPPED is what the game has today and never moves. BASE is the baseline you are working
// towards: "Save as defaults" pins the current settings there, level overrides are measured
// against it, and it is what the export prints as MUSIC_DEFAULTS. Kept apart so "reset to
// shipped" still has something true to go back to.
let BASE = {...SHIPPED};
let M = {...SHIPPED};

// Scales as semitone offsets. The game currently only knows the first one.
const SCALES = {
  pentaMajor:[0,2,4,7,9,12,14],       // the shipped sound: open, bright, no wrong notes
  pentaMinor:[0,3,5,7,10,12,15],      // instantly tense — the saw-level sound
  dorian:    [0,2,3,5,7,9,10,12],     // minor with a raised 6th: melancholy but not grim
  aeolian:   [0,2,3,5,7,8,10,12],     // natural minor, the darkest of these
  lydian:    [0,2,4,6,7,9,11,12],     // major with a #4: floaty, dreamlike
  hirajoshi: [0,2,3,7,8,12,14,15],    // Japanese pentatonic, very distinctive
  blues:     [0,3,5,6,7,10,12,15],
  wholeTone: [0,2,4,6,8,10,12,14],    // no home note at all — unsettling, use sparingly
};
const PROGS = [
  [0,5,7,5], [0,7,9,7], [0,5,9,7], [0,9,5,7], [0,4,5,7],   // the five the game ships
  [0,3,8,7], [0,10,5,7], [0,8,3,5], [0,0,5,5],             // minor-leaning + a static one
];
const CHORDS_T = {
  triad:[0,4,7], minor:[0,3,7], sus4:[0,5,7], sus2:[0,2,7],
  min7:[0,3,7,10], maj7:[0,4,7,11], add9:[0,4,7,14], fifth:[0,7],
};
const MINORISH = { pentaMinor:1, dorian:1, aeolian:1, blues:1, hirajoshi:1 };
function chordIvls(){
  if (M.chordType !== "auto") return CHORDS_T[M.chordType] || CHORDS_T.triad;
  return MINORISH[M.scale] ? CHORDS_T.minor : CHORDS_T.triad;
}

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

// The generator. With everything at shipped defaults and the same seed this
// makes byte-identical MELODY/CHORDS to index.html — same rnd() call order.
let MELODY=[], CHORDS=[], KEY=0, PROGUSED=0;
function buildSong(seed){
  const rnd = mulberry32((seed>>>0)||1);
  const SC = SCALES[M.scale] || SCALES.pentaMajor;
  const tr0 = [-5,-3,0,0,2,4,5,7][Math.floor(rnd()*8)];
  KEY = M.keyLock ? M.key : tr0;
  let d = M.melodyStart >= 0 ? M.melodyStart : 2 + Math.floor(rnd()*3);
  if (M.melodyStart >= 0) rnd();                       // keep the call order stable
  MELODY = [];
  for (let i=0;i<32;i++){
    d += Math.floor(rnd()*3)-1;
    if (rnd() < M.melodyLeap) d += Math.floor(rnd()*3)-1;
    d = Math.max(0, Math.min(SC.length-1, d));
    MELODY.push(SC[d] + KEY);
  }
  const pi = Math.floor(rnd()*5);
  PROGUSED = M.prog >= 0 ? (M.prog % PROGS.length) : pi;
  const iv = chordIvls();
  CHORDS = PROGS[PROGUSED].map(r => ({ root:r+KEY, tones: iv.map(x=>r+KEY+x) }));
}

// ============================================================================
// Audio — the same voices as the game, with the knobs above patched in
// ============================================================================
// The music's own output. In the lab it IS the master — there is nothing else playing. The
// game puts a gain here instead, so it can cut the backing (and its long sustains) dead at
// the end of a level without touching the sound effects.
let musicBus=null;
let ac=null, master=null, sendBus=null, noiseBuf=null, delayN=null, fbN=null, dampN=null, wetN=null;
function ensure(){
  if (ac) return true;
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
  ac = new AC();
  master = ac.createGain(); master.gain.value = M.master; master.connect(ac.destination);
  musicBus = master;
  delayN = ac.createDelay(1.0); delayN.delayTime.value = M.delayTime;
  fbN = ac.createGain(); fbN.gain.value = M.feedback;
  dampN = ac.createBiquadFilter(); dampN.type="lowpass"; dampN.frequency.value = M.damp;
  wetN = ac.createGain(); wetN.gain.value = M.wet;
  delayN.connect(dampN); dampN.connect(fbN); fbN.connect(delayN);
  delayN.connect(wetN); wetN.connect(master);
  sendBus = delayN;
  noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate*0.2), ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return true;
}
function applyTone(){
  if(!ac) return;
  master.gain.value = M.master;
  delayN.delayTime.value = M.delayTime;
  fbN.gain.value = Math.min(0.85, M.feedback);
  dampN.frequency.value = M.damp;
  wetN.gain.value = M.wet;
}
const hz = semi => M.baseHz * Math.pow(2, semi/12);

// One envelope shape for every instrument. Attack to the peak, decay to the sustain level,
// hold flat there for the length of the note, then release. Exponential ramps throughout,
// which is why nothing is ever allowed to reach zero — hence the 0.0001 floors.
const ENV = pre => ({ a:+M[pre+"A"], d:+M[pre+"D"], s:+M[pre+"S"], r:+M[pre+"R"] });
function adsr(g, t, dur, vel, E){
  const v = Math.max(0.0002, vel);
  let a = Math.max(0.002, E.a), d = Math.max(0.002, E.d), r = Math.max(0.004, E.r);
  // A sustain of zero is a struck voice: attack, then ONE decay that dies inside the note.
  // The decay is capped by the note rather than fixed, which is what makes a short note snap
  // and a long one ring — the same shape every voice in this game had before it had an
  // envelope at all. Release has nothing left to do, so it sits this case out.
  if (E.s <= 0.0005) {
    const aa = Math.min(a, dur*0.5), dd = Math.min(d, Math.max(0.004, dur - aa));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + aa);
    g.gain.exponentialRampToValueAtTime(0.0006, t + aa + dd);
    return aa + dd;
  }
  // An envelope has to fit inside its own note. Unclamped, a long decay made a SHORT note
  // ring on well past the next one — the notes filling the gaps between tile clears are a
  // fifth of a beat each, and a 0.9s tail on those is a smear, not a melody.
  const need = a + d + r;
  if (need > dur) { const k = dur / need; a *= k; d *= k; r *= k; }
  const sv = Math.max(0.0002, v * Math.min(1, Math.max(0, E.s)));
  const rel = Math.max(a + d, dur - r);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + a);
  g.gain.exponentialRampToValueAtTime(sv, t + Math.min(a + d, rel));
  g.gain.setValueAtTime(sv, t + rel);
  g.gain.exponentialRampToValueAtTime(0.0006, t + rel + r);
  return rel + r;                                     // how long the note actually runs for
}

function voice(t, semi, wave, dur, vel, pre, wet, mono){
  const g = ac.createGain();
  dur = adsr(g, t, dur, vel, ENV(pre || "lead"));
  // two detuned oscillators beat against each other and read as "thicker"; mono is one
  for (const cents of (mono ? [0] : [-6,6])){
    const o = ac.createOscillator(); o.type = wave;
    o.frequency.setValueAtTime(hz(semi), t); o.detune.setValueAtTime(cents, t);
    o.connect(g); o.start(t); o.stop(t+dur+0.05);
  }
  g.connect(master); if(wet) g.connect(sendBus);
}
function kick(t, vel){
  const o=ac.createOscillator(), g=ac.createGain();
  const E=ENV("kick"), dur=E.a+E.d+E.r;
  o.type="sine"; o.frequency.setValueAtTime(M.kickHz,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,M.kickDrop), t+Math.max(0.02,dur*0.7));
  adsr(g, t, dur, vel, E);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
function bass(t, semi, dur, vel){
  const f = hz(semi);
  const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=M.bassLpf; lp.Q.value=0.9;
  const g=ac.createGain();
  dur = adsr(g, t, dur, vel, ENV("bas"));
  const sub=ac.createOscillator(); sub.type="sine";
  sub.frequency.setValueAtTime(f*1.5,t); sub.frequency.exponentialRampToValueAtTime(f,t+0.06);
  const body=ac.createOscillator(); body.type="triangle"; body.frequency.setValueAtTime(f*2,t);
  const bg=ac.createGain(); bg.gain.value=0.45;
  sub.connect(g); body.connect(bg); bg.connect(g); g.connect(lp); lp.connect(master);
  sub.start(t); sub.stop(t+dur+0.05); body.start(t); body.stop(t+dur+0.05);
}
// Vowel formants: the first three resonances of the human vocal tract, and how loud each
// sits. These numbers are what the ear reads as "someone is singing".
const VOWELS = {
  ah: [[800,1150,2900],[1.00,0.50,0.25]],
  oo: [[325, 700,2530],[1.00,0.35,0.12]],
  oh: [[500,1000,2400],[1.00,0.45,0.18]],
  ee: [[270,2300,3000],[1.00,0.60,0.30]],
  eh: [[530,1850,2500],[1.00,0.55,0.22]],
};
const VOX_STYLES = {
  choir:    { vowels:["ah","oh"], wave:"sawtooth", voices:[-14,-5,5,14], oct:  0, q:7, sh:1.0 },
  nebula:   { vowels:["oo","ah"], wave:"sawtooth", voices:[-20,-7,7,20], oct:  0, q:5, sh:1.6 },
  monolith: { vowels:["oh","oo"], wave:"sawtooth", voices:[-9,-3,3,9],   oct:-12, q:9, sh:0.4 },
  aurora:   { vowels:["eh","ee"], wave:"triangle", voices:[-16,-6,6,16], oct: 12, q:6, sh:2.0 },
};
function voxVoice(t, semi, dur, vel){
  const S = VOX_STYLES[M.voxStyle] || VOX_STYLES.choir;
  const A = VOWELS[S.vowels[0]], B = VOWELS[S.vowels[1]], u = M.voxVowel;
  const f = hz(semi + S.oct);
  const out = ac.createGain();
  dur = adsr(out, t, dur, vel, ENV("bg"));
  out.connect(musicBus);
  if (M.voxWet > 0){ const w = ac.createGain(); w.gain.value = M.voxWet; out.connect(w); w.connect(sendBus); }

  // the singers, all sharing one vibrato so they breathe together rather than fight
  const raw = ac.createGain(); raw.gain.value = 1/(S.voices.length+1);
  const lfo = ac.createOscillator(); lfo.type="sine"; lfo.frequency.value = M.voxVib;
  const lfoG = ac.createGain(); lfoG.gain.value = M.voxVibDepth;
  lfo.connect(lfoG); lfo.start(t); lfo.stop(t+dur+0.1);
  const spread = M.voxSpread/14;
  for (const c of S.voices){
    const o = ac.createOscillator(); o.type = S.wave;
    o.frequency.setValueAtTime(f, t); o.detune.setValueAtTime(c*spread, t);
    lfoG.connect(o.detune);
    o.connect(raw); o.start(t); o.stop(t+dur+0.1);
  }
  if (M.voxShimmer > 0){                      // the octave-up ghost
    const o = ac.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(f*2, t);
    const g = ac.createGain(); g.gain.value = M.voxShimmer*S.sh*0.18;
    lfoG.connect(o.detune);
    o.connect(g); g.connect(raw); o.start(t); o.stop(t+dur+0.1);
  }
  for (let i=0;i<3;i++){                      // the formant bank — the voice itself
    const bp = ac.createBiquadFilter(); bp.type="bandpass";
    bp.frequency.value = A[0][i]*(1-u) + B[0][i]*u;
    bp.Q.value = S.q;
    const g = ac.createGain(); g.gain.value = A[1][i]*(1-u) + B[1][i]*u;
    raw.connect(bp); bp.connect(g); g.connect(out);
  }
  const body = ac.createGain(); body.gain.value = 0.18;   // a little raw tone underneath, or
  raw.connect(body); body.connect(out);                    // the formants sound hollow
}
// Soft clipping. Only the body goes through it — a driven sub turns to mud, and the sub is
// the part you are supposed to feel.
const _curves = {};
function driveCurve(amt){
  const k = Math.round(Math.max(0.001, amt)*80);
  if (_curves[k]) return _curves[k];
  const n = 1024, c = new Float32Array(n);
  for (let i=0;i<n;i++){ const x = i*2/n - 1; c[i] = (1+k)*x/(1+k*Math.abs(x)); }
  return (_curves[k] = c);
}
function bassHeavy(t, semi, dur, vel){
  const style = M.bassStyle, f = hz(semi);
  const out = ac.createGain();
  dur = adsr(out, t, dur, vel, ENV("bas"));
  const lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.Q.value = 1.1;
  lp.frequency.setValueAtTime(M.bassLpf*2.2, t);                       // a filter sweep down
  lp.frequency.exponentialRampToValueAtTime(Math.max(60, M.bassLpf), t+Math.max(0.05,dur*0.5));
  out.connect(lp); lp.connect(musicBus);
  const sub = ac.createOscillator(); sub.type="sine";
  sub.frequency.setValueAtTime(f*(1 + M.bassGlide*2), t);              // dips into pitch
  sub.frequency.exponentialRampToValueAtTime(f, t+Math.max(0.01, M.bassGlide));
  const sg = ac.createGain(); sg.gain.value = M.bassSubVel;
  sub.connect(sg); sg.connect(out); sub.start(t); sub.stop(t+dur+0.06);
  if (style !== "rumble"){
    const b = ac.createOscillator(); b.type = style==="growl" ? "square" : "sawtooth";
    b.frequency.setValueAtTime(f*2, t);
    if (style === "growl"){                                            // FM snarl
      const mod = ac.createOscillator(); mod.type="sine"; mod.frequency.value = f*M.bassFM;
      const mg = ac.createGain(); mg.gain.value = f*1.8;
      mod.connect(mg); mg.connect(b.frequency); mod.start(t); mod.stop(t+dur+0.06);
    }
    const sh = ac.createWaveShaper(); sh.curve = driveCurve(M.bassDrive); sh.oversample="2x";
    const bg = ac.createGain(); bg.gain.value = style==="deep" ? 0.55 : 0.42;
    b.connect(sh); sh.connect(bg); bg.connect(out); b.start(t); b.stop(t+dur+0.06);
  }
}
function hat(t, vel){
  const src=ac.createBufferSource(); src.buffer=noiseBuf;
  const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=M.hatHz;
  const g=ac.createGain();
  const E=ENV("hat"), dur=E.a+E.d+E.r;
  adsr(g, t, dur, vel, E);
  src.connect(hp); hp.connect(g); g.connect(master); src.start(t); src.stop(t+dur+0.03);
}

// The pitches the background sings. The lead's own note for beat `s` is the k=0 note of
// that beat, so following it is a matter of reading the same index out of the same melody —
// not of guessing at something that merely fits the chord.
function bgNotes(s, chord){
  if (M.bgFollow === "chord") return chord.tones;
  // "melody" walks the tune at the background's own pace — one melody note per background
  // note. "lead" reads the note the melody is actually on at that instant, which is the
  // literal match but can land on the same note every time: the tune loops every
  // MELODY.length/beatsPerTile beats (8, as shipped), so any bgEvery that is a multiple of
  // that samples the same point of the loop forever. That is a drone, which may well be what
  // you want under a melody — but it is worth knowing which one you have chosen.
  const idx = M.bgFollow === "melody"
    ? Math.floor(s / Math.max(1, M.bgEvery|0))
    : s * M.beatsPerTile;
  const lead = MELODY[((idx % MELODY.length) + MELODY.length) % MELODY.length];
  if (M.bgFollow === "lead" || M.bgFollow === "melody") return [lead];
  const out = [lead];                                    // leadChord: melody on top, chord under
  for (const tn of chord.tones) if ((((tn - lead) % 12) + 12) % 12 !== 0) out.push(tn);
  return out;
}

// One beat == one cleared tile in the game. Everything here mirrors clearTile().
let step = 0;
function beatAt(t, s){
  const beatSec = beatLen();
  const sw = beatSec * (0.5 + M.swing);                  // where the off-beat lands
  const chord = CHORDS[Math.floor(s / M.barLen) % CHORDS.length];
  // Only the cleared-tile downbeat gets the full two-tone voice. Everything filling
  // the gap is a single oscillator at midVel, so the clear still reads as the beat.
  const wave = s%2 ? M.waveB : M.waveA;
  for (let k = 0; k < M.beatsPerTile; k++){
    if (!M.leadOn) break;
    const idx = (s * M.beatsPerTile + k) % MELODY.length;
    if (k === 0) voice(t, MELODY[idx] + M.leadOct, wave, 0.9, M.leadVel, "lead", true);
    else voice(t + beatSec*(k/M.beatsPerTile), MELODY[idx] + M.leadOct, wave,
               beatSec*(0.9/M.beatsPerTile), M.midVel, "lead", true, true);
  }
  const lowVoice = M.bassStyle === "classic" ? bass : bassHeavy;
  if (M.subOn){
    if (M.bassStyle === "classic")
      voice(t, chord.root-12, "triangle", beatSec*0.9, M.subVel*0.47, "bas", false);
    lowVoice(t, chord.root-24, beatSec*(M.bassStyle==="classic"?0.92:0.96), M.subVel);
  }
  if (M.offBassOn) lowVoice(t + sw, chord.root-24+7, beatSec*0.42, M.offBassVel);
  if (M.kickOn) kick(t, M.kickVel);
  if (M.hatOn)  hat(t + sw, M.hatVel);
  const bgEvery = Math.max(1, M.bgEvery|0);
  if ((M.padOn || M.voxOn) && s % bgEvery === 0){
    const notes = bgNotes(s, chord);
    for (const semi of notes){
      if (M.padOn) voice(t, semi + M.padOct, "sine", beatSec*(bgEvery-0.1), M.padVel, "bg", true);
      if (M.voxOn) voxVoice(t, semi + M.voxOct, beatSec*(bgEvery-0.05), M.voxVel);
    }
  }
}

// ---- transport: a lookahead scheduler on the audio clock ----
const beatLen = () => Math.max(0.15, 1 / (+$("cps").value || 1));
let playing=false, nextT=0, timer=null;
function tick(){
  if(!playing) return;
  while (nextT < ac.currentTime + 0.15){
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.02;
    beatAt(nextT, step);
    lastBeat = { s: step, t: nextT };
    step++; nextT += beatLen();
  }
}
let lastBeat = null;
function start(){
  if(!ensure()) return;
  if(ac.state !== "running") ac.resume();
  applyTone();
  playing = true; step = 0; nextT = ac.currentTime + 0.06;
  $("play").textContent = "■ Stop"; $("play").classList.remove("prim");
  clearInterval(timer); timer = setInterval(tick, 25); tick();
}
function stop(){
  playing = false; clearInterval(timer); lastBeat = null;
  $("play").textContent = "▶ Play"; $("play").classList.add("prim");
}
const $ = id => document.getElementById(id);
$("play").onclick = () => playing ? stop() : start();

// ============================================================================
// Piano roll — the 16-step melody over the chord bars, with a playhead
// ============================================================================
const roll = $("roll"), rg = roll.getContext("2d");
function drawRoll(){
  const W=roll.width, H=roll.height, padL=34, padB=22, padT=26;
  rg.clearRect(0,0,W,H);
  const all = MELODY.concat(CHORDS.flatMap(c=>c.tones.map(t=>t+M.padOct)));
  const lo = Math.min(...all)-2, hi = Math.max(...all)+2, span = Math.max(6, hi-lo);
  const N = MELODY.length;
  const colW = (W-padL-8)/N, rowH = (H-padT-padB)/span;
  const yOf = s => padT + (hi - s)*rowH;
  // chord bands
  for(let b=0;b<Math.ceil(N/(M.barLen*M.beatsPerTile));b++){
    const c = CHORDS[b % CHORDS.length]; if(!c) continue;
    const bw = M.barLen*M.beatsPerTile*colW;
    const x = padL + b*bw, w = Math.min(bw, W-8-x);
    if (w <= 0) continue;
    rg.fillStyle = b%2 ? "rgba(125,208,255,0.05)" : "rgba(125,208,255,0.09)";
    rg.fillRect(x, padT, w, H-padT-padB);
    for(const t of c.tones){
      rg.fillStyle="rgba(199,125,255,0.34)";
      rg.fillRect(x+1, yOf(t+M.padOct)-rowH*0.42, w-2, Math.max(2,rowH*0.84));
    }
    rg.fillStyle="rgba(207,233,255,0.5)"; rg.font="10px ui-monospace,monospace";
    rg.fillText(noteName(c.root), x+3, padT-8);
  }
  // grid
  rg.strokeStyle="rgba(43,40,80,0.9)"; rg.lineWidth=1;
  for(let i=0;i<=N;i+=M.beatsPerTile){ const x=padL+i*colW; rg.beginPath(); rg.moveTo(x,padT); rg.lineTo(x,H-padB); rg.stroke(); }
  // melody blocks
  for(let i=0;i<MELODY.length;i++){
    const x=padL+i*colW, y=yOf(MELODY[i]+M.leadOct);
    const down = i % M.beatsPerTile === 0;            // a cleared tile — the two-tone note
    const here = lastBeat && ((lastBeat.s*M.beatsPerTile) % N) === i;
    rg.fillStyle = here ? "#ffd24a" : (down ? "#7dd0ff" : "rgba(125,208,255,0.42)");
    rg.fillRect(x+1, y-rowH*(down?0.46:0.32), Math.max(2,colW-2), Math.max(2,rowH*(down?0.92:0.64)));
  }
  // axis
  rg.fillStyle="rgba(207,233,255,0.45)"; rg.font="9px ui-monospace,monospace";
  rg.fillText(noteName(hi), 3, yOf(hi)+3); rg.fillText(noteName(lo), 3, yOf(lo)+3);
  rg.fillText("tile 1", padL, H-7);
  const cap = M.scale+" · key "+noteName(KEY)+" · prog "+PROGUSED+" · "
            + (M.chordType==="auto" ? (MINORISH[M.scale]?"minor":"triad") : M.chordType)
            + (M.swing?" · swing "+M.swing.toFixed(2):"")
            + (M.beatsPerTile>1?" · "+M.beatsPerTile+"×":"");
  rg.fillStyle="rgba(255,210,74,0.75)"; rg.textAlign="right";
  rg.fillText(cap, W-6, H-7); rg.textAlign="left";
}
const NAMES=["A","A#","B","C","C#","D","D#","E","F","F#","G","G#"];
function noteName(s){ const n=((s%12)+12)%12; return NAMES[n]+(3+Math.floor((s+ (s<0?-11:0))/12)); }

function frame(){
  if(playing && lastBeat) $("beat").textContent = "tile "+(lastBeat.s%(MELODY.length/M.beatsPerTile)+1)+"/"+(MELODY.length/M.beatsPerTile)+" · bar "+(Math.floor(lastBeat.s/M.barLen)%CHORDS.length+1);
  else $("beat").textContent = (60/beatLen()).toFixed(0)+" bpm";
  drawRoll();
  requestAnimationFrame(frame);
}

// One envelope editor: the shape drawn above four sliders, so the numbers mean something
// before you have heard them. A/D/R are seconds on a fixed 1.2s window; S is a level.
const envRedraw = [];
function buildEnv(panel, pre, label){
  const wrap=document.createElement("div"); wrap.className="env";
  const cap=document.createElement("div"); cap.className="group"; cap.textContent=label;
  panel.appendChild(cap); panel.appendChild(wrap);
  const cvs=document.createElement("canvas"); cvs.width=600; cvs.height=104; wrap.appendChild(cvs);
  const grid=document.createElement("div"); grid.className="adsr"; wrap.appendChild(grid);
  const FIELDS=[["A","A",0.002,0.60,0.002],["D","D",0.002,1.20,0.002],
                ["S","S",0,1,0.01],["R","R",0.004,1.50,0.004]];
  const vals={};
  for(const [suf,lab,mn,mx,st] of FIELDS){
    const key=pre+suf;
    const d=document.createElement("div");
    d.innerHTML='<label>'+lab+'</label><input type="range" id="i_'+key+'" min="'+mn+'" max="'+mx+
                '" step="'+st+'" value="'+M[key]+'"><span class="v" id="v_'+key+'"></span>';
    grid.appendChild(d);
    const inp=d.querySelector("input");
    inp.oninput=()=>{ M[key]=+inp.value; draw(); refresh(); };
    vals[suf]=d.querySelector(".v");
  }
  const g=cvs.getContext("2d");
  function draw(){
    const W=cvs.width, H=cvs.height, PADX=8, PADY=10;
    const E=ENV(pre);
    for(const [suf] of FIELDS) vals[suf].textContent = (+M[pre+suf]).toFixed(suf==="S"?2:3);
    g.clearRect(0,0,W,H);
    g.strokeStyle="#2b2850"; g.lineWidth=1;
    g.beginPath(); g.moveTo(PADX,H-PADY); g.lineTo(W-PADX,H-PADY); g.stroke();
    const SPAN=1.2, sus=0.30;                       // seconds of A+D shown, then a fixed sustain
    const x=sec=>PADX+(W-PADX*2)*Math.min(1,sec/(SPAN+sus+1.5));
    const y=lvl=>H-PADY-(H-PADY*2)*Math.max(0,Math.min(1,lvl));
    const tA=E.a, tD=tA+E.d, tS=tD+sus, tR=tS+E.r;
    g.strokeStyle="#7dd0ff"; g.lineWidth=2; g.beginPath();
    g.moveTo(x(0),y(0)); g.lineTo(x(tA),y(1)); g.lineTo(x(tD),y(E.s));
    g.lineTo(x(tS),y(E.s)); g.lineTo(x(tR),y(0)); g.stroke();
    g.fillStyle="rgba(125,208,255,0.12)"; g.lineTo(x(tR),y(0)); g.lineTo(x(0),y(0)); g.fill();
    g.fillStyle="#6f68a8"; g.font="10px ui-monospace,monospace";
    g.fillText("sustain", x(tD)+4, y(E.s)-4);
  }
  envRedraw.push(draw); draw();
}

function buildPanel(SPEC, panel){
for(const row of SPEC){
  const kind=row[0];
  if(kind==="group"){ const d=document.createElement("div"); d.className="group"; d.textContent=row[1]; panel.appendChild(d); continue; }
  if(kind==="env"){ buildEnv(panel, row[1], row[2]); continue; }
  if(kind==="presets"){
    const d=document.createElement("div"); d.className="togs";
    for(const name of row[2]){
      const b=document.createElement("button"); b.className="act"; b.dataset.backing=name; b.textContent=name;
      b.onclick=()=>applyBacking(name);
      d.appendChild(b);
    }
    panel.appendChild(d); continue;
  }
  if(kind==="togrow"){
    const d=document.createElement("div"); d.className="togs";
    for(let i=1;i<row.length;i+=2){
      const k=row[i], lab=row[i+1];
      const b=document.createElement("button"); b.className="act"+(M[k]?" on":""); b.id="i_"+k; b.textContent=lab;
      b.onclick=()=>{ M[k]=M[k]?0:1; b.classList.toggle("on",!!M[k]); refresh(); };
      d.appendChild(b);
    }
    panel.appendChild(d); continue;
  }
  const key=row[1], label=row[2];
  if(kind==="num"){
    const [,,,min,max,stp]=row;
    const d=document.createElement("div"); d.className="sl";
    d.innerHTML='<label>'+label+'</label><input type="range" id="i_'+key+'" min="'+min+'" max="'+max+'" step="'+stp+'" value="'+M[key]+'"><span class="val" id="v_'+key+'"></span>';
    panel.appendChild(d);
    const inp=d.querySelector("input"), val=d.querySelector(".val");
    const show=()=>val.textContent = stp>=1 ? M[key] : (+M[key]).toFixed(3);
    inp.oninput=()=>{ M[key]=+inp.value; show(); refresh(); }; show();
  } else if(kind==="pick"){
    const fmt=row[4]||(v=>v);
    const d=document.createElement("div"); d.className="rowline";
    d.innerHTML='<label style="width:92px">'+label+'</label><select id="i_'+key+'">'+
      row[3].map(o=>'<option value="'+o+'">'+fmt(o)+'</option>').join("")+'</select>';
    panel.appendChild(d);
    const sel=d.querySelector("select"); sel.value=M[key];
    sel.onchange=e=>{ const v=e.target.value; M[key] = isNaN(+v)||v==="" ? v : +v; refresh(); };
  } else if(kind==="tog"){
    const d=document.createElement("div"); d.className="rowline";
    d.innerHTML='<button class="act'+(M[key]?" on":"")+'" id="i_'+key+'">'+label+'</button>';
    panel.appendChild(d);
    const b=d.querySelector("button");
    b.onclick=()=>{ M[key]=M[key]?0:1; b.classList.toggle("on",!!M[key]); refresh(); };
  }
}
}

function syncUI(){
  for(const [SPEC] of PANELS)
  for(const row of SPEC){
    if(row[0]==="group" || row[0]==="presets") continue;
    if(row[0]==="env"){
      for(const suf of ["A","D","S","R"]){ const el=$("i_"+row[1]+suf); if(el) el.value=M[row[1]+suf]; }
      continue;
    }
    if(row[0]==="togrow"){ for(let i=1;i<row.length;i+=2){ const el=$("i_"+row[i]); if(el) el.classList.toggle("on",!!M[row[i]]); } continue; }
    const key=row[1], el=$("i_"+key); if(!el) continue;
    if(row[0]==="tog") el.classList.toggle("on",!!M[key]);
    else el.value=M[key];
    if(row[0]==="num") $("v_"+key).textContent = row[5]>=1 ? M[key] : (+M[key]).toFixed(3);
  }
  $("seed").value = M.seed || curSeed();
  for(const fn of envRedraw) fn();
}

// ============================================================================
// Per-level overrides
// ============================================================================
const LSKEY="tilerunner:music";
let overrides = {}, curLevel = 1;
try{ const raw=localStorage.getItem(LSKEY);
     if(raw){ const d=JSON.parse(raw); overrides=d.overrides||{};
              if(d.BASE) BASE={...SHIPPED,...d.BASE};
              if(d.M) M={...BASE,...d.M}; if(d.level) curLevel=d.level; } }catch(e){}
let saveT=0, savedT=0;
function persist(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ try{
    localStorage.setItem(LSKEY, JSON.stringify({overrides, M, BASE, level:curLevel}));
    const p=$("saved"); p.style.opacity="1"; clearTimeout(savedT);
    savedT=setTimeout(()=>p.style.opacity="0.35",900);
  }catch(e){} },200);
}
// The game seeds each level's song with hashSeed(String(levelIndex + 1)) — the same
// FNV-1a it uses for the background theme. Mirror it exactly, or "seeded" here plays
// a different tune to the one that actually ships.
function hashSeed(str){ let h=2166136261; str=String(str);
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
const curSeed = () => M.seed || hashSeed(String(curLevel));

const LEVEL_CPS=[0.8,0.8,0.8,0.84,0.84,0.84,0.84,0.88,0.88,0.88,0.88,0.91,0.91,0.91,0.94,0.94,0.97,0.97,1,1,1,1,1,0.8];
const lvSel=$("lv");
LEVEL_CPS.forEach((c,i)=>{ const o=document.createElement("option"); o.value=i+1; o.textContent="L"+(i+1)+"  ("+c+")"; lvSel.appendChild(o); });
function loadLevel(n){
  curLevel=+n; lvSel.value=n; $("cps").value=LEVEL_CPS[n-1];
  M = {...BASE, ...(overrides[n]||{})};
  syncUI(); refresh();
}
lvSel.onchange=e=>loadLevel(e.target.value);
$("cps").oninput=()=>refresh();
$("savelv").onclick=()=>{
  const diff={}; for(const k in M) if(M[k]!==BASE[k]) diff[k]=M[k];
  if(Object.keys(diff).length) overrides[curLevel]=diff; else delete overrides[curLevel];
  drawTable(); refresh();
};
$("clearlv").onclick=()=>{ delete overrides[curLevel]; loadLevel(curLevel); drawTable(); };
$("clearall").onclick=()=>{ overrides={}; loadLevel(curLevel); drawTable(); };
$("dice").onclick=()=>{ M.seed = 1+Math.floor(Math.random()*99999); $("seed").value=M.seed; refresh(); };
$("seed").oninput=e=>{ M.seed=+e.target.value||0; refresh(); };

function drawTable(){
  const rows=Object.keys(overrides).sort((a,b)=>a-b);
  $("lvtab").innerHTML = "<tr><th>level</th><th>overrides</th></tr>" + (rows.length
    ? rows.map(n=>'<tr class="has"><td>L'+n+'</td><td>'+Object.entries(overrides[n]).map(([k,v])=>k+":"+v).join(", ")+'</td></tr>').join("")
    : '<tr><td colspan="2" style="opacity:.4">no per-level overrides yet — tune, then “Save for this level”</td></tr>');
}

function exportText(){
  const defs={}; for(const k in M) if(M[k]!==BASE[k]) defs[k]=M[k];
  return "// paste over MUSIC_DEFAULTS in index.html\nconst MUSIC_DEFAULTS = "
    + JSON.stringify(BASE,null,2).replace(/"(\w+)":/g,'$1:') + ";\n\n"
    + "// per-level: add `music: {...}` to the level object in levels.js\n"
    + (Object.keys(overrides).length
        ? Object.keys(overrides).sort((a,b)=>a-b).map(n=>"L"+n+"  music: "+JSON.stringify(overrides[n])).join("\n")
        : "(none)")
    + "\n\n// this level, live:\nmusic: " + JSON.stringify(defs);
}
function refresh(){
  buildSong(curSeed());
  applyTone();
  $("seedinfo").textContent = "seed "+curSeed()+(M.seed?" (pinned)":" (from level)");
  $("out").value = exportText();
  persist();
}
// ---------------------------------------------------------------------------
// Writing straight into the game
// ---------------------------------------------------------------------------
// The same File System Access route the level editor uses: pick index.html once, and every
// save after that rewrites its MUSIC_DEFAULTS block in place. This SPLICES — it reads the
// file, replaces one block and writes the rest back byte for byte — because regenerating
// index.html from a browser page is not a thing anyone should be doing.
const FS_OK = typeof window.showOpenFilePicker === "function";
let gameHandle = null;
function idb(){ return new Promise((res,rej)=>{ const q=indexedDB.open("tilerunner_music",1);
  q.onupgradeneeded=()=>q.result.createObjectStore("kv"); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
function idbGet(k){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction("kv","readonly").objectStore("kv").get(k);
  t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); })).catch(()=>null); }
function idbSet(k,v){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite").objectStore("kv").put(v,k);
  t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); })).catch(()=>{}); }
async function grant(h){
  if(!h) return false;
  let p = await h.queryPermission({mode:"readwrite"});
  if(p !== "granted") p = await h.requestPermission({mode:"readwrite"});
  return p === "granted";
}
// Find the block by counting braces rather than by matching to the first "};" — a nested
// object in there would end the match early and the splice would eat the rest of the file.
function spliceDefaults(src, text){
  const marker = "const MUSIC_DEFAULTS = {";
  const hits = src.split(marker).length - 1;
  if (hits !== 1) return { err: "expected exactly one MUSIC_DEFAULTS in index.html, found " + hits };
  const i = src.indexOf(marker);
  const lineStart = src.lastIndexOf("\n", i) + 1;
  const indent = src.slice(lineStart, i);
  let k = src.indexOf("{", i), depth = 0, end = -1, inStr = false, q = "";
  for (; k < src.length; k++){
    const ch = src[k];
    if (inStr){ if (ch === "\\") k++; else if (ch === q) inStr = false; continue; }
    if (ch === '"' || ch === "'"){ inStr = true; q = ch; continue; }
    if (ch === "{") depth++;
    else if (ch === "}"){ if (--depth === 0){ end = k; break; } }
  }
  if (end < 0) return { err: "MUSIC_DEFAULTS block is not closed — refusing to write" };
  const semi = src.indexOf(";", end);
  if (semi < 0 || semi > end + 3) return { err: "no ; after MUSIC_DEFAULTS — refusing to write" };
  const body = text.replace(/\n/g, "\n" + indent);
  return { out: src.slice(0, lineStart) + indent + "const MUSIC_DEFAULTS = " + body + ";" + src.slice(semi+1) };
}
async function pickGame(){
  if(!FS_OK){ setSaveMsg("this browser can't write files directly — use Copy"); return null; }
  try{
    [gameHandle] = await window.showOpenFilePicker({
      types:[{description:"HTML", accept:{"text/html":[".html"]}}] });
    await idbSet("gameHandle", gameHandle);
    setSaveMsg("target set — " + gameHandle.name);
    return gameHandle;
  }catch(e){ if(e && e.name==="AbortError") return null; setSaveMsg("couldn't set target: "+e.message); return null; }
}
function setSaveMsg(t){ const b=$("tofile"); b.textContent=t; setTimeout(()=>b.textContent="Save to game", 2200); }
async function saveToGame(){
  if(!FS_OK){ setSaveMsg("this browser can't write files — use Copy"); return; }
  try{
    if(!gameHandle) gameHandle = await pickGame();
    if(!gameHandle) return;
    if(!await grant(gameHandle)){ setSaveMsg("permission denied — press again"); return; }
    const src = await (await gameHandle.getFile()).text();
    if(!/MUSIC_DEFAULTS/.test(src)){ setSaveMsg("that file has no MUSIC_DEFAULTS"); return; }
    const body = JSON.stringify(BASE,null,2).replace(/"(\w+)":/g,'$1:');
    const r = spliceDefaults(src, body);
    if(r.err){ setSaveMsg(r.err); return; }
    const ws = await gameHandle.createWritable();
    await ws.write(r.out); await ws.close();
    setSaveMsg("wrote " + Object.keys(BASE).length + " settings to " + gameHandle.name);
  }catch(e){ if(e && e.name==="AbortError") return; setSaveMsg("save failed: "+e.message); }
}
$("tofile").onclick=saveToGame;
$("pickfile").onclick=async()=>{ await pickGame(); };
if(!FS_OK){ $("tofile").disabled=true; $("pickfile").disabled=true; $("pickfile").title="needs a Chromium browser"; }
idbGet("gameHandle").then(h=>{ if(h){ gameHandle=h; $("tofile").title="writes into "+h.name; } });

$("copy").onclick=()=>{ $("out").select(); document.execCommand("copy");
  $("copy").textContent="Copied!"; setTimeout(()=>$("copy").textContent="Copy",1000); };
$("paste").onclick=()=>{ try{ M={...BASE, ...JSON.parse($("out").value)}; syncUI(); refresh(); }
  catch(_){ $("paste").textContent="Bad JSON"; setTimeout(()=>$("paste").textContent="Load from box",1200); } };
$("reset").onclick=()=>{ M={...BASE}; syncUI(); refresh(); };
// Pin everything on screen as the new baseline. Any level override that only said what the
// baseline now says stops being an override at all — otherwise the table fills up with rows
// that change nothing.
$("savedef").onclick=()=>{
  BASE={...M};
  for(const n of Object.keys(overrides)){
    const d={}; for(const k in overrides[n]) if(overrides[n][k]!==BASE[k]) d[k]=overrides[n][k];
    if(Object.keys(d).length) overrides[n]=d; else delete overrides[n];
  }
  drawTable(); refresh();
  const b=$("savedef"); b.textContent="Saved as defaults";
  setTimeout(()=>b.textContent="Save as defaults",1200);
};
$("revertdef").onclick=()=>{ BASE={...SHIPPED}; M={...SHIPPED}; syncUI(); drawTable(); refresh(); };

$("notes").innerHTML = [
  "<b>One cleared tile is one beat.</b> The game never runs a music clock — every note is fired by a real tile event, ",
  "so tempo <i>is</i> the runner's pace and can never drift. That is why <b>pace</b> here is per level and read-only-ish: ",
  "it comes from the level's <code>cps</code>.<br><br>",
  "<b>The three big levers</b>, roughly in order of how much they change the feel:<br>",
  "· <b>scale</b> — pentaMajor is the shipped, can't-sound-wrong sound. pentaMinor or aeolian instantly reads as danger; ",
  "hirajoshi reads as somewhere else entirely. This is the one to vary by chapter, not by level.<br>",
  "· <b>layers</b> — dropping the pad makes a level feel exposed and tense; dropping the kick makes it float. ",
  "Cheaper and more legible than changing notes.<br>",
  "· <b>swing</b> — pushes the off-beat hat and bass later. Even 0.06 stops it sounding like a machine.<br><br>",
  "<b>notes / tile</b> is the one that decouples music from movement: at 2 the melody double-times without the runner ",
  "speeding up, so late fast levels don't all sound the same tempo.<br><br>",
  "<b>seed</b> picks the melody and progression. Dice until a phrase you like, then it is pinned in the export; ",
  "leave it 0 and each level derives its own, as today."
].join("");

drawTable(); loadLevel(curLevel); syncUI(); refresh(); frame();
</script>
</body>
</html>
